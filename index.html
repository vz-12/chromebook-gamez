      ringFx(s.x, s.y, 6, 60, CROWD_COL, 0.4, 3);
    }
    if (T.turned >= TRI_SEATS && !T.hal) {
      triSay('. . . where are you going.', 3.4);
      startHalberd(T);
    }
    return;
  }

  /* The turn itself. Nothing to do with damage: how low you are willing to be
     while the door is open and you are not walking through it. */
  const hurt = 1 - clamp(P.hp / P.maxHp, 0, 1);
  if (hurt > 0.25) {
    T.acc = (T.acc || 0) + dt * TRI_TURN * hurt;
    while (T.acc >= 1) {
      T.acc -= 1;
      const s = T.seats.find(z => !z.turned && z.hard <= 0);
      if (!s) break;
      s.turned = true; s.look = 1; T.turned++;
      ringFx(s.x, s.y, 6, 64, CROWD_COL, 0.45, 3);
      Audio_.tone(700 + T.turned * 12, 0.05, 'sine', 0.04, 900);
      if (T.turned === 1) triSay('. . . sit back down.', 3.4);
    }
  }
  if (T.turned >= TRI_SEATS && !T.hal) {
    triSay('. . . where are you going.', 3.4);
    startHalberd(T);
    return;
  }

  // he gestures; the room does it
  for (const s of T.seats) s.hush = Math.max(0, (s.hush || 0) - dt);
  triHeckle(T, dt);
  triMoveTick(T, dt);
  T.atkT -= dt;
  if (T.atkT <= 0 && !T.move) triStartMove(T);
}

/* The camp with the chairs turned round. Same plate hardware, same firelight,
   same people — but banked into stands and all of it pointed at the floor you
   are standing on, which is the whole reveal: this was always a room with a
   front of it.

   Every tier is a real bench with a real riser, and the crowd sit ON them at
   the size they were round the fire. A seat that turns does not change colour
   and stay put — it turns its back, and the bench under it goes dark, so the
   stand empties visibly from wherever you earned it. */
function drawTribunal() {
  if (!tribunal) return;
  const T = tribunal;
  if (!T.over) drawTriTells(T);      // the slow ones have to be readable first
  if (T.hal) halDraw(T);
  const th = T.throne;
  const cols = 8;
  const colW = T.seats.length > 1 ? Math.abs(T.seats[1].x - T.seats[0].x) : 72;
  const rowH = T.seats.length > 8 ? Math.abs(T.seats[8].y - T.seats[0].y) : 52;
  const rows = Math.ceil(T.seats.length / cols);
  const halfW = colW * (cols / 2 + 0.6);
  const fs = Math.min(colW * 0.5, rowH * 0.62);

  ctx.save();

  /* The stands. Drawn back to front so the near riser occludes the feet of the
     row behind it and the bank reads as depth rather than as a grid. */
  for (let r = rows - 1; r >= 0; r--) {
    const y = T.seats[r * cols] ? T.seats[r * cols].y : th.y - rowH * (r + 1);
    const inset = halfW - r * colW * 0.16;
    const live = T.seats.filter(s => s.row === r && !s.turned).length;
    const lit = live / cols;
    // the riser face
    ctx.fillStyle = rgba('#150d02', 0.95);
    ctx.strokeStyle = rgba(CAMP_EMBER, 0.16 + lit * 0.3);
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(th.x - inset, y + rowH * 0.34);
    ctx.lineTo(th.x - inset + colW * 0.16, y + rowH * 0.62);
    ctx.lineTo(th.x + inset - colW * 0.16, y + rowH * 0.62);
    ctx.lineTo(th.x + inset, y + rowH * 0.34);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // the bench top, lit only where he still has somebody sitting on it
    ctx.strokeStyle = rgba(CROWD_COL, 0.1 + lit * 0.45);
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(th.x - inset, y + rowH * 0.34);
    ctx.lineTo(th.x + inset, y + rowH * 0.34);
    ctx.stroke();
    // and the people on it
    for (const s of T.seats) {
      if (s.row !== r) continue;
      s.look = Math.max(0, s.look - 0.02);
      const held = !s.turned;
      const gy = y + rowH * 0.34 - fs * 1.1;
      if (held) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        drawGlow(s.x, gy, fs * 1.5, CROWD_COL, s.hard > 0 ? 0.3 : 0.14);
        ctx.restore();
      }
      // the one just turned gets a beat of white before it goes grey
      if (s.look > 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        drawGlow(s.x, gy, fs * 2.2 * s.look, '#ffffff', 0.4 * s.look);
        ctx.restore();
      }
      crowdFigure(s.x, y + rowH * 0.34 - fs * 0.82, fs, held, s.hard, held ? 1 : 0.5);
    }
  }

  /* The seat. Not a rectangle — a chair built out of the amalgam: the chassis
     plates he was inside are the back of it, and he is sitting in the hole
     they came off. It is taller than everything and it is the only thing in
     the room still properly lit. */
  const ts = Math.max(38, Math.min(colW * 0.62, rowH * 0.78));
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(th.x, th.y, ts * (T.stood ? 3.4 : 2.6), FOUND_COL, T.over ? 0.12 : 0.28);
  ctx.restore();

  // the fan of plates behind him, unmistakably the machine he came out of
  ctx.save();
  ctx.translate(th.x, th.y);
  for (let k = -3; k <= 3; k++) {
    const a = k * 0.19;
    ctx.save();
    ctx.rotate(a);
    ctx.fillStyle = rgba('#150d02', 0.95);
    ctx.strokeStyle = rgba(AMAL_COL, T.over ? 0.18 : 0.4);
    ctx.lineWidth = 1.6;
    roundRect(-ts * 0.15, -ts * 1.62, ts * 0.3, ts * 1.05, ts * 0.05);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  // the chair
  ctx.fillStyle = rgba('#1c1203', 0.96);
  ctx.strokeStyle = rgba(FOUND_COL, T.over ? 0.35 : 0.9);
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(th.x - ts * 0.86, th.y + ts * 0.86);
  ctx.lineTo(th.x - ts * 0.66, th.y - ts * 1.04);
  ctx.lineTo(th.x + ts * 0.66, th.y - ts * 1.04);
  ctx.lineTo(th.x + ts * 0.86, th.y + ts * 0.86);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // armrests, hex-plated
  for (const sx of [-1, 1]) {
    poly(th.x + sx * ts * 0.8, th.y + ts * 0.06, ts * 0.19, 6, Math.PI / 6);
    ctx.fillStyle = rgba(FOUND_COL, 0.16); ctx.strokeStyle = rgba(FOUND_COL, T.over ? 0.3 : 0.7);
    ctx.lineWidth = 2; ctx.fill(); ctx.stroke();
  }

  // and him in it — standing exactly once, and never coming down off the dais
  founderFigure(th.x, th.y - (T.stood ? ts * 0.34 : ts * 0.04), ts * 0.86, {
    sit: T.stood ? 0.1 : 0.92,
    open: T.over ? 0 : (T.ranksT > 0 ? 0.9 : 0.25),
    a: T.over ? 0.5 : 1
  });

  // the count, and him
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = "700 10px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.letterSpacing = '0.2em';
  const cw2 = T.seats.length > 1 ? Math.abs(T.seats[1].x - T.seats[0].x) : 72;
  const rh2 = T.seats.length > 8 ? Math.abs(T.seats[8].y - T.seats[0].y) : 52;
  const ts2 = Math.max(38, Math.min(cw2 * 0.62, rh2 * 0.78));
  ctx.fillStyle = rgba(FOUND_COL, 0.8);
  ctx.fillText('THE FOUNDER', th.x, th.y + ts2 * 1.5);
  ctx.font = "600 11px 'JetBrains Mono', ui-monospace, monospace";
  ctx.letterSpacing = '0em';
  ctx.fillStyle = rgba(CROWD_COL, 0.75);
  ctx.fillText((TRI_SEATS - T.turned) + ' / ' + TRI_SEATS + '  STILL HIS', th.x, th.y + ts2 * 1.86);
  if (T.sayT > 0) {
    ctx.font = '400 ' + Math.min(19, Math.max(13, W * 0.016)) +
               "px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = rgba(FOUND_COL, clamp(T.sayT, 0, 1) * 0.92);
    ctx.fillText(T.say, W / 2, H - 96);
  }
  if (T.ranksT > 0) {
    ctx.font = "700 12px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.letterSpacing = '0.22em';
    ctx.fillStyle = rgba('#f87171', 0.9);
    ctx.fillText('CLOSING RANKS', W / 2, 78);
  } else if (P.hp / P.maxHp > 0.75 && !T.over) {
    ctx.font = "700 11px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.letterSpacing = '0.2em';
    ctx.fillStyle = 'rgba(148,163,184,0.6)';
    ctx.fillText('THEY ARE NOT WATCHING YOU', W / 2, 78);
  }
  ctx.restore();
}

/* ------------------------------ portal room -------------------------------
   Once THE FRACTURE is open, stages no longer advance on a timer. Two gates
   are placed on opposite sides of you and you walk into the one you want.
--------------------------------------------------------------------------- */
let awaitingPortal = false;

function afterReward() {
  if (Save.profile.altPath) openPortalRoom();
  else betweenWaves = 2.0;
}

function openPortalRoom() {
  awaitingPortal = true;
  portals.length = 0;
  enemies.length = 0; ebullets.length = 0;
  const nDef = STAGES[(normalIdx + 1) % STAGES.length];
  const aPool = altPool();
  const aDef = aPool[(altIdx + 1) % aPool.length];
  // Gates open around the spot the boss died on. The origin is pulled inside
  // the safe box *before* placement — clamping the gates themselves would let
  // a death near the edge squash both of them into the same corner.
  const R = Math.min(230, Math.min(arena.x1 - arena.x0, arena.y1 - arena.y0) * 0.28);
  const pad = R + 90;
  const ox = clamp(lastBossDeath ? lastBossDeath.x : P.x, arena.x0 + pad, arena.x1 - pad);
  const oy = clamp(lastBossDeath ? lastBossDeath.y : P.y, arena.y0 + pad, arena.y1 - pad);
  lastBossDeath = null;
  const a = rnd(TAU);
  const place = (ang, kind, def) => portals.push({
    kind, def, t: 0, arm: 0.9, r: 44,
    x: ox + Math.cos(ang) * R,
    y: oy + Math.sin(ang) * R
  });
  place(a, 'normal', nDef);
  place(a + Math.PI, 'alt', aDef);

  /* A gate buried in an embedded shard cannot be entered at all: the shard
     holds you r+P.r away while the gate only opens within p.r+P.r, and that
     gap is on the wrong side. Anything overlapping gets moved to the dead
     centre of the room, which is always clear of the walls the shards are in. */
  const cx = (arena.x0 + arena.x1) / 2, cy = (arena.y0 + arena.y1) / 2;
  const buried = p => hazards.some(h =>
    h.kind === 'mirror' && len(p.x - h.x, p.y - h.y) < h.r + p.r + 8);
  for (const p of portals) if (buried(p)) { p.x = cx; p.y = cy; }
  // if both were relocated they would now be stacked — split along the long axis
  if (portals.length === 2) {
    const sep = len(portals[0].x - portals[1].x, portals[0].y - portals[1].y);
    if (sep < portals[0].r * 2 + 60) {
      const wide = (arena.x1 - arena.x0) >= (arena.y1 - arena.y0);
      const off = portals[0].r + 80;
      portals[0].x = cx - (wide ? off : 0); portals[0].y = cy - (wide ? 0 : off);
      portals[1].x = cx + (wide ? off : 0); portals[1].y = cy + (wide ? 0 : off);
    }
  }
  /* A library opened by the boss that just died has been sitting in the room
     unseen — its banner was spent while the shop was covering the screen, and
     the gates can land right on top of it. Move it clear of both gates and
     announce it now, when the player is actually holding the stick again. */
  placeLibraryClear(ox, oy, R, a);
  if (libraryPortal) {
    banner('A LIBRARY OPENS   ·   CHOOSE A GATE', '#fcd34d', 3.6);
    ringFx(libraryPortal.x, libraryPortal.y, 10, 300, '#fcd34d', 0.9, 5);
    Audio_.tone(300, 0.9, 'sine', 0.1, 900);
  } else {
    banner('CHOOSE A GATE', '#e2e8f0', 3.0);
  }
  Audio_.tone(180, 1.1, 'sine', 0.12, 520);
}

/* Keeps the library door out from under the gates and out of the walls. */
function placeLibraryClear(ox, oy, R, a) {
  const L = libraryPortal;
  if (!L) return;
  const pad = L.r + 100;
  const tryAt = (x, y) => {
    const px = clamp(x, arena.x0 + pad, arena.x1 - pad);
    const py = clamp(y, arena.y0 + pad, arena.y1 - pad);
    if (!portals.every(p => len(px - p.x, py - p.y) > p.r + L.r + 70)) return null;
    if (hazards.some(h => h.kind === 'mirror' && len(px - h.x, py - h.y) < h.r + L.r + 10)) return null;
    return { x: px, y: py };
  };
  // square to the gate axis first — that is always the roomiest direction
  for (const side of [1, -1]) {
    const ang = a + side * Math.PI / 2;
    const hit = tryAt(ox + Math.cos(ang) * R * 1.15, oy + Math.sin(ang) * R * 1.15);
    if (hit) { L.x = hit.x; L.y = hit.y; return; }
  }
  for (let k = 0; k < 16; k++) {
    const ang = a + k * TAU / 16;
    const hit = tryAt(ox + Math.cos(ang) * R * 1.6, oy + Math.sin(ang) * R * 1.6);
    if (hit) { L.x = hit.x; L.y = hit.y; return; }
  }
}

function updatePortals(dt) {
  for (const p of portals) {
    p.t += dt;
    p.arm -= dt;                         // brief arming delay: no instant entry
    if (Math.random() < 0.7) {
      const a = rnd(TAU), rr = p.r * rnd(1.5, 0.7);
      spawnPart(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr,
        -Math.cos(a) * 90, -Math.sin(a) * 90, rnd(3.4, 1.6),
        p.kind === 'alt' ? p.def.accent : COL.player, rnd(0.6, 0.3), 0.95);
    }
    if (p.arm <= 0 && len(P.x - p.x, P.y - p.y) < p.r + P.r) { takePortal(p); return; }
  }
}

function takePortal(p) {
  const col = p.def.accent;
  ringFx(p.x, p.y, 12, 340, col, 0.85, 6);
  burst(p.x, p.y, 70, col, 400, 4.2, 1.0);
  drawFlashT = 0.2; shake(0.7);
  Audio_.levelup(); Audio_.boom();
  portals.length = 0;
  awaitingPortal = false;
  libraryPortal = null;            // the door belonged to the room you just left
  if (p.kind === 'alt') advanceAlt(); else advanceNormal();
  // step through: recentre in the new arena so you arrive somewhere safe
  P.x = WORLD.w / 2; P.y = WORLD.h / 2; P.vx = P.vy = 0;
  cam.x = P.x; cam.y = P.y;
  enemies.length = 0; ebullets.length = 0; replay.length = 0;
  banner(stage.name, stage.accent, 2.6);
  betweenWaves = 1.8;
}

/* Codex bookkeeping. Marking happens on every spawn and every offer, so it is
   kept in memory and only written out when something new actually appears —
   a save flush per grunt would be absurd. */
const Codex = {
  // e enemies, u upgrades, m malware, b books, z zodiac
  e: new Set(), u: new Set(), m: new Set(), b: new Set(), z: new Set(), dirty: false,
  load() {
    Codex.e = new Set(Save.profile.codexE || []);
    Codex.u = new Set(Save.profile.codexU || []);
    Codex.m = new Set(Save.profile.codexM || []);
    Codex.b = new Set(Save.profile.codexB || []);
    Codex.z = new Set(Save.profile.codexZ || []);
    Codex.dirty = false;
  },
  see(set, k) {
    if (freeRun) return;                 // a sandbox writes nothing down
    if (!k || Codex[set].has(k)) return;
    Codex[set].add(k); Codex.dirty = true;
  },
  seeEnemy(k)   { Codex.see('e', k); },
  seeUpgrade(id){ Codex.see('u', id); },
  /* These three are logged on pickup, not on offer: the tab is a record of what
     you have actually carried, which is also what decides what he annotates. */
  seeMal(id)    { Codex.see('m', id); },
  seeBook(id)   { Codex.see('b', id); },
  seeSign(id)   { Codex.see('z', id); },
  flush() {
    if (!Codex.dirty) return;
    Save.profile.codexE = [...Codex.e];
    Save.profile.codexU = [...Codex.u];
    Save.profile.codexM = [...Codex.m];
    Save.profile.codexB = [...Codex.b];
    Save.profile.codexZ = [...Codex.z];
    Codex.dirty = false;
    Save.writeLocal(); Save.flush();
  },
  /* Ordered entry list: enemies then bosses. A secret boss is only listed once
     met — it must not sit there as a locked slot, because completing the codex
     is what summons it and it would make its own requirement unreachable. */
  enemies() {
    const out = [];
    for (const k of Object.keys(CODEX_E))
      out.push({ key: k, n: CODEX_E[k].n, d: CODEX_E[k].d,
                 col: ETYPE[k].col, sides: ETYPE[k].sides, boss: false });
    for (const k of Object.keys(BOSSES)) {
      const b = BOSSES[k];
      if (b.secret && !Codex.e.has(k)) continue;
      out.push({ key: k, n: b.name, d: (CODEX_B[k] || {}).d || '',
                 col: b.col, sides: b.sides, boss: true, secret: !!b.secret });
    }
    return out;
  },
  upgrades() {
    return UPGRADES.map(u => ({ key: u.id, up: u, rar: u.rar, max: u.max }));
  },
  // what "filled" means: every ordinary enemy, every boss, every upgrade
  need() {
    const e = Object.keys(CODEX_E).length +
              Object.keys(BOSSES).filter(k => !BOSSES[k].secret).length;
    return { e, u: UPGRADES.filter(x => !x.lock).length };
  },
  have() {
    const n = Codex.need();
    let e = 0;
    for (const k of Object.keys(CODEX_E)) if (Codex.e.has(k)) e++;
    for (const k of Object.keys(BOSSES))
      if (!BOSSES[k].secret && Codex.e.has(k)) e++;
    let u = 0;
    for (const x of UPGRADES) if (!x.lock && Codex.u.has(x.id)) u++;
    return { e, u, needE: n.e, needU: n.u };
  },
  complete() {
    const h = Codex.have();
    return h.e >= h.needE && h.u >= h.needU;
  },
  /* Completion the bookkeeper cares about is enemies + upgrades. This is the
     other kind: every entry in every section, optional ones included, and the
     secret bosses too. Nothing in the game asks for this except him, once. */
  trulyFull() {
    for (const k of Object.keys(CODEX_E)) if (!Codex.e.has(k)) return false;
    for (const k of Object.keys(BOSSES))
      if (BOSSES[k].endgame) { if (!Codex.e.has(k)) continue; }   // may not exist yet
      else if (!Codex.e.has(k)) return false;
    for (const u of UPGRADES) if (!u.lock && !Codex.u.has(u.id)) return false;
    for (const m of MALWARE) if (!Codex.m.has(m.id)) return false;
    for (const k of Object.keys(BOOKS)) if (!Codex.b.has(k)) return false;
    for (const s of SIGNS) if (!Codex.z.has(s.id)) return false;
    return true;
  }
};

const twinActive = () => P.twin > 0 || P.twinT > 0;

/* THE OTHER'S DIARY: the finale, in your hands. Panes orbit you counter to
   your own facing and your weapon becomes a single beam that fans out
   through each one it enters. Purely optical — unlike the boss's mirrors
   these are not solid, or they would fence you in. */
let diaryBeams = [], diaryMirrors = [];
const DIARY_MIRRORS = 5;

function diaryMirrorList() {
  diaryMirrors.length = 0;
  for (let i = 0; i < DIARY_MIRRORS; i++) {
    const a = P.diaryAng + i * TAU / DIARY_MIRRORS;
    const r = 152 + (i % 2) * 64;
    diaryMirrors.push({ x: P.x + Math.cos(a) * r, y: P.y + Math.sin(a) * r, r: 44 });
  }
  return diaryMirrors;
}

// one door per room: a forced malware drop always outranks a library roll
function placePortal(extra) {
  const ox = lastBossDeath ? lastBossDeath.x : P.x;
  const oy = lastBossDeath ? lastBossDeath.y : P.y;
  const a = rnd(TAU), R = 190;
  libraryPortal = Object.assign({
    kind: 'library', t: 0, arm: 0.8, r: 46,
    x: clamp(ox + Math.cos(a) * R, arena.x0 + 120, arena.x1 - 120),
    y: clamp(oy + Math.sin(a) * R, arena.y0 + 120, arena.y1 - 120)
  }, extra);
}

const MALWARE_CHANCE = 0.05;

function maybeSpawnMalware(force) {
  if (!Save.profile.malware && !force) return;
  if (!force && Math.random() >= MALWARE_CHANCE) return;
  placePortal({ kind: 'malware', mal: pick(MALWARE) });
}

function maybeSpawnLibrary(bossKey) {
  if (libraryPortal) return;                 // a malware door already claimed it
  if (!Save.profile.altPath || !BOOKS[bossKey]) return;
  // the first loop's way through is guaranteed; later loops stay a roll
  const guaranteed = bossKey === UNW_FROM_BOSS && loopNum === 0;
  if (!guaranteed && Math.random() >= LIBRARY_CHANCE) return;
  placePortal({ kind: 'library', boss: bossKey });
  // No banner or ring here — the shop is about to cover the screen and eat
  // them, and the door still has to be moved clear of the gates. The portal
  // room announces it instead, once the player can act on it.
}

function updateLibrary(dt) {
  const L = libraryPortal;
  if (!L) return;
  L.t += dt;
  L.arm -= dt;
  const col = L.kind === 'malware' ? MAL_COL : '#fcd34d';
  if (Math.random() < 0.6) {
    const a = rnd(TAU), rr = L.r * rnd(1.6, 0.7);
    spawnPart(L.x + Math.cos(a) * rr, L.y + Math.sin(a) * rr,
      -Math.cos(a) * 70, -Math.sin(a) * 70, rnd(3.4, 1.5), col, rnd(0.7, 0.3), 0.95);
  }
  if (L.arm <= 0 && len(P.x - L.x, P.y - L.y) < L.r + P.r) {
    if (L.kind === 'malware') malwareOffer = L.mal;
    else libraryBook = BOOKS[L.boss];
    libraryPortal = null;
    state = 'library';
    uiArm = 0.4;
    Audio_.levelup();
  }
}

function takeBook() {
  const m = malwareOffer;

function leaveLibrary() {
  libraryBook = null;
  malwareOffer = null;
  state = 'play';
  Audio_.select();
  checkLevel();
}

function useBook() {
  if (state !== 'play' || !P.book) return;
  if (P.bookCharge < P.book.cost) {
    floatText(P.x, P.y - 42, 'NOT CHARGED', '#94a3b8', 13);
    Audio_.tone(160, 0.14, 'square', 0.07, 90);

  }
  P.bookCharge = 0;
  P.book.f();
  banner(P.book.n, P.book.col, 1.6);
}

/* -------------------------------- malware ---------------------------------
   Dropped by the corrupted OTHER. Each one overwrites the dash outright — you
   never get the blink back while it is installed, and only one can be resident
   at a time. They are deliberately not upgrades: every one is a different verb.
--------------------------------------------------------------------------- */
const MAL_COL = '#ef4444';

/* ------------------------- malware execution effects -----------------------
   Malware should not look like the rest of the game's coloured rings. It is
   something running on the board, so it draws like one: right-angle traces
   routed between the things it touches, bracket surges that snap outward in
   steps rather than sweeping, and torn bands where memory is being scribbled
   over. Everything here is one list, updated with the particles.
--------------------------------------------------------------------------- */
let malFx = [];
function malPush(o) {
  o.t = 0;
  malFx.push(o);
  if (malFx.length > 160) malFx.shift();
}

// a square bracket ring that steps outward — a bus, not a shockwave
function malSurge(x, y, r, col, life) {
  malPush({ k: 'surge', x, y, r, col: col || MAL_COL, life: life || 0.55 });
}
// right-angle routing between two points, the way a trace actually runs
function malTrace(x1, y1, x2, y2, col, life) {
  malPush({ k: 'trace', x1, y1, x2, y2, col: col || MAL_COL, life: life || 0.5,
            mid: Math.random() < 0.5 });
}
// memory being scribbled over
function malGlitch(x, y, r, col, life) {
  malPush({ k: 'glitch', x, y, r, col: col || MAL_COL, life: life || 0.4,
            seed: Math.random() * 1000 });
}
// the archivist's blink: the line it took, with the hull strung along it
function blinkTrail(x1, y1, x2, y2, col) {
  malPush({ k: 'blink', x1, y1, x2, y2, col, life: 0.5, ang: Math.atan2(y2 - y1, x2 - x1) });
}

function updateMalFx(dt) {
  for (let i = malFx.length - 1; i >= 0; i--) {
    malFx[i].t += dt;
    if (malFx[i].t >= malFx[i].life) malFx.splice(i, 1);
  }
}

function drawMalFx() {
  if (!FXO.malfx) return;
  for (const f of malFx) {
    const u = clamp(f.t / f.life, 0, 1), a = 1 - u;
    ctx.lineCap = 'butt';
    if (f.k === 'surge') {
      const r = f.r * (0.25 + u * 0.75);
      ctx.strokeStyle = rgba(f.col, 0.8 * a);
      ctx.lineWidth = 2.2;
      // corner brackets rather than a closed circle
      for (let q = 0; q < 4; q++) {
        const sx = q < 2 ? 1 : -1, sy = q % 2 ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(f.x + sx * r, f.y + sy * r * 0.55);
        ctx.lineTo(f.x + sx * r, f.y + sy * r);
        ctx.lineTo(f.x + sx * r * 0.55, f.y + sy * r);
        ctx.stroke();
      }
      // stubs of trace breaking off it
      ctx.strokeStyle = rgba(f.col, 0.4 * a);
      ctx.lineWidth = 1.4;
      for (let i = 0; i < 8; i++) {
        const ang = i * TAU / 8 + 0.4;
        const cx0 = f.x + Math.cos(ang) * r, cy0 = f.y + Math.sin(ang) * r * 0.9;
        ctx.beginPath();
        ctx.moveTo(cx0, cy0);
        ctx.lineTo(cx0 + Math.cos(ang) * 14, cy0);
        ctx.lineTo(cx0 + Math.cos(ang) * 14, cy0 + Math.sin(ang) * 12);
        ctx.stroke();
      }
    } else if (f.k === 'trace' || f.k === 'blink') {
      const p = f.k === 'blink' ? 1 : Math.min(1, u * 2.4);
      const mx = f.mid ? f.x2 : f.x1, my = f.mid ? f.y1 : f.y2;
      ctx.strokeStyle = rgba(f.col, 0.85 * a);
      ctx.lineWidth = f.k === 'blink' ? 3 : 2;
      ctx.beginPath();
      if (f.k === 'blink') { ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); }
      else {
        ctx.moveTo(f.x1, f.y1);
        ctx.lineTo(lerp(f.x1, mx, p), lerp(f.y1, my, p));
        if (p >= 1) ctx.lineTo(f.x2, f.y2);
      }
      ctx.stroke();
      // a charge riding along it
      const q = (f.t / f.life);
      ctx.fillStyle = rgba('#fecaca', a);
      if (f.k === 'blink') {
        // the hull, ghosted at intervals down the line it took
        for (let i = 0; i < 5; i++) {
          const s = i / 4;
          ctx.save();
          ctx.globalAlpha = a * (0.5 - s * 0.3);
          ctx.translate(lerp(f.x1, f.x2, s), lerp(f.y1, f.y2, s));
          ctx.rotate(f.ang);
          ctx.lineWidth = 1.6;
          drawShipHull(f.col, 'rgba(0,0,0,0)');
          ctx.restore();
        }
      } else {
        const bx = lerp(f.x1, mx, q), by = lerp(f.y1, my, q);
        ctx.fillRect(bx - 2.5, by - 2.5, 5, 5);
      }
    } else if (f.k === 'glitch') {
      // torn bands, offset left and right like a bad read
      const n = 5;
      for (let i = 0; i < n; i++) {
        const h = f.r * 0.16;
        const yy = f.y - f.r * 0.5 + i * (f.r / n);
        const off = Math.sin(f.seed + i * 2.7 + f.t * 30) * f.r * 0.5 * a;
        ctx.fillStyle = rgba(f.col, 0.30 * a);
        ctx.fillRect(f.x - f.r * 0.5 + off, yy, f.r, h);
        ctx.fillStyle = rgba('#38bdf8', 0.16 * a);
        ctx.fillRect(f.x - f.r * 0.5 - off * 0.6, yy + 1, f.r, h * 0.6);
      }
    }
  }
}

const MALWARE = [
  { id: 'fork', n: 'FORK BOMB', col: '#f87171',
    d: 'Forces the nearest enemy to spawn processes it cannot kill. It bursts — and everything caught in the burst bursts in turn, all the way through the crowd.',
    f: () => {
      const seed = nearestEnemy(P.x, P.y, 520);
      if (!seed) return malMiss('NO PROCESS');
      const queue = [seed], seen = new Set([seed.id]);
      let depth = 0;
      while (queue.length && depth < 40) {
        const e = queue.shift(); depth++;
        const R = 150;
        playerBlast(e.x, e.y, R, 18 + P.dmg * 1.7, '#f87171');
        malSurge(e.x, e.y, R, '#f87171', 0.5);
        for (const o of enemies) {
          if (o.dead || seen.has(o.id) || o.invuln) continue;
          if (len(o.x - e.x, o.y - e.y) > R + o.r) continue;

function malMiss(why) {
  floatText(P.x, P.y - 42, why, '#94a3b8', 12);

}

function malTrail(x1, y1, x2, y2, col) {
  const n = Math.max(4, Math.round(len(x2 - x1, y2 - y1) / 18));
  for (let k = 0; k <= n; k++) {
    const u = k / n;
    spawnPart(lerp(x1, x2, u), lerp(y1, y2, u), rnd(60, -60), rnd(60, -60),
              rnd(5, 2.5), col, rnd(0.5, 0.25), 0.92);
  }
}

/* Which room opens after a boss: once unlocked, half are planetariums. */
/* A shard biting into the wall. Records which face it hit and pre-generates
   its fracture pattern once, so the tear is stable instead of shimmering
   with new random lines every frame. */
function embedShard(h, quiet) {
  const m = h.r * 0.55;
  h.x = clamp(h.x, arena.x0 + m, arena.x1 - m);
  h.y = clamp(h.y, arena.y0 + m, arena.y1 - m);
  h.impactAng = Math.atan2(h.vy || 0, h.vx || 1);
  // inward-facing normal of whichever wall it struck
  h.wallNx = h.x <= arena.x0 + m + 1 ? 1 : h.x >= arena.x1 - m - 1 ? -1 : 0;
  h.wallNy = h.y <= arena.y0 + m + 1 ? 1 : h.y >= arena.y1 - m - 1 ? -1 : 0;
  if (!h.wallNx && !h.wallNy) h.wallNy = -1;
  // fracture lines run along the wall face, away from the puncture
  const along = Math.atan2(-h.wallNx, h.wallNy);
  h.cracks = [];
  for (let i = 0; i < 7; i++) {
    const pts = [];
    let x = 0, y = 0;
    let a = along + (i % 2 ? Math.PI : 0) + rnd(0.7, -0.7);
    const n = 3 + rndi(3), total = rnd(105, 45);
    for (let k = 0; k < n; k++) {
      a += rnd(0.55, -0.55);
      const L = total / n * rnd(1.5, 0.5);
      x += Math.cos(a) * L; y += Math.sin(a) * L;
      pts.push([x, y]);
    }
    h.cracks.push(pts);
  }
  h.embT = 0;
  h.flying = false; h.embedded = true; h.vx = 0; h.vy = 0;
  if (!quiet) { shake(0.3); Audio_.hit(); }
  burst(h.x, h.y, 26, '#5eead4', 300, 3.4, 0.6);
  burst(h.x, h.y, 12, '#ffffff', 190, 2.4, 0.4);
  ringFx(h.x, h.y, 6, h.r * 2.4, '#99f6e4', 0.5, 4);
}

/* Gameplay stops while a reward overlay is up, so anything still in the air
   would freeze there and resume — lethal — the instant you closed it. Drive
   any remaining shards into the nearest wall first. */
function settleShards() {
  for (const h of hazards) {
    if (h.kind !== 'mirror' || !h.flying) continue;
    const m = h.r * 0.55;
    const dl = h.x - arena.x0, dr = arena.x1 - h.x;
    const dt_ = h.y - arena.y0, db = arena.y1 - h.y;
    const nearest = Math.min(dl, dr, dt_, db);
    if (nearest === dl) h.x = arena.x0 + m;
    else if (nearest === dr) h.x = arena.x1 - m;
    else if (nearest === dt_) h.y = arena.y0 + m;
    else h.y = arena.y1 - m;
    embedShard(h, true);
  }
}

function openReward() {
  settleShards();
  // a sheet that shuts the shop shuts the planetarium with it: both are the
  // same beat in the run, and skipping the beat entirely is the point
  if (chalNoShop()) {
    shopPending = false;
    betweenWaves = 2.2;
    banner('NO RESUPPLY', '#64748b', 2.0);
    return;
  }
  if (Save.profile.planetarium && Math.random() < 0.5) openPlanetarium();
  else openShop();
}

/* Two consecutive no-spend shop exits earn the unlock. */
function noteShopExit() {
  if (Save.profile.planetarium) return;
  const p = Save.profile;
  p.skipStreak = shopTouched ? 0 : (p.skipStreak || 0) + 1;
  if (p.skipStreak >= 2) {
    p.planetarium = true;
    p.skipStreak = 0;
    banner('THE PLANETARIUMS OPEN', '#fbbf24');
    Audio_.levelup();
    drawFlashT = 0.15;
  }
  Save.writeLocal();
  Save.flush();
}

let offers = [], offerHover = -1;
let hitStop = 0, drawFlashT = 0, uiTime = 0;

// a boss dies can't eat the upgrade screen or the shop
let uiArm = 0;
let lastStats = null;

/* ------------------------------ persistence -------------------------------
   Fireproof (local-first document DB, syncable) layered over localStorage.
   Every call here is best-effort and fire-and-forget: on file://, offline, or
   with the CDN blocked, the game silently keeps running on localStorage and
   nothing above this layer can tell the difference. The game loop never
   awaits any of it.

   API notes verified against @fireproof/core 0.24.19:
     put(doc)              -> { id, clock, name }, honours an explicit _id
     get(id)               -> doc, THROWS if the id is absent
     query(field, opts)    -> { rows: [{ key, id, doc }] }, supports
                              { descending, limit }
--------------------------------------------------------------------------- */
const FIREPROOF_URL = 'https://esm.sh/@fireproof/core@0.24.19';
const SAVE_KEY = 'voidrunner_save_v1';

const Save = {
  db: null,
  status: 'local',        // local | connecting | cloud | error
  profile: null,
  top: [],                // best runs, for the menu leaderboard

  blank: () => ({ name: '', best: 0, bestWave: 0, bestSector: '—', runs: 0, kills: 0,
                  time: 0, muted: false, vol: 1, autofire: false, sens: 1,
                  planetarium: false, skipStreak: 0, clears: 0, altPath: false,
                  charIdx: 0, otherKills: 0, malware: false,
                  codexE: [], codexU: [], codexM: [], codexB: [], codexZ: [],
                  keeperMet: false, keeperDone: false,
                  trueEnd: false, freeplay: false, unwrittenDeaths: 0,
                  askedHarder: false, amalgamDone: false, devTalkDue: false, fx: 1,
                  deepFracture: false, rootDone: false, keyEver: false,
                  metFounder: false, conformed: false, tribunalDone: false,
                  gfx: null, gfxSeen: 0, gfxCosts: null,
                  // ids of every challenge cleared; the rewards key off this
                  chal: [],
                  // escalation: the permanent mark, and the window that earns it
                  hardened: false, deepRuns: [],
                  // full stats of the best run, so it can be re-submitted later
                  bestRun: null }),

  readLocal() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) return Object.assign(Save.blank(), JSON.parse(raw));
      // migrate the pre-Fireproof single-key best score
      const legacy = parseInt(localStorage.getItem('voidrunner_best') || '0', 10);
      const p = Save.blank();
      if (legacy > 0) p.best = legacy;
      return p;
    } catch (e) { return Save.blank(); }
  },
  /* Anyone who beat THE UNWRITTEN before the monologue was made reliable can
     be sitting on a finished record with no way to the amalgam: trueEnd closes
     the keeper's offer, and the one-shot timer that used to open the monologue
     may never have fired. Having beaten it but never having been asked is
     exactly that state, so re-arm him. */
  repair(p) {
    if (p.trueEnd && !p.amalgamDone && !p.askedHarder) p.devTalkDue = true;
    return p;
  },
  writeLocal() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(Save.profile)); } catch (e) {}
  },

  // Same device may have written to either store; keep the better of each.
  merge(a, b) {
    const out = Save.blank();
    for (const k of ['best', 'bestWave', 'runs', 'kills', 'time'])
      out[k] = Math.max(a[k] || 0, b[k] || 0);
    out.bestSector = (b.bestWave || 0) >= (a.bestWave || 0)
      ? (b.bestSector || a.bestSector) : (a.bestSector || b.bestSector);
    out.name = b.name || a.name || '';
    out.muted = b.muted !== undefined ? b.muted : a.muted;
    out.vol = b.vol !== undefined ? b.vol : (a.vol !== undefined ? a.vol : 1);
    out.autofire = b.autofire !== undefined ? b.autofire : a.autofire;
    out.sens = b.sens !== undefined ? b.sens : (a.sens !== undefined ? a.sens : 1);
    // an unlock is permanent: if either store has it, it stays earned
    out.planetarium = !!(a.planetarium || b.planetarium);
    out.altPath = !!(a.altPath || b.altPath);
    out.malware = !!(a.malware || b.malware);
    out.otherKills = Math.max(a.otherKills || 0, b.otherKills || 0);
    // a cleared challenge is an unlock: union both stores, never subtract
    out.chal = [...new Set([...(a.chal || []), ...(b.chal || [])])];
    // escalation is a mark, not a score: once either store has it, it stays
    out.hardened = !!(a.hardened || b.hardened);
    out.deepRuns = (b.deepRuns && b.deepRuns.length ? b.deepRuns : a.deepRuns) || [];
    // a codex entry is knowledge: union both stores, never subtract
    for (const k of ['codexE', 'codexU', 'codexM', 'codexB', 'codexZ'])
      out[k] = [...new Set([...(a[k] || []), ...(b[k] || [])])];
    out.keeperMet = !!(a.keeperMet || b.keeperMet);
    out.keeperDone = !!(a.keeperDone || b.keeperDone);
    out.trueEnd = !!(a.trueEnd || b.trueEnd);
    out.freeplay = !!(a.freeplay || b.freeplay);
    out.unwrittenDeaths = Math.max(a.unwrittenDeaths || 0, b.unwrittenDeaths || 0);
    out.askedHarder = !!(a.askedHarder || b.askedHarder);
    out.amalgamDone = !!(a.amalgamDone || b.amalgamDone);
    out.deepFracture = !!(a.deepFracture || b.deepFracture);
    out.rootDone = !!(a.rootDone || b.rootDone);
    out.keyEver = !!(a.keyEver || b.keyEver);
    out.metFounder = !!(a.metFounder || b.metFounder);
    out.conformed = !!(a.conformed || b.conformed);
    out.tribunalDone = !!(a.tribunalDone || b.tribunalDone);
    out.devTalkDue  = !!(a.devTalkDue  || b.devTalkDue);
    out.clears = Math.max(a.clears || 0, b.clears || 0);
    out.charIdx = b.charIdx !== undefined ? b.charIdx : (a.charIdx || 0);
    out.skipStreak = Math.max(a.skipStreak || 0, b.skipStreak || 0);
    const ar = a.bestRun, br = b.bestRun;
    out.bestRun = (br && br.score || 0) >= (ar && ar.score || 0) ? (br || ar) : (ar || br);
    return out;
  },

  /* Clears used to only ever be counted when stepping through a portal — but
     portals require the unlock that clears gate, so the counter could never
     advance and the alt path was unreachable no matter how far you got.
     Recover what a profile actually earned from how deep it has been. */
  reconcileClears() {
    const p = Save.profile;
    const perLoop = STAGES.length * 5;                 // 5 sectors, 5 waves each
    const earned = Math.floor(Math.max(0, (p.bestWave || 0) - 1) / perLoop);
    if (earned > (p.clears || 0)) {
      p.clears = earned;
      if (p.clears >= 2) p.altPath = true;
      Save.writeLocal();
      return true;
    }
    return false;
  },

  init() {
    Save.profile = Save.repair(Save.readLocal());
    Save.reconcileClears();
    Save.writeLocal();
    // older saves only knew mute; treat that as a volume of zero
    Audio_.setVol(Save.profile.vol !== undefined ? Save.profile.vol
                                                 : (Save.profile.muted ? 0 : 1));
    Codex.load();
    fxLevel = Save.profile.fx === undefined ? FX.ON : (Save.profile.fx ? FX.ON : FX.OFF);
    fxApply(Save.profile);
    autoFire = !!Save.profile.autofire;
    applyChar(Save.profile.charIdx || 0);
    Save.connect();
    Board.load();
    // first launch: ask who they are before anything else
    if (!Save.profile.name) { nameBuf = ''; state = 'name'; }
  },

  async connect() {
    // file:// can't load an ESM module from a CDN — stay on localStorage
    if (location.protocol === 'file:') { Save.status = 'local'; return; }
    Save.status = 'connecting';
    try {
      const { fireproof } = await import(FIREPROOF_URL);
      const db = fireproof('voidrunner');
      let remote = null;
      try { remote = await db.get('profile'); } catch (e) { remote = null; }
      Save.db = db;
      Save.status = 'cloud';
      if (remote) { Save.profile = Save.repair(Save.merge(Save.profile, remote)); Save.writeLocal(); }
      Save.reconcileClears();   // the merged profile may predate clear tracking
      await Save.flush();
      await Save.refreshTop();
      Board.backfill();
    } catch (e) {
      Save.status = 'error';
      Save.db = null;
    }
  },

  async flush() {
    if (!Save.db) return;
    try {
      let doc;
      try { doc = await Save.db.get('profile'); } catch (e) { doc = { _id: 'profile' }; }
      await Save.db.put(Object.assign(doc, Save.profile, { _id: 'profile' }));
    } catch (e) { /* never let a write failure reach the game */ }
  },

  async refreshTop() {
    if (!Save.db) return;
    try {
      const q = await Save.db.query('score', { descending: true, limit: 5 });
      Save.top = (q.rows || []).map(r => r.doc).filter(d => d && d.type === 'run');
    } catch (e) { /* leaderboard is cosmetic */ }
  },

  recordRun(s) {
    const p = Save.profile;
    p.runs++;
    /* Escalation watches the last five runs flown alone under ordinary
       rules. Two ships is a different game and so is a challenge sheet, so
       neither is allowed to move the window in either direction. */
    if (!MP.on && noteRunDepth(s.wave)) s.escalated = true;
    p.kills += s.kills;
    p.time += s.time;
    if (s.score > ((p.bestRun && p.bestRun.score) || 0)) {
      p.bestRun = { score: s.score, wave: s.wave, sector: s.sector, loop: s.loop || 0,
                    level: s.level, kills: s.kills, time: Math.round(s.time) };
    }
    if (s.score > p.best) p.best = s.score;
    if (s.wave > p.bestWave) { p.bestWave = s.wave; p.bestSector = s.sector; }
    Save.writeLocal();
    if (!Save.db) return;
    (async () => {
      try {
        await Save.db.put({
          type: 'run', score: s.score, wave: s.wave, sector: s.sector, loop: s.loop,
          level: s.level, kills: s.kills, time: Math.round(s.time),
          build: s.build, at: Date.now()
        });
        await Save.flush();
        await Save.refreshTop();
      } catch (e) {}
    })();
  },

  savePrefs() {
    Save.profile.muted = Audio_.muted;
    Save.profile.vol = Audio_.vol;
    Save.profile.autofire = autoFire;
    Save.profile.sens = aimSens();
    Save.writeLocal();
    Save.flush();
  }
};
Save.profile = Save.blank();

/* ---------------------------- global leaderboard --------------------------
   Backed by a Netlify Function (/api/leaderboard) over Netlify Blobs. There
   are no accounts: a name is a label, not an identity, and the server treats
   every submission as an unverified claim. Entirely optional — on file://,
   offline, or without the function deployed the game just hides the board.
--------------------------------------------------------------------------- */
const Board = {
  url: '/api/leaderboard',
  top: [], status: 'idle', rank: null, note: '',

  async load() {
    if (location.protocol === 'file:') { Board.status = 'offline'; return; }
    if (!Board.top.length) Board.status = 'loading';
    try {
      const r = await fetch(Board.url, { cache: 'no-store' });
      if (!r.ok) throw new Error('http ' + r.status);
      const d = await r.json();
      Board.top = Array.isArray(d.top) ? d.top : [];
      Board.status = 'ok';
      Board.backfill();
    } catch (e) {
      Board.status = 'offline';
    }
  },

  /* Reconcile: if your stored personal best is better than whatever the board
     has under your name, push it. Without this, a best set while the function
     was unreachable — or before you had a name — is stranded locally forever,
     because scores are only ever posted at the moment of death. */
  synced: false,
  async backfill() {
    if (Board.synced || location.protocol === 'file:' || !Save.profile.name) return;
    if (Board.status !== 'ok') return;
    let run = Save.profile.bestRun;
    // profiles from before bestRun existed: recover it from the run history
    if ((!run || !run.score) && Save.db) {
      try {
        const q = await Save.db.query('score', { descending: true, limit: 1 });
        const doc = q.rows && q.rows[0] && q.rows[0].doc;
        if (doc && doc.type === 'run' && doc.score > 0) run = doc;
      } catch (e) {}
    }
    if (!run || !run.score) return;
    const mine = Board.top.find(e => e.name === Save.profile.name);
    if (mine && mine.score >= run.score) { Board.synced = true; return; }
    Board.synced = true;
    Board.submit(run, true);
  },

  submit(s, quiet) {
    if (location.protocol === 'file:' || !Save.profile.name) return;
    if (!quiet) { Board.rank = null; Board.note = ''; }
    (async () => {
      try {
        const r = await fetch(Board.url, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            name: Save.profile.name, score: s.score, wave: s.wave, sector: s.sector,
            loop: s.loop, level: s.level, kills: s.kills, time: Math.round(s.time)
          })
        });
        const d = await r.json().catch(() => null);
        if (r.ok && d && d.ok) {
          Board.top = Array.isArray(d.top) ? d.top : Board.top;
          Board.status = 'ok';
          if (!quiet) Board.rank = d.rank;   // a backfill must not fake a run's rank
        } else if (!quiet) {
          Board.note = (d && d.error) || 'not submitted';
        }
      } catch (e) { Board.status = 'offline'; }
    })();
  }
};

/* ------------------------------- name entry -------------------------------- */
let nameBuf = '';
const NAME_MAX = 14;

function nameKey(e) {
  Audio_.init(); Audio_.resume();
  if (e.key === 'Enter')     { e.preventDefault(); commitName(); return; }
  if (e.key === 'Backspace') { e.preventDefault(); nameBuf = nameBuf.slice(0, -1); return; }
  if (e.key === 'Escape')    {
    e.preventDefault();
    if (Save.profile.name) { nameBuf = ''; state = 'menu'; }
    return;
  }
  if (e.key.length === 1 && nameBuf.length < NAME_MAX && /[A-Za-z0-9 _.\-]/.test(e.key)) {
    e.preventDefault();
    nameBuf += e.key;
    Audio_.tone(880, 0.03, 'square', 0.035, 1300);
  }
}
function commitName() {
  const n = nameBuf.replace(/\s+/g, ' ').trim().slice(0, NAME_MAX);
  if (!n) return;
  Save.profile.name = n;
  Save.writeLocal();
  Save.flush();
  nameBuf = '';
  state = 'menu';
  Audio_.select();
  Board.synced = false;
  Board.load();
}
// touch devices have no physical keyboard — fall back to the native prompt
function promptName() {

function gameOver(quiet) {
  if (state === 'dead') return;          // never record a run twice
  state = 'dead';
  /* A freeplay run is a sandbox: it must not touch the record in any way —
     no stats, no best, no leaderboard, no codex. */
  /* A challenge is a different game with a different rule sheet, so it is
     scored on its own terms: the goal was met or it was not. Nothing here
     touches your best, your board position or your ordinary progression. */
  if (Chal.on) {
    lastStats = { score, wave, kills: P.kills, level: P.level, time: elapsed,
                  sector: stage.name, loop: loopNum, isRecord: false,
                  chal: Chal.on, chalWon: Chal.won, reward: Chal.reward };
    Codex.flush();
    if (!quiet) {
      explode(P.x, P.y, 180, 0, COL.player);
      burst(P.x, P.y, 90, COL.player, 460, 4, 1.1);
      shake(1); Audio_.over();
    }
    return;
  }
  if (freeRun) {
    lastStats = { score: 0, wave, kills: P.kills, level: P.level, time: elapsed,
                  sector: stage.name, loop: loopNum, isRecord: false, freeplay: true };
    if (!quiet) {
      explode(P.x, P.y, 180, 0, COL.player);
      burst(P.x, P.y, 90, COL.player, 460, 4, 1.1);
      shake(1); Audio_.over();
    }
    return;
  }
  const build = Object.keys(P.up).map(id => {
    const u = UPGRADES.find(z => z.id === id);
    return u ? upName(u) + (P.up[id] > 1 ? ' ×' + P.up[id] : '') : id;
  });
  lastStats = { score, wave, kills: P.kills, level: P.level, time: elapsed,
                sector: stage.name, loop: loopNum,
                isRecord: score > Save.profile.best };
  const wasHard = Save.profile.hardened;
  Save.recordRun(Object.assign({ build }, lastStats));
  // the run that tips the window over is the one that gets told
  lastStats.escalated = !wasHard && !!Save.profile.hardened;
  /* A co-op run still goes on your own record — it happened, and the stats are
     yours. It does not go to the global board: two ships clearing a wave is
     not the run everyone else on that board is being measured on. */
  if (!MP.on) Board.submit(lastStats);
  Codex.flush();                         // bank whatever this run introduced
  if (quiet) return;                     // quitting records, but does not detonate
  explode(P.x, P.y, 180, 0, COL.player);
  burst(P.x, P.y, 90, COL.player, 460, 4, 1.1);
  shake(1); Audio_.over();
}

function handleKey(k) {
  // volume lives on the slider now, so M is free for the way out
  if (k === 'm' && (state === 'pause' || state === 'dead')) {
    // straight back to the ladder, which is where you were going anyway
    const wasChal = !!Chal.on;
    quitToMenu();
    if (wasChal) openChal('menu');
    return;
  }
  // --- freeplay console: its own key, and it swallows nothing else ---
  if (freeRun && k === '\\') {
    freeOpen = !freeOpen; freeSel = 0; Audio_.select(); return;
  }
  if (freeRun && freeOpen && state === 'play') {
    if (k === 'arrowdown' || k === 's') { freeSel = (freeSel + 1) % FREE_ROWS.length; return; }
    if (k === 'arrowup'   || k === 'w') { freeSel = (freeSel + FREE_ROWS.length - 1) % FREE_ROWS.length; return; }
    if (k === 'enter' || k === ' ') { FREE_ROWS[freeSel].f(); Audio_.select(); return; }
    if (k === 'escape') { freeOpen = false; return; }
  }
  if (state === 'lan') { lanKey(k); return; }
  if (state === 'chal') { chalKey(k); return; }
  if (state === 'settings') { settingsKey(k); return; }
  if (state === 'menu') {
    if (k === 'l') { openLan(); return; }
    if (k === 'k') { openChal('menu'); return; }
    if (k === 's') { openSettings('menu'); return; }
    if (k === 'f' && Save.profile.freeplay) { startFreeplay(); return; }
    if (k === 'c') {
      let n = selectedChar;
      for (let k2 = 0; k2 < CHARS.length; k2++) {
        n = (n + 1) % CHARS.length;
        if (charOpen(CHARS[n])) break;
      }
      applyChar(n);
      Save.profile.charIdx = selectedChar;
      Save.writeLocal(); Save.flush();
      Audio_.select();
      return;
    }
    if (k === 'n') { nameBuf = Save.profile.name || ''; state = 'name'; return; }
    if (k === 'x') { openCodex('menu'); return; }
    if (k === ' ' || k === 'enter') {
      // still linked up: starting from here relaunches the co-op run rather
      // than stranding the other side in a game it cannot see
      if (mpGuest()) return;
      if (netLive() && Net.role === 'host' && MP.ready) { mpStartRun(); return; }
      resetGame(); state = 'play';
    }
    return;
  }
  if (state === 'codex') {
    if (uiArm > 0) return;
    const list = codexList(), g = codexGeom();
    if (k === 'escape' || k === 'x' || k === 'p') { closeCodex(); return; }
    if (k === 'tab') { codexStepTab(1); return; }
    if (k === 'q') { codexStepTab(-1); return; }
    if (k === 'e') { codexStepTab(1); return; }
    if (k === 'arrowright' || k === 'd') { codexSel = Math.min(list.length - 1, codexSel + 1); codexReveal(); return; }
    if (k === 'arrowleft'  || k === 'a') { codexSel = Math.max(0, codexSel - 1); codexReveal(); return; }
    if (k === 'arrowdown'  || k === 's') { codexSel = Math.min(list.length - 1, codexSel + g.cols); codexReveal(); return; }
    if (k === 'arrowup'    || k === 'w') { codexSel = Math.max(0, codexSel - g.cols); codexReveal(); return; }
    return;
  }
  // a guest cannot start a run: the next one begins when the host says so
  if (state === 'dead') {
    // a challenge restarts as itself; the ordinary run restarts as a run
    if (Chal.on && (k === ' ' || k === 'enter' || k === 'r')) {
      const c = Chal.on; chalQuit(); startChallenge(c); return;
    }
    if (mpGuest() || !(k === ' ' || k === 'enter' || k === 'r')) return;
    // still hosting: the next run is the wingman's too, not a solo restart
    if (mpHost()) { mpStartRun(); return; }
    resetGame(); state = 'play';
    return;
  }
  if (state === 'levelup') {
    const i = ['1', '2', '3', '4', '5'].indexOf(k);
    if (i >= 0 && offers[i]) chooseOffer(i);
    return;
  }
  if (state === 'shop') {
    const i = ['1', '2', '3', '4', '5', '6'].indexOf(k);
    if (i >= 0) buyShop(i);
    else if (k === 'r') rerollShop();
    else if (k === 'enter' || k === ' ' || k === 'escape') closeShop();
    return;
  }
  if (state === 'planet') {
    if (uiArm > 0) return;
    if (!planetRevealed && (k === 'a' || k === 'y')) acceptSign();
    else if (k === 'enter' || k === ' ' || k === 'escape' || k === 'd' || k === 'n')
      leavePlanetarium();
    return;
  }
  if (state === 'library') {
    if (uiArm > 0) return;
    if (k === 'f' && keeperWants()) handOverCodex();
    else if (k === 'f' && keeperTalks()) startTalk();
    else if (k === 'e' || k === 'enter' || k === ' ') takeBook();
    else if (k === 'escape' || k === 'q') leaveLibrary();
    return;
  }
  if (state === 'talk') {
    if (talkAsk) {
      if (k === 'y') talkAnswer(true);
      else if (k === 'n' || k === 'escape') talkAnswer(false);
    } else if (k === ' ' || k === 'enter' || k === 'e') talkAdvance();
    return;
  }
  if (state === 'devtalk') {
    if (devAsk) {
      if (k === 'y') devAnswer(true);
      else if (k === 'n' || k === 'escape') devAnswer(false);
    } else if (k === ' ' || k === 'enter' || k === 'e') devAdvance();
    return;
  }
  if (state === 'amalcut') return;         // it does not take input
  if (k === 'q') { useBook(); return; }
  if (state === 'pause' && k === 'x') { openCodex('pause'); return; }
  if (state === 'pause' && k === 's') { openSettings('pause'); return; }
  if (state === 'gfx') {
    if (uiArm > 0) return;
    if (k === 'g' || k === 'escape' || k === 'enter' || k === ' ') { closeGfx(); return; }
    if (k === 'arrowdown' || k === 's') { gfxSel = (gfxSel + 1) % FX_ROWS.length; return; }
    if (k === 'arrowup'   || k === 'w') { gfxSel = (gfxSel + FX_ROWS.length - 1) % FX_ROWS.length; return; }
    if (k === 'arrowleft' || k === 'arrowright' || k === 'a' || k === 'd') { gfxToggle(gfxSel); return; }
    if (k === '1') { fxPreset(2); return; }
    if (k === '2') { fxPreset(1); return; }
    if (k === '3') { fxPreset(0); return; }
    if (k === 'm') { fxMeasureStart(); return; }
    return;
  }
  if (k === 'g') { openGfx(state === 'pause' ? 'pause' : 'play'); return; }
  if (k === 'p' || k === 'escape') state = state === 'pause' ? 'play' : 'pause';
  if (choice) { if (k === 'y') choiceAnswer(false);
                else if (k === 'n') choiceAnswer(true); return; }
  if (k === 'v') { useRootCmd(); return; }
  if (k === 't') { autoFire = !autoFire; Save.savePrefs(); }
}
function inRect(mx, my, r) { return mx > r.x && mx < r.x + r.w && my > r.y && my < r.y + r.h; }

/* ------------------------------ volume slider -----------------------------
   Replaces the old mute toggle. The rect is published by whichever overlay
   drew it this frame, so the hit test never has to duplicate the layout. */
let volRect = null, volDrag = false;

function drawVolSlider(cx, cy, w, bare) {
  const h = 5, x = cx - w / 2;
  volRect = { x, y: cy - 13, w, h: 26 };          // generous grab area
  const v = Audio_.vol;
  const hot = volDrag || inRect(mouse.x, mouse.y, volRect);
  const col = Audio_.muted ? '#475569' : (hot ? COL.player : '#64748b');

  ctx.save();
  if (!bare) {
    ctx.textAlign = 'right';
    ctx.font = "700 9px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = '#475569';
    ctx.fillText(Audio_.muted ? 'MUTED' : 'VOLUME', x - 14, cy + 3);
  }

  ctx.fillStyle = 'rgba(148,163,184,0.18)';
  roundRect(x, cy - h / 2, w, h, h / 2); ctx.fill();
  if (v > 0) {
    ctx.fillStyle = col;
    roundRect(x, cy - h / 2, Math.max(h, w * v), h, h / 2); ctx.fill();
  }
  const kx = x + w * v;
  if (hot) drawGlow(kx, cy, 16, col, 0.4);
  ctx.fillStyle = hot ? '#f8fafc' : '#cbd5e1';
  ctx.beginPath(); ctx.arc(kx, cy, hot ? 7 : 6, 0, TAU); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(kx, cy, hot ? 7 : 6, 0, TAU); ctx.stroke();

  if (!bare) {
    ctx.textAlign = 'left';
    ctx.font = "600 10px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = '#475569';
    ctx.fillText(Math.round(v * 100) + '%', x + w + 14, cy + 3);
  }
  ctx.restore();
}

function volFromMouse() {
  if (!volRect) return;
  Audio_.setVol((mouse.x - volRect.x) / volRect.w);
}

/* Leaving mid-run is deliberate, so the run still counts — abandoning a good
   score by accident is exactly the failure the freeze bug already caused. */
function quitToMenu() {
  if (state !== 'dead' && wave > 0 && score > 0) gameOver(true);
  if (MP.on || netLive()) mpQuit();     // hang up before the menu, not after
  chalQuit();
  state = 'menu';
  uiArm = 0.4;
  Audio_.select();
}

function handleClick() {
  if (choice) {
    const b = choiceButtons();
    if (inRect(mouse.x, mouse.y, b.stay)) { choiceAnswer(false); return; }
    if (inRect(mouse.x, mouse.y, b.open)) { choiceAnswer(true); return; }
    return;
  }
  if (state === 'name') { if (isTouch) promptName(); return; }
  if (state === 'lan') { lanClick(); return; }
  if (state === 'chal') { chalClick(); return; }
  if (state === 'settings') { settingsClick(); return; }
  if (state === 'menu') {
    if (inRect(mouse.x, mouse.y, menuLanRect())) { openLan(); return; }
    if (inRect(mouse.x, mouse.y, menuChalRect())) { openChal('menu'); return; }
    if (inRect(mouse.x, mouse.y, menuSetRect())) { openSettings('menu'); return; }
    resetGame(); state = 'play'; return;
  }
  if (state === 'dead') {
    if (Chal.on) { const c = Chal.on; chalQuit(); startChallenge(c); return; }
    if (mpGuest()) return;
    if (mpHost()) { mpStartRun(); return; }
    resetGame(); state = 'play'; return;
  }
  if (state === 'gfx') {
    if (uiArm > 0) return;
    const g = gfxRects();
    for (const b of g.rows)
      if (inRect(mouse.x, mouse.y, b)) { gfxSel = b.i; gfxToggle(b.i); return; }
    for (const b of g.presets)
      if (inRect(mouse.x, mouse.y, b)) { fxPreset(b.lvl); Audio_.select(); return; }
    if (inRect(mouse.x, mouse.y, g.measure)) {
      fxMeasureStart(); Audio_.select();
      return;
    }
    if (inRect(mouse.x, mouse.y, g.done)) { closeGfx(); return; }
    return;
  }
  if (state === 'pause') {
    if (inRect(mouse.x, mouse.y, pauseSetRect())) { openSettings('pause'); return; }
    state = 'play'; return;
  }
  if (uiArm > 0) return;                 // overlay just opened — swallow it
  if (state === 'levelup') {
    const i = offerIndexAt(mouse.x, mouse.y);
    if (i >= 0) chooseOffer(i);
    return;
  }
  if (state === 'shop') {
    const b = shopButtons();
    if (inRect(mouse.x, mouse.y, b.reroll)) { rerollShop(); return; }
    if (inRect(mouse.x, mouse.y, b.leave))  { closeShop(); return; }
    const i = shopIndexAt(mouse.x, mouse.y);
    if (i >= 0) buyShop(i);
    return;
  }
  if (state === 'talk') {
    if (uiArm > 0) return;
    if (!talkAsk) { talkAdvance(); return; }
    const b = talkButtons();
    if (inRect(mouse.x, mouse.y, b.yes)) talkAnswer(true);
    else if (inRect(mouse.x, mouse.y, b.no)) talkAnswer(false);
    return;
  }
  if (state === 'devtalk') {
    if (uiArm > 0) return;
    if (!devAsk) { devAdvance(); return; }
    const b = devButtons();
    if (inRect(mouse.x, mouse.y, b.yes)) devAnswer(true);
    else if (inRect(mouse.x, mouse.y, b.no)) devAnswer(false);
    return;
  }
  if (state === 'amalcut') return;
  if (freeRun && freeOpen && state === 'play') {
    const rs = freeRects();
    for (let i = 0; i < FREE_ROWS.length; i++) if (inRect(mouse.x, mouse.y, rs[i])) {
      freeSel = i; FREE_ROWS[i].f(); Audio_.select(); return;
    }
  }
  if (state === 'codex') {
    if (uiArm > 0) return;
    const tabs = codexTabRects();
    for (let i = 0; i < CODEX_TABS.length; i++) if (inRect(mouse.x, mouse.y, tabs[i])) {
      if (!codexTabOpen(i)) { Audio_.tone(150, 0.12, 'square', 0.06, 90); return; }
      if (codexTab !== i) { codexTab = i; codexSel = 0; codexScroll = 0; Audio_.select(); }
      return;
    }
    const g = codexGeom();
    if (mouse.y > g.clipY && mouse.y < g.clipY + g.viewH) {
      const list = codexList();
      for (let i = 0; i < list.length; i++)
        if (inRect(mouse.x, mouse.y, codexCellRect(i))) { codexSel = i; Audio_.select(); return; }
    }
    return;
  }
  if (state === 'library') {
    const b = libraryButtons();
    if (b.hand && inRect(mouse.x, mouse.y, b.hand)) { handOverCodex(); return; }
    if (b.talk && inRect(mouse.x, mouse.y, b.talk)) { startTalk(); return; }
    if (inRect(mouse.x, mouse.y, b.take)) { takeBook(); return; }
    if (inRect(mouse.x, mouse.y, b.leave)) leaveLibrary();
    return;
  }
  if (state === 'planet') {
    const b = planetButtons();
    if (!planetRevealed && inRect(mouse.x, mouse.y, b.accept)) { acceptSign(); return; }
    if (inRect(mouse.x, mouse.y, b.leave)) leavePlanetarium();
  }
}
function chooseOffer(i) {
  applyUpgrade(offers[i]);
  /* Two Minds: every fifth level, the card you did not take comes with you.
     Taken from the remaining offers so the choice still costs something. */
  if (P.twoMinds && P.level % 5 === 0) {
    const rest = offers.filter((o, k) => k !== i);
    if (rest.length) {
      const extra = rest[rndi(rest.length)];
      applyUpgrade(extra);
      floatText(P.x, P.y - 56, 'TWO MINDS', '#fbbf24', 16);
    }
  }
  if (P.tithe) {
    const heal = Math.round(P.maxHp * 0.18 * P.tithe);
    P.hp = Math.min(P.maxHp, P.hp + heal);
    floatText(P.x, P.y - 44, '+' + heal + ' HP', COL.hp, 15);
  }
  offers = [];
  state = 'play';
  Audio_.select();
  if (P.xp >= P.xpNext) checkLevel();
}
function checkLevel() {
  // Never open over a shop, planetarium or gate. updatePickups() runs after
  // updateWaves() in the same tick, so a wave-clear XP payout could otherwise
  // replace the reward room that just opened. Every overlay calls back into
  // this after restoring 'play', so nothing is lost — only deferred.
  if (state !== 'play') return;
  /* A scripted sequence is not a state — it runs inside 'play' — so the check
     above does not see one. Killing ROOT pays enough score to owe a level, and
     the card stack opened straight over its closing lines while the sequence,
     which only ticks in play, sat frozen underneath. Deferred like any other
     overlay: these all call back here when they are finished. */
  if (rootOut || outro || intrusion || amalCut) return;
  if (chalNoLevel()) { P.xp = 0; return; }    // this sheet offers nothing, ever
  if (P.xp >= P.xpNext) {
    P.xp -= P.xpNext;
    P.level++;
    P.xpNext = Math.round(8 + P.level * 5 + Math.pow(P.level, 1.65) * 1.6);
    offers = offerUpgrades();
    // Blood Price is charged when the extra card is dealt, not when it is taken
    if (P.bloodP && offers.length > 3) {
      const cost = Math.max(1, Math.round(P.maxHp * 0.12));
      P.hp = Math.max(1, P.hp - cost);
      floatText(P.x, P.y - 40, '-' + cost + ' HP', '#fca5a5', 15);
    }
    if (offers.length) { state = 'levelup'; uiArm = 0.4; Audio_.levelup(); }
  }
}

/* ------------------------------- game loop -------------------------------- */
let last = performance.now(), acc = 0;
const STEP = 1 / 60;

let frameErrors = 0;
function frame(now) {
  if (pageDead) return;                  // the page has stopped; do not requeue
  const dt = Math.min(0.2, (now - last) / 1000);
  lastDT = dt;                           // render() draws the pointer with it
  fpsSample(dt);
  last = now;
  acc += dt;
  let guard = 0;
  try {
    // freeplay can scale time; the step itself stays fixed so physics is intact
    const reps = freeRun && freeSpd > 1 ? Math.round(freeSpd) : 1;
    const slow = freeRun && freeSpd < 1 ? freeSpd : 1;
    while (acc >= STEP && guard++ < 5) {
      for (let k = 0; k < reps; k++) update(STEP * slow);
      acc -= STEP;
    }
    if (acc > STEP) acc = 0;
    render();
  } catch (err) {
    // A thrown frame used to kill the rAF loop outright and freeze the
    // game mid-run. Drop the frame, keep the loop alive; losing a
    // 40-minute run to one exception is never the right trade.
    frameErrors++;
    if (frameErrors <= 5) console.error('VOIDRUNNER frame error:', err);
    acc = 0;
  }
  requestAnimationFrame(frame);
}

function update(dt) {
  // camera shake decay and the cosmetic clock always run, even while dead or
  // paused, so overlay animations never freeze
  uiTime += dt;
  cam.trauma = Math.max(0, cam.trauma - dt * 1.5);
  const tr = cam.trauma * cam.trauma;
  cam.sx = rnd(1, -1) * 26 * tr;
  cam.sy = rnd(1, -1) * 26 * tr;
  drawFlashT = Math.max(0, drawFlashT - dt);
  // the link is kept alive on its own clock, whatever the game is doing
  netTick(dt);
  mpHostNet(dt);
  if (MP.lostT > 0) MP.lostT -= dt;

  if (state === 'menu' || state === 'name') { updateMenu(dt); return; }
  if (state === 'lan') { updateLan(dt); return; }
  if (state === 'chal') { updateMenu(dt); if (uiArm > 0) uiArm -= dt; return; }
  if (state === 'settings') {
    if (setFrom === 'menu') updateMenu(dt);
    if (uiArm > 0) uiArm -= dt;
    return;
  }
  /* A guest simulates nothing: it eases the host's picture forward, predicts
     its own hull and draws. This sits above the pause check on purpose — a
     paused guest still has to keep receiving, or the host runs away from it. */
  if (mpGuest()) { mpGuestUpdate(dt); return; }
  if (state === 'pause') return;
  /* Ahead of the wave ticker on purpose: it clears the floor, and if the
     spawner still ran the room would quietly refill behind the moment. */
  if (intrusion) { intrusionTick(dt); return; }
  if (amalOpen) { amalOpenTick(dt); return; }
  if (choice)   { choiceTick(dt); return; }
  if (campVisit) { campVisitTick(dt); return; }

  // cosmetic layers keep running during level-up / shop / death for smoothness
  updateParticles(dt);
  updateGWaves(dt);
  updateMalFx(dt);
  if (state === 'amalcut') {               // the assembly plays on its own clock
    if (uiArm > 0) uiArm -= dt;
    updateAmalCut(dt);
    /* Frame the thing being built, not the player. The camera normally tracks
       the ship, which during assembly leaves the body almost entirely offscreen
       — you would watch a cutscene about its ankles. */
    const b = amalBodyPos();
    const k = 1 - Math.exp(-3.2 * dt);
    cam.x = lerp(cam.x, b.x, k);
    cam.y = lerp(cam.y, b.y - 20, k);
    cam.trauma = Math.max(0, cam.trauma - dt * 1.4);
    cam.sx = rnd(1, -1) * cam.trauma * 26;
    cam.sy = rnd(1, -1) * cam.trauma * 26;
    camZoomT = 0.6;
    camZoom += (camZoomT - camZoom) * (1 - Math.exp(-2.4 * dt));
    updateParticles(dt);
    return;
  }
  if (state === 'levelup' || state === 'shop' || state === 'planet' ||
      state === 'library' || state === 'talk' || state === 'devtalk' ||
      state === 'gfx' || state === 'dead') {
    if (shopMsgT > 0) shopMsgT -= dt;
    if (uiArm > 0) uiArm -= dt;
    if (state === 'devtalk') devTypeTick(dt);
  if (state === 'gfx' && fxMeasuring) fxMeasureStep();
    updateCamera(dt, state === 'dead');
    return;
  }
  uiArm = 0;

  if (hitStop > 0) { hitStop -= dt; updateCamera(dt); return; }

  elapsed += dt;
  Audio_.update(clamp(enemies.length / 26 + wave / 22, 0, 1));

  // Bullet Time slows the world but never the player
  slowmo = P.stopT > 0 ? 0
         : (P.bullettime && P.hp / P.maxHp < 0.3) ? 0.55 : 1;
  const wdt = dt * slowmo;

  chalTick(dt);              // the rule sheet, where it touches the frame
  rewardTick(dt);            // and the rewards that run on their own clocks
  rewardDashSweep(dt);
  updateWaves(dt);
  updatePlayer(dt);
  mpHostTick(dt);            // the wingman flies inside the same tick you do
  if (!P.down) updateDrones(dt);   // your escort does not fight over your wreck
  updateSentries(dt);
  /* Stood down from here rather than inside unwUpdate: if both halves are gone
     the boss shell never calls the AI again, so the check has to live somewhere
     that still runs. A dev-console room clear used to leave the fight object
     resident with no bodies. */
  if (unwritten && unwDeadT <= 0 &&
      ((!unwritten.a || unwritten.a.dead) || (!unwritten.b || unwritten.b.dead))) {
    for (const z of [unwritten.a, unwritten.b])
      if (z && !z.dead) { z.floor = undefined; z.dead = true; }
    unwritten = null; unwTears = []; unwDeadT = 0; bossAlive = false;
  }
  if (amalgam) amalUpdate(dt);
  /* He is owed a word, and he waits for the floor to be clear to take it.
     This used to be a one-shot timer that checked state === 'play' once and
     gave up: a level-up or a shop open at that instant dropped the monologue,
     and since beating THE UNWRITTEN sets trueEnd the keeper would never offer
     the fight again — so the amalgam was gone for good. */
  /* First run after an update that added effects: show what is new and let
     them be turned off before anything heavy is on screen. */
  if (Save.profile.gfxSeen !== GFX_VER && state === 'play' && !amalgam && !amalCut) {
    gfxFirstRun = true;
    openGfx('play');
    return;
  }
  keyTick(dt);
  if (rootDeath) rootDeathTick(dt);
  if (tribunal) tribunalTick(dt);
  if (tear) tearTick(dt);
  if (rootOut) rootOutroTick(dt);
  if (outro) outroTick(dt);
  /* startDevTalk() empties the floor, so he may only take his word when there
     is nothing standing on it. The named checks below were every fight that
     existed when he was written; bossAlive covers the rest — ROOT, THE
     SHOPKEEPER, and any stage boss, all of which he would otherwise delete
     mid-fight to deliver a monologue. */
  /* Or you are holding ROOT's key, which is the only reason he would raise it
     twice. Without this the key was unreachable content on every save: beating
     the amalgam sets amalgamDone, amalgamDone stops him ever asking again, and
     the key only works once amalgamDone is set. */
  if (Save.profile.devTalkDue && (!Save.profile.amalgamDone || P.key > 0) && !devTalkSaidNo &&
      !unwritten && !amalgam && !amalCut && !root && !bossAlive && unwDeadT <= 0) {
    devTalkT -= dt;
    if (devTalkT <= 0) startDevTalk();
  }
  // pull the view out for the amalgam, ease back afterwards
  camZoomT = (amalgam || amalCut) ? 0.6 : 1;
  camZoom += (camZoomT - camZoom) * (1 - Math.exp(-2.4 * dt));
  updateArena(dt);
  updateDeepNodes(dt);
  updatePortals(dt);
  updateLibrary(dt);
  replay.push({ x: P.x, y: P.y, ang: P.ang });
  if (replay.length > 260) replay.shift();
  updateEnemies(wdt);
  updateStageAmbient(dt);
  updateHazards(wdt);
  updateMortars(wdt);
  updateCages(dt);
  updateBullets(dt);
  updateEBullets(wdt);
  updateBeams(dt);
  updatePickups(dt);
  updateCamera(dt);
  bannerT = Math.max(0, bannerT - dt);
}

function updateMenu(dt) {
  // idle ambience: drifting sparks
  if (Math.random() < 0.5) {
    spawnPart(rnd(W), rnd(H), rnd(24, -24), rnd(24, -24), rnd(2.4, 0.8),
      pick([COL.player, '#f472b6', '#c084fc']), rnd(2.4, 1.2), 0.995);
  }
  updateParticles(dt);
}

function updateCamera(dt, loose = false) {
  const k = loose ? 2.2 : 6.2;
  /* Down in co-op: watching your own wreck from a fixed angle while the fight
     that decides whether you get back up happens offscreen is the worst seat
     in the house. The camera rides with whoever is still flying. */
  const S = mpCamSubject();
  // look slightly ahead of the aim direction
  const ax = Math.cos(S.ang) * 60, ay = Math.sin(S.ang) * 60;
  const tx = clamp(S.x + ax, W / 2 - 120, WORLD.w - W / 2 + 120);
  const ty = clamp(S.y + ay, H / 2 - 120, WORLD.h - H / 2 + 120);
  cam.x = lerp(cam.x, W > WORLD.w ? WORLD.w / 2 : tx, 1 - Math.exp(-k * dt));
  cam.y = lerp(cam.y, H > WORLD.h ? WORLD.h / 2 : ty, 1 - Math.exp(-k * dt));
}

/* ------------------------------ player logic ------------------------------ */
function updatePlayer(dt) {
  /* Downed in co-op: the ship is a wreck on the floor. It does not steer,
     shoot, dash, regenerate or run a single one of its upgrades — it drifts
     to a stop and smokes until the wave is cleared. */
  if (P.down) {
    P.vx *= Math.pow(0.02, dt); P.vy *= Math.pow(0.02, dt);
    P.x = clamp(P.x + P.vx * dt, arena.x0 + P.r, arena.x1 - P.r);
    P.y = clamp(P.y + P.vy * dt, arena.y0 + P.r, arena.y1 - P.r);
    P.hurtFlash = Math.max(0, P.hurtFlash - dt * 2.4);
    if (P.ghosts.length) P.ghosts.shift();
    if (Math.random() < 0.35)
      spawnPart(P.x + rnd(12, -12), P.y + rnd(12, -12), rnd(20, -20), rnd(-30, -8),
                rnd(3, 1.4), COL.player, rnd(0.6, 0.3), 0.94);
    return;
  }
  let ix = 0, iy = 0;
  if (keys['a'] || keys['arrowleft'])  ix -= 1;
  if (keys['d'] || keys['arrowright']) ix += 1;
  if (keys['w'] || keys['arrowup'])    iy -= 1;
  if (keys['s'] || keys['arrowdown'])  iy += 1;
  if (touchUI.move) {
    const dx = touchUI.move.x - touchUI.move.ox, dy = touchUI.move.y - touchUI.move.oy;
    const d = len(dx, dy);
    if (d > 6) { const m = Math.min(1, d / 62) / d; ix = dx * m; iy = dy * m; }
  }
  const il = len(ix, iy);
  if (il > 1) { ix /= il; iy /= il; }

  // aim
  mouse.wx = (aimX() - W / 2 - cam.sx) / camZoom + cam.x;
  mouse.wy = (aimY() - H / 2 - cam.sy) / camZoom + cam.y;
  let firing = mouse.down || autoFire || keys['j'] || chalAuto();
  if (haltFrozen()) firing = false;     // THE HALT: you may move or act, not both
  if (isTouch) {
    if (touchUI.aim) {
      const dx = touchUI.aim.x - touchUI.aim.ox, dy = touchUI.aim.y - touchUI.aim.oy;
      if (len(dx, dy) > 10) { P.ang = Math.atan2(dy, dx); firing = true; }
      else firing = true;
    } else {
      firing = false;
      const t = nearestEnemy(P.x, P.y, 900);
      if (t) { P.ang = angLerp(P.ang, Math.atan2(t.y - P.y, t.x - P.x), 0.2); firing = true; }
    }
  } else {
    P.ang = Math.atan2(mouse.wy - P.y, mouse.wx - P.x);
  }

  // dash
  if (P.dashCh < P.dashMax) {
    P.dashRe += dt;
    if (P.dashRe >= P.dashCd) { P.dashRe = 0; P.dashCh++; }
  }
  const wantDash = (keys[' '] || keys['shift']) && !P.rooted;

  /* Malware overwrites the dash: same charge economy, entirely different verb.
     It never falls through to the blink or to the dash-triggered upgrades. */
  if (P.malware && wantDash && P.dashCh > 0 && P.dashT <= 0) {
    keys[' '] = false; keys['shift'] = false;
    P.dashCh--;
    burst(P.x, P.y, 16, P.malware.col, 240, 3, 0.4);
    malSurge(P.x, P.y, 120, P.malware.col, 0.45);
    malGlitch(P.x, P.y, 70, P.malware.col, 0.3);
    P.malware.f();
  } else if (wantDash && P.dashCh > 0 && P.dashT <= 0) {
    keys[' '] = false; keys['shift'] = false;
    P.dashCh--;
    P.dashT = 0.17; P.iframe = Math.max(P.iframe, 0.28);
    let dx = ix, dy = iy;
    if (!il) { dx = Math.cos(P.ang); dy = Math.sin(P.ang); }
    P.dashDX = dx; P.dashDY = dy;
    onRewardDash(dx, dy);
    for (const en of enemies) en.dashTagged = false;
    Audio_.dash();
    burst(P.x, P.y, 18, COL.player, 240, 3, 0.4, 1.4, Math.atan2(-dy, -dx));
    if (P.shockwave)
      playerBlast(P.x, P.y, 80 + 34 * P.shockwave, (10 + 10 * P.shockwave) * (1 + wave * 0.08), COL.player);
    if (P.cryonova) {
      const R = 150 + 50 * P.cryonova;
      ringFx(P.x, P.y, 10, R, '#93c5fd', 0.45, 3);
      for (const e of enemies) {
        if (e.dead || len(e.x - P.x, e.y - P.y) > R) continue;
        e.slow = Math.min(0.75, 0.34 * P.cryonova);
        e.slowT = 2.2 + P.cryonova * 0.6;
      }
      Audio_.tone(900, 0.25, 'sine', 0.09, 300);
    }
    if (P.sentryUp && sentries.length < P.sentryUp + 1) {
      sentries.push({ x: P.x, y: P.y, ang: P.ang, cd: 0.3, life: 11,
                      dmg: (P.dmg * 0.7 + 4) * (P.symb ? 1 + P.symb : 1) });
      ringFx(P.x, P.y, 6, 42, COL.player, 0.3, 2);
      Audio_.tone(360, 0.12, 'square', 0.07, 620);
    }
  }

  // movement
  if (P.dashT > 0) {
    P.dashT -= dt;
    const ds = 1080;
    P.vx = P.dashDX * ds; P.vy = P.dashDY * ds;
    // a silhouette dropped every frame, so the dash leaves a body behind it
    P.ghosts.push({ x: P.x, y: P.y, ang: P.ang, t: 1, phase: P.ghost > 0 });
    if (P.ghosts.length > 14) P.ghosts.shift();
    if (Math.random() < 0.85)
      spawnPart(P.x, P.y, rnd(50, -50), rnd(50, -50), rnd(6, 3), COL.player, 0.3, 0.9);
  } else {
    if (P.ghosts.length) P.ghosts.shift();   // the trail drains once you land
    // acid chills you, Tempo kicks in after a kill
    const spdMul = (1 - playerChill) * (P.tempoT > 0 ? 1.35 : 1)
                 * (P.burrowT > 0 ? 1.8 : 1)
                 * (P.after && firing ? 1 + 0.4 * P.after : 1);
    const tvx = ix * P.speed * spdMul, tvy = iy * P.speed * spdMul;
    const k = 1 - Math.exp(-16 * dt);
    P.vx = lerp(P.vx, tvx, k);
    P.vy = lerp(P.vy, tvy, k);
  }
  P.x = clamp(P.x + P.vx * dt, arena.x0 + P.r, arena.x1 - P.r);
  P.y = clamp(P.y + P.vy * dt, arena.y0 + P.r, arena.y1 - P.r);
  collideMirrors(P, P.r);
  P.x = clamp(P.x, arena.x0 + P.r, arena.x1 - P.r);
  P.y = clamp(P.y, arena.y0 + P.r, arena.y1 - P.r);

  // engine trail
  if (len(P.vx, P.vy) > 40 && Math.random() < 0.6) {
    const a = Math.atan2(-P.vy, -P.vx);
    spawnPart(P.x + Math.cos(a) * 8, P.y + Math.sin(a) * 8,
      Math.cos(a) * rnd(70, 20) + rnd(20, -20), Math.sin(a) * rnd(70, 20) + rnd(20, -20),
      rnd(3.4, 1.6), '#38bdf8', rnd(0.34, 0.16), 0.9);
  }

  // shooting
  P.fireT -= dt;
  const rateMul = 1 + (P.bloodlust ? 0.07 * P.bloodlust * P.blStacks : 0)
                    + (P.rolling ? 0.03 * P.rolling * (P.rollN || 0) : 0);
  // the diary replaces the weapon outright — drop any beam still standing
  if (P.diaryT > 0 && P.laserT > 0) { P.laserT = 0; P.laserSegs.length = 0; P.laserEnv = 0; }

  if (P.weapon === 'laser' && P.diaryT <= 0) {
    updateLance(dt);
    // The beam has to go out before the next charge starts, so fire rate buys
    // uptime: at the 250% floor the gap is short enough to read as autofire.
    if (P.laserT <= 0) {
      if (firing) {
        P.charge += dt * rateMul / chargeTime();
        if (P.charge >= 1) { P.charge = 0; fireLance(); }
      } else {
        P.charge = Math.max(0, P.charge - dt * 1.6);   // bleeds off if released
      }
    }
  } else if (firing && P.fireT <= 0 && P.diaryT <= 0) {
    P.fireT = 1 / (P.fireRate * rateMul);
    const muzzle = P.r + 6;
    const spread = P.spread;
    const mx = P.x + Math.cos(P.ang) * muzzle, my = P.y + Math.sin(P.ang) * muzzle;
    const nx = -Math.sin(P.ang), ny = Math.cos(P.ang);   // barrel offset axis
    P.ocCount++;
    const slug = P.overcharge > 0 && P.ocCount % 7 === 0;

    for (let lane = 0; lane <= P.parallel; lane++) {
      const off = lane === 0 ? 0 : (lane % 2 ? 1 : -1) * Math.ceil(lane / 2) * 17;
      for (let i = 0; i < P.count; i++) {
        const a0 = P.count === 1 ? 0 : (i - (P.count - 1) / 2) * (spread * 1.9);
        const a = P.ang + a0 + rnd(spread, -spread) * 0.5;
        if (slug) fireBullet(mx + nx * off, my + ny * off, a,
                             1.6 + 0.7 * P.overcharge, { rm: 2.1, sm: 0.86, pierce: 2 });
        else      fireBullet(mx + nx * off, my + ny * off, a);
      }
    }
    if (P.back) {
      for (let i = 0; i < P.back; i++) {
        const a = P.ang + Math.PI + (i - (P.back - 1) / 2) * 0.2;
        fireBullet(P.x - Math.cos(P.ang) * muzzle, P.y - Math.sin(P.ang) * muzzle, a, 0.8);
      }
    }
    if (twinActive()) twinFire();
    onPlayerShot(mx, my, P.ang);
    if (slug) { Audio_.tone(190, 0.16, 'square', 0.13, 70); shake(0.09); }
    else Audio_.shoot();
    P.vx -= Math.cos(P.ang) * 26; P.vy -= Math.sin(P.ang) * 26;
    burst(mx, my, slug ? 8 : 3, slug ? COL.crit : COL.bullet, 170, 2.4, 0.18, 0.9, P.ang);
    shake(0.012 * Math.min(3, P.count));
  }

  // static field: a constant low-damage aura, ticked on its own clock
  if (P.staticF) {
    P.staticT -= dt;
    if (P.staticT <= 0) {
      P.staticT = 0.35;
      const R = 92 + 26 * P.staticF;
      let touched = false;
      for (const e of enemies) {
        if (e.dead || e.phased || e.invuln) continue;
        if (len(e.x - P.x, e.y - P.y) < R + e.r) {
          damageEnemy(e, (4 + P.dmg * 0.28) * P.staticF, false, P.x, P.y, { silent: true, noChain: true });
          touched = true;
        }
      }
      if (touched) {
        ringFx(P.x, P.y, R * 0.55, R, '#7dd3fc', 0.22, 2);
        Audio_.tone(180, 0.06, 'sine', 0.035, 90);
      }
    }
  }

  // regen / shield / timers
  if (P.regen && !chalNoHeal()) P.hp = Math.min(P.maxHp, P.hp + P.regen * dt);
  if (P.shieldMax) {
    if (P.shield < P.shieldMax) {
      P.shieldT += dt;
      if (P.shieldT > 9) { P.shieldT = 0; P.shield++;
        ringFx(P.x, P.y, 10, 60, COL.shield, 0.4, 2);
        Audio_.tone(700, 0.14, 'sine', 0.09, 1200); }
    }
  }
  /* ---------------------- zodiac mechanics ---------------------- */

  // LEO: you are a small sun. Everything close enough simply burns.
  if (P.sun) {
    P.sunT -= dt;
    if (P.sunT <= 0) {
      P.sunT = 0.25;
