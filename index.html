/* ===========================================================================
   CHALLENGE REWARDS — the mechanics
   The fifty rewards deliberately do not reuse a single base upgrade's effect,
   so each one needs somewhere to live. They are gathered here rather than
   scattered so the whole set can be read at once, and they route through six
   entry points the rest of the file calls:

     rewardMul()        damage multipliers that depend on you and the clock
     rewardTargetMul(e) multipliers that depend on what is being hit
     onPlayerShot()     the shot clock: echoes, counters, charges, heat
     onRewardKill(e)    the kill ledger: harvest, banks, trophies
     onRewardHurt(d)    being hit: counters, grudges, shells
     onRewardDash()     the dash line: slipknots, contrails, refunds
     onRewardWave()     the wave boundary: interest, resets, assembly

   All of them are no-ops on a profile that has unlocked nothing, and none of
   them are reachable from the base pool.
   ========================================================================= */

/* Player-state multipliers, folded into stanceMul so every weapon picks them
   up: bullets, the lance, the twin and everything that routes through it. */
/* Refreshed once a frame by rewardTick, because every term below is read
   once per projectile and two of them used to walk the entire enemy list
   to do it. */
const RC = { live: 0, near: 0, closest: 1e9 };
function rewardScan() {
  if (!(P.lastS || P.crowd || P.isolate)) return;
  let live = 0, near = 0, closest = 1e9;
  for (const e of enemies) {
    if (!isThreat(e)) continue;
    live++;
    const d = len(e.x - P.x, e.y - P.y);
    if (d < closest) closest = d;
    if (d < 220) near++;
  }
  RC.live = live; RC.near = near; RC.closest = closest;
}

function rewardMul() {
  let m = 1;
  if (P.heat)    m *= 1 + Math.min(0.6, (P.heatN || 0) * 0.05) * P.heat;
  if (P.grudge)  m *= 1 + (P.grudgeN || 0) * 0.08 * P.grudge;
  if (P.trophy)  m *= 1 + (P.trophyN || 0) * 0.12 * P.trophy;
  if (P.assembly) m *= 1 + (P.assemblyN || 0) * 0.02;
  if (P.sundial) m *= 1 + Math.floor((P.waveClock || 0) / 10) * 0.04 * P.sundial;
  if (P.firstB && (P.waveClock || 0) < 6) m *= 1 + 0.9 * P.firstB;
  if (P.deadline) m *= 1.45;
  if (P.nightS && wave % 3 === 0) m *= 2;
  if (P.lastS && RC.live > 0 && RC.live <= 3) m *= 1 + 0.7 * P.lastS;
  if (P.wallA) {
    const d = Math.min(P.x - arena.x0, arena.x1 - P.x, P.y - arena.y0, arena.y1 - P.y);
    if (d < 130) m *= 1 + 0.45 * P.wallA;
  }
  if (P.centerM) {
    const cx = (arena.x0 + arena.x1) / 2, cy = (arena.y0 + arena.y1) / 2;
    const w = (arena.x1 - arena.x0) / 6, h = (arena.y1 - arena.y0) / 6;
    if (Math.abs(P.x - cx) < w && Math.abs(P.y - cy) < h) m *= 1 + 0.35 * P.centerM;
  }
  if (P.crowd && RC.near) m *= 1 + Math.min(0.7, RC.near * 0.07) * P.crowd;
  if (P.isolate && RC.closest > 320) m *= 1 + 0.55 * P.isolate;
  return m;
}

/* Multipliers that need to know what is being hit. Applied once, at the top of
   damageEnemy, so drones, chains and blasts all honour them too. */
function rewardTargetMul(e) {
  let m = 1;
  if (P.brand) {
    if (e.branded) m *= 1 + 0.35 * P.brand;
    else e.branded = true;               // the first hit only marks it
  }
  if (P.tag && P.lastTarget && P.lastTarget !== e) m *= 1 + 0.3 * P.tag;
  if (P.tag) P.lastTarget = e;
  if (P.conduct && (e.slowT > 0 || e.slow > 0)) m *= 1 + 0.5 * P.conduct;
  if (P.slipknot && e.slipT > 0) m *= 1 + 0.45 * P.slipknot;
  return m;
}

/* On-hit effects that are not multipliers. Returns true if the target was
   deleted outright, so the caller can stop working on a corpse. */
function onRewardHit(e, crit, direct) {
  if (P.suppress && direct && !(e.suppT > 0)) {
    e.cd = (e.cd || 0) + 0.6 * P.suppress;
    e.suppT = 2;
  }
  if (P.spall && crit) {
    if (e.dr > 0) e.dr *= 0.75;
    if (e.armor > 0) { e.armor *= 0.75; e.absorb *= 0.75; }
  }
  if (P.erasure && direct && e.type !== 'boss') {
    P.eraseN = (P.eraseN || 0) + 1;
    if (P.eraseN >= 20) {
      P.eraseN = 0;
      floatText(e.x, e.y - e.r - 10, 'ERASED', '#f8fafc', 16);
      ringFx(e.x, e.y, e.r, e.r * 3, '#f8fafc', 0.4, 3);
      e.hp = 0;
      return true;
    }
  }
  return false;
}

/* ------------------------------- the shot --------------------------------- */
/* Called once per volley, after the volley has gone out. The echo queue is a
   list of shots owed rather than a timer per bullet, so a build stacking
   Echo Chamber with Split Barrel does not turn into a scheduling problem. */
function onPlayerShot(mx, my, ang) {
  if (P.cold) { P.coldReady = false; P.coldT = 0; }
  if (P.blinkC) P.blinkReady = false;
  if (P.heat) { P.heatN = Math.min(12, (P.heatN || 0) + 1); P.heatT = 0.55; }
  if (P.echo) {
    P.echoQ = P.echoQ || [];
    if (P.echoQ.length < 8) P.echoQ.push({ t: 0.16, x: mx, y: my, a: ang });
  }
  if (P.tick10) {
    P.shotN = (P.shotN || 0) + 1;
    if (P.shotN >= 10) {
      P.shotN = 0;
      const tx = clamp(mouse.wx, arena.x0 + 40, arena.x1 - 40);
      const ty = clamp(mouse.wy, arena.y0 + 40, arena.y1 - 40);
      mortars.push({ x: tx, y: ty, r: 96 + 22 * P.tick10, t: 0.9, max: 0.9,
                     dmg: (P.dmg * 4 + 22) * P.tick10, col: COL.crit, mine: true });
      Audio_.tone(150, 0.18, 'triangle', 0.09, 70);
    }
  }
}

/* The multiplier a single shot leaves with. Consumed rather than sampled: a
   cold barrel and a blink charge are each worth exactly one shot. */
function rewardShotMul() {
  let m = 1;
  if (P.cold && P.coldReady) m *= 1 + 2.5 * P.cold;
  if (P.blinkC && P.blinkReady) m *= 3;
  return m;
}

/* ------------------------------- the kill --------------------------------- */
function onRewardKill(e) {
  if (P.harvest) {
    P.harvestN = (P.harvestN || 0) + 1;
    if (P.harvestN >= 9 - Math.min(3, P.harvest)) {
      P.harvestN = 0;
      drops.push(mkDrop(e.x, e.y, 'heal'));
    }
  }
  if (P.requis) {
    P.requisN = (P.requisN || 0) + 1;
    if (P.requisN >= 11 - Math.min(4, P.requis)) {
      P.requisN = 0;
      const each = Math.max(2, Math.round((3 + wave * 0.6) * P.credMul));
      for (let i = 0; i < 3; i++) {
        const c = mkDrop(e.x + rnd(24, -24), e.y + rnd(24, -24), 'credit');
        c.v = each;
        c.vx = rnd(180, -180); c.vy = rnd(180, -180);
        drops.push(c);
      }
    }
  }
  if (P.rolling) P.rollN = (P.rollN || 0) + 1;
  if (P.shatter && e.elite) {
    for (let i = 0; i < 6 + 3 * P.shatter; i++) {
      const a = rnd(TAU);
      gems.push({ x: e.x, y: e.y, vx: Math.cos(a) * rnd(180, 60), vy: Math.sin(a) * rnd(180, 60),
                  r: 4, v: e.xp * 0.4, life: 9 });
    }
  }
  if (P.bank) {
    P.bankN = (P.bankN || 0) + 1;
    if (P.bankN >= 25) { P.bankN = 25; P.bankReady = true; }
  }
  if (P.trophy && e.type === 'boss') P.trophyN = (P.trophyN || 0) + 1;
  /* Chain Reaction: a body killed by a blast takes the next one with it. The
     guard is what keeps a room from detonating itself to the last enemy. */
  if (P.chainR && e.byBlast && !e.chained) {
    e.chained = true;
    playerBlast(e.x, e.y, 90 + 30 * P.chainR, (14 + P.dmg * 0.8) * P.chainR, '#fb923c');
  }
}

/* ------------------------------ taking a hit ------------------------------ */
function onRewardHurt(dmg, src) {
  P.shellT = 0;
  if (P.shell && P.shellUp) {
    P.shellUp = false;                    // absorbed elsewhere; this is the reset
  }
  if (P.grudge) P.grudgeN = (P.grudgeN || 0) + 1;
  if (P.counter) {
    const n = 8 + 4 * P.counter;
    for (let i = 0; i < n; i++)
      fireBullet(P.x, P.y, (i / n) * TAU, 0.7, { noFrag: true });
    Audio_.tone(420, 0.12, 'square', 0.09, 200);
  }
  if (P.feedback && src && !src.dead) {
    damageEnemy(src, dmg * 2 * P.feedback, false, P.x, P.y, { silent: true });
    arcs.push({ x1: P.x, y1: P.y, x2: src.x, y2: src.y, life: 0.18, max: 0.18, col: '#fde68a' });
  }
}

/* ------------------------------- the dash --------------------------------- */
function onRewardDash(dx, dy) {
  if (P.contrail) {
    for (let i = 1; i <= 4; i++)
      addHazard('fire', P.x + dx * 46 * i, P.y + dy * 46 * i, 3.2,
                { friendly: true, r: 46, dmg: (8 + P.dmg * 0.5) * P.contrail });
  }
  if (P.bank && P.bankReady) {
    P.bankReady = false; P.bankN = 0;
    playerBlast(P.x, P.y, 190 + 40 * P.bank, (30 + P.dmg * 2) * P.bank, COL.crit);
    shake(0.6);
  }
  if (P.blinkC) P.blinkReady = true;
  P.dashHits = 0;                          // counted by the dash-through test
}

/* ------------------------------ the wave line ----------------------------- */
/* Everything that resets, pays out or accumulates at a wave boundary. */
function onRewardWave() {
  if (P.interest) {
    const paid = Math.round(credits * 0.05 * P.interest);
    if (paid > 0) {
      credits += paid;
      floatText(P.x, P.y - 58, '+' + paid + ' INTEREST', '#fbbf24', 14);
    }
  }
  if (P.otime && (P.waveClock || 0) < 25) {
    P.xp += P.xpNext * 0.33 * P.otime;
    floatText(P.x, P.y - 72, 'OVERTIME', '#38bdf8', 14);
  }
  if (P.ledger) {
    P.shieldMax = Math.min(6, P.shieldMax + 1);
    P.shield = P.shieldMax;
    floatText(P.x, P.y - 44, 'LEDGER  +1', COL.shield, 15);
  }
  if (P.assembly) {
    P.assemblyN = (P.assemblyN || 0) + 1;
    P.maxHp += 2; P.hp += 2;
  }
  if (P.deadline) {
    P.deadlineT = (P.deadlineT || 0) + 40;
    floatText(P.x, P.y - 86, '+40s', '#f87171', 15);
  }
  P.grudgeN = 0;
  P.rollN = 0;
  P.waveClock = 0;
  if (P.salvage) P.salvageUsed = false;
}

/* ------------------------------ per frame --------------------------------- */
/* The timers. Kept in one place so a reward can never quietly stop ticking
   because it was wired into a branch that some other state returns out of. */
function rewardTick(dt) {
  P.waveClock = (P.waveClock || 0) + dt;
  // the ledger is worth one point and stays worth one point
  if (P.ledger) { P.maxHp = 1; P.hp = Math.min(P.hp, 1); }
  rewardScan();

  if (P.echo && P.echoQ && P.echoQ.length) {
    for (let i = P.echoQ.length - 1; i >= 0; i--) {
      const q = P.echoQ[i];
      q.t -= dt;
      if (q.t <= 0) {
        P.echoQ.splice(i, 1);
        fireBullet(P.x, P.y, q.a, 0.55 * P.echo, { noFrag: true });
        Audio_.tone(760, 0.05, 'square', 0.035, 900);
      }
    }
  }

  if (P.cold) {
    P.coldT = (P.coldT || 0) + dt;
    if (P.coldT > 1.2) P.coldReady = true;
  }
  if (P.heat) {
    P.heatT = (P.heatT || 0) - dt;
    if (P.heatT <= 0 && P.heatN) { P.heatN = Math.max(0, P.heatN - 1); P.heatT = 0.35; }
  }
  if (P.shell) {
    P.shellT = (P.shellT || 0) + dt;
    if (!P.shellUp && P.shellT > 5) {
      P.shellUp = true;
      ringFx(P.x, P.y, P.r, 46, COL.shield, 0.35, 3);
      Audio_.tone(880, 0.1, 'sine', 0.06, 1200);
    }
  }
  if (P.deadman && P.brakeT > 0) {
    P.brakeT -= dt;
    slowmo = Math.min(slowmo, 0.25);
  }
  if (P.deadline) {
    P.deadlineT -= dt;
    if (P.deadlineT <= 0) {
      P.deadlineT = 0;
      banner('DEADLINE', '#f87171', 2.0);
      hurtPlayer(1e9, { pure: true });
    }
  }
  // slipknot marks and suppression both run down on the enemies themselves
  for (const e of enemies) {
    if (e.slipT > 0) e.slipT -= dt;
    if (e.suppT > 0) e.suppT -= dt;
  }
}

/* The dash-through test: Slipknot marks, Kickstart refunds, Phase Debt eats
   incoming fire. One pass, run while the dash is live. */
function rewardDashSweep(dt) {
  if (P.dashT <= 0) return;
  if (P.slipknot || P.kick) {
    for (const e of enemies) {
      if (e.dead || e.dashTagged) continue;
      if (len(e.x - P.x, e.y - P.y) < e.r + P.r + 6) {
        e.dashTagged = true;
        if (P.slipknot) e.slipT = 4;
        P.dashHits = (P.dashHits || 0) + 1;
        if (P.kick && P.dashHits === 2 && P.dashCh < P.dashMax) {
          P.dashCh++;
          floatText(P.x, P.y - 34, 'KICKSTART', '#67e8f9', 14);
        }
      }
    }
  }
  if (P.phaseD) {
    for (let i = ebullets.length - 1; i >= 0; i--) {
      const b = ebullets[i];
      if (len(b.x - P.x, b.y - P.y) > b.r + P.r + 10) continue;
      ebullets.splice(i, 1);
      burst(b.x, b.y, 5, '#5eead4', 180, 2.2, 0.25);
      if (P.hp < P.maxHp) P.hp = Math.min(P.maxHp, P.hp + 1);
    }
  }
}




/* ===========================================================================
   THE HACKER — what it kills, it keeps
   Its gun is deliberately feeble. The weapon is the room: anything it kills
   stands back up on your side and goes to work on whatever is left, eight
   bodies at a time and one boss among them.

   A hacked body is still in the enemies array, because it is still an enemy in
   every way that matters to the renderer, the physics and the crowd. What
   changes is which side it is on, and that is enforced in three places:
   damageEnemy refuses anything you throw at it, nearestEnemy stops seeing it
   so none of your own systems aim at it, and the wave clock stops counting it
   as something standing between you and the next wave.

   The hack is not permanent. It bleeds a little of the body's maximum health
   every second, so an army has to be re-taken rather than accumulated, and a
   ninth kill pushes the oldest one off the end.
   ========================================================================= */
const HACK_COL   = '#a3e635';
const HACK_MAX   = 8;       // bodies held at once
const HACK_BOSS  = 1;       // and bosses among them
const HACK_DECAY = 0.020;   // of max health per second

let hackSerial = 0;

// what still counts as an enemy: alive, and not working for you
const isThreat = e => !e.dead && !e.hacked;
function threatCount() {
  let n = 0;
  for (const e of enemies) if (isThreat(e)) n++;
  return n;
}
function hackedCount(boss) {
  let n = 0;
  for (const e of enemies)
    if (!e.dead && e.hacked && (boss ? e.type === 'boss' : e.type !== 'boss')) n++;
  return n;
}

/* Some bodies cannot be taken: an egg is not a fighter, a bomber has already
   spent itself, a borrowed silhouette is on loan from something else, and the
   endgame does not hand you its pieces. */
function hackable(e) {
  if (!P.hacker || !e || e.hacked) return false;
  if (state !== 'play') return false;
  if (e.type === 'egg' || e.type === 'bomber') return false;
  if (e.shadow > 0 || e.amalPart || e.virus) return false;
  if (e.boss === 'unwritten' || e.boss === 'amalgam') return false;
  return true;
}

/* Called at the very end of killEnemy: the kill has already paid out its
   score, its experience and its drops. This is what happens to the body
   afterwards. Returns true if it was kept. */
function hackTake(e) {
  if (!hackable(e)) return false;
  const boss = e.type === 'boss';
  if (boss) {
    if (hackedCount(true) >= HACK_BOSS) return false;
  } else if (hackedCount(false) >= HACK_MAX) {
    // the oldest one is let go to make room, rather than refusing the newest
    let oldest = null;
    for (const z of enemies)
      if (!z.dead && z.hacked && z.type !== 'boss' &&
          (!oldest || z.hackId < oldest.hackId)) oldest = z;
    if (oldest) hackRelease(oldest, true);
  }

  e.dead = false;
  e.hacked = true;
  e.hackId = ++hackSerial;
  e.hackCd = rnd(0.8, 0.3);
  e.hp = e.maxHp * (boss ? 0.35 : 0.6);
  e.col = HACK_COL;
  e.slow = 0; e.slowT = 0; e.psn = 0; e.psnT = 0; e.leak = 0; e.leakT = 0;
  e.invuln = 0; e.phased = false; e.floor = undefined;
  e.vx *= 0.2; e.vy *= 0.2;

  ringFx(e.x, e.y, e.r * 0.5, e.r * 3.4, HACK_COL, 0.5, 3);
  burst(e.x, e.y, 18, HACK_COL, 240, 3, 0.5);
  malGlitch(e.x, e.y, e.r * 3, HACK_COL, 0.45);
  malTrace(P.x, P.y, e.x, e.y, HACK_COL, 0.5);
  floatText(e.x, e.y - e.r - 10, boss ? 'BOSS HACKED' : 'HACKED', HACK_COL, boss ? 17 : 13);
  Audio_.tone(880, 0.12, 'square', 0.07, 1500);
  if (boss) { Audio_.levelup(); shake(0.4); }
  return true;
}

function hackRelease(e, quiet) {
  e.dead = true;
  burst(e.x, e.y, 14, HACK_COL, 220, 2.8, 0.45);
  if (!quiet) malGlitch(e.x, e.y, e.r * 2.4, HACK_COL, 0.35);
}

/* A hacked body fights with one behaviour rather than its own script. Its own
   script is written around a player — where you are, where you were, how to
   corner you — and none of that survives changing sides. What survives is the
   silhouette and the statline, which is what you are actually collecting. */
function updateHacked(e, dt) {
  e.t += dt;
  e.flash = Math.max(0, e.flash - dt * 7);
  e.hackCd -= dt;

  // the hold degrades: an army is taken again, not saved up
  e.hp -= e.maxHp * HACK_DECAY * dt;
  if (e.hp <= 0) { hackRelease(e); return true; }

  if (Math.random() < 0.18)
    spawnPart(e.x + rnd(e.r, -e.r), e.y + rnd(e.r, -e.r), rnd(20, -20), -24,
              rnd(2.6, 1.2), HACK_COL, rnd(0.45, 0.2), 0.94);

  const boss = e.type === 'boss';
  const t = nearestEnemy(e.x, e.y, 1400);
  if (!t) {
    // nothing to fight: fall in behind whoever is flying it
    const dx = P.x - e.x, dy = P.y - e.y, d = len(dx, dy) || 1;
    const want = 90 + (e.hackId % 5) * 26;
    const push = d > want ? 1 : -0.4;
    steer(e, dx / d * e.spd * push, dy / d * e.spd * push, 2.4, dt);
  } else {
    const dx = t.x - e.x, dy = t.y - e.y, d = len(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;
    e.ang = Math.atan2(dy, dx);
    steer(e, ux * e.spd * (boss ? 1.15 : 1.35), uy * e.spd * (boss ? 1.15 : 1.35),
          boss ? 1.6 : 3.4, dt);

    // it hits what it reaches, and hits harder if it used to be a boss
    if (d < e.r + t.r + 4 && e.hackCd <= 0) {
      e.hackCd = boss ? 0.5 : 0.75;
      damageEnemy(t, (boss ? 46 : 12) + e.dmg * (boss ? 2.4 : 1.6), false, e.x, e.y,
                  { silent: true, enemy: true, noChain: true });
      burst(t.x, t.y, 5, HACK_COL, 190, 2.4, 0.3);
      const a = Math.atan2(t.y - e.y, t.x - e.x);
      t.vx += Math.cos(a) * (boss ? 220 : 90);
      t.vy += Math.sin(a) * (boss ? 220 : 90);
    }
    // and everything that used to shoot at you now shoots at them
    if (e.hackCd <= 0 && d < (boss ? 900 : 640)) {
      e.hackCd = boss ? 1.5 : 1.9;
      const n = boss ? 9 : 1;
      for (let k = 0; k < n; k++) {
        const a = boss ? e.ang + (k - (n - 1) / 2) * 0.22 : e.ang;
        hackShot(e, a, boss ? 300 : 260, (boss ? 22 : 7) + e.dmg * (boss ? 1.4 : 0.9));
      }
      if (boss) { ringFx(e.x, e.y, e.r, e.r + 50, HACK_COL, 0.3, 3); shake(0.06); }
      Audio_.tone(520, 0.05, 'square', 0.035, 260);
    }
  }

  e.x = clamp(e.x + e.vx * dt, arena.x0 + e.r, arena.x1 - e.r);
  e.y = clamp(e.y + e.vy * dt, arena.y0 + e.r, arena.y1 - e.r);
  if (!boss) collideMirrors(e, e.r);
  return false;
}

/* Its fire goes into the friendly array so it collides with enemies and not
   with you. Marked foreign so none of your own per-shot mechanics — heat,
   snapback, the miss penalty — read it as something you fired. */
function hackShot(e, ang, spd, dmg) {
  bullets.push({
    x: e.x + Math.cos(ang) * (e.r + 4), y: e.y + Math.sin(ang) * (e.r + 4),
    vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
    r: 5, dmg, crit: false, pierce: 0, ric: 0, life: 2.2,
    hits: null, frag: 0, px: e.x, py: e.y, dist: 0,
    mine: false, hacked: true, col: HACK_COL
  });
}

/* Enemy fire is allowed to hit them, so an army can be shot off you. Called
   from updateEBullets, which owns the bullet it is asking about. */
function hackHitByBullet(b) {
  for (const e of enemies) {
    if (e.dead || !e.hacked) continue;
    if (len(b.x - e.x, b.y - e.y) > b.r + e.r) continue;
    damageEnemy(e, b.dmg, false, b.x, b.y, { silent: true, enemy: true, noChain: true });
    burst(b.x, b.y, 6, b.col, 190, 2.2, 0.3);
    return true;
  }
  return false;
}

/* The readout: how much of the room is currently working for you. */
function drawHackHud() {
  if (!P.hacker || state === 'codex' || state === 'gfx' || state === 'chal') return;
  const n = hackedCount(false), b = hackedCount(true);
  const w = 150, x = 16, y = hudBotY - 30;
  hudBotY = y - 8;
  ctx.save();
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(6,10,18,0.78)';
  roundRect(x, y, w, 30, 8); ctx.fill();
  ctx.strokeStyle = rgba(HACK_COL, 0.28); ctx.lineWidth = 1;
  roundRect(x, y, w, 30, 8); ctx.stroke();
  ctx.fillStyle = rgba(HACK_COL, 0.9);
  roundRect(x + 1.5, y + 7, 2.5, 16, 1.5); ctx.fill();

  ctx.textAlign = 'left';
  ctx.save();
  ctx.letterSpacing = '0.12em';
  ctx.font = "700 9px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = HACK_COL;
  ctx.fillText('HACKED', x + 12, y + 11);
  ctx.restore();
  ctx.textAlign = 'right';
  ctx.font = "600 9px 'JetBrains Mono', ui-monospace, monospace";
  ctx.fillStyle = b ? HACK_COL : '#64748b';
  ctx.fillText(n + '/' + HACK_MAX + (b ? '  +BOSS' : ''), x + w - 10, y + 11);

  // one pip per body, so a full army reads at a glance rather than as a number
  const pw = (w - 24 - (HACK_MAX - 1) * 3) / HACK_MAX;
  for (let i = 0; i < HACK_MAX; i++) {
    ctx.fillStyle = i < n ? HACK_COL : 'rgba(148,163,184,0.18)';
    roundRect(x + 12 + i * (pw + 3), y + 19, pw, 4, 2); ctx.fill();
  }
  ctx.restore();
}

/* ===========================================================================
   ESCALATION
   A permanent mark on the record. Reach the fourth sector on five ordinary
   runs in a row and the game stops treating you as someone who might not get
   there: everything gains health, hits harder, arrives sooner and in greater
   numbers, and boss armour starts five sectors earlier than it used to.

   It is not a setting and there is no way back. That is the point — it is
   the record noticing, not a menu you ticked. It pays for itself in score and
   credits so the board stays legible across both sides of the line, and it
   stays out of challenge runs and freeplay, which carry their own rules.
   ========================================================================= */
const HARD_WINDOW = 5;     // consecutive ordinary runs considered
const HARD_DEPTH  = 15;    // the wave every one of them has to have reached

/* Off during a challenge (its sheet is the difficulty) and off in freeplay
   (nothing there is real). Everywhere else it is simply how the game is now. */
const hardOn = () => !!Save.profile.hardened && !Chal.on && !freeRun;

const HARD = {
  hp: 1.45, dmg: 1.30, spd: 1.12, budget: 1.25,
  elite: 0.09, score: 1.35, cred: 1.15, price: 1.25,
  armorFrom: 5              // wave the boss plating starts, instead of 10
};
const hardHp     = () => hardOn() ? HARD.hp : 1;
const hardDmg    = () => hardOn() ? HARD.dmg : 1;
const hardSpd    = () => hardOn() ? HARD.spd : 1;
const hardBudget = () => hardOn() ? HARD.budget : 1;
const hardElite  = () => hardOn() ? HARD.elite : 0;
const hardScore  = () => hardOn() ? HARD.score : 1;
const hardCred   = () => hardOn() ? HARD.cred : 1;
const hardPrice  = () => hardOn() ? HARD.price : 1;
// boss plating starts on the first boss instead of the third
const hardArmorGate = () => hardOn() ? HARD.armorFrom : 10;

/* Called once per recorded run. Co-op, challenges and freeplay never reach
   here, so the window only ever contains runs flown solo under normal rules. */
function noteRunDepth(w) {
  const p = Save.profile;
  p.deepRuns = (p.deepRuns || []).concat(w).slice(-HARD_WINDOW);
  if (p.hardened) return false;
  if (p.deepRuns.length < HARD_WINDOW) return false;
  if (!p.deepRuns.every(d => d >= HARD_DEPTH)) return false;
  p.hardened = true;
  return true;                       // the caller announces it
}

/* How close you are to it, for the menu. Null once it has happened. */
function hardProgress() {
  const p = Save.profile;
  if (p.hardened) return null;
  const runs = (p.deepRuns || []);
  const good = runs.filter(d => d >= HARD_DEPTH).length;
  return { good, need: HARD_WINDOW, depth: HARD_DEPTH,
           streak: runs.length === HARD_WINDOW && good === HARD_WINDOW };
}

/* ------------------------------ the machinery -----------------------------
   A challenge run is an ordinary run with a rule sheet stapled to it. The
   sheet is read once at the start — everything that changes the ship — and
   then consulted by a handful of hooks through the frame, for everything that
   changes the room. None of it runs while Chal.on is null, so the ordinary
   game keeps exactly the shape it had.

   Challenge runs stay off your record and off the global board: the rules are
   different, so the number would be measuring a different game.
--------------------------------------------------------------------------- */
const Chal = {
  on: null,          // the active challenge definition, or null
  won: false,        // its goal has been met this run
  waveT: 0,          // seconds left on a timed wave
  moveT: 0,          // grace before a stationary hull starts venting
  curseT: 0,
  reward: null       // the upgrade just unlocked, for the end screen
};

const chalById = id => CHALLENGES.find(c => c.id === id) || null;
const chalDone = id => (Save.profile.chal || []).includes(id);
const chalCount = () => (Save.profile.chal || []).length;

/* Locked until you have cleared enough of the ladder, and — for the handful
   built on systems from the deep game — until you have met the system. */
function chalOpen(c) {
  if (chalCount() < c.tier) return false;
  if (c.need && !c.need(Save.profile)) return false;
  return true;
}
function chalLockText(c) {
  if (c.need && !c.need(Save.profile)) return c.needTxt || 'LOCKED';
  const left = c.tier - chalCount();
  return left > 0 ? 'CLEAR ' + left + ' MORE CHALLENGE' + (left === 1 ? '' : 'S') : 'LOCKED';
}
const chalGoalName = c => (BOSSES[c.goal] || { name: c.goal }).name;

/* An upgrade is in the pool if it is not a reward, or if it is a reward you
   have already earned. Rewards are permanent — they are the point. */
/* `lock` names a challenge; `need` reads the profile, the same way the pilots
   and the challenge list already gate themselves. The route finales are not
   challenges, so what they leave behind could not be expressed before. */
const chalUnlockedUp = u => (!u.lock || chalDone(u.lock))
                         && (!u.need || u.need(Save.profile));

/* ------------------------------ starting one ------------------------------ */
function startChallenge(c) {
  if (!c || !chalOpen(c)) return;
  const m = c.m || {};
  if (m.char !== undefined) applyChar(m.char);
  resetGame();
  Chal.on = c; Chal.won = false; Chal.reward = null;
  Chal.waveT = m.time || 0; Chal.moveT = 1.2; Chal.curseT = 2;
  chalApplyShip(m);
  chalApplyRoom(m);
  state = 'play';
  uiArm = 0.3;
  banner(c.n, '#fbbf24', 3.2);
  setTimeout(() => { if (state === 'play' && Chal.on === c)
    banner('KILL   ' + chalGoalName(c), '#fbbf24', 3.0); }, 3400);
  Audio_.select();
}

/* Everything the sheet says about the ship, applied once. Order matters: the
   starting upgrades go on before the multipliers, so a challenge that hands
   you four Split Barrels and then halves your damage halves the result. */
function chalApplyShip(m) {
  if (m.start) for (const id of m.start) {
    const u = UPGRADES.find(x => x.id === id);
    if (u) { P.up[u.id] = (P.up[u.id] || 0) + 1; u.f(P); }
  }
  if (m.hp) { P.maxHp = m.hp; P.hp = m.hp; }
  if (m.oneShot) { P.maxHp = 1; P.hp = 1; P.armor = 0; P.shieldMax = 0; P.shield = 0; }
  if (m.dmg) P.dmg *= m.dmg;
  if (m.rate) P.fireRate *= m.rate;
  if (m.spd) P.speed *= m.spd;
  if (m.bspd) P.bspeed *= m.bspd;
  if (m.xp) P.xpMul *= m.xp;
  if (m.dash !== undefined) { P.dashMax = m.dash; P.dashCh = m.dash; }
  if (m.chip) P.chip = true;
  if (m.credits !== undefined) credits = m.credits;
  if (m.sign) {
    const s = SIGNS.find(z => z.id === m.sign);
    if (s) { s.f(P); Codex.seeSign(s.id); planetSign = s; planetRevealed = true; }
  }
  if (m.mal && MALWARE.length) {
    const mw = MALWARE[rndi(MALWARE.length)];
    P.malware = mw; Codex.seeMal(mw.id);
  }
}

/* And everything it says about the room. */
function chalApplyRoom(m) {
  if (m.mirror) for (let i = 0; i < m.mirror; i++) {
    const a = (i / m.mirror) * TAU + rnd(0.4, -0.4);
    const rx = (arena.x0 + arena.x1) / 2 + Math.cos(a) * (arena.x1 - arena.x0) * 0.34;
    const ry = (arena.y0 + arena.y1) / 2 + Math.sin(a) * (arena.y1 - arena.y0) * 0.34;
    addHazard('mirror', rx, ry, 1e9, { r: 52 });
  }
}

/* ------------------------------- the hooks -------------------------------- */
/* Pool: rewards you have not earned yet, plus whatever this challenge forbids.
   Two of the rewards also forbid things — Purity and Asceticism are written as
   promises about what will not be offered, so this is where they are kept. */
function chalFilterPool(pool) {
  const earned = pool.filter(chalUnlockedUp);
  const m = Chal.on ? (Chal.on.m || {}) : null;
  const out = [];
  for (const u of earned) {
    if (m) {
      if (m.oneShot && ['hp', 'regen', 'armor', 'shld', 'wind'].includes(u.id)) continue;
      if (m.ban && m.ban.includes(u.id)) continue;
      if (m.only && !m.only.includes(u.id)) continue;
      if (m.rar && !m.rar.includes(u.rar)) continue;
    }
    out.push(u);
  }
  // a rule sheet that filters everything out still has to leave a game behind
  return out.length ? out : earned;
}

const chalNoLevel = () => !!(Chal.on && Chal.on.m.noLvl);
const chalNoShop  = () => !!(Chal.on && Chal.on.m.noShop);
const chalNoHeal  = () => !!(Chal.on && Chal.on.m.noHeal);
const chalAuto    = () => !!(Chal.on && Chal.on.m.auto);
const chalBudget  = () => (Chal.on && Chal.on.m.budget) || 1;
const chalEHp     = () => (Chal.on && Chal.on.m.ehp) || 1;
const chalESpd    = () => (Chal.on && Chal.on.m.espd) || 1;
const chalEDmg    = () => (Chal.on && Chal.on.m.edmg) || 1;
const chalElite   = () => (Chal.on && Chal.on.m.elite) || 0;
const chalSwarm   = () => (Chal.on && Chal.on.m.swarm) || null;
const chalFog     = () => !!(Chal.on && Chal.on.m.fog);

/* Per-frame rules: the clock, the standing-still penalty, and the hazard a
   cursed room keeps laying down. */
function chalTick(dt) {
  const c = Chal.on;
  if (!c || state !== 'play') return;
  const m = c.m;

  if (m.oneShot) {
    P.maxHp = 1; P.hp = Math.min(P.hp, 1);
    P.armor = 0; P.shieldMax = 0; P.shield = 0; P.revive = 0;
  }

  if (m.time) {
    // the clock only runs while there is actually a wave to clear
    if (betweenWaves <= 0 && (spawnBudget > 0 || enemies.length || bossAlive)) {
      Chal.waveT -= dt;
      if (Chal.waveT <= 0) {
        Chal.waveT = 3;
        banner('OVERTIME', '#f87171', 1.4);
        hurtPlayer(Math.max(6, P.maxHp * 0.18), { pure: true });
      }
    } else Chal.waveT = m.time;
  }

  if (m.move) {
    if (len(P.vx, P.vy) > 55) Chal.moveT = 1.1;
    else {
      Chal.moveT -= dt;
      if (Chal.moveT <= 0) {
        Chal.moveT = 0.55;
        hurtPlayer(Math.max(2, P.maxHp * 0.055), { pure: true });
        burst(P.x, P.y, 6, '#f87171', 140, 2.2, 0.3);
      }
    }
  }

  if (m.curse) {
    Chal.curseT -= dt;
    if (Chal.curseT <= 0) {
      Chal.curseT = Math.max(0.8, 2.6 - wave * 0.05);
      addHazard(m.curse, rnd(arena.x1 - 90, arena.x0 + 90), rnd(arena.y1 - 90, arena.y0 + 90),
                rnd(9, 5), { dmg: 6 + wave * 0.55 });
    }
  }
}

/* ------------------------------ winning it -------------------------------- */
/* Called wherever a boss actually dies. The goal is a boss key, so the three
   that are not stage bosses — the bookkeeper, the unwritten, the amalgam —
   report in from their own victory paths. */
function chalCheckGoal(key) {
  const c = Chal.on;
  if (!c || Chal.won || state !== 'play') return;
  if (key !== c.goal) return;
  Chal.won = true;

  const first = !chalDone(c.id);
  if (first) {
    Save.profile.chal = [...new Set([...(Save.profile.chal || []), c.id])];
    Save.writeLocal(); Save.flush();
  }
  const rw = CHAL_UPGRADES.find(u => u.id === c.rw);
  Chal.reward = first ? rw : null;

  banner('CHALLENGE COMPLETE', '#fbbf24', 4.0);
  drawFlashT = 0.35; shake(1.4);
  Audio_.levelup(); Audio_.boss();
  ringFx(P.x, P.y, 12, 460, '#fbbf24', 1.0, 7);
  burst(P.x, P.y, 70, '#fbbf24', 420, 4, 1.1);
  if (first && rw)
    setTimeout(() => { if (state === 'play') banner('UNLOCKED   ' + rw.n, RARITY[rw.rar], 4.0); }, 2200);

  // the run is over the moment the named boss is down: that is the whole deal
  setTimeout(() => { if (Chal.on === c && state === 'play') chalEnd(true); }, 3600);
}

function chalEnd(won) {
  const c = Chal.on;
  if (!c) return;
  lastStats = { score, wave, kills: P.kills, level: P.level, time: elapsed,
                sector: stage.name, loop: loopNum, isRecord: false,
                chal: c, chalWon: won, reward: Chal.reward };
  state = 'dead';
  Codex.flush();
  if (won) Audio_.levelup();
  else { explode(P.x, P.y, 180, 0, COL.player); shake(1); Audio_.over(); }
}

// Leaving a challenge, by death or by the menu.
function chalQuit() { Chal.on = null; Chal.won = false; Chal.reward = null; }


/* ------------------------------- the browser ------------------------------
   Fifty entries is too many for a wall of cards, so this is a list on the left
   and the selected sheet on the right: what it does to you, what you have to
   kill, and what it pays. Locked entries stay visible and legible — knowing
   what is further up the ladder is most of the reason to climb it.
--------------------------------------------------------------------------- */
let chalSel = 0, chalScroll = 0, chalFrom = 'menu', chalRows = [];

const CHAL_GOLD = '#fbbf24';

function openChal(from) {
  chalFrom = from || 'menu';
  state = 'chal';
  uiArm = 0.3;
  chalSel = Math.max(0, CHALLENGES.findIndex(c => chalOpen(c) && !chalDone(c.id)));
  chalKeepVisible();
  Audio_.select();
}
function closeChal() {
  state = chalFrom === 'pause' ? 'pause' : 'menu';
  uiArm = 0.3;
  Audio_.select();
}

/* Two ways to browse fifty entries, both list-and-detail:
     'rows'  a grouped scrolling list — tier bands, names always visible
     'grid'  a numbered pad, every entry on screen at once, names in the sheet
   The detail sheet is identical either way, so only the index changes. */
const UIVAR = { chal: 'grid', shop: 'table' };

function chalGeom() {
  const pad = Math.min(40, Math.max(12, W * 0.04));
  /* On a short window the heading block collapses and the panel takes the room
     back, rather than the list running off the bottom edge. */
  const tight = H < 460;
  const top = tight ? 76 : 118, bottom = tight ? 46 : 74;
  const grid = UIVAR.chal === 'grid';
  let listW = grid ? Math.min(340, Math.max(210, W * 0.29))
                   : Math.min(380, Math.max(220, W * 0.33));
  /* The sheet is the part you actually read, so it holds its measure and the
     index gives way — on a narrow window the list gets thin, not the sheet. */
  const SHEET_MIN = 190;
  listW = clamp(Math.min(listW, W - pad * 2 - 24 - SHEET_MIN), 96, listW);
  const hh = Math.max(96, H - top - bottom);
  return { x: pad, y: top, listW, rowH: 30, viewH: hh, grid, tight,
           px: pad + listW + 24,
           pw: Math.max(120, W - pad * 2 - listW - 24) };
}

/* The grouped list is a flat run of band headers and entries, so scrolling and
   keyboard travel both work in one coordinate: the item row. */
function chalItems() {
  const out = [];
  let tier = -1;
  CHALLENGES.forEach((c, i) => {
    if (c.tier !== tier) { tier = c.tier; out.push({ band: tier }); }
    out.push({ i });
  });
  return out;
}
function chalRowOf(sel) {
  const items = chalItems();
  for (let k = 0; k < items.length; k++) if (items[k].i === sel) return k;
  return 0;
}
function chalContentH() {
  const g = chalGeom();
  if (g.grid) {
    const cell = chalCell(g);
    return Math.ceil(CHALLENGES.length / cell.cols) * (cell.h + cell.gap);
  }
  return chalItems().length * g.rowH;
}
/* The pad only earns its place if the whole ladder is on screen at once, so
   the cell is sized from the room available rather than a fixed guess: columns
   from the width, then row height divided out of the height. */
function chalCell(g) {
  const gap = 5;
  const cols = clamp(Math.round((g.listW + gap) / 52), 4, 8);
  const w = (g.listW - (cols - 1) * gap) / cols;
  const rows = Math.ceil(CHALLENGES.length / cols);
  const h = clamp((g.viewH - (rows - 1) * gap) / rows, 26, 46);
  return { cols, gap, w, h };
}
function chalMaxScroll() {
  return Math.max(0, chalContentH() - chalGeom().viewH);
}
function chalKeepVisible() {
  const g = chalGeom();
  let y, rowH;
  if (g.grid) {
    const cell = chalCell(g);
    rowH = cell.h + cell.gap;
    y = Math.floor(chalSel / cell.cols) * rowH;
  } else {
    rowH = g.rowH;
    y = chalRowOf(chalSel) * rowH;
  }
  if (y < chalScroll) chalScroll = y;
  else if (y + rowH > chalScroll + g.viewH) chalScroll = y + rowH - g.viewH;
  chalScroll = clamp(chalScroll, 0, chalMaxScroll());
}

function chalKey(k) {
  if (uiArm > 0) return;
  if (k === 'escape' || k === 'x' || k === 'c') { closeChal(); return; }
  const step = UIVAR.chal === 'grid' ? chalCell(chalGeom()).cols : 1;
  if (k === 'arrowdown' || k === 's') {
    chalSel = Math.min(CHALLENGES.length - 1, chalSel + step);
    chalKeepVisible(); Audio_.select(); return;
  }
  if (k === 'arrowup' || k === 'w') {
    chalSel = Math.max(0, chalSel - step);
    chalKeepVisible(); Audio_.select(); return;
  }
  if (k === 'arrowright' || k === 'd') {
    chalSel = Math.min(CHALLENGES.length - 1, chalSel + 1); chalKeepVisible(); Audio_.select(); return;
  }
  if (k === 'arrowleft' || k === 'a') {
    chalSel = Math.max(0, chalSel - 1); chalKeepVisible(); Audio_.select(); return;
  }
  if (k === 'pagedown') { chalSel = Math.min(CHALLENGES.length - 1, chalSel + 8); chalKeepVisible(); return; }
  if (k === 'pageup')   { chalSel = Math.max(0, chalSel - 8); chalKeepVisible(); return; }
  if (k === 'enter' || k === ' ') {
    const c = CHALLENGES[chalSel];
    if (chalOpen(c)) startChallenge(c);
    else Audio_.tone(150, 0.12, 'square', 0.06, 90);
  }
}

function chalClick() {
  if (uiArm > 0) return;
  for (const r of chalRows) if (inRect(mouse.x, mouse.y, r)) {
    if (chalSel === r.i) {
      const c = CHALLENGES[r.i];
      if (chalOpen(c)) startChallenge(c);
      else Audio_.tone(150, 0.12, 'square', 0.06, 90);
    } else { chalSel = r.i; Audio_.select(); }
    return;
  }
  if (chalStartRect && inRect(mouse.x, mouse.y, chalStartRect)) {
    const c = CHALLENGES[chalSel];
    if (chalOpen(c)) startChallenge(c);
    return;
  }
}

let chalStartRect = null;

function drawChal() {
  ctx.fillStyle = 'rgba(3,5,10,0.95)';
  ctx.fillRect(0, 0, W, H);
  const g = chalGeom();
  const done = chalCount();

  ctx.textAlign = 'center';
  const t2 = g.tight;
  ctx.save();
  ctx.shadowColor = CHAL_GOLD; ctx.shadowBlur = 26;
  ctx.letterSpacing = '0.06em';
  fitFont('CHALLENGES', W - 48, '700', t2 ? 20 : 30,
          "'Chakra Petch', Barlow, system-ui, sans-serif", 14);
  ctx.fillStyle = '#fde68a';
  ctx.fillText('CHALLENGES', W / 2, t2 ? 34 : 52);
  ctx.restore();
  ctx.save();
  ctx.letterSpacing = '0.1em';
  const sub2 = done + ' / ' + CHALLENGES.length + '   COMPLETE   ·   ' +
               'EACH ONE PAYS AN UPGRADE, PERMANENTLY';
  fitFont(sub2, W - 48, '600', 11, "Barlow, 'Segoe UI', system-ui, sans-serif", 7.5);
  ctx.fillStyle = '#64748b';
  ctx.fillText(sub2, W / 2, t2 ? 52 : 74);
  ctx.restore();

  // progress rail
  const rw = Math.min(520, W - 80), rx = (W - rw) / 2;
  const ry = t2 ? 62 : 88;
  ctx.fillStyle = 'rgba(15,23,42,0.9)';
  roundRect(rx, ry, rw, 5, 2.5); ctx.fill();
  ctx.fillStyle = CHAL_GOLD;
  roundRect(rx, ry, rw * (done / CHALLENGES.length), 5, 2.5); ctx.fill();

  /* ---- the index ---- */
  chalRows = [];
  ctx.save();
  ctx.beginPath(); ctx.rect(g.x, g.y, g.listW, g.viewH); ctx.clip();
  ctx.textBaseline = 'middle';

  if (g.grid) {
    /* Every entry on screen at once: the ladder as a pad of numbers, so the
       shape of what is left is visible without scrolling. The name lives in
       the sheet — here the number, the state and the tier are the content. */
    const cell = chalCell(g);
    for (let i = 0; i < CHALLENGES.length; i++) {
      const c = CHALLENGES[i];
      const col = i % cell.cols, rowI = (i / cell.cols) | 0;
      const x = g.x + col * (cell.w + cell.gap);
      const y = g.y + rowI * (cell.h + cell.gap) - chalScroll;
      if (y + cell.h < g.y - 4 || y > g.y + g.viewH + 4) continue;
      const r = { x, y, w: cell.w, h: cell.h, i };
      chalRows.push(r);
      const open = chalOpen(c), won = chalDone(c.id), sel = i === chalSel;
      const tone = won ? '#34d399' : open ? CHAL_GOLD : '#334155';
      ctx.fillStyle = won ? 'rgba(52,211,153,0.14)'
                   : open ? 'rgba(251,191,36,0.07)' : 'rgba(15,23,42,0.5)';
      roundRect(x, y, cell.w, cell.h, 7); ctx.fill();
      ctx.strokeStyle = sel ? CHAL_GOLD : rgba(tone, open || won ? 0.35 : 0.22);
      ctx.lineWidth = sel ? 2 : 1;
      roundRect(x, y, cell.w, cell.h, 7); ctx.stroke();
      ctx.textAlign = 'center';
      fitFont(String(i + 1).padStart(2, '0'), cell.w - 8, '700',
              Math.min(14, cell.h * 0.42), "'JetBrains Mono', ui-monospace, monospace", 8);
      ctx.fillStyle = won ? '#6ee7b7' : open ? (sel ? '#fde68a' : '#94a3b8') : '#334155';
      ctx.fillText(String(i + 1).padStart(2, '0'), x + cell.w / 2, y + cell.h / 2);
      // state as a corner mark, not a second glyph competing for the middle
      if (won) {
        ctx.fillStyle = '#34d399';
        ctx.beginPath();
        ctx.moveTo(x + cell.w - 9, y + 3);
        ctx.lineTo(x + cell.w - 3, y + 3);
        ctx.lineTo(x + cell.w - 3, y + 9);
        ctx.closePath(); ctx.fill();
      } else if (!open) {
        ctx.fillStyle = 'rgba(71,85,105,0.7)';
        ctx.beginPath(); ctx.arc(x + cell.w - 6, y + 6, 2, 0, TAU); ctx.fill();
      }
    }
  } else {
    /* A grouped list: the tier bands are the ladder, and the names stay
       readable — which is what you want when you are picking one to run. */
    const items = chalItems();
    const done = chalCount();
    items.forEach((it, k) => {
      const y = g.y + k * g.rowH - chalScroll;
      if (y + g.rowH < g.y - 4 || y > g.y + g.viewH + 4) return;
      if (it.band !== undefined) {
        const shut = done < it.band;
        ctx.textAlign = 'left';
        ctx.save();
        ctx.letterSpacing = '0.18em';
        ctx.font = "700 8.5px Barlow, 'Segoe UI', system-ui, sans-serif";
        ctx.fillStyle = shut ? '#334155' : 'rgba(251,191,36,0.6)';
        const t = it.band === 0 ? 'OPEN FROM THE START'
                : shut ? 'NEEDS ' + it.band + ' CLEARED' : 'TIER ' + it.band;
        ctx.fillText(t, g.x + 12, y + g.rowH - 10);
        const tw = ctx.measureText(t).width;
        ctx.restore();
        ctx.fillStyle = shut ? 'rgba(51,65,85,0.5)' : 'rgba(251,191,36,0.18)';
        ctx.fillRect(g.x + 20 + tw, y + g.rowH - 11, Math.max(0, g.listW - 32 - tw), 1);
        return;
      }
      const i = it.i, c = CHALLENGES[i];
      const y2 = y;
      const r = { x: g.x, y: y2, w: g.listW, h: g.rowH - 2, i };
      chalRows.push(r);
      const open = chalOpen(c), won = chalDone(c.id), sel = i === chalSel;
      if (sel) {
        ctx.fillStyle = 'rgba(251,191,36,0.12)';
        roundRect(r.x, r.y, r.w, r.h, 6); ctx.fill();
        ctx.fillStyle = CHAL_GOLD;
        roundRect(r.x, r.y + 4, 2.5, r.h - 8, 1.5); ctx.fill();
      }
      ctx.textAlign = 'right';
      ctx.font = "600 10px 'JetBrains Mono', ui-monospace, monospace";
      ctx.fillStyle = won ? 'rgba(110,231,183,0.7)' : open ? '#5b6b82' : '#293548';
      ctx.fillText(String(i + 1).padStart(2, '0'), r.x + 32, r.y + r.h / 2);
      const badge = won ? 'CLEARED' : open ? '' : 'LOCKED';
      ctx.save();
      ctx.letterSpacing = '0.12em';
      ctx.font = "700 8px Barlow, 'Segoe UI', system-ui, sans-serif";
      let badgeW = badge ? ctx.measureText(badge).width + 14 : 0;
      ctx.restore();
      // the name is what you read; the badge gives way when the row is narrow
      const nameW = r.w - 42 - 12 - badgeW;
      if (nameW < 70 && badgeW) { badgeW = 0; }
      ctx.textAlign = 'left';
      const nm = open || won ? c.n : '—————';
      fitFont(nm, Math.max(40, r.w - 54 - badgeW), '600', 12.5,
              "Barlow, 'Segoe UI', system-ui, sans-serif", 9);
      ctx.fillStyle = won ? '#6ee7b7' : open ? (sel ? '#fde68a' : '#cbd5e1') : '#334155';
      ctx.fillText(nm, r.x + 42, r.y + r.h / 2);
      if (badge && badgeW) {
        ctx.textAlign = 'right';
        ctx.save();
        ctx.letterSpacing = '0.12em';
        ctx.font = "700 8px Barlow, 'Segoe UI', system-ui, sans-serif";
        ctx.fillStyle = won ? '#34d399' : '#334155';
        ctx.fillText(badge, r.x + r.w - 12, r.y + r.h / 2);
        ctx.restore();
      }
    });
  }
  ctx.restore();
  ctx.textBaseline = 'alphabetic';

  // scroll track, only when there is something below the fold
  const ms = chalMaxScroll();
  if (ms > 0) {
    const content = chalContentH();
    const th = Math.max(24, g.viewH * (g.viewH / content));
    const ty = g.y + (g.viewH - th) * (chalScroll / ms);
    ctx.fillStyle = 'rgba(148,163,184,0.1)';
    roundRect(g.x + g.listW - 3, g.y, 3, g.viewH, 1.5); ctx.fill();
    ctx.fillStyle = 'rgba(148,163,184,0.3)';
    roundRect(g.x + g.listW - 3, ty, 3, th, 1.5); ctx.fill();
  }

  drawChalSheet(g);

  ctx.textAlign = 'center';
  ctx.save();
  ctx.letterSpacing = '0.12em';
  const keys2 = '↑↓ SELECT   ·   ENTER START   ·   ESC BACK';
  fitFont(keys2, W - 36, '600', 10, "Barlow, 'Segoe UI', system-ui, sans-serif", 7.5);
  ctx.fillStyle = '#475569';
  ctx.fillText(keys2, W / 2, H - (g.tight ? 18 : 34));
  ctx.restore();
}

/* The sheet: what this one does to you, in the same plain register the codex
   uses. A locked entry still shows its rules — you are meant to plan for it. */
/* The sheet: what this one does to you, in the register the codex uses, with
   the raw modifier bag underneath it. Both are generated from c.m, so the
   English and the tokens cannot disagree with each other or with the run.

   Laid out as a clipped content column with the start button pinned to the
   foot of the panel, rather than a flow that hopes to stop in time — a
   challenge with fourteen rules used to walk straight over the button. */
function drawChalSheet(g) {
  const c = CHALLENGES[chalSel];
  if (!c) return;
  const open = chalOpen(c), won = chalDone(c.id);
  const x = g.px, w = g.pw;
  const BTN_H = 46, contentH = g.viewH - BTN_H - 14;

  ctx.save();
  ctx.beginPath(); ctx.rect(x - 4, g.y - 4, w + 8, contentH + 4); ctx.clip();
  ctx.textBaseline = 'alphabetic';
  let y = g.y + 6;

  /* header: name, and a pill saying where you stand with it */
  ctx.textAlign = 'left';
  const status = won ? ['CLEARED', '#6ee7b7'] : open ? ['OPEN', CHAL_GOLD] : ['LOCKED', '#64748b'];
  ctx.save();
  ctx.font = "700 8.5px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.letterSpacing = '0.16em';
  const pw = ctx.measureText(status[0]).width + 18;
  ctx.fillStyle = rgba(status[1], 0.13);
  roundRect(x, y, pw, 16, 8); ctx.fill();
  ctx.strokeStyle = rgba(status[1], 0.4); ctx.lineWidth = 1;
  roundRect(x, y, pw, 16, 8); ctx.stroke();
  ctx.fillStyle = status[1];
  ctx.textBaseline = 'middle';
  ctx.fillText(status[0], x + 9, y + 8.5);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
  ctx.save();
  ctx.font = "600 9px 'JetBrains Mono', ui-monospace, monospace";
  ctx.fillStyle = '#475569';
  ctx.fillText(String(chalSel + 1).padStart(2, '0') + ' / ' + CHALLENGES.length,
               x + pw + 10, y + 12);
  ctx.restore();
  y += 34;

  ctx.save();
  ctx.letterSpacing = '0.02em';
  fitFont(open || won ? c.n : 'LOCKED', w, '700', 24,
          "'Chakra Petch', Barlow, system-ui, sans-serif", 14);
  ctx.fillStyle = won ? '#6ee7b7' : open ? '#fde68a' : '#475569';
  ctx.fillText(open || won ? c.n : 'LOCKED', x, y);
  ctx.restore();
  y += 26;

  const label = (t, yy) => {
    ctx.save();
    ctx.letterSpacing = '0.18em';
    ctx.font = "700 9px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = '#475569';
    ctx.fillText(t, x, yy);
    ctx.restore();
    ctx.fillStyle = 'rgba(71,85,105,0.28)';
    const tw = 26 + t.length * 6.6;
    ctx.fillRect(x + tw, yy - 3, Math.max(0, w - tw), 1);
  };

  /* the one thing that ends the run a winner */
  label('OBJECTIVE', y);
  y += 19;
  const goalCol = (BOSSES[c.goal] || {}).col || '#e2e8f0';
  ctx.save();
  ctx.letterSpacing = '0.06em';
  const goal = 'DESTROY   ' + chalGoalName(c);
  fitFont(goal, w, '700', 15, "'Chakra Petch', Barlow, system-ui, sans-serif", 10);
  ctx.fillStyle = goalCol;
  ctx.fillText(goal, x, y);
  ctx.restore();
  y += 24;

  /* On a short panel the blurb is the first thing to go: the rules and the
     reward are what you need to decide, and the name already sets the tone. */
  if (contentH > 200) {
    ctx.font = "400 12.5px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = '#94a3b8';
    y = wrapText(c.d, x, y, w, 17) + 26;
  } else {
    y += 4;
  }

  /* the rules in English — two columns once there are enough of them to
     make a single list taller than the panel */
  const rules = chalRuleLines(c);
  if (rules.length) {
    label('RULES', y);
    y += 18;
    const twoCol = rules.length > 6 && w > 330;
    const colW = twoCol ? (w - 16) / 2 : w;
    const perCol = twoCol ? Math.ceil(rules.length / 2) : rules.length;
    let maxY = y;
    rules.forEach((r, i) => {
      const cxx = x + (twoCol && i >= perCol ? colW + 16 : 0);
      const yy = y + (i % perCol) * 16;
      if (yy > g.y + contentH - 8) return;
      ctx.fillStyle = r[1];
      ctx.beginPath(); ctx.arc(cxx + 3, yy - 3.5, 2, 0, TAU); ctx.fill();
      fitFont(r[0], colW - 14, '600', 11.5, "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
      ctx.fillStyle = r[1];
      ctx.globalAlpha = 0.92;
      ctx.fillText(r[0], cxx + 11, yy);
      ctx.globalAlpha = 1;
      maxY = Math.max(maxY, yy);
    });
    y = maxY + 24;
  }

  /* the same bag, unglossed — the exact keys the run is built from */
  const raw = chalRawTokens(c);
  if (raw.length && y < g.y + contentH - 40) {
    label('SHEET', y);
    y += 14;
    ctx.font = "600 9.5px 'JetBrains Mono', ui-monospace, monospace";
    const gap = 6, rowH = 17;
    let tx = x, ty = y, rows2 = 1;
    for (const t of raw) {
      const tw = ctx.measureText(t).width + 14;
      if (tx + tw > x + w && tx > x) { tx = x; ty += rowH; rows2++; }
      if (ty > g.y + contentH - 12) break;
      ctx.fillStyle = 'rgba(30,41,59,0.55)';
      roundRect(tx, ty - 11, tw, 15, 4); ctx.fill();
      ctx.fillStyle = '#7c8ba1';
      ctx.fillText(t, tx + 7, ty);
      tx += tw + gap;
    }
    y = ty + 26;
  }

  /* what clearing it puts in the pool, permanently */
  const rw = CHAL_UPGRADES.find(u => u.id === c.rw);
  if (rw && y < g.y + contentH - 34) {
    label('REWARD', y);
    y += 18;
    ctx.save();
    ctx.letterSpacing = '0.06em';
    fitFont(won ? rw.n : '? ? ?', w, '700', 13,
            "Barlow, 'Segoe UI', system-ui, sans-serif", 9);
    ctx.fillStyle = won ? RARITY[rw.rar] : '#475569';
    ctx.fillText(won ? rw.n : '? ? ?', x, y);
    ctx.restore();
    const rd = won ? rw.d : 'an upgrade that is not in your pool yet';
    ctx.font = "500 11.5px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = won ? '#94a3b8' : '#334155';
    wrapText(rd, x, y + 16, w, 15);
  }
  ctx.restore();                             // end of the clipped column

  /* the button never moves: it is the same target on every entry */
  chalStartRect = null;
  const by = g.y + g.viewH - BTN_H;
  if (open) {
    const bw = Math.min(220, w);
    chalStartRect = { x, y: by, w: bw, h: BTN_H - 6 };
    const hot = inRect(mouse.x, mouse.y, chalStartRect);
    ctx.save();
    if (hot) { ctx.shadowColor = CHAL_GOLD; ctx.shadowBlur = 18; }
    ctx.fillStyle = hot ? 'rgba(251,191,36,0.2)' : 'rgba(8,13,22,0.9)';
    roundRect(x, by, bw, BTN_H - 6, 9); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = rgba(CHAL_GOLD, hot ? 0.95 : 0.5); ctx.lineWidth = hot ? 1.8 : 1.2;
    roundRect(x, by, bw, BTN_H - 6, 9); ctx.stroke();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.letterSpacing = '0.14em';
    ctx.font = "700 13px 'Chakra Petch', Barlow, system-ui, sans-serif";
    ctx.fillStyle = CHAL_GOLD;
    ctx.fillText(won ? 'RUN IT AGAIN' : 'START', x + bw / 2, by + (BTN_H - 6) / 2);
    ctx.restore();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  } else {
    ctx.save();
    ctx.textAlign = 'left';                  // the clip restore hands back 'center'
    ctx.textBaseline = 'alphabetic';
    const lock = chalLockText(c);
    fitFont(lock, w, '700', 12, "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
    ctx.fillStyle = '#f87171';
    ctx.fillText(lock, x, by + 24);
    ctx.restore();
  }
}

/* The bag itself, one token per key that is actually set. Read straight off
   c.m in a fixed order so two sheets can be compared line by line. */
function chalRawTokens(c) {
  const m = c.m || {}, out = [];
  const num = v => (Math.round(v * 100) / 100).toString();
  const ORDER = ['char', 'hp', 'oneShot', 'dmg', 'rate', 'spd', 'bspd', 'dash', 'credits',
                 'xp', 'chip', 'mal', 'sign', 'noHeal', 'move', 'auto', 'noLvl', 'noShop',
                 'rar', 'ehp', 'espd', 'edmg', 'elite', 'budget', 'time', 'curse',
                 'mirror', 'fog'];
  for (const k of ORDER) {
    const v = m[k];
    if (v === undefined) continue;
    if (v === true) { out.push(k); continue; }
    if (Array.isArray(v)) { out.push(k + ' ' + v.join('/')); continue; }
    out.push(k + ' ' + (typeof v === 'number' ? num(v) : v));
  }
  // the list-valued keys are counted rather than spelled out — they run long
  if (m.start) out.push('start ×' + m.start.length);
  if (m.only) out.push('only ×' + m.only.length);
  if (m.ban) out.push('ban ×' + m.ban.length);
  if (m.swarm) out.push('swarm ' + m.swarm.join('/'));
  return out;
}

/* Turns the modifier bag back into English. Generated from the sheet rather
   than hand-written per challenge, so a rule can never be listed that is not
   actually applied, or applied without being listed. */
function chalRuleLines(c) {
  const m = c.m || {}, out = [];
  const bad = '#fca5a5', good = '#6ee7b7', neutral = '#cbd5e1';
  const pct = v => (v >= 1 ? '+' + Math.round((v - 1) * 100) : '-' + Math.round((1 - v) * 100)) + '%';
  if (m.char !== undefined) out.push(['pilot locked to ' + CHARS[m.char].n, neutral]);
  if (m.oneShot) out.push(['1 hit point, no armour, no shields', bad]);
  else if (m.hp) out.push([m.hp + ' max HP', m.hp < 80 ? bad : good]);
  if (m.dmg) out.push([pct(m.dmg) + ' damage', m.dmg >= 1 ? good : bad]);
  if (m.rate) out.push([pct(m.rate) + ' fire rate', m.rate >= 1 ? good : bad]);
  if (m.spd) out.push([pct(m.spd) + ' move speed', m.spd >= 1 ? good : bad]);
  if (m.bspd) out.push([pct(m.bspd) + ' bullet speed', m.bspd >= 1 ? good : bad]);
  if (m.xp) out.push([pct(m.xp) + ' experience', m.xp >= 1 ? good : bad]);
  if (m.dash === 0) out.push(['no dash', bad]);
  else if (m.dash) out.push([m.dash + ' dash charges', good]);
  if (m.start) {
    const names = [...new Set(m.start)].map(id => {
      const u = UPGRADES.find(z => z.id === id);
      const n = m.start.filter(s => s === id).length;
      return (u ? u.n : id) + (n > 1 ? ' x' + n : '');
    });
    out.push(['starts with ' + names.join(', '), good]);
  }
  if (m.noLvl) out.push(['no upgrades are ever offered', bad]);
  if (m.only) out.push(['only ' + m.only.length + ' upgrades can be offered', bad]);
  if (m.ban) out.push([m.ban.length + ' upgrades removed from the pool', bad]);
  if (m.rar) out.push(['only ' + m.rar.join(' / ') + ' upgrades appear', bad]);
  if (m.noShop) out.push(['the shop never opens', bad]);
  if (m.credits === 0) out.push(['no starting credits', bad]);
  if (m.chip) out.push(['the record chip is installed from wave one', neutral]);
  if (m.mal) out.push(['a random malware replaces the dash', neutral]);
  if (m.sign) out.push(['a fixed zodiac reading, taken at the door', neutral]);
  if (m.noHeal) out.push(['nothing heals you', bad]);
  if (m.ehp) out.push([pct(m.ehp) + ' enemy health', m.ehp > 1 ? bad : good]);
  if (m.espd) out.push([pct(m.espd) + ' enemy speed', m.espd > 1 ? bad : good]);
  if (m.edmg) out.push([pct(m.edmg) + ' enemy damage', m.edmg > 1 ? bad : good]);
  if (m.budget) out.push([pct(m.budget) + ' spawns', m.budget > 1 ? bad : good]);
  if (m.elite >= 1) out.push(['every enemy is elite', bad]);
  else if (m.elite) out.push(['far more elites', bad]);
  if (m.swarm) out.push(['only ' + m.swarm.join(' and ') + 's spawn', neutral]);
  if (m.time) out.push([m.time + ' seconds a wave, then the hull pays', bad]);
  if (m.curse) out.push(['the room keeps laying ' + m.curse, bad]);
  if (m.mirror) out.push([m.mirror + ' mirror shards buried in the arena', neutral]);
  if (m.fog) out.push(['you can only see what is close', bad]);
  if (m.move) out.push(['standing still costs hull', bad]);
  if (m.auto) out.push(['the trigger is held down for you', neutral]);
  return out;
}

/* ------------------------------ in-run readout ---------------------------- */
function drawChalHud() {
  const c = Chal.on;
  if (!c || state === 'codex' || state === 'gfx' || state === 'chal') return;
  const timed = c.m.time && !Chal.won;
  const w = 190, cardH = timed ? 54 : 38, x = 16, y = hudBotY - cardH;
  hudBotY = y - 8;
  const col = Chal.won ? '#6ee7b7' : CHAL_GOLD;
  ctx.save();
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(6,10,18,0.8)';
  roundRect(x, y, w, cardH, 8); ctx.fill();
  ctx.strokeStyle = rgba(col, 0.3); ctx.lineWidth = 1;
  roundRect(x, y, w, cardH, 8); ctx.stroke();
  ctx.fillStyle = rgba(col, 0.9);
  roundRect(x + 1.5, y + 7, 2.5, cardH - 14, 1.5); ctx.fill();

  ctx.textAlign = 'left';
  ctx.save();
  ctx.letterSpacing = '0.14em';
  ctx.font = "700 8.5px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = rgba(col, 0.75);
  ctx.fillText(Chal.won ? 'CLEARED' : 'CHALLENGE', x + 12, y + 11);
  ctx.restore();
  fitFont(c.n, w - 24, '700', 11.5, "'Chakra Petch', Barlow, system-ui, sans-serif", 8);
  ctx.fillStyle = col;
  ctx.fillText(c.n, x + 12, y + 25);
  if (!Chal.won) {
    const goal = 'KILL  ' + chalGoalName(c);
    fitFont(goal, w - 24, '600', 9, "Barlow, 'Segoe UI', system-ui, sans-serif", 7);
    ctx.fillStyle = '#64748b';
    ctx.fillText(goal, x + 12, y + 36);
  }
  if (timed) {
    /* The wave clock is the only figure here that moves every frame, so it
       takes the mono face and a bar that empties, not a bare countdown. */
    const t = Math.max(0, Chal.waveT), f = clamp(t / c.m.time, 0, 1);
    const urgent = t < 10;
    ctx.fillStyle = 'rgba(2,6,14,0.9)';
    roundRect(x + 12, y + 44, w - 24, 5, 2.5); ctx.fill();
    ctx.fillStyle = urgent ? rgba('#f87171', 0.6 + Math.sin(uiTime * 8) * 0.4) : '#cbd5e1';
    if (f > 0) { roundRect(x + 12, y + 44, Math.max(2, (w - 24) * f), 5, 2.5); ctx.fill(); }
    ctx.textAlign = 'right';
    ctx.font = "800 10px 'JetBrains Mono', ui-monospace, monospace";
    ctx.fillStyle = urgent ? '#fca5a5' : '#94a3b8';
    ctx.fillText(t.toFixed(1) + 's', x + w - 10, y + 25);
  }
  ctx.restore();
}

/* Sensors down: everything past a short radius is painted out. Drawn over the
   finished world and under the HUD, so the readouts stay legible. */
function drawChalFog() {
  if (!chalFog() || state === 'menu' || state === 'chal' || state === 'dead') return;
  const r = 210 * camZoom;
  const g = ctx.createRadialGradient(W / 2, H / 2, r * 0.55, W / 2, H / 2, r * 1.9);
  g.addColorStop(0, 'rgba(3,5,10,0)');
  g.addColorStop(0.55, 'rgba(3,5,10,0.82)');
  g.addColorStop(1, 'rgba(3,5,10,0.985)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* The way in, on the menu: under the LAN panel, same idiom. */
function menuChalRect() { return { x: 18, y: 54, w: 176, h: 34 }; }

function drawMenuChal() {
  const r = menuChalRect();
  const hot = inRect(mouse.x, mouse.y, r);
  const done = chalCount();
  ctx.save();
  lanRect(r.x, r.y, r.w, r.h, 8);
  ctx.fillStyle = hot ? 'rgba(251,191,36,0.16)' : 'rgba(8,13,22,0.72)';
  ctx.fill();
  ctx.strokeStyle = rgba(CHAL_GOLD, hot ? 0.9 : 0.4);
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.textAlign = 'left';
  ctx.save();
  ctx.letterSpacing = '0.08em';
  ctx.font = "700 11px 'Chakra Petch', Barlow, system-ui, sans-serif";
  ctx.fillStyle = CHAL_GOLD;
  ctx.fillText('◈  CHALLENGES', r.x + 12, r.y + 15);
  ctx.letterSpacing = '0.1em';
  ctx.font = "500 9px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = hot ? '#94a3b8' : '#64748b';
  ctx.fillText(done + ' / ' + CHALLENGES.length + ' CLEARED  —  K', r.x + 12, r.y + 27);
  ctx.restore();
  // a thin fill along the foot: how much of the ladder is behind you
  ctx.fillStyle = 'rgba(2,6,14,0.9)';
  roundRect(r.x + 12, r.y + r.h - 7, r.w - 24, 2, 1); ctx.fill();
  ctx.fillStyle = rgba(CHAL_GOLD, 0.75);
  roundRect(r.x + 12, r.y + r.h - 7, (r.w - 24) * (done / CHALLENGES.length), 2, 1); ctx.fill();
  ctx.restore();
  ctx.textAlign = 'center';
}

/* ===========================================================================
   THE BETA BUILD
   One file, two homes. The same branch is served from Netlify and from
   Vercel, and the file works out which one it is standing in from the host
   it was fetched from — no build flag, no second branch, nothing to keep in
   step. Vercel is the beta: it opens with everything unlocked so the deep
   half of the game can be reached without thirty hours of getting there.
   Netlify is the real game and none of this touches it.

   The rule that makes it safe is one-directional: the beta READS an unlocked
   profile and WRITES nothing at all. Every persistence path is stubbed —
   local storage, the synced document, the run record and the global board —
   so a tester cannot post an inflated score to the shared board, and cannot
   push a fabricated set of unlocks into the profile that the real game reads
   back on the other host. The cost is that a beta run is not saved, which is
   what a sandbox should do anyway, and the banner says so.
   ========================================================================= */
const BETA = (() => {
  try {
    const h = (location.hostname || '').toLowerCase();
    // production is named explicitly, and wins over every other rule
    if (/(^|\.)netlify\.(app|com)$/.test(h)) return false;
    if (/\.vercel\.app$/.test(h)) return true;
    if (/^beta\./.test(h)) return true;                    // a custom beta domain
    // a developer machine may ask for it; a live host may not
    const local = h === 'localhost' || h === '127.0.0.1' || h === '';
    return local && /(^|[?&])beta=1(&|$)/.test(location.search || '');
  } catch (e) { return false; }
})();

/* Everything the game gates behind progress, opened at once. Written straight
   onto the in-memory profile, which is safe precisely because nothing on this
   build ever writes that profile anywhere. */
function betaUnlockAll() {
  const p = Save.profile;
  p.planetarium = true;      // reward rooms
  p.altPath = true;          // THE FRACTURE
  p.malware = true;          // payload drops
  p.deepFracture = true;     // fracture iii-v, below the mirror
  p.freeplay = true;         // the console
  p.keeperMet = true;
  p.keeperDone = true;       // his marginalia, and the chip in shops
  p.trueEnd = true;          // THE UNWRITTEN has been closed
  /* Not amalgamDone. "Unlocked" and "already finished" are different things,
     and the endgame chain only plays while it is unfinished: the monologue
     after THE UNWRITTEN is armed by `!amalgamDone` in two places, so marking
     it done here skipped the very sequence a dev build exists to test.
     Left unfinished and armed instead — the admin panel can flip it. */
  p.amalgamDone = false;
  p.askedHarder = false;
  p.devTalkDue = true;
  p.clears = Math.max(p.clears || 0, 2);
  p.chal = CHALLENGES.map(c => c.id);          // every challenge and its reward
  p.codexE = [...Object.keys(CODEX_E), ...Object.keys(BOSSES)];
  p.codexU = UPGRADES.map(u => u.id);
  p.codexM = MALWARE.map(m => m.id);           // and so THE HACKER is flyable
  p.codexB = Object.keys(BOOKS);
  p.codexZ = SIGNS.map(s => s.id);
  if (!p.name) p.name = 'BETA';
  Codex.load();                                 // the sets read from the profile
  applyChar(p.charIdx || 0);
}

/* Every door out of this build, closed. Called before anything can write. */
function betaSeal() {
  Save.writeLocal = () => {};
  Save.flush      = async () => {};
  Save.connect    = async () => { Save.status = 'local'; };
  Save.recordRun  = () => {};
  Save.savePrefs  = () => {};
  Board.submit    = () => {};
  Board.backfill  = async () => {};
}

/* Said plainly, wherever you are. A screenshot of this build must never be
   mistaken for a screenshot of the game. */
function drawBetaMark() {
  if (!BETA) return;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.letterSpacing = '0.22em';
  ctx.font = "700 9px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = rgba('#f0abfc', 0.55 + Math.sin(uiTime * 1.8) * 0.2);
  ctx.fillText('BETA  ·  EVERYTHING UNLOCKED  ·  NOTHING IS SAVED', W / 2, H - 8);
  ctx.restore();
}

/* --------------------------------- start ---------------------------------- */
prewarmGlow();
if (BETA) betaSeal();     // before init, so it never opens the shared store
Save.init();
if (BETA) betaUnlockAll();
cam.x = P.x; cam.y = P.y;
requestAnimationFrame(frame);
</script>
