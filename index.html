   floors, bosses, bullets, bloom, the HUD — works untouched on both machines.

   Two things are not simply copied:
     · positions are eased between snapshots rather than snapped to them, so
       thirty updates a second still reads as sixty frames of motion, and
     · the guest's own hull is predicted locally from its own input and only
       corrected toward the host's version, because a ship that answers the
       stick a round trip later does not feel like a ship.
   ========================================================================= */
const MP_LERP = 1 / 22;          // ease window for interpolated positions

function mpGuestBegin() {
  resetGame();                   // clears every array and rebuilds the ship
  state = 'play';
  MP.hostState = 'play';
  MP.overStats = null;
  MP.snapT = 0;
  MP.hostShip.ghosts.length = 0;
  banner('CO-OP ENGAGED', WING_COL, 2.0);
}

/* ------------------------------ decoding ---------------------------------- */
function mpReadSnapshot() {
  if (!mpGuest()) return;
  const tick = r32();
  // unreliable channel: a snapshot that arrives behind one already applied is
  // a rewind, not an update. Unsigned wrap, so a tick counter rolling over
  // 2^32 mid-run is still ordered correctly.
  if (MP.tick && ((tick - MP.tick) >>> 0) > 0x7fffffff) return;
  MP.tick = tick;

  const si = r8();
  MP.hostState = MP_STATES[si] || 'play';
  const flags = r8();
  bossAlive = !!(flags & 1);

  const sIdx = r8(), lp = r8();
  if (STAGES[sIdx] && stage !== STAGES[sIdx]) {
    stage = STAGES[sIdx]; stageIdx = sIdx;
    COL.bg = stage.bg; COL.grid = stage.grid; COL.wall = stage.wall;
  }
  loopNum = lp;
  wave = r16(); score = r32(); credits = r16();
  elapsed = rF();
  camZoomT = rF();
  arena.tx0 = arena.x0 = rPos(); arena.ty0 = arena.y0 = rPos();
  arena.tx1 = arena.x1 = rPos(); arena.ty1 = arena.y1 = rPos();

  P.level = r8(); P.xp = r16(); P.xpNext = r16();
  const hostDash = r8(), hostDashMax = r8();
  P.shield = r8(); P.pickupR = r8();
  P.kills = r16();

  /* ---- the host's ship: interpolated, since it is somebody else's ---- */
  const hs = MP.hostShip;
  hs.px = hs.x; hs.py = hs.y; hs.pang = hs.ang;
  hs.tx = rPos(); hs.ty = rPos(); hs.tang = rAng();
  hs.charIdx = r8(); hs.hp = rF(); hs.maxHp = rF();
  hs.down = !!(flags & 4);
  const hf = r8();
  hs.iframe = (hf & 1) ? 0.2 : 0;
  hs.dash = !!(hf & 2);
  hs.lerp = 0;
  if (!hs.seen) { hs.x = hs.tx; hs.y = hs.ty; hs.ang = hs.tang; hs.seen = true; }

  /* ---- our own hull: authority to reconcile the prediction against ---- */
  const ax = rPos(), ay = rPos(), aang = rAng();
  P.hp = rF(); P.maxHp = rF();
  P.dashCh = r8(); P.dashMax = Math.max(1, hostDashMax);
  const wf = r8();
  const wvx = rI(), wvy = rI();
  const shots = r8();
  MP.down = !!(flags & 2);
  P.down = MP.down;                      // the local hull agrees with the host
  /* Mercy frames are a blink, and a blink is a clock. Pinning the timer to a
     constant on every snapshot froze the phase and left the hull invisible for
     the whole window, so the host only says whether it is running and the
     countdown itself is local. */
  if (wf & 1) { if (P.iframe <= 0) P.iframe = 0.6; }
  else P.iframe = 0;
  P.dashT = (wf & 2) ? Math.max(P.dashT, 0.05) : P.dashT;
  MP.wingLive = !!(wf & 4);
  // Reconcile: a small error is eased away over the next few frames, a large
  // one means the prediction is simply wrong (a dash we never saw, a wall, a
  // revive) and is taken as read.
  const err = len(ax - P.x, ay - P.y);
  if (err > 110 || MP.down) { P.x = ax; P.y = ay; P.vx = wvx; P.vy = wvy; }
  else if (err > 1) {
    P.x = lerp(P.x, ax, 0.3); P.y = lerp(P.y, ay, 0.3);
    P.vx = lerp(P.vx, wvx, 0.3); P.vy = lerp(P.vy, wvy, 0.3);
  }

  /* --- feedback the guest has no way to work out for itself ---
     Its gun is fired on the host, its hits are resolved on the host, and a
     silent ship that takes damage without a sound is the fastest way to make
     a networked game feel like a video of one. */
  for (let s = 0; s < Math.min(3, shots); s++) Audio_.shoot();
  if (shots) {
    burst(P.x + Math.cos(P.ang) * 18, P.y + Math.sin(P.ang) * 18,
          3, COL.bullet, 165, 2.2, 0.16, 0.9, P.ang);
    P.vx -= Math.cos(P.ang) * 8; P.vy -= Math.sin(P.ang) * 8;   // recoil, locally
  }
  if (MP.lastHp === undefined) MP.lastHp = P.hp;
  if (P.hp < MP.lastHp - 0.4 && !MP.down) {
    Audio_.hurt();
    P.hurtFlash = 1; drawFlashT = 0.09; shake(0.42);
    burst(P.x, P.y, 14, '#ef4444', 220, 3, 0.5);
    floatText(P.x, P.y - 26, '-' + Math.round(MP.lastHp - P.hp), '#fca5a5', 16);
  }
  MP.lastHp = P.hp;

  /* ---- enemies: matched by id so each one keeps its own easing ---- */
  const prev = MP.byId || (MP.byId = new Map());
  const next = new Map();
  let n = r16();
  const list = [];
  for (let i = 0; i < n; i++) {
    const id = r16();
    const ti = r8(), bi = r8();
    const x = rPos(), y = rPos(), ang = rAng();
    const r = r8(), hpf = r8(), flash = r8(), fl = r8(), sides = r8();
    const type = MP_ETYPES[ti] || 'grunt';
    const bossKey = bi ? MP_BOSSES[bi - 1] : null;
    const def = bossKey ? BOSSES[bossKey] : ETYPE[type];
    let e = prev.get(id);
    if (!e) {
      // Built once, then only moved. Every cosmetic field the renderer reads
      // is filled from the same tables the host spawned it from, so a remote
      // enemy draws as exactly the thing it is.
      e = { id, type, boss: bossKey, x, y, vx: 0, vy: 0, ang,
            col: def ? def.col : '#f472b6', sides, r, maxHp: 100, hp: 100,
            t: 0, cd: 0, state: 0, phase: 0, atk: 0, atkT: 0, wob: rnd(TAU),
            spin: rnd(0.6, -0.6), flash: 0, slow: 0, slowT: 0, dead: false,
            elite: false, phased: false, invuln: 0, shadow: 0, hitCd: 0,
            absorb: 0, armor: 0, dr: 0, dmg: 0, xp: 0, score: 0 };
      e.px = x; e.py = y; e.pang = ang;
    } else {
      e.px = e.x; e.py = e.y; e.pang = e.ang;
    }
    e.tx = x; e.ty = y; e.tang = ang; e.lerp = 0;
    e.r = r; e.sides = sides; e.hp = hpf; e.maxHp = 255;
    e.flash = flash / 255;
    e.elite = !!(fl & 1); e.phased = !!(fl & 2); e.invuln = (fl & 4) ? 1 : 0;
    e.shadow = (fl & 8) ? 1 : 0; e.virus = !!(fl & 16); e.rage = (fl & 32) ? 1 : 0;
    e.hacked = !!(fl & 64);
    if (e.hacked) { e.col = HACK_COL; e.hackId = id; }
    e.t += MP_LERP;
    next.set(id, e);
    list.push(e);
  }
  /* Anything that was on the last snapshot and is not on this one either died
     or drifted out of the range the host bothers to send. Close in, it died —
     and a kill with no bang reads as a rendering glitch. */
  for (const [id, old] of prev) {
    if (next.has(id) || len(old.x - P.x, old.y - P.y) > 700) continue;
    burst(old.x, old.y, old.type === 'boss' ? 40 : 14, old.col, 250, 3, 0.5);
    ringFx(old.x, old.y, old.r * 0.5, old.r * 2.6, old.col, 0.32, 2);
    if (old.type === 'boss') { Audio_.boom(); shake(0.5); } else Audio_.kill();
  }
  MP.byId = next;
  enemies = list;

  n = r16();
  bullets = [];
  for (let i = 0; i < n; i++) {
    const x = rPos(), y = rPos(), vx = rI(), vy = rI(), r = r8() / 4, cr = r8();
    bullets.push({ x, y, vx, vy, r, crit: !!cr, px: x - vx * 0.02, py: y - vy * 0.02,
                   dmg: 0, life: 9, pierce: 0, ric: 0, dist: 0, hits: null,
                   wob: rnd(TAU), mine: true });
  }

  n = r16();
  ebullets = [];
  for (let i = 0; i < n; i++) {
    const x = rPos(), y = rPos(), vx = rI(), vy = rI(), r = r8(), ki = r8(), ci = r8();
    ebullets.push({ x, y, vx, vy, r, dmg: 0, life: 9,
                    col: MP_COLS[ci] || '#f87171',
                    kind: ki ? MP_BOSSES[ki - 1] : null, spin: rnd(TAU) });
  }

  n = r16();
  gems = [];
  for (let i = 0; i < n; i++)
    gems.push({ x: rPos(), y: rPos(), r: r8(), vx: 0, vy: 0, v: 1, life: 9 });

  n = r16();
  drops = [];
  for (let i = 0; i < n; i++) {
    const x = rPos(), y = rPos(), ki = r8(), r = r8();
    const kind = MP_DROPS[ki] || 'credit';
    drops.push({ x, y, r, kind, vx: 0, vy: 0, v: 1, life: 9, t: rnd(TAU),
                 col: kind === 'heal' ? COL.hp : kind === 'credit' ? '#fbbf24' : '#f0abfc' });
  }

  n = r16();
  hazards = [];
  for (let i = 0; i < n; i++) {
    const ki = r8(), x = rPos(), y = rPos(), r = r16(), ang = rAng();
    const t = rF(), st = r8(), fl = r8(), life = rF();
    const kind = MP_HAZ[ki] || 'fire';
    hazards.push({ kind, x, y, r, ang, t, state: st, life, max: Math.max(life, 1),
                   tick: 0, cd: 0, dmg: 0,
                   friendly: !!(fl & 1), flying: !!(fl & 2), embedded: !!(fl & 4),
                   rot: ang, spin: 0, vx: 0, vy: 0, embT: t,
                   col: kind === 'acid' ? '#4ade80' : kind === 'well' ? '#f0abfc'
                      : kind === 'laser' ? '#a78bfa' : kind === 'current' ? '#67e8f9'
                      : kind === 'delete' ? '#f87171' : kind === 'mirror' ? '#5eead4'
                      : '#f97316' });
  }

  n = r16();
  mortars = [];
  for (let i = 0; i < n; i++)
    mortars.push({ x: rPos(), y: rPos(), r: r16(), t: rF(), max: rF(),
                   col: MP_COLS[r8()] || '#fbbf24', big: !!r8(), dmg: 0 });

  n = r16();
  portals = [];
  for (let i = 0; i < n; i++) {
    const x = rPos(), y = rPos(), r = r16(), t = rF(), alt = r8();
    portals.push({ x, y, r, t, arm: 0, kind: alt ? 'alt' : 'normal',
                   def: alt ? STAGES[0] : STAGES[0] });
  }
  MP.snapT = 0;
}

/* --------------------------- guest: the local frame ----------------------- */
let mpInSeq = 1, mpInT = 0;

function mpSendInput() {
  if (!netLive()) return;
  let ix = 0, iy = 0, fire = false, dash = false;
  if (state === 'play') {
    if (keys['a'] || keys['arrowleft'])  ix -= 1;
    if (keys['d'] || keys['arrowright']) ix += 1;
    if (keys['w'] || keys['arrowup'])    iy -= 1;
    if (keys['s'] || keys['arrowdown'])  iy += 1;
    if (touchUI.move) {
      const dx = touchUI.move.x - touchUI.move.ox, dy = touchUI.move.y - touchUI.move.oy;
      const d = len(dx, dy);
      if (d > 6) { const m = Math.min(1, d / 62) / d; ix = dx * m; iy = dy * m; }
    }
    const il = len(ix, iy);
    if (il > 1) { ix /= il; iy /= il; }
    fire = mouse.down || autoFire || keys['j'];
    if (isTouch) {
      if (touchUI.aim) {
        const dx = touchUI.aim.x - touchUI.aim.ox, dy = touchUI.aim.y - touchUI.aim.oy;
        if (len(dx, dy) > 10) P.ang = Math.atan2(dy, dx);
        fire = true;
      } else {
        const t = nearestEnemy(P.x, P.y, 900);
        if (t) { P.ang = angLerp(P.ang, Math.atan2(t.y - P.y, t.x - P.x), 0.2); fire = true; }
        else fire = false;
      }
    } else {
      mouse.wx = (aimX() - W / 2 - cam.sx) / camZoom + cam.x;
      mouse.wy = (aimY() - H / 2 - cam.sy) / camZoom + cam.y;
      P.ang = Math.atan2(mouse.wy - P.y, mouse.wx - P.x);
    }
    if (keys[' '] || keys['shift']) { dash = true; keys[' '] = false; keys['shift'] = false; }
  }
  MP.wantMx = ix; MP.wantMy = iy;
  MP.wantFire = fire;
  if (dash) MP.wantDash = true;

  wSeek(0);
  w8(MSG.INPUT);
  w16(mpInSeq = (mpInSeq + 1) & 0xffff);
  wI(Math.round(ix * 1000)); wI(Math.round(iy * 1000));
  wAng(P.ang);
  w8((MP.wantFire ? 1 : 0) | (MP.wantDash ? 2 : 0));
  netSend(wOut(), false);
  MP.wantDash = false;
}

/* The guest's own hull, run forward locally with the same maths the host uses
   for it. Divergence is corrected on every snapshot, so this only ever has to
   be right for the sixteen milliseconds before the next correction lands. */
function mpPredict(dt) {
  P.iframe = Math.max(0, P.iframe - dt);
  P.hurtFlash = Math.max(0, P.hurtFlash - dt * 2.4);
  if (MP.down) return;
  const C = CHARS[selectedChar] || CHARS[0];
  if (P.dashT > 0) {
    P.dashT -= dt;
    P.ghosts.push({ x: P.x, y: P.y, ang: P.ang, t: 1 });
    if (P.ghosts.length > 14) P.ghosts.shift();
  } else {
    if (P.ghosts.length) P.ghosts.shift();
    const k = 1 - Math.exp(-16 * dt);
    P.vx = lerp(P.vx, (MP.wantMx || 0) * C.speed, k);
    P.vy = lerp(P.vy, (MP.wantMy || 0) * C.speed, k);
  }
  P.x = clamp(P.x + P.vx * dt, arena.x0 + P.r, arena.x1 - P.r);
  P.y = clamp(P.y + P.vy * dt, arena.y0 + P.r, arena.y1 - P.r);
  if (len(P.vx, P.vy) > 40 && Math.random() < 0.5) {
    const a = Math.atan2(-P.vy, -P.vx);
    spawnPart(P.x + Math.cos(a) * 8, P.y + Math.sin(a) * 8,
      Math.cos(a) * rnd(70, 20), Math.sin(a) * rnd(70, 20),
      rnd(3, 1.4), '#38bdf8', rnd(0.3, 0.14), 0.9);
  }
}

// Ease every interpolated body toward the position the last snapshot gave it.
function mpEase(dt) {
  const k = Math.min(1, dt / MP_LERP);
  for (const e of enemies) {
    if (e.tx === undefined) continue;
    e.lerp = Math.min(1, (e.lerp || 0) + k);
    e.x = lerp(e.px, e.tx, e.lerp);
    e.y = lerp(e.py, e.ty, e.lerp);
    e.ang = angLerp(e.pang, e.tang, e.lerp);
  }
  const hs = MP.hostShip;
  if (hs.seen) {
    hs.lerp = Math.min(1, (hs.lerp || 0) + k);
    hs.x = lerp(hs.px, hs.tx, hs.lerp);
    hs.y = lerp(hs.py, hs.ty, hs.lerp);
    hs.ang = angLerp(hs.pang, hs.tang, hs.lerp);
    if (hs.dash) {
      hs.ghosts.push({ x: hs.x, y: hs.y, ang: hs.ang, t: 1 });
      if (hs.ghosts.length > 14) hs.ghosts.shift();
    } else if (hs.ghosts.length) hs.ghosts.shift();
  }
  // projectiles are dead-reckoned: they are the fastest thing on screen and
  // easing them would read as lag on exactly the objects you dodge
  for (const b of bullets) { b.px = b.x; b.py = b.y; b.x += b.vx * dt; b.y += b.vy * dt; }
  for (const b of ebullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
}

function mpGuestUpdate(dt) {
  MP.snapT += dt;
  mpInT -= dt;
  if (mpInT <= 0) { mpInT = 1 / 60; mpSendInput(); }
  mpPredict(dt);
  mpEase(dt);
  // the music tracks the room the guest is actually standing in
  Audio_.update(clamp(enemies.length / 26 + wave / 22, 0, 1));
  updateParticles(dt);
  updateGWaves(dt);
  updateMalFx(dt);
  camZoom += (camZoomT - camZoom) * (1 - Math.exp(-2.4 * dt));
  updateCamera(dt);
  bannerT = Math.max(0, bannerT - dt);
  if (shopMsgT > 0) shopMsgT -= dt;
  if (uiArm > 0) uiArm -= dt;
  if (state === 'gfx' && fxMeasuring) fxMeasureStep();   // local panel, local clock
  // the host died: show the same board the host is looking at
  if (MP.hostState === 'dead' && state === 'play') {
    state = 'dead';
    lastStats = MP.overStats ||
      { score, wave, kills: 0, level: P.level, time: elapsed,
        sector: stage.name, loop: loopNum, isRecord: false };
  } else if (MP.hostState !== 'dead' && state === 'dead') {
    state = 'play';                       // the host started another run
  }
  /* A snapshot drought is usually the host's tab sitting in the background,
     not a dead link — the heartbeat is the thing that decides that. Say so
     and keep drawing the last picture we were given. */
  MP.stalled = MP.snapT > 1.5;
}

/* ------------------------------- both ships ------------------------------- */
function mpHullPath(charIdx) {
  hullPath((CHARS[charIdx] || CHARS[0]).id);
}

/* The other pilot, drawn in world space: their hull, their name, their health.
   Deliberately not the same silhouette treatment as your own ship — at a
   glance you should never have to work out which one you are flying. */
function mpDrawOther(o, charIdx, col, label, hp, maxHp, down) {
  if (!inView(o.x, o.y, 90)) return;
  const blink = o.iframe > 0 && Math.floor(uiTime * 22) % 2 === 0;

  if (o.ghosts) for (let i = 0; i < o.ghosts.length; i++) {
    const g = o.ghosts[i], f = (i + 1) / o.ghosts.length;
    ctx.save();
    ctx.translate(g.x, g.y); ctx.rotate(g.ang);
    ctx.globalAlpha = 0.3 * f;
    mpHullPath(charIdx);
    ctx.fillStyle = rgba(col, 0.2); ctx.strokeStyle = col; ctx.lineWidth = 1.6;
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(o.x, o.y, down ? 26 : 44, col, down ? 0.2 : 0.34);
  ctx.restore();

  ctx.save();
  ctx.translate(o.x, o.y);
  if (down) {
    // a downed wingman is a wreck on the floor with a clock over it
    ctx.rotate(uiTime * 0.7);
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.setLineDash([5, 6]);
    ctx.beginPath(); ctx.arc(0, 0, 17, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  } else {
    ctx.rotate(o.ang);
    ctx.globalAlpha = blink ? 0.35 : 1;
    ctx.lineWidth = 2.2;
    mpHullPath(charIdx);
    ctx.fillStyle = rgba(col, 0.22); ctx.strokeStyle = col;
    ctx.fill(); ctx.stroke();
    // a ring the player's own ship never wears, so the two never swap places
    ctx.globalAlpha = 0.5;
    ctx.rotate(-o.ang);
    ctx.beginPath(); ctx.arc(0, 0, 19, 0, TAU);
    ctx.strokeStyle = rgba(WING_COL, 0.55); ctx.lineWidth = 1.2; ctx.stroke();
  }
  ctx.restore();

  // nameplate + health, above the hull
  const bx = o.x - 26, by = o.y - 34;
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = 'rgba(3,6,12,0.62)';
  ctx.fillRect(bx - 2, by - 12, 56, 18);
  ctx.fillStyle = rgba(col, 0.9);
  ctx.font = "700 8px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.textAlign = 'left';
  ctx.fillText(String(label || '').slice(0, 12).toUpperCase(), bx, by - 4);
  ctx.fillStyle = 'rgba(15,23,42,0.9)';
  ctx.fillRect(bx, by, 52, 3.5);
  const f = clamp(hp / (maxHp || 1), 0, 1);
  ctx.fillStyle = down ? '#7f1d1d' : (f < 0.3 ? '#f87171' : col);
  ctx.fillRect(bx, by, 52 * f, 3.5);
  if (down) {
    ctx.textAlign = 'center';
    ctx.font = "800 9px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = rgba('#fca5a5', 0.6 + Math.sin(uiTime * 4) * 0.35);
    ctx.fillText('DOWN', o.x, o.y + 4);
  }
  ctx.restore();
}

// Called from render(): whichever ship is not the one you are flying.
function mpDrawCoopShip() {
  if (!MP.on) return;
  if (MP.role === 'host') {
    if (!Wing.live) return;
    mpDrawOther(Wing, Wing.charIdx, (CHARS[Wing.charIdx] || CHARS[0]).col,
                MP.peerName || 'WINGMAN', Wing.hp, Wing.maxHp, Wing.down);
  } else {
    const hs = MP.hostShip;
    if (!hs.seen) return;
    mpDrawOther(hs, hs.charIdx, (CHARS[hs.charIdx] || CHARS[0]).col,
                MP.peerName || 'HOST', hs.hp, hs.maxHp, hs.down);
  }
}

/* ------------------------------- co-op HUD -------------------------------- */
function mpDrawHud() {
  if (!MP.on && MP.lostT <= 0) return;
  if (state === 'codex' || state === 'gfx') return;

  if (!MP.on && MP.lostT > 0) {
    ctx.save();
    ctx.textAlign = 'center';
    fitFont('WINGMAN DISCONNECTED', W - 48, '700', 12,
            "Barlow, 'Segoe UI', system-ui, sans-serif", 9);
    ctx.fillStyle = rgba('#f87171', Math.min(1, MP.lostT));
    ctx.fillText('WINGMAN DISCONNECTED', W / 2, 74);
    ctx.restore();
    return;
  }

  const partnerHp = MP.role === 'host' ? Wing.hp : MP.hostShip.hp;
  const partnerMax = MP.role === 'host' ? Wing.maxHp : MP.hostShip.maxHp;
  const down = MP.role === 'host' ? Wing.down : !!MP.hostShip.down;
  const label = MP.peerName || (MP.role === 'host' ? 'WINGMAN' : 'HOST');
  const col = down ? '#f87171' : WING_COL;

  // below the sector line, which is the lowest thing the stock HUD puts here
  const cardH = down ? 46 : 36;
  const w = Math.min(168, W - 36), x = W - w - 18, y = 118;
  ctx.save();
  ctx.fillStyle = 'rgba(6,10,18,0.8)';
  roundRect(x, y, w, cardH, 9); ctx.fill();
  ctx.strokeStyle = rgba(col, 0.32); ctx.lineWidth = 1;
  roundRect(x, y, w, cardH, 9); ctx.stroke();
  // accent rail: whose ship this is, without spending another word on it
  ctx.fillStyle = rgba(col, down ? 0.55 : 0.9);
  roundRect(x + 1.5, y + 9, 2.5, cardH - 18, 1.5); ctx.fill();

  const ping = (Net.ping || 0) + 'ms';
  ctx.textAlign = 'right';
  ctx.font = "600 9px 'JetBrains Mono', ui-monospace, monospace";
  ctx.fillStyle = (Net.ping || 0) > 140 ? '#f59e0b' : '#64748b';
  ctx.fillText(ping, x + w - 10, y + 14);
  const pingW = ctx.measureText(ping).width;

  ctx.textAlign = 'left';
  const nameStr = clipText(label.toUpperCase(), 16);
  fitFont(nameStr, w - 26 - pingW - 8, '700', 9.5,
          "Barlow, 'Segoe UI', system-ui, sans-serif", 7);
  ctx.fillStyle = rgba(col, 0.95);
  ctx.fillText(nameStr, x + 12, y + 14);

  const barW = w - 24;
  ctx.fillStyle = 'rgba(2,6,14,0.92)';
  roundRect(x + 12, y + 22, barW, 6, 3); ctx.fill();
  const f = clamp(partnerHp / (partnerMax || 1), 0, 1);
  ctx.fillStyle = down ? '#7f1d1d' : (f < 0.3 ? '#f87171' : col);
  if (f > 0) { roundRect(x + 12, y + 22, Math.max(3, barW * f), 6, 3); ctx.fill(); }
  if (down) {
    ctx.textAlign = 'center';
    fitFont('DOWN  ·  UNTIL THE WAVE CLEARS', barW, '700', 8,
            "Barlow, 'Segoe UI', system-ui, sans-serif", 6);
    ctx.fillStyle = '#fca5a5';
    ctx.fillText('DOWN  ·  UNTIL THE WAVE CLEARS', x + w / 2, y + 37);
  }
  ctx.restore();

  // The guest cannot act while the host is in a shop or an upgrade screen, so
  // say what is happening rather than leaving them staring at a frozen room.
  if (MP.role === 'guest' && MP.hostState !== 'play' && MP.hostState !== 'dead') {
    const msg = MP.hostState === 'levelup' ? 'CHOOSING AN UPGRADE'
              : MP.hostState === 'shop'    ? 'IN THE SHOP'
              : MP.hostState === 'planet'  ? 'AT THE PLANETARIUM'
              : MP.hostState === 'library' ? 'IN THE LIBRARY'
              : MP.hostState === 'pause'   ? 'PAUSED'
              : MP.hostState === 'talk' || MP.hostState === 'devtalk' ? 'TALKING'
              : 'BUSY';
    // the DOWN banner owns H-118..H-60 when it is up, so sit clear above it
    const sw = Math.min(280, W - 32), sx = W / 2 - sw / 2;
    const sy = P.down ? H - 160 : H - 92;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(3,6,12,0.82)';
    roundRect(sx, sy, sw, 36, 9); ctx.fill();
    ctx.strokeStyle = rgba(WING_COL, 0.3);
    roundRect(sx, sy, sw, 36, 9); ctx.stroke();
    const line1 = clipText(MP.peerName || 'HOST', 14).toUpperCase() + ' IS ' + msg;
    fitFont(line1, sw - 24, '700', 11, "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
    ctx.fillStyle = WING_COL;
    ctx.fillText(line1, W / 2, sy + 14);
    fitFont('the room is holding — you can still move', sw - 24, '500', 9,
            "Barlow, 'Segoe UI', system-ui, sans-serif", 7);
    ctx.fillStyle = '#64748b';
    ctx.fillText('the room is holding — you can still move', W / 2, sy + 27);
    ctx.restore();
  }
  if (MP.role === 'guest' && MP.stalled) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = "700 11px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = rgba('#fbbf24', 0.6 + Math.sin(uiTime * 5) * 0.35);
    ctx.fillText('WAITING FOR THE HOST — ' + (Net.quiet || 0).toFixed(0) + 's',
                 W / 2, 74);
    ctx.restore();
  }
  /* You are the wreck. Says so plainly, and says what ends it — the camera has
     already moved to your partner, so this has to explain whose ship you are
     watching as well as why you cannot steer it. */
  /* You are the wreck. This sits low on the screen on purpose: the camera has
     moved to your partner, so the middle of the frame is the ship you are
     watching and the last thing it needs is a banner nailed over it. */
  if (P.down) {
    const other = MP.peerName || (MP.role === 'host' ? 'WINGMAN' : 'HOST');
    const bw = Math.min(320, W - 32), bx = W / 2 - bw / 2, by = H - 118;
    ctx.save();
    ctx.fillStyle = 'rgba(3,6,12,0.84)';
    roundRect(bx, by, bw, 58, 11); ctx.fill();
    ctx.strokeStyle = rgba('#f87171', 0.4); ctx.lineWidth = 1;
    roundRect(bx, by, bw, 58, 11); ctx.stroke();
    ctx.textAlign = 'center';
    ctx.save();
    ctx.letterSpacing = '0.14em';
    ctx.font = "700 22px 'Chakra Petch', Barlow, system-ui, sans-serif";
    ctx.fillStyle = rgba('#f87171', 0.65 + Math.sin(uiTime * 3) * 0.2);
    ctx.fillText('DOWN', W / 2, by + 22);
    ctx.restore();
    fitFont('BACK UP WHEN THE WAVE IS CLEAR', bw - 28, '700', 11,
            "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('BACK UP WHEN THE WAVE IS CLEAR', W / 2, by + 39);
    const sub = 'watching ' + clipText(other.toUpperCase(), 14) + '  ·  ' +
                (enemies.length ? enemies.length + ' left in the wave' : 'wave clearing');
    fitFont(sub, bw - 28, '500', 10, "Barlow, 'Segoe UI', system-ui, sans-serif", 7);
    ctx.fillStyle = '#64748b';
    ctx.fillText(sub, W / 2, by + 51);
    ctx.restore();
  }
}

/* ===========================================================================
   LAN CO-OP — the front of house
   One screen, four views: pick a side, wait on a code, type a code, launch.
   Drawn on the canvas in the same idiom as every other panel in the game, so
   it reads as part of the machine rather than as a dialog bolted onto it.
   ========================================================================= */
let lanView = 'home';            // home | host | join | lobby | lost
let lanCode = '';                // what the guest has typed so far
let lanBtns = [];                // hit rects, republished every frame
let lanBlink = 0;
/* The panel is laid out at one fixed size and scaled down to fit a small
   window, so every hit test has to happen in panel space rather than screen
   space. One scalar, set once a frame in drawLan, converts between them. */
let lanScale = 1;
const LAN_W = 500, LAN_H = 320;
function lanMx() { return W / 2 + (mouse.x - W / 2) / lanScale; }
function lanMy() { return H / 2 + (mouse.y - H / 2) / lanScale; }

/* The way in. Top left, where nothing else lives: the badges are on the right,
   the board is centre or right, and the footer is the bottom three lines. */
function menuLanRect() { return { x: 18, y: 14, w: 176, h: 34 }; }

function drawMenuLan() {
  const r = menuLanRect();
  const hot = inRect(mouse.x, mouse.y, r);
  const pulse = 0.7 + Math.sin(uiTime * 2.6) * 0.3;
  ctx.save();
  lanRect(r.x, r.y, r.w, r.h, 8);
  ctx.fillStyle = hot ? rgba(WING_COL, 0.16) : 'rgba(8,13,22,0.72)';
  ctx.fill();
  ctx.strokeStyle = rgba(WING_COL, hot ? 0.9 : 0.4 * pulse);
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.textAlign = 'left';
  ctx.save();
  ctx.letterSpacing = '0.08em';
  ctx.font = "700 11px 'Chakra Petch', Barlow, system-ui, sans-serif";
  ctx.fillStyle = WING_COL;
  ctx.fillText('◈  LAN CO-OP', r.x + 12, r.y + 15);
  ctx.letterSpacing = '0.1em';
  ctx.font = "500 9px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = hot ? '#94a3b8' : '#64748b';
  ctx.fillText('TWO SHIPS, ONE RUN  —  L', r.x + 12, r.y + 27);
  ctx.restore();
  ctx.restore();
  ctx.textAlign = 'center';
}

function openLan() {
  state = 'lan';
  lanView = 'home';
  lanCode = '';
  uiArm = 0.18;
  if (Net.phase !== 'live') { netHangUp(true); Net.phase = 'off'; Net.note = ''; }
  Audio_.select();
}

function lanBack() {
  if (lanView === 'home') { state = 'menu'; return; }
  if (Net.phase !== 'off') { netHangUp(true); Net.phase = 'off'; Net.note = ''; }
  MP.ready = false;
  lanView = 'home';
  lanCode = '';
  Audio_.select();
}

function updateLan(dt) {
  updateMenu(dt);
  // the panel swallows input for a beat after opening, exactly as every other
  // overlay does — and, unlike them, has to run its own timer down
  if (uiArm > 0) uiArm -= dt;
  lanBlink += dt;
  // the moment both sides are up, everybody is looking at the same lobby
  if (netLive() && MP.ready && lanView !== 'lobby') lanView = 'lobby';
  if (Net.phase === 'failed' && (lanView === 'lobby')) lanView = Net.role === 'host' ? 'host' : 'join';
}

/* ------------------------------- input ------------------------------------ */
function lanKey(k) {
  if (uiArm > 0) return;
  if (k === 'escape') { lanBack(); return; }

  if (lanView === 'home') {
    if (k === 'h') { lanView = 'host'; netHost(); Audio_.select(); return; }
    if (k === 'j') { lanView = 'join'; lanCode = ''; Audio_.select(); return; }
    if (k === 'c') { lanCycleChar(); return; }
    return;
  }

  if (lanView === 'join') {
    if (k === 'backspace') { lanCode = lanCode.slice(0, -1); return; }
    if (k === 'enter' || k === ' ') {
      if (lanCode.length === 4 && Net.phase !== 'connecting') { netJoin(lanCode); Audio_.select(); }
      return;
    }
    if (k === 'c' && !lanCode.length) { lanCycleChar(); return; }
    if (/^[a-z0-9]$/.test(k) && lanCode.length < 4) {
      lanCode += k.toUpperCase();
      Audio_.tone(620, 0.05, 'square', 0.05, 900);
      // four characters and a valid room: no reason to make them press enter
      if (lanCode.length === 4) netJoin(lanCode);
    }
    return;
  }

  if (lanView === 'host') {
    if (k === 'c') { lanCycleChar(); return; }
    return;
  }

  if (lanView === 'lobby') {
    if (k === 'c') { lanCycleChar(); return; }
    if ((k === ' ' || k === 'enter') && Net.role === 'host') { mpStartRun(); return; }
    return;
  }

  if (lanView === 'lost') {
    if (k === ' ' || k === 'enter') { lanView = 'home'; Net.phase = 'off'; return; }
  }
}

function lanCycleChar() {
  let n = selectedChar;
  for (let k = 0; k < CHARS.length; k++) {
    n = (n + 1) % CHARS.length;
    if (charOpen(CHARS[n])) break;
  }
  applyChar(n);
  Save.profile.charIdx = selectedChar;
  Save.writeLocal(); Save.flush();
  Audio_.select();
  // the other side draws your hull, so tell it which one you are flying
  if (netLive())
    netEvent({ t: 'hello', sig: NET_SIG(), char: selectedChar,
               name: Save.profile.name || (Net.role === 'host' ? 'HOST' : 'WINGMAN') });
}

function lanClick() {
  const mx = lanMx(), my = lanMy();
  for (const b of lanBtns) {
    if (inRect(mx, my, b)) { lanKey(b.k); return true; }
  }
  return false;
}

/* -------------------------------- drawing --------------------------------- */
function lanRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function lanButton(label, key, x, y, w, h, col, hint) {
  const r = { x, y, w, h, k: key };
  lanBtns.push(r);
  const hot = inRect(lanMx(), lanMy(), r);
  ctx.save();
  lanRect(x, y, w, h, 8);
  ctx.fillStyle = hot ? rgba(col, 0.18) : 'rgba(8,13,22,0.9)';
  ctx.fill();
  ctx.strokeStyle = rgba(col, hot ? 0.95 : 0.5);
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.save();
  ctx.letterSpacing = '0.06em';
  fitFont(label, w - 20, '700', 13, "'Chakra Petch', Barlow, system-ui, sans-serif", 9);
  ctx.fillStyle = col;
  ctx.fillText(label, x + w / 2, y + h / 2 + (hint ? -2 : 4.5));
  ctx.restore();
  if (hint) {
    fitFont(hint, w - 16, '500', 9, "Barlow, 'Segoe UI', system-ui, sans-serif", 7);
    ctx.fillStyle = hot ? '#94a3b8' : '#64748b';
    ctx.fillText(hint, x + w / 2, y + h / 2 + 13);
  }
  ctx.restore();
}

function lanTitle(t, sub) {
  ctx.textAlign = 'center';
  ctx.save();
  ctx.shadowColor = WING_COL; ctx.shadowBlur = 24;
  ctx.letterSpacing = '0.06em';
  fitFont(t, Math.min(560, W - 48), '700', 30,
          "'Chakra Petch', Barlow, system-ui, sans-serif", 18);
  ctx.fillStyle = '#e9d5ff';
  ctx.fillText(t, W / 2, H / 2 - 118);
  ctx.restore();
  ctx.save();
  ctx.letterSpacing = '0.14em';
  fitFont(sub, Math.min(520, W - 48), '600', 10,
          "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
  ctx.fillStyle = '#64748b';
  ctx.fillText(sub, W / 2, H / 2 - 96);
  ctx.restore();
}

/* The pilot each side is flying, side by side. This is also the only place
   that says out loud what the wingman's gun does, because a guest who picked
   EMBER and got bullets deserves to have been told. */
function lanPilots(y) {
  const mine = CHARS[selectedChar];
  const theirs = CHARS[clamp(MP.peerChar | 0, 0, CHARS.length - 1)];
  const known = netLive() && MP.ready;
  const cells = [
    { c: mine, n: Save.profile.name || 'YOU', col: mine.col, me: true },
    { c: known ? theirs : null, n: known ? (MP.peerName || 'WINGMAN') : 'WAITING…',
      col: known ? theirs.col : '#334155', me: false }
  ];
  cells.forEach((cell, i) => {
    const x = W / 2 + (i - 0.5) * 172;
    ctx.save();
    ctx.translate(x, y);
    if (cell.c) {
      ctx.save();
      ctx.rotate(-Math.PI / 2);
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(0, 0, 34, cell.col, 0.34);
      ctx.globalCompositeOperation = 'source-over';
      ctx.lineWidth = 2.2;
      mpHullPath(CHARS.indexOf(cell.c));
      ctx.fillStyle = rgba(cell.col, 0.22);
      ctx.strokeStyle = cell.col;
      ctx.fill(); ctx.stroke();
      ctx.restore();
    } else {
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.4;
      ctx.setLineDash([4, 5]);
      ctx.beginPath(); ctx.arc(0, 0, 17, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
    ctx.textAlign = 'center';
    const pn = String(cell.n).toUpperCase().slice(0, 14);
    fitFont(pn, 160, '700', 11, "'Chakra Petch', Barlow, system-ui, sans-serif", 8);
    ctx.fillStyle = cell.col;
    ctx.fillText(pn, x, y + 34);
    ctx.font = "500 9px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = '#475569';
    ctx.fillText(cell.c ? cell.c.n : '—', x, y + 48);
    if (cell.me) {
      ctx.fillStyle = '#334155';
      ctx.fillText('C  TO SWAP', x, y + 62);
    } else if (known) {
      ctx.fillStyle = '#334155';
      ctx.fillText(Net.role === 'host' ? 'WINGMAN' : 'HOST', x, y + 62);
    }
  });
}

function lanStatusLine(y) {
  const phase = Net.phase;
  const txt = phase === 'failed' ? Net.note || 'connection failed'
            : phase === 'live'   ? 'connected  ·  ' + (Net.ping || 0) + 'ms'
            : phase === 'connecting' ? 'handshaking…'
            : phase === 'waiting' ? 'waiting for a wingman…'
            : phase === 'signalling' ? (Net.note || 'connecting…')
            : '';
  if (!txt) return;
  ctx.textAlign = 'center';
  ctx.font = "600 11px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = phase === 'failed' ? '#f87171'
                : phase === 'live' ? '#34d399' : '#64748b';
  ctx.fillText(txt, W / 2, y);
}

function drawLan() {
  lanBtns = [];
  // the menu is still drifting underneath; it should read as depth, not as
  // text competing with the panel
  ctx.fillStyle = 'rgba(3,5,10,0.93)';
  ctx.fillRect(0, 0, W, H);

  // the panel keeps its proportions and shrinks rather than spilling: the title
  // sits above the frame and the footer below it, so both need headroom
  lanScale = Math.min(1, (W - 32) / LAN_W, (H - 48) / (LAN_H + 44));
  ctx.save();
  if (lanScale < 1) {
    ctx.translate(W / 2, H / 2);
    ctx.scale(lanScale, lanScale);
    ctx.translate(-W / 2, -H / 2);
  }
  const cx = W / 2;
  ctx.save();
  lanRect(cx - LAN_W / 2, H / 2 - 150, LAN_W, LAN_H, 14);
  ctx.fillStyle = 'rgba(6,10,18,0.98)';
  ctx.fill();
  ctx.strokeStyle = rgba(WING_COL, 0.34); ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.restore();

  if (lanView === 'home') {
    lanTitle('LAN CO-OP', 'TWO SHIPS  ·  ONE RUN  ·  ONE NETWORK');
    lanPilots(H / 2 - 46);
    lanButton('HOST A RUN', 'h', cx - 210, H / 2 + 40, 200, 52, WING_COL,
              'you get a code — H');
    lanButton('JOIN A RUN', 'j', cx + 10, H / 2 + 40, 200, 52, COL.player,
              'you type a code — J');
    ctx.textAlign = 'center';
    const homeCopy = 'the host runs the game and keeps the record  ·  the wingman shares the build';
    fitFont(homeCopy, LAN_W - 48, '500', 10, "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
    ctx.fillStyle = '#475569';
    ctx.fillText(homeCopy, cx, H / 2 + 116);
    ctx.font = "500 10px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = '#334155';
    ctx.fillText('same network, direct connection — no relay', cx, H / 2 + 132);
    ctx.fillStyle = '#475569';
    ctx.font = "600 10px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillText('ESC  —  BACK', cx, H / 2 + 156);
    ctx.restore();
    return;
  }

  if (lanView === 'host') {
    lanTitle('HOSTING', 'READ THIS CODE TO YOUR WINGMAN');
    const code = Net.code || '····';
    ctx.textAlign = 'center';
    ctx.save();
    ctx.shadowColor = WING_COL; ctx.shadowBlur = Net.code ? 30 : 0;
    ctx.font = "800 68px 'JetBrains Mono', ui-monospace, monospace";
    ctx.fillStyle = Net.code ? '#f5d0fe' : '#1e293b';
    // letter-spaced by hand: a code read aloud should not run together
    const chars = code.split('');
    const gap = 52;
    chars.forEach((ch, i) => {
      ctx.fillText(ch, cx + (i - (chars.length - 1) / 2) * gap, H / 2 - 26);
    });
    ctx.restore();
    lanPilots(H / 2 + 28);
    if (Net.phase === 'failed') {
      lanStatusLine(H / 2 + 112);
      lanButton('TRY AGAIN', 'h', cx - 90, H / 2 + 120, 180, 38, WING_COL);
    } else {
      lanStatusLine(H / 2 + 124);
    }
    ctx.textAlign = 'center';
    ctx.font = "600 10px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = '#475569';
    ctx.fillText('ESC  —  CANCEL', cx, H / 2 + 158);
    ctx.restore();
    return;
  }

  if (lanView === 'join') {
    lanTitle('JOINING', 'TYPE THE FOUR CHARACTERS');
    ctx.textAlign = 'center';
    const boxW = 54, gap = 14;
    for (let i = 0; i < 4; i++) {
      const bx = cx + (i - 1.5) * (boxW + gap) - boxW / 2;
      const on = i < lanCode.length;
      const cur = i === lanCode.length && Math.floor(lanBlink * 2) % 2 === 0;
      ctx.save();
      lanRect(bx, H / 2 - 78, boxW, 66, 8);
      ctx.fillStyle = on ? rgba(COL.player, 0.12) : 'rgba(8,13,22,0.9)';
      ctx.fill();
      ctx.strokeStyle = cur ? COL.player : rgba(on ? COL.player : '#334155', 0.6);
      ctx.lineWidth = cur ? 2 : 1.2;
      ctx.stroke();
      ctx.restore();
      if (on) {
        ctx.font = "800 38px 'JetBrains Mono', ui-monospace, monospace";
        ctx.fillStyle = '#a5f3fc';
        ctx.fillText(lanCode[i], bx + boxW / 2, H / 2 - 30);
      }
    }
    lanStatusLine(H / 2 + 4);
    lanPilots(H / 2 + 46);
    ctx.textAlign = 'center';
    ctx.font = "600 10px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = '#475569';
    ctx.fillText('BACKSPACE  —  FIX     ·     ESC  —  BACK', cx, H / 2 + 156);
    ctx.restore();
    return;
  }

  if (lanView === 'lobby') {
    lanTitle('READY', 'ROOM ' + (Net.code || '····'));
    lanPilots(H / 2 - 54);
    lanStatusLine(H / 2 + 26);

    ctx.textAlign = 'center';
    const rules = [
      'the wingman shares the build, the level and the credits — and flies its own hull',
      'either ship going down is survivable: clearing the wave stands it back up',
      'the run ends only when both of you are on the floor at once'
    ];
    ctx.fillStyle = '#475569';
    rules.forEach((line, i) => {
      fitFont(line, LAN_W - 44, '500', 9.5, "Barlow, 'Segoe UI', system-ui, sans-serif", 7.5);
      ctx.fillText(line, cx, H / 2 + 44 + i * 14);
    });

    if (Net.role === 'host') {
      const pulse = 0.6 + Math.sin(uiTime * 3.6) * 0.4;
      lanButton('LAUNCH', ' ', cx - 100, H / 2 + 88, 200, 46, WING_COL, 'SPACE');
      ctx.globalAlpha = 1;
      ctx.font = "500 10px Barlow, 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = rgba('#64748b', pulse);
      ctx.fillText('counts on your own record  ·  stays off the global board',
                   cx, H / 2 + 150);
    } else {
      const pulse = 0.55 + Math.sin(uiTime * 3) * 0.35;
      fitFont('WAITING FOR THE HOST TO LAUNCH', LAN_W - 60, '700', 13,
              "'Chakra Petch', Barlow, system-ui, sans-serif", 9);
      ctx.fillStyle = rgba(WING_COL, pulse);
      ctx.fillText('WAITING FOR THE HOST TO LAUNCH', cx, H / 2 + 110);
      ctx.font = "600 10px Barlow, 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = '#475569';
      ctx.fillText('ESC  —  LEAVE', cx, H / 2 + 146);
    }
    ctx.restore();
    return;
  }

  if (lanView === 'lost') {
    lanTitle('DISCONNECTED', Net.note ? Net.note.toUpperCase() : 'THE LINK DROPPED');
    ctx.textAlign = 'center';
    ctx.font = "500 11px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = '#64748b';
    const lostCopy = 'the run continues on the host — you can rejoin with a fresh code';
    fitFont(lostCopy, LAN_W - 48, '500', 11, "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
    ctx.fillStyle = '#64748b';
    ctx.fillText(lostCopy, cx, H / 2 - 20);
    lanButton('BACK', ' ', cx - 90, H / 2 + 30, 180, 44, COL.player, 'SPACE');
  }
  ctx.restore();
}

/* ===========================================================================
   CHALLENGES
   Fifty fixed runs. Each hands you a deliberately broken version of the game
   and names a boss: kill it and the run is a win, whatever the score.

   A challenge is not a difficulty slider. It is one specific idea — no
   upgrades, one hit point, half the room on fire — carried far enough that it
   is a different game for ten minutes. The reward is always the same shape:
   one upgrade that was not in your pool before and is in it forever after.

   Gating is by challenges completed, so the ladder is the same for everyone:
   eight are open from the start and the rest arrive in tiers. A few also want
   something from the ordinary game first — the fracture, the planetarium, the
   bookkeeper — because they are built out of systems you have not met yet.

   Modifier vocabulary. Every key is read somewhere; nothing here is decorative.
     char n     force a pilot          hp n       absolute max HP
     dmg/rate/spd/bspd x               multipliers on the ship
     start [id] upgrades applied at once (repeat an id to stack it)
     dash n     dash charges (0 removes it)   credits n  starting credits
     chip 1     record chip from wave one     mal 1      malware for a dash
     sign id    a zodiac reading taken at the door
     ban [id]   removed from every pool       only [id]  the only offers
     rar [r]    rarities allowed              noLvl 1    no offers at all
     noShop 1   no shop between sectors       xp x       experience multiplier
     ehp/espd/edmg x  enemy health / speed / damage
     elite x    floor on the elite roll       swarm [t]  the only spawns
     budget x   spawn count multiplier        time n     seconds a wave may take
     curse kind a hazard the room keeps laying
     mirror n   shards embedded before you arrive
     fog 1      you see only what is close    move 1     standing still costs hull
     auto 1     the trigger is held for you   noHeal 1   healing does nothing
     oneShot 1  one hit point, no armour
   ========================================================================= */
