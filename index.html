/* ---------------------------------- codex UI -------------------------------
   Two tabs, a grid of cells, one detail panel. Anything not yet met is a dim
   silhouette with no name — the shape is the reward for having survived it.
--------------------------------------------------------------------------- */
let codexTab = 0, codexSel = 0, codexScroll = 0, codexFrom = 'menu';

/* Five sections. Enemies and upgrades are always present; the other three are
   optional pools and stay '????' until you have actually carried one of that
   kind, which is also what decides whether he annotates its entries. They are
   deliberately excluded from completion — see Codex.need(). */
const CODEX_TABS = [
  { id: 'e', label: 'ENEMIES',  set: 'e', cols: 6, ch: 104 },
  { id: 'u', label: 'UPGRADES', set: 'u', cols: 4, ch: 62 },
  { id: 'm', label: 'MALWARE',  set: 'm', cols: 3, ch: 74, opt: true },
  { id: 'b', label: 'BOOKS',    set: 'b', cols: 3, ch: 74, opt: true },
  { id: 'z', label: 'ZODIAC',   set: 'z', cols: 4, ch: 68, opt: true }
];

function codexTabOpen(i) {
  const t = CODEX_TABS[i];
  return !t.opt || Codex[t.set].size > 0;
}

function codexList() {
  switch (CODEX_TABS[codexTab].id) {
    case 'e': return Codex.enemies();
    case 'u': return Codex.upgrades();
    case 'm': return MALWARE.map(m => ({ key: m.id, noteKey: 'mal_' + m.id,
                                         n: m.n, d: m.d, col: m.col }));
    case 'b': return Object.keys(BOOKS).map(k => ({ key: k, noteKey: 'book_' + k,
                                         n: BOOKS[k].n, d: BOOKS[k].d, col: BOOKS[k].col,
                                         sub: 'WRITTEN FROM ' + BOOKS[k].from +
                                              '   ·   ' + BOOKS[k].cost + ' WAVE' +
                                              (BOOKS[k].cost === 1 ? '' : 'S') }));
    default:  return SIGNS.map(s => ({ key: s.id, noteKey: 'sign_' + s.id,
                                         n: s.n, d: s.flavour + '\n' + s.effect,
                                         col: s.good ? '#fbbf24' : '#f0abfc',
                                         sub: s.t + '   ·   ' +
                                              (s.good ? 'BLESSING' : 'CURSE') }));
  }
}
function codexSeen(en) { return Codex[CODEX_TABS[codexTab].set].has(en.key); }
function codexNoteKey(en) { return en.noteKey || en.key; }
function codexCols() { return CODEX_TABS[codexTab].cols; }
function codexGeom() {
  // the annotated copy needs a deeper bottom band: his note sits under the entry
  const tight = H < 470;
  const pad = Math.min(30, Math.max(12, W * 0.03));
  const top = tight ? 92 : 132;
  const bottom = Math.round((codexAnnotated() ? 180 : 152) * (tight ? 0.66 : 1));
  const gw = Math.min(W - pad * 2, 980);
  /* Never fewer than 92px of cell: below that the names run into each other
     and into their neighbours, so the section loses a column instead. */
  const cols = Math.max(2, Math.min(codexCols(), Math.floor(gw / 92)));
  const cw = gw / cols;
  const ch = Math.round(CODEX_TABS[codexTab].ch * (tight ? 0.78 : 1));
  const viewH = Math.max(48, H - top - bottom - 10);
  // the small sections do not fill the band; centre them rather than leaving a
  // page of nothing under four rows
  const rows = Math.ceil(codexList().length / cols);
  const contentH = rows * ch;
  const y0 = top + (contentH < viewH ? Math.round((viewH - contentH) / 2) : 0);
  return { cols, cw, ch, x0: (W - gw) / 2, y0, clipY: top, viewH, tight,
           detailY: top + viewH };
}
function codexCellRect(i) {
  const g = codexGeom();
  const r = Math.floor(i / g.cols), c = i % g.cols;
  return { x: g.x0 + c * g.cw + 4, y: g.y0 + r * g.ch - codexScroll + 4,
           w: g.cw - 8, h: g.ch - 8 };
}
function codexMaxScroll() {
  const g = codexGeom();
  const rows = Math.ceil(codexList().length / g.cols);
  return Math.max(0, rows * g.ch - g.viewH);
}
function codexTabRects() {
  const n = CODEX_TABS.length, gap = 6, h = 26, y = 88;
  const w = Math.max(64, Math.min(132, (Math.min(W - 40, 900) - gap * (n - 1)) / n));
  const total = n * w + gap * (n - 1);
  const x0 = (W - total) / 2;
  return CODEX_TABS.map((_, i) => ({ x: x0 + i * (w + gap), y, w, h }));
}
// Tab / arrow navigation skips locked sections rather than landing on an empty grid
function codexStepTab(dir) {
  for (let k = 1; k <= CODEX_TABS.length; k++) {
    const i = (codexTab + dir * k + CODEX_TABS.length * k) % CODEX_TABS.length;
    if (codexTabOpen(i)) {
      if (i === codexTab) return;
      codexTab = i; codexSel = 0; codexScroll = 0; Audio_.select();
      return;
    }
  }
}

// a compact silhouette from the same shape data the live enemy uses
function drawCodexIcon(en, x, y, size, seen) {
  ctx.save();
  if (seen) {
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(x, y, size * 1.7, en.col, 0.34);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.globalAlpha = seen ? 1 : 0.16;
  ctx.strokeStyle = seen ? en.col : '#64748b';
  ctx.fillStyle = seen ? rgba(en.col, 0.16) : 'rgba(100,116,139,0.1)';
  ctx.lineWidth = en.boss ? 3 : 2.2;
  poly(x, y, size, en.sides || 6, uiTime * (en.boss ? 0.3 : 0.5));
  ctx.fill(); ctx.stroke();
  if (en.boss) {
    ctx.lineWidth = 1.4;
    poly(x, y, size * 0.55, en.sides || 6, -uiTime * 0.5);
    ctx.stroke();
  }
  ctx.restore();
}

// once he has handed it back, the book itself is a different object
const codexAnnotated = () => !!Save.profile.keeperDone;
const INK = '#b91c1c';
const INK_FONT = 'italic 700 12px "Segoe Script", "Ink Free", "Brush Script MT", cursive';

/* Wear drawn from a fixed hash rather than Math.random, so the stains sit still
   instead of crawling around the page every frame. */
function codexWear() {
  const h = (n) => { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); };
  ctx.save();
  // damp stains soaked through the board
  for (let i = 0; i < 7; i++) {
    const x = h(i + 1) * W, y = h(i + 9) * H, r = 60 + h(i + 21) * 190;
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(x, y, r, '#4a2c12', 0.05 + h(i + 33) * 0.05);
  }
  ctx.globalCompositeOperation = 'source-over';
  // a ring where something was set down and forgotten
  ctx.strokeStyle = 'rgba(120,72,32,0.16)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(W * 0.82, H * 0.28, 54, 0, TAU); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(W * 0.18, H * 0.74, 38, 0.4, 5.2); ctx.stroke();
  // creases from being folded and carried
  ctx.strokeStyle = 'rgba(226,232,240,0.05)'; ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const x = W * (0.2 + i * 0.2);
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + (h(i) - 0.5) * 40, H); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(0, H * 0.52); ctx.lineTo(W, H * 0.52 + 8); ctx.stroke();
  // worn edges
  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 14;
  ctx.strokeRect(-7, -7, W + 14, H + 14);
  ctx.strokeStyle = 'rgba(88,52,24,0.22)'; ctx.lineWidth = 2;
  for (let i = 0; i < 26; i++) {
    const t = i / 26, nick = 4 + h(i + 61) * 9;
    ctx.beginPath(); ctx.moveTo(t * W, 0); ctx.lineTo(t * W + 6, nick); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(t * W, H); ctx.lineTo(t * W - 6, H - nick); ctx.stroke();
  }
  ctx.restore();
}

function drawCodex() {
  const worn = codexAnnotated();
  // fully opaque: the live HUD underneath is noise here, not atmosphere
  ctx.fillStyle = worn ? '#0a0705' : '#03060c';
  ctx.fillRect(0, 0, W, H);
  if (worn) codexWear();
  const list = codexList();
  const g = codexGeom();
  codexSel = clamp(codexSel, 0, Math.max(0, list.length - 1));
  const seenCount = list.filter(codexSeen).length;

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = "800 30px 'Chakra Petch', Barlow, system-ui, sans-serif";
  ctx.fillStyle = worn ? '#e7d9c4' : '#e2e8f0';
  ctx.fillText('CODEX', W / 2, 44);
  if (worn) {
    // struck through and re-titled in his hand
    const tw = ctx.measureText('CODEX').width;
    ctx.save();
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W / 2 - tw / 2 - 4, 48); ctx.lineTo(W / 2 + tw / 2 + 4, 40);
    ctx.stroke();
    ctx.font = INK_FONT;
    ctx.fillStyle = INK;
    ctx.textAlign = 'left';
    ctx.fillText('annotated', W / 2 + tw / 2 + 12, 52);
    ctx.restore();
    ctx.textAlign = 'center';
  }
  ctx.font = "600 10px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = worn ? '#6b5a44' : '#475569';
  ctx.fillText(seenCount + ' / ' + list.length + '  RECORDED', W / 2, 66);

  // tabs — locked optional sections show as '????' and cannot be opened
  const tabs = codexTabRects();
  CODEX_TABS.forEach((t, i) => {
    const r = tabs[i], on = codexTab === i, open = codexTabOpen(i);
    const hot = open && inRect(mouse.x, mouse.y, r);
    ctx.fillStyle = on ? 'rgba(103,232,249,0.14)'
                  : (hot ? 'rgba(148,163,184,0.1)' : 'rgba(148,163,184,0.04)');
    ctx.strokeStyle = on ? COL.player : (open ? '#334155' : 'rgba(51,65,85,0.5)');
    ctx.lineWidth = on ? 2 : 1;
    roundRect(r.x, r.y, r.w, r.h, 6); ctx.fill(); ctx.stroke();
    ctx.font = "700 11px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = on ? COL.player : (open ? '#64748b' : '#3f4a5c');
    ctx.fillText(open ? t.label : '? ? ? ?', r.x + r.w / 2, r.y + r.h / 2 + 1);
  });

  // grid, clipped to its own viewport so rows scroll under the header
  ctx.save();
  ctx.beginPath();
  ctx.rect(g.x0 - 6, g.clipY, g.cw * g.cols + 12, g.viewH);
  ctx.clip();
  for (let i = 0; i < list.length; i++) {
    const r = codexCellRect(i);
    if (r.y + r.h < g.clipY - 4 || r.y > g.clipY + g.viewH + 4) continue;
    const en = list[i], seen = codexSeen(en);
    const sel = i === codexSel;
    const hot = inRect(mouse.x, mouse.y, r);
    const kind = CODEX_TABS[codexTab].id;
    const col = !seen ? '#475569'
              : kind === 'u' ? RARITY[en.rar] : en.col;
    ctx.save();
    ctx.globalAlpha = seen ? 1 : 0.5;
    ctx.fillStyle = sel ? rgba(col, 0.13) : (hot ? 'rgba(148,163,184,0.07)' : 'rgba(148,163,184,0.03)');
    ctx.strokeStyle = sel ? col : 'rgba(71,85,105,0.6)';
    ctx.lineWidth = sel ? 2 : 1;
    roundRect(r.x, r.y, r.w, r.h, 7); ctx.fill(); ctx.stroke();
    ctx.restore();

    if (kind === 'e') {
      drawCodexIcon(en, r.x + r.w / 2, r.y + r.h / 2 - 12, en.boss ? 22 : 18, seen);
      const cn = seen ? en.n : '? ? ?';
      fitFont(cn, r.w - 8, '700', 9, "Barlow, 'Segoe UI', system-ui, sans-serif", 6.5);
      ctx.fillStyle = seen ? (en.boss ? en.col : '#94a3b8') : '#475569';
      ctx.fillText(cn, r.x + r.w / 2, r.y + r.h - 14);
    } else if (kind === 'u') {
      // items get no picture, by design — name and rarity only
      ctx.font = "700 8px Barlow, 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = seen ? RARITY[en.rar] : '#475569';
      ctx.fillText(seen ? en.rar.toUpperCase() : '———', r.x + r.w / 2, r.y + 15);
      const un = seen ? upName(en.up) : '? ? ?';
      fitFont(un, r.w - 8, '700', 12, "Barlow, 'Segoe UI', system-ui, sans-serif", 7.5);
      ctx.fillStyle = seen ? '#e2e8f0' : '#475569';
      ctx.fillText(un, r.x + r.w / 2, r.y + r.h - 18);
    } else {
      // malware / books / zodiac: also items, so also no picture
      ctx.font = "700 8px Barlow, 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = seen ? rgba(en.col, 0.85) : '#475569';
      ctx.fillText(seen ? (kind === 'm' ? 'PAYLOAD' : kind === 'b' ? 'VOLUME' : 'READING')
                        : '———', r.x + r.w / 2, r.y + 16);
      ctx.font = "700 11px Barlow, 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = seen ? '#e2e8f0' : '#475569';
      const nm = seen ? clipText(en.n, kind === 'z' ? 13 : 20) : '? ? ?';
      fitFont(nm, r.w - 8, '700', 11, "Barlow, 'Segoe UI', system-ui, sans-serif", 7.5);
      ctx.fillText(nm, r.x + r.w / 2, r.y + r.h / 2 + 4);
      if (seen && en.sub) {
        const sb = clipText(en.sub, 30);
        fitFont(sb, r.w - 8, '500', 8, "Barlow, 'Segoe UI', system-ui, sans-serif", 6);
        ctx.fillStyle = '#475569';
        ctx.fillText(sb, r.x + r.w / 2, r.y + r.h - 12);
      }
    }

    // a tick in the margin where he had something to say about this one
    if (worn && seen && KEEPER_NOTES[codexNoteKey(en)]) {
      ctx.save();
      ctx.strokeStyle = INK; ctx.lineWidth = 1.8; ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.moveTo(r.x + 6, r.y + 9);
      ctx.lineTo(r.x + 10, r.y + 15);
      ctx.lineTo(r.x + 17, r.y + 5);
      ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();

  // scrollbar, only when there is something to scroll
  const ms = codexMaxScroll();
  if (ms > 0) {
    const trackX = g.x0 + g.cw * g.cols + 10;
    const th = g.viewH * (g.viewH / (g.viewH + ms));
    const ty = g.clipY + (g.viewH - th) * (codexScroll / ms);
    ctx.fillStyle = 'rgba(148,163,184,0.12)';
    roundRect(trackX, g.clipY, 4, g.viewH, 2); ctx.fill();
    ctx.fillStyle = 'rgba(148,163,184,0.45)';
    roundRect(trackX, ty, 4, th, 2); ctx.fill();
  }

  // detail panel
  const en = list[codexSel];
  if (en) {
    const seen = codexSeen(en);
    const dy = g.detailY + (g.tight ? 34 : 42);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, g.detailY + 6, W, Math.max(24, H - 30 - g.detailY - 6));
    ctx.clip();
    // a hairline between the shelf and the entry it is describing
    ctx.fillStyle = 'rgba(71,85,105,0.3)';
    ctx.fillRect(W / 2 - Math.min(340, W / 2 - 20), g.detailY + 12,
                 Math.min(680, W - 40), 1);
    const kind = CODEX_TABS[codexTab].id;
    ctx.textAlign = 'center';
    const title = seen ? (kind === 'u' ? upName(en.up) : en.n) : 'NOT YET ENCOUNTERED';
    fitFont(title, W - 56, '700', g.tight ? 16 : 20,
            "'Chakra Petch', Barlow, system-ui, sans-serif", 12);
    ctx.fillStyle = !seen ? '#475569' : (kind === 'u' ? RARITY[en.rar] : en.col);
    ctx.fillText(title, W / 2, dy);
    ctx.font = "700 9px Barlow, 'Segoe UI', system-ui, sans-serif";
    if (kind === 'e' && en.boss) {
      ctx.fillStyle = '#7f1d1d';
      ctx.fillText('BOSS', W / 2, dy - 20);
    } else if (seen && kind === 'u') {
      ctx.fillStyle = '#475569';
      ctx.fillText(en.rar.toUpperCase() + '   ·   UP TO ' + en.max, W / 2, dy - 20);
    } else if (seen && en.sub) {
      ctx.fillStyle = '#475569';
      ctx.fillText(en.sub, W / 2, dy - 20);
    }

    ctx.font = "400 12px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = seen ? '#94a3b8' : '#334155';
    const own = kind === 'm' ? 'Install one and it will be recorded here.'
              : kind === 'b' ? 'Carry one and it will be recorded here.'
              : kind === 'z' ? 'Accept one and it will be recorded here.'
              : 'Meet it once and it will be recorded here.';
    const text = seen ? (kind === 'u' ? upDesc(en.up) : en.d) : own;
    // zodiac entries carry flavour and effect on separate lines
    let endY = dy + 24;
    for (const para of String(text).split('\n')) {
      endY = wrapText(para, W / 2, endY, Math.min(700, W - 80), 17) + 17;
    }
    endY -= 17;

    // his hand, under the printed entry, at the angle of somebody writing fast
    const note = worn && seen && KEEPER_NOTES[codexNoteKey(en)];
    if (note) {
      ctx.save();
      ctx.translate(W / 2, endY + 26);
      ctx.rotate(-0.022);
      ctx.font = INK_FONT;
      ctx.fillStyle = INK;
      ctx.globalAlpha = 0.92;
      ctx.fillText('— ' + note, 0, 0);
      // the underline he puts through his own sentences
      const nw = ctx.measureText('— ' + note).width;
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = INK; ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(-nw / 2, 7); ctx.lineTo(nw / 2 - 4, 8.5);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();                       // end of the clipped detail block
  }

  ctx.save();
  ctx.letterSpacing = '0.08em';
  const ck = 'TAB / Q E section  ·  ARROWS / WHEEL browse  ·  ESC close';
  fitFont(ck, W - 32, '500', 10, "Barlow, 'Segoe UI', system-ui, sans-serif", 7);
  ctx.fillStyle = worn ? '#4a3d2c' : '#334155';
  ctx.fillText(ck, W / 2, H - 18);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

function openCodex(from) {
  codexFrom = from || 'menu';
  codexTab = 0; codexSel = 0; codexScroll = 0;
  state = 'codex'; uiArm = 0.3;
  Audio_.select();
}
function closeCodex() {
  state = codexFrom === 'pause' ? 'pause' : 'menu';
  uiArm = 0.3;
  Audio_.select();
}
// keep the selected cell inside the viewport when moving by keyboard
function codexReveal() {
  const g = codexGeom();
  const row = Math.floor(codexSel / g.cols);
  const top = row * g.ch, bot = top + g.ch;
  if (top < codexScroll) codexScroll = top;
  else if (bot > codexScroll + g.viewH) codexScroll = bot - g.viewH;
  codexScroll = clamp(codexScroll, 0, codexMaxScroll());
}

/* A die in its package: dark silicon, traces running out to the pins, and a
   core that pulses like something is executing on it that should not be. */
function drawMalChip(x, y, s, col) {
  const t = uiTime;
  ctx.save();
  ctx.translate(x, y);

  const pins = 7, pl = s * 0.3, pw = s * 0.11, span = s * 1.28;
  const pinY = i => -span / 2 + (i + 0.5) * (span / pins);

  // legs, then hot tips travelling down them
  ctx.fillStyle = '#78350f';
  for (let i = 0; i < pins; i++) {
    ctx.fillRect(-s - pl, pinY(i) - pw / 2, pl, pw);
    ctx.fillRect(s, pinY(i) - pw / 2, pl, pw);
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < pins; i++) {
    const on = 0.2 + 0.8 * Math.max(0, Math.sin(t * 5 + i * 1.6));
    ctx.fillStyle = rgba(col, 0.75 * on);
    ctx.fillRect(-s - pl, pinY(i) - pw / 2, pl * 0.55, pw);
    ctx.fillRect(s + pl * 0.45, pinY(i) - pw / 2, pl * 0.55, pw);
  }
  ctx.restore();

  // package
  roundRect(-s, -s * 0.76, s * 2, s * 1.52, s * 0.1);
  ctx.fillStyle = '#17060a'; ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 2.4; ctx.stroke();
  roundRect(-s * 0.94, -s * 0.7, s * 1.88, s * 1.4, s * 0.08);
  ctx.strokeStyle = rgba(col, 0.28); ctx.lineWidth = 1; ctx.stroke();

  // orientation notch, so it reads as a real part
  ctx.beginPath();
  ctx.arc(-s, 0, s * 0.14, -Math.PI / 2, Math.PI / 2);
  ctx.fillStyle = '#2a0a10'; ctx.fill();
  ctx.strokeStyle = rgba(col, 0.75); ctx.lineWidth = 1.4; ctx.stroke();

  // the die
  roundRect(-s * 0.58, -s * 0.44, s * 1.16, s * 0.88, s * 0.04);
  ctx.fillStyle = '#2b0b12'; ctx.fill();
  ctx.strokeStyle = rgba(col, 0.55); ctx.lineWidth = 1; ctx.stroke();

  // etched traces, with a charge running out along one of them
  ctx.save();
  roundRect(-s * 0.58, -s * 0.44, s * 1.16, s * 0.88, s * 0.04); ctx.clip();
  ctx.strokeStyle = rgba(col, 0.34); ctx.lineWidth = 1;
  for (let i = 0; i < 7; i++) {
    const yy = -s * 0.36 + i * s * 0.12;
    ctx.beginPath();
    ctx.moveTo(-s * 0.58, yy);
    ctx.lineTo(-s * 0.2 + (i % 3) * s * 0.1, yy);
    ctx.lineTo(-s * 0.2 + (i % 3) * s * 0.1, yy + s * 0.07);
    ctx.lineTo(s * 0.58, yy + s * 0.07);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    const lane = (Math.floor(t * 1.3) + i * 2) % 7;
    const yy = -s * 0.36 + lane * s * 0.12;
    const p = ((t * 1.3 + i * 0.33) % 1);
    const px = -s * 0.58 + p * s * 1.16;
    ctx.fillStyle = rgba('#fecaca', 0.85);
    ctx.fillRect(px, yy + s * 0.035 - 1, s * 0.1, 2);
  }
  ctx.restore();

  // the core, executing
  const pulse = 0.55 + Math.sin(t * 6) * 0.45;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(0, 0, s * (0.7 + pulse * 0.35), col, 0.55);
  ctx.restore();
  ctx.fillStyle = rgba(col, 0.25 + pulse * 0.3);
  ctx.strokeStyle = '#fecaca'; ctx.lineWidth = 1.6;
  roundRect(-s * 0.17, -s * 0.17, s * 0.34, s * 0.34, s * 0.03);
  ctx.fill(); ctx.stroke();

  ctx.restore();
}

/* ------------------------------ effects panel ------------------------------
   Shown once after an update that adds new effects, and from the pause menu
   any time. Costs are measured, not guessed, and shown so the choice is
   informed rather than trial and error.
--------------------------------------------------------------------------- */
let gfxSel = 0, gfxFirstRun = false, gfxReturn = 'play';

function openGfx(from) {
  gfxReturn = from || 'play';
  gfxSel = 0;
  state = 'gfx';
  uiArm = 0.25;
  Audio_.select();
}
function closeGfx() {
  fxSave();
  state = gfxReturn === 'settings' ? 'settings'
        : gfxReturn === 'pause' ? 'pause' : 'play';
  gfxFirstRun = false;
  uiArm = 0.2;
  Audio_.select();
}
function gfxToggle(i) {
  const r = FX_ROWS[i];
  if (!r) return;
  FXO[r.k] = FXO[r.k] ? 0 : 1;
  fxLevel = (FXO.bloom || FXO.aber || FXO.film) ? FX.ON : FX.OFF;
  Audio_.tone(FXO[r.k] ? 620 : 300, 0.05, 'square', 0.05, 900);
}

function gfxRects() {
  const w = Math.min(560, W - 60), x = (W - w) / 2;
  const top = Math.max(96, H / 2 - 220);
  const rows = FX_ROWS.map((r, i) => ({ x, y: top + 62 + i * 34, w, h: 30, i }));
  const by = top + 62 + FX_ROWS.length * 34 + 16;
  const bw = (w - 20) / 3;
  return { rows, w, x, top,
    presets: [
      { x, y: by, w: bw, h: 34, lvl: 2, n: 'EVERYTHING' },
      { x: x + bw + 10, y: by, w: bw, h: 34, lvl: 1, n: 'BALANCED' },
      { x: x + (bw + 10) * 2, y: by, w: bw, h: 34, lvl: 0, n: 'FASTEST' }
    ],
    measure: { x: x + w / 2 - 250, y: by + 74, w: 156, h: 38 },
    done: { x: x + w / 2 - 78, y: by + 74, w: 156, h: 38 } };
}

function drawGfx() {
  ctx.fillStyle = 'rgba(4,6,12,0.93)';
  ctx.fillRect(0, 0, W, H);
  const g = gfxRects();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  ctx.font = "800 24px 'Chakra Petch', Barlow, system-ui, sans-serif";
  ctx.fillStyle = COL.player;
  ctx.fillText(gfxFirstRun ? 'NEW EFFECTS ADDED' : 'EFFECTS', W / 2, g.top + 10);
  ctx.font = "500 12px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(gfxFirstRun
    ? 'Turn off anything your machine would rather not draw.'
    : (Save.profile.gfxCosts ? 'Measured here. Good at finding the expensive one; rough below a ms.'
                             : 'Estimates. Press MEASURE HERE to time them on your machine.'),
    W / 2, g.top + 34);

  let total = 0;
  for (const r of FX_ROWS) if (FXO[r.k]) total += r.cost;

  ctx.textAlign = 'left';
  for (const box of g.rows) {
    const r = FX_ROWS[box.i], on = !!FXO[r.k];
    const hot = inRect(mouse.x, mouse.y, box) || gfxSel === box.i;
    ctx.fillStyle = hot ? 'rgba(103,232,249,0.10)' : 'rgba(255,255,255,0.03)';
    roundRect(box.x, box.y, box.w, box.h, 6); ctx.fill();
    if (hot) {
      ctx.strokeStyle = rgba(COL.player, 0.5); ctx.lineWidth = 1.4;
      roundRect(box.x, box.y, box.w, box.h, 6); ctx.stroke();
    }
    // switch
    const sx = box.x + 12, sy = box.y + box.h / 2;
    ctx.fillStyle = on ? COL.player : '#334155';
    roundRect(sx, sy - 7, 30, 14, 7); ctx.fill();
    ctx.fillStyle = on ? '#062f36' : '#94a3b8';
    ctx.beginPath(); ctx.arc(sx + (on ? 22 : 8), sy, 5, 0, TAU); ctx.fill();

    /* Cost is the column that must never be squeezed — it is the reason the
       row exists — so it is measured first and the description takes what is
       left, or stands down entirely on a narrow panel. */
    const tiny = r.cost <= 0.05;
    const costStr = tiny ? 'free' : r.cost.toFixed(1) + ' ms';
    ctx.font = "600 11px 'JetBrains Mono', ui-monospace, monospace";
    const costW = ctx.measureText(costStr).width;
    const nameX = box.x + 54, descX = box.x + 176;
    const descW = box.x + box.w - 12 - costW - 14 - descX;

    fitFont(r.n, (descW > 60 ? descX : box.x + box.w - 12 - costW - 14) - nameX - 10,
            '700', 13, "Barlow, 'Segoe UI', system-ui, sans-serif", 9);
    ctx.fillStyle = on ? '#e2e8f0' : '#64748b';
    ctx.fillText(r.n, nameX, sy);
    if (descW > 60) {
      fitFont(r.d, descW, '400', 11, "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
      // fitFont stops at its floor, so check it actually got there
      if (ctx.measureText(r.d).width <= descW) {
        ctx.fillStyle = '#64748b';
        ctx.fillText(r.d, descX, sy);
      }
    }
    ctx.textAlign = 'right';
    ctx.font = "600 11px 'JetBrains Mono', ui-monospace, monospace";
    ctx.fillStyle = tiny ? '#475569'
                  : r.cost >= 4 ? '#f87171' : r.cost >= 2 ? '#fbbf24' : '#4ade80';
    ctx.fillText(costStr, box.x + box.w - 12, sy);
    ctx.textAlign = 'left';
  }

  ctx.textAlign = 'center';
  for (const b of g.presets) {
    const hot = inRect(mouse.x, mouse.y, b);
    ctx.fillStyle = hot ? 'rgba(103,232,249,0.16)' : 'rgba(255,255,255,0.05)';
    roundRect(b.x, b.y, b.w, b.h, 7); ctx.fill();
    ctx.strokeStyle = rgba(COL.player, hot ? 0.7 : 0.28); ctx.lineWidth = 1.4;
    roundRect(b.x, b.y, b.w, b.h, 7); ctx.stroke();
    ctx.font = "700 12px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = hot ? '#e2e8f0' : '#94a3b8';
    ctx.fillText(b.n, b.x + b.w / 2, b.y + b.h / 2);
  }

  // what it all adds up to, against the frame you actually have
  ctx.font = "600 11px 'JetBrains Mono', ui-monospace, monospace";
  ctx.fillStyle = total > 12 ? '#f87171' : total > 7 ? '#fbbf24' : '#4ade80';
  ctx.fillText('≈ ' + total.toFixed(1) + ' ms of a 16.7 ms frame',
               W / 2, g.presets[0].y + 52);

  const m = g.measure, mh = inRect(mouse.x, mouse.y, m);
  ctx.fillStyle = mh ? 'rgba(251,191,36,0.20)' : 'rgba(251,191,36,0.08)';
  roundRect(m.x, m.y, m.w, m.h, 8); ctx.fill();
  ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 1.6;
  roundRect(m.x, m.y, m.w, m.h, 8); ctx.stroke();
  ctx.font = "800 12px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = '#fbbf24';
  ctx.fillText(fxMeasuring
    ? 'MEASURING ' + (fxMeasureI + 1) + '/' + FX_ROWS.length +
      '  ' + '·'.repeat(fxSamples.length + 1)
    : 'MEASURE HERE', m.x + m.w / 2, m.y + m.h / 2);

  // what this machine is actually doing, right now
  ctx.font = "600 11px 'JetBrains Mono', ui-monospace, monospace";
  ctx.fillStyle = fpsAvg >= 55 ? '#4ade80' : fpsAvg >= 40 ? '#fbbf24' : '#f87171';
  ctx.fillText(Math.round(fpsAvg) + ' fps  ·  ' + frameMs.toFixed(1) + ' ms/frame',
               W / 2, m.y + m.h + 22);

  const d = g.done, dh = inRect(mouse.x, mouse.y, d);
  ctx.fillStyle = dh ? 'rgba(103,232,249,0.22)' : 'rgba(103,232,249,0.10)';
  roundRect(d.x, d.y, d.w, d.h, 8); ctx.fill();
  ctx.strokeStyle = COL.player; ctx.lineWidth = 1.8;
  roundRect(d.x, d.y, d.w, d.h, 8); ctx.stroke();
  ctx.font = "800 14px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = COL.player;
  ctx.fillText('DONE   [G]', d.x + d.w / 2, d.y + d.h / 2);
  ctx.textBaseline = 'alphabetic';
}

/* ===========================================================================
   SETTINGS
   Volume, mouse sensitivity, autofire and the effects panel, gathered behind
   one key. They used to be scattered: a slider nailed to the bottom of the
   menu, a G that only the footer knew about, and a T you had to be told. One
   door, on S, from the menu and from the pause screen alike.
   ========================================================================= */
const SENS_MIN = 0.40, SENS_MAX = 2.50;
const aimSens = () => clamp((Save.profile && Save.profile.sens) || 1, SENS_MIN, SENS_MAX);

/* The pointer is absolute — the game hides the system cursor and draws its
   own — so sensitivity scales how far the aim travels for a given movement of
   the hand, measured out from the middle of the screen. It applies only while
   flying: on a menu the crosshair has to sit exactly where the pointer is, or
   what you click and what you aimed at stop being the same place. */
function aimX() { const s = aimSens(); return state === 'play' ? W / 2 + (mouse.x - W / 2) * s : mouse.x; }
function aimY() { const s = aimSens(); return state === 'play' ? H / 2 + (mouse.y - H / 2) * s : mouse.y; }

let setFrom = 'menu', setSel = 0;
let sensRect = null, sensDrag = false;

function openSettings(from) {
  setFrom = from || 'menu';
  setSel = 0;
  state = 'settings';
  uiArm = 0.25;
  Audio_.select();
}
function closeSettings() {
  Save.savePrefs();
  state = setFrom === 'pause' ? 'pause' : 'menu';
  uiArm = 0.25;
  Audio_.select();
}

function settingsRects() {
  const w = Math.min(520, W - 56), x = (W - w) / 2;
  const rowH = Math.min(46, Math.max(34, H * 0.075)), gap = 9;
  const bodyH = 3 * (rowH + gap) + 52 + 46;
  const top = clamp(H / 2 - (bodyH + 70) / 2, 60, H - bodyH - 78);
  const rows = [];
  for (let i = 0; i < 3; i++) rows.push({ x, y: top + 64 + i * (rowH + gap), w, h: rowH, i });
  const by = top + 64 + 3 * (rowH + gap) + 8;
  return { x, w, top, rowH, rows,
    gfx:  { x, y: by, w, h: 40, i: 3 },
    done: { x: x + w / 2 - 92, y: by + 50, w: 184, h: 40, i: 4 } };
}

/* The sensitivity slider. Its own rect and its own drag, so it and the volume
   slider can sit on the same screen without fighting over one of each. */
function drawSensSlider(cx, cy, w) {
  const h = 5, x = cx - w / 2;
  sensRect = { x, y: cy - 13, w, h: 26 };
  const v = (aimSens() - SENS_MIN) / (SENS_MAX - SENS_MIN);
  const hot = sensDrag || inRect(mouse.x, mouse.y, sensRect);
  const col = hot ? COL.player : '#64748b';
  ctx.save();
  ctx.fillStyle = 'rgba(148,163,184,0.18)';
  roundRect(x, cy - h / 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = col;
  roundRect(x, cy - h / 2, Math.max(h, w * v), h, h / 2); ctx.fill();
  // the detent at 1.00, so the default is findable by feel as well as by eye
  const onex = x + w * ((1 - SENS_MIN) / (SENS_MAX - SENS_MIN));
  ctx.fillStyle = 'rgba(203,213,225,0.55)';
  ctx.fillRect(onex - 0.5, cy - 8, 1, 16);
  const kx = x + w * v;
  if (hot) drawGlow(kx, cy, 16, col, 0.4);
  ctx.fillStyle = hot ? '#f8fafc' : '#cbd5e1';
  ctx.beginPath(); ctx.arc(kx, cy, hot ? 7 : 6, 0, TAU); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(kx, cy, hot ? 7 : 6, 0, TAU); ctx.stroke();
  ctx.restore();
}
function sensFromMouse() {
  if (!sensRect) return;
  const t = clamp((mouse.x - sensRect.x) / sensRect.w, 0, 1);
  setSens(SENS_MIN + t * (SENS_MAX - SENS_MIN));
}
function setSens(v) {
  Save.profile.sens = +clamp(v, SENS_MIN, SENS_MAX).toFixed(2);
}

function drawSettings() {
  ctx.fillStyle = 'rgba(4,6,12,0.93)';
  ctx.fillRect(0, 0, W, H);
  const g = settingsRects();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  ctx.save();

  ctx.font = "800 24px 'Chakra Petch', Barlow, system-ui, sans-serif";

  ctx.restore();
  ctx.font = "500 12px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(setFrom === 'pause' ? 'the run is holding — nothing here costs you anything'
                                   : 'kept on your record, on this machine and any other',
               W / 2, g.top + 36);

  const rowBox = (box, on) => {
    const hot = inRect(mouse.x, mouse.y, box) || setSel === box.i;
    ctx.fillStyle = hot ? 'rgba(103,232,249,0.10)' : 'rgba(255,255,255,0.03)';
    roundRect(box.x, box.y, box.w, box.h, 6); ctx.fill();
    if (hot) {
      ctx.strokeStyle = rgba(COL.player, 0.5); ctx.lineWidth = 1.4;
      roundRect(box.x, box.y, box.w, box.h, 6); ctx.stroke();
    }
    return hot;
  };
  const label = (box, n, d) => {
    ctx.textAlign = 'left';

    ctx.font = "700 13px Barlow, 'Segoe UI', system-ui, sans-serif";

    if (d) {
      ctx.font = "400 10px Barlow, 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = '#64748b';
      ctx.fillText(d, box.x + 16, box.y + box.h / 2 + 9);
    }
    ctx.restore();
    ctx.textAlign = 'center';
  };

  /* --- volume --- */
  const valX = (b) => b.x + b.w - 16;
  const trackX = (b) => b.x + b.w - 150;
  const value = (b, t, col) => {
    ctx.save();
    ctx.textAlign = 'right';
    ctx.font = "600 11px 'JetBrains Mono', ui-monospace, monospace";
    ctx.fillStyle = col || '#cbd5e1';
    ctx.fillText(t, valX(b), b.y + b.h / 2);
    ctx.restore();
    ctx.textAlign = 'center';
  };

  let b = g.rows[0];
  rowBox(b);
  label(b, 'VOLUME', Audio_.muted ? 'muted — nothing will make a sound' : null);
  drawVolSlider(trackX(b), b.y + b.h / 2, 118, true);
  value(b, Math.round(Audio_.vol * 100) + '%', Audio_.muted ? '#475569' : '#cbd5e1');

  /* --- mouse sensitivity --- */
  b = g.rows[1];
  rowBox(b);
  label(b, 'MOUSE SENSITIVITY', 'how far the aim travels with your hand');
  drawSensSlider(trackX(b), b.y + b.h / 2, 118);
  value(b, '×' + aimSens().toFixed(2),
        Math.abs(aimSens() - 1) < 0.02 ? '#4ade80' : '#cbd5e1');

  /* --- autofire --- */
  b = g.rows[2];
  rowBox(b);
  label(b, 'AUTOFIRE', 'hold nothing; the gun keeps working');
  const sx = b.x + b.w - 46, sy = b.y + b.h / 2;
  ctx.fillStyle = autoFire ? COL.player : '#334155';
  roundRect(sx, sy - 7, 30, 14, 7); ctx.fill();
  ctx.fillStyle = autoFire ? '#062f36' : '#94a3b8';
  ctx.beginPath(); ctx.arc(sx + (autoFire ? 22 : 8), sy, 5, 0, TAU); ctx.fill();

  /* --- the effects panel, one door further in --- */
  const gb = g.gfx, gh = inRect(mouse.x, mouse.y, gb) || setSel === gb.i;
  ctx.fillStyle = gh ? 'rgba(103,232,249,0.16)' : 'rgba(255,255,255,0.05)';
  roundRect(gb.x, gb.y, gb.w, gb.h, 7); ctx.fill();
  ctx.strokeStyle = rgba(COL.player, gh ? 0.7 : 0.28); ctx.lineWidth = 1.4;
  roundRect(gb.x, gb.y, gb.w, gb.h, 7); ctx.stroke();
  ctx.textAlign = 'left';
  ctx.font = "700 13px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = gh ? '#e2e8f0' : '#94a3b8';
  ctx.fillText('EFFECTS & PERFORMANCE', gb.x + 16, gb.y + gb.h / 2);
  let on = 0;
  for (const r of FX_ROWS) if (FXO[r.k]) on++;
  ctx.textAlign = 'right';
  ctx.font = "600 11px 'JetBrains Mono', ui-monospace, monospace";
  ctx.fillStyle = '#64748b';
  ctx.fillText(on + ' / ' + FX_ROWS.length + '  ·  ' + Math.round(fpsAvg) + ' fps',
               gb.x + gb.w - 16, gb.y + gb.h / 2);
  ctx.textAlign = 'center';

  const d = g.done, dh = inRect(mouse.x, mouse.y, d) || setSel === d.i;
  ctx.fillStyle = dh ? 'rgba(103,232,249,0.22)' : 'rgba(103,232,249,0.10)';
  roundRect(d.x, d.y, d.w, d.h, 8); ctx.fill();
  ctx.strokeStyle = COL.player; ctx.lineWidth = 1.8;
  roundRect(d.x, d.y, d.w, d.h, 8); ctx.stroke();
  ctx.font = "800 14px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = COL.player;
  ctx.fillText('DONE   [S]', d.x + d.w / 2, d.y + d.h / 2);
  ctx.textBaseline = 'alphabetic';
}

/* Arrow keys work the rows the same way the effects panel works its own. */
function settingsKey(k) {
  if (uiArm > 0) return;
  if (k === 's' || k === 'escape' || k === 'enter') {
    if (k === 'enter' && setSel === 3) { openGfx('settings'); return; }
    closeSettings(); return;
  }
  if (k === 'arrowdown') { setSel = (setSel + 1) % 5; Audio_.select(); return; }
  if (k === 'arrowup')   { setSel = (setSel + 4) % 5; Audio_.select(); return; }
  const step = (k === 'arrowright' || k === 'd') ? 1 : (k === 'arrowleft' || k === 'a') ? -1 : 0;
  if (!step) return;
  if (setSel === 0) { Audio_.setVol(Audio_.vol + step * 0.05); Save.savePrefs(); }
  else if (setSel === 1) { setSens(aimSens() + step * 0.05); Save.savePrefs(); }
  else if (setSel === 2) { autoFire = !autoFire; Save.savePrefs(); Audio_.select(); }
}

function settingsClick() {
  if (uiArm > 0) return;
  const g = settingsRects();
  if (inRect(mouse.x, mouse.y, g.rows[2])) {
    autoFire = !autoFire; Save.savePrefs(); Audio_.select(); return;
  }
  if (inRect(mouse.x, mouse.y, g.gfx))  { openGfx('settings'); return; }
  if (inRect(mouse.x, mouse.y, g.done)) { closeSettings(); return; }
}

/* ------------------------------ planetarium UI ----------------------------- */
function planetButtons() {
  const bw = Math.min(180, W * 0.32), bh = 38;
  const y = H / 2 + 142;
  return planetRevealed
    ? { accept: { x: -999, y: -999, w: 0, h: 0 },
        leave:  { x: W / 2 - bw / 2, y, w: bw, h: bh } }
    : { accept: { x: W / 2 - bw - 8, y, w: bw, h: bh },
        leave:  { x: W / 2 + 8,      y, w: bw, h: bh } };
}

// deterministic star field per sign, so a constellation always looks the same
function constellation(seed, n) {
  let s = seed >>> 0;
  const rnd_ = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  const pts = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    pts.push([ (0.12 + t * 0.76) + (rnd_() - 0.5) * 0.16,
               0.5 + Math.sin(t * Math.PI * (1 + rnd_())) * 0.32 + (rnd_() - 0.5) * 0.12,
               0.5 + rnd_() * 0.9 ]);
  }
  return pts;
}

function drawPlanetarium() {
  const sign = planetSign;
  if (!sign) return;
  const gold = '#fbbf24', purple = '#a855f7';
  const accent = planetRevealed ? (sign.good ? gold : purple) : '#c4b5fd';

  ctx.fillStyle = 'rgba(2,3,8,0.93)';
  ctx.fillRect(0, 0, W, H);

  // drifting starfield backdrop
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 70; i++) {
    const a = i * 2.399 + uiTime * 0.04;
    const r = ((i * 37) % 100) / 100;
    const x = W / 2 + Math.cos(a) * r * W * 0.62;
    const y = H / 2 + Math.sin(a) * r * H * 0.58;
    const tw = 0.25 + 0.75 * Math.abs(Math.sin(uiTime * 1.1 + i));
    drawGlow(x, y, 2 + (i % 3), '#93c5fd', 0.1 + tw * 0.14);
  }
  ctx.restore();

  const cx = W / 2, cy = H / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = "700 11px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = '#64748b';
  ctx.fillText('P L A N E T A R I U M', cx, cy - 176);

  // constellation panel
  const pw = Math.min(400, W - 70), ph = 116;
  const px = cx - pw / 2, py = cy - 158;
  const pts = constellation(sign.seed, 7);
  ctx.save();
  ctx.strokeStyle = rgba(accent, 0.35);
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  pts.forEach((p, i) => {
    const x = px + p[0] * pw, y = py + p[1] * ph;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
  ctx.globalCompositeOperation = 'lighter';
  pts.forEach((p, i) => {
    const x = px + p[0] * pw, y = py + p[1] * ph;
    const tw = 0.6 + 0.4 * Math.sin(uiTime * 2 + i * 1.7);
    drawGlow(x, y, (6 + p[2] * 9) * tw, accent, 0.75);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x, y, 1.4 + p[2], 0, TAU); ctx.fill();
  });
  ctx.restore();

  ctx.font = "800 38px 'Chakra Petch', Barlow, system-ui, sans-serif";
  ctx.save();

/* Build every glow sprite up front. Each new colour costs a canvas plus a
   radial gradient on first use, and doing that lazily produced a visible
   hitch the first time a sector introduced unfamiliar colours. */
function prewarmGlow() {
  const cols = new Set();
  const add = c => { if (typeof c === 'string' && c[0] === '#') cols.add(c); };
  for (const k in COL) add(COL[k]);
  for (const k in RARITY) add(RARITY[k]);
  for (const k in ETYPE) add(ETYPE[k].col);
  for (const k in BOSSES) add(BOSSES[k].col);
  for (const s of STAGES.concat(ALT_STAGES)) { add(s.accent); add(s.wall); }
  ('#fbbf24 #a855f7 #fb923c #a3e635 #38bdf8 #5eead4 #a5f3fc #c4b5fd #e2e8f0 #f87171 ' +
   '#93c5fd #7dd3fc #a78bfa #fcd34d #f0abfc #6ee7b7 #fde047 #ef4444 #cffafe #99f6e4 ' +
   '#bae6fd #f5d0fe #ddd6fe #fed7aa #fecdd3 #bfdbfe #f1f5f9 #f8fafc #fecaca #fef08a')
    .split(' ').forEach(add);
  cols.forEach(glowSprite);
  return cols.size;
}

/* ===========================================================================
   LAN CO-OP — transport
   Two ships, one run. The host simulates everything and the guest flies a
   wingman inside that simulation: there is no shared authority anywhere, so
   there is nothing to reconcile beyond the guest's own hull.

   Signalling is the dead-drop at /api/room. A host posts an offer and gets a
   four-character code back; a guest reads the room with that code, answers it,
   and both sides trickle ICE through the same blob until the peers see each
   other. Nothing here is read again once the data channel opens.

   Two channels, deliberately:
     vr-state  unreliable, unordered — snapshots and input. A dropped frame of
               either is worth less than the delay of asking for it again.
     vr-ctl    reliable, ordered — the handshake, run start, state changes,
               the goodbye. These are events, not samples; losing one desyncs
               the two sides for the rest of the run.
   Both are `negotiated`, so neither peer has to wait for an ondatachannel
   round trip before it can send.

   There is no TURN server and there deliberately isn't one: this is LAN
   co-op. Peers that cannot reach each other directly (or through the one
   STUN server, for two machines behind the same router) do not connect, and
   the UI says so rather than hanging.
   ========================================================================= */
const NET_ROOM   = '/api/room';
const NET_POLL   = 620;          // ms between signalling reads
const NET_ICE_MS = 240;          // ICE is batched, not posted one at a time
const NET_WAIT   = 120000;       // a host may sit on a code for two minutes
const NET_HAND   = 45000;        // but a handshake that stalls is dead
const NET_STALE  = 14000;        // silence from a live peer before we call it

/* Bumped when the wire format changes. Two builds that disagree would trade
   plausible-looking nonsense for a while and then diverge, so they refuse
   each other at the handshake instead. */
const NET_PROTO = 3;
const NET_SIG = () => NET_PROTO + '.' + Object.keys(ETYPE).length + '.' +
                      Object.keys(BOSSES).length + '.' + STAGES.length;

const Net = {
  gen: 0,                  // bumped on every reset; cancels in-flight loops
  role: null,              // 'host' | 'guest'
  pc: null, chS: null, chC: null,
  code: '',
  /* off | signalling | waiting | connecting | live | lost | failed */
  phase: 'off',
  note: '',
  peerName: '', peerChar: 0,
  ping: 0, pingT: 0, lastRx: 0, lastTx: 0, quiet: 0, beat: 0,
  iceOut: [], iceSeen: 0, remoteSet: false,
  deadline: 0,
  rx: 0, tx: 0,            // bytes, for the connection readout
  rxN: 0, txN: 0
};

const netLive = () => Net.phase === 'live';
const netSleep = ms => new Promise(r => setTimeout(r, ms));

async function netApi(url, opts) {
  const r = await fetch(url, opts);
  let j = null;
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && j.error) || ('server said ' + r.status));
  return j || {};
}
const netPost = (url, body) => netApi(url, {
  method: 'POST',
  headers: { 'content-type': 'application/json' },
  body: JSON.stringify(body)
});

function netReset(role) {
  netHangUp(true);
  Net.gen++;
  Net.role = role;
  Net.code = ''; Net.note = ''; Net.peerName = ''; Net.peerChar = 0;
  Net.ping = 0; Net.pingT = 0; Net.lastRx = 0; Net.lastTx = 0;
  Net.iceOut = []; Net.iceSeen = 0; Net.remoteSet = false;
  Net.rx = 0; Net.tx = 0; Net.rxN = 0; Net.txN = 0;
  Net.deadline = Date.now() + NET_WAIT;
  Net.phase = 'signalling';
}

/* Tearing down is its own function because every exit uses it: cancelling from
   the lobby, a failed handshake, a peer that walked away, and the run ending. */
function netHangUp(quiet) {
  Net.gen++;
  clearInterval(Net.beat); Net.beat = 0;
  if (Net.chC && Net.chC.readyState === 'open' && !quiet) {
    try { Net.chC.send(JSON.stringify({ t: 'bye' })); } catch (e) {}
  }
  for (const ch of [Net.chS, Net.chC]) { try { if (ch) ch.close(); } catch (e) {} }
  try { if (Net.pc) Net.pc.close(); } catch (e) {}
  Net.chS = Net.chC = Net.pc = null;
}

function netFail(e) {
  const msg = (e && e.message) || String(e || 'connection failed');
  netHangUp(true);
  Net.phase = 'failed';
  Net.note = msg;
}

/* Peers that drop mid-run are not an error state — the run keeps going. */
function netLost(why) {
  if (Net.phase === 'off' || Net.phase === 'failed') return;
  const wasLive = Net.phase === 'live';
  netHangUp(true);
  Net.phase = wasLive ? 'lost' : 'failed';
  Net.note = why || 'connection lost';
  if (wasLive) mpPeerGone();
}

function netMakePeer() {
  const pc = new RTCPeerConnection({
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
    iceCandidatePoolSize: 2
  });
  Net.pc = pc;
  const gen = Net.gen;

  // Fixed ids on both sides: the channels exist before the offer does, so the
  // first snapshot can go out the instant the transport is up.
  Net.chS = pc.createDataChannel('vr-state', {
    negotiated: true, id: 0, ordered: false, maxRetransmits: 1
  });
  Net.chC = pc.createDataChannel('vr-ctl', { negotiated: true, id: 1, ordered: true });
  Net.chS.binaryType = 'arraybuffer';
  Net.chC.binaryType = 'arraybuffer';

  const opened = () => {
    if (gen !== Net.gen) return;
    if (!Net.chS || !Net.chC) return;
    if (Net.chS.readyState !== 'open' || Net.chC.readyState !== 'open') return;
    Net.phase = 'live';
    Net.note = '';
    Net.lastRx = performance.now();
    clearInterval(Net.beat);
    Net.beat = setInterval(netBeat, 1000);
    mpOnOpen();
  };
  Net.chS.onopen = opened;
  Net.chC.onopen = opened;
  Net.chS.onmessage = e => netOnMessage(e.data);
  Net.chC.onmessage = e => netOnMessage(e.data);
  const gone = () => { if (gen === Net.gen) netLost('wingman disconnected'); };
  Net.chS.onclose = gone;
  Net.chC.onclose = gone;

  pc.onicecandidate = e => {
    if (gen !== Net.gen || !e.candidate) return;
    const c = e.candidate;
    Net.iceOut.push({ c: c.candidate, m: c.sdpMid, i: c.sdpMLineIndex });
  };
  pc.onconnectionstatechange = () => {
    if (gen !== Net.gen) return;
    const s = pc.connectionState;
    if (s === 'failed') netLost('could not reach the other machine');
    else if (s === 'closed') netLost('connection closed');
  };
  return pc;
}

async function netAddIce(c) {
  if (!c || !Net.pc) return;
  try {
    await Net.pc.addIceCandidate(
      typeof c === 'string' ? { candidate: c, sdpMid: '0' }
                            : { candidate: c.c, sdpMid: c.m, sdpMLineIndex: c.i });
  } catch (e) { /* a candidate the other side cannot use is not fatal */ }
}

/* Candidates trickle in over the life of the handshake, so they are posted in
   batches rather than one request per candidate. */
async function netFlushIce(gen) {
  if (!Net.iceOut.length || !Net.code) return;
  const batch = Net.iceOut.splice(0, Net.iceOut.length);
  try {
    await netPost(NET_ROOM + '?code=' + Net.code, { as: Net.role, ice: batch });
  } catch (e) {
    if (gen === Net.gen) Net.iceOut = batch.concat(Net.iceOut);   // try again next tick
  }
}

async function netTakePeer(peer) {
  if (!peer) return;
  if (Net.role === 'host' && peer.answer && !Net.remoteSet) {
    Net.remoteSet = true;
    Net.phase = 'connecting';
    Net.note = 'wingman found — handshaking';
    Net.deadline = Date.now() + NET_HAND;
    await Net.pc.setRemoteDescription({ type: 'answer', sdp: peer.answer });
  }
  const ice = peer.ice || [];
  for (let i = Net.iceSeen; i < ice.length; i++) await netAddIce(ice[i]);
  Net.iceSeen = Math.max(Net.iceSeen, ice.length);
}

async function netPollLoop(gen) {
  while (gen === Net.gen &&
         (Net.phase === 'waiting' || Net.phase === 'connecting' || Net.phase === 'signalling')) {
    await netFlushIce(gen);
    if (gen !== Net.gen) return;
    try {
      const r = await netApi(NET_ROOM + '?code=' + Net.code + '&as=' + Net.role);
      if (gen !== Net.gen) return;
      if (r.peer) await netTakePeer(r.peer);
    } catch (e) {
      // A 404 for a guest means the host tore the room down; anything else is
      // a blip worth retrying until the deadline.
      if (Net.role === 'guest' && /no such room/i.test(e.message || '')) {
        netFail(new Error('the host closed that room'));
        return;
      }
    }
    if (gen !== Net.gen) return;
    if (Date.now() > Net.deadline) {
      netFail(new Error(Net.phase === 'waiting'
        ? 'nobody joined — the code expired'
        : 'the handshake timed out'));
      return;
    }
    await netSleep(NET_POLL);
  }
}

async function netHost() {
  netReset('host');
  const gen = Net.gen;
  try {
    Net.note = 'opening a room…';
    netMakePeer();
    const offer = await Net.pc.createOffer();
    await Net.pc.setLocalDescription(offer);
    if (gen !== Net.gen) return;
    const res = await netPost(NET_ROOM, { offer: Net.pc.localDescription.sdp });
    if (gen !== Net.gen) return;
    Net.code = res.code;
    Net.phase = 'waiting';
    Net.note = '';
    Net.deadline = Date.now() + NET_WAIT;
    netPollLoop(gen);
  } catch (e) { if (gen === Net.gen) netFail(e); }
}

async function netJoin(code) {
  netReset('guest');
  const gen = Net.gen;
  Net.code = String(code || '').toUpperCase();
  try {
    Net.note = 'looking for the room…';
    const r = await netApi(NET_ROOM + '?code=' + Net.code + '&as=guest');
    if (gen !== Net.gen) return;
    if (!r.peer || !r.peer.offer) throw new Error('no such room');
    netMakePeer();
    await Net.pc.setRemoteDescription({ type: 'offer', sdp: r.peer.offer });
    Net.remoteSet = true;
    const ice = r.peer.ice || [];
    for (const c of ice) await netAddIce(c);
    Net.iceSeen = ice.length;
    const ans = await Net.pc.createAnswer();
    await Net.pc.setLocalDescription(ans);
    if (gen !== Net.gen) return;
    await netPost(NET_ROOM + '?code=' + Net.code,
                  { as: 'guest', answer: Net.pc.localDescription.sdp });
    if (gen !== Net.gen) return;
    Net.phase = 'connecting';
    Net.note = 'handshaking…';
    Net.deadline = Date.now() + NET_HAND;
    netPollLoop(gen);
  } catch (e) { if (gen === Net.gen) netFail(e); }
}

/* --------------------------------- wire ---------------------------------- */
/* One preallocated buffer per direction. Snapshots go out thirty times a
   second for the length of a run; allocating a fresh one each time would hand
   the collector a megabyte a minute to sweep up mid-fight. */
const MSG = { HELLO: 1, INPUT: 2, SNAP: 3, EVT: 4, PING: 5, PONG: 6 };

const _nb = new ArrayBuffer(192 * 1024);
const _nv = new DataView(_nb);
let _np = 0;
const wSeek = p => { _np = p; };
const w8  = v => { _nv.setUint8(_np, v & 255); _np += 1; };
const w16 = v => { _nv.setUint16(_np, v < 0 ? 0 : (v > 65535 ? 65535 : v)); _np += 2; };
const wI  = v => { _nv.setInt16(_np, v < -32768 ? -32768 : (v > 32767 ? 32767 : v | 0)); _np += 2; };
const w32 = v => { _nv.setUint32(_np, v >>> 0); _np += 4; };
const wF  = v => { _nv.setFloat32(_np, v); _np += 4; };
const wPos = v => wI(Math.round(v * 2));            // half-pixel precision
const wAng = a => wI(Math.round(a * 5000));
const wOut = () => _nb.slice(0, _np);

let _rv = null, _rp = 0;
const rOpen = buf => { _rv = new DataView(buf); _rp = 0; };
const rLeft = () => _rv.byteLength - _rp;
const r8  = () => { const v = _rv.getUint8(_rp);  _rp += 1; return v; };
const r16 = () => { const v = _rv.getUint16(_rp); _rp += 2; return v; };
const rI  = () => { const v = _rv.getInt16(_rp);  _rp += 2; return v; };
const r32 = () => { const v = _rv.getUint32(_rp); _rp += 4; return v; };
const rF  = () => { const v = _rv.getFloat32(_rp); _rp += 4; return v; };
const rPos = () => rI() / 2;
const rAng = () => rI() / 5000;

function netSend(buf, reliable) {
  const ch = reliable ? Net.chC : Net.chS;
  if (!ch || ch.readyState !== 'open') return false;
  // Backpressure: a stalled transport should drop samples, not queue a
  // minute of them and then replay the whole minute at once.
  if (!reliable && ch.bufferedAmount > 262144) return false;
  try {
    ch.send(buf);
    Net.tx += buf.byteLength || (buf.length || 0);
    Net.txN++;
    Net.lastTx = performance.now();
    return true;
  } catch (e) { return false; }
}
const netEvent = obj => netSend(JSON.stringify(obj), true);

function netOnMessage(data) {
  Net.lastRx = performance.now();
  Net.rx += (data.byteLength || data.length || 0);
  Net.rxN++;
  if (typeof data === 'string') {
    let m = null;
    try { m = JSON.parse(data); } catch (e) { return; }
    mpOnEvent(m);
    return;
  }
  rOpen(data);
  const type = r8();
  if (type === MSG.SNAP)       mpReadSnapshot();
  else if (type === MSG.INPUT) mpReadInput();
  else if (type === MSG.PING) {
    const stamp = r32();
    wSeek(0); w8(MSG.PONG); w32(stamp);
    netSend(wOut(), false);
  } else if (type === MSG.PONG) {
    const stamp = r32();
    Net.ping = Math.max(0, Math.round(performance.now()) - stamp);
  }
}

/* Heartbeat, and the liveness check that rides on it: a peer whose machine
   went to sleep never closes the channel, it just stops answering.

   Deliberately on a timer rather than on the frame clock. A browser stops
   servicing requestAnimationFrame the moment its tab is in the background, so
   a frame-driven heartbeat would have each side declaring the other dead
   every time somebody alt-tabbed. Timers keep running when hidden. */
function netBeat() {
  if (!netLive()) return;
  wSeek(0); w8(MSG.PING); w32(Math.round(performance.now()));
  netSend(wOut(), false);
  if (Net.lastRx && performance.now() - Net.lastRx > NET_STALE)
    netLost('wingman stopped responding');
}

// How long the other side has been silent, for the UI to grumble about.
function netTick(dt) {
  Net.quiet = netLive() && Net.lastRx ? (performance.now() - Net.lastRx) / 1000 : 0;
}

/* ===========================================================================
   LAN CO-OP — the run
   One run, two ships, one authority. The host simulates the entire game
   exactly as it does solo; the guest's hull is simulated inside that same
   world from the input it sends, and the host ships back a picture of the
   result thirty times a second.

   The guest never simulates anything except its own hull, which it predicts
   locally so its own controls feel wired to the ship rather than to the
   network. Everything else it draws is the host's word.

   What the wingman shares and what it does not:
     shared    the build, the level, credits, score, the run itself
     its own   hull, hit points, dash charges, and the way it dies
   A downed wingman is not a lost run — it stands back up. The run ends when
   the host's ship dies, because the run's record belongs to the host.
   ========================================================================= */
const MP_ETYPES = Object.keys(ETYPE);
const MP_BOSSES = Object.keys(BOSSES);
const MP_HAZ    = ['fire', 'acid', 'vent', 'laser', 'current', 'mirror', 'delete', 'well'];
const MP_DROPS  = ['credit', 'heal', 'nuke'];
/* Every state the host can be in that the guest has to react to. Index, not
   name, goes on the wire — a mismatch here is caught by the version signature. */
const MP_STATES = ['play', 'levelup', 'shop', 'planet', 'library', 'talk', 'devtalk',
                   'gfx', 'pause', 'dead', 'codex', 'amalcut', 'menu', 'name', 'lan'];

/* Colours are sent as palette indices. Every colour any entity can carry is
   already declared somewhere in this file, so the palette is derived rather
   than written out and cannot drift from what the game actually spawns. */
const MP_COLS = [...new Set([
  ...Object.values(ETYPE).map(t => t.col),
  ...Object.values(BOSSES).map(b => b.col),
  COL.player, COL.bullet, COL.crit, COL.xp, COL.hp, COL.shield, COL.elite,
  '#f97316', '#4ade80', '#f0abfc', '#a78bfa', '#67e8f9', '#5eead4', '#f87171',
  '#fbbf24', '#ffffff', '#e2e8f0', '#fca5a5', '#a5f3fc'
])];
const MP_COLI = new Map(MP_COLS.map((c, i) => [c, i]));
const mpCol = c => (MP_COLI.has(c) ? MP_COLI.get(c) : 0);

/* Caps. A snapshot has to fit in a handful of packets or an unreliable
   channel starts losing whole frames of it on a busy screen. Entities are
   filtered by distance to the guest first — what it cannot see it cannot
   miss — and the caps are only reached in the worst rooms in the game. */
const MP_MAX = { e: 72, b: 150, eb: 220, g: 90, d: 24, h: 44, m: 18 };
const MP_CULL = 1250;            // half a screen past the guest's view

const MP = {
  on: false,               // a co-op run is live
  role: null,              // 'host' | 'guest' — mirrors Net.role while connected
  ready: false,            // handshake done, both sides in the lobby
  name: '', peerName: '', peerChar: 0,
  tick: 0, sendT: 0,
  hostState: 'play',       // guest: what the host is doing right now
  lostT: 0,                // banner timer after a wingman drops
  wasState: '',
  buildSig: '',
  /* guest only */
  snapT: 0,                   // seconds since the last snapshot landed
  stalled: false,
  down: false, lastHp: undefined,
  overStats: null,
  hostShip: { x: 0, y: 0, ang: 0, hp: 1, maxHp: 1, charIdx: 0, iframe: 0, dash: 0, ghosts: [] }
};

const mpHost  = () => MP.on && MP.role === 'host';
const mpGuest = () => MP.on && MP.role === 'guest';

/* Who the camera is watching. Your own ship, unless it is on the floor and
   your partner is not — then theirs, because that is where the run is. */
function mpCamSubject() {
  if (!MP.on || !P.down) return P;
  if (MP.role === 'host') return (Wing.live && !Wing.down) ? Wing : P;
  return MP.hostShip.seen ? MP.hostShip : P;
}

/* --------------------------------- wingman --------------------------------
   Losing the run takes both of you.

   Either pilot can be put on the floor, and neither one being down ends
   anything: the survivor holds the room alone until the wave is cleared, and
   clearing it stands the other one back up. Only a room that puts both ships
   down at once ends the run — which is also the only case where there is
   nobody left to clear a wave, so the rule closes itself.

   Note that the host's ship going down does not move authority anywhere. The
   host's machine keeps simulating exactly as it did; its pilot is simply a
   wreck on the floor inside that simulation. Handing the simulation to the
   other machine is only needed when the host actually leaves, which is a
   different problem from the host dying.
--------------------------------------------------------------------------- */
const WING_COL  = '#c084fc';     // its own accent, so two ships never read alike

const Wing = {
  live: false, down: false,
  x: 0, y: 0, vx: 0, vy: 0, ang: 0, r: 13,
  hp: 100, maxHp: 100, iframe: 0, hurtFlash: 0,
  dashT: 0, dashDX: 0, dashDY: 0, dashCh: 1, dashMax: 1, dashCd: 1.5, dashRe: 0,
  fireT: 0, charIdx: 0, ghosts: [], shots: 0,
  // last input the guest sent, held until the next one arrives
  in: { mx: 0, my: 0, ang: 0, fire: false, dash: false, seq: 0, t: 0 }
};

function wingSpawn() {
  const C = CHARS[Wing.charIdx] || CHARS[0];
  Wing.live = true; Wing.down = false;
  Wing.maxHp = C.hp; Wing.hp = C.hp;
  Wing.x = clamp(P.x + 54, arena.x0 + 20, arena.x1 - 20);
  Wing.y = P.y;
  Wing.vx = Wing.vy = 0; Wing.ang = 0;
  Wing.iframe = 1.4; Wing.hurtFlash = 0;
  Wing.dashT = 0; Wing.dashCh = 1; Wing.dashMax = 1; Wing.dashRe = 0;
  Wing.fireT = 0; Wing.shots = 0; Wing.ghosts.length = 0;
  Wing.in.fire = false; Wing.in.dash = false; Wing.in.mx = 0; Wing.in.my = 0;
}

/* The wingman, if it is standing. A downed pilot stops pulling the room onto
   itself: nothing aims at it, nothing shoots it, and no pickup flies to it. */
function mpPilots() {
  if (!mpHost() || !Wing.live || Wing.down) return null;
  return Wing;
}
function mpAim(x, y) {
  const w = mpPilots();
  if (!w) return P;                    // solo, or the wingman is on the floor
  if (P.down) return w;                // you are on the floor: it is all theirs
  const dp = (P.x - x) * (P.x - x) + (P.y - y) * (P.y - y);
  const dw = (w.x - x) * (w.x - x) + (w.y - y) * (w.y - y);
  return dw < dp ? w : P;
}

/* Whether a pilot can be put down rather than killed: somebody else has to
   still be standing to hold the room and clear the wave. */
const coopCanDown = () => mpHost() && Wing.live && !Wing.down && !P.down;

/* The host's own ship, on the floor. The simulation does not pause, move or
   change hands — it carries on around the wreck. */
function hostDown() {
  P.hp = 0; P.down = true;
  P.vx = 0; P.vy = 0; P.dashT = 0; P.laserT = 0;
  P.laserSegs.length = 0; P.charge = 0;
  explode(P.x, P.y, 150, 0, COL.player);
  burst(P.x, P.y, 52, COL.player, 360, 4, 1.0);
  ringFx(P.x, P.y, 8, 220, COL.player, 0.7, 5);
  drawFlashT = 0.14; shake(0.8); Audio_.over();
  banner('YOU ARE DOWN — CLEAR THE WAVE', '#f87171', 2.6);
}

function hostRevive() {
  P.down = false;
  P.hp = P.maxHp * 0.5;
  P.iframe = 2.2; P.hurtFlash = 0;
  const w = Wing.live && !Wing.down ? Wing : null;
  if (w) {
    P.x = clamp(w.x + rnd(50, -50), arena.x0 + 20, arena.x1 - 20);
    P.y = clamp(w.y + rnd(50, -50), arena.y0 + 20, arena.y1 - 20);
  }
  ringFx(P.x, P.y, 10, 200, COL.player, 0.7, 5);
  burst(P.x, P.y, 40, COL.player, 300, 3.4, 0.8);
  Audio_.heal();
}

/* Clearing a wave is what stands people back up — the only thing that does.
   Called from the wave-clear branch, so a boss wave counts too: go down in a
   boss fight and you are out of it until your partner finishes the boss. */
function coopReviveWave() {
  if (!mpHost()) return;
  const wasP = P.down, wasW = Wing.live && Wing.down;
  if (!wasP && !wasW) return;
  if (wasP) hostRevive();
  if (wasW) wingRevive();
  banner(wasP && wasW ? 'BOTH BACK UP' : wasP ? 'BACK UP' : 'WINGMAN BACK UP',
         COL.hp, 2.0);
}

function hurtWing(dmg, opts) {
  if (!Wing.live || Wing.down || state !== 'play') return;
  if (freeGod) return;
  if (opts && opts.pure) {
    Wing.hp -= Math.max(0.5, dmg);
    Wing.hurtFlash = Math.max(Wing.hurtFlash, 0.5);
    if (Wing.hp <= 0) wingDown();
    return;
  }
  if (Wing.iframe > 0) return;
  // The wingman carries the host's armour at half weight: it shares the build
  // without the plating that build bought for a hull it is not flying.
  const d = Math.max(1, dmg * P.frailty - P.armor * 0.5);
  Wing.hp -= d;
  Wing.iframe = 0.62; Wing.hurtFlash = 1;
  burst(Wing.x, Wing.y, 14, '#ef4444', 210, 3, 0.45);
  floatText(Wing.x, Wing.y - 26, '-' + Math.round(d), '#fca5a5', 15);
  Audio_.hurt();
  if (Wing.hp <= 0) wingDown();
}

function wingDown() {
  Wing.hp = 0; Wing.vx = Wing.vy = 0; Wing.dashT = 0;
  explode(Wing.x, Wing.y, 120, 0, WING_COL);
  burst(Wing.x, Wing.y, 46, WING_COL, 340, 4, 0.9);
  ringFx(Wing.x, Wing.y, 8, 180, WING_COL, 0.6, 4);
  shake(0.5); Audio_.over();
  /* Nobody left standing: there is no one to clear the wave that would stand
     either of you up, so this is where the run actually ends. */
  if (P.down) {
    Wing.down = true;
    banner('BOTH DOWN', '#f87171', 2.6);
    gameOver();
    return;
  }
  Wing.down = true;
  banner('WINGMAN DOWN — CLEAR THE WAVE', WING_COL, 2.6);
}

function wingRevive() {
  Wing.down = false;
  Wing.hp = Wing.maxHp * 0.5;
  Wing.iframe = 2.2; Wing.hurtFlash = 0;
  const at = P.down ? Wing : P;         // stand up where somebody is standing
  Wing.x = clamp(at.x + rnd(50, -50), arena.x0 + 20, arena.x1 - 20);
  Wing.y = clamp(at.y + rnd(50, -50), arena.y0 + 20, arena.y1 - 20);
  ringFx(Wing.x, Wing.y, 10, 200, WING_COL, 0.7, 5);
  burst(Wing.x, Wing.y, 40, WING_COL, 300, 3.4, 0.8);
  Audio_.heal();
}

/* The guest's hull, simulated here. Movement is deliberately the same maths as
   updatePlayer so the guest's local prediction of it can be identical. */
function wingUpdate(dt) {
  if (!Wing.live) return;
  Wing.iframe = Math.max(0, Wing.iframe - dt);
  Wing.hurtFlash = Math.max(0, Wing.hurtFlash - dt * 2.4);

  // down until the wave is cleared — the clock that used to run here is gone
  if (Wing.down) {
    Wing.vx *= Math.pow(0.02, dt); Wing.vy *= Math.pow(0.02, dt);
    if (Math.random() < 0.35)
      spawnPart(Wing.x + rnd(12, -12), Wing.y + rnd(12, -12), rnd(20, -20), rnd(-30, -8),
                rnd(3, 1.4), WING_COL, rnd(0.6, 0.3), 0.94);
    return;
  }

  const C = CHARS[Wing.charIdx] || CHARS[0];
  const IN = Wing.in;
  Wing.ang = IN.ang;

  // dash charges refill on the same economy the host's do
  Wing.dashCd = P.dashCd;
  Wing.dashMax = P.dashMax;
  if (Wing.dashCh < Wing.dashMax) {
    Wing.dashRe += dt;
    if (Wing.dashRe >= Wing.dashCd) { Wing.dashRe = 0; Wing.dashCh++; }
  }
  if (IN.dash && Wing.dashCh > 0 && Wing.dashT <= 0) {
    IN.dash = false;                       // edge-triggered: one press, one dash
    Wing.dashCh--;
    Wing.dashT = 0.17; Wing.iframe = Math.max(Wing.iframe, 0.28);
    const il = len(IN.mx, IN.my);
    Wing.dashDX = il ? IN.mx / il : Math.cos(Wing.ang);
    Wing.dashDY = il ? IN.my / il : Math.sin(Wing.ang);
    Audio_.dash();
    burst(Wing.x, Wing.y, 16, WING_COL, 230, 3, 0.4, 1.4,
          Math.atan2(-Wing.dashDY, -Wing.dashDX));
  }

  if (Wing.dashT > 0) {
    Wing.dashT -= dt;
    Wing.vx = Wing.dashDX * 1080; Wing.vy = Wing.dashDY * 1080;
    Wing.ghosts.push({ x: Wing.x, y: Wing.y, ang: Wing.ang, t: 1 });
    if (Wing.ghosts.length > 14) Wing.ghosts.shift();
  } else {
    if (Wing.ghosts.length) Wing.ghosts.shift();
    const spd = C.speed * (1 - playerChill);
    const k = 1 - Math.exp(-16 * dt);
    Wing.vx = lerp(Wing.vx, IN.mx * spd, k);
    Wing.vy = lerp(Wing.vy, IN.my * spd, k);
  }
  Wing.x = clamp(Wing.x + Wing.vx * dt, arena.x0 + Wing.r, arena.x1 - Wing.r);
  Wing.y = clamp(Wing.y + Wing.vy * dt, arena.y0 + Wing.r, arena.y1 - Wing.r);
  collideMirrors(Wing, Wing.r);
  Wing.x = clamp(Wing.x, arena.x0 + Wing.r, arena.x1 - Wing.r);
  Wing.y = clamp(Wing.y, arena.y0 + Wing.r, arena.y1 - Wing.r);

  if (len(Wing.vx, Wing.vy) > 40 && Math.random() < 0.5) {
    const a = Math.atan2(-Wing.vy, -Wing.vx);
    spawnPart(Wing.x + Math.cos(a) * 8, Wing.y + Math.sin(a) * 8,
      Math.cos(a) * rnd(70, 20), Math.sin(a) * rnd(70, 20),
      rnd(3, 1.4), WING_COL, rnd(0.3, 0.14), 0.9);
  }

  /* The wingman throws bullets whatever hull it picked. EMBER's lance is a
     charge, a beam object and a second of standing damage that all live on the
     host's ship; handing the guest a second one of those is a fight for
     another day, so the lance stays the host's weapon and the wingman gets a
     conventional gun built from the same build. This is stated in the lobby. */
  Wing.fireT -= dt;
  if (IN.fire && Wing.fireT <= 0) {
    const rate = P.weapon === 'laser' ? P.fireRate * 0.8 : P.fireRate;
    Wing.fireT = 1 / Math.max(0.6, rate);
    const muzzle = Wing.r + 6;
    const mx = Wing.x + Math.cos(Wing.ang) * muzzle;
    const my = Wing.y + Math.sin(Wing.ang) * muzzle;
    const n = Math.max(1, P.count);
    for (let i = 0; i < n; i++) {
      const a0 = n === 1 ? 0 : (i - (n - 1) / 2) * (P.spread * 1.9);
      fireBullet(mx, my, Wing.ang + a0 + rnd(P.spread, -P.spread) * 0.5, 0.85);
    }
    Audio_.shoot();
    Wing.shots++;
    Wing.vx -= Math.cos(Wing.ang) * 22; Wing.vy -= Math.sin(Wing.ang) * 22;
    burst(mx, my, 3, COL.bullet, 165, 2.2, 0.16, 0.9, Wing.ang);
  }
}

/* --------------------------- host: reading input -------------------------- */
function mpReadInput() {
  if (!mpHost() || !Wing.live) return;
  const seq = r16();
  const mx = rI() / 1000, my = rI() / 1000;
  const ang = rAng();
  const bits = r8();
  // Input is unreliable and unordered: an older packet arriving after a newer
  // one is stale by definition and would jerk the ship backwards.
  const gap = (seq - Wing.in.seq) & 0xffff;
  if (Wing.in.seq && (gap === 0 || gap > 32768)) return;
  Wing.in.seq = seq;
  Wing.in.mx = mx; Wing.in.my = my; Wing.in.ang = ang;
  Wing.in.fire = !!(bits & 1);
  if (bits & 2) Wing.in.dash = true;         // latched; wingUpdate consumes it
  Wing.in.t = performance.now();
}

/* --------------------------- host: the snapshot --------------------------- */
function mpNear(x, y) {
  const w = Wing.live ? Wing : P;
  return Math.abs(x - w.x) < MP_CULL && Math.abs(y - w.y) < MP_CULL;
}

function mpSendSnapshot() {
  if (!netLive() || !Net.chS) return;
  MP.tick = (MP.tick + 1) >>> 0;
  wSeek(0);
  w8(MSG.SNAP);
  w32(MP.tick);
  const si = MP_STATES.indexOf(state);
  w8(si < 0 ? 0 : si);
  w8((bossAlive ? 1 : 0) | (Wing.down ? 2 : 0) | (P.down ? 4 : 0) |
     (amalgam || amalCut ? 8 : 0) | (P.stopT > 0 ? 16 : 0));
  w8(stageIdx); w8(loopNum); w16(wave); w32(score); w16(credits);
  wF(elapsed);
  wF(camZoom);
  wPos(arena.x0); wPos(arena.y0); wPos(arena.x1); wPos(arena.y1);

  // shared run values, so the guest's HUD reads the same numbers as the host's
  w8(P.level); w16(Math.min(65535, Math.round(P.xp))); w16(Math.min(65535, Math.round(P.xpNext)));
  w8(P.dashCh); w8(P.dashMax); w8(P.shield); w8(Math.min(255, Math.round(P.pickupR)));
  // kills belong to the run: the wingman's shots are credited through P too
  w16(Math.min(65535, P.kills));

  // the host's ship
  wPos(P.x); wPos(P.y); wAng(P.ang);
  w8(selectedChar); wF(P.hp); wF(P.maxHp);
  w8((P.iframe > 0 ? 1 : 0) | (P.dashT > 0 ? 2 : 0) | (P.laserT > 0 ? 4 : 0));

  // the guest's own ship, authoritative
  wPos(Wing.x); wPos(Wing.y); wAng(Wing.ang);
  wF(Wing.hp); wF(Wing.maxHp);
  w8(Wing.dashCh);
  w8((Wing.iframe > 0 ? 1 : 0) | (Wing.dashT > 0 ? 2 : 0) | (Wing.live ? 4 : 0));
  wI(Math.round(Wing.vx)); wI(Math.round(Wing.vy));
  // shots fired since the last snapshot, so the guest's own gun makes a noise
  w8(Math.min(255, Wing.shots)); Wing.shots = 0;

  /* ---- enemies. Bosses are never culled: their telegraphs cover the room
     and the HP bar has to agree with what is on screen. ---- */
  let n = 0, at = _np; w16(0);
  for (const e of enemies) {
    if (e.dead || e.amalPart) continue;
    if (e.type !== 'boss' && !mpNear(e.x, e.y)) continue;
    if (n >= MP_MAX.e) break;
    w16(e.id & 0xffff);
    w8(MP_ETYPES.indexOf(e.type));
    w8(e.boss ? MP_BOSSES.indexOf(e.boss) + 1 : 0);
    wPos(e.x); wPos(e.y); wAng(e.ang || 0);
    w8(Math.min(255, Math.round(e.r)));
    w8(clamp(Math.round(e.hp / (e.maxHp || 1) * 255), 0, 255));
    w8(clamp(Math.round(e.flash * 255), 0, 255));
    w8((e.elite ? 1 : 0) | (e.phased ? 2 : 0) | (e.invuln > 0 ? 4 : 0) |
       (e.shadow > 0 ? 8 : 0) | (e.virus ? 16 : 0) | (e.rage === 1 ? 32 : 0) |
       (e.hacked ? 64 : 0));
    w8(e.sides || 6);
    n++;
  }
  _nv.setUint16(at, n);

  /* ---- friendly bullets. Sent with velocity and dead-reckoned on the far
     side, so thirty snapshots a second still reads as continuous fire. ---- */
  n = 0; at = _np; w16(0);
  for (const b of bullets) {
    if (!mpNear(b.x, b.y)) continue;
    if (n >= MP_MAX.b) break;
    wPos(b.x); wPos(b.y); wI(Math.round(b.vx)); wI(Math.round(b.vy));
    w8(Math.min(255, Math.round(b.r * 4)));
    w8(b.crit ? 1 : 0);
    n++;
  }
  _nv.setUint16(at, n);

  n = 0; at = _np; w16(0);
  for (const b of ebullets) {
    if (!mpNear(b.x, b.y)) continue;
    if (n >= MP_MAX.eb) break;
    wPos(b.x); wPos(b.y); wI(Math.round(b.vx)); wI(Math.round(b.vy));
    w8(Math.min(255, Math.round(b.r)));
    w8(b.kind ? MP_BOSSES.indexOf(b.kind) + 1 : 0);
    w8(mpCol(b.col));
    n++;
  }
  _nv.setUint16(at, n);

  n = 0; at = _np; w16(0);
  for (const g of gems) {
    if (!mpNear(g.x, g.y)) continue;
    if (n >= MP_MAX.g) break;
    wPos(g.x); wPos(g.y); w8(Math.min(255, Math.round(g.r || 4))); n++;
  }
  _nv.setUint16(at, n);

  n = 0; at = _np; w16(0);
  for (const d of drops) {
    if (n >= MP_MAX.d) break;
    wPos(d.x); wPos(d.y);
    w8(Math.max(0, MP_DROPS.indexOf(d.kind)));
    w8(Math.min(255, Math.round(d.r)));
    n++;
  }
  _nv.setUint16(at, n);

  n = 0; at = _np; w16(0);
  for (const h of hazards) {
    if (n >= MP_MAX.h) break;
    const ki = MP_HAZ.indexOf(h.kind);
    if (ki < 0) continue;
    w8(ki); wPos(h.x); wPos(h.y); w16(Math.min(65535, Math.round(h.r)));
    wAng(h.ang || 0); wF(h.t); w8(h.state || 0);
    w8((h.friendly ? 1 : 0) | (h.flying ? 2 : 0) | (h.embedded ? 4 : 0));
    wF(Math.min(1e6, h.life));
    n++;
  }
  _nv.setUint16(at, n);

  n = 0; at = _np; w16(0);
  for (const m of mortars) {
    if (n >= MP_MAX.m) break;
    wPos(m.x); wPos(m.y); w16(Math.round(m.r));
    wF(m.t); wF(m.max); w8(mpCol(m.col)); w8(m.big ? 1 : 0);
    n++;
  }
  _nv.setUint16(at, n);

  // portals, so the guest can see the gate the host is about to walk through
  n = 0; at = _np; w16(0);
  for (const p of portals) {
    if (n >= 4) break;
    wPos(p.x); wPos(p.y); w16(Math.round(p.r)); wF(p.t);
    w8(p.kind === 'alt' ? 1 : 0);
    n++;
  }
  _nv.setUint16(at, n);

  netSend(wOut(), false);
}

/* ------------------------------ host: control ----------------------------- */
function mpBuildSig() {
  let s = '';
  for (const k in P.up) s += k + P.up[k] + ',';
  return s + '|' + P.level + '|' + P.maxHp + '|' + P.weapon;
}

/* The events the guest cannot infer from a snapshot: what the run is, what
   the build became, and how it ended. */
function mpPushBuild() {
  MP.buildSig = mpBuildSig();
  netEvent({ t: 'build', up: P.up, level: P.level, weapon: P.weapon,
             maxHp: P.maxHp, name: stage.name });
}

/* The wingman only flies while the room is live: an upgrade screen or a shop
   holds the world still for both pilots, exactly as it does solo. */
function mpHostTick(dt) {
  if (!mpHost()) return;
  wingUpdate(dt);
}

/* Sending, on the other hand, never stops. This runs above every early return
   in update(), because the moments the guest most needs to hear from the host
   are the ones where the host has stopped simulating — a level-up, a shop, a
   pause. Silence there would read to the guest as a dropped connection. */
function mpHostNet(dt) {
  if (!mpHost()) return;

  const sig = mpBuildSig();
  if (sig !== MP.buildSig) mpPushBuild();

  if (state !== MP.wasState) {
    MP.wasState = state;
    if (state === 'dead')
      netEvent({ t: 'over', stats: lastStats || null, best: Save.profile.best });
  }
  if (bannerT > 0 && bannerT >= bannerMax - dt * 1.5 && bannerText !== MP.lastBanner) {
    MP.lastBanner = bannerText;
    netEvent({ t: 'banner', s: bannerText, c: bannerCol, d: bannerMax });
  }

  MP.sendT -= dt;
  if (MP.sendT <= 0) {
    MP.sendT = 1 / 30;
    mpSendSnapshot();
  }
}

/* Starting a co-op run. The host owns the record, the sector and the shop, so
   this is just the ordinary run start with the wingman placed alongside. */
function mpStartRun() {
  if (!netLive() || Net.role !== 'host') return;
  MP.on = true; MP.role = 'host';
  Wing.charIdx = MP.peerChar;
  resetGame();
  wingSpawn();
  state = 'play';
  MP.wasState = 'play';
  MP.buildSig = '';
  netEvent({ t: 'run', host: selectedChar, wing: MP.peerChar,
             name: Save.profile.name || '', stage: stageIdx });
  banner('CO-OP ENGAGED', WING_COL, 2.0);
}

/* ------------------------------ shared events ----------------------------- */
function mpOnOpen() {
  MP.role = Net.role;
  netEvent({ t: 'hello', sig: NET_SIG(), char: selectedChar,
             name: Save.profile.name || (Net.role === 'host' ? 'HOST' : 'WINGMAN') });
  Audio_.select && Audio_.select();
}

function mpOnEvent(m) {
  if (!m || !m.t) return;
  switch (m.t) {
    case 'hello':
      if (m.sig !== NET_SIG()) {
        netFail(new Error('the other machine is running a different build'));
        return;
      }
      MP.peerName = String(m.name || '').slice(0, 14) || 'WINGMAN';
      MP.peerChar = clamp(m.char | 0, 0, CHARS.length - 1);
      MP.ready = true;
      break;

    case 'run':
      // guest: the host has launched, so mirror the run locally and fly
      if (Net.role !== 'guest') break;
      MP.on = true; MP.role = 'guest';
      MP.peerChar = clamp(m.host | 0, 0, CHARS.length - 1);
      MP.peerName = String(m.name || '').slice(0, 14) || 'HOST';
      mpGuestBegin();
      break;

    case 'build':
      if (Net.role !== 'guest') break;
      P.up = m.up || {};
      P.level = m.level || 1;
      break;

    case 'banner': {
      if (Net.role !== 'guest') break;
      /* The host's banners are written from the host's point of view. Two of
         them are about the guest, and reading "WINGMAN DOWN" while it is you
         on the floor is nonsense. */
      let s = String(m.s || '').slice(0, 40);
      const them = (MP.peerName || 'THE HOST').toUpperCase();
      if (s === 'WINGMAN DOWN — CLEAR THE WAVE') s = 'YOU ARE DOWN — CLEAR THE WAVE';
      else if (s === 'YOU ARE DOWN — CLEAR THE WAVE') s = them + ' IS DOWN — CLEAR THE WAVE';
      else if (s === 'WINGMAN BACK UP') s = 'BACK UP';
      else if (s === 'BACK UP') s = them + ' IS BACK UP';
      else if (s === 'WINGMAN LOST — SOLO' || s === 'WINGMAN LOST') break;
      banner(s, m.c || '#fff', m.d || 2.2);
      break;
    }

    case 'over':
      if (Net.role !== 'guest') break;
      MP.overStats = m.stats || null;
      MP.hostState = 'dead';
      break;

    case 'bye':
      netLost(Net.role === 'host' ? 'the wingman left' : 'the host ended the run');
      break;
  }
}

/* A peer that went away mid-run. The host keeps playing solo — losing a
   forty-minute run because someone's laptop slept is never the right trade —
   and the guest, which has nothing to simulate, is put back on the menu. */
function mpPeerGone() {
  if (MP.role === 'host') {
    if (Wing.live) {
      explode(Wing.x, Wing.y, 140, 0, WING_COL);
      Wing.live = false;
    }
    MP.on = false; MP.ready = false; MP.lostT = 5;
    /* Downed when they left. Nobody is going to clear the wave that would have
       stood you back up, so the knockdown becomes what it would have been
       without a wingman in the first place. */
    if (P.down && state === 'play') {
      P.down = false;                      // gameOver draws the death of a ship
      banner('WINGMAN LOST', '#f87171', 2.6);
      gameOver();
      return;
    }
    banner('WINGMAN LOST — SOLO', '#f87171', 2.6);
  } else if (MP.role === 'guest') {
    MP.on = false; MP.ready = false; MP.lostT = 5;
    if (state !== 'menu' && state !== 'lan') { state = 'lan'; lanView = 'lost'; }
  }
}

/* Leaving co-op from either side, deliberately. */
function mpQuit() {
  const wasHost = MP.role === 'host';
  if (netLive()) netEvent({ t: 'bye' });
  netHangUp(true);
  Net.phase = 'off'; Net.note = '';
  MP.on = false; MP.ready = false; MP.role = null;
  Wing.live = false;
  if (!wasHost && state !== 'menu') { state = 'menu'; }
}

/* ===========================================================================
   LAN CO-OP — the guest
   The guest runs no simulation. It decodes the host's snapshot straight into
   the arrays the renderer already reads, so every draw path in this file —
