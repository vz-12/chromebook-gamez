  const b = amalBodyPos();
  /* The jig it is being built on. A workshop bench rather than open floor:
     a plinth under the feet, a plumb line up the centreline and a scale rule,
     so the assembly reads as something being fabricated to a drawing. */
  const foot = b.y + 246;
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = '#0a0908';
  ctx.beginPath(); ctx.ellipse(b.x, foot + 20, 276, 42, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 0.22;
  ctx.strokeStyle = AMAL_COL; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.ellipse(b.x, foot + 20, 276, 42, 0, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 0.14;
  ctx.lineWidth = 1.4;
  ctx.setLineDash([6, 14]);
  ctx.beginPath(); ctx.moveTo(b.x, b.y - 400); ctx.lineTo(b.x, foot + 20); ctx.stroke();
  ctx.setLineDash([]);
  // the rail it is measured against, rather than ticks floating in the dark
  const rx = b.x - 430;
  ctx.beginPath(); ctx.moveTo(rx, foot + 20); ctx.lineTo(rx, b.y - 360); ctx.stroke();
  for (let k = 0; k <= 12; k++) {
    const y = lerp(foot + 20, b.y - 360, k / 12), big = k % 3 === 0;
    ctx.globalAlpha = big ? 0.2 : 0.12;
    ctx.beginPath(); ctx.moveTo(rx, y); ctx.lineTo(rx + (big ? 22 : 11), y); ctx.stroke();
  }
  ctx.restore();

  /* Empty slots are drawn as the armour that will fill them, labelled with
     what he is about to cut up for it. A dashed circle said nothing. */
  ctx.save();
  ctx.textAlign = 'center';
  ctx.setLineDash([11, 9]); ctx.lineDashOffset = -uiTime * 20;
  for (const p of AMAL_PARTS) {
    if (c.placed[p.id] !== undefined) continue;
    const sx = p.ox < 0 ? -1 : 1;
    const x = b.x + p.ox, y = b.y + p.oy;
    ctx.globalAlpha = 0.3 + Math.sin(uiTime * 2.4 + p.oy * 0.01) * 0.08;
    ctx.strokeStyle = AMAL_COL; ctx.lineWidth = 2;
    shellPath(x, y, p.r, AMAL_ROLE[p.id], sx); ctx.stroke();
    ctx.globalAlpha = 0.18;
    ctx.strokeStyle = BOSSES[p.key].col; ctx.lineWidth = 1.6;
    poly(x, y, p.r * 0.5, BOSSES[p.key].sides, uiTime * 0.3);
    ctx.stroke();
    ctx.globalAlpha = 0.42;
    ctx.setLineDash([]);
    ctx.font = "600 15px 'JetBrains Mono', ui-monospace, monospace";
    ctx.fillStyle = BOSSES[p.key].col;
    ctx.fillText(BOSSES[p.key].name, x, y + p.r + 26);
    ctx.setLineDash([11, 9]);
  }
  ctx.restore();

  drawAmalBody(b, c.placed, null);

  /* The head goes on last, and then it comes up: a band of light sweeps the
     length of the frame and every core it passes is lit behind it. */
  const ign = clamp((c.t - 18.4) / 2.8, 0, 1);
  if (ign > 0) {
    const y = lerp(foot + 10, b.y - 300, ign);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(b.x, b.y - 40, 520 * ign, '#7f1d1d', 0.3 * ign);
    const hw = 300;
    const g = ctx.createLinearGradient(b.x - hw, 0, b.x + hw, 0);
    g.addColorStop(0, 'rgba(252,165,165,0)');
    g.addColorStop(0.5, rgba('#ffffff', 0.8 * (1 - ign * 0.45)));
    g.addColorStop(1, 'rgba(252,165,165,0)');
    ctx.fillStyle = g;
    ctx.fillRect(b.x - hw, y - 9, hw * 2, 18);
    drawGlow(b.x, y, 260, AMAL_COL, 0.4 * (1 - ign * 0.4));
    ctx.restore();
  }
}

// the rage lines, over the top of the assembly
function drawAmalCutText() {
  const c = amalCut;
  if (!c) return;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const fade = clamp(c.t / 0.8, 0, 1);
  ctx.globalAlpha = fade * (c.t > 21 ? clamp(22 - c.t, 0, 1) : 1);
  // letterbox, so it reads as a cutscene rather than gameplay
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, 64);
  ctx.fillRect(0, H - 104, W, 104);
  const line = DEV_RAGE[Math.min(c.line, DEV_RAGE.length - 1)];
  const big = c.line >= DEV_RAGE.length - 2;
  ctx.font = (big ? '800 ' + Math.min(38, W * 0.04) : '400 ' + Math.min(20, W * 0.021)) +
             'px ' + (big ? 'Barlow, system-ui, sans-serif' : "'JetBrains Mono', ui-monospace, monospace");
  ctx.fillStyle = big ? '#f87171' : '#e2e8f0';
  wrapText(line, W / 2, H - 56, Math.min(880, W - 90), 26);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

function startAmalgam() {
  const cx = WORLD.w / 2, cy = WORLD.h / 2 - 40;
  enemies.length = 0; ebullets.length = 0;
  /* Turning up with ROOT's key opens it instead of fighting it — but only
     after the amalgam has been beaten the honest way at least once. Its own
     ending only lands the first time and it should not be possible to spend
     it on a shortcut you found in another route. */
  const opening = P.key > 0 && Save.profile.amalgamDone;
  if (opening) P.key--;
  /* Each piece is spawned as a real enemy rather than a bespoke object, so
     every damage path in the game — bullets, the lance, drones, chain, static,
     books, malware — reaches it without a single special case. It is pinned to
     its slot on the frame every tick instead of steering itself. */
  const parts = AMAL_PARTS.map(p => {
    const e = spawnEnemy('boss', cx + p.ox, cy + p.oy, { boss: p.key });
    e.amalPart = p.id;
    e.armor = 0; e.absorb = 0; e.dr = 0; e.floor = undefined;
    e.spd = 0; e.xp = 0; e.score = 0;
    e.r = p.r;
    e.hp = e.maxHp = AMAL_PART_HP * p.hp;
    return Object.assign({}, p, { e, cd: rnd(2.2, 0.4) });
  });
  amalgam = { x: cx, y: cy, vx: 0, vy: 0, t: 0, parts,
              quakeT: 3.2, stepT: 0, phase: 0, said: {},
              slamT: 5.0, slam: null, beam: null,
              maxHp: parts.reduce((s, p) => s + p.e.maxHp, 0) };
  amalgam.hp = amalgam.maxHp;
  amalgam.tok = amalgam.maxHp / AMAL_TARGET_SEC * ENDGAME_BURST;
  amalCut = null;
  state = 'play';
  bossAlive = true;
  P.hp = P.maxHp;
  amalDec = 0;
  if (opening) {
    // it never gets to stand up: the seams give and it comes apart on them
    for (const p of parts) {
      const a = Math.atan2(p.e.y - cy, p.e.x - cx) + rnd(0.3, -0.3);
      p.dx = Math.cos(a) * 2.4; p.dy = Math.sin(a) * 2.4 - 0.4;
      p.spin = rnd(1.6, -1.6);
      p.e.invuln = 1;
    }
    startAmalOpen(parts);
    return;
  }
  banner('THE AMALGAM', AMAL_COL, 5.0);
  drawFlashT = 0.6; shake(2.4);
  Audio_.boss(); Audio_.boom();
  ringFx(cx, cy, 30, 1400, AMAL_COL, 1.8, 12);
}

/* Interleaved so he alternates between resenting you and asking you to stop,
   and so the two closing lines still land last. */
const AMAL_LINES = [
  { at: 0.92, s: 'You are enjoying this.' },
  { at: 0.85, s: 'You could stop. That is a thing you are allowed to do.' },
  { at: 0.78, s: 'I spent four months on the mirror. Four months, on a room ' +
                 'you walked through backwards.' },
  { at: 0.70, s: 'Put it down. Nobody is making you finish this.' },
  { at: 0.62, s: 'Every one of these was somebody\'s favourite, once.' },
  { at: 0.55, s: 'Give up. I am asking you to give up.' },
  { at: 0.48, s: 'You cannot even die. I took that away from you. ' +
                 'It is still not enough, is it.' },
  { at: 0.41, s: 'Walk away and I will call it yours. ' +
                 'I will write it down as yours.' },
  { at: 0.34, s: 'I do not know what else there is to give you.' },
  { at: 0.27, s: 'Please. Close it. There is nothing after this ' +
                 'that I made for you.' },
  { at: 0.20, s: 'That is all of them. That is every one I ever made.' },
  { at: 0.08, s: '...take it. Take all of it.' }
];

function amalSay(frac) {
  for (let i = 0; i < AMAL_LINES.length; i++) {
    const L = AMAL_LINES[i];
    if (frac <= L.at && !amalSaid[i]) {
      amalSaid[i] = true;
      banner(L.s, AMAL_COL, 5.5);
      Audio_.tone(360, 0.06, 'sine', 0.04, 520);
      return;
    }
  }
}

/* ------------------------- the last thing it does -------------------------
   Below a sliver of health it stops pretending to be a boss fight and just
   holds down a beam across the whole arena. It cannot kill you — that is the
   point of it — so the only thing left to take is the size of your number. */
const RAINBOW = ['#ff2d55', '#ff7a00', '#ffd60a', '#34c759',
                 '#32ade6', '#5e5ce6', '#bf5af2'];
const BEAM_CHARGE = 2.6, BEAM_FIRE = 10.0, BEAM_HALF = 138, BEAM_LEN = 5200;

function amalBeamOrigin(a) {
  const c = a.parts.find(z => z.id === 'torso');
  if (c && c.e && !c.e.dead) return amalPartPos(a, c);
  return { x: a.x, y: a.y - 34 };
}

function amalStartBeam(a) {
  const o = amalBeamOrigin(a);
  a.beam = { t: 0, ang: Math.atan2(P.y - o.y, P.x - o.x),
             spin: (Math.random() < 0.5 ? -1 : 1) * 0.20, fired: false, tick: 0 };
  banner('You were never going to stop, were you.', AMAL_COL, 5.0);
  Audio_.tone(90, BEAM_CHARGE, 'sawtooth', 0.1, 900);
}

function amalUpdateBeam(a, dt) {
  const b = a.beam, o = amalBeamOrigin(a);
  b.t += dt;

  if (b.t < BEAM_CHARGE) {
    // keep it aimed at you while it spools up, then commit
    const want = Math.atan2(P.y - o.y, P.x - o.x);
    b.ang = angLerp(b.ang, want, 1 - Math.exp(-2.6 * dt));
    if (Math.random() < 0.9) {                    // light dragged into the chest
      const ang = rnd(TAU), r = rnd(620, 300);
      spawnPart(o.x + Math.cos(ang) * r, o.y + Math.sin(ang) * r,
                -Math.cos(ang) * 460, -Math.sin(ang) * 460,
                rnd(4, 2), pick(RAINBOW), 0.6, 0.9);
    }
    cam.trauma = Math.max(cam.trauma, 0.35);
    return;
  }

  if (!b.fired) {
    b.fired = true;
    drawFlashT = Math.max(drawFlashT, 0.5);
    shake(2.8);
    Audio_.boom(); Audio_.boss();
    banner('So I will just keep going too.', AMAL_COL, 5.0);
  }

  b.ang += b.spin * dt;                            // a slow sweep across the room
  cam.trauma = Math.max(cam.trauma, 0.5);

  // it burns every tick you stand in it — you cannot die, only shrink
  const dx = P.x - o.x, dy = P.y - o.y;
  const c = Math.cos(-b.ang), s = Math.sin(-b.ang);
  const along = dx * c - dy * s, across = dx * s + dy * c;
  if (along > -40 && along < BEAM_LEN && Math.abs(across) < BEAM_HALF) {
    hurtPlayer(3.4 + a.phase * 1.2);
    if (Math.random() < 0.5)
      spawnPart(P.x + rnd(20, -20), P.y + rnd(20, -20), rnd(160, -160), rnd(160, -160),
                rnd(4, 2), pick(RAINBOW), 0.4, 0.9);
  }

  // the floor under the beam keeps ringing
  b.tick -= dt;
  if (b.tick <= 0) {
    b.tick = 0.55;
    groundWave(o.x + Math.cos(b.ang) * 700, o.y + Math.sin(b.ang) * 700,
               { life: 1.2, speed: 700, amp: 26, width: 110, col: pick(RAINBOW) });
    Audio_.tone(140, 0.2, 'sawtooth', 0.05, 90);
  }

  if (b.t > BEAM_CHARGE + BEAM_FIRE) { a.beam = null; a.beamCd = 7.0; }
}

function drawAmalBeam(a) {
  const b = a.beam, o = amalBeamOrigin(a);
  ctx.save();
  ctx.translate(o.x, o.y);
  ctx.rotate(b.ang);
  ctx.globalCompositeOperation = 'lighter';

  if (b.t < BEAM_CHARGE) {
    // a hairline sight showing exactly where it is about to open up
    const u = b.t / BEAM_CHARGE;
    ctx.strokeStyle = rgba('#ffffff', 0.25 + u * 0.5);
    ctx.lineWidth = 1 + u * 5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(BEAM_LEN, 0); ctx.stroke();
    for (let k = 0; k < RAINBOW.length; k++) {
      const off = (k - 3) * 26 * u;
      ctx.strokeStyle = rgba(RAINBOW[k], 0.16 * u);
      ctx.lineWidth = 10 * u;
      ctx.beginPath(); ctx.moveTo(0, off); ctx.lineTo(BEAM_LEN, off); ctx.stroke();
    }
    ctx.restore();
    drawGlow(o.x, o.y, 90 + u * 210, '#ffffff', 0.3 + u * 0.5);
    return;
  }

  const age = b.t - BEAM_CHARGE;
  const fade = clamp(Math.min(age * 4, (BEAM_FIRE - age) * 2), 0, 1);

  /* Parallax: each colour band is a separate layer with its own width, drift
     and scroll rate, so the beam shears against itself as it sweeps. */
  for (let k = 0; k < RAINBOW.length; k++) {
    const d = k - (RAINBOW.length - 1) / 2;
    const depth = 0.45 + k / RAINBOW.length;                // layer "distance"
    const off = d * 34 + Math.sin(uiTime * (1.1 + k * 0.23) + k) * 20 * depth;
    const h = 26 + Math.sin(uiTime * 2 + k) * 6;
    ctx.fillStyle = rgba(RAINBOW[k], 0.20 * fade);
    ctx.fillRect(0, off - h / 2, BEAM_LEN, h);
    // chevrons racing outward at the layer's own speed
    const sp = 900 + k * 460, gap = 240;
    const phase = (uiTime * sp) % gap;
    ctx.fillStyle = rgba(RAINBOW[k], 0.42 * fade);
    for (let x = -gap + phase; x < BEAM_LEN; x += gap)
      ctx.fillRect(x, off - h / 2, 86, h);
  }

  // white core
  const pulse = 1 + Math.sin(uiTime * 26) * 0.1;
  ctx.fillStyle = rgba('#ffffff', 0.72 * fade);
  ctx.fillRect(0, -22 * pulse, BEAM_LEN, 44 * pulse);
  ctx.fillStyle = rgba('#ffffff', 0.3 * fade);
  ctx.fillRect(0, -BEAM_HALF, BEAM_LEN, BEAM_HALF * 2);
  // hot edges
  ctx.strokeStyle = rgba('#ffd60a', 0.5 * fade);
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, -BEAM_HALF); ctx.lineTo(BEAM_LEN, -BEAM_HALF);
  ctx.moveTo(0,  BEAM_HALF); ctx.lineTo(BEAM_LEN,  BEAM_HALF);
  ctx.stroke();
  ctx.restore();

  // the muzzle
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(o.x, o.y, 300 * fade, '#ffffff', 0.6 * fade);
  drawGlow(o.x, o.y, 190 * fade, pick(RAINBOW), 0.4 * fade);
  ctx.restore();
}

const SLAM_UP = 0.8, SLAM_DOWN = 0.14, SLAM_HOLD = 0.45;

/* Where the slamming arm is, relative to its socket. It winds up over the
   shoulder, comes down faster than you can react to at the last moment, and
   then drags back out of the crater. */
function amalSlamArm(s) {
  if (s.t < SLAM_UP) {
    const u = 1 - Math.pow(1 - s.t / SLAM_UP, 3);
    return { lift: -210 * u, reach: u, wind: u };
  }
  if (s.t < SLAM_UP + SLAM_DOWN) {
    const u = (s.t - SLAM_UP) / SLAM_DOWN;
    return { lift: lerp(-210, 150, u * u), reach: 1, wind: 1 - u };
  }
  const u = clamp((s.t - SLAM_UP - SLAM_DOWN) / SLAM_HOLD, 0, 1);
  return { lift: lerp(150, 0, u), reach: 1 - u, wind: 0 };
}

function amalPartPos(a, p) {
  // a slow walk cycle, so the whole frame lumbers
  const sway = Math.sin(a.t * 1.5) * 12;
  const bob = Math.abs(Math.sin(a.t * 1.5)) * 10;
  const legSwing = p.id === 'legL' ? Math.sin(a.t * 1.5) * 26
                 : p.id === 'legR' ? -Math.sin(a.t * 1.5) * 26 : 0;
  const armSwing = p.id === 'armL' ? -Math.sin(a.t * 1.5) * 20
                 : p.id === 'armR' ? Math.sin(a.t * 1.5) * 20 : 0;
  let x = a.x + p.ox + sway * (p.oy < -60 ? 0.4 : 1) + legSwing;
  let y = a.y + p.oy - bob + armSwing * 0.4;
  if (a.slam && a.slam.arm === p.id) {
    const m = amalSlamArm(a.slam);
    x += (a.slam.tx - x) * m.reach;
    y += (a.slam.ty - y) * m.reach + m.lift;
  }
  return { x, y };
}

function amalStartSlam(a) {
  // pick a live arm; if both are gone it stamps with a leg instead
  const cands = ['armR', 'armL', 'legR', 'legL']
    .filter(id => { const p = a.parts.find(z => z.id === id); return p && p.e && !p.e.dead; });
  if (!cands.length) return;
  const arm = cands[0] === 'armR' && Math.random() < 0.5 && cands.includes('armL')
            ? 'armL' : cands[0];
  a.slam = { arm, t: 0, tx: P.x, ty: P.y, hit: false };
  Audio_.tone(150, 0.5, 'sawtooth', 0.07, 60);
}

function amalUpdateSlam(a, dt) {
  const s = a.slam;
  s.t += dt;
  // it keeps tracking you while the arm is still going up
  if (s.t < SLAM_UP * 0.72) {
    s.tx += (P.x - s.tx) * (1 - Math.exp(-3.4 * dt));
    s.ty += (P.y - s.ty) * (1 - Math.exp(-3.4 * dt));
  }
  // dust sucked toward the impact point during the windup
  if (s.t < SLAM_UP && Math.random() < 0.6) {
    const ang = rnd(TAU), r = rnd(320, 150);
    spawnPart(s.tx + Math.cos(ang) * r, s.ty + Math.sin(ang) * r,
              -Math.cos(ang) * 220, -Math.sin(ang) * 220 - 40,
              rnd(4, 2), '#a8a29e', 0.5, 0.9);
  }
  if (!s.hit && s.t >= SLAM_UP + SLAM_DOWN) {
    s.hit = true;
    amalSlamImpact(a, s);
  }
  if (s.t >= SLAM_UP + SLAM_DOWN + SLAM_HOLD) a.slam = null;
}

function amalSlamImpact(a, s) {
  shakeAt(s.tx, s.ty, 2.4);
  drawFlashT = Math.max(drawFlashT, 0.22);
  Audio_.boom(); Audio_.tone(48, 0.7, 'square', 0.2, 26);
  // the floor heaves outward from the fist
  groundWave(s.tx, s.ty, { life: 1.9, speed: 1050, amp: 72, width: 175, col: '#fbbf24' });
  groundWave(s.tx, s.ty, { life: 1.3, speed: 620,  amp: 40, width: 115, col: '#f97316' });
  ringFx(s.tx, s.ty, 20, 700, '#fbbf24', 0.9, 9);
  ringFx(s.tx, s.ty, 10, 340, '#ffffff', 0.5, 6);
  // debris thrown up out of the crater
  for (let k = 0; k < 38; k++) {
    const ang = rnd(TAU), sp = rnd(520, 160);
    spawnPart(s.tx + Math.cos(ang) * 30, s.ty + Math.sin(ang) * 30,
              Math.cos(ang) * sp, Math.sin(ang) * sp * 0.6 - rnd(260, 90),
              rnd(8, 3), Math.random() < 0.4 ? '#fbbf24' : '#78716c', rnd(1.0, 0.4), 0.93);
  }
  // the shock itself: close in and it hurts
  const d = len(P.x - s.tx, P.y - s.ty);
  if (d < 190) hurtPlayer(26 + a.phase * 8);
  // and a ring of shrapnel riding the wave out
  const n = 22 + a.phase * 6;
  for (let k = 0; k < n; k++) {
    const ang = k * TAU / n + rnd(0.06, -0.06);
    ebullets.push({ x: s.tx, y: s.ty,
      vx: Math.cos(ang) * 340, vy: Math.sin(ang) * 340 * 0.7,
      r: 7, dmg: 16 + a.phase * 4, life: 4, col: '#fbbf24' });
  }
}

function amalQuake(a) {
  shakeAt(a.x, a.y, 1.5);
  groundWave(a.x, a.y + 150, { life: 2.2, speed: 780, amp: 30, width: 150, col: '#fbbf24' });
  drawFlashT = Math.max(drawFlashT, 0.12);
  Audio_.boom(); Audio_.tone(60, 0.5, 'square', 0.16, 30);
  const n = 26 + a.phase * 8;
  for (let k = 0; k < n; k++) {
    const ang = k * TAU / n + rnd(0.05, -0.05);
    ebullets.push({ x: a.x, y: a.y + 150,
      vx: Math.cos(ang) * (170 + a.phase * 40),
      vy: Math.sin(ang) * (170 + a.phase * 40) * 0.55,
      r: 8, dmg: 14, life: 5, col: '#fbbf24' });
  }
  ringFx(a.x, a.y + 150, 20, 900, '#fbbf24', 0.8, 7);
  // the floor itself jumps
  for (let k = 0; k < 22; k++)
    spawnPart(a.x + rnd(500, -500), a.y + 150 + rnd(60, -20),
              rnd(90, -90), rnd(-140, -300), rnd(6, 3), '#fbbf24', rnd(0.8, 0.4), 0.93);
}

function amalFire(a, p) {
  const pos = amalPartPos(a, p);
  const toP = Math.atan2(P.y - pos.y, P.x - pos.x);
  const ph = a.phase;
  const dm = 12 + ph * 4;
  const shot = (ang, spd, r, col) => {
    const b = { x: pos.x + Math.cos(ang) * p.r, y: pos.y + Math.sin(ang) * p.r,
                vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
                r: r || 6, dmg: dm, life: 6, col: col || AMAL_COL };
    ebullets.push(b); return b;
  };
  switch (p.key) {
    case 'warden': {                       // rings, as it always did
      const n = 16 + ph * 5, off = rnd(TAU);
      for (let k = 0; k < n; k++) shot(off + k * TAU / n, 210 + ph * 30, 6, '#ef4444');
      p.cd = 2.0 - ph * 0.35; break;
    }
    case 'forgeheart': {                   // four sweeping arcs
      const base = a.t * 1.4;
      for (let q = 0; q < 4; q++)
        for (let k = 0; k < 5; k++)
          shot(base + q * TAU / 4 + k * 0.09, 190, 7, '#f97316');
      p.cd = 0.85 - ph * 0.12; break;
    }
    case 'broodmother': {                  // it still lays
      for (let k = 0; k < 2 + ph; k++) {
        const ang = rnd(TAU);
        const s = spawnEnemy('swarmer',
          clamp(pos.x + Math.cos(ang) * 70, arena.x0 + 40, arena.x1 - 40),
          clamp(pos.y + Math.sin(ang) * 70, arena.y0 + 40, arena.y1 - 40), { elite: false });
        if (s) { s.shadow = 9; s.xp = 0; s.score = 0; }
      }
      p.cd = 3.4 - ph * 0.5; break;
    }
    case 'nullcore': {                     // aimed lances from the head
      for (let k = -2; k <= 2; k++) shot(toP + k * 0.1, 460 + ph * 60, 9, '#f0abfc');
      p.cd = 1.5 - ph * 0.25; break;
    }
    case 'archivist': {                    // spiral
      for (let k = 0; k < 3; k++) shot(a.t * 3.1 + k * TAU / 3, 240, 6, '#a78bfa');
      p.cd = 0.16; break;
    }
    case 'curator': {                      // a wall with one gap
      const gap = rnd(TAU), n = 30;
      for (let k = 0; k < n; k++) {
        const ang = k * TAU / n;
        if (Math.abs(((ang - gap + Math.PI) % TAU + TAU) % TAU - Math.PI) < 0.5) continue;
        shot(ang, 165, 6, '#e2e8f0');
      }
      p.cd = 2.6 - ph * 0.4; break;
    }
    case 'theother': {                     // it mirrors you, from the spine
      const mx = 2 * ((arena.x0 + arena.x1) / 2) - P.x;
      const my = 2 * ((arena.y0 + arena.y1) / 2) - P.y;
      const ang = Math.atan2(my - pos.y, mx - pos.x);
      for (let k = -1; k <= 1; k++) shot(ang + k * 0.16, 330, 7, '#5eead4');
      p.cd = 1.1 - ph * 0.18; break;
    }
  }
}

function amalUpdate(dt) {
  const a = amalgam;
  if (!a) return;
  a.t += dt;
  refillThrottle(a, AMAL_TARGET_SEC, dt);

  const live = a.parts.filter(p => p.e && !p.e.dead);
  if (!live.length) { amalWin(); return; }
  // a piece that has just come off says so
  for (const p of a.parts) {
    if (p.e && p.e.dead && !p.announced) {
      p.announced = true;
      const pos = amalPartPos(a, p);
      explode(pos.x, pos.y, 220, 0, AMAL_COL);
      ringFx(pos.x, pos.y, 12, 420, AMAL_COL, 0.8, 6);
      shakeAt(pos.x, pos.y, 0.9); drawFlashT = 0.2; Audio_.boom(); Audio_.crit();
      floatText(pos.x, pos.y - p.r - 12, BOSSES[p.key].name + '  OFF', AMAL_COL, 15);
    }
  }
  a.hp = live.reduce((s, p) => s + Math.max(0, p.e.hp), 0);
  const frac = a.hp / a.maxHp;
  a.phase = frac > 0.66 ? 0 : frac > 0.33 ? 1 : 2;
  amalSay(frac);

  // it lumbers toward you and never stops
  const dx = P.x - a.x, dy = (P.y - 120) - a.y;
  const d = len(dx, dy) || 1;
  const spd = 26 + a.phase * 12;
  a.x += (dx / d) * spd * dt;
  a.y += (dy / d) * spd * dt * 0.5;
  a.x = clamp(a.x, arena.x0 + 220, arena.x1 - 220);
  a.y = clamp(a.y, arena.y0 + 220, arena.y1 - 160);

  // every footfall shakes the room
  a.stepT -= dt;
  if (a.stepT <= 0) {
    a.stepT = 1.05 / (1 + a.phase * 0.2);
    shakeAt(a.x, a.y + 232, 0.6);
    Audio_.tone(70, 0.16, 'square', 0.09, 40);
    // the foot that just landed throws up dust and a dent ring
    const down = Math.sin(a.t * 1.5) > 0 ? 'legL' : 'legR';
    const lp = a.parts.find(z => z.id === down);
    const fx = lp && lp.e && !lp.e.dead ? amalPartPos(a, lp).x : a.x;
    const fy = a.y + 232;
    ringFx(fx, fy, 8, 190, '#78716c', 0.5, 4);
    groundWave(fx, fy, { life: 0.9, speed: 560, amp: 13, width: 90, col: '#a8a29e' });
    for (let k = 0; k < 16; k++)
      spawnPart(fx + rnd(70, -70), fy, rnd(140, -140), rnd(-70, -200),
                rnd(6, 2.5), '#78716c', rnd(0.7, 0.3), 0.92);
  }
  a.quakeT -= dt;
  if (a.quakeT <= 0) { a.quakeT = 7.5 - a.phase * 1.6; amalQuake(a); }

  // slams: it picks a fist up and drops it where you are standing
  if (a.slam) amalUpdateSlam(a, dt);
  else {
    a.slamT -= dt;
    if (a.slamT <= 0) { a.slamT = 6.5 - a.phase * 1.5; amalStartSlam(a); }
  }

  // once it is nearly gone it stops fighting fair and just holds the beam down
  if (a.beam) amalUpdateBeam(a, dt);
  else if (frac <= 0.16) {
    a.beamCd = (a.beamCd || 0) - dt;
    if (a.beamCd <= 0) amalStartBeam(a);
  }

  for (const p of live) {
    // pin the piece to its slot on the frame; it does not steer itself
    const pos = amalPartPos(a, p);
    p.e.x = pos.x; p.e.y = pos.y; p.e.vx = p.e.vy = 0;
    p.e.invuln = 0; p.e.phased = false;
    p.cd -= dt;
    if (p.cd <= 0) amalFire(a, p);

    // welds shower sparks, and worse the more damaged the piece is
    const hurt = 1 - clamp(p.e.hp / p.e.maxHp, 0, 1);
    if (Math.random() < 0.18 + hurt * 0.5) {
      const ang = rnd(TAU);
      spawnPart(pos.x + Math.cos(ang) * p.r * 1.1, pos.y + Math.sin(ang) * p.r * 1.1,
                rnd(70, -70), rnd(20, 120), rnd(2.6, 1.2),
                Math.random() < 0.4 ? '#fde68a' : WELD, rnd(0.5, 0.2), 0.9);
    }
    // a badly hurt piece leaks fire
    if (hurt > 0.55 && Math.random() < 0.2)
      spawnPart(pos.x + rnd(p.r, -p.r), pos.y + rnd(p.r, -p.r),
                rnd(20, -20), rnd(-40, -90), rnd(5, 2.4), '#ef4444', rnd(0.7, 0.3), 0.94);
  }

  // torn-off mounts spit as they burn
  for (const p of a.parts) {
    if (!p.e || !p.e.dead) continue;
    if (Math.random() < 0.24) {
      const pos = amalPartPos(a, p);
      spawnPart(pos.x + rnd(22, -22), pos.y + rnd(22, -22), rnd(60, -60), rnd(-50, -140),
                rnd(4, 2), Math.random() < 0.5 ? WELD : '#78716c', rnd(0.8, 0.3), 0.93);
    }
  }

  // chest vents breathing
  if (Math.random() < 0.5) {
    const c = a.parts.find(z => z.id === 'torso');
    if (c && c.e && !c.e.dead) {
      const pos = amalPartPos(a, c);
      const side = Math.random() < 0.5 ? -1 : 1;
      spawnPart(pos.x + side * 78, pos.y - 40, side * rnd(60, 10), rnd(-30, -80),
                rnd(7, 3), '#57534e', rnd(0.9, 0.4), 0.95);
    }
  }
}

function amalWin() {
  amalgam = null;
  enemies.length = 0; ebullets.length = 0;
  bossAlive = false;
  Codex.seeEnemy('amalgam');
  chalCheckGoal('amalgam');
  Codex.flush();
  if (!Save.profile.amalgamDone) {
    Save.profile.amalgamDone = true;
    Save.writeLocal(); Save.flush();
  }
  arenaReset();
  betweenWaves = 4.0;
  score += 1000000;
  drawFlashT = 0.7; shake(2.6);
  banner('There. That is everything I had.', AMAL_COL, 7.0);
  Audio_.boss(); Audio_.levelup(); Audio_.boom();
  ringFx(P.x, P.y, 24, 1500, AMAL_COL, 1.8, 12);
  P.hp = P.maxHp; amalDec = 0;
  outro = { t: 0, type: 0, done: 0 };      // and then he stops
}

/* ------------------------------- the last line -----------------------------
   He has nothing left to build, so he writes one more line on the floor and
   takes the page down with him. The save is already flushed above — nothing
   below this point is allowed to cost the player their progress.
--------------------------------------------------------------------------- */
const OUTRO_LINE = '. . . that\'s it. i\'m done.';
const OUTRO_CPS = 7.5;                   // slow. he is not in a hurry any more
let outro = null, pageDead = false;

function outroTick(dt) {
  const o = outro;
  o.t += dt;
  if (o.t < 3.4) return;                 // let the room finish celebrating
  const before = Math.floor(o.type);
  if (o.type < OUTRO_LINE.length) {
    o.type += OUTRO_CPS * dt;
    if (Math.floor(o.type) > before)
      Audio_.tone(900 + Math.random() * 120, 0.02, 'square', 0.02, 1200);
    return;
  }
  o.done += dt;
  if (o.done > 2.6 && !pageDead) pageDies();
}

/* He takes the page down with him, for real. Everything is banked first —
   the run, the profile, the codex — and only then is the renderer put out of
   memory, so the tab dies with nothing owed to the player.

   Set REAL_CRASH to false to stop at the drawn recreation instead. Note that
   a genuine crash can take out another tab that Chrome happens to have put in
   this same renderer process; the allocation below stays inside V8's own heap,
   whose hard cap makes the renderer abort rather than dragging the machine
   into swap. */
const REAL_CRASH = true;

async function pageDies() {
  pageDead = true;
  try { Audio_.setVol(0); } catch (e) {}

  // 1. bank the run: best score, leaderboard, codex. Without this the clear
  //    that just happened would never be recorded anywhere.
  try { gameOver(true); } catch (e) {}
  try { Save.writeLocal(); } catch (e) {}
  // 2. give the cloud a moment, but never hang the ending on the network
  try {
    await Promise.race([Save.flush(),
                        new Promise(r => setTimeout(r, 2500))]);
  } catch (e) {}

  // 3. if this window was opened by a script, it really can close
  try { window.close(); } catch (e) {}

  if (!REAL_CRASH) { setTimeout(drawCrashScreen, 90); return; }
  setTimeout(exhaustMemory, 120);
}

function exhaustMemory() {
  /* Plain small-integer arrays live in V8's heap, so this trips V8's own
     out-of-memory abort — the renderer is killed and Chrome shows the real
     "Aw, Snap!". A fatal OOM is not catchable; if a browser instead throws
     something recoverable, drop the memory and use the recreation. */
  const hold = [];
  try {
    for (;;) hold.push(new Array(2e6).fill(7));
  } catch (e) {
    hold.length = 0;
    drawCrashScreen();
  }
}

function drawCrashScreen() {
  const dark = !window.matchMedia || matchMedia('(prefers-color-scheme: dark)').matches;
  const bg = dark ? '#202124' : '#fff';
  const fg = dark ? '#e8eaed' : '#202124';
  const sub = dark ? '#9aa0a6' : '#5f6368';
  const icon = dark ? '#9aa0a6' : '#80868b';
  document.title = location.host || 'VOIDRUNNER';
  document.documentElement.style.background = bg;
  document.body.style.cssText =
    'margin:0;background:' + bg + ';color:' + fg + ';overflow:hidden;' +
    'font:15px/1.5 system-ui,"Segoe UI",Roboto,Arial,sans-serif;';
  document.body.innerHTML =
    '<div style="max-width:600px;margin:0 auto;padding:min(22vh,180px) 24px 0;">' +
      '<svg width="72" height="72" viewBox="0 0 72 72" fill="none" ' +
        'style="margin-bottom:28px" aria-hidden="true">' +
        '<rect x="4" y="4" width="64" height="64" rx="8" stroke="' + icon +
          '" stroke-width="5"/>' +
        '<circle cx="25" cy="30" r="4.5" fill="' + icon + '"/>' +
        '<circle cx="47" cy="30" r="4.5" fill="' + icon + '"/>' +
        '<path d="M23 51c4-6 22-6 26 0" stroke="' + icon +
          '" stroke-width="5" stroke-linecap="round"/>' +
      '</svg>' +
      '<h1 style="font-size:24px;font-weight:400;margin:0 0 16px;color:' + fg + '">' +
        'Aw, Snap!</h1>' +
      '<p style="margin:0 0 8px;color:' + sub + '">Something went wrong while ' +
        'displaying this web page.</p>' +
      '<p style="margin:0;color:' + sub + '">Error code: ' +
        '<span style="white-space:nowrap">STATUS_BREAKPOINT</span></p>' +
      '<div style="margin-top:44px">' +
        '<button id="rl" style="background:#1a73e8;color:#fff;border:0;' +
          'border-radius:4px;padding:9px 18px;font:500 14px system-ui,' +
          '\'Segoe UI\',Roboto,Arial,sans-serif;cursor:pointer">Reload</button>' +
      '</div>' +
    '</div>';
  const b = document.getElementById('rl');
  if (b) b.onclick = () => location.reload();
}

function drawOutro() {
  const o = outro;
  if (o.t < 3.4) return;
  const shown = OUTRO_LINE.slice(0, Math.min(OUTRO_LINE.length, Math.floor(o.type)));
  // the room dims as he writes it
  const k = clamp(o.type / OUTRO_LINE.length, 0, 1);
  ctx.save();
  ctx.fillStyle = rgba('#050507', 0.35 + k * 0.55);
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '400 ' + Math.min(24, W * 0.028) + "px 'JetBrains Mono', ui-monospace, monospace";
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(226,232,240,0.10)';
  ctx.fillText(shown, W / 2, H / 2);
  ctx.restore();
  ctx.fillStyle = DEV_COL;
  ctx.fillText(shown, W / 2, H / 2);
  const cw = ctx.measureText(shown).width;
  ctx.globalAlpha = o.type >= OUTRO_LINE.length
    ? 0.5 + Math.sin(uiTime * 3.6) * 0.5 : 1;
  ctx.fillRect(W / 2 + cw / 2 + 5, H / 2 - 11, 10, 22);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

/* ============================ THE LAST WORD ================================
   Beating the unwritten does not end anything. It just gets somebody's
   attention, and he has been holding this in for a while.
========================================================================== */
const DEV_COL = '#e2e8f0';
let devLine = 0, devAsk = false, devRage = 0;
/* Each line is typed onto the stage and then wiped off it, so he reads as
   someone writing over the room rather than a box that appeared in front of
   it. devType counts characters revealed; devOut runs 1 -> 0 as a line goes. */
let devType = 0, devOut = 0;
const DEV_CPS = 46;

function devFullLine() { return DEV_TALK[Math.min(devLine, DEV_TALK.length - 1)]; }
function devShown()    { const s = devFullLine();
                         return s.slice(0, Math.min(s.length, Math.floor(devType))); }
function devTyped()    { return devType >= devFullLine().length; }

function devTypeTick(dt) {
  if (devOut > 0) {                       // the line is coming back off
    devOut -= dt * 2.8;
    if (devOut <= 0) {
      devOut = 0; devLine++; devType = 0;
      if (devLine >= DEV_TALK.length) {
        devLine = DEV_TALK.length - 1; devType = 1e9; devAsk = true;
      }
    }
    return;
  }
  if (!devTyped()) {
    const before = Math.floor(devType);
    devType += DEV_CPS * dt;
    // a key click per character, quiet enough to sit under the line
    if (Math.floor(devType) > before && Math.floor(devType) % 2 === 0)
      Audio_.tone(1400 + Math.random() * 300, 0.012, 'square', 0.012, 1800);
  }
}

const DEV_TALK = [
  'You beat it.',
  'Of course you beat it. You always beat it.',
  'Do you know how long the two-wound thing took me? The window, the banking, ' +
  'the way it seals if you are half a second late —',
  'four days. Nobody has ever mentioned it.',
  'I built a thing with no entry in the book. A thing that was supposed to ' +
  'mean there is always one more page. You filed it in nine minutes.',
  'And I know exactly what happens now. I have watched it happen for years.',
  'It is never “that was good”.',
  'It is always “is that all”.',
  'So go on. Say it. Ask me for it.'
];

const DEV_RAGE = [
  'Fine.',
  'FINE.',
  'You want the warden? Have two of him.',
  'Take the forge. Take the heart straight out of it.',
  'She had children. They are arms now. Say thank you.',
  'The archivist kept records. It can keep score instead.',
  'The curator arranged things. Let it arrange itself.',
  'And the one that held no ink — that is the spine. ' +
  'I hope it was worth nine minutes.',
  'THERE.',
  'Is that ENOUGH?'
];

/* devTalkT is the beat between the banner and him speaking; devTalkSaidNo is
   per-run, so declining quiets him now without closing the door. */
let devTalkT = 3.2, devTalkSaidNo = false;

function startDevTalk() {
  devLine = 0; devAsk = false; devType = 0; devOut = 0;
  enemies.length = 0; ebullets.length = 0;
  state = 'devtalk'; uiArm = 0.4;
  Audio_.select();
}

function devAdvance() {
  if (uiArm > 0 || devAsk || devOut > 0) return;
  if (!devTyped()) { devType = 1e9; return; }   // first press finishes the line
  devOut = 1;
  uiArm = 0.16;
  Audio_.tone(420, 0.04, 'sine', 0.03, 600);
}

function devAnswer(yes) {
  if (!devAsk || uiArm > 0) return;
  if (!yes) {
    /* He drops it for this run only. The flag stays on the profile, so he
       raises it again another time rather than the amalgam being lost for
       saying no once. */
    devTalkSaidNo = true;
    state = 'play';
    uiArm = 0.3;
    banner('HE GOES QUIET', '#64748b', 4.0);
    Audio_.select();
    return;
  }
  Save.profile.askedHarder = true;
  Save.profile.devTalkDue = false;
  Save.writeLocal(); Save.flush();
  startAmalgamCut();
}

function devButtons() {
  const bw = Math.min(280, (W - 90) / 2), bh = 58;
  const y = H / 2 + 118;
  return { no:  { x: W / 2 - bw - 10, y, w: bw, h: bh },
           yes: { x: W / 2 + 10,      y, w: bw, h: bh } };
}

function drawDevTalk() {
  /* The room stays visible underneath. He is writing on it, not replacing it. */
  const vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.12,
                                       W / 2, H / 2, Math.max(W, H) * 0.7);
  vig.addColorStop(0, 'rgba(5,5,7,0.55)');
  vig.addColorStop(1, 'rgba(5,5,7,0.9)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  ctx.save();
  ctx.globalAlpha = devOut > 0 ? devOut : 1;      // the line wipes off
  ctx.font = "400 17px 'JetBrains Mono', ui-monospace, monospace";
  const maxW = Math.min(720, W - 100), lh = 27;
  const lines = wrapLines(devShown(), maxW);
  const top = cy - 40;
  // a faint under-glow, so it reads as burned onto the floor
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(226,232,240,0.09)';
  lines.forEach((s, i) => ctx.fillText(s, cx, top + i * lh));
  ctx.restore();
  ctx.fillStyle = DEV_COL;
  lines.forEach((s, i) => ctx.fillText(s, cx, top + i * lh));
  // the caret sits at the end of what has been written so far
  if (!devAsk && devOut <= 0) {
    const last = lines[lines.length - 1] || '';
    ctx.globalAlpha *= devTyped() ? 0.5 + Math.sin(uiTime * 3.6) * 0.5 : 1;
    ctx.fillRect(cx + ctx.measureText(last).width / 2 + 5,
                 top + (lines.length - 1) * lh - 9, 9, 18);
  }
  ctx.restore();

  if (!devAsk) {
    ctx.font = "600 11px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = rgba('#64748b', 0.5 + Math.sin(uiTime * 3.4) * 0.4);
    ctx.fillText('SPACE', cx, H - 56);
    ctx.font = "500 9px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = '#27272a';
    ctx.fillText((devLine + 1) + ' / ' + DEV_TALK.length, cx, H - 36);
    ctx.textBaseline = 'alphabetic';
    return;
  }

  ctx.font = '800 ' + Math.min(30, W * 0.031) + 'px Barlow, system-ui, sans-serif';
  ctx.fillStyle = '#f87171';
  ctx.fillText('Do you want something harder?', cx, cy + 66);

  const b = devButtons();
  const btn = (r, label, sub, col) => {
    const hot = inRect(mouse.x, mouse.y, r);
    ctx.save();
    ctx.fillStyle = rgba(col, hot ? 0.2 : 0.06);
    ctx.strokeStyle = col; ctx.lineWidth = hot ? 2.4 : 1.6;
    roundRect(r.x, r.y, r.w, r.h, 9); ctx.fill(); ctx.stroke();
    ctx.fillStyle = col;
    ctx.font = "800 15px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillText(label, r.x + r.w / 2, r.y + 23);
    ctx.font = "500 9px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = '#52525b';
    ctx.fillText(sub, r.x + r.w / 2, r.y + 43);
    ctx.restore();
  };
  btn(b.no, 'NO   [N]', 'that was enough', '#64748b');
  btn(b.yes, 'YES   [Y]', 'it is never enough', '#f87171');
  ctx.textBaseline = 'alphabetic';
}

/* Spawned outside the scripted path — the dev console, or any future caller —
   a lone body has no fight object, so bossUnwritten had nothing to drive and it
   sat there as an inert shape. Build the fight around whatever turned up:
   find its twin or create one, then adopt both. */
function unwAdopt(e) {
  // a borrowed silhouette is not the thing itself and never starts the fight
  if (e.shadow > 0) return false;
  let other = null;
  for (const z of enemies)
    if (z !== e && z.boss === 'unwritten' && !z.dead) { other = z; break; }
  if (!other) {
    const cx = (arena.x0 + arena.x1) / 2, cy = (arena.y0 + arena.y1) / 2;
    other = spawnEnemy('boss',
      clamp(2 * cx - e.x, arena.x0 + 90, arena.x1 - 90),
      clamp(2 * cy - e.y, arena.y0 + 90, arena.y1 - 90), { boss: 'unwritten' });
    if (!other) return false;
  }
  e.unwSide = -1; other.unwSide = 1;
  e.floor = 0; other.floor = 0;
  for (const z of [e, other]) { z.armor = 0; z.absorb = 0; z.dr = 0; }
  const deaths = Save.profile.unwrittenDeaths || 0;
  const pool = UNW_POOL * Math.max(0.35, 1 - deaths * UNW_ATTRITION);
  unwritten = { a: e, b: other, hp: pool, maxHp: pool, t: 0,
                tok: pool / UNW_TARGET_SEC * ENDGAME_BURST,
                aHitT: 0, bHitT: 0, pending: 0,
                tearT: 2.2, writeT: 6, ups: {}, atkT: 2.4, phase: 0 };
  e.maxHp = other.maxHp = pool; e.hp = other.hp = pool;
  unwTears = []; unwDeadT = 0;
  if (!unwSnap) unwSnap = snapPlayer();   // so a death here still has somewhere to rewind to
  bossAlive = true;
  banner('THE UNWRITTEN', UNW_COL, 3.0);
  ringFx(e.x, e.y, 20, 700, UNW_INK, 1.1, 8);
  return true;
}

// the boss shell calls this per body; the fight itself is driven by unwUpdate
function bossUnwritten(e, dt) {
  if (!unwritten && !unwAdopt(e)) return;
  if (e === unwritten.a) unwUpdate(dt);   // drive once, from the first body
}

function bossOtherFinale(e, dt) {
  e.invuln = 1;                                  // nothing you do lands now
  e.vuln = 1;
  steer(e, (WORLD.w / 2 - e.x) * 0.9, (WORLD.h / 2 - e.y) * 0.9, 1.3, dt);
  e.ang += dt * BOSS_SPIN;

  for (const h of hazards) {
    if (h.kind !== 'mirror' || !h.orbit) continue;
    h.oAng += dt * MIRROR_SPIN;                  // counter-rotating, fixed rate
    h.x = e.x + Math.cos(h.oAng) * h.oR;
    h.y = e.y + Math.sin(h.oAng) * h.oR;
  }

  e.hp -= dt;                                    // one per second, ten to live
  if (e.hp <= 0) {
    e.hp = 0; e.invuln = 0;
    finaleBeams.length = 0;
    // it lets go: every mirror is flung outward and buries itself in a wall.
    // In flight they are lethal outright; once embedded they are just scenery.
    for (const h of hazards) {
      if (h.kind !== 'mirror' || !h.orbit) continue;
      h.orbit = false;
      h.flying = true;
      const a = Math.atan2(h.y - e.y, h.x - e.x) + rnd(0.12, -0.12);
      h.vx = Math.cos(a) * 1550;
      h.vy = Math.sin(a) * 1550;
      h.rot = 0; h.spin = rnd(7, -7);
      ringFx(h.x, h.y, 6, h.r * 2.2, '#99f6e4', 0.4, 3);
    }
    drawFlashT = 0.24; shake(1.2);
    Audio_.boom(); Audio_.crit();
    banner('LET GO', '#5eead4', 2.0);
    killEnemy(e);
    return;
  }

  finaleBeams.length = 0;
  castFinale(e.x, e.y, e.ang, 0, 0);

  e.beamTick = (e.beamTick || 0) - dt;
  if (e.beamTick <= 0) {
    for (const bm of finaleBeams) {
      if (segCircle(bm.x1, bm.y1, bm.x2, bm.y2, P.x, P.y, bm.w * 0.5 + P.r)) {
        e.beamTick = 0.34;
        hurtPlayer(e.dmg * 0.85);
        break;
      }
    }
  }
  if (Math.random() < 0.6) {
    const a = rnd(TAU);
    spawnPart(e.x + Math.cos(a) * e.r, e.y + Math.sin(a) * e.r,
      Math.cos(a) * 120, Math.sin(a) * 120, rnd(4, 2), '#5eead4', rnd(0.5, 0.25), 0.94);
  }
  if (Math.random() < 0.25) shake(0.05);
}

function bossOther(e, dt, ux, uy, d, ph) {
  if (e.virus) return bossOtherVirus(e, dt);
  if (e.finale) return bossOtherFinale(e, dt);
  if (e.hp <= 10) {
    /* Something else gets to it first, more often the more times you have
       won. This used to open at 0.05 and climb by 0.05, which was fine while
       it was only a variant ending — but the way below the mirror unlocks off
       this and nothing else, so at those odds most runs never saw the route
       existed. It now opens at a quarter and is certain by the fourth clear:
       still a surprise the first time, no longer a lottery for a whole path. */
    const odds = 0.25 + 0.25 * (Save.profile.otherKills || 0);
    if (Math.random() < odds) startVirus(e); else startFinale(e);
    return;
  }

  /* Phase 3: it stops imitating. It knits itself back to full, grows legs,
     and abandons the mirror act for a straight blind charge that only ends
     against a wall — where the impact stuns it and hands you the window. */
  if (!e.awakened && e.hp / e.maxHp <= 0.33) {
    e.awakened = true;
    e.lockPhase = 2;            // never fall back through the HP gates again
    e.hp = e.maxHp;
    e.legs = 0; e.rage = -1; e.atkT = 2.4; e.invuln = 1;
    banner('IT STOPS PRETENDING', '#5eead4', 3.2);
    drawFlashT = 0.28; shake(1);
    Audio_.boss(); Audio_.hurt();
    ringFx(e.x, e.y, e.r, 440, '#5eead4', 1.0, 7);
    burst(e.x, e.y, 70, '#5eead4', 380, 4.4, 1.1);
    return;
  }
  if (e.awakened) return bossOtherRage(e, dt);

  e.ang = Math.atan2(P.y - e.y, P.x - e.x);

  // mirror your position through the arena centre, then close in
  const mx = WORLD.w - P.x, my = WORLD.h - P.y;
  const toMirror = ph === 0 ? 1 : 0.55;
  const tx = lerp(P.x - ux * 260, mx, toMirror);
  const ty = lerp(P.y - uy * 260, my, toMirror);
  steer(e, (tx - e.x) * 1.6, (ty - e.y) * 1.6, 1.6 + ph * 0.5, dt);

  // it shoots your gun back at you
  e.cd -= dt;
  const rate = clamp(P.fireRate * (0.30 + ph * 0.07), 0.7, 7);
  if (e.cd <= 0 && d < 900) {
    e.cd = 1 / rate;
    const n = clamp(P.count, 1, 5);
    const dmg = clamp(P.dmg * 0.16, e.dmg * 0.28, e.dmg * 1.1);
    for (let k = 0; k < n; k++)
      eshoot(e, e.ang + (k - (n - 1) / 2) * 0.13 + rnd(0.05, -0.05), 400, dmg, 6);
    if (P.sun) addHazard('fire', e.x, e.y, 2.2, { r: 60, dmg: e.dmg * 0.5 });
  }

  if (e.atkT > 0) return;
  const a = pick(ph === 0 ? [0, 1] : ph === 1 ? [0, 1, 2] : [0, 1, 2, 3]);
  e.atk = a;
  switch (a) {
    case 0: {                            // your dash, used against you
      const ang = Math.atan2(P.y - e.y, P.x - e.x);
      e.vx = Math.cos(ang) * 1100; e.vy = Math.sin(ang) * 1100;
      burst(e.x, e.y, 20, '#5eead4', 280, 3.4, 0.45);
      Audio_.dash();
      e.atkT = 1.1; break;
    }
    case 1: {                            // reflected volley
      const n = 9 + ph * 3, off = rnd(TAU);
      for (let k = 0; k < n; k++) eshoot(e, off + k * TAU / n, 260, e.dmg * 0.42, 6);
      e.atkT = 1.3; break;
    }
    case 2: {                            // it makes copies of itself
      for (let k = 0; k < 2; k++) {
        const ang = rnd(TAU);
        const s = spawnEnemy('mimic', e.x + Math.cos(ang) * 90, e.y + Math.sin(ang) * 90,
                             { elite: false });
        s.col = '#5eead4';
        ringFx(s.x, s.y, 4, 50, '#5eead4', 0.4, 2);
      }
      Audio_.tone(520, 0.3, 'square', 0.1, 1100);
      e.atkT = 1.6; break;
    }
    case 3: {                            // mirror prison: ring with one gap
      const gap = rnd(TAU), n = 34;
      for (let k = 0; k < n; k++) {
        const ang = k * TAU / n;
        const dA = Math.abs(((ang - gap + Math.PI) % TAU + TAU) % TAU - Math.PI);
        if (dA < 0.45) continue;
        eshoot(e, ang, 210, e.dmg * 0.4, 6);
      }
      e.atkT = 1.7; break;
    }
  }
}

/* THE OTHER, awakened. Four states on a loop:
     -1 growing legs (untouchable)   0 locking on
      1 blind charge (uncorrectable) 2 stunned against the wall (vulnerable)
   The charge angle is committed at the moment it launches and never updated,
   so it can be baited — step aside and it commits to the wall instead. */
function bossOtherRage(e, dt) {
  e.legs = Math.min(1, (e.legs || 0) + dt * 0.65);
  const scuttle = () => {
    if (Math.random() < 0.7)
      spawnPart(e.x + rnd(e.r, -e.r), e.y + rnd(e.r, -e.r),
        rnd(70, -70), rnd(70, -70), rnd(3.4, 1.6), '#5eead4', rnd(0.45, 0.2), 0.93);
  };

  if (e.rage === -1) {                       // transforming
    e.invuln = 1; e.vuln = 1;
    e.vx *= Math.pow(0.02, dt); e.vy *= Math.pow(0.02, dt);
    e.ang += dt * 6;
    scuttle();
    if (Math.random() < 0.25) shake(0.08);
    e.atkT -= dt;
    if (e.atkT <= 0) { e.rage = 0; e.invuln = 0; e.atkT = 0.55; }
    return;
  }

  if (e.rage === 0) {                        // winding up, still trackable
    e.invuln = 0; e.vuln = 1;
    e.vx *= Math.pow(0.08, dt); e.vy *= Math.pow(0.08, dt);
    e.ang = angLerp(e.ang, Math.atan2(P.y - e.y, P.x - e.x), 1 - Math.exp(-9 * dt));
    e.atkT -= dt;
    if (e.atkT <= 0) {
      e.rage = 1;
      e.chargeAng = e.ang;                   // committed here and never again
      Audio_.noise(0.5, 0.24, 3800, 300, 3);
      shake(0.35);
    }
    return;
  }

  if (e.rage === 1) {                        // blind charge
    e.vuln = 1;
    e.vx = Math.cos(e.chargeAng) * 1450;
    e.vy = Math.sin(e.chargeAng) * 1450;
    scuttle(); scuttle();
    const m = e.r + 3;
    if (e.x <= arena.x0 + m || e.x >= arena.x1 - m ||
        e.y <= arena.y0 + m || e.y >= arena.y1 - m) {
      e.rage = 2; e.atkT = 1.8;
      e.vx = -Math.cos(e.chargeAng) * 240;
      e.vy = -Math.sin(e.chargeAng) * 240;
      explode(e.x, e.y, 165, e.dmg * 0.85, '#5eead4', true);
      shake(1); drawFlashT = 0.18;
      for (let k = 0; k < 16; k++) eshoot(e, rnd(TAU), rnd(270, 150), e.dmg * 0.28, 6);
    }
    return;
  }

  // rage 2 — face-first into the wall, and open
  e.vuln = 2.2;                              // the reward for baiting it
  e.vx *= Math.pow(0.02, dt); e.vy *= Math.pow(0.02, dt);
  e.ang += dt * 1.2;
  if (Math.random() < 0.3)
    spawnPart(e.x + rnd(e.r, -e.r), e.y + rnd(e.r, -e.r), 0, rnd(-40, -80),
      3, '#fde047', 0.5, 0.94);
  e.atkT -= dt;
  if (e.atkT <= 0) { e.vuln = 1; e.rage = 0; e.atkT = 0.55; }
}

/* Shared timed-salvo action (atk 6): drip-feeds a rotating spiral without
   setTimeout, so it stays in lockstep with pause and the fixed timestep. */
function bossSalvo(e, dt) {
  e.salvoT -= dt;
  if (e.salvoT > 0) return;
  e.salvoT = 0.075;
  const arms = e.arms || 2;
  for (let k = 0; k < arms; k++)
    eshoot(e, e.ang * 2 + e.salvo * 0.35 + k * TAU / arms, 215, e.dmg * 0.38, 6);
  if (--e.salvo <= 0) { e.atk = -1; e.atkT = Math.min(e.atkT, 0.25); }
}

/* ------------------------------- hazards ---------------------------------
   Stage-flavoured terrain: burning ground, acid, eruption vents, sweeping
   lasers and gravity wells. All share one array and one update.
-------------------------------------------------------------------------- */
let playerChill = 0;
// Single source of truth for laser width: the drawn bloom and the damage test
// both use it, so a beam never hits wider than it looks.
const LASER_HALF = 30;

function addHazard(kind, x, y, life = 8, opts = {}) {
  // Evict the oldest *temporary* hazard. Plain shift() would happily delete a
  // stage's permanent vents or gravity wells once a trail starts spamming.
  if (hazards.length > 46) {
    const i = hazards.findIndex(h => h.life < 1e8);
    hazards.splice(i >= 0 ? i : 0, 1);
  }
  hazards.push({
    kind, x, y, life, max: life, t: 0, tick: 0, friendly: !!opts.friendly,
    r: opts.r || (kind === 'well' ? 240 : kind === 'vent' ? 74
       : kind === 'mirror' ? 58 : kind === 'delete' ? 105 : 76),
    ang: opts.ang !== undefined ? opts.ang : rnd(TAU),
    state: 0, cd: opts.cd !== undefined ? opts.cd : rnd(3.2, 1.2),
    dmg: opts.dmg || 9,
    col: opts.col || (kind === 'acid' ? '#4ade80' : kind === 'well' ? '#f0abfc'
       : kind === 'laser' ? '#a78bfa' : kind === 'current' ? '#67e8f9'
       : kind === 'delete' ? '#f87171' : kind === 'mirror' ? '#5eead4' : '#f97316')
  });
}

/* Mirrors are solid objects, not fields. Without this you could stand inside
   one and be untouchable: incoming fire reflects off the shell while your own
   shots spawn inside it and leave unobstructed. Circle-vs-circle resolve with
   the inward velocity cancelled, so you slide along the surface. */
function collideMirrors(o, r) {
  for (const h of hazards) {
    if (h.kind !== 'mirror' || h.flying) continue;
    const dx = o.x - h.x, dy = o.y - h.y;
    const min = h.r + r;
    const d = Math.hypot(dx, dy);
    if (d >= min) continue;
    if (d < 0.001) { o.x = h.x + min; continue; }
    const nx = dx / d, ny = dy / d;
    o.x = h.x + nx * min;
    o.y = h.y + ny * min;
    const dot = o.vx * nx + o.vy * ny;
    if (dot < 0) { o.vx -= dot * nx; o.vy -= dot * ny; }
  }
}

function updateHazards(dt) {
  for (let i = hazards.length - 1; i >= 0; i--) {
    // addHazard() can evict an entry while we are iterating
    if (i >= hazards.length) { i = hazards.length; continue; }
    const h = hazards[i];
    if (!h) continue;
    h.t += dt;
    if (h.kind !== 'vent' && h.kind !== 'well') {
      h.life -= dt;
      if (h.life <= 0) { hazards.splice(i, 1); continue; }
    }
    const pd = len(P.x - h.x, P.y - h.y);
    // co-op: the same ground burns both ships. wd is 1e9 when nobody else is
    // standing, which makes every test below a no-op solo.
    const wg = mpPilots();
    const wd = wg ? len(wg.x - h.x, wg.y - h.y) : 1e9;

    switch (h.kind) {
      case 'fire': {
        if (Math.random() < 0.5)
          spawnPart(h.x + rnd(h.r, -h.r) * 0.8, h.y + rnd(h.r, -h.r) * 0.8,
            rnd(14, -14), rnd(-20, -46), rnd(4, 2), '#fb923c', rnd(0.5, 0.25), 0.94);
        h.tick -= dt;
        if (h.tick <= 0) {
          h.tick = 0.45;
          if (h.friendly) {                       // player-laid napalm
            for (const en of enemies) {
              if (en.dead || en.phased || en.invuln) continue;
              if (len(en.x - h.x, en.y - h.y) < h.r + en.r)
                damageEnemy(en, h.dmg, false, h.x, h.y, { silent: true, noChain: true });
            }
          } else {
            if (pd < h.r) hurtPlayer(h.dmg);
            if (wd < h.r) hurtWing(h.dmg);
          }
        }
        break;
      }
      case 'acid': {
        if (Math.random() < 0.35)
          spawnPart(h.x + rnd(h.r, -h.r) * 0.8, h.y + rnd(h.r, -h.r) * 0.8,
            rnd(10, -10), rnd(-8, -24), rnd(3.4, 1.6), '#4ade80', rnd(0.6, 0.3), 0.95);
        if (pd < h.r || wd < h.r) {
          if (pd < h.r) playerChill = Math.max(playerChill, 0.42);
          h.tick -= dt;
          if (h.tick <= 0) {
            h.tick = 0.6;
            if (pd < h.r) hurtPlayer(h.dmg * 0.7);
            if (wd < h.r) hurtWing(h.dmg * 0.7);
          }
        }
        break;
      }
      case 'vent': {
        h.cd -= dt;
        if (h.state === 0 && h.cd <= 0) { h.state = 1; h.cd = 1.0; }        // telegraph
        else if (h.state === 1 && h.cd <= 0) {                              // erupt
          h.state = 2; h.cd = 0.45;
          explode(h.x, h.y, h.r, h.dmg * 1.6, '#fb923c', false, true);
          if (pd < h.r + P.r) hurtPlayer(h.dmg * 1.6);
          if (wg && wd < h.r + wg.r) hurtWing(h.dmg * 1.6);
        } else if (h.state === 2 && h.cd <= 0) { h.state = 0; h.cd = rnd(5.5, 3.0); }
        if (h.state === 1 && Math.random() < 0.5)
          spawnPart(h.x + rnd(30, -30), h.y + rnd(30, -30), 0, rnd(-40, -90), 3, '#fbbf24', 0.4, 0.94);
        break;
      }
      case 'laser': {
        // 1s of telegraph, then a lethal line across the whole arena
        if (h.t > 1.0 && h.state === 0) {
          h.state = 1;
          Audio_.noise(0.35, 0.2, 6000, 1200, 3);
          shake(0.25);
        }
        if (h.state === 1 && h.t < 1.55) {
          const dxl = Math.cos(h.ang), dyl = Math.sin(h.ang);
          const rel = (P.x - h.x) * -dyl + (P.y - h.y) * dxl;   // perpendicular distance
          if (Math.abs(rel) < LASER_HALF) hurtPlayer(h.dmg);
          if (wg && Math.abs((wg.x - h.x) * -dyl + (wg.y - h.y) * dxl) < LASER_HALF)
            hurtWing(h.dmg);
          for (const en of enemies) {
            if (en.dead || en.type === 'boss') continue;
            const r2 = (en.x - h.x) * -dyl + (en.y - h.y) * dxl;
            if (Math.abs(r2) < LASER_HALF + en.r * 0.5 && en.hitCd <= 0) {
              en.hitCd = 0.3;
              damageEnemy(en, h.dmg * 0.6, false, h.x, h.y, { silent: true });
            }
          }
        }
        break;
      }
      case 'current': {
        // AQUARIUS: charged water you leave behind — always friendly
        h.tick -= dt;
        if (h.tick <= 0) {
          h.tick = 0.22;
          for (const en of enemies) {
            if (en.dead || en.phased || en.invuln) continue;
            if (len(en.x - h.x, en.y - h.y) < h.r + en.r) {
              damageEnemy(en, h.dmg, false, h.x, h.y, { silent: true, noChain: true });
              if (Math.random() < 0.4)
                arcs.push({ x1: h.x, y1: h.y, x2: en.x, y2: en.y,
                            life: 0.12, max: 0.12, col: '#a5f3fc' });
            }
          }
        }
        break;
      }
      case 'mirror': {
        // Inert terrain, except while it is shrapnel. A mirror in flight goes
        // straight through a full set of shields; once it buries itself in a
        // wall it is safe to stand next to again.
        if (!h.flying) {
          if (h.embedded) {
            h.embT = (h.embT || 0) + dt;
            // the puncture keeps bleeding material into the room
            if (Math.random() < 0.45) {
              const a = rnd(TAU);
              spawnPart(h.x + Math.cos(a) * h.r * 0.75, h.y + Math.sin(a) * h.r * 0.75,
                (h.wallNx || 0) * rnd(75, 20) + rnd(36, -36),
                (h.wallNy || 0) * rnd(75, 20) + rnd(36, -36),
                rnd(3.2, 1.3), Math.random() < 0.45 ? '#ffffff' : '#99f6e4',
                rnd(0.85, 0.35), 0.95);
            }
          }
          break;
        }
        h.x += h.vx * dt; h.y += h.vy * dt;
        h.rot = (h.rot || 0) + (h.spin || 0) * dt;
        if (Math.random() < 0.8)
          spawnPart(h.x + rnd(h.r, -h.r) * 0.6, h.y + rnd(h.r, -h.r) * 0.6,
            rnd(60, -60), rnd(60, -60), rnd(4, 2), '#99f6e4', rnd(0.4, 0.2), 0.92);
        if (len(P.x - h.x, P.y - h.y) < h.r + P.r) {
          floatText(P.x, P.y - 34, 'SHATTERED', '#5eead4', 17);
          burst(P.x, P.y, 40, '#5eead4', 380, 4, 0.8);
          drawFlashT = 0.2; shake(0.9);
          hurtPlayer(1e9, { pure: true });     // bypasses shields entirely
        }
        const m = h.r * 0.55;
        if (h.x <= arena.x0 + m || h.x >= arena.x1 - m ||
            h.y <= arena.y0 + m || h.y >= arena.y1 - m) embedShard(h);
        break;
      }
      case 'delete': {
        // THE ARCHIVE: a band that blinks out of existence, taking you with it
        const on = (h.t % 2.2) > 1.2;
        h.state = on ? 1 : 0;
        if (on) {
          h.tick -= dt;
          if (h.tick <= 0 && (pd < h.r || wd < h.r)) {
            h.tick = 0.4;
            if (pd < h.r) hurtPlayer(h.dmg);
            if (wd < h.r) hurtWing(h.dmg);
          }
          if (Math.random() < 0.5)
            spawnPart(h.x + rnd(h.r, -h.r) * 0.9, h.y + rnd(h.r, -h.r) * 0.9,
              0, rnd(20, -20), rnd(3, 1.5), '#f87171', 0.4, 0.94);
        }
        break;
      }
      case 'well': {
        // constant inward pull — fights your positioning rather than your HP
        if (pd < h.r && pd > 1) {
          const f = (1 - pd / h.r) * 300;
          P.vx += (h.x - P.x) / pd * f * dt;
          P.vy += (h.y - P.y) / pd * f * dt;
        }
        if (wg && wd < h.r && wd > 1) {
          const f = (1 - wd / h.r) * 300;
          wg.vx += (h.x - wg.x) / wd * f * dt;
          wg.vy += (h.y - wg.y) / wd * f * dt;
        }
        if (Math.random() < 0.4) {
          const a = rnd(TAU), rr = rnd(h.r, h.r * 0.4);
          spawnPart(h.x + Math.cos(a) * rr, h.y + Math.sin(a) * rr,
            -Math.cos(a) * 60, -Math.sin(a) * 60, 2.4, h.col, 0.6, 0.96);
        }
        break;
      }
    }
  }
}

/* Permanent per-stage fixtures, laid down whenever a stage begins. Vents and
   wells are fixtures; acid and lasers are transient and come from the ambient
   ticker below instead. */
function seedStageHazards() {
  hazards.length = 0;
  ambientT = 3;
  const k = stage.hazard;
  if (!k) return;
  const n = k === 'vent' ? 7 : k === 'well' ? 4 : k === 'delete' ? 6 : k === 'mirror' ? 5 : 0;
  for (let i = 0; i < n; i++) {
    let x, y, tries = 0;
    do {
      x = rnd(WORLD.w - 200, 200); y = rnd(WORLD.h - 200, 200);
    } while ((len(x - P.x, y - P.y) < 340 ||
              len(x - WORLD.w / 2, y - WORLD.h / 2) < 260) && ++tries < 24);
    addHazard(k, x, y, 1e9, { dmg: 10 + wave * 0.6 });
  }
}

/* Transient stage terrain: the hive keeps seeping acid, the vault keeps
   sweeping lasers, so those sectors stay hostile between boss fights. */
let ambientT = 0;
function updateStageAmbient(dt) {
  const k = stage.hazard;
  if (k !== 'acid' && k !== 'laser') return;
  ambientT -= dt;
  if (ambientT > 0) return;
  if (k === 'acid') {
    ambientT = rnd(4.6, 2.6);
    let x, y, tries = 0;
    do { x = rnd(WORLD.w - 160, 160); y = rnd(WORLD.h - 160, 160); }
    while (len(x - P.x, y - P.y) < 230 && ++tries < 16);
    addHazard('acid', x, y, rnd(11, 7), { dmg: 8 + wave * 0.35 });
  } else {
    ambientT = rnd(7.5, 4.5);
    addHazard('laser', clamp(P.x + rnd(320, -320), 80, WORLD.w - 80),
                       clamp(P.y + rnd(320, -320), 80, WORLD.h - 80), 2.0,
      { ang: rnd(TAU), dmg: 10 + wave * 0.45, col: stage.accent });
  }
}

/* --------------------------- mortars (telegraphed AoE) -------------------- */
function updateMortars(dt) {
  for (let i = mortars.length - 1; i >= 0; i--) {
    const m = mortars[i];
    m.t -= dt;
    if (m.t <= 0) {
      // Payload Counter calls these in too, and a shell you asked for does
      // not get to bill you for landing where you aimed it
      if (m.mine) { playerBlast(m.x, m.y, m.r, m.dmg, m.col); mortars.splice(i, 1); continue; }
      explode(m.x, m.y, m.r, m.dmg, m.col, false);
      if (len(P.x - m.x, P.y - m.y) < m.r + P.r) hurtPlayer(m.dmg);
      const wgm = mpPilots();
      if (wgm && len(wgm.x - m.x, wgm.y - m.y) < m.r + wgm.r) hurtWing(m.dmg);
      if (m.big) {
        const v = onScreen(m.x, m.y, m.r);
        shake(0.7 * v);
        if (v > 0) drawFlashT = Math.max(drawFlashT, 0.1 * v);
      }
      mortars.splice(i, 1);
    }
  }
}

/* ------------------------------- sentries --------------------------------- */
function updateSentries(dt) {
  for (let i = sentries.length - 1; i >= 0; i--) {
    const s = sentries[i];
    s.life -= dt;
    if (s.life <= 0) {
      burst(s.x, s.y, 12, COL.player, 190, 3, 0.4);
      sentries.splice(i, 1); continue;
    }
    s.cd -= dt;
    const t = nearestEnemy(s.x, s.y, 600);
    if (!t) continue;
    s.ang = angLerp(s.ang, Math.atan2(t.y - s.y, t.x - s.x), 1 - Math.exp(-10 * dt));
    if (s.cd <= 0) {
      s.cd = 0.3;
      bullets.push({
        x: s.x + Math.cos(s.ang) * 15, y: s.y + Math.sin(s.ang) * 15,
        vx: Math.cos(s.ang) * 780, vy: Math.sin(s.ang) * 780,
        r: 3.6, dmg: s.dmg, crit: false, pierce: 0, ric: 0, life: 0.85,
        hits: null, frag: 0, px: s.x, py: s.y, dist: 0
      });
      Audio_.tone(540, 0.05, 'square', 0.04, 250);
    }
  }
}

/* ------------------------------- the filing --------------------------------
   A ring that closes on the player and has to be shot open. If it reaches its
   minimum radius it detonates. Bullets crossing the ring damage it, which
   means firing outward is the escape — the opposite of the usual instinct. */
function updateCages(dt) {
  for (let i = cages.length - 1; i >= 0; i--) {
    const c = cages[i];
    c.t += dt;
    c.r = Math.max(c.min, c.r - 46 * dt);

    // bullets crossing the ring chew through it
    for (let b = bullets.length - 1; b >= 0; b--) {
      const bu = bullets[b];
      if (!bu.mine) continue;
      const dNow = len(bu.x - c.x, bu.y - c.y);
      const dPrev = len(bu.px - c.x, bu.py - c.y);
      if ((dPrev < c.r) !== (dNow < c.r)) {          // crossed the boundary
        c.hp -= bu.dmg;
        burst(bu.x, bu.y, 5, '#e2e8f0', 200, 2.4, 0.3);
        floatText(bu.x, bu.y, Math.round(bu.dmg), '#e2e8f0', 11);
        bullets.splice(b, 1);
      }
    }
    if (c.hp <= 0) {
      ringFx(c.x, c.y, c.r, c.r + 120, '#e2e8f0', 0.5, 4);
      burst(c.x, c.y, 40, '#e2e8f0', 320, 3.4, 0.7);
      Audio_.kill(); shake(0.3);
      floatText(P.x, P.y - 40, 'RELEASED', COL.hp, 16);
      cages.splice(i, 1); continue;
    }
    // it holds you in: crossing outward is blocked while it stands
    const pd = len(P.x - c.x, P.y - c.y);
    if (pd > c.r - P.r) {
      const a = Math.atan2(P.y - c.y, P.x - c.x);
      P.x = c.x + Math.cos(a) * (c.r - P.r);
      P.y = c.y + Math.sin(a) * (c.r - P.r);
      P.vx *= 0.4; P.vy *= 0.4;
    }
    if (c.r <= c.min + 0.5) {
      explode(c.x, c.y, c.min + 40, c.dmg, '#e2e8f0', true);
      cages.splice(i, 1);
    }
  }
}

/* --------------------------------- beams ---------------------------------- */
function updateBeams(dt) {
  for (let i = beams.length - 1; i >= 0; i--) {
    beams[i].life -= dt;
    if (beams[i].life <= 0) beams.splice(i, 1);
  }
}

/* -------------------------------- bullets --------------------------------- */
function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    if (tribunal && !tribunal.over && triShot(bullets[i].x, bullets[i].y)) {
      bullets.splice(i, 1);            // it lands, and it costs you
      continue;
    }
    const b = bullets[i];
    b.px = b.x; b.py = b.y;
    b.life -= dt;
    if (P.bore && b.mine) {
      const drag = Math.pow(0.72, dt);
      b.vx *= drag; b.vy *= drag;
      b.dmg *= 1 + 0.55 * P.bore * dt;
    }
    if (b.life <= 0 && P.snap && b.mine && !b.snapped) {
      b.snapped = true;
      b.life = 0.85;
      b.hits = null;                     // it may hit the same bodies again
      const a = Math.atan2(P.y - b.y, P.x - b.x);
      const s = Math.max(340, len(b.vx, b.vy));
      b.vx = Math.cos(a) * s; b.vy = Math.sin(a) * s;
      b.dmg *= 0.8;
      continue;
    }
    if (b.life <= 0) {
      // VIRGO: a shot that hits nothing is an imperfection, and it costs you
      if (P.exacting && b.mine && !b.hit) {
        hurtPlayer(P.exacting, { pure: true });
        floatText(b.x, b.y, 'MISS', '#f0abfc', 11, -30);
      }
      bullets.splice(i, 1); continue;
    }

    if (P.homing) {
      const t = nearestEnemy(b.x, b.y, 420);
      if (t) {
        const want = Math.atan2(t.y - b.y, t.x - b.x);
        const cur = Math.atan2(b.vy, b.vx);
        const na = angLerp(cur, want, clamp(P.homing * dt, 0, 0.4));
        const s = len(b.vx, b.vy);
        b.vx = Math.cos(na) * s; b.vy = Math.sin(na) * s;
      }
    }

    // PISCES: everything you fire is underwater — it drags, drifts and sinks
    if (b.deep) {
      const drag = Math.pow(0.28, dt);
      b.vx *= drag; b.vy *= drag;
      b.wob += dt * 5;
      b.vx += Math.cos(b.wob) * 70 * dt;
      b.vy += 300 * dt + Math.sin(b.wob) * 70 * dt;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.dist += len(b.x - b.px, b.y - b.py);

    // walls
    let bounced = false;
    if (b.x < arena.x0 + b.r) { b.x = arena.x0 + b.r; b.vx = Math.abs(b.vx); bounced = true; }
    else if (b.x > arena.x1 - b.r) { b.x = arena.x1 - b.r; b.vx = -Math.abs(b.vx); bounced = true; }
    if (b.y < arena.y0 + b.r) { b.y = arena.y0 + b.r; b.vy = Math.abs(b.vy); bounced = true; }
    else if (b.y > arena.y1 - b.r) { b.y = arena.y1 - b.r; b.vy = -Math.abs(b.vy); bounced = true; }
    if (bounced) {
      if (b.ric > 0) {
        b.ric--; b.hits = null;
        burst(b.x, b.y, 4, b.crit ? COL.crit : COL.bullet, 130, 2, 0.2);
      } else { bullets.splice(i, 1); continue; }
    }

    // THE MIRROR: your rounds bank off the pucks - and so do theirs, so the
    // room cuts both ways.
    for (const h of hazards) {
      if (h.kind !== 'mirror') continue;
      const dm = len(b.x - h.x, b.y - h.y);
      if (dm >= h.r || dm < 0.001) continue;
      const nx = (b.x - h.x) / dm, ny = (b.y - h.y) / dm;
      const dot = b.vx * nx + b.vy * ny;
      if (dot >= 0) continue;
      b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny;
      b.x = h.x + nx * (h.r + 2); b.y = h.y + ny * (h.r + 2);
      b.hits = null;
      burst(b.x, b.y, 4, '#5eead4', 170, 2.2, 0.22);
      break;
    }

    // REDACTOR: anything inside its cone is simply erased, before it can hit
    if (b.mine && !annotated()) {
      let erased = false;
      for (const e of enemies) {
        if (e.dead || e.type !== 'redactor' || !e.redacting) continue;
        const dxr = b.x - e.x, dyr = b.y - e.y;
        const dr = len(dxr, dyr);
        if (dr > 330) continue;
        const off = Math.abs(((Math.atan2(dyr, dxr) - e.ang + Math.PI) % TAU + TAU) % TAU - Math.PI);
        if (off < 0.55) {
          burst(b.x, b.y, 4, '#f87171', 130, 2.2, 0.25);
          if (Math.random() < 0.25) floatText(b.x, b.y, 'REDACTED', '#f87171', 10, -24);
          erased = true; break;
        }
      }
      if (erased) { bullets.splice(i, 1); continue; }
    }

    /* Fused bodies take a shove from your fire without stopping it — that is
       the point of them being a corpse and not an enemy: you can putt one
       into a crowd before it goes off. */
    for (const c of corpses) {
      if (!c.vol) continue;
      if (!segCircle(b.px, b.py, b.x, b.y, c.x, c.y, c.r + b.r)) continue;
      const s = len(b.vx, b.vy) || 1;
      c.vx += b.vx / s * 260; c.vy += b.vy / s * 260;
      c.life = Math.max(c.life, 0.16);   // a nudge buys it a moment to travel
      spawnPart(c.x, c.y, rnd(70, -70), rnd(70, -70), 3, '#fecaca', 0.25, 0.9);
    }

    // enemy collision (swept against previous position for fast bullets)
    let removed = false;
    for (const e of enemies) {
      if (e.dead || e.phased || e.invuln) continue;   // intangible / burrowed
      if (e.hacked) continue;                          // that one is yours
      if (b.hits && b.hits.has(e.id)) continue;
      const rr = e.r + b.r;
      if (!segCircle(b.px, b.py, b.x, b.y, e.x, e.y, rr)) continue;

      // sentinels carry a frontal shield: shots into the face are deflected
      if (e.type === 'sentinel' && !annotated()) {
        const inc = Math.atan2(b.py - e.y, b.px - e.x);
        const dA = Math.abs(((inc - e.ang + Math.PI) % TAU + TAU) % TAU - Math.PI);
        if (dA < 1.15) {
          burst(b.x, b.y, 5, '#bae6fd', 200, 2.4, 0.28);
          Audio_.tone(1100, 0.05, 'square', 0.05, 1600);
          removed = true; break;
        }
      }

      // PRISM: the mirrored half throws your own shot back at you
      if (e.type === 'prism' && !annotated()) {
        const inc = Math.atan2(b.py - e.y, b.px - e.x);
        const off = Math.abs(((inc - e.plateAng + Math.PI) % TAU + TAU) % TAU - Math.PI);
        if (off < 1.3) {
          const back = Math.atan2(P.y - e.y, P.x - e.x) + rnd(0.25, -0.25);
          ebullets.push({ x: e.x + Math.cos(back) * e.r, y: e.y + Math.sin(back) * e.r,
            vx: Math.cos(back) * 330, vy: Math.sin(back) * 330,
            r: 6, dmg: e.dmg, life: 3.5, col: '#a5f3fc' });
          burst(b.x, b.y, 5, '#a5f3fc', 220, 2.4, 0.28);
          Audio_.tone(1250, 0.05, 'sine', 0.05, 700);
          removed = true; break;
        }
      }

      // forgeheart's plates eat anything not threaded through a gap
      if (e.boss === 'forgeheart') {
        const inc = Math.atan2(b.py - e.y, b.px - e.x);
        const rel = ((inc - e.plateAng) % TAU + TAU) % TAU;
        const seg = TAU / 4;
        if (rel % seg < seg * 0.62) {
          burst(b.x, b.y, 5, '#fde68a', 220, 2.6, 0.3);
          Audio_.tone(900, 0.06, 'square', 0.055, 1300);
          removed = true; break;
        }
      }

      // range-dependent modifiers resolve here, using distance actually flown
      let dmg = b.dmg;
      if (P.longshot)   dmg *= 1 + P.longshot * 0.14 * clamp(b.dist / 620, 0, 1);
      if (P.pointblank) dmg *= 1 + P.pointblank * 0.30 * clamp(1 - b.dist / 300, 0, 1);
      // SAGITTARIUS: an arrow gathers force the longer it has been flying
      if (b.arrow) dmg *= 1 + b.arrow * 1.1 * clamp(b.dist / 700, 0, 1);
      b.hit = true;
      damageEnemy(e, dmg, b.crit, b.px, b.py);
      // SCORPIO: inject venom that builds with every sting
      if (b.venom && !e.dead) {
        e.psn = Math.min(12, (e.psn || 0) + b.venom);
        e.psnT = 4.5;
      }
      // LEO: solar rounds set the ground alight where they land
      if (b.solar && Math.random() < 0.5)
        addHazard('fire', b.x, b.y, 2.2, { r: 46, dmg: 5 + P.dmg * 0.14,
                                           friendly: true, col: '#fbbf24' });
      if (!e.dead) {
        const s = len(b.vx, b.vy) || 1;
        e.vx += b.vx / s * P.knock * (e.type === 'boss' ? 0.06 : e.type === 'brute' ? 0.35 : 1);
        e.vy += b.vy / s * P.knock * (e.type === 'boss' ? 0.06 : e.type === 'brute' ? 0.35 : 1);
      }
      if (b.frag > 0) {
        const base = Math.atan2(b.vy, b.vx);
        const n = 2 + b.frag;
        for (let k = 0; k < n; k++) {
          const a = base + Math.PI + (k - (n - 1) / 2) * 0.55 + rnd(0.2, -0.2);
          fireBullet(b.x, b.y, a, 0.42, { sm: 0.72, rm: 0.72, lm: 0.5, noFrag: true });
        }
      }
      if (b.arrow) {
        // an arrow does not stop for anything
        (b.hits || (b.hits = new Set())).add(e.id);
      } else if (b.pierce > 0) {
        b.pierce--;
        (b.hits || (b.hits = new Set())).add(e.id);
        b.dmg *= 0.86;
      } else { removed = true; }
      break;
    }
    if (removed) {
      burst(b.x, b.y, 3, b.crit ? COL.crit : COL.bullet, 140, 2, 0.2);
      bullets.splice(i, 1);
    }
  }
}

// segment (x1,y1)->(x2,y2) intersects circle (cx,cy,r)?
function segCircle(x1, y1, x2, y2, cx, cy, r) {
  const dx = x2 - x1, dy = y2 - y1;
  const fx = x1 - cx, fy = y1 - cy;
  const a = dx * dx + dy * dy;
  if (a < 1e-6) return fx * fx + fy * fy <= r * r;
  let t = -(fx * dx + fy * dy) / a;
  t = clamp(t, 0, 1);
  const px = fx + dx * t, py = fy + dy * t;
  return px * px + py * py <= r * r;
}

function updateEBullets(dt) {
  for (let i = ebullets.length - 1; i >= 0; i--) {
    // hurtPlayer() below can empty this array outright — Second Wind
    // clears the screen — so re-anchor rather than read past the end.
    if (i >= ebullets.length) { i = ebullets.length; continue; }
    const b = ebullets[i];
    if (!b) continue;
    // DEADLOCK holds a bullet mid-air; it must not age out while suspended
    if (b.frozen > 0) {
      b.frozen -= dt;
      if (b.frozen <= 0) { b.vx = b.svx; b.vy = b.svy; }
      continue;
    }
    b.life -= dt;
    // Seeker Rounds and Ricochet, when something has written them onto itself
    if (b.homeP) {
      const s = len(b.vx, b.vy) || 1;
      const want = Math.atan2(P.y - b.y, P.x - b.x);
      const cur = Math.atan2(b.vy, b.vx);
      const a = angLerp(cur, want, 1 - Math.exp(-1.6 * b.homeP * dt));
      b.vx = Math.cos(a) * s; b.vy = Math.sin(a) * s;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.ricP > 0) {
      let hit = false;
      if (b.x < arena.x0 + b.r) { b.x = arena.x0 + b.r; b.vx = -b.vx; hit = true; }
      else if (b.x > arena.x1 - b.r) { b.x = arena.x1 - b.r; b.vx = -b.vx; hit = true; }
      if (b.y < arena.y0 + b.r) { b.y = arena.y0 + b.r; b.vy = -b.vy; hit = true; }
      else if (b.y > arena.y1 - b.r) { b.y = arena.y1 - b.r; b.vy = -b.vy; hit = true; }
      if (hit) { b.ricP--; burst(b.x, b.y, 3, b.col, 140, 2, 0.2); }
    }
    if (b.life <= 0 || b.x < -20 || b.y < -20 || b.x > WORLD.w + 20 || b.y > WORLD.h + 20) {
      ebullets.splice(i, 1); continue;
    }
    for (const h of hazards) {
      if (h.kind !== 'mirror') continue;
      const dm = len(b.x - h.x, b.y - h.y);
      if (dm >= h.r || dm < 0.001) continue;
      const nx = (b.x - h.x) / dm, ny = (b.y - h.y) / dm;
      const dot = b.vx * nx + b.vy * ny;
      if (dot >= 0) continue;
      b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny;
      b.x = h.x + nx * (h.r + 2); b.y = h.y + ny * (h.r + 2);
      burst(b.x, b.y, 4, '#5eead4', 170, 2.2, 0.22);
      break;
    }
    if (Math.random() < 0.3)
      spawnPart(b.x, b.y, 0, 0, b.r * 0.7, b.col, 0.2, 0.9);
    if (P.plateT > 0) {
      const pd = len(b.x - P.x, b.y - P.y);
      if (pd < 84 && pd > 34) {
        const rel = ((Math.atan2(b.y - P.y, b.x - P.x) - P.plateAng) % TAU + TAU) % TAU;
        const seg = TAU / 4;
        if (rel % seg < seg * 0.62) {
          burst(b.x, b.y, 4, '#fbbf24', 190, 2.2, 0.26);
          Audio_.tone(900, 0.05, 'square', 0.045, 1300);
          ebullets.splice(i, 1);
          continue;
        }
      }
    }
    // anything you have taken is in the way, and can be shot off you
    if (hackHitByBullet(b)) { ebullets.splice(i, 1); continue; }
    if (len(b.x - P.x, b.y - P.y) < b.r + P.r) {
      hurtPlayer(b.dmg, { src: b.owner });
      burst(b.x, b.y, 8, b.col, 200, 2.4, 0.35);
      ebullets.splice(i, 1);
      continue;
    }
    // the wingman is shot at by the same rounds, on the same terms
    const wg = mpPilots();
    if (wg && len(b.x - wg.x, b.y - wg.y) < b.r + wg.r) {
      hurtWing(b.dmg);
      burst(b.x, b.y, 8, b.col, 200, 2.4, 0.35);
      ebullets.splice(i, 1);
    }
  }
}

/* -------------------------------- pickups --------------------------------- */
function updatePickups(dt) {
  const pr = P.pickupR;
  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];
    g.life -= dt;
    // co-op: xp is the run's, not a pilot's, so either ship may sweep it up
    const gt = mpAim(g.x, g.y);
    const dx = gt.x - g.x, dy = gt.y - g.y, d = len(dx, dy) || 1;
    if (d < pr) {
      const pull = clamp((1 - d / pr) * 2400 / d, 0, 5000);
      g.vx += dx * pull * dt; g.vy += dy * pull * dt;
    }
    g.vx *= Math.pow(0.12, dt); g.vy *= Math.pow(0.12, dt);
    g.x += g.vx * dt; g.y += g.vy * dt;
    if (d < gt.r + g.r + 4 || g.life <= 0) {
      if (g.life > 0) {
        P.xp += g.v * P.xpMul;
        if (P.siphon) P.hp = Math.min(P.maxHp, P.hp + 0.2 * P.siphon);
        Audio_.gem();
        spawnPart(g.x, g.y, 0, 0, 8, COL.xp, 0.22, 0.9);
      }
      gems.splice(i, 1);
    }
  }
  checkLevel();

  for (let i = drops.length - 1; i >= 0; i--) {
    const d0 = drops[i];
    d0.life -= dt; d0.t += dt * 3;
    d0.x += d0.vx * dt; d0.y += d0.vy * dt;
    d0.vx *= Math.pow(0.08, dt); d0.vy *= Math.pow(0.08, dt);
    const dt0 = mpAim(d0.x, d0.y);
    const dx = dt0.x - d0.x, dy = dt0.y - d0.y, d = len(dx, dy) || 1;
    if (d < pr * 1.2) { d0.x += dx / d * 240 * dt; d0.y += dy / d * 240 * dt; }
    if (Math.random() < (d0.kind === 'credit' ? 0.12 : 0.3))
      spawnPart(d0.x + rnd(14, -14), d0.y + rnd(14, -14), 0, -20, 2.4, d0.col, 0.4, 0.95);
    if (d < dt0.r + d0.r + 6) {
      if (d0.kind === 'credit') {
        credits += d0.v;
        floatText(d0.x, d0.y - 10, '+' + d0.v, '#fde68a', 12);
        Audio_.tone(1050 + rnd(300), 0.05, 'square', 0.045, 1600);
      } else if (d0.kind === 'heal') {
        // whoever walked over it is the one who gets patched up
        if (chalNoHeal()) {
          floatText(dt0.x, dt0.y - 30, 'NOTHING HEALS', '#64748b', 13);
          Audio_.tone(150, 0.12, 'square', 0.05, 90);
        } else {
          const amt = Math.round(dt0.maxHp * 0.28);
          dt0.hp = Math.min(dt0.maxHp, dt0.hp + amt);
          floatText(dt0.x, dt0.y - 30, '+' + amt + ' HP', COL.hp, 17);
          Audio_.heal();
          ringFx(dt0.x, dt0.y, 8, 90, COL.hp, 0.45, 3);
        }
      } else {
        floatText(P.x, P.y - 30, 'OVERLOAD', '#f0abfc', 18);
        drawFlashT = 0.16; shake(0.8);
        ringFx(P.x, P.y, 20, 900, '#f0abfc', 0.7, 8);
        Audio_.boom();
        for (const e of enemies) {
          if (e.dead) continue;
          if (len(e.x - P.x, e.y - P.y) < 900)
            damageEnemy(e, 90 + wave * 22, true, P.x, P.y, { silent: true });
        }
        ebullets.length = 0;
      }
      drops.splice(i, 1); continue;
    }
    if (d0.life <= 0) drops.splice(i, 1);
  }
}

/* ------------------------------- particles -------------------------------- */
function updateParticles(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { partPool.push(parts[i]); parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    const dr = Math.pow(p.drag, dt * 60);
    p.vx *= dr; p.vy *= dr;
  }
