  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.life -= dt;
    f.y += f.vy * dt; f.vy *= Math.pow(0.05, dt);
    if (f.life <= 0) floats.splice(i, 1);
  }
  for (let i = arcs.length - 1; i >= 0; i--) { arcs[i].life -= dt; if (arcs[i].life <= 0) arcs.splice(i, 1); }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.life -= dt;
    const t = 1 - r.life / r.max;
    r.r = lerp(r.r0, r.r1, 1 - Math.pow(1 - t, 3));
    if (r.life <= 0) rings.splice(i, 1);
  }
  updateCorpses(dt);
}

/* ================================ RENDER ================================== */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, W, H);
  // whichever overlay draws the slider re-publishes it; otherwise it is gone
  if (!volDrag) volRect = null;
  if (!sensDrag) sensRect = null;

  if (state === 'menu' || state === 'name' || state === 'lan' || state === 'chal' ||
      (state === 'settings' && setFrom === 'menu')) {
    if (state === 'chal') drawChal();
    else {
      renderMenu();
      if (state === 'name') drawNameEntry();
      if (state === 'lan') drawLan();
      if (state === 'settings') drawSettings();
    }
    // these pages return before the pass at the foot of render(), and they are
    // precisely the ones with no cursor of their own
    if (!isTouch) drawUICursor(lastDT);
    return;
  }

  const z = camZoom;
  viewBounds(140);                 // cull box for every draw loop below
  const ox = -cam.x + W / (2 * z) + cam.sx / z;
  const oy = -cam.y + H / (2 * z) + cam.sy / z;

  ctx.save();
  ctx.scale(z, z);
  ctx.translate(ox, oy);

  drawFloorMat(ox, oy);
  drawGrid(ox, oy);
  drawArena();
  drawHazards();
  drawDeepNodes();
  drawTear();
  drawTribunal();
  drawRootWorld();
  drawRootDeath();
  drawMirrorFloor();

  // --- additive layer: glows -------------------------------------------
  ctx.globalCompositeOperation = 'lighter';
  drawRings();
  drawGems();
  drawDrops();
  ctx.globalCompositeOperation = 'source-over';

  drawMortars();
  drawUnwritten();
  drawAmalgam();
  drawCages();
  drawPortals();
  drawLibraryPortal();
  drawCorpses();
  drawEnemies();
  drawSentries();
  drawKeyItem();
  if (state !== 'dead') drawPlayer();
  mpDrawCoopShip();          // the other pilot, whichever side you are on

  ctx.globalCompositeOperation = 'lighter';
  drawEBullets();
  drawBullets();
  drawArcs();
  drawBeams();
  drawFinaleBeams();
  drawDiary();
  drawLance();
  drawMalFx();
  drawParticles();
  ctx.globalCompositeOperation = 'source-over';

  drawFloats();
  ctx.restore();

  postWorld();          // bloom, chromatic split and grade, world layer only

  if (P.annotT > 0) {
    // a warm margin around the frame while the record is open
    ctx.save();
    ctx.globalAlpha = 0.5 + Math.sin(uiTime * 7) * 0.18;
    ctx.strokeStyle = '#fcd34d'; ctx.lineWidth = 2;
    ctx.strokeRect(3, 3, W - 6, H - 6);
    ctx.globalAlpha = 0.75;
    ctx.textAlign = 'center';
    ctx.font = "700 10px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = '#fcd34d';
    ctx.fillText('ANNOTATED   ' + P.annotT.toFixed(1) + 's', W / 2, 16);
    ctx.restore();
  }
  if (P.stopT > 0) {
    // everything but you is held still; say so without hiding the room
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(88,28,135,0.16)';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.5 + Math.sin(uiTime * 9) * 0.2;
    ctx.strokeStyle = '#f0abfc'; ctx.lineWidth = 2;
    ctx.strokeRect(3, 3, W - 6, H - 6);
    ctx.restore();
  }
  drawVignette();
  if (drawFlashT > 0) {
    ctx.fillStyle = `rgba(255,255,255,${drawFlashT * 2.4})`;
    ctx.fillRect(0, 0, W, H);
  }
  drawChalFog();      // over the world, under everything you need to read
  drawHUD();
  mpDrawHud();
  drawChalHud();
  drawHackHud();
  drawRootCmdHud();
  drawHaltBar();
  drawRoot();
  drawIntrusion();
  drawBetaMark();
  drawFreeplay();
  drawUnwrittenOverlay();
  drawLibraryPointer();
  if (isTouch && state === 'play') drawTouchSticks();
  if (state === 'levelup') drawLevelUp();
  if (state === 'shop') drawShop();
  if (state === 'planet') drawPlanetarium();
  if (state === 'library') drawLibrary();
  if (state === 'talk') drawTalk();
  if (state === 'devtalk') drawDevTalk();
  if (amalOpen) drawAmalOpen();
  if (campVisit) drawCampVisit();
  if (choice) drawChoice();
  if (rootOut) drawRootOutro();
  if (outro) drawOutro();
  if (state === 'amalcut') drawAmalCutText();
  if (state === 'gfx') drawGfx();
  if (state === 'settings') drawSettings();
  if (state === 'pause') drawPause();
  if (state === 'codex') drawCodex();
  if (state === 'dead') drawDead();
  if (!isTouch && state === 'play') drawCrosshair();
  // every other screen has no system cursor either, so it carries the pointer
  if (!isTouch && UI_CURSOR_STATES.includes(state)) drawUICursor(lastDT);

  postScreen();         // vignette, scanlines and grain over the finished frame
}

/* ------------------------- terrain & deployables -------------------------- */
function drawHazards() {
  for (const h of hazards) {
    const fade = (h.kind === 'vent' || h.kind === 'well')
      ? 1 : clamp(h.life / Math.min(1.4, h.max), 0, 1);
    switch (h.kind) {
      case 'fire':
      case 'acid': {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        drawGlow(h.x, h.y, h.r * 1.15, h.col, 0.22 * fade);
        ctx.restore();
        ctx.save();
        ctx.globalAlpha = 0.5 * fade;
        ctx.strokeStyle = h.col; ctx.lineWidth = 2;
        ctx.setLineDash([8, 7]);
        ctx.lineDashOffset = -uiTime * (h.kind === 'acid' ? 9 : 24);
        ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, TAU); ctx.stroke();
        ctx.restore();
        break;
      }
      case 'vent': {
        const tel = h.state === 1, erupt = h.state === 2;
        ctx.save();
        ctx.globalAlpha = erupt ? 0.95 : tel ? 0.45 + Math.sin(uiTime * 26) * 0.35 : 0.2;
        ctx.strokeStyle = erupt ? '#fed7aa' : '#f97316';
        ctx.lineWidth = erupt ? 5 : 2;
        ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, TAU); ctx.stroke();
        poly(h.x, h.y, h.r * 0.42, 6, uiTime * 0.5); ctx.stroke();
        ctx.restore();
        if (erupt) {
          ctx.save(); ctx.globalCompositeOperation = 'lighter';
          drawGlow(h.x, h.y, h.r * 1.7, '#fb923c', 0.75); ctx.restore();
        }
        break;
      }
      case 'laser': {
        const dxl = Math.cos(h.ang), dyl = Math.sin(h.ang), L = 4000;
        const nxl = -dyl, nyl = dxl;
        const beam = off => {
          const ox = nxl * (off || 0), oy = nyl * (off || 0);
          ctx.beginPath();
          ctx.moveTo(h.x - dxl * L + ox, h.y - dyl * L + oy);
          ctx.lineTo(h.x + dxl * L + ox, h.y + dyl * L + oy);
          ctx.stroke();
        };
        ctx.save();
        ctx.lineCap = 'butt';
        ctx.globalCompositeOperation = 'lighter';
        if (h.state === 0) {
          /* Telegraph. The emitter spins up and the two rails close on the
             line it is about to take, so the second before it fires reads as a
             machine committing rather than a dashed line blinking. */
          const u = clamp(h.t, 0, 1);
          ctx.globalAlpha = 0.22 + u * 0.34;
          ctx.strokeStyle = h.col; ctx.lineWidth = 1;
          ctx.setLineDash([15, 11]); ctx.lineDashOffset = -uiTime * 90;
          beam(0);
          ctx.setLineDash([]);
          ctx.globalAlpha = 0.18 + u * 0.5;
          ctx.lineWidth = 1.4;
          beam(LASER_HALF * (1 - u * 0.7));
          beam(-LASER_HALF * (1 - u * 0.7));
          ctx.globalAlpha = 0.5 + u * 0.4;
          ctx.lineWidth = 1.8;
          for (const sd of [0, Math.PI]) {
            ctx.beginPath();
            ctx.arc(h.x, h.y, 26 - u * 13, uiTime * 6 + sd, uiTime * 6 + sd + 2.1);
            ctx.stroke();
          }
          drawGlow(h.x, h.y, 11 + u * 26, h.col, 0.22 + u * 0.5);
        } else {
          const a = clamp((1.55 - h.t) * 3.2, 0, 1);
          const fire = clamp((h.t - 1.0) * 14, 0, 1);      // the opening snap
          ctx.globalAlpha = a * 0.32;
          ctx.strokeStyle = h.col;
          ctx.lineWidth = LASER_HALF * 2 * (0.55 + fire * 0.45);
          beam(0);
          ctx.globalAlpha = a;
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 14 * (0.35 + fire * 0.65);
          beam(0);
          // rails on the exact edges of the band that hits
          ctx.globalAlpha = a * 0.7;
          ctx.strokeStyle = h.col; ctx.lineWidth = 2;
          beam(LASER_HALF); beam(-LASER_HALF);
          // charge running down it, so a held beam is not a painted bar
          ctx.globalAlpha = a * 0.3;
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.4;
          ctx.setLineDash([34, 230]);
          ctx.lineDashOffset = -uiTime * 1400; beam(LASER_HALF * 0.62);
          ctx.lineDashOffset = -uiTime * 1100 - 120; beam(-LASER_HALF * 0.62);
          ctx.setLineDash([]);
          drawGlow(h.x, h.y, 36 + fire * 56, '#ffffff', a * 0.65);
          if (FXO.parts && Math.random() < 0.5) {
            const d = rnd(700, -700);
            spawnPart(h.x + dxl * d, h.y + dyl * d,
                      nxl * rnd(130, -130), nyl * rnd(130, -130),
                      rnd(2.6, 1.2), h.col, rnd(0.35, 0.15), 0.9);
          }
        }
        ctx.restore();
        break;
      }
      case 'current': {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        drawGlow(h.x, h.y, h.r * 1.1, h.col, 0.22 * fade);
        ctx.globalAlpha = 0.5 * fade;
        ctx.strokeStyle = '#a5f3fc'; ctx.lineWidth = 1.4;
        for (let k = 0; k < 3; k++) {
          const a0 = uiTime * 3 + k * 2.1;
          ctx.beginPath();
          ctx.arc(h.x, h.y, h.r * (0.4 + k * 0.28), a0, a0 + 2.2);
          ctx.stroke();
        }
        ctx.restore();
        break;
      }
      case 'delete': {
        // a band that blinks out of reality on a fixed rhythm
        const on = h.state === 1;
        ctx.save();
        ctx.globalAlpha = on ? 0.85 : 0.28 + Math.sin(uiTime * 18) * 0.1;
        ctx.strokeStyle = on ? '#fca5a5' : '#7f1d1d';
        ctx.lineWidth = on ? 3 : 1.6;
        ctx.setLineDash(on ? [] : [10, 8]);
        ctx.strokeRect(h.x - h.r, h.y - h.r * 0.55, h.r * 2, h.r * 1.1);
        if (on) {
          ctx.globalAlpha = 0.16;
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(h.x - h.r, h.y - h.r * 0.55, h.r * 2, h.r * 1.1);
          for (let k = 0; k < 5; k++) {
            const yy = h.y - h.r * 0.55 + Math.random() * h.r * 1.1;
            ctx.globalAlpha = 0.5;
            ctx.fillStyle = '#fecaca';
            ctx.fillRect(h.x - h.r, yy, h.r * 2, 1.2);
          }
        }
        ctx.restore();
        break;
      }
      case 'mirror': {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        drawGlow(h.x, h.y, h.r * (h.flying ? 1.7 : 1.2), '#5eead4', h.flying ? 0.4 : 0.16);
        ctx.restore();
        if (h.embedded) {
          const fresh = clamp(1 - (h.embT || 0) / 0.7, 0, 1);
          const pulse = 0.72 + Math.sin(uiTime * 3.4 + h.x * 0.01) * 0.28;
          const nx = h.wallNx || 0, ny = h.wallNy || 0;
          // torn hole punched through the wall behind it
          ctx.save();
          ctx.globalAlpha = 0.9;
          ctx.fillStyle = '#02100f';
          ctx.beginPath();
          for (let k = 0; k < 9; k++) {
            const a = k / 9 * TAU;
            const rr = h.r * (0.95 + Math.sin(k * 2.7 + h.y * 0.02) * 0.3);
            const px = h.x + Math.cos(a) * rr, py = h.y + Math.sin(a) * rr;
            k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
          }
          ctx.closePath(); ctx.fill();
          ctx.restore();
          // fractures crawling away across the wall face
          ctx.save();
          ctx.lineCap = 'round';
          ctx.globalCompositeOperation = 'lighter';
          for (let ci = 0; ci < h.cracks.length; ci++) {
            const c = h.cracks[ci];
            const fade = 1 - ci / (h.cracks.length + 2);
            const trace = () => {
              ctx.beginPath(); ctx.moveTo(h.x, h.y);
              for (const pt of c) ctx.lineTo(h.x + pt[0], h.y + pt[1]);
              ctx.stroke();
            };
            ctx.globalAlpha = (0.30 + fresh * 0.45) * fade;
            ctx.strokeStyle = '#5eead4';
            ctx.lineWidth = 5.5 - ci * 0.4;
            trace();                                   // bloom around the split
            ctx.globalAlpha = (0.55 + fresh * 0.45) * fade;
            ctx.strokeStyle = '#ccfbf1';
            ctx.lineWidth = 1.8 - ci * 0.14;
            trace();                                   // hot filament inside it
          }
          ctx.restore();
          // heat bleeding out of the wound, hottest right after impact
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          drawGlow(h.x, h.y, h.r * (2.3 + fresh * 2.2) * pulse, '#5eead4', 0.3 + fresh * 0.4);
          drawGlow(h.x, h.y, h.r * (0.85 + fresh * 0.9), '#ffffff', 0.45 * pulse + fresh * 0.4);
          drawGlow(h.x - nx * h.r * 0.5, h.y - ny * h.r * 0.5,
                   h.r * 1.5 * pulse, '#ffffff', 0.22);
          ctx.restore();
          // the shard itself, buried at the angle it arrived on
          ctx.save();
          ctx.translate(h.x, h.y); ctx.rotate(h.impactAng || 0);
          ctx.globalAlpha = 0.3;
          ctx.fillStyle = '#0f3d3d';
          poly(0, 0, h.r, 6, 0); ctx.fill();
          ctx.globalAlpha = 0.95;
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
          poly(0, 0, h.r, 6, 0); ctx.stroke();
          ctx.globalAlpha = 0.55;
          ctx.strokeStyle = '#5eead4'; ctx.lineWidth = 1.6;
          for (let k = -2; k <= 2; k++) {
            const o = k * h.r * 0.36;
            ctx.beginPath();
            ctx.moveTo(o - h.r * 0.45, h.r * 0.45);
            ctx.lineTo(o + h.r * 0.45, -h.r * 0.45);
            ctx.stroke();
          }
          ctx.restore();
          break;
        }
        if (h.flying) {
          // lethal in flight: a hard white rim and a motion streak
          const sp = Math.hypot(h.vx, h.vy) || 1;
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = 'rgba(153,246,228,0.5)';
          ctx.lineWidth = h.r * 1.5; ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(h.x, h.y);
          ctx.lineTo(h.x - h.vx / sp * 90, h.y - h.vy / sp * 90);
          ctx.stroke();
          ctx.restore();
          ctx.save();
          ctx.translate(h.x, h.y); ctx.rotate(h.rot || 0);
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
          ctx.fillStyle = 'rgba(94,234,212,0.35)';
          poly(0, 0, h.r, 6, 0); ctx.fill(); ctx.stroke();
          ctx.strokeStyle = '#5eead4'; ctx.lineWidth = 2;
          poly(0, 0, h.r * 0.55, 6, 0.5); ctx.stroke();
          ctx.restore();
          break;
        }
        ctx.save();
        ctx.globalAlpha = 0.7;
        ctx.strokeStyle = '#5eead4'; ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, TAU); ctx.stroke();
        ctx.globalAlpha = 0.24;
        ctx.fillStyle = '#0f3d3d';
        ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, TAU); ctx.fill();
        ctx.globalAlpha = 0.9;
        ctx.strokeStyle = '#99f6e4'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, TAU); ctx.stroke();
        ctx.globalAlpha = 0.5;
        ctx.lineWidth = 1.2;
        for (let k = -2; k <= 2; k++) {
          const o = k * h.r * 0.36;
          ctx.beginPath();
          ctx.moveTo(h.x + o - h.r * 0.5, h.y + h.r * 0.5);
          ctx.lineTo(h.x + o + h.r * 0.5, h.y - h.r * 0.5);
          ctx.stroke();
        }
        ctx.restore();
        break;
      }
      case 'well': {
        ctx.save();
        ctx.globalAlpha = 0.18;
        ctx.strokeStyle = h.col; ctx.lineWidth = 1.5;
        for (let k = 1; k <= 3; k++) {
          ctx.beginPath();
          ctx.arc(h.x, h.y, h.r * k / 3 * (0.9 + Math.sin(uiTime * 1.4 + k) * 0.07), 0, TAU);
          ctx.stroke();
        }
        ctx.restore();
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        drawGlow(h.x, h.y, 48, h.col, 0.4); ctx.restore();
        break;
      }
    }
  }
}

function drawPortals() {
  for (const p of portals) {
    const col = p.def.accent;
    const alt = p.kind === 'alt';
    const armed = p.arm <= 0;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(p.x, p.y, p.r * 2.4, col, armed ? 0.5 : 0.22);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = armed ? 1 : 0.45;
    // a stack of counter-rotating rings; the alt gate is jagged and unstable
    for (let k = 0; k < 4; k++) {
      const rr = p.r * (1 - k * 0.19);
      const spin = p.t * (k % 2 ? -1.1 : 1.4) + k;
      ctx.strokeStyle = rgba(col, 0.85 - k * 0.15);
      ctx.lineWidth = 2.4 - k * 0.4;
      if (alt) { poly(p.x, p.y, rr, 3 + k * 2, spin); ctx.stroke(); }
      else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, rr, spin, spin + 4.4);
        ctx.stroke();
      }
    }
    ctx.fillStyle = rgba(col, 0.14);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.62, 0, TAU); ctx.fill();
    ctx.restore();

    // label the destination so the choice is informed
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = "700 9px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = alt ? '#f87171' : '#64748b';
    ctx.fillText(alt ? 'THE FRACTURE' : 'ONWARD', p.x, p.y - p.r - 30);
    ctx.font = "800 15px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = col;
    ctx.fillText(p.def.name, p.x, p.y - p.r - 14);
    ctx.restore();
  }
}

/* A screen-space marker so an open library can never be walked past. It sits
   on the door when the door is visible, and pins to the screen edge pointing
   at it when it is not. */
function drawLibraryPointer() {
  const L = libraryPortal;
  if (!L || (state !== 'play' && state !== 'pause')) return;
  const sx = (L.x - cam.x) * camZoom + W / 2 + cam.sx;
  const sy = (L.y - cam.y) * camZoom + H / 2 + cam.sy;
  const m = 54;
  const mal = L.kind === 'malware';
  const pcol = mal ? MAL_COL : '#fcd34d';
  const label = mal ? 'MALWARE' : 'LIBRARY';
  const onScreenNow = sx > m && sx < W - m && sy > m && sy < H - m;
  const pulse = 0.62 + Math.sin(uiTime * 4.2) * 0.38;
  ctx.save();
  ctx.textAlign = 'center';
  if (onScreenNow) {
    ctx.globalAlpha = pulse * 0.9;
    ctx.fillStyle = pcol;
    ctx.font = "700 10px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillText(label, sx, sy - L.r - 16);
  } else {
    const px = clamp(sx, m, W - m), py = clamp(sy, m, H - m);
    // a zero delta on one axis is correct here — the marker is pinned to that
    // edge and should point straight along it, so don't ||-fallback it away
    let dx = sx - px, dy = sy - py;
    if (!dx && !dy) { dx = sx - W / 2; dy = sy - H / 2; }
    const a = Math.atan2(dy, dx);
    ctx.globalAlpha = pulse;
    ctx.translate(px, py);
    ctx.rotate(a);
    ctx.fillStyle = pcol;
    ctx.beginPath();
    ctx.moveTo(16, 0); ctx.lineTo(-10, 9); ctx.lineTo(-5, 0); ctx.lineTo(-10, -9);
    ctx.closePath(); ctx.fill();
    ctx.rotate(-a);
    ctx.globalAlpha = pulse * 0.85;
    ctx.font = "700 9px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillText(label, 0, 26);
  }
  ctx.restore();
}

function drawLibraryPortal() {
  const L = libraryPortal;
  if (!L) return;
  const mal = L.kind === 'malware';
  const pcol = mal ? MAL_COL : '#fcd34d';
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(L.x, L.y, L.r * 2.6, pcol, L.arm <= 0 ? 0.5 : 0.25);
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = L.arm <= 0 ? 1 : 0.5;
  // a doorway of stacked frames, turning slowly — jagged when it is infected
  for (let k = 0; k < 3; k++) {
    const rr = L.r * (1 - k * 0.22);
    ctx.strokeStyle = rgba(pcol, 0.85 - k * 0.2);
    ctx.lineWidth = 2.6 - k * 0.5;
    poly(L.x, L.y, rr, mal ? 3 + k : 4, L.t * (k % 2 ? -0.6 : 0.8) * (mal ? 2.2 : 1) + k * 0.4);
    ctx.stroke();
  }
  if (mal) {
    // a broken glyph where the book would be
    ctx.strokeStyle = '#fecaca'; ctx.lineWidth = 2.6;
    ctx.beginPath();
    for (let k = 0; k < 5; k++) {
      const a = L.t * 1.4 + k * TAU / 5;
      ctx.moveTo(L.x, L.y);
      ctx.lineTo(L.x + Math.cos(a) * 17, L.y + Math.sin(a) * 17);
    }
    ctx.stroke();
    if (Math.random() < 0.4)
      spawnPart(L.x + rnd(L.r, -L.r), L.y + rnd(L.r, -L.r), rnd(90, -90), rnd(90, -90),
                rnd(4, 2), MAL_COL, rnd(0.4, 0.2), 0.92);
  } else {
    // an open book at the centre
    ctx.strokeStyle = '#fef3c7'; ctx.lineWidth = 2.4;
    ctx.fillStyle = 'rgba(252,211,77,0.18)';
    ctx.beginPath();
    ctx.moveTo(L.x - 18, L.y + 10);
    ctx.quadraticCurveTo(L.x, L.y + 2, L.x, L.y + 8);
    ctx.quadraticCurveTo(L.x, L.y + 2, L.x + 18, L.y + 10);
    ctx.lineTo(L.x + 18, L.y - 8);
    ctx.quadraticCurveTo(L.x, L.y - 16, L.x, L.y - 10);
    ctx.quadraticCurveTo(L.x, L.y - 16, L.x - 18, L.y - 8);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();

  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = "700 9px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = mal ? '#7f1d1d' : '#a16207';
  ctx.fillText(mal ? 'MALWARE' : 'LIBRARY', L.x, L.y - L.r - 30);
  ctx.font = "800 14px Barlow, 'Segoe UI', system-ui, sans-serif";
  if (mal) {
    ctx.fillStyle = L.mal ? L.mal.col : MAL_COL;
    ctx.fillText(L.mal ? L.mal.n : 'A PAYLOAD', L.x, L.y - L.r - 14);
  } else {
    const bk = BOOKS[L.boss];
    ctx.fillStyle = bk ? bk.col : '#fcd34d';
    ctx.fillText(bk ? bk.n : 'A BOOK', L.x, L.y - L.r - 14);
  }
  ctx.restore();
}

/* THE UNWRITTEN is a page, so it is drawn as one instead of as a white
   polygon: two halves of a single sheet, torn apart, each with its ruled
   lines printed and nothing written on them. The tear always faces its twin
   — that is what makes the pair read as one sheet pulled in two rather than
   as two enemies that happen to be linked. */
const UNW_PAPER = '#f8fafc', UNW_RULE = '#94a3b8';

function unwTearPts(sign, w, h, phase) {
  const pts = [];
  const N = 11;
  for (let k = 0; k <= N; k++) {
    const t = k / N;
    const jag = Math.sin(t * 13 + phase) * w * 0.15 + Math.sin(t * 31 + phase * 1.7) * w * 0.07;
    pts.push({ x: sign * (w * 0.7 + jag), y: h - 2 * h * t });
  }
  return pts;
}

function unwSheetPath(pts, sign, w, h) {
  ctx.beginPath();
  ctx.moveTo(-sign * w, -h);
  ctx.lineTo(-sign * w, h);
  for (const p of pts) ctx.lineTo(p.x, p.y);
  ctx.closePath();
}

function unwSheet(e, u, open) {
  const sign = -(e.unwSide || -1);          // the tear faces the other half
  const w = e.r * 0.84, h = e.r * 1.16;
  const phase = (e.unwSide || 0) * 2.1;
  const flash = clamp(e.flash || 0, 0, 1);
  const pts = unwTearPts(sign, w, h, phase);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(e.x, e.y, e.r * 2.4, UNW_COL, 0.20 + flash * 0.3);
  if (open > 0) drawGlow(e.x, e.y, e.r * 2.8, UNW_INK, 0.4 * (open / LINK_HEAL));
  ctx.restore();

  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(Math.sin(uiTime * 0.7 + phase) * 0.05);

  // it floats a little off the floor, and casts onto it
  ctx.save();
  ctx.globalAlpha = 0.4; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0, h + 18, w * 1.1, 9, 0, 0, TAU); ctx.fill();
  ctx.restore();

  unwSheetPath(pts, sign, w, h);
  const g = ctx.createLinearGradient(0, -h, 0, h);
  g.addColorStop(0, UNW_PAPER);
  g.addColorStop(1, '#aeb6c2');
  ctx.fillStyle = g; ctx.fill();

  ctx.save();
  unwSheetPath(pts, sign, w, h); ctx.clip();
  const rows = 9;
  // the rules are printed. Nothing is on them; that is the whole entry.
  ctx.strokeStyle = rgba(UNW_RULE, 0.45); ctx.lineWidth = 1;
  for (let k = 1; k < rows; k++) {
    const y = -h + 2 * h * k / rows;
    ctx.beginPath(); ctx.moveTo(-w * 1.1, y); ctx.lineTo(w * 1.1, y); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(248,113,113,0.38)'; ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(-sign * w * 0.58, -h); ctx.lineTo(-sign * w * 0.58, h);
  ctx.stroke();

  /* Your own build, written back at you: one line of ink per card it has
     copied, so the page filling up IS the fight getting harder. */
  const cop = Object.keys(u.ups || {}).length;
  ctx.strokeStyle = rgba(UNW_INK, 0.9); ctx.lineWidth = 2;
  for (let k = 0; k < Math.min(cop, rows - 1); k++) {
    const y = -h + 2 * h * (k + 1) / rows - 2.5;
    const x0 = -sign * w * 0.44, x1 = lerp(x0, sign * w * 0.9, 0.5 + ((k * 7) % 5) / 10);
    ctx.beginPath();
    for (let i = 0; i <= 14; i++) {
      const t = i / 14, xx = lerp(x0, x1, t), yy = y + Math.sin(t * 24 + k * 2.3) * 1.7;
      i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
    }
    ctx.stroke();
  }

  // opened: a gash across the page with ink running out of it
  if (open > 0) {
    const p = clamp(open / LINK_HEAL, 0, 1);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const slit = () => {
      ctx.beginPath();
      for (let i = 0; i <= 8; i++) {
        const t = i / 8;
        const gx = lerp(-w * 0.5, w * 0.44, t) + Math.sin(t * 17 + phase) * w * 0.06;
        const gy = lerp(-h * 0.32, h * 0.36, t) + Math.sin(t * 11 + phase) * h * 0.05;
        i ? ctx.lineTo(gx, gy) : ctx.moveTo(gx, gy);
      }
      ctx.stroke();
    };
    ctx.strokeStyle = 'rgba(9,7,20,0.85)'; ctx.lineWidth = 1.6 + p * 3;
    slit();
    ctx.strokeStyle = rgba(UNW_INK, 0.8 * p); ctx.lineWidth = 1.2;
    slit();
    for (let k = 0; k < 4; k++) {
      const t = 0.2 + k * 0.2;
      const bx = lerp(-w * 0.52, w * 0.46, t), by = lerp(-h * 0.34, h * 0.38, t);
      ctx.strokeStyle = rgba(UNW_INK, 0.5 * p); ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(bx + Math.sin(k * 2.1) * 3, by + h * 0.5 * p);
      ctx.stroke();
    }
  }
  if (flash > 0.02) {
    ctx.fillStyle = rgba('#ffffff', flash * 0.75);
    ctx.fillRect(-w * 1.3, -h * 1.3, w * 2.6, h * 2.6);
  }
  ctx.restore();                                  // end clip

  // the cut edges are clean; the tear is not
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(-sign * w, -h); ctx.lineTo(-sign * w, h);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(226,232,240,0.9)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (const p of pts) ctx.lineTo(p.x, p.y);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(203,213,225,0.75)'; ctx.lineWidth = 1;
  for (let k = 0; k < pts.length; k++) {
    const p = pts[k], L = 3 + ((k * 5) % 4) * 1.6;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + sign * L, p.y + Math.sin(k * 2.7) * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawUnwritten() {
  const u = unwritten;
  if (!u) return;

  // the torn page: warning first, then a hole with nothing in it
  for (const t of unwTears) {
    const rc = unwCellRect(t.c, t.r);
    ctx.save();
    if (t.warn > 0) {
      const p = 1 - t.warn / 1.1;
      ctx.globalAlpha = 0.25 + p * 0.35;
      ctx.strokeStyle = UNW_INK; ctx.lineWidth = 2;
      ctx.setLineDash([9, 7]); ctx.lineDashOffset = -uiTime * 30;
      ctx.strokeRect(rc.x + 2, rc.y + 2, rc.w - 4, rc.h - 4);
      ctx.setLineDash([]);
      ctx.globalAlpha = 0.1 * p;
      ctx.fillStyle = UNW_INK;
      ctx.fillRect(rc.x, rc.y, rc.w, rc.h);
    } else {
      /* A lethal hole has to be unmistakable against a dark floor, so it is not
         just black: it gets a bright torn rim, an inner falloff and a hatch. */
      const fade = clamp(t.life / 1.2, 0, 1);
      ctx.globalAlpha = fade;
      ctx.fillStyle = '#000';
      ctx.fillRect(rc.x, rc.y, rc.w, rc.h);
      // inner falloff, so the edge reads even where the floor is nearly black
      const gr = ctx.createLinearGradient(rc.x, rc.y, rc.x, rc.y + rc.h);
      gr.addColorStop(0, 'rgba(168,85,247,0.30)');
      gr.addColorStop(0.35, 'rgba(0,0,0,0)');
      gr.addColorStop(0.65, 'rgba(0,0,0,0)');
      gr.addColorStop(1, 'rgba(168,85,247,0.30)');
      ctx.fillStyle = gr;
      ctx.fillRect(rc.x, rc.y, rc.w, rc.h);
      // torn fibres across the gap
      ctx.globalAlpha = 0.28 * fade;
      ctx.strokeStyle = UNW_INK; ctx.lineWidth = 1;
      for (let k = 1; k < 5; k++) {
        const yy = rc.y + (rc.h * k) / 5;
        ctx.beginPath();
        ctx.moveTo(rc.x + 3, yy + Math.sin(k * 2.1 + t.c) * 3);
        ctx.lineTo(rc.x + rc.w - 3, yy + Math.sin(k * 3.3 + t.r) * 3);
        ctx.stroke();
      }
      // ragged rim, all four sides
      ctx.globalAlpha = fade;
      ctx.strokeStyle = '#c084fc'; ctx.lineWidth = 3;
      ctx.beginPath();
      const step = 12;
      for (let x = rc.x; x <= rc.x + rc.w; x += step)
        ctx[x === rc.x ? 'moveTo' : 'lineTo'](x, rc.y + Math.sin((x + t.c * 37) * 0.13) * 4);
      for (let y = rc.y; y <= rc.y + rc.h; y += step)
        ctx.lineTo(rc.x + rc.w + Math.sin((y + t.r * 41) * 0.13) * 4, y);
      for (let x = rc.x + rc.w; x >= rc.x; x -= step)
        ctx.lineTo(x, rc.y + rc.h + Math.sin((x + t.r * 53) * 0.13) * 4);
      for (let y = rc.y + rc.h; y >= rc.y; y -= step)
        ctx.lineTo(rc.x + Math.sin((y + t.c * 29) * 0.13) * 4, y);
      ctx.closePath(); ctx.stroke();
    }
    ctx.restore();
  }

  if (!u.a || !u.b || u.a.dead || u.b.dead) return;

  /* The seam: the tear the two halves were pulled apart along, held open
     between them. It is not a straight line — it is the same ragged edge both
     pages carry, stretched across the gap, pinned at each body and slack in the
     middle. In the last phase ink runs down it and it cuts. Displacement is
     driven by sin, not random, so it drifts instead of strobing. */
  const lethal = u.phase >= 1;
  const seam = [];
  {
    const dx = u.b.x - u.a.x, dy = u.b.y - u.a.y, L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L, N = 18;
    for (let k = 0; k <= N; k++) {
      const t = k / N, env = Math.sin(t * Math.PI);
      const off = (Math.sin(t * 9.1 + uiTime * 0.6) * 9 +
                   Math.sin(t * 23 + uiTime * 1.1) * 4) * env;
      seam.push({ x: lerp(u.a.x, u.b.x, t) + nx * off,
                  y: lerp(u.a.y, u.b.y, t) + ny * off,
                  nx, ny, env });
    }
  }
  const traceSeam = () => {
    ctx.beginPath();
    ctx.moveTo(seam[0].x, seam[0].y);
    for (const p of seam) ctx.lineTo(p.x, p.y);
    ctx.stroke();
  };
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = rgba(lethal ? UNW_INK : UNW_COL, lethal ? 0.22 : 0.1);
  ctx.lineWidth = lethal ? 13 : 6;
  traceSeam();
  ctx.strokeStyle = rgba(lethal ? UNW_INK : '#94a3b8', lethal ? 0.85 : 0.45);
  ctx.lineWidth = lethal ? 4 : 1.6;
  traceSeam();
  if (lethal) {
    ctx.strokeStyle = rgba('#ffffff', 0.5 + Math.sin(uiTime * 9) * 0.25);
    ctx.lineWidth = 1.4;
    traceSeam();
  }
  // torn fibres bridging the gap, thinning toward the middle
  ctx.lineWidth = 1;
  for (let k = 1; k < seam.length - 1; k += 2) {
    const p = seam[k], L = 7 * (1 - p.env * 0.7);
    ctx.strokeStyle = rgba(UNW_COL, 0.4 * (1 - p.env * 0.6));
    ctx.beginPath();
    ctx.moveTo(p.x - p.nx * L, p.y - p.ny * L);
    ctx.lineTo(p.x + p.nx * L, p.y + p.ny * L);
    ctx.stroke();
  }
  // banked damage runs along the seam looking for the other half
  if (u.pending > 0) {
    ctx.strokeStyle = rgba(UNW_INK, 0.9); ctx.lineWidth = 2.6;
    ctx.setLineDash([10, 26]); ctx.lineDashOffset = -uiTime * 320;
    traceSeam();
    ctx.setLineDash([]);
  }
  ctx.restore();
  // untouched, it stitches itself shut: sutures pull in across the seam
  if (u.touchT > UNW_UNTOUCHED) {
    const c = clamp((u.touchT - UNW_UNTOUCHED) / 2, 0, 1);
    ctx.save();
    ctx.strokeStyle = rgba(UNW_COL, 0.35 + c * 0.5);
    ctx.lineWidth = 1.6;
    for (let k = 2; k < seam.length - 2; k += 3) {
      const p = seam[k], L = 12 * (1 - c * 0.65);
      ctx.beginPath();
      ctx.moveTo(p.x - p.nx * L - p.ny * 5, p.y - p.ny * L + p.nx * 5);
      ctx.lineTo(p.x + p.nx * L + p.ny * 5, p.y + p.ny * L - p.nx * 5);
      ctx.moveTo(p.x - p.nx * L + p.ny * 5, p.y - p.ny * L - p.nx * 5);
      ctx.lineTo(p.x + p.nx * L - p.ny * 5, p.y + p.ny * L + p.nx * 5);
      ctx.stroke();
    }
    ctx.restore();
  }

  // the two halves, each carrying its own tear and whatever is inked on it
  unwSheet(u.a, u, u.aHitT);
  unwSheet(u.b, u, u.bHitT);
  // ink shed from a half that is currently open
  if (FXO.parts)
    for (const [e, open] of [[u.a, u.aHitT], [u.b, u.bHitT]]) {
      if (open <= 0 || Math.random() > 0.4) continue;
      spawnPart(e.x + rnd(e.r * 0.6, -e.r * 0.6), e.y + rnd(e.r, 0),
                rnd(20, -20), rnd(70, 20), rnd(2.4, 1.1), UNW_INK, rnd(0.5, 0.2), 0.94);
    }

  const mx = (u.a.x + u.b.x) / 2, my = (u.a.y + u.b.y) / 2;
  if (u.touchT > UNW_UNTOUCHED) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = "700 11px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = UNW_COL;
    ctx.globalAlpha = 0.55 + Math.sin(uiTime * 6) * 0.35;
    ctx.fillText('CLOSING', mx, my + 34);
    ctx.restore();
  }
  // banked damage: an ink blot on the seam, with the figure held in it
  if (u.pending > 0) {
    ctx.save();
    ctx.textAlign = 'center';
    const bob = Math.sin(uiTime * 8) * 0.12;
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(mx, my - 22, 34, UNW_INK, 0.3 + bob);
    ctx.restore();
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(12,8,28,0.85)';
    ctx.beginPath(); ctx.ellipse(mx, my - 24, 47, 18, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba(UNW_INK, 0.75); ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.ellipse(mx, my - 24, 47, 18, 0, 0, TAU); ctx.stroke();
    ctx.font = "700 8px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = rgba(UNW_COL, 0.75);
    ctx.fillText('HELD', mx, my - 28);
    ctx.font = "700 12px 'JetBrains Mono', ui-monospace, monospace";
    ctx.fillStyle = UNW_INK;
    ctx.fillText(String(Math.round(u.pending)), mx, my - 16);
    ctx.restore();
  }
}

function drawUnwrittenOverlay() {
  if (unwDeadT <= 0) return;
  const p = clamp(1 - unwDeadT / 2.0, 0, 1);
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,' + (0.55 + p * 0.4) + ')';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const al = clamp(p * 2.2, 0, 1);
  const fs = Math.min(40, W * 0.045);
  ctx.globalAlpha = al;
  ctx.font = '800 ' + fs + 'px Barlow, system-ui, sans-serif';
  ctx.fillStyle = UNW_COL;
  const msg = 'you don’t get to give up yet.';
  ctx.fillText(msg, W / 2, H / 2);
  // written on a rule, and the attempt goes on the record
  const tw = ctx.measureText(msg).width;
  ctx.globalAlpha = al * 0.45;
  ctx.strokeStyle = UNW_RULE; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W / 2 - tw / 2, H / 2 + fs * 0.78);
  ctx.lineTo(W / 2 + tw / 2, H / 2 + fs * 0.78);
  ctx.stroke();
  ctx.globalAlpha = al * 0.8;
  ctx.font = "600 " + Math.round(Math.max(11, fs * 0.34)) + "px 'JetBrains Mono', ui-monospace, monospace";
  ctx.fillStyle = UNW_INK;
  ctx.fillText('ATTEMPT ' + String((Save.profile.unwrittenDeaths || 0) + 1).padStart(2, '0'),
               W / 2, H / 2 + fs * 1.5);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

/* The pieces draw themselves as the bosses they were. This is the scaffolding
   that makes them read as one body: spine, ribs and the struts holding the
   limbs on. During the cutscene it also draws the pieces still in flight. */
const AMAL_BONES = [['head','spine',20], ['spine','torso',34], ['spine','shldL',18],
                    ['spine','shldR',18], ['shldL','armL',26], ['shldR','armR',26],
                    ['torso','legL',30], ['torso','legR',30]];
const STEEL_D = '#1c1917', STEEL = '#44403c', STEEL_L = '#8b8378', WELD = '#fb923c';

/* A tapered armoured segment with a rim light, plating seams and a joint cap.
   This is the thing that stops it reading as a stick between two circles. */
function amalLimb(x1, y1, x2, y2, w1, w2, pist) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  const nx = -Math.sin(a), ny = Math.cos(a);
  const L = len(x2 - x1, y2 - y1) || 1;
  const quad = (o1, o2, fill) => {
    ctx.beginPath();
    ctx.moveTo(x1 + nx * o1, y1 + ny * o1);
    ctx.lineTo(x2 + nx * o2, y2 + ny * o2);
    ctx.lineTo(x2 - nx * o2, y2 - ny * o2);
    ctx.lineTo(x1 - nx * o1, y1 - ny * o1);
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
  };
  quad(w1, w2, STEEL_D);
  quad(w1 * 0.72, w2 * 0.72, STEEL);
  // rim light down one edge
  ctx.beginPath();
  ctx.moveTo(x1 + nx * w1 * 0.86, y1 + ny * w1 * 0.86);
  ctx.lineTo(x2 + nx * w2 * 0.86, y2 + ny * w2 * 0.86);
  ctx.strokeStyle = 'rgba(214,211,209,0.55)'; ctx.lineWidth = 2.2; ctx.stroke();
  /* A hydraulic run down the outer edge of an arm or a leg. Half the reason
     the frame reads as heavy is that you can see what is pushing it. */
  if (pist) {
    const o = (w1 + w2) * 0.5;
    const ax = lerp(x1, x2, 0.16) + nx * o,        ay = lerp(y1, y2, 0.16) + ny * o;
    const bx = lerp(x1, x2, 0.84) + nx * o * 0.78, by = lerp(y1, y2, 0.84) + ny * o * 0.78;
    ctx.lineCap = 'butt';
    ctx.strokeStyle = '#0c0a09'; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.strokeStyle = '#57534e'; ctx.lineWidth = 6.5;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(lerp(ax, bx, 0.52), lerp(ay, by, 0.52)); ctx.stroke();
    ctx.strokeStyle = STEEL_L; ctx.lineWidth = 2.8;
    ctx.beginPath(); ctx.moveTo(lerp(ax, bx, 0.46), lerp(ay, by, 0.46)); ctx.lineTo(bx, by); ctx.stroke();
    ctx.fillStyle = '#0c0a09';
    for (const q of [[ax, ay], [bx, by]]) {
      ctx.beginPath(); ctx.arc(q[0], q[1], 3.4, 0, TAU); ctx.fill();
    }
  }
  // plating seams
  ctx.strokeStyle = 'rgba(12,10,9,0.85)'; ctx.lineWidth = 1.6;
  const segs = Math.max(2, Math.round(L / 34));
  for (let k = 1; k < segs; k++) {
    const u = k / segs, w = lerp(w1, w2, u);
    const px = lerp(x1, x2, u), py = lerp(y1, y2, u);
    ctx.beginPath();
    ctx.moveTo(px + nx * w, py + ny * w);
    ctx.lineTo(px - nx * w, py - ny * w);
    ctx.stroke();
  }
}

// the ring of scrap a boss got welded into, plus the seam still cooling
/* Armour outlines, in units of the piece radius. +x always points outward from
   the body centreline, so the left side is drawn by mirroring x. Nothing here
   is round on purpose: the silhouette has to read as forged plate, and the only
   circle on a mounted piece is the small core lens at its middle. */
const AMAL_SHELL = {
  pauldron: [[-1.14,-0.50],[-0.30,-0.98],[0.66,-0.92],[1.30,-0.18],
             [1.16, 0.62],[0.42, 1.06],[-0.52, 0.96],[-1.06, 0.30]],
  gauntlet: [[-0.94,-0.96],[0.62,-1.10],[1.18,-0.52],[1.24, 0.34],
             [0.86, 1.02],[-0.62, 1.10],[-1.10, 0.42],[-1.06,-0.30]],
  greave:   [[-0.88,-1.10],[0.88,-1.10],[1.06,-0.20],[1.34, 0.66],
             [1.30, 1.14],[-1.30, 1.14],[-1.34, 0.66],[-1.06,-0.20]],
  helm:     [[-0.92,-0.30],[-0.60,-1.06],[0.60,-1.06],[0.92,-0.30],
             [0.86, 0.50],[0.40, 1.10],[-0.40, 1.10],[-0.86, 0.50]],
  spool:    [[-0.86,-1.06],[0.86,-1.06],[1.10,-0.34],[1.10, 0.34],
             [0.86, 1.06],[-0.86, 1.06],[-1.10, 0.34],[-1.10,-0.34]]
};

function shellPath(x, y, r, role, sx) {
  const pts = AMAL_SHELL[role];
  ctx.beginPath();
  for (let k = 0; k < pts.length; k++) {
    const px = x + pts[k][0] * r * sx, py = y + pts[k][1] * r;
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

// the armour a piece is bolted into: beveled plate, bolts, seams, battle damage
function amalCasing(x, y, r, role, sx, frac, flash) {
  const hurt = 1 - clamp(frac, 0, 1);
  ctx.save();

  // dropped shadow plate underneath, for thickness
  ctx.fillStyle = '#0a0908';
  shellPath(x + 5 * sx, y + 7, r, role, sx); ctx.fill();

  // the plate
  shellPath(x, y, r, role, sx);
  const g = ctx.createLinearGradient(x, y - r, x, y + r);
  g.addColorStop(0, STEEL);
  g.addColorStop(0.45, '#302c28');
  g.addColorStop(1, STEEL_D);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = STEEL_L; ctx.lineWidth = 2.6; ctx.stroke();

  // clip everything that follows to the plate so seams never spill
  ctx.save();
  shellPath(x, y, r, role, sx); ctx.clip();

  // lit top bevel
  ctx.strokeStyle = 'rgba(168,162,150,0.55)'; ctx.lineWidth = 5;
  shellPath(x, y + 5, r * 0.99, role, sx); ctx.stroke();

  // panel seams, laid out per role
  ctx.strokeStyle = 'rgba(12,10,9,0.75)'; ctx.lineWidth = 2.4;
  if (role === 'pauldron' || role === 'greave') {
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(x - r * 1.4 * sx, y + k * r * 0.42 + r * 0.1);
      ctx.lineTo(x + r * 1.4 * sx, y + k * r * 0.42 - r * 0.14);
      ctx.stroke();
    }
  } else if (role === 'gauntlet') {
    for (let k = -1; k <= 1; k++) {      // knuckle ridges on the outer edge
      ctx.beginPath();
      ctx.moveTo(x + r * 0.34 * sx, y + k * r * 0.5);
      ctx.lineTo(x + r * 1.4 * sx, y + k * r * 0.5);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(x + r * 0.34 * sx, y - r * 1.2);
    ctx.lineTo(x + r * 0.34 * sx, y + r * 1.2);
    ctx.stroke();
  } else if (role === 'helm') {
    ctx.beginPath();                     // visor band
    ctx.moveTo(x - r * 1.2, y - r * 0.16);
    ctx.lineTo(x + r * 1.2, y - r * 0.16);
    ctx.lineTo(x + r * 1.2, y + r * 0.30);
    ctx.lineTo(x - r * 1.2, y + r * 0.30);
    ctx.closePath();
    ctx.fillStyle = '#0a0908'; ctx.fill();
  } else {
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(x - r * 1.2, y + k * r * 0.5);
      ctx.lineTo(x + r * 1.2, y + k * r * 0.5);
      ctx.stroke();
    }
  }

  // gouges torn into the plate as the piece is worn down
  if (hurt > 0.15) {
    const n = Math.floor(hurt * 6);
    for (let k = 0; k < n; k++) {
      const a = (k * 2.39 + r) % TAU, len = r * (0.5 + (k % 3) * 0.28);
      ctx.strokeStyle = '#0a0908'; ctx.lineWidth = 3.6 + (k % 2) * 2;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * r * 0.2, y + Math.sin(a) * r * 0.2);
      ctx.lineTo(x + Math.cos(a + 0.5) * len, y + Math.sin(a + 0.5) * len);
      ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = rgba(WELD, 0.45 * hurt); ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  ctx.restore();                          // end clip

  // bolts at every vertex
  const pts = AMAL_SHELL[role];
  for (let k = 0; k < pts.length; k++) {
    const bx = x + pts[k][0] * r * 0.84 * sx, by = y + pts[k][1] * r * 0.84;
    ctx.fillStyle = '#0a0908';
    ctx.beginPath(); ctx.arc(bx, by + 1.4, 3.4, 0, TAU); ctx.fill();
    ctx.fillStyle = STEEL_L;
    ctx.beginPath(); ctx.arc(bx, by, 3, 0, TAU); ctx.fill();
  }

  // the weld holding the piece in, still cooling
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = rgba(WELD, 0.30 + Math.sin(uiTime * 3 + x * 0.01) * 0.12 + flash * 0.3);
  ctx.lineWidth = 3;
  shellPath(x, y, r * 0.9, role, sx); ctx.stroke();
  ctx.restore();
}

// the boss itself, cut down to a core and sunk into the socket
function amalCore(x, y, r, key, frac, flash, spin) {
  const bd = BOSSES[key], cr = r * 0.5;
  ctx.save();
  // recessed socket
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(x, y, cr * 1.42, 0, TAU); ctx.fill();
  ctx.strokeStyle = STEEL_L; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.arc(x, y, cr * 1.42, 0, TAU); ctx.stroke();
  // retaining claws over the lip
  ctx.strokeStyle = STEEL; ctx.lineWidth = 5;
  for (let k = 0; k < 4; k++) {
    const a = k * TAU / 4 + 0.78;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * cr * 1.6, y + Math.sin(a) * cr * 1.6);
    ctx.lineTo(x + Math.cos(a) * cr * 0.95, y + Math.sin(a) * cr * 0.95);
    ctx.stroke();
  }
  // the captured boss, dimmed by how hurt it is
  const lit = 0.35 + clamp(frac, 0, 1) * 0.65;
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(x, y, cr * 3.4, bd.col, (0.22 + flash * 0.45) * lit);
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = bd.col;
  ctx.fillStyle = flash > 0.02 ? rgba('#ffffff', 0.4 * flash) : rgba(bd.col, 0.26 * lit);
  ctx.lineWidth = 3;
  poly(x, y, cr, bd.sides, spin);
  ctx.fill(); ctx.stroke();
  ctx.globalAlpha = 0.5; ctx.lineWidth = 1.6;
  poly(x, y, cr * 0.54, bd.sides, -spin * 1.4);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
}

// a boss, cut down and bolted in: its own shape, cracked as it takes damage
function amalChunk(x, y, r, key, frac, flash, spin) {
  const bd = BOSSES[key];
  const hurt = 1 - clamp(frac, 0, 1);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(x, y, r * 2.2, bd.col, 0.28 + flash * 0.4);
  ctx.restore();
  ctx.save();
  ctx.strokeStyle = bd.col;
  ctx.fillStyle = flash > 0.02 ? rgba('#ffffff', 0.35 * flash) : rgba(bd.col, 0.2);
  ctx.lineWidth = 3.4;
  poly(x, y, r, bd.sides, spin);
  ctx.fill(); ctx.stroke();
  // inner facet
  ctx.globalAlpha = 0.55; ctx.lineWidth = 1.8;
  poly(x, y, r * 0.58, bd.sides, -spin * 1.4);
  ctx.stroke();
  ctx.globalAlpha = 1;
  // damage: fractures that open as it is worn down
  if (hurt > 0.2) {
    ctx.strokeStyle = rgba('#0c0a09', 0.9); ctx.lineWidth = 2.4;
    const n = Math.floor(hurt * 5);
    for (let k = 0; k < n; k++) {
      const a = (k * 2.7 + key.length) % TAU;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * r * 0.15, y + Math.sin(a) * r * 0.15);
      ctx.lineTo(x + Math.cos(a + 0.4) * r * 0.95, y + Math.sin(a + 0.4) * r * 0.95);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = rgba(WELD, 0.5 * hurt); ctx.lineWidth = 1.2;
    for (let k = 0; k < n; k++) {
      const a = (k * 2.7 + key.length) % TAU;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * r * 0.15, y + Math.sin(a) * r * 0.15);
      ctx.lineTo(x + Math.cos(a + 0.4) * r * 0.95, y + Math.sin(a + 0.4) * r * 0.95);
      ctx.stroke();
    }
  }
  ctx.restore();
}

// cabling that sags between the pieces and sways with the walk
function amalCable(x1, y1, x2, y2, sag, phase) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 + sag + Math.sin(uiTime * 1.8 + phase) * 5;
  ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.quadraticCurveTo(mx, my, x2, y2);
  ctx.strokeStyle = '#0c0a09'; ctx.lineWidth = 5; ctx.stroke();
  ctx.strokeStyle = '#57534e'; ctx.lineWidth = 2.4; ctx.stroke();
}

function drawAmalBody(b, placed, a) {
  const slot = id => {
    const p = AMAL_PARTS.find(z => z.id === id);
    if (a) { const pp = a.parts.find(z => z.id === id); if (pp) return amalPartPos(a, pp); }
    return { x: b.x + p.ox, y: b.y + p.oy };
  };
  const live = id => {
    if (a) { const pp = a.parts.find(z => z.id === id); return pp && pp.e && !pp.e.dead; }
    return placed && placed[id] >= 1;
  };
  const health = id => {
    if (!a) return 1;
    const pp = a.parts.find(z => z.id === id);
    return pp && pp.e ? clamp(pp.e.hp / pp.e.maxHp, 0, 1) : 0;
  };
  const flashOf = id => {
    if (!a) return 0;
    const pp = a.parts.find(z => z.id === id);
    return pp && pp.e ? pp.e.flash : 0;
  };
  const foot = slot('legL').y > slot('legR').y ? slot('legL').y : slot('legR').y;

  /* ---- where a fist is about to land ---- */
  if (a && a.slam && !a.slam.hit) {
    const s = a.slam, u = clamp(s.t / (SLAM_UP + SLAM_DOWN), 0, 1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // the marked ground, filling up as the arm comes over
    ctx.fillStyle = rgba('#fbbf24', 0.10 + u * 0.16);
    ctx.beginPath(); ctx.ellipse(s.tx, s.ty, 190, 190 * 0.8, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba('#fbbf24', 0.5 + u * 0.4); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(s.tx, s.ty, 190, 190 * 0.8, 0, 0, TAU); ctx.stroke();
    // a closing ring that reaches the edge exactly on impact
    ctx.strokeStyle = rgba('#ffffff', 0.55); ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(s.tx, s.ty, 190 * (1.9 - u * 0.9), 190 * 0.8 * (1.9 - u * 0.9), 0, 0, TAU);
    ctx.stroke();
    // cross-hairs, so it is unmistakable
    ctx.strokeStyle = rgba('#fbbf24', 0.35); ctx.lineWidth = 2;
    for (let k = 0; k < 4; k++) {
      const ang = k * TAU / 4 + Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(s.tx + Math.cos(ang) * 130, s.ty + Math.sin(ang) * 104);
      ctx.lineTo(s.tx + Math.cos(ang) * 240, s.ty + Math.sin(ang) * 192);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ---- ground shadow, so it has weight ---- */
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(b.x, foot + 42, 250, 46, 0, 0, TAU);
  ctx.fill();
  ctx.restore();

  /* ---- backlight, so it reads as enormous ---- */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(b.x, b.y - 40, 460, '#7f1d1d', 0.20 + Math.sin(uiTime * 1.4) * 0.05);
  ctx.restore();

  /* ---- limbs behind the chest ---- */
  const bone = (a1, b1, w, pist) => {
    if (!live(a1) || !live(b1)) return;
    const s = slot(a1), t = slot(b1);
    amalLimb(s.x, s.y, t.x, t.y, w, w * 0.72, pist);
  };
  bone('torso', 'legL', 30, 1); bone('torso', 'legR', 30, 1);
  bone('spine', 'torso', 34);
  bone('head', 'spine', 20);

  /* ---- cabling ---- */
  ctx.save();
  if (live('spine') && live('torso')) {
    const s = slot('spine'), t = slot('torso');
    amalCable(s.x - 22, s.y, t.x - 30, t.y - 20, 26, 0);
    amalCable(s.x + 22, s.y, t.x + 30, t.y - 20, 26, 1.7);
  }
  if (live('shldL') && live('armL')) {
    const s = slot('shldL'), t = slot('armL');
    amalCable(s.x - 10, s.y + 14, t.x, t.y - 24, 30, 2.4);
  }
  if (live('shldR') && live('armR')) {
    const s = slot('shldR'), t = slot('armR');
    amalCable(s.x + 10, s.y + 14, t.x, t.y - 24, 30, 3.9);
  }
  ctx.restore();

  /* ---- feet, so the legs land on something ---- */
  for (const id of ['legL', 'legR']) {
    if (!live(id)) continue;
    const p = AMAL_PARTS.find(z => z.id === id);
    const f = slot(id), fy = f.y + p.r * 0.92, sx = p.ox < 0 ? -1 : 1;
    ctx.save();
    ctx.globalAlpha = 0.45; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(f.x, fy + 26, p.r * 1.15, 13, 0, 0, TAU); ctx.fill();
    ctx.restore();
    const sole = dy => {
      ctx.beginPath();
      ctx.moveTo(f.x - p.r * 0.62, fy - 14 + dy);
      ctx.lineTo(f.x + p.r * 0.62, fy - 14 + dy);
      ctx.lineTo(f.x + p.r * (sx > 0 ? 1.02 : 0.78), fy + 16 + dy);
      ctx.lineTo(f.x - p.r * (sx > 0 ? 0.78 : 1.02), fy + 16 + dy);
      ctx.closePath();
    };
    ctx.fillStyle = '#0a0908'; sole(7); ctx.fill();
    sole(0);
    const fg = ctx.createLinearGradient(0, fy - 14, 0, fy + 16);
    fg.addColorStop(0, STEEL); fg.addColorStop(1, STEEL_D);
    ctx.fillStyle = fg; ctx.fill();
    ctx.strokeStyle = STEEL_L; ctx.lineWidth = 2.4; ctx.stroke();
    // toe cleats
    ctx.strokeStyle = 'rgba(12,10,9,0.8)'; ctx.lineWidth = 3;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(f.x + k * p.r * 0.34, fy - 10);
      ctx.lineTo(f.x + k * p.r * 0.4, fy + 14);
      ctx.stroke();
    }
    // and dust, at the bottom of the stride
    if (a && FXO.parts && Math.abs(Math.sin(a.t * 1.5)) < 0.14 && Math.random() < 0.5)
      spawnPart(f.x + rnd(p.r, -p.r), fy + 14, rnd(90, -90), rnd(-10, -60),
                rnd(3.4, 1.6), '#78716c', rnd(0.7, 0.35), 0.9);
  }

  /* ---- the chest chassis: a plated shell around the forge ---- */
  if (live('torso')) {
    const c = slot('torso');
    const th = health('torso'), thurt = 1 - th;
    const chest = () => {
      ctx.beginPath();
      ctx.moveTo(c.x - 96,  c.y - 96);   // clavicle
      ctx.lineTo(c.x - 128, c.y - 62);   // shoulder shelf
      ctx.lineTo(c.x - 112, c.y + 22);
      ctx.lineTo(c.x - 74,  c.y + 78);   // waist taper
      ctx.lineTo(c.x - 62,  c.y + 118);  // pelvis
      ctx.lineTo(c.x + 62,  c.y + 118);
      ctx.lineTo(c.x + 74,  c.y + 78);
      ctx.lineTo(c.x + 112, c.y + 22);
      ctx.lineTo(c.x + 128, c.y - 62);
      ctx.lineTo(c.x + 96,  c.y - 96);
      ctx.closePath();
    };
    ctx.save();
    ctx.fillStyle = '#0a0908';           // thickness
    ctx.translate(6, 8); chest(); ctx.fill(); ctx.translate(-6, -8);
    chest();
    const cg = ctx.createLinearGradient(c.x, c.y - 100, c.x, c.y + 120);
    cg.addColorStop(0, '#4b463f');
    cg.addColorStop(0.5, '#302c28');
    cg.addColorStop(1, STEEL_D);
    ctx.fillStyle = cg; ctx.fill();
    ctx.strokeStyle = STEEL_L; ctx.lineWidth = 3; ctx.stroke();

    ctx.save(); chest(); ctx.clip();
    // ribs
    ctx.strokeStyle = 'rgba(139,131,120,0.45)'; ctx.lineWidth = 5;
    for (let k = -2; k <= 2; k++) {
      ctx.beginPath();
      ctx.arc(c.x, c.y + k * 30 + 6, 82 - Math.abs(k) * 11, Math.PI * 0.1, Math.PI * 0.9);
      ctx.stroke();
    }
    // louvred vents at the collarbones
    ctx.strokeStyle = '#0a0908'; ctx.lineWidth = 4;
    for (let s2 = -1; s2 <= 1; s2 += 2)
      for (let k = 0; k < 4; k++) {
        ctx.beginPath();
        ctx.moveTo(c.x + s2 * 70, c.y - 78 + k * 11);
        ctx.lineTo(c.x + s2 * 116, c.y - 70 + k * 11);
        ctx.stroke();
      }
    // pelvis band
    ctx.fillStyle = '#0a0908';
    ctx.fillRect(c.x - 66, c.y + 84, 132, 12);
    // hull damage
    if (thurt > 0.15) {
      const n = Math.floor(thurt * 9);
      for (let k = 0; k < n; k++) {
        const a = k * 2.39, len = 40 + (k % 4) * 34;
        ctx.strokeStyle = '#0a0908'; ctx.lineWidth = 5 + (k % 3) * 2.5;
        ctx.beginPath();
        ctx.moveTo(c.x + Math.cos(a) * 24, c.y + Math.sin(a) * 24);
        ctx.lineTo(c.x + Math.cos(a + 0.5) * len, c.y + Math.sin(a + 0.5) * len);
        ctx.stroke();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = rgba(WELD, 0.4 * thurt); ctx.lineWidth = 1.8;
        ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
      }
    }
    ctx.restore();                       // end clip

    // bolts down the chest edge
    ctx.fillStyle = STEEL_L;
    for (let s2 = -1; s2 <= 1; s2 += 2)
      for (let k = 0; k < 5; k++) {
        ctx.beginPath();
        ctx.arc(c.x + s2 * (104 - k * 9), c.y - 66 + k * 40, 3.2, 0, TAU);
        ctx.fill();
      }
    // vents breathing heat
    ctx.globalCompositeOperation = 'lighter';
    for (let k = -1; k <= 1; k += 2)
      drawGlow(c.x + k * 92, c.y - 66, 30, WELD, 0.25 + Math.sin(uiTime * 2.6 + k) * 0.12);
    ctx.restore();
  }

  /* ---- limbs in front ---- */
  bone('spine', 'shldL', 18); bone('spine', 'shldR', 18);
  bone('shldL', 'armL', 26, 1);  bone('shldR', 'armR', 26, 1);

  /* ---- the pieces themselves ---- */
  const order = ['legL', 'legR', 'spine', 'torso', 'shldL', 'shldR', 'armL', 'armR', 'head'];
  for (const id of order) {
    if (!live(id)) {
      // a torn-off stump where a piece used to be
      if (a) {
        const s = slot(id);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        drawGlow(s.x, s.y, 40, WELD, 0.22 + Math.sin(uiTime * 9 + s.x) * 0.1);
        ctx.restore();
      }
      continue;
    }
    if (id === 'torso') continue;   // the chest has its own chassis and core
    const p = AMAL_PARTS.find(z => z.id === id);
    const s = slot(id);
    const sx = p.ox < 0 ? -1 : 1;
    amalCasing(s.x, s.y, p.r, AMAL_ROLE[id], sx, health(id), flashOf(id));
    amalCore(s.x, s.y, p.r, p.key, health(id), flashOf(id),
             uiTime * (id === 'spine' ? 1.1 : 0.35) + p.ox * 0.01);
    // a worn piece drips: the welds holding it in are letting go
    if (a && FXO.parts && health(id) < 0.6 && Math.random() < 0.22)
      spawnPart(s.x + rnd(p.r * 0.8, -p.r * 0.8), s.y + p.r * 0.7,
                rnd(14, -14), rnd(120, 50), rnd(2.6, 1.2), WELD, rnd(0.6, 0.3), 0.96);
  }

  /* ---- the core in its chest ---- */
  if (live('torso')) {
    const c = slot('torso');
    const pulse = 0.55 + Math.sin(uiTime * 4.5) * 0.45;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(c.x, c.y, 90 + pulse * 34, AMAL_COL, 0.5);
    drawGlow(c.x, c.y, 40, '#ffffff', 0.35 * pulse);
    // shafts of light escaping the seams
    ctx.strokeStyle = rgba(AMAL_COL, 0.34 * pulse); ctx.lineWidth = 3;
    for (let k = 0; k < 8; k++) {
      const ang = uiTime * 0.5 + k * TAU / 8;
      ctx.beginPath();
      ctx.moveTo(c.x + Math.cos(ang) * 26, c.y + Math.sin(ang) * 26);
      ctx.lineTo(c.x + Math.cos(ang) * (95 + pulse * 26), c.y + Math.sin(ang) * (95 + pulse * 26));
      ctx.stroke();
    }
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.6;
    ctx.fillStyle = rgba(AMAL_COL, 0.5);
    poly(c.x, c.y, 22 + pulse * 4, 6, -uiTime * 1.2);
    ctx.fill(); ctx.stroke();
    ctx.restore();
    // cinders lifting off it, so the thing looks like it is running hot
    if (a && FXO.parts && Math.random() < 0.3)
      spawnPart(c.x + rnd(120, -120), c.y - 60, rnd(24, -24), rnd(-40, -110),
                rnd(2.4, 1), Math.random() < 0.5 ? WELD : AMAL_COL, rnd(0.9, 0.4), 0.95);
  }

  /* ---- the head, and an optic that follows you ---- */
  if (live('head')) {
    const h = slot('head');
    const toP = Math.atan2(P.y - h.y, P.x - h.x);
    ctx.save();
    // crest fin, so the head has a profile
    ctx.beginPath();
    ctx.moveTo(h.x - 10, h.y - 52);
    ctx.lineTo(h.x, h.y - 92);
    ctx.lineTo(h.x + 10, h.y - 52);
    ctx.closePath();
    ctx.fillStyle = STEEL; ctx.fill();
    ctx.strokeStyle = STEEL_L; ctx.lineWidth = 2; ctx.stroke();
    // brow over the visor and a jaw under it, so the helm reads as a face
    ctx.beginPath();
    ctx.moveTo(h.x - 50, h.y - 18);
    ctx.lineTo(h.x - 40, h.y - 30);
    ctx.lineTo(h.x + 40, h.y - 30);
    ctx.lineTo(h.x + 50, h.y - 18);
    ctx.closePath();
    ctx.fillStyle = '#302c28'; ctx.fill();
    ctx.strokeStyle = STEEL_L; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(h.x - 34, h.y + 20);
    ctx.lineTo(h.x + 34, h.y + 20);
    ctx.lineTo(h.x + 22, h.y + 44);
    ctx.lineTo(h.x - 22, h.y + 44);
    ctx.closePath();
    ctx.fillStyle = STEEL_D; ctx.fill();
    ctx.strokeStyle = STEEL_L; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = 'rgba(12,10,9,0.85)'; ctx.lineWidth = 2.6;
    for (let k = -2; k <= 2; k++) {
      ctx.beginPath();
      ctx.moveTo(h.x + k * 13, h.y + 21);
      ctx.lineTo(h.x + k * 10, h.y + 43);
      ctx.stroke();
    }
    // the eye, tracking across the visor slit
    const ex = h.x + Math.cos(toP) * 16, ey = h.y + 4 + Math.sin(toP) * 5;
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(ex, ey, 34, '#ef4444', 0.75);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#fecaca';
    ctx.beginPath(); ctx.arc(ex, ey, 8, 0, TAU); ctx.fill();
    ctx.fillStyle = '#7f1d1d';
    ctx.beginPath(); ctx.arc(ex, ey, 3.4, 0, TAU); ctx.fill();
    // a thin sight line toward the player
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(239,68,68,0.18)'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex + Math.cos(toP) * 700, ey + Math.sin(toP) * 700);
    ctx.stroke();
    ctx.restore();
  }

  /* ---- cutscene only: pieces arriving, and the welds still cooling ---- */
  if (!a && placed) {
    for (const p of AMAL_PARTS) {
      const prog = placed[p.id];
      if (prog === undefined) continue;
      const to = { x: b.x + p.ox, y: b.y + p.oy };
      const sx = p.ox < 0 ? -1 : 1;
      const bd = BOSSES[p.key];

      /* Landed. The weld is still bright, and it flares hardest in the first
         moment — the join is the beat the sound effect is on. */
      if (prog >= 1) {
        const age = prog - 1;
        if (age > 1.3) continue;
        const f = 1 - age / 1.3;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = rgba(f > 0.75 ? '#ffffff' : WELD, 0.9 * f);
        ctx.lineWidth = 3 + f * 7;
        shellPath(to.x, to.y, p.r * 0.94, AMAL_ROLE[p.id], sx); ctx.stroke();
        drawGlow(to.x, to.y, p.r * (1.6 + (1 - f) * 2.2), WELD, 0.55 * f);
        // the ring the impact pushed out
        ctx.strokeStyle = rgba('#ffffff', 0.5 * f * f);
        ctx.lineWidth = 4 * f;
        ctx.beginPath();
        ctx.ellipse(to.x, to.y, p.r * (1 + (1 - f) * 3.4),
                    p.r * (1 + (1 - f) * 3.4) * 0.82, 0, 0, TAU);
        ctx.stroke();
        ctx.restore();
        if (FXO.parts && f > 0.4 && Math.random() < 0.7)
          spawnPart(to.x + rnd(p.r, -p.r), to.y + rnd(p.r, -p.r),
                    rnd(220, -220), rnd(180, -180), rnd(3.4, 1.4),
                    Math.random() < 0.6 ? WELD : '#fde68a', rnd(0.5, 0.2), 0.9);
        continue;
      }

      /* Still coming. Each piece arrives from the side of the frame it belongs
         to — arms across, legs up from the floor, the head down out of the dark
         — instead of every one of them flying in from the same corner. */
      const ent = AMAL_ENTRY[p.id];
      const u = 1 - Math.pow(1 - prog, 3);
      let x, y, scale = 1;
      if (!ent) {                       // the chest comes in from behind you
        x = to.x; y = to.y;
        scale = 0.28 + u * 0.72;
      } else {
        const from = { x: to.x + ent[0] * 1500, y: to.y + ent[1] * 1100 };
        x = lerp(from.x, to.x, u); y = lerp(from.y, to.y, u);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let k = 1; k <= 6; k++) {
          const uu = Math.max(0, u - k * 0.04);
          drawGlow(lerp(from.x, to.x, uu), lerp(from.y, to.y, uu),
                   p.r * (2.3 - k * 0.28), bd.col, 0.15 * (1 - k / 7));
        }
        ctx.restore();
      }
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(x, y, p.r * 3 * scale, bd.col, 0.5 * (1 - u) + 0.3);
      ctx.restore();
      // it was cut off something, so it arrives already fractured, and spinning
      const spin = (1 - u) * 5.5 * sx + uiTime * 0.4;
      amalChunk(x, y, p.r * scale, p.key, 0.55 + u * 0.45, 0, spin);
      // the cut face, glowing where it was taken off
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.5 + (1 - u) * 0.4;
      ctx.strokeStyle = WELD; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x - Math.cos(spin) * p.r * scale, y - Math.sin(spin) * p.r * scale);
      ctx.lineTo(x + Math.cos(spin) * p.r * scale, y + Math.sin(spin) * p.r * scale);
      ctx.stroke();
      ctx.restore();
      if (FXO.parts && Math.random() < 0.4)
        spawnPart(x + rnd(p.r, -p.r), y + rnd(p.r, -p.r), rnd(60, -60), rnd(60, -60),
                  rnd(2.6, 1.2), bd.col, rnd(0.4, 0.2), 0.92);
    }
  }
}

function drawAmalgam() {
  if (amalCut) { drawAmalCut(); return; }
  if (!amalgam) return;
  drawAmalBody({ x: amalgam.x, y: amalgam.y }, null, amalgam);
  if (amalgam.beam) drawAmalBeam(amalgam);
}

/* One bar for the whole frame, plus a pip per piece so you can see what is
   still bolted on and how close the next limb is to coming off. */
function drawAmalgamBar() {
  const a = amalgam;
  const w2 = Math.min(680, W * 0.74), x2 = (W - w2) / 2, y2 = 20;
  const frac = clamp(a.hp / a.maxHp, 0, 1);
  ctx.save();
  ctx.textAlign = 'center';

  ctx.fillStyle = 'rgba(8,12,20,0.82)';
  roundRect(x2 - 4, y2 - 4, w2 + 8, 22, 10); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(x2, y2, w2, 14, 7); ctx.fill();

  // it goes rainbow while the beam is up, matching what is on the floor
  let fill = AMAL_COL;
  if (a.beam) {
    const g = ctx.createLinearGradient(x2, 0, x2 + w2, 0);
    for (let k = 0; k < RAINBOW.length; k++)
      g.addColorStop(k / (RAINBOW.length - 1), RAINBOW[k]);
    fill = g;
  }
  const fw = Math.max(0, (w2 - 4) * frac);
  ctx.fillStyle = fill;
  roundRect(x2 + 2, y2 + 2, fw, 10, 5); ctx.fill();
  if (fw > 4) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(x2 + 2 + fw - 3, y2 + 2, 3, 10);
  }
  ctx.strokeStyle = rgba(AMAL_COL, 0.6); ctx.lineWidth = 1;
  roundRect(x2, y2, w2, 14, 7); ctx.stroke();

  // a pip per piece, in the colour of the boss it used to be
  const n = AMAL_PARTS.length, pw = 13, gap = 5;
  let px = W / 2 - (n * pw + (n - 1) * gap) / 2;
  for (const p of AMAL_PARTS) {
    const pp = a.parts.find(z => z.id === p.id);
    const alive = pp && pp.e && !pp.e.dead;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    roundRect(px, y2 + 19, pw, 5, 2); ctx.fill();
    if (alive) {
      ctx.fillStyle = BOSSES[p.key].col;
      roundRect(px, y2 + 19, pw * clamp(pp.e.hp / pp.e.maxHp, 0, 1), 5, 2); ctx.fill();
    }
    px += pw + gap;
  }

  // the flat cut it takes off your weapon, which is invisible otherwise
  const cut = AMAL_DR[P.weapon] !== undefined ? AMAL_DR[P.weapon] : 0.95;
  ctx.font = "700 9px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = '#fca5a5';
  ctx.textAlign = 'left';
  ctx.fillText('⛨ −' + Math.round(cut * 100) + '%', x2 + w2 + 10, y2 + 11);

  ctx.textAlign = 'center';
  ctx.font = "800 14px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = a.beam ? '#ffffff' : AMAL_COL;
  ctx.fillText('THE AMALGAM' + (a.beam ? '   — REFUSING' : ''), W / 2, y2 + 40);
  ctx.restore();
}

function drawCages() {
  for (const c of cages) {
    const hpf = clamp(c.hp / c.maxHp, 0, 1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(c.x, c.y, c.r * 0.28, '#e2e8f0', 0.10);
    ctx.restore();
    ctx.save();
    // the ring itself, thinning as you break it down
    ctx.strokeStyle = rgba('#e2e8f0', 0.45 + hpf * 0.5);
    ctx.lineWidth = 3 + hpf * 7;
    ctx.setLineDash([18, 10]);
    ctx.lineDashOffset = -uiTime * 26;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    // integrity readout on the ring
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = "700 11px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText('SHOOT THE RING   ' + Math.max(0, Math.ceil(c.hp)), c.x, c.y - c.r - 14);
    ctx.restore();
  }
}

function drawMortars() {
  for (const m of mortars) {
    const t = 1 - m.t / m.max;
    ctx.save();
    ctx.globalAlpha = 0.3 + t * 0.5;
    ctx.strokeStyle = m.col; ctx.lineWidth = m.big ? 4 : 2.4;
    ctx.setLineDash([9, 8]); ctx.lineDashOffset = -uiTime * 20;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.14 + t * 0.26;
    ctx.fillStyle = m.col;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r * t, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawSentries() {
  for (const s of sentries) {
    const fade = clamp(s.life / 2, 0, 1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(s.x, s.y, 30, COL.player, 0.4 * fade);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.strokeStyle = COL.player; ctx.fillStyle = 'rgba(103,232,249,0.22)'; ctx.lineWidth = 2;
    poly(s.x, s.y, 11, 4, uiTime * 1.2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + Math.cos(s.ang) * 18, s.y + Math.sin(s.ang) * 18); ctx.stroke();
    ctx.restore();
  }
}

function drawDiary() {
  if (P.diaryT <= 0) return;
  const fade = clamp(P.diaryT / 1.2, 0, 1);

  for (const m of diaryMirrors) {
    drawGlow(m.x, m.y, m.r * 1.35, '#5eead4', 0.22 * fade);
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.2 * fade;
    ctx.fillStyle = '#0f3d3d';
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.9 * fade;
    ctx.strokeStyle = '#99f6e4'; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.5 * fade;
    ctx.strokeStyle = '#5eead4'; ctx.lineWidth = 1.2;
    poly(m.x, m.y, m.r * 0.62, 6, uiTime * 0.6 + m.x * 0.01);
    ctx.stroke();
    ctx.globalAlpha = 0.45 * fade;
    ctx.strokeStyle = '#99f6e4'; ctx.lineWidth = 1.2;
    for (let k = -1; k <= 1; k++) {
      const o = k * m.r * 0.45;
      ctx.beginPath();
      ctx.moveTo(m.x + o - m.r * 0.45, m.y + m.r * 0.45);
      ctx.lineTo(m.x + o + m.r * 0.45, m.y - m.r * 0.45);
      ctx.stroke();
    }
    ctx.restore();
  }

  drawRefracted(diaryBeams, fade);
}

/* One beam split again at every mirror it crosses — the diary's fan and the
   prism finale are the same figure, so they are drawn by the same pass and as
   a fractal rather than a bundle of lines: haze, chromatic edges shearing off
   the body, a hot core, charge running outward down every branch at one speed,
   and a spoked flare at each point where the beam was split. */
function drawRefracted(list, fade) {
  if (!list.length) return;
  ctx.save();
  ctx.lineCap = 'round';
  const seg = b => { ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke(); };
  for (const b of list) {
    ctx.globalAlpha = 0.14 * fade;
    ctx.strokeStyle = b.col; ctx.lineWidth = b.w * 2.1;
    seg(b);
  }
  // the split: the body offset a hair each way, in the colours either side of it
  for (const b of list) {
    const ex = b.x2 - b.x1, ey = b.y2 - b.y1, el = Math.hypot(ex, ey) || 1;
    const ox = -ey / el * b.w * 0.32, oy = ex / el * b.w * 0.32;
    ctx.globalAlpha = 0.28 * fade;
    ctx.lineWidth = b.w * 0.5;
    ctx.strokeStyle = '#a5f3fc';
    ctx.beginPath(); ctx.moveTo(b.x1 + ox, b.y1 + oy); ctx.lineTo(b.x2 + ox, b.y2 + oy); ctx.stroke();
    ctx.strokeStyle = '#fca5a5';
    ctx.beginPath(); ctx.moveTo(b.x1 - ox, b.y1 - oy); ctx.lineTo(b.x2 - ox, b.y2 - oy); ctx.stroke();
  }
  for (const b of list) {
    ctx.globalAlpha = 0.5 * fade;
    ctx.strokeStyle = b.col; ctx.lineWidth = b.w;
    seg(b);
    ctx.globalAlpha = 0.95 * fade;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2, b.w * 0.26);
    seg(b);
  }
  ctx.globalAlpha = 0.55 * fade;
  ctx.strokeStyle = '#ffffff';
  for (const b of list) {
    ctx.lineWidth = Math.max(1.4, b.w * 0.4);
    ctx.setLineDash([b.w * 0.7, b.w * 3.4]);
    ctx.lineDashOffset = -uiTime * 900;
    seg(b);
  }
  ctx.setLineDash([]);
  for (const b of list) {
    drawGlow(b.x1, b.y1, b.w * 1.5, b.col, 0.5 * fade);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(b.x1, b.y1);
    ctx.rotate(uiTime * 1.5 + b.x1 * 0.01);
    ctx.globalAlpha = 0.32 * fade;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const aa = i * Math.PI / 3;
      const rl = b.w * (1.1 + Math.sin(uiTime * 9 + i * 1.7) * 0.35);
      ctx.moveTo(Math.cos(aa) * b.w * 0.45, Math.sin(aa) * b.w * 0.45);
      ctx.lineTo(Math.cos(aa) * rl, Math.sin(aa) * rl);
    }
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function drawFinaleBeams() {
  drawRefracted(finaleBeams, 1);
}

/* Links between two bodies — the nurse mending what you have been shooting.
   A tether rather than a line: haze, body, hot core, and a pulse walking from
   the source to whatever it is feeding, so you can see which way it flows and
   therefore which one of them to kill first. */
function drawBeams() {
  if (!beams.length) return;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.globalCompositeOperation = 'lighter';
  for (const b of beams) {
    const t = b.life / b.max;
    ctx.globalAlpha = 1;
    const line = () => {
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    };
    ctx.strokeStyle = rgba(b.col, 0.13 * t); ctx.lineWidth = 11 * t + 2; line();
    ctx.strokeStyle = rgba(b.col, 0.7 * t);  ctx.lineWidth = 3 * t + 0.8; line();
    ctx.strokeStyle = rgba('#ffffff', 0.5 * t); ctx.lineWidth = 1.2; line();
    const u = clamp(1 - t, 0, 1);
    drawGlow(lerp(b.x1, b.x2, u), lerp(b.y1, b.y2, u), 12 * t + 4, '#ffffff', 0.6 * t);
    drawGlow(b.x1, b.y1, 14 * t + 4, b.col, 0.45 * t);
    drawGlow(b.x2, b.y2, 19 * t + 5, b.col, 0.6 * t);
  }
  ctx.restore();
}

function drawGrid(ox, oy) {
  const S = 64;
  // the visible world box grows as the camera pulls out
  const vw = W / camZoom, vh = H / camZoom;
  const x0 = Math.floor((-ox) / S) * S, x1 = -ox + vw + S;
  const y0 = Math.floor((-oy) / S) * S, y1 = -oy + vh + S;
  const pulse = 0.5 + Math.sin(uiTime * 1.3) * 0.12;
  ctx.lineWidth = 1;

  if (!gwaves.length || !FXO.waves) {        // flat floor: the cheap path
    ctx.strokeStyle = COL.grid;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    for (let x = x0; x < x1; x += S) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
    for (let y = y0; y < y1; y += S) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
    ctx.stroke();
    ctx.strokeStyle = stage.grid2;
    ctx.globalAlpha = pulse;
    ctx.beginPath();
    for (let x = Math.floor(x0 / (S * 4)) * S * 4; x < x1; x += S * 4) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
    for (let y = Math.floor(y0 / (S * 4)) * S * 4; y < y1; y += S * 4) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
    ctx.stroke();
    ctx.globalAlpha = 1;
    return;
  }

  /* Slabs first: every cell inside the crest band is a lifted tile with a lit
     top face and a dark riser wall on its near edge, so the floor reads as
     solid ground heaving rather than as bent lines. Bounded to the ring's own
     bounding box, so the cost is the crest and not the screen. */
  if (FXO.mat) for (const w of gwaves) {
    const rad = w.speed * w.t, band = w.width;
    const bx0 = Math.floor((w.x - rad - band) / S) * S, bx1 = w.x + rad + band;
    const by0 = Math.floor((w.y - (rad + band) * 0.82) / S) * S, by1 = w.y + (rad + band) * 0.82;
    for (let x = Math.max(x0, bx0); x < Math.min(x1, bx1); x += S)
      for (let y = Math.max(y0, by0); y < Math.min(y1, by1); y += S) {
        const la = gwaveLift(x, y), lb = gwaveLift(x + S, y);
        const lc = gwaveLift(x + S, y + S), ld = gwaveLift(x, y + S);
        const gl = (la.glow + lb.glow + lc.glow + ld.glow) / 4;
        if (gl < 0.14) continue;
        const k = (gl - 0.14) / 0.86;
        ctx.fillStyle = rgba('#000000', 0.5 * k * k);          // riser wall
        ctx.beginPath();
        ctx.moveTo(x, y + S + ld.lift); ctx.lineTo(x + S, y + S + lc.lift);
        ctx.lineTo(x + S, y + S); ctx.lineTo(x, y + S);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = rgba(w.col, 0.03 + k * k * 0.20);      // lit top face
        ctx.beginPath();
        ctx.moveTo(x, y + la.lift); ctx.lineTo(x + S, y + lb.lift);
        ctx.lineTo(x + S, y + S + lc.lift); ctx.lineTo(x, y + S + ld.lift);
        ctx.closePath(); ctx.fill();
      }
  }

  const SEG = S / 2;
  const strand = (fromX, fromY, toX, toY) => {
    const steps = Math.ceil(Math.max(Math.abs(toX - fromX), Math.abs(toY - fromY)) / SEG);
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const u = i / steps;
      const px = fromX + (toX - fromX) * u, py = fromY + (toY - fromY) * u;
      const l = gwaveLift(px, py);
      if (i === 0) ctx.moveTo(px, py + l.lift); else ctx.lineTo(px, py + l.lift);
    }
    ctx.stroke();
  };

  ctx.strokeStyle = COL.grid;
  ctx.globalAlpha = 0.85;
  for (let x = x0; x < x1; x += S) strand(x, y0, x, y1);
  for (let y = y0; y < y1; y += S) strand(x0, y, x1, y);
  ctx.strokeStyle = stage.grid2;
  ctx.globalAlpha = pulse;
  ctx.lineWidth = 1.6;
  for (let x = Math.floor(x0 / (S * 4)) * S * 4; x < x1; x += S * 4) strand(x, y0, x, y1);
  for (let y = Math.floor(y0 / (S * 4)) * S * 4; y < y1; y += S * 4) strand(x0, y, x1, y);
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1;

  /* Risers: a stub of wall under each raised intersection. This is what
     actually sells the height — the bent lines alone read as a smudge. */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let x = x0; x < x1; x += S)
    for (let y = y0; y < y1; y += S) {
      const l = gwaveLift(x, y);
      if (l.glow < 0.06) continue;
      ctx.strokeStyle = rgba(gwaves[0].col, 0.5 * l.glow);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y); ctx.lineTo(x, y + l.lift);
      ctx.stroke();
      ctx.fillStyle = rgba('#ffffff', 0.5 * l.glow);
      ctx.beginPath(); ctx.arc(x, y + l.lift, 2.2, 0, TAU); ctx.fill();
    }

  // the crest itself, lit from underneath
  for (const w of gwaves) {
    const r = w.speed * w.t, fade = 1 - w.t / w.life;
    ctx.strokeStyle = rgba(w.col, 0.45 * fade);
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.ellipse(w.x, w.y, r, r * 0.82, 0, 0, TAU); ctx.stroke();
    ctx.strokeStyle = rgba('#ffffff', 0.3 * fade);
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.ellipse(w.x, w.y - w.amp * 0.8, r, r * 0.82, 0, 0, TAU); ctx.stroke();
  }
  ctx.restore();
  // the trough the crest leaves behind it, which is what sells the height
  for (const w of gwaves) {
    const rr = Math.max(0, w.speed * w.t - w.width * 0.7), fade = 1 - w.t / w.life;
    ctx.strokeStyle = rgba('#000000', 0.35 * fade);
    ctx.lineWidth = 14;
    ctx.beginPath(); ctx.ellipse(w.x, w.y + w.amp * 0.5, rr, rr * 0.82, 0, 0, TAU); ctx.stroke();
  }
}

function drawArena() {
  ctx.save();
  ctx.strokeStyle = COL.wall;
  ctx.lineWidth = 4;
  const aw = arena.x1 - arena.x0, ah = arena.y1 - arena.y0;
  const closing = aw < WORLD.w - 4 || ah < WORLD.h - 4;
  ctx.strokeRect(arena.x0, arena.y0, aw, ah);
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = closing ? 'rgba(94,234,212,0.4)' : stage.glow;
  ctx.lineWidth = closing ? 20 : 12;
  ctx.strokeRect(arena.x0, arena.y0, aw, ah);
  ctx.restore();
}

function poly(x, y, r, sides, ang) {
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const a = ang + i * TAU / sides;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

function drawEnemies() {
  for (const e of enemies) {
    if (e.dead) continue;
    // bosses stay drawn: their telegraphs reach well past their own body
    if (e.type !== 'boss' && !e.amalPart && !inView(e.x, e.y, e.r * 3 + 40)) continue;
