    amalLimb(s.x, s.y, t.x, t.y, w, w * 0.72);
  };
  bone('torso', 'legL', 30); bone('torso', 'legR', 30);
  bone('spine', 'torso', 34);
  bone('head', 'spine', 20);

  /* ---- cabling ---- */
  ctx.save();
  if (live('spine') && live('torso')) {
    const s = slot('spine'), t = slot('torso');
    amalCable(s.x - 22, s.y, t.x - 30, t.y - 20, 26, 0);
    amalCable(s.x + 22, s.y, t.x + 30, t.y - 20, 26, 1.7);
  }
  if (live('shldL') && live('armL')) {
    const s = slot('shldL'), t = slot('armL');
    amalCable(s.x - 10, s.y + 14, t.x, t.y - 24, 30, 2.4);
  }
  if (live('shldR') && live('armR')) {
    const s = slot('shldR'), t = slot('armR');
    amalCable(s.x + 10, s.y + 14, t.x, t.y - 24, 30, 3.9);
  }
  ctx.restore();

  /* ---- the chest chassis: a plated shell around the forge ---- */
  if (live('torso')) {
    const c = slot('torso');
    const th = health('torso'), thurt = 1 - th;
    const chest = () => {
      ctx.beginPath();
      ctx.moveTo(c.x - 96,  c.y - 96);   // clavicle
      ctx.lineTo(c.x - 128, c.y - 62);   // shoulder shelf
      ctx.lineTo(c.x - 112, c.y + 22);
      ctx.lineTo(c.x - 74,  c.y + 78);   // waist taper
      ctx.lineTo(c.x - 62,  c.y + 118);  // pelvis
      ctx.lineTo(c.x + 62,  c.y + 118);
      ctx.lineTo(c.x + 74,  c.y + 78);
      ctx.lineTo(c.x + 112, c.y + 22);
      ctx.lineTo(c.x + 128, c.y - 62);
      ctx.lineTo(c.x + 96,  c.y - 96);
      ctx.closePath();
    };
    ctx.save();
    ctx.fillStyle = '#0a0908';           // thickness
    ctx.translate(6, 8); chest(); ctx.fill(); ctx.translate(-6, -8);
    chest();
    const cg = ctx.createLinearGradient(c.x, c.y - 100, c.x, c.y + 120);
    cg.addColorStop(0, '#4b463f');
    cg.addColorStop(0.5, '#302c28');
    cg.addColorStop(1, STEEL_D);
    ctx.fillStyle = cg; ctx.fill();
    ctx.strokeStyle = STEEL_L; ctx.lineWidth = 3; ctx.stroke();

    ctx.save(); chest(); ctx.clip();
    // ribs
    ctx.strokeStyle = 'rgba(139,131,120,0.45)'; ctx.lineWidth = 5;
    for (let k = -2; k <= 2; k++) {
      ctx.beginPath();
      ctx.arc(c.x, c.y + k * 30 + 6, 82 - Math.abs(k) * 11, Math.PI * 0.1, Math.PI * 0.9);
      ctx.stroke();
    }
    // louvred vents at the collarbones
    ctx.strokeStyle = '#0a0908'; ctx.lineWidth = 4;
    for (let s2 = -1; s2 <= 1; s2 += 2)
      for (let k = 0; k < 4; k++) {
        ctx.beginPath();
        ctx.moveTo(c.x + s2 * 70, c.y - 78 + k * 11);
        ctx.lineTo(c.x + s2 * 116, c.y - 70 + k * 11);
        ctx.stroke();
      }
    // pelvis band
    ctx.fillStyle = '#0a0908';
    ctx.fillRect(c.x - 66, c.y + 84, 132, 12);
    // hull damage
    if (thurt > 0.15) {
      const n = Math.floor(thurt * 9);
      for (let k = 0; k < n; k++) {
        const a = k * 2.39, len = 40 + (k % 4) * 34;
        ctx.strokeStyle = '#0a0908'; ctx.lineWidth = 5 + (k % 3) * 2.5;
        ctx.beginPath();
        ctx.moveTo(c.x + Math.cos(a) * 24, c.y + Math.sin(a) * 24);
        ctx.lineTo(c.x + Math.cos(a + 0.5) * len, c.y + Math.sin(a + 0.5) * len);
        ctx.stroke();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = rgba(WELD, 0.4 * thurt); ctx.lineWidth = 1.8;
        ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
      }
    }
    ctx.restore();                       // end clip

    // bolts down the chest edge
    ctx.fillStyle = STEEL_L;
    for (let s2 = -1; s2 <= 1; s2 += 2)
      for (let k = 0; k < 5; k++) {
        ctx.beginPath();
        ctx.arc(c.x + s2 * (104 - k * 9), c.y - 66 + k * 40, 3.2, 0, TAU);
        ctx.fill();
      }
    // vents breathing heat
    ctx.globalCompositeOperation = 'lighter';
    for (let k = -1; k <= 1; k += 2)
      drawGlow(c.x + k * 92, c.y - 66, 30, WELD, 0.25 + Math.sin(uiTime * 2.6 + k) * 0.12);
    ctx.restore();
  }

  /* ---- limbs in front ---- */
  bone('spine', 'shldL', 18); bone('spine', 'shldR', 18);
  bone('shldL', 'armL', 26);  bone('shldR', 'armR', 26);

  /* ---- the pieces themselves ---- */
  const order = ['legL', 'legR', 'spine', 'torso', 'shldL', 'shldR', 'armL', 'armR', 'head'];
  for (const id of order) {
    if (!live(id)) {
      // a torn-off stump where a piece used to be
      if (a) {
        const s = slot(id);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        drawGlow(s.x, s.y, 40, WELD, 0.22 + Math.sin(uiTime * 9 + s.x) * 0.1);
        ctx.restore();
      }
      continue;
    }
    if (id === 'torso') continue;   // the chest has its own chassis and core
    const p = AMAL_PARTS.find(z => z.id === id);
    const s = slot(id);
    const sx = p.ox < 0 ? -1 : 1;
    amalCasing(s.x, s.y, p.r, AMAL_ROLE[id], sx, health(id), flashOf(id));
    amalCore(s.x, s.y, p.r, p.key, health(id), flashOf(id),
             uiTime * (id === 'spine' ? 1.1 : 0.35) + p.ox * 0.01);
  }

  /* ---- the core in its chest ---- */
  if (live('torso')) {
    const c = slot('torso');
    const pulse = 0.55 + Math.sin(uiTime * 4.5) * 0.45;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(c.x, c.y, 90 + pulse * 34, AMAL_COL, 0.5);
    drawGlow(c.x, c.y, 40, '#ffffff', 0.35 * pulse);
    // shafts of light escaping the seams
    ctx.strokeStyle = rgba(AMAL_COL, 0.34 * pulse); ctx.lineWidth = 3;
    for (let k = 0; k < 8; k++) {
      const ang = uiTime * 0.5 + k * TAU / 8;
      ctx.beginPath();
      ctx.moveTo(c.x + Math.cos(ang) * 26, c.y + Math.sin(ang) * 26);
      ctx.lineTo(c.x + Math.cos(ang) * (95 + pulse * 26), c.y + Math.sin(ang) * (95 + pulse * 26));
      ctx.stroke();
    }
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.6;
    ctx.fillStyle = rgba(AMAL_COL, 0.5);
    poly(c.x, c.y, 22 + pulse * 4, 6, -uiTime * 1.2);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  /* ---- the head, and an optic that follows you ---- */
  if (live('head')) {
    const h = slot('head');
    const toP = Math.atan2(P.y - h.y, P.x - h.x);
    ctx.save();
    // crest fin, so the head has a profile
    ctx.beginPath();
    ctx.moveTo(h.x - 10, h.y - 52);
    ctx.lineTo(h.x, h.y - 92);
    ctx.lineTo(h.x + 10, h.y - 52);
    ctx.closePath();
    ctx.fillStyle = STEEL; ctx.fill();
    ctx.strokeStyle = STEEL_L; ctx.lineWidth = 2; ctx.stroke();
    // the eye, tracking across the visor slit
    const ex = h.x + Math.cos(toP) * 16, ey = h.y + 4 + Math.sin(toP) * 5;
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(ex, ey, 34, '#ef4444', 0.75);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#fecaca';
    ctx.beginPath(); ctx.arc(ex, ey, 8, 0, TAU); ctx.fill();
    ctx.fillStyle = '#7f1d1d';
    ctx.beginPath(); ctx.arc(ex, ey, 3.4, 0, TAU); ctx.fill();
    // a thin sight line toward the player
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(239,68,68,0.18)'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex + Math.cos(toP) * 700, ey + Math.sin(toP) * 700);
    ctx.stroke();
    ctx.restore();
  }

  /* ---- cutscene only: pieces still in flight ---- */
  if (!a && placed) {
    for (const p of AMAL_PARTS) {
      const prog = placed[p.id];
      if (prog === undefined || prog >= 1) continue;
      const from = { x: b.x + p.ox * 5 - 1100, y: b.y + p.oy * 2.6 - 620 };
      const to = { x: b.x + p.ox, y: b.y + p.oy };
      const u = 1 - Math.pow(1 - prog, 3);
      const x = lerp(from.x, to.x, u), y = lerp(from.y, to.y, u);
      const bd = BOSSES[p.key];
      // motion trail
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let k = 1; k <= 5; k++) {
        const uu = Math.max(0, u - k * 0.035);
        drawGlow(lerp(from.x, to.x, uu), lerp(from.y, to.y, uu),
                 p.r * (2.2 - k * 0.3), bd.col, 0.16 * (1 - k / 6));
      }
      drawGlow(x, y, p.r * 3, bd.col, 0.5 * (1 - u) + 0.3);
      ctx.restore();
      amalChunk(x, y, p.r, p.key, 1, 0, uiTime * 3 * (1 - u));
    }
  }
}

function drawAmalgam() {
  if (amalCut) { drawAmalCut(); return; }
  if (!amalgam) return;
  drawAmalBody({ x: amalgam.x, y: amalgam.y }, null, amalgam);
  if (amalgam.beam) drawAmalBeam(amalgam);
}

/* One bar for the whole frame, plus a pip per piece so you can see what is
   still bolted on and how close the next limb is to coming off. */
function drawAmalgamBar() {
  const a = amalgam;
  const w2 = Math.min(680, W * 0.74), x2 = (W - w2) / 2, y2 = 20;
  const frac = clamp(a.hp / a.maxHp, 0, 1);
  ctx.save();
  ctx.textAlign = 'center';

  ctx.fillStyle = 'rgba(8,12,20,0.82)';
  roundRect(x2 - 4, y2 - 4, w2 + 8, 22, 10); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(x2, y2, w2, 14, 7); ctx.fill();

  // it goes rainbow while the beam is up, matching what is on the floor
  let fill = AMAL_COL;
  if (a.beam) {
    const g = ctx.createLinearGradient(x2, 0, x2 + w2, 0);
    for (let k = 0; k < RAINBOW.length; k++)
      g.addColorStop(k / (RAINBOW.length - 1), RAINBOW[k]);
    fill = g;
  }
  const fw = Math.max(0, (w2 - 4) * frac);
  ctx.fillStyle = fill;
  roundRect(x2 + 2, y2 + 2, fw, 10, 5); ctx.fill();
  if (fw > 4) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(x2 + 2 + fw - 3, y2 + 2, 3, 10);
  }
  ctx.strokeStyle = rgba(AMAL_COL, 0.6); ctx.lineWidth = 1;
  roundRect(x2, y2, w2, 14, 7); ctx.stroke();

  // a pip per piece, in the colour of the boss it used to be
  const n = AMAL_PARTS.length, pw = 13, gap = 5;
  let px = W / 2 - (n * pw + (n - 1) * gap) / 2;
  for (const p of AMAL_PARTS) {
    const pp = a.parts.find(z => z.id === p.id);
    const alive = pp && pp.e && !pp.e.dead;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    roundRect(px, y2 + 19, pw, 5, 2); ctx.fill();
    if (alive) {
      ctx.fillStyle = BOSSES[p.key].col;
      roundRect(px, y2 + 19, pw * clamp(pp.e.hp / pp.e.maxHp, 0, 1), 5, 2); ctx.fill();
    }
    px += pw + gap;
  }

  // the flat cut it takes off your weapon, which is invisible otherwise
  const cut = AMAL_DR[P.weapon] !== undefined ? AMAL_DR[P.weapon] : 0.95;
  ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#fca5a5';
  ctx.textAlign = 'left';
  ctx.fillText('⛨ −' + Math.round(cut * 100) + '%', x2 + w2 + 10, y2 + 11);

  ctx.textAlign = 'center';
  ctx.font = '800 14px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = a.beam ? '#ffffff' : AMAL_COL;
  ctx.fillText('THE AMALGAM' + (a.beam ? '   — REFUSING' : ''), W / 2, y2 + 40);
  ctx.restore();
}

function drawCages() {
  for (const c of cages) {
    const hpf = clamp(c.hp / c.maxHp, 0, 1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(c.x, c.y, c.r * 0.28, '#e2e8f0', 0.10);
    ctx.restore();
    ctx.save();
    // the ring itself, thinning as you break it down
    ctx.strokeStyle = rgba('#e2e8f0', 0.45 + hpf * 0.5);
    ctx.lineWidth = 3 + hpf * 7;
    ctx.setLineDash([18, 10]);
    ctx.lineDashOffset = -uiTime * 26;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    // integrity readout on the ring
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 11px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText('SHOOT THE RING   ' + Math.max(0, Math.ceil(c.hp)), c.x, c.y - c.r - 14);
    ctx.restore();
  }
}

function drawMortars() {
  for (const m of mortars) {
    const t = 1 - m.t / m.max;
    ctx.save();
    ctx.globalAlpha = 0.3 + t * 0.5;
    ctx.strokeStyle = m.col; ctx.lineWidth = m.big ? 4 : 2.4;
    ctx.setLineDash([9, 8]); ctx.lineDashOffset = -uiTime * 20;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.14 + t * 0.26;
    ctx.fillStyle = m.col;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r * t, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawSentries() {
  for (const s of sentries) {
    const fade = clamp(s.life / 2, 0, 1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(s.x, s.y, 30, COL.player, 0.4 * fade);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.strokeStyle = COL.player; ctx.fillStyle = 'rgba(103,232,249,0.22)'; ctx.lineWidth = 2;
    poly(s.x, s.y, 11, 4, uiTime * 1.2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + Math.cos(s.ang) * 18, s.y + Math.sin(s.ang) * 18); ctx.stroke();
    ctx.restore();
  }
}

function drawDiary() {
  if (P.diaryT <= 0) return;
  const fade = clamp(P.diaryT / 1.2, 0, 1);

  for (const m of diaryMirrors) {
    drawGlow(m.x, m.y, m.r * 1.35, '#5eead4', 0.22 * fade);
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.2 * fade;
    ctx.fillStyle = '#0f3d3d';
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.9 * fade;
    ctx.strokeStyle = '#99f6e4'; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.45 * fade;
    ctx.lineWidth = 1.2;
    for (let k = -1; k <= 1; k++) {
      const o = k * m.r * 0.45;
      ctx.beginPath();
      ctx.moveTo(m.x + o - m.r * 0.45, m.y + m.r * 0.45);
      ctx.lineTo(m.x + o + m.r * 0.45, m.y - m.r * 0.45);
      ctx.stroke();
    }
    ctx.restore();
  }

  if (!diaryBeams.length) return;
  ctx.save();
  ctx.lineCap = 'round';
  for (const b of diaryBeams) {
    ctx.globalAlpha = 0.15 * fade;
    ctx.strokeStyle = b.col; ctx.lineWidth = b.w * 1.9;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
  }
  for (const b of diaryBeams) {
    ctx.globalAlpha = 0.5 * fade;
    ctx.strokeStyle = b.col; ctx.lineWidth = b.w;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    ctx.globalAlpha = 0.95 * fade;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2, b.w * 0.26);
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
  }
  for (const b of diaryBeams) drawGlow(b.x1, b.y1, b.w * 1.15, b.col, 0.55 * fade);
  ctx.restore();
}

function drawFinaleBeams() {
  if (!finaleBeams.length) return;
  ctx.save();
  ctx.lineCap = 'round';
  // haze, then the coloured body, then a hot white core
  for (const b of finaleBeams) {
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = b.col; ctx.lineWidth = b.w * 1.9;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
  }
  for (const b of finaleBeams) {
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = b.col; ctx.lineWidth = b.w;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    ctx.globalAlpha = 0.95;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2, b.w * 0.26);
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
  }
  // flare at every refraction point
  for (const b of finaleBeams) drawGlow(b.x1, b.y1, b.w * 1.1, b.col, 0.6);
  ctx.restore();
}

function drawBeams() {
  for (const b of beams) {
    const t = b.life / b.max;
    ctx.strokeStyle = rgba(b.col, t * 0.85);
    ctx.lineWidth = 2.5 * t + 0.5;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
  }
}

function drawGrid(ox, oy) {
  const S = 64;
  // the visible world box grows as the camera pulls out
  const vw = W / camZoom, vh = H / camZoom;
  const x0 = Math.floor((-ox) / S) * S, x1 = -ox + vw + S;
  const y0 = Math.floor((-oy) / S) * S, y1 = -oy + vh + S;
  const pulse = 0.5 + Math.sin(uiTime * 1.3) * 0.12;
  ctx.lineWidth = 1;

  if (!gwaves.length || !FXO.waves) {        // flat floor: the cheap path
    ctx.strokeStyle = COL.grid;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    for (let x = x0; x < x1; x += S) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
    for (let y = y0; y < y1; y += S) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
    ctx.stroke();
    ctx.strokeStyle = stage.grid2;
    ctx.globalAlpha = pulse;
    ctx.beginPath();
    for (let x = Math.floor(x0 / (S * 4)) * S * 4; x < x1; x += S * 4) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
    for (let y = Math.floor(y0 / (S * 4)) * S * 4; y < y1; y += S * 4) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
    ctx.stroke();
    ctx.globalAlpha = 1;
    return;
  }

  /* A wave is passing, so the grid is walked as a mesh and every vertex is
     lifted. Segments are half a tile, which is fine at this line weight. */
  const SEG = S / 2;
  const strand = (fromX, fromY, toX, toY) => {
    const steps = Math.ceil(Math.max(Math.abs(toX - fromX), Math.abs(toY - fromY)) / SEG);
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const u = i / steps;
      const px = fromX + (toX - fromX) * u, py = fromY + (toY - fromY) * u;
      const l = gwaveLift(px, py);
      if (i === 0) ctx.moveTo(px, py + l.lift); else ctx.lineTo(px, py + l.lift);
    }
    ctx.stroke();
  };

  ctx.strokeStyle = COL.grid;
  ctx.globalAlpha = 0.85;
  for (let x = x0; x < x1; x += S) strand(x, y0, x, y1);
  for (let y = y0; y < y1; y += S) strand(x0, y, x1, y);
  ctx.strokeStyle = stage.grid2;
  ctx.globalAlpha = pulse;
  ctx.lineWidth = 1.6;
  for (let x = Math.floor(x0 / (S * 4)) * S * 4; x < x1; x += S * 4) strand(x, y0, x, y1);
  for (let y = Math.floor(y0 / (S * 4)) * S * 4; y < y1; y += S * 4) strand(x0, y, x1, y);
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1;

  /* Risers: a stub of wall under each raised intersection. This is what
     actually sells the height — the bent lines alone read as a smudge. */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let x = x0; x < x1; x += S)
    for (let y = y0; y < y1; y += S) {
      const l = gwaveLift(x, y);
      if (l.glow < 0.06) continue;
      ctx.strokeStyle = rgba(gwaves[0].col, 0.5 * l.glow);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y); ctx.lineTo(x, y + l.lift);
      ctx.stroke();
      ctx.fillStyle = rgba('#ffffff', 0.5 * l.glow);
      ctx.beginPath(); ctx.arc(x, y + l.lift, 2.2, 0, TAU); ctx.fill();
    }

  // the crest itself, lit from underneath
  for (const w of gwaves) {
    const r = w.speed * w.t, fade = 1 - w.t / w.life;
    ctx.strokeStyle = rgba(w.col, 0.45 * fade);
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.ellipse(w.x, w.y, r, r * 0.82, 0, 0, TAU); ctx.stroke();
    ctx.strokeStyle = rgba('#ffffff', 0.3 * fade);
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.ellipse(w.x, w.y - w.amp * 0.8, r, r * 0.82, 0, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function drawArena() {
  ctx.save();
  ctx.strokeStyle = COL.wall;
  ctx.lineWidth = 4;
  const aw = arena.x1 - arena.x0, ah = arena.y1 - arena.y0;
  const closing = aw < WORLD.w - 4 || ah < WORLD.h - 4;
  ctx.strokeRect(arena.x0, arena.y0, aw, ah);
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = closing ? 'rgba(94,234,212,0.4)' : stage.glow;
  ctx.lineWidth = closing ? 20 : 12;
  ctx.strokeRect(arena.x0, arena.y0, aw, ah);
  ctx.restore();
}

function poly(x, y, r, sides, ang) {
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const a = ang + i * TAU / sides;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

function drawEnemies() {
  for (const e of enemies) {
    if (e.dead) continue;
    // intangible enemies fade out; they can't be hit while faint
    const ea = e.phased || e.invuln ? 0.3 : 1;

    // the amalgam's limbs are drawn as one welded body, not as loose bosses
    if (e.amalPart) continue;

    // glow
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(e.x, e.y, e.r * (e.type === 'boss' ? 3.4 : 2.3), e.col, (0.34 + e.flash * 0.3) * ea);
    if (e.elite) drawGlow(e.x, e.y, e.r * 3, COL.elite, 0.22 * ea);
    if (e.virus) drawGlow(e.x, e.y, e.r * 5.2, VIRUS_COL, 0.3 + Math.sin(uiTime * 9) * 0.12);
    if (e.shadow > 0) drawGlow(e.x, e.y, e.r * 3.6, VIRUS_COL, 0.24);
    ctx.globalCompositeOperation = 'source-over';

    /* THE BOOKKEEPER: the ledger orbits him, and every card he has written
       onto himself is listed above his head, so his growth is legible. */
    if (e.boss === 'keeper') {
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = KEEPER_COL; ctx.lineWidth = 2;
      for (let k = 0; k < 3; k++) {
        const a = (e.kDroneAng || 0) * (k % 2 ? -1 : 1) + k * TAU / 3;
        const rr = e.r + 40 + k * 12;
        const bx = e.x + Math.cos(a) * rr, by = e.y + Math.sin(a) * rr;
        ctx.save();
        ctx.translate(bx, by); ctx.rotate(a + Math.PI / 2);
        ctx.strokeRect(-9, -12, 18, 24);
        ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, 12); ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
      if (e.kShield > 0) {
        ctx.save();
        ctx.globalAlpha = 0.5 + Math.sin(uiTime * 5) * 0.2;
        ctx.strokeStyle = '#fef3c7'; ctx.lineWidth = 2.4;
        for (let k = 0; k < e.kShield; k++) {
          ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 14 + k * 7, 0, TAU); ctx.stroke();
        }
        ctx.restore();
      }
      const list = Object.keys(e.ku || {});
      if (list.length) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
        let ly = e.y - e.r - 26;
        for (let k = 0; k < list.length; k += 4) {
          const row = list.slice(k, k + 4)
            .map(id => { const u = UPGRADES.find(z => z.id === id);
                         return (u ? upName(u) : id) + (e.ku[id] > 1 ? '×' + e.ku[id] : ''); })
            .join('  ·  ');
          ctx.fillStyle = 'rgba(252,211,77,0.75)';
          ctx.fillText(row, e.x, ly);
          ly -= 12;
        }
        ctx.restore();
      }
    }

    // a shadow is a silhouette on loan — draw it as an outline and skip the body
    if (e.shadow > 0) {
      const fade = clamp(e.shadow / 0.6, 0, 1) * clamp((SHADOW_LIFE - e.shadow) / 0.35, 0, 1);
      ctx.save();
      ctx.globalAlpha = 0.55 * fade;
      ctx.strokeStyle = VIRUS_COL; ctx.lineWidth = 3;
      ctx.setLineDash([7, 5]); ctx.lineDashOffset = -uiTime * 26;
      poly(e.x, e.y, e.r, e.sides || 6, e.ang || 0);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 0.14 * fade;
      ctx.fillStyle = VIRUS_COL;
      poly(e.x, e.y, e.r * 0.82, e.sides || 6, -(e.ang || 0));
      ctx.fill();
      ctx.restore();
      continue;
    }

    ctx.save();
    ctx.globalAlpha = ea;
    ctx.lineWidth = e.type === 'boss' ? 4 : 2.2;
    // flash brightens the fill but never erases the silhouette — a boss under
    // continuous fire has to stay legible
    ctx.fillStyle = rgba(e.col, 0.16 + e.flash * 0.46);
    ctx.strokeStyle = e.flash > 0.5 ? '#ffffff' : e.col;
    poly(e.x, e.y, e.r, e.sides, e.ang);
    ctx.fill(); ctx.stroke();

    // THE OTHER, awakened: eight jointed legs that grow in during the
    // transition and scuttle faster the angrier it gets
    if (e.boss === 'theother' && e.legs > 0) {
      const grow = e.legs;
      const charging = e.rage === 1;
      const stunned = e.rage === 2;
      const beat = uiTime * (charging ? 22 : stunned ? 2 : 7);
      ctx.save();
      ctx.strokeStyle = stunned ? '#fde047' : '#5eead4';
      ctx.lineCap = 'round';
      for (let k = 0; k < 8; k++) {
        const side = k < 4 ? 1 : -1;
        const spread = ((k % 4) - 1.5) * 0.42;
        const base = e.ang + Math.PI / 2 * side + spread * side;
        const sw = Math.sin(beat + k * 1.1);
        const L1 = (30 + sw * 5) * grow, L2 = (34 + sw * 7) * grow;
        const hipX = e.x + Math.cos(base) * e.r * 0.8;
        const hipY = e.y + Math.sin(base) * e.r * 0.8;
        // knee kicks outward and up; the foot then reaches back down
        const kneeA = base + (stunned ? 0.5 : 0.75) + sw * 0.22;
        const kx = hipX + Math.cos(kneeA) * L1;
        const ky = hipY + Math.sin(kneeA) * L1 - (charging ? 10 : 16) * grow;
        const footA = kneeA + (stunned ? 0.4 : 1.05) + Math.cos(beat + k) * 0.28;
        const fx = kx + Math.cos(footA) * L2;
        const fy = ky + Math.sin(footA) * L2;
        ctx.globalAlpha = ea * 0.9;
        ctx.lineWidth = 4.5 * grow;
        ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(kx, ky); ctx.stroke();
        ctx.lineWidth = 3 * grow;
        ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
        ctx.globalAlpha = ea;
      }
      ctx.restore();
      if (charging) {           // a hard line showing exactly where it committed
        ctx.save();
        ctx.globalAlpha = 0.3;
        ctx.strokeStyle = '#5eead4'; ctx.lineWidth = 2;
        ctx.setLineDash([14, 10]);
        ctx.beginPath(); ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.x + Math.cos(e.chargeAng) * 900, e.y + Math.sin(e.chargeAng) * 900);
        ctx.stroke();
        ctx.restore();
      }
    }

    // sentinel: the frontal shield that deflects shots, drawn where it blocks
    if (e.type === 'sentinel') {
      ctx.strokeStyle = '#bae6fd'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 9, e.ang - 1.15, e.ang + 1.15);
      ctx.stroke();
      ctx.globalAlpha = ea * 0.35; ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 9, e.ang - 1.15, e.ang + 1.15);
      ctx.stroke();
      ctx.globalAlpha = ea;
    }
    // forgeheart: rotating armour plates — the gaps are the only way in
    if (e.boss === 'forgeheart') {
      /* The plates are the fight, so they are built rather than outlined:
         armour with a cold face, a bevel catching the forge light, ribs, end
         bolts, and heat bleeding out of the gaps you have to shoot through. */
      const seg = TAU / 4, R = e.r + 24;
      ctx.save();
      ctx.globalAlpha = ea;
      for (let k = 0; k < 4; k++) {
        const a0 = e.plateAng + k * seg, a1 = a0 + seg * 0.62;
        ctx.strokeStyle = '#1c1005'; ctx.lineWidth = 17;
        ctx.beginPath(); ctx.arc(e.x, e.y, R, a0, a1); ctx.stroke();
        ctx.strokeStyle = '#7c2d12'; ctx.lineWidth = 12;
        ctx.beginPath(); ctx.arc(e.x, e.y, R, a0, a1); ctx.stroke();
        ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(e.x, e.y, R + 6, a0, a1); ctx.stroke();
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = rgba('#f97316', 0.3 + Math.sin(uiTime * 3 + k) * 0.16);
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(e.x, e.y, R - 4, a0, a1); ctx.stroke();
        ctx.restore();
        ctx.strokeStyle = 'rgba(15,8,2,0.85)'; ctx.lineWidth = 2;
        for (let i = 1; i < 5; i++) {
          const a = lerp(a0, a1, i / 5);
          ctx.beginPath();
          ctx.moveTo(e.x + Math.cos(a) * (R - 7), e.y + Math.sin(a) * (R - 7));
          ctx.lineTo(e.x + Math.cos(a) * (R + 7), e.y + Math.sin(a) * (R + 7));
          ctx.stroke();
        }
        ctx.fillStyle = '#fde68a';
        for (const a of [a0, a1]) {
          ctx.beginPath();
          ctx.arc(e.x + Math.cos(a) * R, e.y + Math.sin(a) * R, 3, 0, TAU);
          ctx.fill();
        }
        // the gap after this plate: lit from inside, so the way in is obvious
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = rgba('#fb923c', 0.22 + Math.sin(uiTime * 6 + k) * 0.1);
        ctx.lineWidth = 10;
        ctx.beginPath(); ctx.arc(e.x, e.y, R, a1, a0 + seg); ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
      ctx.globalAlpha = ea;
    }

    if (e.elite) {
      ctx.strokeStyle = COL.elite; ctx.lineWidth = 1.6;
      poly(e.x, e.y, e.r + 6, e.sides, -e.ang * 0.6);
      ctx.stroke();
    }
    if (e.psn > 0) {
      /* Venom should look like it is working, and worse the more of it is in
         there: the stacks ring the body and the thing sweats. */
      const sev = clamp(e.psn / 12, 0, 1);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(e.x, e.y, e.r * (1.6 + sev * 1.2), '#a3e635', 0.18 + sev * 0.3);
      ctx.restore();
      // one pip per stack, orbiting
      ctx.fillStyle = '#d9f99d';
      const pips = Math.min(12, e.psn);
      for (let k = 0; k < pips; k++) {
        const a = e.t * 1.8 + k * TAU / pips;
        const rr = e.r * 1.18 + Math.sin(e.t * 5 + k) * 2;
        ctx.beginPath();
        ctx.arc(e.x + Math.cos(a) * rr, e.y + Math.sin(a) * rr, 1.7 + sev, 0, TAU);
        ctx.fill();
      }
      // it drips
      if (Math.random() < 0.25 + sev * 0.4)
        spawnPart(e.x + rnd(e.r * 0.8, -e.r * 0.8), e.y + e.r * 0.4,
                  rnd(14, -14), rnd(70, 30), rnd(2.6, 1.3), '#a3e635', rnd(0.6, 0.3), 0.96);
      ctx.strokeStyle = 'rgba(163,230,53,0.95)'; ctx.lineWidth = 2;
      poly(e.x, e.y, e.r * 0.78, 3, -e.t * 3); ctx.stroke();
      ctx.fillStyle = '#a3e635';
      ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(String(e.psn), e.x, e.y - e.r - 18);
    }
    if (e.slow > 0) {
      ctx.strokeStyle = 'rgba(147,197,253,0.9)'; ctx.lineWidth = 2;
      poly(e.x, e.y, e.r * 0.6, 6, e.t * 2);
      ctx.stroke();
    }
    // inner detail
    if (e.type === 'boss') {
      ctx.strokeStyle = rgba('#fca5a5', 0.8); ctx.lineWidth = 2;
      poly(e.x, e.y, e.r * 0.62, 3, -e.ang * 1.7); ctx.stroke();
      poly(e.x, e.y, e.r * 0.36, 3, e.ang * 2.4 + 1); ctx.stroke();
    } else if (e.type === 'turret') {
      ctx.strokeStyle = rgba('#bfdbfe', 0.9); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.45, 0, TAU); ctx.stroke();
    } else if (e.type === 'brute') {
      ctx.strokeStyle = rgba('#fecdd3', 0.7); ctx.lineWidth = 1.6;
      poly(e.x, e.y, e.r * 0.5, 6, -e.ang); ctx.stroke();
    } else if (e.type === 'healer') {
      ctx.strokeStyle = rgba('#a7f3d0', 0.95); ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(e.x - e.r * 0.5, e.y); ctx.lineTo(e.x + e.r * 0.5, e.y);
      ctx.moveTo(e.x, e.y - e.r * 0.5); ctx.lineTo(e.x, e.y + e.r * 0.5);
      ctx.stroke();
      ctx.globalAlpha = ea * (0.12 + Math.sin(uiTime * 3) * 0.05);
      ctx.beginPath(); ctx.arc(e.x, e.y, 270, 0, TAU); ctx.stroke();
      ctx.globalAlpha = ea;
    } else if (e.type === 'artillery') {
      ctx.strokeStyle = rgba('#fed7aa', 0.85); ctx.lineWidth = 2;
      poly(e.x, e.y, e.r * 0.5, 3, e.ang * 1.6); ctx.stroke();
    } else if (e.type === 'phaser') {
      ctx.strokeStyle = rgba('#f5d0fe', 0.85); ctx.lineWidth = 1.8;
      poly(e.x, e.y, e.r * 0.55, 6, -e.ang * 2); ctx.stroke();
    } else if (e.type === 'wraith') {
      ctx.strokeStyle = rgba('#ddd6fe', 0.8); ctx.lineWidth = 1.6;
      poly(e.x, e.y, e.r * 0.55, 4, e.ang + 0.8); ctx.stroke();
    } else if (e.type === 'revenant') {
      // a ghost wears its second life openly
      ctx.strokeStyle = rgba('#f8fafc', e.gen > 0 ? 0.95 : 0.6);
      ctx.lineWidth = e.gen > 0 ? 2.4 : 1.6;
      poly(e.x, e.y, e.r * 0.55, 5, -e.ang * 1.4); ctx.stroke();
      if (e.gen > 0) {
        ctx.globalAlpha = ea * (0.3 + Math.sin(uiTime * 6) * 0.15);
        poly(e.x, e.y, e.r * 1.35, 5, e.ang); ctx.stroke();
        ctx.globalAlpha = ea;
      }
    } else if (e.type === 'redactor') {
      // the erasure cone, drawn exactly where it eats your shots
      ctx.save();
      ctx.globalAlpha = ea * (e.redacting ? 0.2 : 0.05);
      ctx.fillStyle = e.redacting ? '#ef4444' : '#64748b';
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.arc(e.x, e.y, 330, e.ang - 0.55, e.ang + 0.55);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = ea * (e.redacting ? 0.6 : 0.25);
      ctx.strokeStyle = e.redacting ? '#f87171' : '#475569';
      ctx.lineWidth = e.redacting ? 2.2 : 1.2;
      ctx.setLineDash(e.redacting ? [] : [12, 9]); ctx.lineDashOffset = -uiTime * 20;
      ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = rgba('#fecaca', 0.9); ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(e.x - e.r * 0.5, e.y); ctx.lineTo(e.x + e.r * 0.5, e.y);
      ctx.stroke();
    } else if (e.type === 'mimic') {
      // it wears your silhouette
      ctx.save();
      ctx.translate(e.x, e.y); ctx.rotate(e.ang);
      ctx.strokeStyle = '#99f6e4'; ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(13, 0); ctx.lineTo(-7, 8); ctx.lineTo(-4, 0); ctx.lineTo(-7, -8);
      ctx.closePath(); ctx.stroke();
      ctx.restore();
    } else if (e.type === 'prism') {
      // the mirrored half is drawn solid; the open half is the way in
      ctx.strokeStyle = '#cffafe'; ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 7, e.plateAng - 1.3, e.plateAng + 1.3);
      ctx.stroke();
      ctx.globalAlpha = ea * 0.35; ctx.lineWidth = 11;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 7, e.plateAng - 1.3, e.plateAng + 1.3);
      ctx.stroke();
      ctx.globalAlpha = ea;
    } else if (e.type === 'egg') {
      const pulse = 0.5 + Math.sin(e.atkT * 7) * 0.5;
      ctx.strokeStyle = rgba('#bbf7d0', 0.5 + pulse * 0.5); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (0.3 + pulse * 0.3), 0, TAU); ctx.stroke();
    }
    ctx.restore();

    // dasher telegraph
    if (e.type === 'dasher' && e.state === 1) {
      ctx.save();
      ctx.globalAlpha = 0.35 + Math.sin(e.t * 30) * 0.2;
      ctx.strokeStyle = e.col; ctx.lineWidth = 2;
      ctx.setLineDash([10, 8]);
      ctx.beginPath(); ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + Math.cos(e.ang) * 520, e.y + Math.sin(e.ang) * 520);
      ctx.stroke();
      ctx.restore();
    }
    // bomber fuse
    if (e.type === 'bomber' && e.atkT > 0) {
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#fed7aa'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 8 + Math.sin(e.atkT * 26) * 4, 0, TAU); ctx.stroke();
      ctx.restore();
    }

    // health pip for tanky enemies
    if (e.hp < e.maxHp && e.type !== 'boss' && e.maxHp > 40) {
      const w = e.r * 2, h = 3;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(e.x - w / 2, e.y - e.r - 11, w, h);
      ctx.fillStyle = e.elite ? COL.elite : e.col;
      ctx.fillRect(e.x - w / 2, e.y - e.r - 11, w * clamp(e.hp / e.maxHp, 0, 1), h);
    }
  }
}

function updateCorpses(dt) {
  for (let i = corpses.length - 1; i >= 0; i--) {
    const c = corpses[i];
    c.life -= dt;
    if (c.vol) {
      // it slides, and anything that hits it shoves it further
      c.x += c.vx * dt; c.y += c.vy * dt;
      const dr = Math.pow(0.06, dt);
      c.vx *= dr; c.vy *= dr;
      c.x = clamp(c.x, arena.x0 + c.r, arena.x1 - c.r);
      c.y = clamp(c.y, arena.y0 + c.r, arena.y1 - c.r);
      c.ang += (Math.abs(c.vx) + Math.abs(c.vy)) * dt * 0.012;
      // sparks off the fuse, faster as it runs out
      if (Math.random() < 0.3 + (1 - c.life / c.max) * 0.6)
        spawnPart(c.x + rnd(c.r, -c.r), c.y + rnd(c.r, -c.r), rnd(60, -60), rnd(-30, -110),
                  rnd(3.4, 1.6), Math.random() < 0.5 ? '#fb923c' : '#fecaca', rnd(0.5, 0.2), 0.9);
      if (c.life <= 0) {
        playerBlast(c.x, c.y, 62 + 24 * c.vol, (10 + 9 * c.vol) * (1 + wave * 0.06), '#fb923c');
        ringFx(c.x, c.y, 8, 62 + 24 * c.vol, '#fb923c', 0.5, 4);
        burst(c.x, c.y, 20, '#fb923c', 300, 3.4, 0.55);
        shake(0.25); Audio_.boom();
      }
    }
    if (c.life <= 0) corpses.splice(i, 1);
  }
}

// shove any fused body caught in a blast, so detonations chain across a crowd
function knockCorpses(x, y, r, force) {
  for (const c of corpses) {
    if (!c.vol) continue;
    const dx = c.x - x, dy = c.y - y, d = len(dx, dy) || 1;
    if (d > r + c.r) continue;
    const f = force * (1 - d / (r + c.r));
    c.vx += dx / d * f; c.vy += dy / d * f;
  }
}

function drawCorpses() {
  for (const c of corpses) {
    const t = c.life / c.max;
    ctx.save();
    if (c.vol) {
      /* Red, and flashing faster the closer it is to going off — the tell has
         to be readable at a glance in a crowded room. */
      const urgency = 1 - t;
      const blink = Math.sin(uiTime * (14 + urgency * 46)) > 0 ? 1 : 0.28;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(c.x, c.y, c.r * (2.6 + urgency * 2.2), '#ef4444', 0.34 * blink);
      ctx.restore();
      ctx.globalAlpha = 0.55 + 0.45 * blink;
      ctx.fillStyle = rgba('#ef4444', 0.3 * blink);
      ctx.strokeStyle = blink > 0.5 ? '#fecaca' : '#ef4444';
      ctx.lineWidth = 2.6;
      poly(c.x, c.y, c.r * (1 + urgency * 0.3), c.sides, c.ang);
      ctx.fill(); ctx.stroke();
      // the fuse burning down around it
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#fb923c'; ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r * 1.5, -Math.PI / 2, -Math.PI / 2 + TAU * t);
      ctx.stroke();
    } else {
      ctx.globalAlpha = t * 0.7;
      ctx.strokeStyle = c.col; ctx.lineWidth = 2;
      poly(c.x, c.y, c.r * (1 + (1 - t) * 1.5), c.sides, c.ang + (1 - t) * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawLance() {
  if (P.weapon !== 'laser') return;
  // the charge, wound around the ship
  if (P.charge > 0.01 && P.laserT <= 0) {
    const c = clamp(P.charge, 0, 1);
    drawGlow(P.x + Math.cos(P.ang) * 20, P.y + Math.sin(P.ang) * 20,
             10 + c * 26, c > 0.85 ? '#fecaca' : COL.player, 0.3 + c * 0.5);
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = rgba(c > 0.85 ? '#fecaca' : COL.player, 0.35 + c * 0.55);
    ctx.lineWidth = 2 + c * 2.4;
    ctx.beginPath();
    ctx.arc(P.x, P.y, 26, P.ang - Math.PI * c, P.ang + Math.PI * c);
    ctx.stroke();
    ctx.restore();
  }
  if (P.laserT <= 0 || !P.laserSegs.length) return;
  // width tracks the hitbox envelope exactly, so what you see is what damages
  const env = P.laserEnv;
  const w = (P.laserHeavy ? 34 : 19) * (P.br / 4.2) * env;
  const a = 0.35 + 0.65 * env;
  const col = P.laserHeavy ? COL.crit : COL.player;

  // GEMINI's twin holds the same beam, in its own colour
  if (P.twinSegs.length) {
    ctx.save();
    ctx.lineCap = 'round';
    for (const s of P.twinSegs) {
      ctx.globalAlpha = 0.18 * a;
      ctx.strokeStyle = '#c4b5fd'; ctx.lineWidth = w * 2.0;
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
      ctx.globalAlpha = 0.55 * a;
      ctx.lineWidth = w * 0.92;
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
      ctx.globalAlpha = a * 0.9;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2, w * 0.26);
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    }
    const tl = P.twinSegs[P.twinSegs.length - 1];
    drawGlow(tl.x2, tl.y2, w * 1.4, '#c4b5fd', 0.6 * a);
    drawGlow(P.twinSegs[0].x1, P.twinSegs[0].y1, w * 1.1, '#c4b5fd', 0.55 * a);
    ctx.restore();
  }

  ctx.save();
  ctx.lineCap = 'round';
  for (const s of P.laserSegs) {
    ctx.globalAlpha = 0.2 * a;
    ctx.strokeStyle = col; ctx.lineWidth = w * 2.1;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }
  for (const s of P.laserSegs) {
    ctx.globalAlpha = 0.62 * a;
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    ctx.globalAlpha = a;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2, w * 0.3);
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }
  for (const s of P.laserSegs) {
    if (!s.cut) continue;                  // a redactor ate the rest of this lane
    drawGlow(s.x2, s.y2, w * 1.8, '#f87171', 0.75 * a);
    if (Math.random() < 0.5)
      spawnPart(s.x2 + rnd(7, -7), s.y2 + rnd(7, -7), rnd(50, -50), rnd(50, -50),
                rnd(3.2, 1.4), '#f87171', rnd(0.4, 0.2), 0.9);
  }
  const last = P.laserSegs[P.laserSegs.length - 1];
  drawGlow(last.x2, last.y2, w * 1.5, col, 0.7 * a);
  drawGlow(P.laserSegs[0].x1, P.laserSegs[0].y1, w * 1.2, col, 0.6 * a);
  ctx.restore();
}

function drawShipHull(colStroke, colFill) {
  ctx.beginPath();
  if (P.charId === 'ember') {
    // a blunt hammerhead built around a forward lance prong
    ctx.moveTo(21, 0);
    ctx.lineTo(7, 4);
    ctx.lineTo(3, 13);
    ctx.lineTo(-11, 10);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-11, -10);
    ctx.lineTo(3, -13);
    ctx.lineTo(7, -4);
  } else {
    ctx.moveTo(16, 0);
    ctx.lineTo(-9, 10);
    ctx.lineTo(-5, 0);
    ctx.lineTo(-9, -10);
  }
  ctx.closePath();
  ctx.fillStyle = colFill; ctx.strokeStyle = colStroke;
  ctx.fill(); ctx.stroke();
}

function drawPlayer() {
  const blink = P.iframe > 0 && Math.floor(P.iframe * 22) % 2 === 0;

  // faint pickup-radius ring — shows magnet range and, more importantly, keeps
  // the ship findable when the screen is full of enemies
  ctx.save();
  ctx.globalAlpha = 0.11;
  ctx.strokeStyle = COL.xp; ctx.lineWidth = 1;
  ctx.setLineDash([6, 10]);
  ctx.lineDashOffset = -uiTime * 16;
  ctx.beginPath(); ctx.arc(P.x, P.y, P.pickupR, 0, TAU); ctx.stroke();
  ctx.restore();

  // FORGE LEDGER: the borrowed plates, drawn where they actually block
  if (P.plateT > 0) {
    /* Borrowed plate, and it should look borrowed: forged segments still
       carrying heat, bolted at the ends, riding a hot seam. */
    const fade = clamp(P.plateT / 1.2, 0, 1);
    const seg = TAU / 4, R = 62;
    ctx.save();
    ctx.globalAlpha = fade;
    for (let k = 0; k < 4; k++) {
      const a0 = P.plateAng + k * seg, a1 = a0 + seg * 0.62;
      // the plate: dark steel body with a lit outer bevel
      ctx.strokeStyle = '#2a1c0a'; ctx.lineWidth = 13;
      ctx.beginPath(); ctx.arc(P.x, P.y, R, a0, a1); ctx.stroke();
      ctx.strokeStyle = '#78350f'; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.arc(P.x, P.y, R, a0, a1); ctx.stroke();
      ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(P.x, P.y, R + 4.6, a0, a1); ctx.stroke();
      // heat still in it, breathing
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = rgba('#f97316', 0.35 + Math.sin(uiTime * 4 + k) * 0.18);
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(P.x, P.y, R - 2.5, a0, a1); ctx.stroke();
      ctx.restore();
      // bolts at each end
      ctx.fillStyle = '#fde68a';
      for (const a of [a0, a1]) {
        ctx.beginPath();
        ctx.arc(P.x + Math.cos(a) * R, P.y + Math.sin(a) * R, 2.4, 0, TAU);
        ctx.fill();
      }
      // ribs across the plate
      ctx.strokeStyle = 'rgba(20,12,4,0.8)'; ctx.lineWidth = 1.6;
      for (let i = 1; i < 4; i++) {
        const a = lerp(a0, a1, i / 4);
        ctx.beginPath();
        ctx.moveTo(P.x + Math.cos(a) * (R - 5), P.y + Math.sin(a) * (R - 5));
        ctx.lineTo(P.x + Math.cos(a) * (R + 5), P.y + Math.sin(a) * (R + 5));
        ctx.stroke();
      }
    }
    // an ember shaken loose now and then
    if (Math.random() < 0.4) {
      const a = P.plateAng + rnd(TAU);
      spawnPart(P.x + Math.cos(a) * R, P.y + Math.sin(a) * R,
                rnd(30, -30), rnd(-20, -70), rnd(3, 1.4), '#fbbf24', rnd(0.6, 0.25), 0.92);
    }
    ctx.restore();
  }
  // BROOD FOLIO: under the floor, barely there
  if (P.burrowT > 0) {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 2;
    ctx.setLineDash([9, 7]); ctx.lineDashOffset = -uiTime * 24;
    ctx.beginPath(); ctx.arc(P.x, P.y, 30 + Math.sin(uiTime * 8) * 4, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
  // LEO: the corona, drawn at exactly the radius that burns
  if (P.sun) {
    const R = 130 + 40 * P.sun;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(P.x, P.y, R * 0.95, '#fbbf24', 0.2);
    ctx.globalAlpha = 0.45 + Math.sin(uiTime * 3) * 0.12;
    ctx.strokeStyle = '#fde047'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(P.x, P.y, R, 0, TAU); ctx.stroke();
    /* Prominences: tongues of flame licking off the edge at their own rates,
       so the corona churns instead of being a ring with ticks on it. */
    for (let i = 0; i < 18; i++) {
      const a = uiTime * 0.35 + i * TAU / 18;
      const wob = Math.sin(uiTime * (2.4 + (i % 5) * 0.5) + i * 1.7);
      const r0 = R * 0.82, r1 = R * (1.0 + 0.16 * (0.5 + wob * 0.5));
      const spread = 0.07 + 0.05 * (0.5 + wob * 0.5);
      ctx.globalAlpha = 0.22 + 0.2 * (0.5 + wob * 0.5);
      ctx.fillStyle = i % 3 ? '#fb923c' : '#fde047';
      ctx.beginPath();
      ctx.moveTo(P.x + Math.cos(a - spread) * r0, P.y + Math.sin(a - spread) * r0);
      ctx.quadraticCurveTo(P.x + Math.cos(a) * r1 * 1.06, P.y + Math.sin(a) * r1 * 1.06,
                           P.x + Math.cos(a + spread) * r0, P.y + Math.sin(a + spread) * r0);
      ctx.closePath(); ctx.fill();
    }
    // the boundary that actually burns, and heat shimmer inside it
    ctx.globalAlpha = 0.5 + Math.sin(uiTime * 5) * 0.14;
    ctx.strokeStyle = '#fef3c7'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(P.x, P.y, R, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      const rr = R * (0.5 + i * 0.16) + Math.sin(uiTime * 3 + i * 2) * 5;
      ctx.beginPath(); ctx.arc(P.x, P.y, rr, 0, TAU); ctx.stroke();
    }
    ctx.restore();
    // embers rising off the corona
    if (Math.random() < 0.5) {
      const a = rnd(TAU);
      spawnPart(P.x + Math.cos(a) * R, P.y + Math.sin(a) * R,
                Math.cos(a) * 40, Math.sin(a) * 40 - 60, rnd(3.4, 1.6),
                Math.random() < 0.5 ? '#fde047' : '#fb923c', rnd(0.7, 0.3), 0.93);
    }
  }

  // GEMINI: the twin, mirrored through the centre of the arena
  if (twinActive()) {
    const t = twinPos();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(t.x, t.y, 44, '#c4b5fd', 0.4);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.72;
    ctx.translate(t.x, t.y); ctx.rotate(P.twinAng);
    ctx.lineWidth = 2.2;
    // it is your double, so it wears whichever hull you are flying
    drawShipHull('#c4b5fd', 'rgba(196,181,253,0.18)');
    ctx.restore();
  }

  // shields
  for (let i = 0; i < P.shield; i++) {
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = COL.shield; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(P.x, P.y, P.r + 9 + i * 5, uiTime * 1.4 + i, uiTime * 1.4 + i + 4.6);
    ctx.stroke();
    ctx.restore();
  }
  // drones
  if (P.drones) {
    const R = 62 + P.drones * 7;
    for (let i = 0; i < P.drones; i++) {
      const a = P.droneAng + i * TAU / P.drones;
      const dx = P.x + Math.cos(a) * R, dy = P.y + Math.sin(a) * R;
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(dx, dy, 22, '#a78bfa', 0.6);
      ctx.globalCompositeOperation = 'source-over';
      ctx.save();
      ctx.strokeStyle = '#c4b5fd'; ctx.fillStyle = 'rgba(167,139,250,0.3)'; ctx.lineWidth = 2;
      poly(dx, dy, 8, 3, a * 3);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  /* Afterimages. GHOST STEP is the one upgrade whose whole point is that you
     pass through things, and it had nothing to show for it — phased trails go
     violet and hollow, so you can see the ship is not solid right now. */
  if (FXO.ghosts) for (let i = 0; i < P.ghosts.length; i++) {
    const g = P.ghosts[i];
    const f = (i + 1) / P.ghosts.length;          // oldest is faintest
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(g.x, g.y);
    ctx.rotate(g.ang);
    if (g.phase) {
      ctx.globalAlpha = 0.32 * f;
      ctx.lineWidth = 1.6;
      drawShipHull('#c4b5fd', 'rgba(0,0,0,0)');   // hollow: nothing solid here
      ctx.globalAlpha = 0.16 * f;
      ctx.scale(1 + (1 - f) * 0.5, 1 + (1 - f) * 0.5);
      drawShipHull('#a78bfa', 'rgba(0,0,0,0)');
    } else {
      ctx.globalAlpha = 0.26 * f;
      ctx.lineWidth = 2;
      drawShipHull(COL.player, rgba(COL.player, 0.10));
    }
    ctx.restore();
  }

  if (blink) return;
  ctx.save();
  ctx.translate(P.x, P.y);
  ctx.rotate(P.ang);
  const phasing = P.ghost > 0 && P.dashT > 0;
  const hullCol = phasing ? '#c4b5fd' : P.hurtFlash > 0 ? '#fecaca' : COL.player;

  /* The hull glows off its own edge and outward only. A radial sprite centred
     on the ship washes across the plating and softens it; stroking the
     silhouette at growing widths throws the light outward instead, and the
     solid hull drawn over the top keeps the shape hard. */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineJoin = 'round';
  for (let i = 5; i >= 1; i--) {
    ctx.lineWidth = 2.4 + i * 3.4;
    ctx.strokeStyle = rgba(hullCol, 0.055 * (1 - i / 6.5) + 0.012);
    drawShipHull(rgba(hullCol, 0.055 * (1 - i / 6.5) + 0.012), 'rgba(0,0,0,0)');
  }
  ctx.restore();

  ctx.lineWidth = 2.4;
  ctx.strokeStyle = hullCol;
  // while phasing the hull is barely filled — you are not really there
  const hullFill = phasing ? 'rgba(167,139,250,0.10)'
                 : P.hurtFlash > 0 ? 'rgba(239,68,68,0.5)' : rgba(COL.player, 0.18);
  ctx.fillStyle = hullFill;
  drawShipHull(hullCol, hullFill);
  // cockpit
  ctx.fillStyle = '#e0f2fe';
  ctx.beginPath(); ctx.arc(2, 0, 2.6, 0, TAU); ctx.fill();
  ctx.restore();
}

/* Motion blur. The smear is laid along where the thing has just been and its
   length comes from how fast it is actually travelling, so a slow shot barely
   smudges and a railgun round draws a line. Three tapered segments rather than
   a gradient: with several hundred bullets on screen this allocates nothing. */
/* One stroke, not three. The tapered version cost 11.8ms a frame on its own
   with a few hundred bullets up — three beginPath/stroke pairs each — which is
   most of a frame budget spent on smear. A single line with a round cap reads
   near-identically in motion. */
function motionStreak(x, y, vx, vy, w, col, strength) {
  if (!FXO.mblur) return;
  const k = strength === undefined ? 1 : strength;
  const s = Math.hypot(vx, vy);
  if (s < 40) return;                    // slow things do not smear
  const L = Math.min(s * 0.05, 64) * k;
  ctx.strokeStyle = rgba(col, 0.3 * k);
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - vx / s * L, y - vy / s * L);
  ctx.stroke();
}

function drawBullets() {
  for (const b of bullets) {
    // zodiac rounds read differently at a glance
    const c = b.arrow ? '#fcd34d' : b.venom ? '#a3e635' : b.solar ? '#fb923c'
            : b.deep ? '#38bdf8' : b.crit ? COL.crit : COL.bullet;
    if (FXO.bglow) drawGlow(b.x, b.y, b.r * (b.arrow ? 5.4 : 4.6), c, 0.72);
    motionStreak(b.x, b.y, b.vx, b.vy, b.r * (b.arrow ? 1.3 : 1.7), c,
                 b.arrow ? 1.5 : 1);
    if (b.arrow) {
      /* A whole arrow rather than a dot with two ticks on it: nocked shaft,
         fletching that catches the light, and a barbed head with an edge. */
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      // shaft
      ctx.strokeStyle = '#fde68a'; ctx.lineWidth = 1.9;
      ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(10, 0); ctx.stroke();
      // fletching, two vanes plus the nock
      ctx.fillStyle = 'rgba(252,211,77,0.9)';
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(-26, 0); ctx.lineTo(-20, s * 5.4);
        ctx.lineTo(-11, s * 4.2); ctx.lineTo(-15, 0);
        ctx.closePath(); ctx.fill();
      }
      ctx.strokeStyle = '#fffbeb'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-27, -3.2); ctx.lineTo(-27, 3.2); ctx.stroke();
      // head: a solid barbed point with a lit leading edge
      ctx.fillStyle = '#fffbeb';
      ctx.beginPath();
      ctx.moveTo(19, 0); ctx.lineTo(7, 6.2); ctx.lineTo(10, 0);
      ctx.lineTo(7, -6.2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#fff7ed'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(19, 0); ctx.lineTo(7, -6.2); ctx.stroke();
      ctx.restore();
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.62, 0, TAU); ctx.fill();
    }
  }
}

/* Every boss throws its own thing. A screen full of identical dots tells you
   nothing about what is coming at you; these are shaped so you can read the
   threat by silhouette alone, before you have registered the colour. */
function drawEBullets() {
  for (const b of ebullets) {
    if (FXO.bglow) drawGlow(b.x, b.y, b.r * 3, b.col, 0.55);
    motionStreak(b.x, b.y, b.vx, b.vy, b.r * 1.5, b.col, 0.85);
    const r = b.r;
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.translate(b.x, b.y);
    ctx.lineJoin = 'round';

    switch (b.kind) {
      case 'warden': {                    // a thrown ring, spinning edge-on
        ctx.rotate(b.spin + uiTime * 5);
        ctx.strokeStyle = b.col; ctx.lineWidth = r * 0.62;
        ctx.beginPath(); ctx.ellipse(0, 0, r * 1.15, r * 0.8, 0, 0, TAU); ctx.stroke();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.1;
        ctx.beginPath(); ctx.ellipse(0, 0, r * 1.15, r * 0.8, 0, 0, TAU); ctx.stroke();
        break;
      }
      case 'forgeheart': {                // a slug of molten metal, still running
        ctx.rotate(Math.atan2(b.vy, b.vx));
        ctx.fillStyle = b.col;
        ctx.beginPath();
        ctx.moveTo(r * 1.5, 0);
        ctx.quadraticCurveTo(0, r, -r * 1.7, 0);
        ctx.quadraticCurveTo(0, -r, r * 1.5, 0);
        ctx.fill();
        ctx.fillStyle = '#fef3c7';
        ctx.beginPath(); ctx.arc(r * 0.35, 0, r * 0.45, 0, TAU); ctx.fill();
        break;
      }
      case 'broodmother': {               // a spore, and it has spines
        ctx.rotate(b.spin + uiTime * 1.6);
        ctx.fillStyle = b.col;
        ctx.beginPath(); ctx.arc(0, 0, r * 0.82, 0, TAU); ctx.fill();
        ctx.strokeStyle = b.col; ctx.lineWidth = 1.6;
        for (let i = 0; i < 6; i++) {
          const a = i * TAU / 6, o = r * (1.25 + Math.sin(uiTime * 7 + i) * 0.2);
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7);
          ctx.lineTo(Math.cos(a) * o, Math.sin(a) * o);
          ctx.stroke();
        }
        ctx.fillStyle = '#dcfce7';
        ctx.beginPath(); ctx.arc(0, 0, r * 0.32, 0, TAU); ctx.fill();
        break;
      }
      case 'archivist': {                 // a filed card, corner-stamped
        ctx.rotate(b.spin + uiTime * 2.2);
        ctx.fillStyle = rgba(b.col, 0.85);
        ctx.fillRect(-r * 1.1, -r * 0.8, r * 2.2, r * 1.6);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
        ctx.strokeRect(-r * 1.1, -r * 0.8, r * 2.2, r * 1.6);
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.fillRect(-r * 0.7, -r * 0.3, r * 1.4, 1.4);
        ctx.fillRect(-r * 0.7, r * 0.15, r * 0.9, 1.4);
        break;
      }
      case 'nullcore': {                  // a shard with nothing inside it
        ctx.rotate(b.spin + uiTime * 3.4);
        ctx.fillStyle = b.col;
        poly(0, 0, r * 1.35, 3, 0); ctx.fill();
        ctx.fillStyle = '#0a0a0f';       // the hole, not a highlight
        poly(0, 0, r * 0.6, 3, Math.PI); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
        poly(0, 0, r * 1.35, 3, 0); ctx.stroke();
        break;
      }
      case 'curator': {                   // a redaction, travelling
        ctx.rotate(Math.atan2(b.vy, b.vx));
        ctx.fillStyle = '#0b0b0e';
        ctx.fillRect(-r * 1.9, -r * 0.62, r * 3.8, r * 1.24);
        ctx.strokeStyle = b.col; ctx.lineWidth = 1.4;
        ctx.strokeRect(-r * 1.9, -r * 0.62, r * 3.8, r * 1.24);
        break;
      }
      case 'theother': {                  // a sliver of mirror
        ctx.rotate(Math.atan2(b.vy, b.vx));
        ctx.fillStyle = rgba(b.col, 0.55);
        ctx.beginPath();
        ctx.moveTo(r * 1.9, 0); ctx.lineTo(0, r * 0.62);
        ctx.lineTo(-r * 1.9, 0); ctx.lineTo(0, -r * 0.62);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-r * 0.8, -r * 0.14); ctx.lineTo(r * 0.9, -r * 0.14);
        ctx.stroke();
        break;
      }
      case 'keeper': {                    // a wax seal, pressed and thrown
        ctx.rotate(b.spin + uiTime * 1.2);
        ctx.fillStyle = b.col;
        poly(0, 0, r * 1.15, 7, 0); ctx.fill();
        ctx.strokeStyle = '#fffbeb'; ctx.lineWidth = 1.2;
        poly(0, 0, r * 0.66, 7, Math.PI / 7); ctx.stroke();
        break;
      }
      case 'unwritten': {                 // a torn corner of a blank page
        ctx.rotate(b.spin + uiTime * 0.9);
        ctx.fillStyle = 'rgba(245,245,247,0.9)';
        ctx.beginPath();
        ctx.moveTo(-r, -r * 1.1); ctx.lineTo(r * 1.15, -r * 0.8);
        ctx.lineTo(r * 0.75, r * 1.15); ctx.lineTo(-r * 1.1, r * 0.7);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = rgba(b.col, 0.9); ctx.lineWidth = 1;
        ctx.stroke();
        break;
      }
      default: {                          // grunts and anything untagged
        ctx.fillStyle = b.col;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.3; ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(0, 0, r * 0.44, 0, TAU); ctx.fill();
      }
    }
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of parts) {
    const t = p.life / p.max;
    drawGlow(p.x, p.y, p.r * 3.4 * (0.4 + t * 0.9), p.color, t * 0.75);
  }
}

/* A glow on its own has no edge anywhere, so it reads as a smudge. Each of
   these is light around a hard little body, not light instead of one. */
function drawGems() {
  const pu = Math.sin(uiTime * 6) * 0.2 + 0.9;
  for (const g of gems) {
    const fade = g.life < 3 ? (Math.floor(g.life * 7) % 2 ? 0.3 : 1) : 1;
    drawGlow(g.x, g.y, g.r * 2.9 * pu, COL.xp, 0.5 * fade);
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = fade;
    const a = uiTime * 1.5 + g.x * 0.01;
    ctx.fillStyle = COL.xp;
    poly(g.x, g.y, g.r * 1.25, 4, a); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2;
    poly(g.x, g.y, g.r * 1.25, 4, a); ctx.stroke();
    ctx.fillStyle = '#fff';
    poly(g.x, g.y, g.r * 0.46, 4, a); ctx.fill();
    ctx.restore();
  }
}

function drawDrops() {
  for (const d of drops) {
    const s = 1 + Math.sin(d.t) * 0.16;
    drawGlow(d.x, d.y, d.r * 3.4 * s, d.col, 0.8);
  }
}
function drawArcs() {
  for (const a of arcs) {
    const t = a.life / a.max;
    ctx.strokeStyle = rgba(a.col, t);
    ctx.lineWidth = 3 * t + 1;
    ctx.beginPath();
    // jagged lightning
    const segs = 6;
    ctx.moveTo(a.x1, a.y1);
    for (let i = 1; i < segs; i++) {
      const f = i / segs;
      const nx = lerp(a.x1, a.x2, f) + rnd(16, -16);
      const ny = lerp(a.y1, a.y2, f) + rnd(16, -16);
      ctx.lineTo(nx, ny);
    }
    ctx.lineTo(a.x2, a.y2);
    ctx.stroke();
  }
}

function drawRings() {
  for (const r of rings) {
    const t = r.life / r.max;
    ctx.strokeStyle = rgba(r.color, t * 0.9);
    ctx.lineWidth = r.lw * t + 0.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
}

function drawFloats() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const f of floats) {
    const t = f.life / f.max;
    ctx.globalAlpha = clamp(t * 1.6, 0, 1);
    ctx.font = `700 ${f.size}px Segoe UI, system-ui, sans-serif`;
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.75)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // low-health pulse
  const hf = P.hp / P.maxHp;
  if (state === 'play' && hf < 0.34) {
    const a = (0.34 - hf) * (0.6 + Math.sin(uiTime * 7) * 0.4);
    const g2 = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.7);
    g2.addColorStop(0, 'rgba(239,68,68,0)');
    g2.addColorStop(1, `rgba(239,68,68,${a})`);
    ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
  }
}

function drawCrosshair() {
  const x = mouse.x, y = mouse.y;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = rgba(COL.player, 0.85);
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(x, y, 11, 0, TAU); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x - 17, y); ctx.lineTo(x - 6, y);
  ctx.moveTo(x + 6, y); ctx.lineTo(x + 17, y);
  ctx.moveTo(x, y - 17); ctx.lineTo(x, y - 6);
  ctx.moveTo(x, y + 6); ctx.lineTo(x, y + 17);
  ctx.stroke();
  ctx.fillStyle = rgba(COL.player, 0.9);
  ctx.fillRect(x - 1, y - 1, 2, 2);
  ctx.restore();
}

/* ---------------------------------- HUD ----------------------------------- */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawHUD() {
  const pad = 18;
  ctx.textBaseline = 'middle';

  /* --- health bar --- */
  const bw = Math.min(340, W * 0.4), bh = 16;
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(8,12,20,0.72)';
  roundRect(pad, pad, bw, bh, 8); ctx.fill();
  const hf = clamp(P.hp / P.maxHp, 0, 1);
  const hc = hf > 0.5 ? COL.hp : hf > 0.25 ? '#facc15' : '#ef4444';
  ctx.fillStyle = hc;
  roundRect(pad + 2, pad + 2, Math.max(0, (bw - 4) * hf), bh - 4, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(148,163,184,0.35)'; ctx.lineWidth = 1;
  roundRect(pad, pad, bw, bh, 8); ctx.stroke();
  ctx.font = '600 11px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#0b1220';
  ctx.fillText(`${fmtHp(P.hp)} / ${Math.round(P.maxHp)}`, pad + 9, pad + bh / 2 + 0.5);

  /* --- xp bar --- */
  const yb = pad + bh + 7;
  ctx.fillStyle = 'rgba(8,12,20,0.72)';
  roundRect(pad, yb, bw, 9, 5); ctx.fill();
  ctx.fillStyle = COL.xp;
  roundRect(pad + 1.5, yb + 1.5, Math.max(0, (bw - 3) * clamp(P.xp / P.xpNext, 0, 1)), 6, 3); ctx.fill();

  /* --- level + dash pips --- */
  ctx.font = '700 13px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#7dd3fc';
  ctx.fillText('LV ' + P.level, pad, yb + 26);

  let dx = pad + 58;
  for (let i = 0; i < P.dashMax; i++) {
    const filled = i < P.dashCh;
    const partial = i === P.dashCh ? clamp(P.dashRe / P.dashCd, 0, 1) : 0;
    ctx.fillStyle = 'rgba(148,163,184,0.22)';
    roundRect(dx, yb + 20, 22, 6, 3); ctx.fill();
    if (filled || partial > 0) {
      ctx.fillStyle = filled ? COL.player : rgba(COL.player, 0.5);
      roundRect(dx, yb + 20, 22 * (filled ? 1 : partial), 6, 3); ctx.fill();
    }
    dx += 26;
  }
  if (P.shieldMax) {
    for (let i = 0; i < P.shieldMax; i++) {
      ctx.fillStyle = i < P.shield ? COL.shield : 'rgba(129,140,248,0.2)';
      ctx.beginPath(); ctx.arc(dx + 6, yb + 23, 4.5, 0, TAU); ctx.fill();
      dx += 14;
    }
  }

  /* --- carried book --- */
  if (P.book) {
    const ready = P.bookCharge >= P.book.cost;
    const by = yb + 40;
    ctx.textAlign = 'left';
    ctx.font = '700 10px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = ready ? P.book.col : '#475569';
    ctx.fillText('[Q] ' + P.book.n, pad, by);
    let qx = pad;
    for (let i = 0; i < P.book.cost; i++) {
      ctx.fillStyle = i < P.bookCharge ? P.book.col : 'rgba(148,163,184,0.22)';
      roundRect(qx, by + 8, 16, 5, 3); ctx.fill();
      qx += 20;
    }
    if (ready) {
      ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
      ctx.fillStyle = P.book.col;
      ctx.globalAlpha = 0.6 + Math.sin(uiTime * 5) * 0.4;
      ctx.fillText('READY', qx + 6, by + 11);
      ctx.globalAlpha = 1;
    }
  }

  /* --- the chip, if it is in --- */
  if (P.chip) {
    ctx.textAlign = 'left';
    ctx.font = '700 10px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = CHIP_COL;
    ctx.globalAlpha = 0.6 + Math.sin(uiTime * 2) * 0.2;
    ctx.fillText('◧ RECORD CHIP', pad, yb + 20);
    ctx.globalAlpha = 1;
  }

  /* --- installed malware: it owns the dash, so it says so where dash lives --- */
  if (P.malware) {
    const my = yb + (P.book ? 66 : 40);
    drawMalChip(pad + 11, my - 3, 9, P.malware.col);   // the part, in miniature
    ctx.textAlign = 'left';
    ctx.font = '700 10px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = P.malware.col;
    ctx.globalAlpha = 0.55 + Math.sin(uiTime * 2.4) * 0.2;
    ctx.fillText('[SPACE] ' + P.malware.n, pad + 26, my);
    ctx.globalAlpha = 1;
  }

  /* --- score / wave --- */
  ctx.textAlign = 'right';
  ctx.font = '800 26px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#e2e8f0';
  ctx.fillText(score.toLocaleString(), W - pad, pad + 12);
  ctx.font = '600 12px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.fillText('BEST ' + Math.max(Save.profile.best, score).toLocaleString(), W - pad, pad + 32);
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(`WAVE ${wave}   ·   ${P.kills} KILLS   ·   ${fmtTime(elapsed)}`, W - pad, pad + 50);
  // sector + credits
  ctx.font = '700 12px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = stage.accent;
  ctx.fillText(stage.name + (loopNum > 0 ? '  ×' + (loopNum + 1) : '') +
               '   ' + (((wave - 1) % 5) + 1) + '/5', W - pad, pad + 70);
  ctx.font = '800 15px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#fbbf24';
  ctx.fillText('◈ ' + credits, W - pad, pad + 92);

  /* --- boss bar --- */
  // a shadow is on loan and must never take the real boss's bar
  /* THE AMALGAM owns the bar outright. Its limbs are nine separate boss
     enemies, so the finder below would label the whole fight after whichever
     piece happens to sit first in the array — and show that piece's health
     instead of the pool. */
  const boss = amalgam ? null : enemies.find(e => e.type === 'boss' && !e.dead && !e.shadow);
  if (amalgam) drawAmalgamBar();
  else if (boss) {
    const w2 = Math.min(560, W * 0.62), x2 = (W - w2) / 2, y2 = 22;
    ctx.textAlign = 'center';
    const bd = BOSSES[boss.boss] || BOSSES.warden;
    const bcol = boss.virus ? VIRUS_COL : bd.col;
    const bname = boss.virus ? '!! ' + bd.name + ' — CORRUPTED !!' : bd.name;
    ctx.fillStyle = 'rgba(8,12,20,0.75)';
    roundRect(x2, y2, w2, 14, 7); ctx.fill();
    ctx.fillStyle = bcol;
    roundRect(x2 + 2, y2 + 2, Math.max(0, (w2 - 4) * clamp(boss.hp / boss.maxHp, 0, 1)), 10, 5); ctx.fill();
    ctx.strokeStyle = rgba(bcol, 0.5); ctx.lineWidth = 1;
    roundRect(x2, y2, w2, 14, 7); ctx.stroke();
    // armour is invisible otherwise: the player just sees smaller numbers
    const unwCut = boss.boss === 'unwritten'
      ? (UNW_DR[P.weapon] !== undefined ? UNW_DR[P.weapon] : 0.95) : 0;
    if (boss.armor > 0 || boss.dr > 0 || unwCut > 0) {
      ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
      ctx.fillStyle = unwCut ? '#c084fc' : '#94a3b8';
      ctx.textAlign = 'left';
      ctx.fillText(unwCut
        ? '⛨ −' + Math.round(unwCut * 100) + '%' +
          (unwritten && unwritten.rage > 1.02
            ? '   ⚠ ×' + unwritten.rage.toFixed(2) : '')
        : '⛨ ' + Math.round(boss.armor) +
          (boss.dr > 0 ? '  −' + Math.round(boss.dr * 100) + '%' : ''),
        x2 + w2 + 8, y2 + 11);
      ctx.textAlign = 'center';
    }
    ctx.font = '700 12px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = bcol;
    ctx.fillText(bname + (boss.invuln
      ? (boss.finale ? '   — OVERLOAD'
         : boss.boss === 'broodmother' ? '   — SUBMERGED' : '   — CHANGING') : ''),
      W / 2, y2 + 28);
    // offscreen indicator
    const sx = (boss.x - cam.x) * camZoom + W / 2,
          sy = (boss.y - cam.y) * camZoom + H / 2;
    if (sx < 0 || sy < 0 || sx > W || sy > H) {
      const a = Math.atan2(boss.y - cam.y, boss.x - cam.x);
      const rx = W / 2 + Math.cos(a) * (Math.min(W, H) * 0.42);
      const ry = H / 2 + Math.sin(a) * (Math.min(W, H) * 0.42);
      ctx.save();
      ctx.translate(rx, ry); ctx.rotate(a);
      ctx.fillStyle = rgba(bd.col, 0.85);
      ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-8, 8); ctx.lineTo(-8, -8); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  /* --- banner --- */
  if (bannerT > 0) {
    const t = bannerT / 2.2;
    const a = clamp(Math.min(t * 3.4, (1 - t) * 6), 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.font = '800 40px Segoe UI, system-ui, sans-serif';
    ctx.shadowColor = bannerCol; ctx.shadowBlur = 26;
    ctx.fillStyle = bannerCol;
    ctx.fillText(bannerText, W / 2, H * 0.28 - (1 - a) * 14);
    ctx.restore();
  }

  /* --- build chips (owned upgrades) — hidden under full-screen overlays --- */
  const owned = state === 'play' ? Object.keys(P.up) : [];
  if (owned.length) {
    ctx.textAlign = 'left';
    ctx.font = '600 10px Segoe UI, system-ui, sans-serif';
    let cx = pad, cy = H - pad - 8;
    for (const id of owned) {
      const u = UPGRADES.find(z => z.id === id);
      if (!u) continue;
      const label = upName(u) + (P.up[id] > 1 ? ' ×' + P.up[id] : '');
      const w3 = ctx.measureText(label).width + 14;
      if (cx + w3 > W - pad) { cx = pad; cy -= 20; }
      ctx.fillStyle = 'rgba(15,23,42,0.7)';
      roundRect(cx, cy - 8, w3, 16, 8); ctx.fill();
      ctx.strokeStyle = rgba(RARITY[u.rar], 0.55); ctx.lineWidth = 1;
      roundRect(cx, cy - 8, w3, 16, 8); ctx.stroke();
      ctx.fillStyle = RARITY[u.rar];
      ctx.fillText(label, cx + 7, cy + 0.5);
      cx += w3 + 5;
    }
  }
}

function fmtTime(s) {
  const m = Math.floor(s / 60), r = Math.floor(s % 60);
  return m + ':' + String(r).padStart(2, '0');
}

/* ------------------------------ level-up UI -------------------------------- */
function cardRects() {
  const n = offers.length || 3;
  const cw = Math.min(268, (W - 60) / n - 16), ch = Math.min(300, H * 0.5);
  const gap = 18;
  const total = n * cw + (n - 1) * gap;
  const x0 = (W - total) / 2, y0 = (H - ch) / 2 + 16;
  const out = [];
  for (let i = 0; i < n; i++) out.push({ x: x0 + i * (cw + gap), y: y0, w: cw, h: ch });
  return out;
}
function offerIndexAt(mx, my) {
  const rs = cardRects();
  for (let i = 0; i < offers.length; i++) {
    const r = rs[i];
    if (mx > r.x && mx < r.x + r.w && my > r.y && my < r.y + r.h) return i;
  }
  return -1;
}

function drawLevelUp() {
  ctx.fillStyle = 'rgba(3,5,10,0.82)';
  ctx.fillRect(0, 0, W, H);
  const rs = cardRects();
  const hover = offerIndexAt(mouse.x, mouse.y);

  ctx.textAlign = 'center';
  ctx.font = '800 15px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = COL.player;
  ctx.fillText('LEVEL ' + P.level, W / 2, rs[0].y - 62);
  ctx.font = '800 34px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#f1f5f9';
  ctx.fillText('CHOOSE AN UPGRADE', W / 2, rs[0].y - 34);

  for (let i = 0; i < offers.length; i++) {
    const u = offers[i], r = rs[i];
    const col = RARITY[u.rar];
    const on = hover === i;
    const lift = on ? 6 : 0;
    const y = r.y - lift;

    ctx.save();
    if (on) { ctx.shadowColor = col; ctx.shadowBlur = 28; }
    ctx.fillStyle = on ? 'rgba(22,32,52,0.98)' : 'rgba(12,18,30,0.96)';
    roundRect(r.x, y, r.w, r.h, 14); ctx.fill();
    ctx.restore();

    ctx.strokeStyle = on ? col : rgba(col, 0.45);
    ctx.lineWidth = on ? 2.4 : 1.4;
    roundRect(r.x, y, r.w, r.h, 14); ctx.stroke();

    // rarity strip
    ctx.fillStyle = col;
    roundRect(r.x + 14, y + 16, r.w - 28, 3, 2); ctx.fill();

    // icon
    const cxp = r.x + r.w / 2, cyp = y + 84;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(cxp, cyp, 52, col, on ? 0.55 : 0.34);
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = col; ctx.lineWidth = 2.4;
    ctx.fillStyle = rgba(col, 0.14);
    const sides = 3 + (i + u.n.length) % 5;
    poly(cxp, cyp, 26, sides, uiTime * (on ? 1.4 : 0.5) + i);
    ctx.fill(); ctx.stroke();
    poly(cxp, cyp, 13, sides, -uiTime * (on ? 1.9 : 0.7) + i);
    ctx.stroke();
    ctx.restore();

    ctx.textAlign = 'center';
    ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = col;
    ctx.fillText(u.rar.toUpperCase(), cxp, y + 34);

    ctx.font = '800 19px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#f8fafc';
    ctx.fillText(upName(u), cxp, y + 140);

    ctx.font = '400 13px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#94a3b8';
    wrapText(upDesc(u), cxp, y + 168, r.w - 36, 17);

    // stack pips
    const have = P.up[u.id] || 0;
    const pw = 12, tw = u.max * pw;
    for (let k = 0; k < u.max; k++) {
      ctx.fillStyle = k < have ? col : 'rgba(148,163,184,0.22)';
      roundRect(cxp - tw / 2 + k * pw, y + r.h - 44, 8, 4, 2); ctx.fill();
    }

    ctx.font = '700 11px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = on ? col : '#475569';
    ctx.fillText('[ ' + (i + 1) + ' ]', cxp, y + r.h - 22);
  }
  ctx.textAlign = 'center';
  ctx.font = '500 11px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#475569';
  ctx.fillText('CLICK OR PRESS 1 / 2 / 3', W / 2, rs[0].y + rs[0].h + 30);
}

/* Normally a whole number. Under THE AMALGAM it goes fractional and has to
   print every place, because watching it shrink is the joke and the tension. */
function fmtHp(hp) {
  if (hp >= 1) return String(Math.ceil(hp));
  if (hp <= 0) return '0';
  // past a certain absurdity the decimals stop reading as a number at all and
  // start reading as zero, which is exactly the wrong impression to give
  if (hp < 1e-6) return hp.toExponential(0).replace('e-', 'e−');
  const places = Math.max(1, Math.round(-Math.log10(hp)));
  return hp.toFixed(places);
}

// hard cap on a name from the board: it is user-supplied and can be anything
function clipText(s, n) {
  s = String(s);
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

// same wrapping as wrapText, but handed back so a caller can place a caret
function wrapLines(text, maxW) {
  const words = String(text).split(' ');
  const out = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; }
    else line = test;
  }
  out.push(line);
  return out;
}

function wrapText(text, x, y, maxW, lh) {
  const words = String(text).split(' ');
  let line = '', yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, yy); line = w; yy += lh;
    } else line = test;
  }
  if (line) ctx.fillText(line, x, yy);
  return yy;                          // baseline of the last line drawn
}

/* --------------------------------- shop UI --------------------------------- */
function shopRects() {
  const cols = 3, rows = 2, gx = 16, gy = 16;
  const cw = Math.min(230, (W - 90) / cols - gx);
  const ch = Math.min(178, (H - 250) / rows - gy);
  const tw = cols * cw + (cols - 1) * gx;
  const th = rows * ch + (rows - 1) * gy;
  const x0 = (W - tw) / 2, y0 = (H - th) / 2 - 4;
  const out = [];
  for (let i = 0; i < cols * rows; i++)
    out.push({ x: x0 + (i % cols) * (cw + gx), y: y0 + ((i / cols) | 0) * (ch + gy), w: cw, h: ch });
  return out;
}
function shopButtons() {
  const rs = shopRects();
  const last = rs[rs.length - 1];
  const y = last.y + last.h + 26;
  const bw = Math.min(172, W * 0.3), bh = 36;
  return { reroll: { x: W / 2 - bw - 8, y, w: bw, h: bh },
           leave:  { x: W / 2 + 8,      y, w: bw, h: bh } };
}
function shopIndexAt(mx, my) {
  const rs = shopRects();
  for (let i = 0; i < shopItems.length; i++) if (inRect(mx, my, rs[i])) return i;
  return -1;
}

function drawButton(r, label, enabled, col) {
  const on = inRect(mouse.x, mouse.y, r) && enabled;
  ctx.save();
  ctx.globalAlpha = enabled ? 1 : 0.4;
  ctx.fillStyle = on ? rgba(col, 0.2) : 'rgba(12,18,30,0.95)';
  roundRect(r.x, r.y, r.w, r.h, 10); ctx.fill();
  ctx.strokeStyle = on ? col : rgba(col, 0.45);
  ctx.lineWidth = on ? 2.2 : 1.3;
  roundRect(r.x, r.y, r.w, r.h, 10); ctx.stroke();
  ctx.font = '700 13px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = col;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 0.5);
  ctx.restore();
}

function drawShop() {
  ctx.fillStyle = 'rgba(3,5,10,0.88)';
  ctx.fillRect(0, 0, W, H);
  const rs = shopRects();
  const hover = shopIndexAt(mouse.x, mouse.y);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '800 13px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = stage.accent;
  ctx.fillText(stage.name + '   ·   SECTOR CLEARED', W / 2, rs[0].y - 78);
  ctx.font = '800 34px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#f1f5f9';
  ctx.fillText('BLACK MARKET', W / 2, rs[0].y - 48);
  ctx.font = '800 20px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#fbbf24';
  ctx.fillText('◈ ' + credits, W / 2, rs[0].y - 20);

  for (let i = 0; i < shopItems.length; i++) {
    const it = shopItems[i], r = rs[i];
    const col = it.kind === 'chip' ? CHIP_COL : RARITY[it.rar];
    const afford = credits >= it.cost && !it.sold;
    const on = hover === i && afford;
    const y = r.y - (on ? 5 : 0);
    const cx = r.x + r.w / 2;

    ctx.save();
    ctx.globalAlpha = it.sold ? 0.3 : 1;
    if (on) { ctx.shadowColor = col; ctx.shadowBlur = 24; }
    ctx.fillStyle = on ? 'rgba(22,32,52,0.98)' : 'rgba(12,18,30,0.96)';
    roundRect(r.x, y, r.w, r.h, 12); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = on ? col : rgba(col, afford ? 0.45 : 0.2);
    ctx.lineWidth = on ? 2.4 : 1.4;
    roundRect(r.x, y, r.w, r.h, 12); ctx.stroke();

    ctx.fillStyle = col;
    roundRect(r.x + 12, y + 12, r.w - 24, 3, 2); ctx.fill();
    ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
    ctx.fillText(it.kind === 'chip' ? 'ONE OF A KIND'
               : it.kind === 'svc' ? 'SERVICE' : it.rar.toUpperCase(), cx, y + 29);

    ctx.save();
