    ctx.strokeStyle = b.col; ctx.lineWidth = b.w;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    ctx.globalAlpha = 0.95;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2, b.w * 0.26);
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
  }
  // flare at every refraction point
  for (const b of finaleBeams) drawGlow(b.x1, b.y1, b.w * 1.1, b.col, 0.6);
  ctx.restore();
}

function drawBeams() {
  for (const b of beams) {
    const t = b.life / b.max;
    ctx.strokeStyle = rgba(b.col, t * 0.85);
    ctx.lineWidth = 2.5 * t + 0.5;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
  }
}

function drawGrid(ox, oy) {
  const S = 64;
  const x0 = Math.floor((-ox) / S) * S, x1 = -ox + W + S;
  const y0 = Math.floor((-oy) / S) * S, y1 = -oy + H + S;
  const pulse = 0.5 + Math.sin(uiTime * 1.3) * 0.12;
  ctx.lineWidth = 1;
  ctx.strokeStyle = COL.grid;
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  for (let x = x0; x < x1; x += S) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
  for (let y = y0; y < y1; y += S) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke();
  // brighter major lines
  ctx.strokeStyle = stage.grid2;
  ctx.globalAlpha = pulse;
  ctx.beginPath();
  for (let x = Math.floor(x0 / (S * 4)) * S * 4; x < x1; x += S * 4) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
  for (let y = Math.floor(y0 / (S * 4)) * S * 4; y < y1; y += S * 4) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawArena() {
  ctx.save();
  ctx.strokeStyle = COL.wall;
  ctx.lineWidth = 4;
  const aw = arena.x1 - arena.x0, ah = arena.y1 - arena.y0;
  const closing = aw < WORLD.w - 4 || ah < WORLD.h - 4;
  ctx.strokeRect(arena.x0, arena.y0, aw, ah);
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = closing ? 'rgba(94,234,212,0.4)' : stage.glow;
  ctx.lineWidth = closing ? 20 : 12;
  ctx.strokeRect(arena.x0, arena.y0, aw, ah);
  ctx.restore();
}

function poly(x, y, r, sides, ang) {
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const a = ang + i * TAU / sides;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

function drawEnemies() {
  for (const e of enemies) {
    if (e.dead) continue;
    // intangible enemies fade out; they can't be hit while faint
    const ea = e.phased || e.invuln ? 0.3 : 1;

    // glow
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(e.x, e.y, e.r * (e.type === 'boss' ? 3.4 : 2.3), e.col, (0.34 + e.flash * 0.3) * ea);
    if (e.elite) drawGlow(e.x, e.y, e.r * 3, COL.elite, 0.22 * ea);
    ctx.globalCompositeOperation = 'source-over';

    ctx.save();
    ctx.globalAlpha = ea;
    ctx.lineWidth = e.type === 'boss' ? 4 : 2.2;
    // flash brightens the fill but never erases the silhouette — a boss under
    // continuous fire has to stay legible
    ctx.fillStyle = rgba(e.col, 0.16 + e.flash * 0.46);
    ctx.strokeStyle = e.flash > 0.5 ? '#ffffff' : e.col;
    poly(e.x, e.y, e.r, e.sides, e.ang);
    ctx.fill(); ctx.stroke();

    // THE OTHER, awakened: eight jointed legs that grow in during the
    // transition and scuttle faster the angrier it gets
    if (e.boss === 'theother' && e.legs > 0) {
      const grow = e.legs;
      const charging = e.rage === 1;
      const stunned = e.rage === 2;
      const beat = uiTime * (charging ? 22 : stunned ? 2 : 7);
      ctx.save();
      ctx.strokeStyle = stunned ? '#fde047' : '#5eead4';
      ctx.lineCap = 'round';
      for (let k = 0; k < 8; k++) {
        const side = k < 4 ? 1 : -1;
        const spread = ((k % 4) - 1.5) * 0.42;
        const base = e.ang + Math.PI / 2 * side + spread * side;
        const sw = Math.sin(beat + k * 1.1);
        const L1 = (30 + sw * 5) * grow, L2 = (34 + sw * 7) * grow;
        const hipX = e.x + Math.cos(base) * e.r * 0.8;
        const hipY = e.y + Math.sin(base) * e.r * 0.8;
        // knee kicks outward and up; the foot then reaches back down
        const kneeA = base + (stunned ? 0.5 : 0.75) + sw * 0.22;
        const kx = hipX + Math.cos(kneeA) * L1;
        const ky = hipY + Math.sin(kneeA) * L1 - (charging ? 10 : 16) * grow;
        const footA = kneeA + (stunned ? 0.4 : 1.05) + Math.cos(beat + k) * 0.28;
        const fx = kx + Math.cos(footA) * L2;
        const fy = ky + Math.sin(footA) * L2;
        ctx.globalAlpha = ea * 0.9;
        ctx.lineWidth = 4.5 * grow;
        ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(kx, ky); ctx.stroke();
        ctx.lineWidth = 3 * grow;
        ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
        ctx.globalAlpha = ea;
      }
      ctx.restore();
      if (charging) {           // a hard line showing exactly where it committed
        ctx.save();
        ctx.globalAlpha = 0.3;
        ctx.strokeStyle = '#5eead4'; ctx.lineWidth = 2;
        ctx.setLineDash([14, 10]);
        ctx.beginPath(); ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.x + Math.cos(e.chargeAng) * 900, e.y + Math.sin(e.chargeAng) * 900);
        ctx.stroke();
        ctx.restore();
      }
    }

    // sentinel: the frontal shield that deflects shots, drawn where it blocks
    if (e.type === 'sentinel') {
      ctx.strokeStyle = '#bae6fd'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 9, e.ang - 1.15, e.ang + 1.15);
      ctx.stroke();
      ctx.globalAlpha = ea * 0.35; ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 9, e.ang - 1.15, e.ang + 1.15);
      ctx.stroke();
      ctx.globalAlpha = ea;
    }
    // forgeheart: rotating armour plates — the gaps are the only way in
    if (e.boss === 'forgeheart') {
      const seg = TAU / 4;
      ctx.lineWidth = 11;
      ctx.strokeStyle = '#fbbf24';
      for (let k = 0; k < 4; k++) {
        const a0 = e.plateAng + k * seg;
        ctx.globalAlpha = ea * 0.85;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r + 24, a0, a0 + seg * 0.62);
        ctx.stroke();
      }
      ctx.globalAlpha = ea;
    }

    if (e.elite) {
      ctx.strokeStyle = COL.elite; ctx.lineWidth = 1.6;
      poly(e.x, e.y, e.r + 6, e.sides, -e.ang * 0.6);
      ctx.stroke();
    }
    if (e.psn > 0) {
      ctx.strokeStyle = 'rgba(163,230,53,0.95)'; ctx.lineWidth = 2;
      poly(e.x, e.y, e.r * 0.78, 3, -e.t * 3); ctx.stroke();
      ctx.fillStyle = '#a3e635';
      ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(String(e.psn), e.x, e.y - e.r - 18);
    }
    if (e.slow > 0) {
      ctx.strokeStyle = 'rgba(147,197,253,0.9)'; ctx.lineWidth = 2;
      poly(e.x, e.y, e.r * 0.6, 6, e.t * 2);
      ctx.stroke();
    }
    // inner detail
    if (e.type === 'boss') {
      ctx.strokeStyle = rgba('#fca5a5', 0.8); ctx.lineWidth = 2;
      poly(e.x, e.y, e.r * 0.62, 3, -e.ang * 1.7); ctx.stroke();
      poly(e.x, e.y, e.r * 0.36, 3, e.ang * 2.4 + 1); ctx.stroke();
    } else if (e.type === 'turret') {
      ctx.strokeStyle = rgba('#bfdbfe', 0.9); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.45, 0, TAU); ctx.stroke();
    } else if (e.type === 'brute') {
      ctx.strokeStyle = rgba('#fecdd3', 0.7); ctx.lineWidth = 1.6;
      poly(e.x, e.y, e.r * 0.5, 6, -e.ang); ctx.stroke();
    } else if (e.type === 'healer') {
      ctx.strokeStyle = rgba('#a7f3d0', 0.95); ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(e.x - e.r * 0.5, e.y); ctx.lineTo(e.x + e.r * 0.5, e.y);
      ctx.moveTo(e.x, e.y - e.r * 0.5); ctx.lineTo(e.x, e.y + e.r * 0.5);
      ctx.stroke();
      ctx.globalAlpha = ea * (0.12 + Math.sin(uiTime * 3) * 0.05);
      ctx.beginPath(); ctx.arc(e.x, e.y, 270, 0, TAU); ctx.stroke();
      ctx.globalAlpha = ea;
    } else if (e.type === 'artillery') {
      ctx.strokeStyle = rgba('#fed7aa', 0.85); ctx.lineWidth = 2;
      poly(e.x, e.y, e.r * 0.5, 3, e.ang * 1.6); ctx.stroke();
    } else if (e.type === 'phaser') {
      ctx.strokeStyle = rgba('#f5d0fe', 0.85); ctx.lineWidth = 1.8;
      poly(e.x, e.y, e.r * 0.55, 6, -e.ang * 2); ctx.stroke();
    } else if (e.type === 'wraith') {
      ctx.strokeStyle = rgba('#ddd6fe', 0.8); ctx.lineWidth = 1.6;
      poly(e.x, e.y, e.r * 0.55, 4, e.ang + 0.8); ctx.stroke();
    } else if (e.type === 'revenant') {
      // a ghost wears its second life openly
      ctx.strokeStyle = rgba('#f8fafc', e.gen > 0 ? 0.95 : 0.6);
      ctx.lineWidth = e.gen > 0 ? 2.4 : 1.6;
      poly(e.x, e.y, e.r * 0.55, 5, -e.ang * 1.4); ctx.stroke();
      if (e.gen > 0) {
        ctx.globalAlpha = ea * (0.3 + Math.sin(uiTime * 6) * 0.15);
        poly(e.x, e.y, e.r * 1.35, 5, e.ang); ctx.stroke();
        ctx.globalAlpha = ea;
      }
    } else if (e.type === 'redactor') {
      // the erasure cone, drawn exactly where it eats your shots
      ctx.save();
      ctx.globalAlpha = ea * (e.redacting ? 0.2 : 0.05);
      ctx.fillStyle = e.redacting ? '#ef4444' : '#64748b';
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.arc(e.x, e.y, 330, e.ang - 0.55, e.ang + 0.55);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = ea * (e.redacting ? 0.6 : 0.25);
      ctx.strokeStyle = e.redacting ? '#f87171' : '#475569';
      ctx.lineWidth = e.redacting ? 2.2 : 1.2;
      ctx.setLineDash(e.redacting ? [] : [12, 9]); ctx.lineDashOffset = -uiTime * 20;
      ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = rgba('#fecaca', 0.9); ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(e.x - e.r * 0.5, e.y); ctx.lineTo(e.x + e.r * 0.5, e.y);
      ctx.stroke();
    } else if (e.type === 'mimic') {
      // it wears your silhouette
      ctx.save();
      ctx.translate(e.x, e.y); ctx.rotate(e.ang);
      ctx.strokeStyle = '#99f6e4'; ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(13, 0); ctx.lineTo(-7, 8); ctx.lineTo(-4, 0); ctx.lineTo(-7, -8);
      ctx.closePath(); ctx.stroke();
      ctx.restore();
    } else if (e.type === 'prism') {
      // the mirrored half is drawn solid; the open half is the way in
      ctx.strokeStyle = '#cffafe'; ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 7, e.plateAng - 1.3, e.plateAng + 1.3);
      ctx.stroke();
      ctx.globalAlpha = ea * 0.35; ctx.lineWidth = 11;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 7, e.plateAng - 1.3, e.plateAng + 1.3);
      ctx.stroke();
      ctx.globalAlpha = ea;
    } else if (e.type === 'egg') {
      const pulse = 0.5 + Math.sin(e.atkT * 7) * 0.5;
      ctx.strokeStyle = rgba('#bbf7d0', 0.5 + pulse * 0.5); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (0.3 + pulse * 0.3), 0, TAU); ctx.stroke();
    }
    ctx.restore();

    // dasher telegraph
    if (e.type === 'dasher' && e.state === 1) {
      ctx.save();
      ctx.globalAlpha = 0.35 + Math.sin(e.t * 30) * 0.2;
      ctx.strokeStyle = e.col; ctx.lineWidth = 2;
      ctx.setLineDash([10, 8]);
      ctx.beginPath(); ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + Math.cos(e.ang) * 520, e.y + Math.sin(e.ang) * 520);
      ctx.stroke();
      ctx.restore();
    }
    // bomber fuse
    if (e.type === 'bomber' && e.atkT > 0) {
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#fed7aa'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 8 + Math.sin(e.atkT * 26) * 4, 0, TAU); ctx.stroke();
      ctx.restore();
    }

    // health pip for tanky enemies
    if (e.hp < e.maxHp && e.type !== 'boss' && e.maxHp > 40) {
      const w = e.r * 2, h = 3;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(e.x - w / 2, e.y - e.r - 11, w, h);
      ctx.fillStyle = e.elite ? COL.elite : e.col;
      ctx.fillRect(e.x - w / 2, e.y - e.r - 11, w * clamp(e.hp / e.maxHp, 0, 1), h);
    }
  }
}

function drawCorpses() {
  for (const c of corpses) {
    const t = c.life / c.max;
    ctx.save();
    ctx.globalAlpha = t * 0.7;
    ctx.strokeStyle = c.col; ctx.lineWidth = 2;
    poly(c.x, c.y, c.r * (1 + (1 - t) * 1.5), c.sides, c.ang + (1 - t) * 2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawPlayer() {
  const blink = P.iframe > 0 && Math.floor(P.iframe * 22) % 2 === 0;

  // faint pickup-radius ring — shows magnet range and, more importantly, keeps
  // the ship findable when the screen is full of enemies
  ctx.save();
  ctx.globalAlpha = 0.11;
  ctx.strokeStyle = COL.xp; ctx.lineWidth = 1;
  ctx.setLineDash([6, 10]);
  ctx.lineDashOffset = -uiTime * 16;
  ctx.beginPath(); ctx.arc(P.x, P.y, P.pickupR, 0, TAU); ctx.stroke();
  ctx.restore();

  // FORGE LEDGER: the borrowed plates, drawn where they actually block
  if (P.plateT > 0) {
    const fade = clamp(P.plateT / 1.2, 0, 1);
    ctx.save();
    ctx.globalAlpha = fade * 0.9;
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 9;
    const seg = TAU / 4;
    for (let k = 0; k < 4; k++) {
      const a0 = P.plateAng + k * seg;
      ctx.beginPath();
      ctx.arc(P.x, P.y, 62, a0, a0 + seg * 0.62);
      ctx.stroke();
    }
    ctx.restore();
  }
  // BROOD FOLIO: under the floor, barely there
  if (P.burrowT > 0) {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 2;
    ctx.setLineDash([9, 7]); ctx.lineDashOffset = -uiTime * 24;
    ctx.beginPath(); ctx.arc(P.x, P.y, 30 + Math.sin(uiTime * 8) * 4, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
  // LEO: the corona, drawn at exactly the radius that burns
  if (P.sun) {
    const R = 130 + 40 * P.sun;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(P.x, P.y, R * 0.95, '#fbbf24', 0.2);
    ctx.globalAlpha = 0.45 + Math.sin(uiTime * 3) * 0.12;
    ctx.strokeStyle = '#fde047'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(P.x, P.y, R, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.3;
    for (let i = 0; i < 12; i++) {
      const a = uiTime * 0.5 + i * TAU / 12;
      const r0 = R * 0.86, r1 = R * (1.02 + Math.sin(uiTime * 4 + i) * 0.05);
      ctx.beginPath();
      ctx.moveTo(P.x + Math.cos(a) * r0, P.y + Math.sin(a) * r0);
      ctx.lineTo(P.x + Math.cos(a) * r1, P.y + Math.sin(a) * r1);
      ctx.stroke();
    }
    ctx.restore();
  }

  // GEMINI: the twin, mirrored through the centre of the arena
  if (twinActive()) {
    const t = twinPos();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(t.x, t.y, 44, '#c4b5fd', 0.4);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.72;
    ctx.translate(t.x, t.y); ctx.rotate(P.twinAng);
    ctx.strokeStyle = '#c4b5fd'; ctx.fillStyle = 'rgba(196,181,253,0.18)';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(16, 0); ctx.lineTo(-9, 10); ctx.lineTo(-5, 0); ctx.lineTo(-9, -10);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  ctx.globalCompositeOperation = 'lighter';
  drawGlow(P.x, P.y, 46, P.hurtFlash > 0 ? '#ef4444' : COL.player, 0.5);
  ctx.globalCompositeOperation = 'source-over';

  // shields
  for (let i = 0; i < P.shield; i++) {
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = COL.shield; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(P.x, P.y, P.r + 9 + i * 5, uiTime * 1.4 + i, uiTime * 1.4 + i + 4.6);
    ctx.stroke();
    ctx.restore();
  }
  // drones
  if (P.drones) {
    const R = 62 + P.drones * 7;
    for (let i = 0; i < P.drones; i++) {
      const a = P.droneAng + i * TAU / P.drones;
      const dx = P.x + Math.cos(a) * R, dy = P.y + Math.sin(a) * R;
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(dx, dy, 22, '#a78bfa', 0.6);
      ctx.globalCompositeOperation = 'source-over';
      ctx.save();
      ctx.strokeStyle = '#c4b5fd'; ctx.fillStyle = 'rgba(167,139,250,0.3)'; ctx.lineWidth = 2;
      poly(dx, dy, 8, 3, a * 3);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  if (blink) return;
  ctx.save();
  ctx.translate(P.x, P.y);
  ctx.rotate(P.ang);
  ctx.lineWidth = 2.4;
  ctx.strokeStyle = P.hurtFlash > 0 ? '#fecaca' : COL.player;
  ctx.fillStyle = P.hurtFlash > 0 ? 'rgba(239,68,68,0.5)' : 'rgba(103,232,249,0.18)';
  ctx.beginPath();
  ctx.moveTo(16, 0);
  ctx.lineTo(-9, 10);
  ctx.lineTo(-5, 0);
  ctx.lineTo(-9, -10);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // cockpit
  ctx.fillStyle = '#e0f2fe';
  ctx.beginPath(); ctx.arc(2, 0, 2.6, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawBullets() {
  for (const b of bullets) {
    // zodiac rounds read differently at a glance
    const c = b.arrow ? '#fcd34d' : b.venom ? '#a3e635' : b.solar ? '#fb923c'
            : b.deep ? '#38bdf8' : b.crit ? COL.crit : COL.bullet;
    const s = len(b.vx, b.vy) || 1;
    const tail = b.arrow ? 46 : b.deep ? 8 : 15;
    drawGlow(b.x, b.y, b.r * (b.arrow ? 5.4 : 4.6), c, 0.72);
    ctx.strokeStyle = rgba(c, 0.55);
    ctx.lineWidth = b.r * (b.arrow ? 1.1 : 1.5);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx / s * tail, b.y - b.vy / s * tail);
    ctx.stroke();
    if (b.arrow) {                       // a barbed head, pointing where it flies
      const a = Math.atan2(b.vy, b.vx);
      ctx.strokeStyle = '#fffbeb'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.x + Math.cos(a) * 9, b.y + Math.sin(a) * 9);
      ctx.lineTo(b.x + Math.cos(a + 2.5) * 8, b.y + Math.sin(a + 2.5) * 8);
      ctx.moveTo(b.x + Math.cos(a) * 9, b.y + Math.sin(a) * 9);
      ctx.lineTo(b.x + Math.cos(a - 2.5) * 8, b.y + Math.sin(a - 2.5) * 8);
      ctx.stroke();
    }
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.62, 0, TAU); ctx.fill();
  }
}

function drawEBullets() {
  for (const b of ebullets) {
    drawGlow(b.x, b.y, b.r * 4, b.col, 0.7);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.5, 0, TAU); ctx.fill();
  }
}

function drawParticles() {
  for (const p of parts) {
    const t = p.life / p.max;
    drawGlow(p.x, p.y, p.r * 3.4 * (0.4 + t * 0.9), p.color, t * 0.75);
  }
}

function drawGems() {
  const pu = Math.sin(uiTime * 6) * 0.2 + 0.9;
  for (const g of gems) {
    const fade = g.life < 3 ? (Math.floor(g.life * 7) % 2 ? 0.3 : 1) : 1;
    drawGlow(g.x, g.y, g.r * 3.6 * pu, COL.xp, 0.72 * fade);
  }
}

function drawDrops() {
  for (const d of drops) {
    const s = 1 + Math.sin(d.t) * 0.16;
    drawGlow(d.x, d.y, d.r * 3.4 * s, d.col, 0.8);
  }
}
function drawArcs() {
  for (const a of arcs) {
    const t = a.life / a.max;
    ctx.strokeStyle = rgba(a.col, t);
    ctx.lineWidth = 3 * t + 1;
    ctx.beginPath();
    // jagged lightning
    const segs = 6;
    ctx.moveTo(a.x1, a.y1);
    for (let i = 1; i < segs; i++) {
      const f = i / segs;
      const nx = lerp(a.x1, a.x2, f) + rnd(16, -16);
      const ny = lerp(a.y1, a.y2, f) + rnd(16, -16);
      ctx.lineTo(nx, ny);
    }
    ctx.lineTo(a.x2, a.y2);
    ctx.stroke();
  }
}

function drawRings() {
  for (const r of rings) {
    const t = r.life / r.max;
    ctx.strokeStyle = rgba(r.color, t * 0.9);
    ctx.lineWidth = r.lw * t + 0.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
}

function drawFloats() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const f of floats) {
    const t = f.life / f.max;
    ctx.globalAlpha = clamp(t * 1.6, 0, 1);
    ctx.font = `700 ${f.size}px Segoe UI, system-ui, sans-serif`;
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.75)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // low-health pulse
  const hf = P.hp / P.maxHp;
  if (state === 'play' && hf < 0.34) {
    const a = (0.34 - hf) * (0.6 + Math.sin(uiTime * 7) * 0.4);
    const g2 = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.7);
    g2.addColorStop(0, 'rgba(239,68,68,0)');
    g2.addColorStop(1, `rgba(239,68,68,${a})`);
    ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
  }
}

function drawCrosshair() {
  const x = mouse.x, y = mouse.y;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = rgba(COL.player, 0.85);
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(x, y, 11, 0, TAU); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x - 17, y); ctx.lineTo(x - 6, y);
  ctx.moveTo(x + 6, y); ctx.lineTo(x + 17, y);
  ctx.moveTo(x, y - 17); ctx.lineTo(x, y - 6);
  ctx.moveTo(x, y + 6); ctx.lineTo(x, y + 17);
  ctx.stroke();
  ctx.fillStyle = rgba(COL.player, 0.9);
  ctx.fillRect(x - 1, y - 1, 2, 2);
  ctx.restore();
}

/* ---------------------------------- HUD ----------------------------------- */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawHUD() {
  const pad = 18;
  ctx.textBaseline = 'middle';

  /* --- health bar --- */
  const bw = Math.min(340, W * 0.4), bh = 16;
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(8,12,20,0.72)';
  roundRect(pad, pad, bw, bh, 8); ctx.fill();
  const hf = clamp(P.hp / P.maxHp, 0, 1);
  const hc = hf > 0.5 ? COL.hp : hf > 0.25 ? '#facc15' : '#ef4444';
  ctx.fillStyle = hc;
  roundRect(pad + 2, pad + 2, Math.max(0, (bw - 4) * hf), bh - 4, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(148,163,184,0.35)'; ctx.lineWidth = 1;
  roundRect(pad, pad, bw, bh, 8); ctx.stroke();
  ctx.font = '600 11px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#0b1220';
  ctx.fillText(`${Math.ceil(P.hp)} / ${Math.round(P.maxHp)}`, pad + 9, pad + bh / 2 + 0.5);

  /* --- xp bar --- */
  const yb = pad + bh + 7;
  ctx.fillStyle = 'rgba(8,12,20,0.72)';
  roundRect(pad, yb, bw, 9, 5); ctx.fill();
  ctx.fillStyle = COL.xp;
  roundRect(pad + 1.5, yb + 1.5, Math.max(0, (bw - 3) * clamp(P.xp / P.xpNext, 0, 1)), 6, 3); ctx.fill();

  /* --- level + dash pips --- */
  ctx.font = '700 13px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#7dd3fc';
  ctx.fillText('LV ' + P.level, pad, yb + 26);

  let dx = pad + 58;
  for (let i = 0; i < P.dashMax; i++) {
    const filled = i < P.dashCh;
    const partial = i === P.dashCh ? clamp(P.dashRe / P.dashCd, 0, 1) : 0;
    ctx.fillStyle = 'rgba(148,163,184,0.22)';
    roundRect(dx, yb + 20, 22, 6, 3); ctx.fill();
    if (filled || partial > 0) {
      ctx.fillStyle = filled ? COL.player : rgba(COL.player, 0.5);
      roundRect(dx, yb + 20, 22 * (filled ? 1 : partial), 6, 3); ctx.fill();
    }
    dx += 26;
  }
  if (P.shieldMax) {
    for (let i = 0; i < P.shieldMax; i++) {
      ctx.fillStyle = i < P.shield ? COL.shield : 'rgba(129,140,248,0.2)';
      ctx.beginPath(); ctx.arc(dx + 6, yb + 23, 4.5, 0, TAU); ctx.fill();
      dx += 14;
    }
  }

  /* --- carried book --- */
  if (P.book) {
    const ready = P.bookCharge >= P.book.cost;
    const by = yb + 40;
    ctx.textAlign = 'left';
    ctx.font = '700 10px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = ready ? P.book.col : '#475569';
    ctx.fillText('[Q] ' + P.book.n, pad, by);
    let qx = pad;
    for (let i = 0; i < P.book.cost; i++) {
      ctx.fillStyle = i < P.bookCharge ? P.book.col : 'rgba(148,163,184,0.22)';
      roundRect(qx, by + 8, 16, 5, 3); ctx.fill();
      qx += 20;
    }
    if (ready) {
      ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
      ctx.fillStyle = P.book.col;
      ctx.globalAlpha = 0.6 + Math.sin(uiTime * 5) * 0.4;
      ctx.fillText('READY', qx + 6, by + 11);
      ctx.globalAlpha = 1;
    }
  }

  /* --- score / wave --- */
  ctx.textAlign = 'right';
  ctx.font = '800 26px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#e2e8f0';
  ctx.fillText(score.toLocaleString(), W - pad, pad + 12);
  ctx.font = '600 12px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.fillText('BEST ' + Math.max(Save.profile.best, score).toLocaleString(), W - pad, pad + 32);
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(`WAVE ${wave}   ·   ${P.kills} KILLS   ·   ${fmtTime(elapsed)}`, W - pad, pad + 50);
  // sector + credits
  ctx.font = '700 12px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = stage.accent;
  ctx.fillText(stage.name + (loopNum > 0 ? '  ×' + (loopNum + 1) : '') +
               '   ' + (((wave - 1) % 5) + 1) + '/5', W - pad, pad + 70);
  ctx.font = '800 15px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#fbbf24';
  ctx.fillText('◈ ' + credits, W - pad, pad + 92);

  /* --- boss bar --- */
  const boss = enemies.find(e => e.type === 'boss' && !e.dead);
  if (boss) {
    const w2 = Math.min(560, W * 0.62), x2 = (W - w2) / 2, y2 = 22;
    ctx.textAlign = 'center';
    const bd = BOSSES[boss.boss] || BOSSES.warden;
    ctx.fillStyle = 'rgba(8,12,20,0.75)';
    roundRect(x2, y2, w2, 14, 7); ctx.fill();
    ctx.fillStyle = bd.col;
    roundRect(x2 + 2, y2 + 2, Math.max(0, (w2 - 4) * clamp(boss.hp / boss.maxHp, 0, 1)), 10, 5); ctx.fill();
    ctx.strokeStyle = rgba(bd.col, 0.5); ctx.lineWidth = 1;
    roundRect(x2, y2, w2, 14, 7); ctx.stroke();
    ctx.font = '700 12px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = bd.col;
    ctx.fillText(bd.name + (boss.invuln
      ? (boss.finale ? '   — OVERLOAD'
         : boss.boss === 'broodmother' ? '   — SUBMERGED' : '   — CHANGING') : ''),
      W / 2, y2 + 28);
    // offscreen indicator
    const sx = boss.x - cam.x + W / 2, sy = boss.y - cam.y + H / 2;
    if (sx < 0 || sy < 0 || sx > W || sy > H) {
      const a = Math.atan2(boss.y - cam.y, boss.x - cam.x);
      const rx = W / 2 + Math.cos(a) * (Math.min(W, H) * 0.42);
      const ry = H / 2 + Math.sin(a) * (Math.min(W, H) * 0.42);
      ctx.save();
      ctx.translate(rx, ry); ctx.rotate(a);
      ctx.fillStyle = rgba(bd.col, 0.85);
      ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-8, 8); ctx.lineTo(-8, -8); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  /* --- banner --- */
  if (bannerT > 0) {
    const t = bannerT / 2.2;
    const a = clamp(Math.min(t * 3.4, (1 - t) * 6), 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.font = '800 40px Segoe UI, system-ui, sans-serif';
    ctx.shadowColor = bannerCol; ctx.shadowBlur = 26;
    ctx.fillStyle = bannerCol;
    ctx.fillText(bannerText, W / 2, H * 0.28 - (1 - a) * 14);
    ctx.restore();
  }

  /* --- build chips (owned upgrades) — hidden under full-screen overlays --- */
  const owned = state === 'play' ? Object.keys(P.up) : [];
  if (owned.length) {
    ctx.textAlign = 'left';
    ctx.font = '600 10px Segoe UI, system-ui, sans-serif';
    let cx = pad, cy = H - pad - 8;
    for (const id of owned) {
      const u = UPGRADES.find(z => z.id === id);
      if (!u) continue;
      const label = u.n + (P.up[id] > 1 ? ' ×' + P.up[id] : '');
      const w3 = ctx.measureText(label).width + 14;
      if (cx + w3 > W - pad) { cx = pad; cy -= 20; }
      ctx.fillStyle = 'rgba(15,23,42,0.7)';
      roundRect(cx, cy - 8, w3, 16, 8); ctx.fill();
      ctx.strokeStyle = rgba(RARITY[u.rar], 0.55); ctx.lineWidth = 1;
      roundRect(cx, cy - 8, w3, 16, 8); ctx.stroke();
      ctx.fillStyle = RARITY[u.rar];
      ctx.fillText(label, cx + 7, cy + 0.5);
      cx += w3 + 5;
    }
  }
}

function fmtTime(s) {
  const m = Math.floor(s / 60), r = Math.floor(s % 60);
  return m + ':' + String(r).padStart(2, '0');
}

/* ------------------------------ level-up UI -------------------------------- */
function cardRects() {
  const n = offers.length || 3;
  const cw = Math.min(268, (W - 60) / n - 16), ch = Math.min(300, H * 0.5);
  const gap = 18;
  const total = n * cw + (n - 1) * gap;
  const x0 = (W - total) / 2, y0 = (H - ch) / 2 + 16;
  const out = [];
  for (let i = 0; i < n; i++) out.push({ x: x0 + i * (cw + gap), y: y0, w: cw, h: ch });
  return out;
}
function offerIndexAt(mx, my) {
  const rs = cardRects();
  for (let i = 0; i < offers.length; i++) {
    const r = rs[i];
    if (mx > r.x && mx < r.x + r.w && my > r.y && my < r.y + r.h) return i;
  }
  return -1;
}

function drawLevelUp() {
  ctx.fillStyle = 'rgba(3,5,10,0.82)';
  ctx.fillRect(0, 0, W, H);
  const rs = cardRects();
  const hover = offerIndexAt(mouse.x, mouse.y);

  ctx.textAlign = 'center';
  ctx.font = '800 15px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = COL.player;
  ctx.fillText('LEVEL ' + P.level, W / 2, rs[0].y - 62);
  ctx.font = '800 34px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#f1f5f9';
  ctx.fillText('CHOOSE AN UPGRADE', W / 2, rs[0].y - 34);

  for (let i = 0; i < offers.length; i++) {
    const u = offers[i], r = rs[i];
    const col = RARITY[u.rar];
    const on = hover === i;
    const lift = on ? 6 : 0;
    const y = r.y - lift;

    ctx.save();
    if (on) { ctx.shadowColor = col; ctx.shadowBlur = 28; }
    ctx.fillStyle = on ? 'rgba(22,32,52,0.98)' : 'rgba(12,18,30,0.96)';
    roundRect(r.x, y, r.w, r.h, 14); ctx.fill();
    ctx.restore();

    ctx.strokeStyle = on ? col : rgba(col, 0.45);
    ctx.lineWidth = on ? 2.4 : 1.4;
    roundRect(r.x, y, r.w, r.h, 14); ctx.stroke();

    // rarity strip
    ctx.fillStyle = col;
    roundRect(r.x + 14, y + 16, r.w - 28, 3, 2); ctx.fill();

    // icon
    const cxp = r.x + r.w / 2, cyp = y + 84;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(cxp, cyp, 52, col, on ? 0.55 : 0.34);
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = col; ctx.lineWidth = 2.4;
    ctx.fillStyle = rgba(col, 0.14);
    const sides = 3 + (i + u.n.length) % 5;
    poly(cxp, cyp, 26, sides, uiTime * (on ? 1.4 : 0.5) + i);
    ctx.fill(); ctx.stroke();
    poly(cxp, cyp, 13, sides, -uiTime * (on ? 1.9 : 0.7) + i);
    ctx.stroke();
    ctx.restore();

    ctx.textAlign = 'center';
    ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = col;
    ctx.fillText(u.rar.toUpperCase(), cxp, y + 34);

    ctx.font = '800 19px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#f8fafc';
    ctx.fillText(u.n, cxp, y + 140);

    ctx.font = '400 13px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#94a3b8';
    wrapText(u.d, cxp, y + 168, r.w - 36, 17);

    // stack pips
    const have = P.up[u.id] || 0;
    const pw = 12, tw = u.max * pw;
    for (let k = 0; k < u.max; k++) {
      ctx.fillStyle = k < have ? col : 'rgba(148,163,184,0.22)';
      roundRect(cxp - tw / 2 + k * pw, y + r.h - 44, 8, 4, 2); ctx.fill();
    }

    ctx.font = '700 11px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = on ? col : '#475569';
    ctx.fillText('[ ' + (i + 1) + ' ]', cxp, y + r.h - 22);
  }
  ctx.textAlign = 'center';
  ctx.font = '500 11px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#475569';
  ctx.fillText('CLICK OR PRESS 1 / 2 / 3', W / 2, rs[0].y + rs[0].h + 30);
}

function wrapText(text, x, y, maxW, lh) {
  const words = String(text).split(' ');
  let line = '', yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, yy); line = w; yy += lh;
    } else line = test;
  }
  if (line) ctx.fillText(line, x, yy);
}

/* --------------------------------- shop UI --------------------------------- */
function shopRects() {
  const cols = 3, rows = 2, gx = 16, gy = 16;
  const cw = Math.min(230, (W - 90) / cols - gx);
  const ch = Math.min(178, (H - 250) / rows - gy);
  const tw = cols * cw + (cols - 1) * gx;
  const th = rows * ch + (rows - 1) * gy;
  const x0 = (W - tw) / 2, y0 = (H - th) / 2 - 4;
  const out = [];
  for (let i = 0; i < cols * rows; i++)
    out.push({ x: x0 + (i % cols) * (cw + gx), y: y0 + ((i / cols) | 0) * (ch + gy), w: cw, h: ch });
  return out;
}
function shopButtons() {
  const rs = shopRects();
  const last = rs[rs.length - 1];
  const y = last.y + last.h + 26;
  const bw = Math.min(172, W * 0.3), bh = 36;
  return { reroll: { x: W / 2 - bw - 8, y, w: bw, h: bh },
           leave:  { x: W / 2 + 8,      y, w: bw, h: bh } };
}
function shopIndexAt(mx, my) {
  const rs = shopRects();
  for (let i = 0; i < shopItems.length; i++) if (inRect(mx, my, rs[i])) return i;
  return -1;
}

function drawButton(r, label, enabled, col) {
  const on = inRect(mouse.x, mouse.y, r) && enabled;
  ctx.save();
  ctx.globalAlpha = enabled ? 1 : 0.4;
  ctx.fillStyle = on ? rgba(col, 0.2) : 'rgba(12,18,30,0.95)';
  roundRect(r.x, r.y, r.w, r.h, 10); ctx.fill();
  ctx.strokeStyle = on ? col : rgba(col, 0.45);
  ctx.lineWidth = on ? 2.2 : 1.3;
  roundRect(r.x, r.y, r.w, r.h, 10); ctx.stroke();
  ctx.font = '700 13px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = col;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 0.5);
  ctx.restore();
}

function drawShop() {
  ctx.fillStyle = 'rgba(3,5,10,0.88)';
  ctx.fillRect(0, 0, W, H);
  const rs = shopRects();
  const hover = shopIndexAt(mouse.x, mouse.y);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '800 13px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = stage.accent;
  ctx.fillText(stage.name + '   ·   SECTOR CLEARED', W / 2, rs[0].y - 78);
  ctx.font = '800 34px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#f1f5f9';
  ctx.fillText('BLACK MARKET', W / 2, rs[0].y - 48);
  ctx.font = '800 20px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#fbbf24';
  ctx.fillText('◈ ' + credits, W / 2, rs[0].y - 20);

  for (let i = 0; i < shopItems.length; i++) {
    const it = shopItems[i], r = rs[i];
    const col = RARITY[it.rar];
    const afford = credits >= it.cost && !it.sold;
    const on = hover === i && afford;
    const y = r.y - (on ? 5 : 0);
    const cx = r.x + r.w / 2;

    ctx.save();
    ctx.globalAlpha = it.sold ? 0.3 : 1;
    if (on) { ctx.shadowColor = col; ctx.shadowBlur = 24; }
    ctx.fillStyle = on ? 'rgba(22,32,52,0.98)' : 'rgba(12,18,30,0.96)';
    roundRect(r.x, y, r.w, r.h, 12); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = on ? col : rgba(col, afford ? 0.45 : 0.2);
    ctx.lineWidth = on ? 2.4 : 1.4;
    roundRect(r.x, y, r.w, r.h, 12); ctx.stroke();

    ctx.fillStyle = col;
    roundRect(r.x + 12, y + 12, r.w - 24, 3, 2); ctx.fill();
    ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
    ctx.fillText(it.kind === 'svc' ? 'SERVICE' : it.rar.toUpperCase(), cx, y + 29);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(cx, y + 63, 34, col, on ? 0.5 : 0.3);
    ctx.restore();
    ctx.strokeStyle = col; ctx.fillStyle = rgba(col, 0.14); ctx.lineWidth = 2.2;
    poly(cx, y + 63, 19, 3 + (i + it.name.length) % 5, uiTime * (on ? 1.3 : 0.45) + i);
    ctx.fill(); ctx.stroke();

    ctx.font = '800 16px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#f8fafc';
    ctx.fillText(it.name, cx, y + 101);
    ctx.font = '400 11px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#94a3b8';
    wrapText(it.desc, cx, y + 121, r.w - 26, 14);

    if (it.kind === 'up') {                       // stack pips
      const have = P.up[it.up.id] || 0, pw = 10, tw2 = it.up.max * pw;
      for (let k = 0; k < it.up.max; k++) {
        ctx.fillStyle = k < have ? col : 'rgba(148,163,184,0.22)';
        roundRect(cx - tw2 / 2 + k * pw, y + r.h - 40, 7, 3.5, 2); ctx.fill();
      }
    }
    if (it.sold) {
      ctx.font = '800 14px Segoe UI, system-ui, sans-serif';
      ctx.fillStyle = '#64748b';
      ctx.fillText('SOLD', cx, y + r.h - 20);
    } else {
      ctx.font = '800 14px Segoe UI, system-ui, sans-serif';
      ctx.fillStyle = afford ? '#fbbf24' : '#9f1239';
      ctx.fillText('◈ ' + it.cost, cx, y + r.h - 24);
      ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
      ctx.fillStyle = on ? col : '#475569';
      ctx.fillText('[ ' + (i + 1) + ' ]', cx, y + r.h - 9);
    }
    ctx.restore();
  }

  const b = shopButtons();
  const rcost = 30 + shopRerolls * 25;
  drawButton(b.reroll, 'REROLL  ◈' + rcost, credits >= rcost, '#38bdf8');
  drawButton(b.leave, 'CONTINUE  ▸', true, COL.hp);

  ctx.textAlign = 'center';
  if (shopMsgT > 0) {
    ctx.globalAlpha = clamp(shopMsgT * 1.6, 0, 1);
    ctx.font = '700 13px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText(shopMsg, W / 2, b.leave.y + 56);
    ctx.globalAlpha = 1;
  }
  ctx.font = '500 10px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#475569';
  ctx.fillText('CLICK TO BUY   ·   1-6   ·   R REROLL   ·   ENTER TO CONTINUE', W / 2, H - 24);
}

function drawPause() {

  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = '800 44px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#e2e8f0';
  ctx.fillText('PAUSED', W / 2, H / 2 - 24);
  ctx.font = '500 13px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.fillText('P or ESC to resume  ·  M to mute  ·  T toggles autofire', W / 2, H / 2 + 14);

}

function drawDead() {
  ctx.fillStyle = 'rgba(3,5,10,0.84)';
  ctx.fillRect(0, 0, W, H);
  const s = lastStats || { score, wave, kills: 0, level: 1, time: 0 };
  ctx.textAlign = 'center';
  ctx.save();
  ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 30;
  ctx.font = '800 54px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#f87171';
  ctx.fillText('SIGNAL LOST', W / 2, H / 2 - 96);
  ctx.restore();

  ctx.font = '800 46px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#f1f5f9';
  ctx.fillText(s.score.toLocaleString(), W / 2, H / 2 - 34);
  ctx.font = '600 11px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.fillText('FINAL SCORE', W / 2, H / 2 - 8);
  if (s.sector) {
    ctx.font = '700 12px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('REACHED   ' + s.sector + (s.loop ? '   ×' + (s.loop + 1) : ''), W / 2, H / 2 + 11);
  }

  const cols = [
    ['WAVE', s.wave], ['KILLS', s.kills], ['LEVEL', s.level], ['TIME', fmtTime(s.time)]
  ];
  const spacing = Math.min(120, W / 5);
  cols.forEach((c, i) => {
    const x = W / 2 + (i - (cols.length - 1) / 2) * spacing;
    ctx.font = '700 22px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#cbd5e1';
    ctx.fillText(String(c[1]), x, H / 2 + 34);
    ctx.font = '600 10px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#475569';
    ctx.fillText(c[0], x, H / 2 + 54);
  });

  if (s.isRecord && s.score > 0) {
    ctx.font = '700 14px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = COL.crit;
    ctx.fillText('NEW PERSONAL BEST', W / 2, H / 2 + 84);
  } else {
    ctx.font = '600 12px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#475569';
    ctx.fillText('BEST  ' + Save.profile.best.toLocaleString(), W / 2, H / 2 + 84);
  }

  if (Board.rank) {
    ctx.font = '800 15px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = Board.rank <= 3 ? COL.crit : '#38bdf8';
    ctx.fillText(`GLOBAL RANK  #${Board.rank}` +
                 (Save.profile.name ? '   as ' + Save.profile.name : ''), W / 2, H / 2 + 106);
  } else if (Board.note) {
    ctx.font = '600 11px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#475569';
    ctx.fillText('leaderboard: ' + Board.note, W / 2, H / 2 + 106);
  }

  const pulse = 0.6 + Math.sin(uiTime * 4) * 0.4;
  ctx.font = '700 14px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = rgba(COL.player, pulse);
  ctx.fillText(isTouch ? 'TAP TO RUN AGAIN' : 'PRESS SPACE / R TO RUN AGAIN', W / 2, H / 2 + 124);
}

function renderMenu() {
  // background field
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const t = p.life / p.max;
    drawGlow(p.x, p.y, p.r * 4, p.color, t * 0.5);
  }
  ctx.restore();

  const cxp = W / 2, cyp = H / 2;
  // rotating emblem
  ctx.save();
  ctx.translate(cxp, cyp - 96);
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(0, 0, 96, COL.player, 0.32);
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = rgba(COL.player, 0.85); ctx.lineWidth = 2;
  poly(0, 0, 42, 3, uiTime * 0.6); ctx.stroke();
  poly(0, 0, 30, 3, -uiTime * 0.9 + 1); ctx.stroke();
  ctx.strokeStyle = rgba('#f472b6', 0.7);
  poly(0, 0, 56, 6, uiTime * 0.32); ctx.stroke();
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.save();
  ctx.shadowColor = COL.player; ctx.shadowBlur = 34;
  ctx.font = `800 ${Math.min(84, W * 0.13)}px Segoe UI, system-ui, sans-serif`;
  ctx.fillStyle = '#e0f2fe';
  ctx.fillText('VOIDRUNNER', cxp, cyp - 6);
  ctx.restore();

  ctx.font = '600 12px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#475569';
  ctx.fillText('S U R V I V E   T H E   A R E N A', cxp, cyp + 26);

  const pulse = 0.55 + Math.sin(uiTime * 3.4) * 0.45;
  ctx.font = '700 16px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = rgba(COL.player, pulse);
  ctx.fillText(isTouch ? 'TAP TO START' : 'PRESS SPACE TO START', cxp, cyp + 74);

  const pr = Save.profile;
  if (pr.best > 0) {
    ctx.font = '600 12px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = COL.crit;
    ctx.fillText('BEST  ' + pr.best.toLocaleString(), cxp, cyp + 104);
  }
  if (pr.runs > 0) {
    ctx.font = '500 11px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#475569';
    ctx.fillText(`${pr.runs} RUN${pr.runs === 1 ? '' : 'S'}   ·   ${pr.kills.toLocaleString()} KILLS   ·   ` +
                 `FURTHEST ${pr.bestSector} W${pr.bestWave}   ·   ${fmtTime(pr.time)}`, cxp, cyp + 126);
  }

  // leaderboard — the global board when it's reachable, your own runs otherwise
  const global = Board.top.length > 0;
  const rows = (global ? Board.top : Save.top).slice(0, 5);
  // show it whenever the last row genuinely clears the footer text, rather
  // than guessing at a screen-height threshold
  const lastRowY = cyp + 158 + 18 + (rows.length - 1) * 15;
  if (rows.length && lastRowY < H - 112) {
    const ly = cyp + 158;
    ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#334155';
    ctx.fillText(global ? 'GLOBAL TOP 5' : 'YOUR BEST RUNS', cxp, ly);
    ctx.font = '600 11px Segoe UI, system-ui, sans-serif';
    rows.forEach((r, i) => {
      const y = ly + 18 + i * 15;
      const mine = global && r.name === Save.profile.name;
      ctx.textAlign = 'right';
      ctx.fillStyle = mine ? COL.player : (i === 0 ? COL.crit : '#64748b');
      ctx.fillText(String((r.score || 0).toLocaleString()), cxp - 12, y);
      ctx.textAlign = 'left';
      ctx.fillStyle = mine ? COL.player : '#475569';
      ctx.fillText(global
        ? `${i + 1}. ${r.name}   ·   ${r.sector || '—'} W${r.wave}`
        : `${r.sector || '—'}  ·  W${r.wave}  ·  LV${r.level}`, cxp + 12, y);
    });
    ctx.textAlign = 'center';
  }

  const unlocks = [];
  if (Save.profile.planetarium) unlocks.push(['✦ PLANETARIUMS', '#fbbf24']);
  if (Save.profile.altPath) unlocks.push(['◈ THE FRACTURE', '#e2e8f0']);
  else if (Save.profile.clears > 0)
    unlocks.push([`◈ ${Save.profile.clears} / 2 CLEARS`, '#475569']);
  if (unlocks.length) {
    ctx.font = '700 10px Segoe UI, system-ui, sans-serif';
    const gap = 22;
    let tw = 0;
    unlocks.forEach(u => { tw += ctx.measureText(u[0]).width; });
    tw += gap * (unlocks.length - 1);
    let ux2 = cxp - tw / 2;
    ctx.textAlign = 'left';
    unlocks.forEach(u => {
      ctx.fillStyle = u[1];
      ctx.fillText(u[0], ux2, H - 112);
      ux2 += ctx.measureText(u[0]).width + gap;
    });
    ctx.textAlign = 'center';
  }

  // who you are on the board
  if (Save.profile.name) {
    ctx.font = '600 10px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#334155';
    ctx.fillText(`PLAYING AS ${Save.profile.name.toUpperCase()}   ·   PRESS N TO RENAME`,
      cxp, H - 96);
  }

  // status badges — save backend and global board, at a glance
  const badge = { cloud: ['◈ FIREPROOF SYNC', '#34d399'],
                  connecting: ['◈ CONNECTING…', '#64748b'],
                  error: ['◈ LOCAL SAVE (offline)', '#64748b'],
                  local: ['◈ LOCAL SAVE', '#475569'] }[Save.status];
  const bBadge = { ok: ['◈ LEADERBOARD LIVE', '#38bdf8'],
                   loading: ['◈ LEADERBOARD…', '#475569'],
                   offline: ['◈ LEADERBOARD OFFLINE', '#475569'],
                   idle: ['', '#475569'] }[Board.status];
  ctx.font = '600 10px Segoe UI, system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = badge[1];
  ctx.fillText(badge[0], W - 18, 22);
  if (bBadge && bBadge[0]) {
    ctx.fillStyle = bBadge[1];
    ctx.fillText(bBadge[0], W - 18, 38);
  }
  ctx.textAlign = 'center';

  const lines = isTouch
    ? ['LEFT SIDE — move   ·   RIGHT SIDE — aim & fire']
    : ['WASD move   ·   MOUSE aim   ·   HOLD to fire',
       'SPACE dash (i-frames)   ·   T autofire   ·   P pause   ·   M mute'];
  ctx.font = '500 11px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#334155';
  lines.forEach((l, i) => ctx.fillText(l, cxp, H - 74 + i * 18));

  drawVignette();
}

/* -------------------------------- library UI ------------------------------- */
function libraryButtons() {
  const bw = Math.min(180, W * 0.32), bh = 38, y = H / 2 + 136;
  return { take:  { x: W / 2 - bw - 8, y, w: bw, h: bh },
           leave: { x: W / 2 + 8,      y, w: bw, h: bh } };
}

function drawLibrary() {
  const bk = libraryBook;
  if (!bk) return;
  ctx.fillStyle = 'rgba(6,4,2,0.93)';
  ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  // shelves receding into the dark
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.strokeStyle = '#a16207'; ctx.lineWidth = 2;
  for (let r = 0; r < 5; r++) {
    const yy = cy - 190 + r * 96;
    ctx.beginPath(); ctx.moveTo(40, yy); ctx.lineTo(W - 40, yy); ctx.stroke();
    for (let c = 0; c < 26; c++) {
      const bx = 46 + c * ((W - 92) / 26) + Math.sin(c * 3.1 + r) * 3;
      const bh2 = 26 + ((c * 7 + r * 13) % 22);
      ctx.strokeRect(bx, yy - bh2, 7, bh2);
    }
  }
  ctx.restore();

  ctx.font = '700 11px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#a16207';
  ctx.fillText('L I B R A R Y', cx, cy - 168);
  ctx.font = '600 11px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.fillText('WRITTEN FROM ' + bk.from, cx, cy - 148);

  // the book itself
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(cx, cy - 62, 92, bk.col, 0.4 + Math.sin(uiTime * 2.4) * 0.1);
  ctx.restore();
  ctx.save();
  ctx.translate(cx, cy - 62);
  ctx.rotate(Math.sin(uiTime * 1.1) * 0.05);
  ctx.strokeStyle = bk.col; ctx.lineWidth = 3;
  ctx.fillStyle = rgba(bk.col, 0.16);
  ctx.beginPath();
  ctx.moveTo(-46, 30); ctx.quadraticCurveTo(0, 14, 0, 24);
  ctx.quadraticCurveTo(0, 14, 46, 30);
  ctx.lineTo(46, -24); ctx.quadraticCurveTo(0, -40, 0, -30);
  ctx.quadraticCurveTo(0, -40, -46, -24);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = rgba(bk.col, 0.5); ctx.lineWidth = 1.2;
  for (let k = 1; k <= 4; k++) {
    const yy = -18 + k * 9;
    ctx.beginPath(); ctx.moveTo(-36, yy); ctx.lineTo(-8, yy - 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8, yy - 3); ctx.lineTo(36, yy); ctx.stroke();
  }
  ctx.restore();

  ctx.font = '800 26px Segoe UI, system-ui, sans-serif';
  ctx.save();
  ctx.shadowColor = bk.col; ctx.shadowBlur = 22;
  ctx.fillStyle = '#f8fafc';
  ctx.fillText(bk.n, cx, cy + 22);
  ctx.restore();

  ctx.font = '400 13px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  wrapText(bk.d, cx, cy + 52, Math.min(460, W - 70), 18);

  ctx.font = '700 12px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = bk.col;
  ctx.fillText('BOUND TO  [ Q ]   ·   CHARGES OVER ' + bk.cost + ' WAVE' +
               (bk.cost === 1 ? '' : 'S'), cx, cy + 100);

  if (P.book && P.book.id !== bk.id) {
    ctx.font = '600 11px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#f87171';
    ctx.fillText('replaces ' + P.book.n, cx, cy + 118);
  }

  const b = libraryButtons();
  drawButton(b.take, 'TAKE IT  [E]', true, bk.col);
  drawButton(b.leave, 'LEAVE  [ESC]', true, '#64748b');

  ctx.textAlign = 'center';
  ctx.font = '500 10px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#3f3f46';
  ctx.fillText('you may only carry one book at a time', cx, H - 26);
}

/* ------------------------------ planetarium UI ----------------------------- */
function planetButtons() {
  const bw = Math.min(180, W * 0.32), bh = 38;
  const y = H / 2 + 142;
  return planetRevealed
    ? { accept: { x: -999, y: -999, w: 0, h: 0 },
        leave:  { x: W / 2 - bw / 2, y, w: bw, h: bh } }
    : { accept: { x: W / 2 - bw - 8, y, w: bw, h: bh },
        leave:  { x: W / 2 + 8,      y, w: bw, h: bh } };
}

// deterministic star field per sign, so a constellation always looks the same
function constellation(seed, n) {
  let s = seed >>> 0;
  const rnd_ = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  const pts = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    pts.push([ (0.12 + t * 0.76) + (rnd_() - 0.5) * 0.16,
               0.5 + Math.sin(t * Math.PI * (1 + rnd_())) * 0.32 + (rnd_() - 0.5) * 0.12,
               0.5 + rnd_() * 0.9 ]);
  }
  return pts;
}

function drawPlanetarium() {
  const sign = planetSign;
  if (!sign) return;
  const gold = '#fbbf24', purple = '#a855f7';
  const accent = planetRevealed ? (sign.good ? gold : purple) : '#c4b5fd';

  ctx.fillStyle = 'rgba(2,3,8,0.93)';
  ctx.fillRect(0, 0, W, H);

  // drifting starfield backdrop
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 70; i++) {
    const a = i * 2.399 + uiTime * 0.04;
    const r = ((i * 37) % 100) / 100;
    const x = W / 2 + Math.cos(a) * r * W * 0.62;
    const y = H / 2 + Math.sin(a) * r * H * 0.58;
    const tw = 0.25 + 0.75 * Math.abs(Math.sin(uiTime * 1.1 + i));
    drawGlow(x, y, 2 + (i % 3), '#93c5fd', 0.1 + tw * 0.14);
  }
  ctx.restore();

  const cx = W / 2, cy = H / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = '700 11px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.fillText('P L A N E T A R I U M', cx, cy - 176);

  // constellation panel
  const pw = Math.min(400, W - 70), ph = 116;
  const px = cx - pw / 2, py = cy - 158;
  const pts = constellation(sign.seed, 7);
  ctx.save();
  ctx.strokeStyle = rgba(accent, 0.35);
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  pts.forEach((p, i) => {
    const x = px + p[0] * pw, y = py + p[1] * ph;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
  ctx.globalCompositeOperation = 'lighter';
  pts.forEach((p, i) => {
    const x = px + p[0] * pw, y = py + p[1] * ph;
    const tw = 0.6 + 0.4 * Math.sin(uiTime * 2 + i * 1.7);
    drawGlow(x, y, (6 + p[2] * 9) * tw, accent, 0.75);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x, y, 1.4 + p[2], 0, TAU); ctx.fill();
  });
  ctx.restore();

  ctx.font = '800 38px Segoe UI, system-ui, sans-serif';
  ctx.save();
  ctx.shadowColor = accent; ctx.shadowBlur = 26;
  ctx.fillStyle = '#f8fafc';
  ctx.fillText(sign.n, cx, cy - 6);
  ctx.restore();

  ctx.font = '600 12px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = accent;
  ctx.fillText(sign.t.toUpperCase(), cx, cy + 22);

  ctx.font = '400 13px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  wrapText(sign.flavour, cx, cy + 50, Math.min(430, W - 60), 18);

  if (!planetRevealed) {
    ctx.font = '600 11px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#475569';
    ctx.fillText('the reading is free — but it is not shown until it is taken',
      cx, cy + 92);
  } else {
    // effect strings read "NAME — what it does"; split so the long half wraps
    const half = planetMsg.split(' — ');
    ctx.font = '800 14px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = sign.good ? gold : purple;
    ctx.fillText((sign.good ? 'BLESSING   ·   ' : 'CURSE   ·   ') + half[0], cx, cy + 86);
    if (half[1]) {
      ctx.font = '400 12px Segoe UI, system-ui, sans-serif';
      ctx.fillStyle = '#94a3b8';
      wrapText(half[1], cx, cy + 107, Math.min(420, W - 70), 15);
    }
  }

  const b = planetButtons();
  if (!planetRevealed) {
    drawButton(b.accept, 'ACCEPT  [A]', true, COL.hp);
    drawButton(b.leave, 'WALK AWAY  [D]', true, '#64748b');
  } else {
    drawButton(b.leave, 'CONTINUE  ▸', true, COL.hp);
  }

  ctx.textAlign = 'center';
  ctx.font = '500 10px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#334155';
  ctx.fillText('every reading is either extraordinary or ruinous — never both, never neither',
    cx, H - 26);
}

function drawNameEntry() {
  ctx.fillStyle = 'rgba(3,5,10,0.88)';
  ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = '800 13px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = COL.player;
  ctx.fillText('GLOBAL LEADERBOARD', cx, cy - 96);
  ctx.font = '800 32px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#f1f5f9';
  ctx.fillText('CHOOSE A CALLSIGN', cx, cy - 62);

  // input field
  const fw = Math.min(360, W - 80), fh = 52;
  const fx = cx - fw / 2, fy = cy - 22;
  ctx.fillStyle = 'rgba(12,18,30,0.96)';
  roundRect(fx, fy, fw, fh, 12); ctx.fill();
  ctx.strokeStyle = rgba(COL.player, 0.6); ctx.lineWidth = 2;
  roundRect(fx, fy, fw, fh, 12); ctx.stroke();

  ctx.font = '700 22px Segoe UI, system-ui, sans-serif';
  const shown = nameBuf || '';
  const caret = Math.floor(uiTime * 2) % 2 ? '|' : ' ';
  ctx.fillStyle = shown ? '#f8fafc' : '#334155';
  ctx.fillText(shown ? shown + caret : (isTouch ? 'TAP TO ENTER NAME' : 'type a name' + caret),
    cx, fy + fh / 2 + 1);

  ctx.font = '500 11px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#475569';
  ctx.fillText(`${shown.length}/${NAME_MAX}   ·   letters, numbers, . _ -`, cx, fy + fh + 20);

  ctx.font = '600 12px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = nameBuf.trim() ? COL.hp : '#334155';
  ctx.fillText(isTouch ? 'TAP THE FIELD TO TYPE' : 'ENTER TO CONFIRM', cx, fy + fh + 52);

  if (Save.profile.name) {
    ctx.font = '500 10px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#334155';
    ctx.fillText('ESC TO KEEP ' + Save.profile.name.toUpperCase(), cx, fy + fh + 74);
  }

  ctx.font = '500 10px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#334155';
  ctx.fillText('anyone can pick any name — scores are not verified', cx, H - 34);
}

function drawTouchSticks() {
  const drawStick = (s, col) => {
    if (!s) return;
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(s.ox, s.oy, 58, 0, TAU); ctx.stroke();
    const dx = s.x - s.ox, dy = s.y - s.oy, d = len(dx, dy);
    const m = d > 58 ? 58 / d : 1;
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(s.ox + dx * m, s.oy + dy * m, 22, 0, TAU); ctx.fill();
    ctx.restore();
  };
  drawStick(touchUI.move, COL.player);
  drawStick(touchUI.aim, '#f472b6');
}

/* Build every glow sprite up front. Each new colour costs a canvas plus a
   radial gradient on first use, and doing that lazily produced a visible
   hitch the first time a sector introduced unfamiliar colours. */
function prewarmGlow() {
  const cols = new Set();
  const add = c => { if (typeof c === 'string' && c[0] === '#') cols.add(c); };
  for (const k in COL) add(COL[k]);
  for (const k in RARITY) add(RARITY[k]);
  for (const k in ETYPE) add(ETYPE[k].col);
  for (const k in BOSSES) add(BOSSES[k].col);
  for (const s of STAGES.concat(ALT_STAGES)) { add(s.accent); add(s.wall); }
  ('#fbbf24 #a855f7 #fb923c #a3e635 #38bdf8 #5eead4 #a5f3fc #c4b5fd #e2e8f0 #f87171 ' +
   '#93c5fd #7dd3fc #a78bfa #fcd34d #f0abfc #6ee7b7 #fde047 #ef4444 #cffafe #99f6e4 ' +
   '#bae6fd #f5d0fe #ddd6fe #fed7aa #fecdd3 #bfdbfe #f1f5f9 #f8fafc #fecaca #fef08a')
    .split(' ').forEach(add);
  cols.forEach(glowSprite);
  return cols.size;
}

/* --------------------------------- start ---------------------------------- */
prewarmGlow();
Save.init();
cam.x = P.x; cam.y = P.y;
requestAnimationFrame(frame);
</script>
