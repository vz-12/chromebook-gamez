            "'Chakra Petch', Barlow, system-ui, sans-serif", 20);
    ctx.shadowColor = bannerCol; ctx.shadowBlur = 26;
    ctx.fillStyle = bannerCol;
    ctx.fillText(bannerText, W / 2, H * 0.28 - (1 - a) * 14);
    ctx.restore();
  }

  /* --- build chips (owned upgrades) — hidden under full-screen overlays --- */
  const owned = state === 'play' ? Object.keys(P.up) : [];
  if (owned.length) {
    ctx.textAlign = 'left';
    ctx.font = "600 10px Barlow, 'Segoe UI', system-ui, sans-serif";
    let cx = pad, cy = H - pad - 8;
    for (const id of owned) {
      const u = UPGRADES.find(z => z.id === id);
      if (!u) continue;
      const label = upName(u) + (P.up[id] > 1 ? ' ×' + P.up[id] : '');
      const w3 = ctx.measureText(label).width + 14;
      if (cx + w3 > W - pad) { cx = pad; cy -= 20; }
      ctx.fillStyle = 'rgba(15,23,42,0.7)';
      roundRect(cx, cy - 8, w3, 16, 8); ctx.fill();
      ctx.strokeStyle = rgba(RARITY[u.rar], 0.55); ctx.lineWidth = 1;
      roundRect(cx, cy - 8, w3, 16, 8); ctx.stroke();
      ctx.fillStyle = RARITY[u.rar];
      ctx.fillText(label, cx + 7, cy + 0.5);
      cx += w3 + 5;
    }
    hudBotY = cy - 26;             // clear of the topmost chip row
  }
}

function fmtTime(s) {
  const m = Math.floor(s / 60), r = Math.floor(s % 60);
  return m + ':' + String(r).padStart(2, '0');
}

/* ------------------------------ level-up UI -------------------------------- */
function cardRects() {
  const n = offers.length || 3;
  const cw = Math.min(268, (W - 60) / n - 16);
  const ch = clamp(Math.min(300, H * 0.5), 150, 300);
  const gap = 18;
  const total = n * cw + (n - 1) * gap;
  const x0 = (W - total) / 2, y0 = (H - ch) / 2 + 16;
  const out = [];
  for (let i = 0; i < n; i++) out.push({ x: x0 + i * (cw + gap), y: y0, w: cw, h: ch });
  return out;
}
function offerIndexAt(mx, my) {
  const rs = cardRects();
  for (let i = 0; i < offers.length; i++) {
    const r = rs[i];
    if (mx > r.x && mx < r.x + r.w && my > r.y && my < r.y + r.h) return i;
  }
  return -1;
}

function drawLevelUp() {
  ctx.fillStyle = 'rgba(3,5,10,0.82)';
  ctx.fillRect(0, 0, W, H);
  const rs = cardRects();
  const hover = offerIndexAt(mouse.x, mouse.y);

  ctx.textAlign = 'center';
  ctx.save();
  ctx.letterSpacing = '0.18em';
  fitFont('LEVEL ' + P.level, W - 56, '700', 13,
          "Barlow, 'Segoe UI', system-ui, sans-serif", 9);
  ctx.fillStyle = COL.player;
  ctx.fillText('LEVEL ' + P.level, W / 2, rs[0].y - 62);
  ctx.letterSpacing = '0.05em';
  fitFont('CHOOSE AN UPGRADE', W - 56, '700', 34,
          "'Chakra Petch', Barlow, system-ui, sans-serif", 18);
  ctx.fillStyle = '#f1f5f9';
  ctx.fillText('CHOOSE AN UPGRADE', W / 2, rs[0].y - 34);
  ctx.restore();

  for (let i = 0; i < offers.length; i++) {
    const u = offers[i], r = rs[i];
    const col = RARITY[u.rar];
    const on = hover === i;
    const lift = on ? 6 : 0;
    const y = r.y - lift;

    ctx.save();
    if (on) { ctx.shadowColor = col; ctx.shadowBlur = 28; }
    ctx.fillStyle = on ? 'rgba(22,32,52,0.98)' : 'rgba(12,18,30,0.96)';
    roundRect(r.x, y, r.w, r.h, 14); ctx.fill();
    ctx.restore();

    ctx.strokeStyle = on ? col : rgba(col, 0.45);
    ctx.lineWidth = on ? 2.4 : 1.4;
    roundRect(r.x, y, r.w, r.h, 14); ctx.stroke();

    /* The card is designed at 300px tall and squeezed on a short window, so
       everything above the pips is placed as a fraction of that height — the
       pips and the number key are anchored to the foot, and the description
       used to walk straight into them. */
    const k = Math.min(1, r.h / 300);

    // rarity strip
    ctx.fillStyle = col;
    roundRect(r.x + 14, y + 16 * k, r.w - 28, 3, 2); ctx.fill();

    // icon
    const cxp = r.x + r.w / 2, cyp = y + 84 * k;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(cxp, cyp, 52 * k, col, on ? 0.55 : 0.34);
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = col; ctx.lineWidth = 2.4;
    ctx.fillStyle = rgba(col, 0.14);
    const sides = 3 + (i + u.n.length) % 5;
    poly(cxp, cyp, 26 * k, sides, uiTime * (on ? 1.4 : 0.5) + i);
    ctx.fill(); ctx.stroke();
    poly(cxp, cyp, 13 * k, sides, -uiTime * (on ? 1.9 : 0.7) + i);
    ctx.stroke();
    ctx.restore();

    ctx.textAlign = 'center';
    ctx.save();
    ctx.letterSpacing = '0.16em';
    ctx.font = "700 9px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = col;
    ctx.fillText(u.rar.toUpperCase(), cxp, y + 34 * k);
    ctx.restore();

    fitFont(upName(u), r.w - 22, '700', Math.max(12, 19 * k),
            "Barlow, 'Segoe UI', system-ui, sans-serif", 11);
    ctx.fillStyle = '#f8fafc';
    ctx.fillText(upName(u), cxp, y + 140 * k);

    /* The description is the one block that can be several lines long, so it
       gets whatever is left between the name and the pips — and is skipped
       outright when that is less than a line. */
    const descTop = y + 164 * k, descBot = y + r.h - 52;
    const lh = Math.max(12, 17 * k);
    if (descBot - descTop >= lh) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(r.x + 6, descTop - lh, r.w - 12, descBot - descTop + lh * 0.4);
      ctx.clip();
      ctx.font = '400 ' + Math.max(10, 13 * k) +
                 "px Barlow, 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = '#94a3b8';
      wrapText(upDesc(u), cxp, descTop, r.w - 36, lh);
      ctx.restore();
    }

    // stack pips
    const have = P.up[u.id] || 0;
    const pw = 12, tw = u.max * pw;
    for (let k = 0; k < u.max; k++) {
      ctx.fillStyle = k < have ? col : 'rgba(148,163,184,0.22)';
      roundRect(cxp - tw / 2 + k * pw, y + r.h - 44, 8, 4, 2); ctx.fill();
    }

    ctx.font = "700 10px 'JetBrains Mono', ui-monospace, monospace";
    ctx.fillStyle = on ? col : '#475569';
    ctx.fillText('[ ' + (i + 1) + ' ]', cxp, y + r.h - 22);
  }
  ctx.textAlign = 'center';
  ctx.save();
  ctx.letterSpacing = '0.1em';
  const lk = 'CLICK OR PRESS ' + offers.map((o, i) => i + 1).join(' / ');
  fitFont(lk, W - 40, '500', 11, "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
  ctx.fillStyle = '#475569';
  ctx.fillText(lk, W / 2, rs[0].y + rs[0].h + 30);
  ctx.restore();
}

/* Normally a whole number. Under THE AMALGAM it goes fractional and has to
   print every place, because watching it shrink is the joke and the tension. */
function fmtHp(hp) {
  if (hp >= 1) return String(Math.ceil(hp));
  if (hp <= 0) return '0';
  // past a certain absurdity the decimals stop reading as a number at all and
  // start reading as zero, which is exactly the wrong impression to give
  if (hp < 1e-6) return hp.toExponential(0).replace('e-', 'e−');
  const places = Math.max(1, Math.round(-Math.log10(hp)));
  return hp.toFixed(places);
}

/* Sets ctx.font to the largest size <= size that fits s inside maxW, so a long
   pilot name, a nine-digit score or a translated label narrows instead of
   running out of its panel. Returns the size it settled on. */
function fitFont(s, maxW, weight, size, family, min) {
  min = min || 7;
  let px = size;
  ctx.font = weight + ' ' + px + 'px ' + family;
  while (px > min && ctx.measureText(s).width > maxW) {
    px -= 0.5;
    ctx.font = weight + ' ' + px + 'px ' + family;
  }
  return px;
}

// hard cap on a name from the board: it is user-supplied and can be anything
function clipText(s, n) {
  s = String(s);
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

// same wrapping as wrapText, but handed back so a caller can place a caret
function wrapLines(text, maxW) {
  const words = String(text).split(' ');
  const out = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; }
    else line = test;
  }
  out.push(line);
  return out;
}

function wrapText(text, x, y, maxW, lh) {
  const words = String(text).split(' ');
  let line = '', yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, yy); line = w; yy += lh;
    } else line = test;
  }
  if (line) ctx.fillText(line, x, yy);
  return yy;                          // baseline of the last line drawn
}

/* --------------------------------- shop UI --------------------------------- */
/* Six offers, two ways to arrange them:
     'cards'  a 3x2 grid of portrait cards — the goods on a shelf
     'shelf'  one column of wide rows — reads top to bottom, survives narrow
   Both publish the same rect list, so hit testing and the keys are shared. */
/* The shop is laid out against a minimum canvas and the whole screen is scaled
   down to fit anything smaller, exactly as the LAN panel is: the title block
   above and the buttons below are fixed furniture, so on a short window there
   is no arrangement of six offers that fits — only a smaller one. Every hit
   test therefore has to run in shop space, which shopMx/shopMy convert to. */
const SHOP_VW = 640, SHOP_VH = 500;
function shopView() {
  const s = Math.min(1, W / SHOP_VW, H / SHOP_VH);
  return { s, vw: s < 1 ? W / s : W, vh: s < 1 ? H / s : H };
}
function shopMx() { const v = shopView(); return (mouse.x - W / 2) / v.s + v.vw / 2; }
function shopMy() { const v = shopView(); return (mouse.y - H / 2) / v.s + v.vh / 2; }

function shopRects() {
  const out = [];
  const V = shopView(), W = V.vw, H = V.vh;    // shadow the globals: shop space
  if (UIVAR.shop === 'table') {
    /* A table: one row per offer, columns that line up down the page. Sized so
       six rows and a header always sit between the title and the buttons. */
    const rw = Math.min(760, W - 40);
    const rh = clamp((H - 296) / 6, 32, 52);
    const th = 6 * rh;
    const x0 = (W - rw) / 2, y0 = (H - th) / 2 + 20;
    for (let i = 0; i < 6; i++) out.push({ x: x0, y: y0 + i * rh, w: rw, h: rh });
    return out;
  }
  if (UIVAR.shop === 'shelf') {
    const rw = Math.min(560, W - 48);
    const gy = 8;
    const rh = Math.min(62, Math.max(44, (H - 264) / 6 - gy));
    const th = 6 * rh + 5 * gy;
    const x0 = (W - rw) / 2, y0 = (H - th) / 2 - 2;
    for (let i = 0; i < 6; i++) out.push({ x: x0, y: y0 + i * (rh + gy), w: rw, h: rh });
    return out;
  }
  const cols = 3, rows = 2, gx = 16, gy = 16;
  const cw = Math.min(230, (W - 90) / cols - gx);
  const ch = Math.min(178, (H - 250) / rows - gy);
  const tw = cols * cw + (cols - 1) * gx;
  const th = rows * ch + (rows - 1) * gy;
  const x0 = (W - tw) / 2, y0 = (H - th) / 2 - 4;
  for (let i = 0; i < cols * rows; i++)
    out.push({ x: x0 + (i % cols) * (cw + gx), y: y0 + ((i / cols) | 0) * (ch + gy), w: cw, h: ch });
  return out;
}
function shopButtons() {
  const rs = shopRects();
  const V = shopView(), W = V.vw;
  const last = rs[rs.length - 1];
  const y = last.y + last.h + 26;
  const bw = Math.min(172, W * 0.3), bh = 36;
  return { reroll: { x: W / 2 - bw - 8, y, w: bw, h: bh },
           leave:  { x: W / 2 + 8,      y, w: bw, h: bh } };
}
function shopIndexAt() {
  const rs = shopRects(), mx = shopMx(), my = shopMy();
  for (let i = 0; i < shopItems.length; i++) if (inRect(mx, my, rs[i])) return i;
  return -1;
}

function drawButton(r, label, enabled, col) {
  const on = inRect(shopMx(), shopMy(), r) && enabled;
  ctx.save();
  ctx.globalAlpha = enabled ? 1 : 0.4;
  ctx.fillStyle = on ? rgba(col, 0.2) : 'rgba(12,18,30,0.95)';
  roundRect(r.x, r.y, r.w, r.h, 10); ctx.fill();
  ctx.strokeStyle = on ? col : rgba(col, 0.45);
  ctx.lineWidth = on ? 2.2 : 1.3;
  roundRect(r.x, r.y, r.w, r.h, 10); ctx.stroke();
  ctx.letterSpacing = '0.1em';
  fitFont(label, r.w - 18, '700', 13, "'Chakra Petch', Barlow, system-ui, sans-serif", 9);
  ctx.fillStyle = col;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 0.5);
  ctx.restore();
}

function drawShop() {
  ctx.fillStyle = 'rgba(3,5,10,0.88)';
  ctx.fillRect(0, 0, W, H);
  const V = shopView();
  ctx.save();
  if (V.s < 1) {
    ctx.translate(W / 2, H / 2);
    ctx.scale(V.s, V.s);
    ctx.translate(-V.vw / 2, -V.vh / 2);
  }
  const W_ = W, H_ = H;
  W = V.vw; H = V.vh;                          // draw in shop space
  const rs = shopRects();
  const hover = shopIndexAt();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // the table carries its own column header, so the title block moves up for it
  const hdr = UIVAR.shop === 'table' ? 28 : 0;
  ctx.save();
  ctx.letterSpacing = '0.2em';
  const where = stage.name + '   ·   SECTOR CLEARED';
  fitFont(where, W - 56, '700', 11, "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
  ctx.fillStyle = stage.accent;
  ctx.fillText(where, W / 2, rs[0].y - 76 - hdr);
  ctx.letterSpacing = '0.05em';
  fitFont('BLACK MARKET', W - 56, '700', 34,
          "'Chakra Petch', Barlow, system-ui, sans-serif", 20);
  ctx.fillStyle = '#f1f5f9';
  ctx.fillText('BLACK MARKET', W / 2, rs[0].y - 46 - hdr);
  ctx.restore();
  /* The purse is the number every price on this screen is measured against,
     so it gets the mono face and sits directly under the title. */
  ctx.font = "800 20px 'JetBrains Mono', ui-monospace, monospace";
  ctx.fillStyle = '#fbbf24';
  ctx.fillText('◈ ' + credits, W / 2, rs[0].y - 18 - hdr);

  for (let i = 0; i < shopItems.length; i++) {
    const it = shopItems[i], r = rs[i];
    const col = it.kind === 'chip' ? CHIP_COL : RARITY[it.rar];
    const afford = credits >= it.cost && !it.sold;
    const on = hover === i && afford;
    const y = r.y - (on ? 5 : 0);
    const cx = r.x + r.w / 2;

    if (UIVAR.shop === 'table') {
      /* Columns are measured once from the row width so every cell in a column
         starts at the same x — that alignment is the whole point of a table.
         The effect column is what is left after the fixed ones are taken. */
      const kw = 30, cw = 78, tw3 = r.w > 560 ? 96 : 0;
      const nw = Math.max(96, (r.w - kw - cw - tw3) * (tw3 ? 0.42 : 0.46));
      const xKey = r.x + 12, xName = r.x + kw + 6;
      const xType = xName + nw;
      const xDesc = xType + tw3;
      const xCost = r.x + r.w - 12;

      if (i === 0) {
        // the header sits on the first row's top edge, once
        ctx.save();
        ctx.textAlign = 'left';
        ctx.letterSpacing = '0.18em';
        ctx.font = "700 8.5px Barlow, 'Segoe UI', system-ui, sans-serif";
        ctx.fillStyle = '#475569';
        ctx.fillText('ITEM', xName, r.y - 14);
        if (tw3) ctx.fillText('CLASS', xType, r.y - 14);
        ctx.fillText('EFFECT', xDesc, r.y - 14);
        ctx.textAlign = 'right';
        ctx.fillText('COST', xCost, r.y - 14);
        ctx.restore();
        ctx.fillStyle = 'rgba(148,163,184,0.28)';
        ctx.fillRect(r.x, r.y - 7, r.w, 1);
      }

      ctx.save();
      ctx.globalAlpha = it.sold ? 0.32 : 1;
      if (on) {
        ctx.fillStyle = rgba(col, 0.1);
        roundRect(r.x, r.y + 1, r.w, r.h - 2, 6); ctx.fill();
      }
      // rule under every row but the last: the grid of a table, not a box
      if (i < 5) {
        ctx.fillStyle = 'rgba(148,163,184,0.1)';
        ctx.fillRect(r.x + 8, r.y + r.h - 1, r.w - 16, 1);
      }
      const my = r.y + r.h / 2;
      ctx.fillStyle = rgba(col, on ? 1 : 0.75);
      roundRect(r.x + 2, r.y + 8, 2.5, r.h - 16, 1.5); ctx.fill();

      ctx.textAlign = 'left';
      ctx.font = "600 9px 'JetBrains Mono', ui-monospace, monospace";
      ctx.fillStyle = on ? col : '#475569';
      ctx.fillText(it.sold ? '—' : String(i + 1), xKey, my);

      fitFont(it.name, nw - 12, '700', Math.min(14, r.h * 0.34),
              "Barlow, 'Segoe UI', system-ui, sans-serif", 9);
      ctx.fillStyle = it.sold ? '#64748b' : '#f8fafc';
      ctx.fillText(it.name, xName, my - (it.kind === 'up' ? 5 : 0));
      if (it.kind === 'up') {
        const have = P.up[it.up.id] || 0;
        for (let j = 0; j < it.up.max; j++) {
          ctx.fillStyle = j < have ? col : 'rgba(148,163,184,0.22)';
          roundRect(xName + j * 8, my + 6, 5, 3, 1.5); ctx.fill();
        }
      }
      if (tw3) {
        ctx.save();
        ctx.letterSpacing = '0.12em';
        ctx.font = "700 8.5px Barlow, 'Segoe UI', system-ui, sans-serif";
        ctx.fillStyle = rgba(col, 0.85);
        ctx.fillText(it.kind === 'chip' ? 'ONE OF A KIND'
                   : it.kind === 'svc' ? 'SERVICE' : it.rar.toUpperCase(), xType, my);
        ctx.restore();
      }
      fitFont(it.desc, xCost - xDesc - 74, '400', Math.min(11.5, r.h * 0.27),
              "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(it.desc, xDesc, my);

      ctx.textAlign = 'right';
      if (it.sold) {
        ctx.save();
        ctx.letterSpacing = '0.16em';
        ctx.font = "700 10px Barlow, 'Segoe UI', system-ui, sans-serif";
        ctx.fillStyle = '#475569';
        ctx.fillText('SOLD', xCost, my);
        ctx.restore();
      } else {
        ctx.font = "800 " + Math.min(15, r.h * 0.34) +
                   "px 'JetBrains Mono', ui-monospace, monospace";
        ctx.fillStyle = afford ? '#fbbf24' : '#9f1239';
        ctx.fillText('◈ ' + it.cost, xCost, my);
      }
      ctx.restore();
      continue;
    }

    if (UIVAR.shop === 'shelf') {
      /* One wide row: the badge on the left, what it is in the middle, what it
         costs on the right — the three questions in reading order. */
      const x = r.x + (on ? 4 : 0);
      ctx.save();
      ctx.globalAlpha = it.sold ? 0.32 : 1;
      ctx.fillStyle = on ? 'rgba(22,32,52,0.98)' : 'rgba(11,17,28,0.94)';
      roundRect(x, r.y, r.w, r.h, 10); ctx.fill();
      ctx.strokeStyle = on ? col : rgba(col, afford ? 0.35 : 0.16);
      ctx.lineWidth = on ? 2 : 1.2;
      roundRect(x, r.y, r.w, r.h, 10); ctx.stroke();
      ctx.fillStyle = rgba(col, afford ? 0.9 : 0.4);
      roundRect(x + 1.5, r.y + 8, 2.5, r.h - 16, 1.5); ctx.fill();

      const gx2 = x + 34, gy2 = r.y + r.h / 2;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(gx2, gy2, it.kind === 'chip' ? 26 : 20, col, on ? 0.5 : 0.28);
      ctx.restore();
      ctx.strokeStyle = col; ctx.fillStyle = rgba(col, 0.14); ctx.lineWidth = 1.8;
      if (it.kind === 'chip') {
        ctx.beginPath(); ctx.rect(gx2 - 9, gy2 - 9, 18, 18); ctx.fill(); ctx.stroke();
      } else {
        poly(gx2, gy2, 12, 3 + (i + it.name.length) % 5, uiTime * (on ? 1.2 : 0.4) + i);
        ctx.fill(); ctx.stroke();
      }

      // price column first: the name is allowed whatever is left
      const priceStr = it.sold ? 'SOLD' : '◈ ' + it.cost;
      ctx.textAlign = 'right';
      ctx.font = "800 15px 'JetBrains Mono', ui-monospace, monospace";
      ctx.fillStyle = it.sold ? '#475569' : afford ? '#fbbf24' : '#9f1239';
      ctx.fillText(priceStr, x + r.w - 14, gy2 - 5);
      const priceW = ctx.measureText(priceStr).width;
      ctx.save();
      ctx.letterSpacing = '0.1em';
      ctx.font = "700 8px Barlow, 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = on ? col : '#475569';
      if (!it.sold) ctx.fillText('[ ' + (i + 1) + ' ]', x + r.w - 14, gy2 + 11);
      ctx.restore();

      const textW = r.w - 60 - priceW - 34;
      ctx.textAlign = 'left';
      /* Three baselines shared out of the row's own height: the row shrinks
         with the window and the description has to stay inside it. */
      const tx2 = gx2 + 24;
      ctx.save();
      ctx.letterSpacing = '0.14em';
      ctx.font = "700 8px Barlow, 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = rgba(col, 0.8);
      ctx.fillText(it.kind === 'chip' ? 'ONE OF A KIND'
                 : it.kind === 'svc' ? 'SERVICE' : it.rar.toUpperCase(), tx2, r.y + r.h * 0.26);
      ctx.restore();
      fitFont(it.name, textW, '700', Math.min(15, r.h * 0.29),
              "Barlow, 'Segoe UI', system-ui, sans-serif", 10);
      ctx.fillStyle = '#f8fafc';
      const ny = r.y + r.h * 0.56;
      ctx.fillText(it.name, tx2, ny);
      // how many you already hold, set beside the name rather than under the
      // price, where it used to sit on top of the number key
      if (it.kind === 'up') {
        const have = P.up[it.up.id] || 0;
        let px2 = tx2 + ctx.measureText(it.name).width + 10;
        for (let j = 0; j < it.up.max; j++) {
          ctx.fillStyle = j < have ? col : 'rgba(148,163,184,0.22)';
          roundRect(px2 + j * 8, ny - 6, 5, 3, 1.5); ctx.fill();
        }
      }
      fitFont(it.desc, textW, '400', Math.min(10.5, r.h * 0.21),
              "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(it.desc, tx2, r.y + r.h * 0.82);
      ctx.restore();
      continue;
    }

    ctx.save();
    ctx.globalAlpha = it.sold ? 0.3 : 1;
    if (on) { ctx.shadowColor = col; ctx.shadowBlur = 24; }
    ctx.fillStyle = on ? 'rgba(22,32,52,0.98)' : 'rgba(12,18,30,0.96)';
    roundRect(r.x, y, r.w, r.h, 12); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = on ? col : rgba(col, afford ? 0.45 : 0.2);
    ctx.lineWidth = on ? 2.4 : 1.4;
    roundRect(r.x, y, r.w, r.h, 12); ctx.stroke();

    /* The card is designed at 178px tall and squeezed on a short window, so
       everything above the price is placed as a fraction of that height —
       otherwise the name lands on top of the price, which it used to. */
    const k = Math.min(1, r.h / 178);
    ctx.fillStyle = col;
    roundRect(r.x + 12, y + 12 * k, r.w - 24, 3, 2); ctx.fill();
    ctx.save();
    ctx.letterSpacing = '0.16em';
    ctx.font = "700 8.5px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillText(it.kind === 'chip' ? 'ONE OF A KIND'
               : it.kind === 'svc' ? 'SERVICE' : it.rar.toUpperCase(), cx, y + 29 * k);
    ctx.restore();

    const iy = y + 63 * k;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(cx, iy, (it.kind === 'chip' ? 46 : 34) * k, col,
             it.kind === 'chip' ? 0.55 + Math.sin(uiTime * 3.4) * 0.2 : (on ? 0.5 : 0.3));
    ctx.restore();
    if (it.kind === 'chip') {
      // a die with its contacts out, rather than the generic polygon
      ctx.save();
      ctx.translate(cx, iy);
      ctx.scale(k, k);
      ctx.strokeStyle = col; ctx.fillStyle = rgba(col, 0.16); ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.rect(-15, -15, 30, 30); ctx.fill(); ctx.stroke();
      ctx.lineWidth = 1.8;
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath(); ctx.moveTo(k * 9, -15); ctx.lineTo(k * 9, -22); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(k * 9, 15);  ctx.lineTo(k * 9, 22);  ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-15, k * 9); ctx.lineTo(-22, k * 9); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(15, k * 9);  ctx.lineTo(22, k * 9);  ctx.stroke();
      }
      ctx.strokeStyle = '#fffbeb'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.rect(-6, -6, 12, 12); ctx.stroke();
      ctx.restore();
    } else {
      ctx.strokeStyle = col; ctx.fillStyle = rgba(col, 0.14); ctx.lineWidth = 2.2;
      poly(cx, iy, 19 * k, 3 + (i + it.name.length) % 5, uiTime * (on ? 1.3 : 0.45) + i);
      ctx.fill(); ctx.stroke();
    }

    fitFont(it.name, r.w - 22, '700', Math.max(11, 16 * k),
            "Barlow, 'Segoe UI', system-ui, sans-serif", 10);
    ctx.fillStyle = '#f8fafc';
    ctx.fillText(it.name, cx, y + 101 * k);
    ctx.font = '400 ' + Math.max(9, 11 * k) + "px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = '#94a3b8';
    wrapText(it.desc, cx, y + 119 * k, r.w - 26, Math.max(11, 14 * k));

    if (it.kind === 'up') {                       // stack pips
      const have = P.up[it.up.id] || 0, pw = 10, tw2 = it.up.max * pw;
      for (let j = 0; j < it.up.max; j++) {
        ctx.fillStyle = j < have ? col : 'rgba(148,163,184,0.22)';
        roundRect(cx - tw2 / 2 + j * pw, y + r.h - 40, 7, 3.5, 2); ctx.fill();
      }
    }
    if (it.sold) {
      ctx.save();
      ctx.letterSpacing = '0.18em';
      ctx.font = "700 13px Barlow, 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = '#64748b';
      ctx.fillText('SOLD', cx, y + r.h - 20);
      ctx.restore();
    } else {
      ctx.font = "800 15px 'JetBrains Mono', ui-monospace, monospace";
      ctx.fillStyle = afford ? '#fbbf24' : '#9f1239';
      ctx.fillText('◈ ' + it.cost, cx, y + r.h - 24);
      ctx.save();
      ctx.letterSpacing = '0.1em';
      ctx.font = "700 8.5px Barlow, 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = on ? col : '#475569';
      ctx.fillText('[ ' + (i + 1) + ' ]', cx, y + r.h - 9);
      ctx.restore();
    }
    ctx.restore();
  }

  const b = shopButtons();
  const rcost = 30 + shopRerolls * 25;
  drawButton(b.reroll, 'REROLL  ◈' + rcost, credits >= rcost, '#38bdf8');
  drawButton(b.leave, 'CONTINUE  ▸', true, COL.hp);

  ctx.textAlign = 'center';
  if (shopMsgT > 0) {
    ctx.globalAlpha = clamp(shopMsgT * 1.6, 0, 1);
    ctx.font = "700 13px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText(shopMsg, W / 2, b.leave.y + 56);
    ctx.globalAlpha = 1;
  }
  ctx.save();
  ctx.letterSpacing = '0.1em';
  const keys = 'CLICK TO BUY   ·   1-6   ·   R REROLL   ·   ENTER TO CONTINUE';
  fitFont(keys, W - 40, '500', 10, "Barlow, 'Segoe UI', system-ui, sans-serif", 7.5);
  ctx.fillStyle = '#475569';
  ctx.fillText(keys, W / 2, H - 24);
  ctx.restore();
  W = W_; H = H_;
  ctx.restore();
}

/* -------------------------------- overlays -------------------------------- */
function drawPause() {
  ctx.fillStyle = 'rgba(3,5,10,0.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = "800 44px 'Chakra Petch', Barlow, system-ui, sans-serif";
  ctx.fillStyle = '#e2e8f0';
  ctx.fillText('PAUSED', W / 2, H / 2 - 56);
  ctx.font = "500 13px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = '#64748b';
  ctx.fillText('P or ESC to resume   ·   X codex', W / 2, H / 2 - 20);
  ctx.fillStyle = '#475569';
  ctx.font = "500 12px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillText(`${stage.name}  ·  Wave ${wave}  ·  Level ${P.level}  ·  ◈${credits}  ·  ${score.toLocaleString()} pts`,
    W / 2, H / 2 + 4);

  // volume, sensitivity and the effects panel all live behind this now
  const sb = pauseSetRect(), sh = inRect(mouse.x, mouse.y, sb);
  ctx.fillStyle = sh ? 'rgba(103,232,249,0.18)' : 'rgba(255,255,255,0.05)';
  roundRect(sb.x, sb.y, sb.w, sb.h, 8); ctx.fill();
  ctx.strokeStyle = rgba(COL.player, sh ? 0.8 : 0.3); ctx.lineWidth = 1.4;
  roundRect(sb.x, sb.y, sb.w, sb.h, 8); ctx.stroke();
  ctx.textAlign = "center";
  ctx.font = "700 12px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = sh ? '#e2e8f0' : COL.player;
  ctx.fillText('SETTINGS   [S]', sb.x + sb.w / 2, sb.y + sb.h / 2 + 4);

  const pulse = 0.6 + Math.sin(uiTime * 3) * 0.4;
  ctx.textAlign = 'center';
  ctx.font = "700 13px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = rgba('#f87171', pulse);
  ctx.fillText('M   —   MAIN MENU', W / 2, H / 2 + 92);
  ctx.font = "500 10px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = '#475569';
  ctx.fillText('this run is saved to your record before you leave', W / 2, H / 2 + 110);
}

/* The run report. Every line here is optional — a challenge win, a reward, a
   new best, a global rank, the escalation notice — so the screen is built as a
   measured stack rather than a column of fixed offsets: rows are collected,
   totalled, and the whole block is scaled and centred in the room available.
   That is what keeps a loaded report on a short window from running off the
   bottom edge, which the fixed offsets could not do. */
function drawDead() {
  ctx.fillStyle = 'rgba(3,5,10,0.86)';
  ctx.fillRect(0, 0, W, H);
  const s = lastStats || { score, wave, kills: 0, level: 1, time: 0 };
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const cw = s.chal && s.chalWon;
  const rows = [];
  const row = (hh, d) => rows.push({ h: hh, d });
  const CENTER = W / 2;
  const wide = W - 56;

  // eyebrow: which challenge, and whether the thing you were sent for survived
  if (s.chal) row(22, y => {
    ctx.save();
    ctx.letterSpacing = '0.16em';
    const t = s.chal.n + (cw ? '' : '   ·   ' + chalGoalName(s.chal) + ' STILL STANDS');
    fitFont(t, wide, '700', 11, "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
    ctx.fillStyle = cw ? '#fbbf24' : '#94a3b8';
    ctx.fillText(t, CENTER, y + 11);
    ctx.restore();
  });

  row(62, y => {
    const t = cw ? 'CHALLENGE CLEARED' : 'SIGNAL LOST';
    ctx.save();
    ctx.shadowColor = cw ? '#fbbf24' : '#ef4444'; ctx.shadowBlur = 30;
    ctx.letterSpacing = '0.05em';
    fitFont(t, wide, '700', 54, "'Chakra Petch', Barlow, system-ui, sans-serif", 24);
    ctx.fillStyle = cw ? '#fde68a' : '#f87171';
    ctx.fillText(t, CENTER, y + 33);
    ctx.restore();
  });

  // the number the whole screen is about
  row(76, y => {
    const t = s.score.toLocaleString();
    fitFont(t, wide, '800', 46, "'JetBrains Mono', ui-monospace, monospace", 22);
    ctx.fillStyle = '#f1f5f9';
    ctx.fillText(t, CENTER, y + 30);
    ctx.save();
    ctx.letterSpacing = '0.2em';
    ctx.font = "600 10px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = '#5b6b82';
    ctx.fillText('FINAL SCORE', CENTER, y + 62);
    ctx.restore();
  });

  if (s.sector) row(24, y => {
    ctx.save();
    ctx.letterSpacing = '0.1em';
    const t = 'REACHED   ' + s.sector + (s.loop ? '   ×' + (s.loop + 1) : '');
    fitFont(t, wide, '600', 12, "'Chakra Petch', Barlow, system-ui, sans-serif", 8);
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(t, CENTER, y + 12);
    ctx.restore();
  });

  /* Four figures on one rule, so they read as a set rather than four sentences.
     The columns take an equal share of the width they are allowed. */
  row(64, y => {
    const cols = [['WAVE', s.wave], ['KILLS', s.kills],
                  ['LEVEL', s.level], ['TIME', fmtTime(s.time)]];
    const bandW = Math.min(460, W - 56);
    const colW = bandW / cols.length;
    ctx.fillStyle = 'rgba(148,163,184,0.16)';
    ctx.fillRect(CENTER - bandW / 2, y + 4, bandW, 1);
    cols.forEach((c, i) => {
      const x = CENTER - bandW / 2 + colW * (i + 0.5);
      fitFont(String(c[1]), colW - 12, '800', 24,
              "'JetBrains Mono', ui-monospace, monospace", 12);
      ctx.fillStyle = '#cbd5e1';
      ctx.fillText(String(c[1]), x, y + 30);
      ctx.save();
      ctx.letterSpacing = '0.16em';
      fitFont(c[0], colW - 8, '600', 9, "Barlow, 'Segoe UI', system-ui, sans-serif", 7);
      ctx.fillStyle = '#475569';
      ctx.fillText(c[0], x, y + 50);
      ctx.restore();
    });
  });

  /* What the run earned, in one slot: a challenge reward outranks a personal
     best, which outranks the standing best. Only one of them is ever true. */
  if (s.chal && s.reward) row(42, y => {
    const t = 'UNLOCKED   ' + s.reward.n.toUpperCase();
    ctx.save();
    ctx.letterSpacing = '0.1em';
    fitFont(t, wide, '700', 13, "Barlow, 'Segoe UI', system-ui, sans-serif", 9);
    ctx.fillStyle = RARITY[s.reward.rar];
    ctx.fillText(t, CENTER, y + 9);
    ctx.restore();
    const d = s.reward.d + '  —  it is in your pool from now on';
    fitFont(d, wide, '500', 11, "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
    ctx.fillStyle = '#64748b';
    ctx.fillText(d, CENTER, y + 28);
  });
  else if (s.chal) row(26, y => {
    ctx.save();
    ctx.letterSpacing = '0.12em';
    const t = cw ? 'ALREADY CLEARED   ·   NOTHING NEW TO UNLOCK'
                 : chalCount() + ' / ' + CHALLENGES.length + '   CHALLENGES CLEARED';
    fitFont(t, wide, '700', 12, "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
    ctx.fillStyle = cw ? '#6ee7b7' : '#64748b';
    ctx.fillText(t, CENTER, y + 12);
    ctx.restore();
  });
  else if (s.isRecord && s.score > 0) row(26, y => {
    ctx.save();
    ctx.letterSpacing = '0.16em';
    fitFont('NEW PERSONAL BEST', wide, '700', 14,
            "Barlow, 'Segoe UI', system-ui, sans-serif", 9);
    ctx.fillStyle = COL.crit;
    ctx.fillText('NEW PERSONAL BEST', CENTER, y + 12);
    ctx.restore();
  });
  else row(26, y => {
    const t = 'BEST  ' + Save.profile.best.toLocaleString();
    fitFont(t, wide, '600', 12, "'JetBrains Mono', ui-monospace, monospace", 8);
    ctx.fillStyle = '#475569';
    ctx.fillText(t, CENTER, y + 12);
  });

  if (Board.rank) row(26, y => {
    ctx.save();
    ctx.letterSpacing = '0.08em';
    const t = 'GLOBAL RANK  #' + Board.rank +
              (Save.profile.name ? '   as ' + clipText(Save.profile.name, 14) : '');
    fitFont(t, wide, '700', 15, "'Chakra Petch', Barlow, system-ui, sans-serif", 10);
    ctx.fillStyle = Board.rank <= 3 ? COL.crit : '#38bdf8';
    ctx.fillText(t, CENTER, y + 13);
    ctx.restore();
  });
  else if (Board.note) row(22, y => {
    const t = 'leaderboard: ' + Board.note;
    fitFont(t, wide, '600', 11, "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
    ctx.fillStyle = '#475569';
    ctx.fillText(t, CENTER, y + 11);
  });

  /* The record noticing. It is permanent, so it is stated once, plainly, and
     not dressed up — the menu carries the standing mark from here on. */
  if (s.escalated) row(44, y => {
    const bw2 = Math.min(430, W - 48);
    ctx.fillStyle = 'rgba(69,10,10,0.4)';
    roundRect(CENTER - bw2 / 2, y + 2, bw2, 38, 9); ctx.fill();
    ctx.strokeStyle = rgba('#f87171', 0.3); ctx.lineWidth = 1;
    roundRect(CENTER - bw2 / 2, y + 2, bw2, 38, 9); ctx.stroke();
    ctx.save();
    ctx.letterSpacing = '0.16em';
    fitFont('YOU HAVE BEEN RE-FILED', bw2 - 24, '700', 12,
            "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
    ctx.fillStyle = '#f87171';
    ctx.fillText('YOU HAVE BEEN RE-FILED', CENTER, y + 15);
    ctx.restore();
    const d = 'five runs deep in a row — it stops being gentle, permanently';
    fitFont(d, bw2 - 24, '500', 10, "Barlow, 'Segoe UI', system-ui, sans-serif", 7.5);
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(d, CENTER, y + 30);
  });

  row(30, y => {
    const t = s.chal ? (isTouch ? 'TAP TO RUN IT AGAIN'
                                : 'SPACE RUN IT AGAIN   ·   M CHALLENGES')
            : mpGuest() ? 'WAITING FOR THE HOST TO RUN AGAIN'
            : isTouch  ? 'TAP TO RUN AGAIN'
            : 'PRESS SPACE / R TO RUN AGAIN';
    ctx.save();
    ctx.letterSpacing = '0.12em';
    fitFont(t, wide, '700', 13, "Barlow, 'Segoe UI', system-ui, sans-serif", 9);
    ctx.fillStyle = rgba(COL.player, 0.6 + Math.sin(uiTime * 4) * 0.4);
    ctx.fillText(t, CENTER, y + 16);
    ctx.restore();
  });

  const total = rows.reduce((a, r) => a + r.h, 0);
  const sc = clamp((H - 48) / total, 0.55, 1);
  ctx.save();
  if (sc < 1) {
    ctx.translate(CENTER, H / 2);
    ctx.scale(sc, sc);
    ctx.translate(-CENTER, -H / 2);
  }
  let y = H / 2 - total / 2;
  for (const r of rows) { r.d(y); y += r.h; }
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

function renderMenu() {
  // background field
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const t = p.life / p.max;
    drawGlow(p.x, p.y, p.r * 4, p.color, t * 0.5);
  }
  ctx.restore();

  const cxp = W / 2;
  /* The centre column is a fixed 390px stack — emblem, wordmark, pilot select,
     the prompt, the run totals. On a short window it used to run straight
     through the footer and off the bottom edge, so it now scales and centres
     itself in the room left between the corner badges and the footer. */
  const COL_TOP = -152, COL_BOT = 238;
  /* Below this the footer is decoration standing between the column and the
     bottom of the screen, so it stands down and the column takes the room. */
  const roomy = H >= 430, tiny = H < 340;
  /* Three footers, and the column is measured against whichever one is up:
     the full one, one without the unlocks and profile lines, and — when there
     is really nothing to spare — one control line and the volume slider. */
  const topLimit = 96, footTop = H - (roomy ? 138 : tiny ? 72 : 92);
  const avail = Math.max(96, footTop - topLimit);
  const menuScale = clamp(avail / (COL_BOT - COL_TOP), 0.3, 1);
  /* Centred in the band between the corner buttons and the footer — never on
     the screen's own centre line, which sits lower than the band does and used
     to push the run totals straight through the unlocks row. */
  const cyp = topLimit + avail / 2 - (COL_TOP + COL_BOT) / 2 * menuScale;
  ctx.save();
  if (menuScale < 1) {
    ctx.translate(cxp, cyp);
    ctx.scale(menuScale, menuScale);
    ctx.translate(-cxp, -cyp);
  }
  // rotating emblem
  ctx.save();
  ctx.translate(cxp, cyp - 96);
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(0, 0, 96, COL.player, 0.32);
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = rgba(COL.player, 0.85); ctx.lineWidth = 2;
  poly(0, 0, 42, 3, uiTime * 0.6); ctx.stroke();
  poly(0, 0, 30, 3, -uiTime * 0.9 + 1); ctx.stroke();
  ctx.strokeStyle = rgba('#f472b6', 0.7);
  poly(0, 0, 56, 6, uiTime * 0.32); ctx.stroke();
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.save();
  ctx.shadowColor = COL.player; ctx.shadowBlur = 34;
  ctx.font = `800 ${Math.min(84, W * 0.13)}px Barlow, system-ui, sans-serif`;
  ctx.fillStyle = '#e0f2fe';
  ctx.fillText('VOIDRUNNER', cxp, cyp - 6);
  ctx.restore();

  ctx.font = "600 12px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = '#475569';
  ctx.fillText('S U R V I V E   T H E   A R E N A', cxp, cyp + 26);

  // --- pilot select ---
  const C = CHAR();
  const selY = cyp + 88;
  ctx.font = "700 9px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = '#334155';
  ctx.fillText('PILOT   —   PRESS C', cxp, selY - 30);
  // both hulls, the chosen one lit
  CHARS.forEach((ch, i) => {
    const on = i === selectedChar;
    const shut = !charOpen(ch);
    const hx = cxp + (i - (CHARS.length - 1) / 2) * 116;
    ctx.save();
    ctx.translate(hx, selY);
    if (on) {
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(0, 0, 42, ch.col, 0.45);
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.rotate(-Math.PI / 2);
    ctx.globalAlpha = shut ? 0.14 : (on ? 1 : 0.32);
    ctx.lineWidth = 2.2;
    hullPath(ch.id);
    ctx.fillStyle = rgba(ch.col, on ? 0.22 : 0.1);
    ctx.strokeStyle = ch.col;
    ctx.fill(); ctx.stroke();
    ctx.restore();
    if (shut) {
      const have = MALWARE.filter(m => (Save.profile.codexM || []).includes(m.id)).length;
      const full = have >= MALWARE.length;
      ctx.font = "700 8px Barlow, 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = full ? '#a3e635' : '#334155';
      ctx.fillText(full ? 'READY' : 'LOCKED', hx, selY + 26);
      ctx.font = "600 8px 'JetBrains Mono', ui-monospace, monospace";
      ctx.fillStyle = full ? '#a3e635' : '#2b3a4f';
      ctx.fillText(have + '/' + MALWARE.length + ' MALWARE', hx, selY + 37);
    }
  });
  ctx.font = "800 15px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = C.col;
  ctx.fillText(C.n, cxp, selY + 38);
  ctx.font = "500 10px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = '#475569';
  ctx.fillText(C.tag, cxp, selY + 54);

  const pulse = 0.55 + Math.sin(uiTime * 3.4) * 0.45;
  ctx.font = "700 16px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = rgba(COL.player, pulse);
  ctx.fillText(isTouch ? 'TAP TO START' : 'PRESS SPACE TO START', cxp, cyp + 174);

  const pr = Save.profile;
  if (pr.best > 0) {
    ctx.font = "600 12px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = COL.crit;
    ctx.fillText('BEST  ' + pr.best.toLocaleString(), cxp, cyp + 204);
  }
  if (pr.runs > 0) {
    const totals = `${pr.runs} RUN${pr.runs === 1 ? '' : 'S'}   ·   ${pr.kills.toLocaleString()} KILLS   ·   ` +
                   `FURTHEST ${pr.bestSector} W${pr.bestWave}   ·   ${fmtTime(pr.time)}`;
    fitFont(totals, (W - 40) / menuScale, '500', 11,
            "Barlow, 'Segoe UI', system-ui, sans-serif", 7.5);
    ctx.fillStyle = '#475569';
    ctx.fillText(totals, cxp, cyp + 224);
  }
  ctx.restore();                     // end of the scaled centre column

  // leaderboard — the global board when it's reachable, your own runs otherwise
  const global = Board.top.length > 0;
  /* One row, drawn identically in both layouts below: figures in the mono face
     on the right, who and where on the left, and your own row carried on a
     tinted pill so you can find yourself without reading the list. */
  const boardRow = (r, i, xc, y, half) => {
    const mine = global && r.name === Save.profile.name;
    if (mine) {
      ctx.fillStyle = rgba(COL.player, 0.09);
      roundRect(xc - half, y - 8.5, half * 2, 17, 4); ctx.fill();
    }
    ctx.textAlign = 'right';
    ctx.font = "700 11px 'JetBrains Mono', ui-monospace, monospace";
    ctx.fillStyle = mine ? COL.player : (i === 0 ? COL.crit : '#7c8ba1');
    ctx.fillText(String((r.score || 0).toLocaleString()), xc - 9, y);
    ctx.textAlign = 'left';
    const label = global
      ? `${i + 1}. ${clipText(r.name || '—', 12)}  ·  ${r.sector || '—'} W${r.wave}`
      : `${r.sector || '—'}  ·  W${r.wave}  ·  LV${r.level}`;
    fitFont(label, half - 14, '600', 11, "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
    ctx.fillStyle = mine ? COL.player : '#5b6b82';
    ctx.fillText(label, xc + 9, y);
  };
  const all = (global ? Board.top : Save.top).slice(0, 5);
  /* Two layouts, because stacking the board under the centre column puts it on
     a collision course with the bottom-anchored footer — and on a short window
     there is simply no gap left to put it in.

     Wide screens have a large empty margin either side of the title, so the
     board moves out there and the collision cannot happen at all. Narrower
     screens keep the stacked version, fitting whole rows into the measured gap
     and dropping the lowest ranks first rather than overlapping anything. */
  const FOOT_TOP = H - 112;                    // first footer line: the unlocks row
  const rowGap = 15;

  /* Measure the title rather than guessing at it — the side panel is only
     viable if it genuinely clears both the wordmark and the screen edge, and
     that depends on the font size, which scales with width. */
  ctx.save();
  ctx.font = `800 ${Math.min(84, W * 0.13)}px Barlow, system-ui, sans-serif`;
  const titleHalf = ctx.measureText('VOIDRUNNER').width / 2 * menuScale;
  ctx.restore();
  const panelHalf = 104;
  const px = Math.min(cxp + titleHalf + 46 + panelHalf, W - panelHalf - 14);
  const wide = (px - panelHalf) > (cxp + titleHalf + 26) && (px + panelHalf) < W - 10;

  if (wide) {
    let py = cyp - 40 * menuScale;
    ctx.textAlign = 'center';
    ctx.save();
    ctx.letterSpacing = '0.16em';
    ctx.font = "700 9px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = '#475569';
    ctx.fillText(global ? 'GLOBAL TOP ' + all.length : 'YOUR BEST RUNS', px, py);
    ctx.restore();
    // a hairline under the heading: the board is a table and reads like one
    ctx.fillStyle = 'rgba(71,85,105,0.35)';
    ctx.fillRect(px - panelHalf + 8, py + 8, panelHalf * 2 - 16, 1);
    py += 22;
    all.forEach((r, i) => boardRow(r, i, px, py + i * 17, panelHalf));
    ctx.textAlign = 'center';
  } else {
    const ly = cyp + 250 * menuScale;
    const room = (FOOT_TOP - 22) - (ly + 18);  // 22px of air above the footer
    const fits = room < 0 ? 0
               : Math.max(0, Math.min(all.length, Math.floor(room / rowGap) + 1));
    const rows = all.slice(0, fits);
    if (rows.length) {
      ctx.save();
      ctx.letterSpacing = '0.16em';
      ctx.font = "700 9px Barlow, 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = '#475569';
      ctx.fillText(global ? 'GLOBAL TOP ' + rows.length : 'YOUR BEST RUNS', cxp, ly);
      ctx.restore();
      const sHalf = Math.min(118, W / 2 - 20);
      ctx.fillStyle = 'rgba(71,85,105,0.35)';
      ctx.fillRect(cxp - sHalf + 8, ly + 8, sHalf * 2 - 16, 1);
      rows.forEach((r, i) => boardRow(r, i, cxp, ly + 20 + i * rowGap, sHalf));
      ctx.textAlign = 'center';
    }
  }

  const unlocks = [];
  if (Save.profile.planetarium) unlocks.push(['✦ PLANETARIUMS', '#fbbf24']);
  if (Save.profile.altPath) unlocks.push(['◈ THE FRACTURE', '#e2e8f0']);
  if (Save.profile.trueEnd) unlocks.push(['✥ THE UNWRITTEN', '#f8fafc']);
  if (Save.profile.hardened) unlocks.push(['⚠ ESCALATION', '#f87171']);
  else {
    const hp = hardProgress();
    if (hp && hp.good >= 3) unlocks.push(['⚠ BEING WATCHED  ' + hp.good + '/' + hp.need, '#fbbf24']);
  }
  if (Save.profile.freeplay) unlocks.push(['⌨ FREEPLAY  [F]', '#38bdf8']);
  else if (Save.profile.clears > 0)
    unlocks.push([`◈ ${Save.profile.clears} / 2 CLEARS`, '#475569']);
  if (unlocks.length && roomy) {
    /* One row while it fits, two centred rows when it does not — a narrow
       portrait window used to push the first and last badge off both edges. */
    const maxRow = W - 36;
    const measure = (list, gap) => {
      ctx.font = "700 10px Barlow, 'Segoe UI', system-ui, sans-serif";
      return list.reduce((a, u) => a + ctx.measureText(u[0]).width, 0) +
             gap * (list.length - 1);
    };
    let gap = 22;
    let rows2 = [unlocks];
    if (measure(unlocks, gap) > maxRow) {
      gap = 14;
      if (measure(unlocks, gap) > maxRow && unlocks.length > 1) {
        const half = Math.ceil(unlocks.length / 2);
        rows2 = [unlocks.slice(0, half), unlocks.slice(half)];
      }
    }
    ctx.textAlign = 'left';
    const rowY = H - 112 - (rows2.length - 1) * 14;
    rows2.forEach((row, ri) => {
      const scale = Math.min(1, maxRow / Math.max(1, measure(row, gap)));
      fitFont(row.map(u => u[0]).join(''), maxRow, '700', 10,
              "Barlow, 'Segoe UI', system-ui, sans-serif", 7.5);
      const rw2 = row.reduce((a, u) => a + ctx.measureText(u[0]).width, 0) +
                  gap * scale * (row.length - 1);
      let ux2 = cxp - rw2 / 2;
      row.forEach(u => {
        ctx.fillStyle = u[1];
        ctx.fillText(u[0], ux2, rowY + ri * 14);
        ux2 += ctx.measureText(u[0]).width + gap * scale;
      });
    });
    ctx.textAlign = 'center';
  }

  // who you are on the board
  if (Save.profile.name && roomy) {
    ctx.save();
    ctx.letterSpacing = '0.1em';
    const asLine = `PLAYING AS ${clipText(Save.profile.name.toUpperCase(), 16)}   ·   PRESS N TO RENAME`;
    fitFont(asLine, W - 48, '600', 10, "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
    ctx.fillStyle = '#475569';
    ctx.fillText(asLine, cxp, H - 96);
    ctx.restore();
  }

  // status badges — save backend and global board, at a glance
  const badge = { cloud: ['◈ FIREPROOF SYNC', '#34d399'],
                  connecting: ['◈ CONNECTING…', '#64748b'],
                  error: ['◈ LOCAL SAVE (offline)', '#64748b'],
                  local: ['◈ LOCAL SAVE', '#475569'] }[Save.status];
  const bBadge = { ok: ['◈ LEADERBOARD LIVE', '#38bdf8'],
                   loading: ['◈ LEADERBOARD…', '#475569'],
                   offline: ['◈ LEADERBOARD OFFLINE', '#475569'],
                   idle: ['', '#475569'] }[Board.status];
  ctx.save();
  ctx.textAlign = 'right';
  ctx.letterSpacing = '0.1em';
  const badges = [badge, (bBadge && bBadge[0]) ? bBadge : null].filter(Boolean);
  badges.forEach((b, i) => {
    const y = 22 + i * 16;
    const txt = b[0].replace('◈ ', '');
    // the LAN and challenge entries own the top left; stay in the right gutter
    fitFont(txt, Math.max(80, W / 2 - 40), '600', 10,
            "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
    ctx.fillStyle = b[1];
    ctx.fillText(txt, W - 18, y);
    ctx.beginPath();
    ctx.arc(W - 18 - ctx.measureText(txt).width - 8, y, 2.6, 0, TAU);
    ctx.fill();
  });
  ctx.restore();
  ctx.textAlign = 'center';

  const lines = isTouch
    ? ['LEFT SIDE — move   ·   RIGHT SIDE — aim & fire']
    : tiny
      ? ['WASD move  ·  MOUSE aim  ·  SPACE dash  ·  S settings']
      : ['WASD move   ·   MOUSE aim   ·   HOLD to fire',
         'SPACE dash (i-frames)   ·   P pause   ·   X codex   ·   S settings'];
  ctx.fillStyle = '#334155';
  const ly2 = tiny ? H - 56 : H - 74;
  lines.forEach((l, i) => {
    fitFont(l, W - 32, '500', 11, "Barlow, 'Segoe UI', system-ui, sans-serif", 7.5);
    ctx.fillText(l, cxp, ly2 + i * 18);
  });

  drawMenuLan();
  drawMenuChal();
  drawBetaMark();

  drawMenuSet();

  drawVignette();
}

/* -------------------------------- library UI ------------------------------- */
function libraryButtons() {
  const bw = Math.min(180, W * 0.32), bh = 38, y = H / 2 + 136;
  const b = { take:  { x: W / 2 - bw - 8, y, w: bw, h: bh },
              leave: { x: W / 2 + 8,      y, w: bw, h: bh } };
  if (keeperWants()) b.hand = { x: W / 2 - bw / 2, y: y + 46, w: bw, h: bh };
  else if (keeperTalks()) b.talk = { x: W / 2 - bw / 2, y: y + 46, w: bw, h: bh };
  return b;
}

/* ------------------------------ the bookkeeper -----------------------------
   He is behind the desk of every library, and he is only ever waiting for one
   thing. Hand him the finished record and he stops being scenery.
--------------------------------------------------------------------------- */
const KEEPER_COL = '#fcd34d';

/* He takes the record as often as you bring it. This used to be once ever,
   which stranded anyone who beat him before his own book became a codex
   entry: book_keeper is only awarded by beating him, trulyFull() needs it,
   and the talk needs trulyFull() — so the record could never be finished and
   THE UNWRITTEN could never be reached. He only steps aside for the talk. */
function keeperWants() {
  return state === 'library' && !malwareOffer && Codex.complete() &&
         !(P.book && P.book.id === 'keeper') &&   // already carrying his copy this run
         !keeperTalks();
}

function keeperLine() {
  const h = Codex.have();
  // the talk no longer waits on a finished record, so he only claims to have
  // read one when there is one
  if (keeperTalks())
    return Codex.trulyFull()
      ? 'You finished it. I read it. Take what you like.'
      : 'The record can wait. There is one entry it was never going to hold.';
  if (P.book && P.book.id === 'keeper')
    return 'You have my copy already. Go and use it.';
  if (Codex.complete())
    return Save.profile.keeperDone
      ? 'Again? Hand it here. I will read it again.'
      : 'That is all of it. Every entry. Hand it here.';
  if (h.e < h.needE && h.u < h.needU)
    return 'Still gaps in both halves. ' + (h.needE - h.e) + ' unseen, ' +
           (h.needU - h.u) + ' unwritten.';
  if (h.e < h.needE)
    return (h.needE - h.e) + ' still unseen. I cannot file an incomplete bestiary.';
  return (h.needU - h.u) + ' entries still unwritten. Come back when the list is closed.';
}

function drawKeeperNPC(cx, cy, s) {
  const wants = keeperWants();
  const bob = Math.sin(uiTime * 1.6) * 2;
  ctx.save();
  ctx.translate(cx, cy + bob);
  if (wants) {
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(0, 0, s * 2.4, KEEPER_COL, 0.3 + Math.sin(uiTime * 3) * 0.12);
    ctx.globalCompositeOperation = 'source-over';
  }
  // a tall stooped figure behind a desk, holding a ledger
  ctx.strokeStyle = wants ? KEEPER_COL : '#a16207';
  ctx.fillStyle = wants ? 'rgba(252,211,77,0.14)' : 'rgba(161,98,7,0.08)';
  ctx.lineWidth = 2.2;
  ctx.beginPath();                              // hood / shoulders
  ctx.moveTo(0, -s);
  ctx.lineTo(s * 0.62, -s * 0.1);
  ctx.lineTo(s * 0.5, s);
  ctx.lineTo(-s * 0.5, s);
  ctx.lineTo(-s * 0.62, -s * 0.1);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath();                              // the ledger he is holding
  ctx.rect(-s * 0.34, s * 0.05, s * 0.68, s * 0.42);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, s * 0.05); ctx.lineTo(0, s * 0.47);
  ctx.stroke();
  // two points of light where a face would be
  ctx.fillStyle = wants ? '#fef3c7' : '#a16207';
  ctx.beginPath(); ctx.arc(-s * 0.17, -s * 0.42, 2.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.17, -s * 0.42, 2.2, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ---------------------------------- freeplay -------------------------------
   What he offers instead of the fight: the keys. A run started from here is
   marked, and a marked run never touches your record — no score, no best, no
   leaderboard, no codex entries, no unlocks. It is a sandbox and it says so.
-------------------------------------------------------------------------- */
let freeRun = false, freeOpen = false, freeSel = 0, freeGod = false, freeSpd = 1;

const FREE_ROWS = [
  { n: 'GODMODE',        f: () => { freeGod = !freeGod; },  on: () => freeGod },
  { n: 'HEAL',           f: () => { P.hp = P.maxHp; } },
  { n: 'CLEAR THE ROOM', f: () => {
      for (const e of enemies.slice()) if (!e.dead) {
        e.invuln = 0; e.floor = undefined; e.dmgCap = undefined; e.kShield = 0;
        damageEnemy(e, 1e9, false, P.x, P.y);
      }
      ebullets.length = 0; } },
  { n: '+1 LEVEL',       f: () => { P.xp = P.xpNext; checkLevel(); } },
  { n: '+500 CREDITS',   f: () => { credits += 500; } },
  { n: 'NEXT WAVE',      f: () => { betweenWaves = 0.2; spawnBudget = 0;
                                    enemies.length = 0; ebullets.length = 0; } },
  { n: 'SPAWN BOSS',     f: () => {
      const keys = Object.keys(BOSSES).filter(k => !BOSSES[k].endgame);
      const k = keys[(freeBoss = (freeBoss + 1) % keys.length)];
      const a = rnd(TAU);
      spawnEnemy('boss', clamp(P.x + Math.cos(a) * 340, arena.x0 + 90, arena.x1 - 90),
                         clamp(P.y + Math.sin(a) * 340, arena.y0 + 90, arena.y1 - 90),
                 { boss: k });
      bossAlive = true; banner(BOSSES[k].name, BOSSES[k].col, 2.0); } },
  { n: 'SPAWN A CROWD',  f: () => {
      const pool = Object.keys(ETYPE).filter(k => k !== 'boss' && k !== 'egg');
      for (let i = 0; i < 8; i++) {
        const a = rnd(TAU), r = rnd(420, 240);
        spawnEnemy(pick(pool), clamp(P.x + Math.cos(a) * r, arena.x0 + 50, arena.x1 - 50),
                               clamp(P.y + Math.sin(a) * r, arena.y0 + 50, arena.y1 - 50),
                   { elite: false });
      } } },
  { n: 'NEXT SECTOR',    f: () => {
      freeStage = (freeStage + 1) % (STAGES.length + ALT_STAGES.length);
      const s = freeStage < STAGES.length ? STAGES[freeStage]
                                         : ALT_STAGES[freeStage - STAGES.length];
      enemies.length = 0; ebullets.length = 0; portals.length = 0;
      awaitingPortal = false;
      enterStage(s); betweenWaves = 0.6; } },
  { n: 'GIVE A BOOK',    f: () => {
      const keys = Object.keys(BOOKS);
      const k = keys[(freeBook = (freeBook + 1) % keys.length)];
      P.book = BOOKS[k]; P.bookCharge = BOOKS[k].cost;
      banner(BOOKS[k].n, BOOKS[k].col, 1.8); } },
  { n: 'GIVE MALWARE',   f: () => {
      const m = MALWARE[(freeMal = (freeMal + 1) % MALWARE.length)];
      P.malware = m; banner(m.n, m.col, 1.8); } },
  { n: 'GIVE A READING', f: () => {
      const s = SIGNS[(freeSign = (freeSign + 1) % SIGNS.length)];
      s.f(P); banner(s.n, s.good ? '#fbbf24' : '#a855f7', 1.8); } },
  { n: 'THE RECORD CHIP',f: () => { P.chip = true; banner('THE RECORD CHIP', CHIP_COL, 1.8); } },
  { n: 'TIME  ×',        f: () => { freeSpd = freeSpd >= 4 ? 0.25 : freeSpd * 2; },
    val: () => freeSpd + '×' },
  { n: 'END THE RUN',    f: () => { freeRun = false; state = 'menu'; freeOpen = false; } }
];
let freeBoss = -1, freeStage = -1, freeBook = -1, freeMal = -1, freeSign = -1;

function startFreeplay() {
  resetGame();
  freeRun = true;                        // set after reset: reset clears it
  freeOpen = false; freeSel = 0; freeGod = false; freeSpd = 1;

}

/* --------------------------- the last conversation -------------------------
   Only reachable with every section of the record filled and his notes already
   in it. He does not fight for this one; he asks. */
const KEEPER_TALK = [
  'You brought it back finished.',
  'Every section. The optional ones as well. I did not expect that.',
  'I have been filing this place since before it had sectors. ' +
  'I have watched a great many people stop.',
  'There is one entry I never wrote. Not for lack of trying — ' +
  'it does not hold ink.',
  'I can leave you the keys instead. The room, the roster, all of it, ' +
  'yours to arrange. Nothing recorded, nothing ranked. Restful.',
  'Or.'
];

let talkLine = 0, talkT = 0, talkAsk = false;

/* Opens on the boss the library came from, nothing else. It used to want a
   truly-full codex, keeperDone, and an unclosed record — and that last term
   is why the door could vanish for good: trueEnd means THE UNWRITTEN has
   already been closed, so finishing it once (or unlocking everything on a
   dev build, which sets the same flag) locked the room out permanently. */
function keeperTalks() {
  if (state !== 'library' || malwareOffer || !libraryBook) return false;
  const r = bossRank(libraryBook.id);
  return r >= 0 && r >= bossRank(UNW_FROM_BOSS);
}

function startTalk() {
  libraryBook = null; malwareOffer = null;
  talkLine = 0; talkT = 0; talkAsk = false;
  state = 'talk'; uiArm = 0.35;
  Audio_.select();
}

function talkAdvance() {
  if (uiArm > 0) return;
  if (talkAsk) return;
  talkLine++;
  uiArm = 0.18;
  Audio_.tone(520, 0.05, 'sine', 0.04, 700);
  if (talkLine >= KEEPER_TALK.length) { talkAsk = true; talkLine = KEEPER_TALK.length - 1; }
}

function talkAnswer(yes) {
  if (!talkAsk || uiArm > 0) return;
  if (yes) {
    state = 'play';
    uiArm = 0.3;
    startUnwritten();

    Save.profile.freeplay = true;
    Save.writeLocal(); Save.flush();
    state = 'play';
    uiArm = 0.3;
    banner('FREEPLAY UNLOCKED', '#38bdf8', 4.4);
    setTimeout(() => { if (state === 'play') banner('NOTHING THERE IS RECORDED', '#64748b', 3.4); }, 3000);
    Audio_.levelup();
  }
}

function drawTalk() {

     stretched to the window, and the size eases down on small screens. */

             "px Barlow, 'Segoe UI', system-ui, sans-serif";

           cx, cy - 20, Math.min(620, W - 90), 25);

function talkButtons() {

           yes: { x: W / 2 + 10,      y, w: bw, h: bh } };

function handOverCodex() {

function startKeeperFight() {
