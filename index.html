<script>
"use strict";
/* ============================================================================
   VOIDRUNNER — a single-file neon roguelite arena shooter.
   No assets, no dependencies. Everything (art, audio, physics) is generated.
   ========================================================================== */

/* ---------------------------------- math --------------------------------- */
const TAU = Math.PI * 2;
const rnd  = (a = 1, b = 0) => b + Math.random() * (a - b);
const rndi = (a, b = 0) => Math.floor(rnd(a, b));
const pick = arr => arr[(Math.random() * arr.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const len = (x, y) => Math.hypot(x, y);
const angLerp = (a, b, t) => { let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * t; };

/* --------------------------------- canvas -------------------------------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
window.addEventListener('resize', resize);
resize();

/* ------------------------------ glow sprites ------------------------------
   Radial-gradient sprites cached per colour, blitted additively. Far cheaper
   than shadowBlur and it gives the whole game its bloom.
--------------------------------------------------------------------------- */
const _glowCache = new Map();
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function glowSprite(color) {
  let s = _glowCache.get(color);
  if (s) return s;
  const S = 96, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  grd.addColorStop(0.00, rgba(color, 1));
  grd.addColorStop(0.18, rgba(color, 0.75));
  grd.addColorStop(0.45, rgba(color, 0.22));
  grd.addColorStop(1.00, rgba(color, 0));
  g.fillStyle = grd; g.fillRect(0, 0, S, S);
  _glowCache.set(color, c);
  return c;
}
function drawGlow(x, y, r, color, a = 1) {
  ctx.globalAlpha = a;
  ctx.drawImage(glowSprite(color), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1;
}

/* ---------------------------------- audio --------------------------------
   Tiny WebAudio synth: all SFX are oscillator/noise blips, plus a scheduled
   music bed that gets busier as the run heats up.
--------------------------------------------------------------------------- */
const Audio_ = {
  ac: null, master: null, musicGain: null, sfxGain: null,
  muted: false, noiseBuf: null, ready: false,
  init() {
    if (this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain(); this.master.gain.value = this.muted ? 0 : 0.9;
    this.master.connect(this.ac.destination);
    this.sfxGain = this.ac.createGain(); this.sfxGain.gain.value = 0.34;
    this.sfxGain.connect(this.master);
    this.musicGain = this.ac.createGain(); this.musicGain.gain.value = 0.0;
    this.musicGain.connect(this.master);
    // shared noise buffer
    const n = this.ac.sampleRate * 1.2, buf = this.ac.createBuffer(1, n, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
    this.ready = true;
    this.nextStep = this.ac.currentTime + 0.1;
  },
  resume() { if (this.ac && this.ac.state === 'suspended') this.ac.resume(); },

  tone(freq, dur, type = 'square', vol = 0.3, to = null, delay = 0, dest = null) {
    if (!this.ready || this.muted) return;
    const ac = this.ac, t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(20, to), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfxGain);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.3, f0 = 3000, f1 = 200, q = 1, delay = 0) {
    if (!this.ready || this.muted) return;
    const ac = this.ac, t = ac.currentTime + delay;
    const s = ac.createBufferSource(); s.buffer = this.noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.sfxGain);
    s.start(t); s.stop(t + dur + 0.02);
  },

  shoot()   { this.tone(660 + rnd(90), 0.07, 'square', 0.10, 200); },
  hit()     { this.noise(0.05, 0.16, 2600, 700, 1); },
  crit()    { this.tone(1400, 0.09, 'sawtooth', 0.11, 500); this.noise(0.06, 0.14, 5000, 900); },
  kill()    { this.noise(0.18, 0.20, 1500, 90, 2); this.tone(180, 0.14, 'triangle', 0.10, 60); },
  boom()    { this.noise(0.5, 0.34, 900, 40, 3); this.tone(90, 0.4, 'sine', 0.20, 30); },
  dash()    { this.noise(0.22, 0.14, 5200, 500, 4); },
  hurt()    { this.tone(190, 0.28, 'sawtooth', 0.22, 55); this.noise(0.2, 0.14, 900, 120); },
  gem()     { this.tone(880 + rnd(200), 0.05, 'sine', 0.055, 1500); },
  heal()    { [0, 4, 7, 12].forEach((s, i) => this.tone(523.25 * Math.pow(2, s / 12), 0.16, 'sine', 0.10, null, i * 0.05)); },
  levelup() { [0, 5, 7, 12, 16].forEach((s, i) => this.tone(392 * Math.pow(2, s / 12), 0.3, 'triangle', 0.13, null, i * 0.06)); },
  wave()    { [0, 7, 12].forEach((s, i) => this.tone(261.6 * Math.pow(2, s / 12), 0.5, 'sine', 0.10, null, i * 0.09)); },
  boss()    { this.tone(70, 1.4, 'sawtooth', 0.24, 42); this.noise(1.2, 0.2, 500, 40, 2); },
  over()    { [12, 7, 3, 0].forEach((s, i) => this.tone(330 * Math.pow(2, s / 12), 0.5, 'triangle', 0.14, null, i * 0.13)); },
  select()  { this.tone(760, 0.06, 'square', 0.09, 1100); },

  /* --- music: 16-step loop, layers unlock with intensity --- */
  nextStep: 0, step: 0, intensity: 0,
  update(intensity) {
    if (!this.ready || this.muted) return;
    this.intensity = lerp(this.intensity, intensity, 0.02);
    this.musicGain.gain.value = 0.5;
    const bpm = 96 + this.intensity * 34;
    const spb = 60 / bpm / 2;
    const now = this.ac.currentTime;
    if (this.nextStep < now) this.nextStep = now + 0.05;
    while (this.nextStep < now + 0.25) {
      this.playStep(this.step % 16, this.nextStep);
      this.step++; this.nextStep += spb;
    }
  },
  playStep(s, t) {
    const root = 55, scale = [0, 3, 5, 7, 10];
    const prog = [0, 0, -2, 3];
    const bar = ((this.step / 16) | 0) % 4;
    const key = prog[bar];
    const g = this.musicGain;
    const f = (semi, oct = 0) => root * Math.pow(2, (semi + key) / 12 + oct);
    if (s % 4 === 0) this.tone(f(0), 0.42, 'triangle', 0.16, null, t - this.ac.currentTime, g);
    if (s === 6 || s === 11) this.tone(f(scale[2]), 0.3, 'triangle', 0.11, null, t - this.ac.currentTime, g);
    if (this.intensity > 0.22 && s % 2 === 1) {
      const n = scale[(s * 3 + this.step) % scale.length];
      this.tone(f(n, 3), 0.13, 'square', 0.030 + this.intensity * 0.022, null, t - this.ac.currentTime, g);
    }
    if (this.intensity > 0.5 && s % 4 === 2) this.noise(0.05, 0.05, 8000, 4000, 1, t - this.ac.currentTime);
  }
};

/* --------------------------------- world --------------------------------- */
const WORLD = { w: 2400, h: 1700 };

const COL = {
  bg: '#05060a', grid: '#0e1626', wall: '#1d3557',
  player: '#67e8f9', bullet: '#a5f3fc', crit: '#fde047',
  xp: '#22d3ee', hp: '#34d399', shield: '#818cf8',
  elite: '#fbbf24'

/* --------------------------------- arena ----------------------------------
   The playable box. Normally the whole world, but it can be driven inward —
   THE OTHER's finale closes the walls in around itself. Everything that
   collides with a wall reads these instead of WORLD, so the boundary can move
   without anything else needing to know.
--------------------------------------------------------------------------- */
const arena = { x0: 0, y0: 0, x1: WORLD.w, y1: WORLD.h,
                tx0: 0, ty0: 0, tx1: WORLD.w, ty1: WORLD.h };

function arenaReset(instant) {
  arena.tx0 = 0; arena.ty0 = 0; arena.tx1 = WORLD.w; arena.ty1 = WORLD.h;
  if (instant) { arena.x0 = 0; arena.y0 = 0; arena.x1 = WORLD.w; arena.y1 = WORLD.h; }
}
function arenaShrinkTo(cx, cy, w, h) {
  arena.tx0 = clamp(cx - w / 2, 0, WORLD.w - w);
  arena.ty0 = clamp(cy - h / 2, 0, WORLD.h - h);
  arena.tx1 = arena.tx0 + w;
  arena.ty1 = arena.ty0 + h;
}
function updateArena(dt) {
  const k = 1 - Math.exp(-2.4 * dt);
  arena.x0 = lerp(arena.x0, arena.tx0, k);
  arena.y0 = lerp(arena.y0, arena.ty0, k);
  arena.x1 = lerp(arena.x1, arena.tx1, k);
  arena.y1 = lerp(arena.y1, arena.ty1, k);
}
let lastBossDeath = null;

/* ------------------------------ entity pools ------------------------------ */
let enemies = [], bullets = [], ebullets = [], gems = [], drops = [],
    parts = [], floats = [], arcs = [], rings = [], corpses = [],
    hazards = [], mortars = [], sentries = [], beams = [],
    portals = [], cages = [];
// Rolling record of where the player has been — MIMIC replays it back at you.
let replay = [];

const partPool = [];
function spawnPart(x, y, vx, vy, r, color, life, drag = 0.94, glow = true) {
  if (parts.length > 1400) return;
  const p = partPool.pop() || {};
  p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.r = r; p.color = color;
  p.life = life; p.max = life; p.drag = drag; p.glow = glow;
  parts.push(p);
  return p;
}
function burst(x, y, n, color, spd = 200, size = 3, life = 0.5, spread = TAU, dir = 0) {
  for (let i = 0; i < n; i++) {
    const a = dir + (spread >= TAU ? rnd(TAU) : rnd(-spread / 2, spread / 2));
    const s = spd * rnd(1.2, 0.25);
    spawnPart(x, y, Math.cos(a) * s, Math.sin(a) * s, size * rnd(1.4, 0.5), color, life * rnd(1.3, 0.6));
  }
}
function floatText(x, y, text, color, size = 14, vy = -46) {
  if (floats.length > 90) floats.shift();
  floats.push({ x, y, text, color, size, vy, life: 0.72, max: 0.72 });
}
function ringFx(x, y, r0, r1, color, life = 0.35, lw = 3) {
  rings.push({ x, y, r0, r1, r: r0, color, life, max: life, lw });
}

/* --------------------------------- camera -------------------------------- */
const cam = { x: WORLD.w / 2, y: WORLD.h / 2, trauma: 0, sx: 0, sy: 0 };
function shake(t) { cam.trauma = Math.min(1, cam.trauma + t); }

/* How much a world-space event should register on screen. 1 while it is in
   view, tapering to 0 once it is well outside the frame. Without this, a vent
   erupting on the far side of the arena whites out a screen it isn't even on. */
function onScreen(x, y, pad = 90) {
  const dx = Math.abs(x - cam.x) - (W / 2 + pad);
  const dy = Math.abs(y - cam.y) - (H / 2 + pad);
  if (dx <= 0 && dy <= 0) return 1;
  const d = Math.hypot(Math.max(0, dx), Math.max(0, dy));
  return clamp(1 - d / 400, 0, 1);
}

/* --------------------------------- input --------------------------------- */
const keys = Object.create(null);
const mouse = { x: W / 2, y: H / 2, down: false, wx: 0, wy: 0 };
let autoFire = false;

addEventListener('keydown', e => {
  if (state === 'name') { nameKey(e); return; }
  const k = e.key.toLowerCase();
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  if (keys[k]) return;
  keys[k] = true;
  Audio_.init(); Audio_.resume();
  handleKey(k);
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  mouse.down = false;
  if (state === 'play') { state = 'pause'; }
});

cv.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cv.addEventListener('mousedown', e => {
  Audio_.init(); Audio_.resume();
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.down = true;
  handleClick();
});
addEventListener('mouseup', () => { mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ----- touch: dual virtual sticks ----- */
const touchUI = { active: false, move: null, aim: null };
const isTouch = matchMedia('(pointer:coarse)').matches;
function tpos(t) { return { x: t.clientX, y: t.clientY }; }
cv.addEventListener('touchstart', e => {
  e.preventDefault(); Audio_.init(); Audio_.resume();
  touchUI.active = true;
  for (const t of e.changedTouches) {
    const p = tpos(t);
    if (state !== 'play') { mouse.x = p.x; mouse.y = p.y; handleClick(); continue; }
    if (p.x < W * 0.5 && !touchUI.move) touchUI.move = { id: t.identifier, ox: p.x, oy: p.y, x: p.x, y: p.y };
    else if (!touchUI.aim) touchUI.aim = { id: t.identifier, ox: p.x, oy: p.y, x: p.x, y: p.y };
  }
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const p = tpos(t);
    if (touchUI.move && t.identifier === touchUI.move.id) { touchUI.move.x = p.x; touchUI.move.y = p.y; }
    if (touchUI.aim && t.identifier === touchUI.aim.id) { touchUI.aim.x = p.x; touchUI.aim.y = p.y; }
  }
}, { passive: false });
function touchEnd(e) {
  for (const t of e.changedTouches) {
    if (touchUI.move && t.identifier === touchUI.move.id) touchUI.move = null;
    if (touchUI.aim && t.identifier === touchUI.aim.id) touchUI.aim = null;
  }
}
cv.addEventListener('touchend', touchEnd, { passive: false });
cv.addEventListener('touchcancel', touchEnd, { passive: false });

}

function offerUpgrades() {
  const avail = UPGRADES.filter(u => (P.up[u.id] || 0) < u.max);
  const out = [];
  const pool = avail.slice();
  for (let k = 0; k < 3 && pool.length; k++) {
    let total = 0;
    for (const u of pool) total += RAR_W[u.rar];
    let r = Math.random() * total, chosen = pool[0];
    for (const u of pool) { r -= RAR_W[u.rar]; if (r <= 0) { chosen = u; break; } }
    out.push(chosen);
    pool.splice(pool.indexOf(chosen), 1);
  }
  return out;
}
function applyUpgrade(u) {
  P.up[u.id] = (P.up[u.id] || 0) + 1;
  u.f(P);
  Audio_.levelup();
  ringFx(P.x, P.y, 10, 150, RARITY[u.rar], 0.6, 4);
  burst(P.x, P.y, 34, RARITY[u.rar], 260, 3.4, 0.8);
}

let eid = 0;
function spawnEnemy(type, x, y, opts = {}) {
  const t = ETYPE[type];
  const w = wave;
  const bKey = type === 'boss' ? (opts.boss || stage.boss) : null;
  const bd = bKey ? BOSSES[bKey] : null;
  const hpScale = (type === 'boss' ? bossHpCurve(w) * bd.hpMul : hpCurve(w)) * curseHpMul;
  const canElite = type !== 'boss' && type !== 'egg';
  const eliteChance = Math.min(0.22, 0.02 + w * 0.011) * (1 + P.luck * 0.45);
  const elite = opts.elite ?? (canElite && w > 3 && Math.random() < eliteChance);
  const e = {
    id: ++eid, type, x, y, vx: 0, vy: 0, boss: bKey,
    r: (bd ? bd.r : t.r) * (opts.rs || 1) * (elite ? 1.28 : 1),
    maxHp: t.hp * hpScale * (opts.hs || 1) * (elite ? 2.6 : 1),
    spd: (bd ? bd.spd : t.spd) * (elite ? 0.92 : 1) * (opts.ss || 1),
    dmg: t.dmg * (1 + (w - 1) * 0.05) * (elite ? 1.4 : 1),
    col: bd ? bd.col : t.col, sides: bd ? bd.sides : t.sides,
    xp: t.xp * (elite ? 3 : 1), score: t.score * (elite ? 3 : 1),
    elite, flash: 0, slow: 0, slowT: 0, ang: rnd(TAU), spin: rnd(0.6, -0.6),
    t: 0, cd: rnd(1.2, 0.4), state: 0, gen: opts.gen || 0,
    phase: 0, atk: 0, atkT: 0, hitCd: 0, wob: rnd(TAU),
    // expansion state: phasing, armour plates, healing beams, blink timers
    phased: false, phaseT: rnd(2, 0.5), plateAng: 0, healT: 0, ramCd: 0, psn: 0, psnT: 0,
    blinkT: rnd(1.6, 0.7), invuln: 0, tether: null
  };
  e.hp = e.maxHp;
  // Set at spawn, not lazily in the AI: the floor has to exist before the
  // first point of damage can land, whatever order things tick in.
  if (bKey === 'theother') e.floor = 10;
  enemies.push(e);
  return e;
}

function spawnRing(type, opts) {
  // spawn just outside the visible area, clamped into the arena
  const view = Math.max(W, H) * 0.62 + 90;
  for (let tries = 0; tries < 24; tries++) {
    const a = rnd(TAU);
    let x = cam.x + Math.cos(a) * view;
    let y = cam.y + Math.sin(a) * view;
    x = clamp(x, 40, WORLD.w - 40); y = clamp(y, 40, WORLD.h - 40);
    if (len(x - P.x, y - P.y) > 260) {
      const e = spawnEnemy(type, x, y, opts);
      ringFx(x, y, 4, 46, e.col, 0.4, 2);
      return e;
    }
  }
  return spawnEnemy(type, clamp(P.x + rnd(700, -700), 40, WORLD.w - 40), clamp(P.y + rnd(700, -700), 40, WORLD.h - 40), opts);
}

/* -------------------------------- combat --------------------------------- */
/* Stance-dependent damage, resolved at the moment of firing. */
function stanceMul() {
  let m = 1;
  if (P.berserk)  m *= 1 + P.berserk * 0.25 * (1 - clamp(P.hp / P.maxHp, 0, 1));
  const spd = len(P.vx, P.vy);
  if (P.momentum) m *= 1 + P.momentum * 0.16 * clamp(spd / Math.max(1, P.speed), 0, 1);
  if (P.steady && spd < 34) m *= 1 + P.steady * 0.20;
  if (P.bloodlust) m *= 1;               // bloodlust modifies fire rate, not damage
  return m;
}

function fireBullet(x, y, ang, dmgMul = 1, opts = {}) {
  const isCrit = Math.random() < P.crit;
  bullets.push({
    x, y,
    vx: Math.cos(ang) * P.bspeed * (opts.sm || 1),
    vy: Math.sin(ang) * P.bspeed * (opts.sm || 1),
    r: P.br * (opts.rm || 1) * (isCrit ? 1.28 : 1),
    dmg: P.dmg * dmgMul * stanceMul() * (isCrit ? P.critMult : 1),
    crit: isCrit, pierce: P.pierce + (opts.pierce || 0), ric: P.ricochet,
    life: P.blife * (opts.lm || 1), hits: null, frag: opts.noFrag ? 0 : P.frag,
    px: x, py: y, dist: 0,
    // zodiac projectile types
    arrow: P.arrow, venom: P.venom, solar: P.sun, deep: P.deepwater,
    wob: rnd(TAU), hit: false, mine: !opts.foreign
  });
}

function damageEnemy(e, dmg, crit, srcX, srcY, opts = {}) {
  if (e.dead) return;
  // Enforce invulnerability here rather than only at bullet collision —
  // drones, chain lightning, static field, blasts and poison all arrive
  // through this function and would otherwise ignore it entirely.
  if (e.invuln) {
    if (Math.random() < 0.25) {
      burst(e.x + rnd(e.r, -e.r), e.y + rnd(e.r, -e.r), 3, '#cbd5e1', 130, 2, 0.22);
    }
    return;
  }
  dmg *= (e.vuln || 1);        // stunned enemies take extra
  e.hp -= dmg;
  // a floor holds a boss alive for a scripted finale instead of dying to it
  if (e.floor !== undefined && e.hp < e.floor) e.hp = e.floor;
  e.flash = Math.min(1, e.flash + 0.65);
  // secondary hits (chain / drones / blasts) only show numbers sometimes,
  // otherwise a dense crowd turns into an unreadable pile of digits
  if (!opts.silent || Math.random() < 0.34)
    floatText(e.x + rnd(e.r * 0.7, -e.r * 0.7), e.y - e.r * 0.5 + rnd(10, -10), Math.round(dmg),
      crit ? COL.crit : '#e2e8f0', crit ? 19 : 13, crit ? -70 : -46);
  if (crit) { Audio_.crit(); shake(0.05); } else if (!opts.silent) Audio_.hit();
  const a = Math.atan2(e.y - srcY, e.x - srcX);
  burst(e.x - Math.cos(a) * e.r * 0.6, e.y - Math.sin(a) * e.r * 0.6,
        crit ? 8 : 4, e.col, 190, 2.6, 0.32, 1.5, a);
  // LIBRA: the scales record every wound you inflict and collect later
  if (P.scales) P.scalesDebt += dmg * 0.055 * P.scales;
  if (P.cryo && !opts.noStatus) { e.slow = Math.min(0.62, 0.22 * P.cryo); e.slowT = 1.4; }
  if (P.chain && !opts.noChain) chainFrom(e, dmg * (0.34 + 0.1 * P.chain), P.chain);
  // Executioner's Mark: anything left hanging on a sliver just dies
  if (P.execute && e.hp > 0 && e.type !== 'boss' && e.hp / e.maxHp < 0.12) {
    floatText(e.x, e.y - e.r - 8, 'EXECUTE', '#fbbf24', 15);
    e.hp = 0;
  }
  if (e.hp <= 0) {
    const excess = Math.min(-e.hp, e.maxHp * 0.6);
    killEnemy(e, a);
    if (P.overkill && excess > 1)
      explode(e.x, e.y, 66 + 28 * P.overkill, excess * 0.45 * P.overkill, '#fcd34d');
  }
}

function chainFrom(src, dmg, jumps) {
  let cur = src, hit = new Set([src.id]);
  for (let j = 0; j < jumps; j++) {
    let best = null, bd = 240 * 240;
    for (const e of enemies) {
      if (e.dead || hit.has(e.id)) continue;
      const d = (e.x - cur.x) ** 2 + (e.y - cur.y) ** 2;
      if (d < bd) { bd = d; best = e; }
    }
    if (!best) break;
    arcs.push({ x1: cur.x, y1: cur.y, x2: best.x, y2: best.y, life: 0.16, max: 0.16, col: '#7dd3fc' });
    hit.add(best.id);
    damageEnemy(best, dmg, false, cur.x, cur.y, { silent: true, noChain: true, noStatus: true });
    cur = best; dmg *= 0.72;
    if (cur.dead) break;
  }
}

function explode(x, y, radius, dmg, color = '#f97316', hurtsPlayer = false) {
  ringFx(x, y, radius * 0.18, radius, color, 0.34, 5);
  burst(x, y, 24, color, 320, 4, 0.55);
  // only blooms you can actually see are allowed to flash or shake the camera
  const vis = onScreen(x, y, radius);
  if (vis > 0) {
    drawFlashT = Math.max(drawFlashT, 0.05 * vis);
    shake(0.22 * vis);
  }
  Audio_.boom();
  for (const e of enemies) {
    if (e.dead) continue;
    const d = len(e.x - x, e.y - y);
    if (d < radius + e.r) {
      const f = 1 - clamp((d - e.r) / radius, 0, 1);
      damageEnemy(e, dmg * (0.45 + f * 0.55), false, x, y, { silent: true });
    }
  }
  if (hurtsPlayer) {
    const d = len(P.x - x, P.y - y);
    if (d < radius + P.r) hurtPlayer(dmg * 0.6);
  }
}

/* A blast the player caused. Only these leave Napalm, and the fire they drop
   burns enemies rather than its owner. */
function playerBlast(x, y, radius, dmg, color) {
  explode(x, y, radius, dmg, color, false);
  if (P.napalm)
    addHazard('fire', x, y, 3.5 + P.napalm, {
      r: radius * 0.72, dmg: 7 + 5 * P.napalm, friendly: true, col: '#fb923c'
    });
}

function killEnemy(e, ang = 0) {
  if (e.dead) return;
  e.dead = true;
  P.kills++;
  for (const b of enemies) {
    if (b.boss === 'curator' && !b.dead && b.ledger && e.type !== 'boss'
        && b.ledger.length < 8 && b.ledger.indexOf(e.type) < 0) b.ledger.push(e.type);
  }
  score += Math.round(e.score * (1 + wave * 0.05));
  burst(e.x, e.y, e.type === 'boss' ? 90 : (12 + e.r), e.col, e.type === 'boss' ? 520 : 260, e.r * 0.22 + 2, 0.7);
  ringFx(e.x, e.y, e.r * 0.4, e.r * 3.2, e.col, 0.4, 3);
  corpses.push({ x: e.x, y: e.y, r: e.r, sides: e.sides, ang: e.ang, col: e.col, life: 0.42, max: 0.42 });
  Audio_.kill();
  shake(e.type === 'boss' ? 1 : 0.05 + e.r * 0.003);

  // xp
  const n = clamp(Math.round(e.xp), 1, 14);
  const v = e.xp / n;
  for (let i = 0; i < n; i++) {
    const a = rnd(TAU), s = rnd(150, 40);
    gems.push({ x: e.x, y: e.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      v, r: 4 + Math.min(3, v), life: 26 });
  }
  // hard cap: fold the oldest orphaned gems into the next one rather than
  // letting an uncollected field grow without bound
  while (gems.length > 320) { gems[1].v += gems[0].v; gems.shift(); }
  // drops
  if (e.type === 'boss') {
    for (let i = 0; i < 3; i++) drops.push(mkDrop(e.x + rnd(60, -60), e.y + rnd(60, -60), 'heal'));
  } else if (Math.random() < (e.elite ? 0.35 : 0.035) * (1 + P.luck * 0.35)) {
    drops.push(mkDrop(e.x, e.y, Math.random() < 0.72 ? 'heal' : 'nuke'));
  }
  // credits — the shop currency
  if (e.type !== 'egg') {
    const chance = e.type === 'boss' || e.elite ? 1 : 0.22 + P.luck * 0.06;
    if (Math.random() < chance) {
      const n = e.type === 'boss' ? 10 : e.elite ? 3 : 1;
      const each = Math.max(1, Math.round((2 + wave * 0.5) * P.credMul));
      for (let i = 0; i < n; i++) {
        const a = rnd(TAU), s = rnd(200, 60);
        const c = mkDrop(e.x, e.y, 'credit');
        c.vx = Math.cos(a) * s; c.vy = Math.sin(a) * s; c.v = each;
        drops.push(c);
      }
    }
  }
  if (P.lifesteal && Math.random() < P.lifesteal) {
    P.hp = Math.min(P.maxHp, P.hp + 3);
    floatText(P.x, P.y - 22, '+3', COL.hp, 13);
  }
  if (P.bloodlust) { P.blStacks = Math.min(10, P.blStacks + 1); P.blT = 6; }
  if (P.tempo) P.tempoT = 2.2;
  if (P.vortex) {
    // yank the pack toward the corpse — sets up the next chain of kills
    for (const o of enemies) {
      if (o.dead || o === e || o.type === 'boss') continue;
      const vx2 = e.x - o.x, vy2 = e.y - o.y, d2 = len(vx2, vy2);
      if (d2 < 210 && d2 > 1) {
        const f = (1 - d2 / 210) * 330 * P.vortex;
        o.vx += vx2 / d2 * f; o.vy += vy2 / d2 * f;
      }
    }
  }
  if (P.volatile) playerBlast(e.x, e.y, 62 + 24 * P.volatile, (10 + 9 * P.volatile) * (1 + wave * 0.06), '#fb923c');
  if (e.type === 'splitter' && e.gen < 2) {
    for (let i = 0; i < 2; i++) {
      const c = spawnEnemy('splitter', e.x + rnd(26, -26), e.y + rnd(26, -26),
        { gen: e.gen + 1, rs: 0.62, hs: 0.34, ss: 1.25, elite: false });
      c.vx = rnd(160, -160); c.vy = rnd(160, -160);
    }
  }
  // REVENANT: refuses the first death and stands back up as its own ghost
  if (e.type === 'revenant' && e.gen < 1) {
    const g = spawnEnemy('revenant', e.x, e.y, { gen: 1, hs: 0.5, rs: 0.85, elite: false });
    g.phased = false;
    g.iframeT = 0.5;
    ringFx(e.x, e.y, 6, 90, '#f1f5f9', 0.5, 3);
    burst(e.x, e.y, 20, '#f1f5f9', 240, 3, 0.6);
    floatText(e.x, e.y - 26, 'RETURNS', '#e2e8f0', 13);
    Audio_.tone(320, 0.35, 'sine', 0.09, 120);
  }
  if (e.type === 'bomber') explode(e.x, e.y, 92, e.dmg * 1.4, '#f97316', true);
  if (e.boss === 'theother') {          // release any mirrors it had captured
    for (const h of hazards) h.orbit = false;
    finaleBeams.length = 0;
  }
  if (e.type === 'boss') {
    lastBossDeath = { x: e.x, y: e.y };
    bossAlive = false; onBossDefeat();
  }
}

function mkDrop(x, y, kind) {
  return {
    x, y, vx: 0, vy: 0, kind, v: 0, t: rnd(TAU),
    r: kind === 'credit' ? 7 : 11,
    life: kind === 'credit' ? 30 : 22,
    col: kind === 'heal' ? COL.hp : kind === 'credit' ? '#fbbf24' : '#f0abfc'
  };
}

/* opts.pure — unavoidable self-inflicted damage (Virgo, Libra). It ignores
   i-frames, shields and armour, and never grants mercy invulnerability,
   but still routes through Second Wind so revives behave consistently. */
function hurtPlayer(dmg, opts) {
  if (state !== 'play') return;
  if (opts && opts.pure) {
    P.hp -= Math.max(0.5, dmg);
    P.hurtFlash = Math.max(P.hurtFlash, 0.5);
    if (P.hp <= 0) reviveOrDie();
    return;
  }
  if (P.iframe > 0) return;
  // CANCER: outside your shell, movement is what gets you hurt
  if (P.molt && len(P.vx, P.vy) > 60) dmg *= 2.2;
  if (P.shield > 0) {
    P.shield--; P.shieldT = 0; P.iframe = 0.7;
    ringFx(P.x, P.y, P.r, 74, COL.shield, 0.4, 4);
    burst(P.x, P.y, 20, COL.shield, 240, 3, 0.5);
    Audio_.tone(520, 0.2, 'sine', 0.2, 900); shake(0.2);
    floatText(P.x, P.y - 30, 'BLOCKED', COL.shield, 14);
    return;
  }
  const d = Math.max(1, dmg * P.frailty - P.armor);
  P.hp -= d;
  P.iframe = 0.62; P.hurtFlash = 1;
  drawFlashT = 0.09; shake(0.42); Audio_.hurt();
  burst(P.x, P.y, 16, '#ef4444', 220, 3, 0.5);
  floatText(P.x, P.y - 26, '-' + Math.round(d), '#fca5a5', 16);
  if (P.hp <= 0) reviveOrDie();
}

function reviveOrDie() {
    if (P.revive > 0) {
      // Second Wind: clear the immediate threat too, or the revive is wasted
      P.revive--;
      P.hp = P.maxHp * 0.5;
      P.iframe = 2.2; P.hurtFlash = 0;
      banner('SECOND WIND', COL.hp);
      ringFx(P.x, P.y, 10, 340, COL.hp, 0.9, 6);
      burst(P.x, P.y, 64, COL.hp, 430, 4, 1.0);
      drawFlashT = 0.18; shake(0.9);
      Audio_.heal(); Audio_.levelup();
      ebullets.length = 0;
      for (const e of enemies) {
        if (!e.dead && e.type !== 'boss' && len(e.x - P.x, e.y - P.y) < 320)
          damageEnemy(e, 9999 + wave * 40, false, P.x, P.y, { silent: true });
      }
      return;
    }
    P.hp = 0; gameOver();
}

/* ------------------------------ wave manager -----------------------------
   Five waves per stage, boss on the fifth, shop after the boss, then the
   arena re-skins into the next sector. Past sector five it loops harder.
-------------------------------------------------------------------------- */
let wave = 0, waveTimer = 0, spawnBudget = 0, spawnT = 0, betweenWaves = 0;
let bossAlive = false, score = 0, elapsed = 0, credits = 0, slowmo = 1;
let stageAbs = -1, shopPending = false;

function pickEnemyType() {
  const pool = stage.pool;
  let tot = 0; for (const p of pool) tot += p[1];
  let r = Math.random() * tot;
  for (const p of pool) { r -= p[1]; if (r <= 0) return p[0]; }
  return pool[0][0];
}

/* Enter a specific stage definition. Which stage comes next is decided by the
   portal room once the alt path is unlocked, and by the normal rotation
   before that — so this no longer derives anything from the wave number. */
function enterStage(def) {
  stage = def;
  COL.bg = stage.bg; COL.grid = stage.grid; COL.wall = stage.wall;
  P.revive = P.reviveMax || 0;          // Second Wind recharges each sector
  seedStageHazards();
  arenaReset(true);
  mortars.length = 0; portals.length = 0; cages.length = 0;
}

// Kept for the pre-portal path: walk the normal rotation by absolute index.
function applyStage(abs) {
  const prevLoop = loopNum;
  normalIdx = abs;
  stageIdx = abs % STAGES.length;
  loopNum = Math.floor(abs / STAGES.length);
  if (loopNum > prevLoop) noteClear();   // the pre-portal path counts too
  enterStage(STAGES[stageIdx]);
}

/* Credit a full trip through the rotation. This has to be reachable from
   BOTH stage-advance paths: portals only exist after the alt path is
   unlocked, so counting clears only there made the unlock impossible to
   ever earn — you needed portals to get clears and clears to get portals. */
function noteClear() {
  const p = Save.profile;
  p.clears = (p.clears || 0) + 1;
  if (p.clears >= 2 && !p.altPath) {
    p.altPath = true;
    banner('THE FRACTURE OPENS', '#e2e8f0', 3.6);
    drawFlashT = 0.2; shake(0.6);
  }
  Save.writeLocal(); Save.flush();
}

function advanceNormal() {
  normalIdx++;
  stageIdx = normalIdx % STAGES.length;
  const newLoop = Math.floor(normalIdx / STAGES.length);
  if (newLoop > loopNum) { loopNum = newLoop; noteClear(); }
  enterStage(STAGES[stageIdx]);
}

function advanceAlt() {
  altIdx = (altIdx + 1) % ALT_STAGES.length;
  enterStage(ALT_STAGES[altIdx]);
}

function startWave() {
  wave++;
  betweenWaves = 0;
  const abs = Math.floor((wave - 1) / 5);
  // Before the portals exist, stages advance on the wave clock as they always
  // did. Afterwards the portal room owns transitions and this stays put.
  const fresh = !Save.profile.altPath && abs !== stageAbs;
  if (fresh) { stageAbs = abs; applyStage(abs); }
  else if (abs !== stageAbs) stageAbs = abs;

  if (wave % 5 === 0) {
    bossAlive = true;
    const bd = BOSSES[stage.boss];
    banner(bd.name + '   INBOUND', bd.col);
    Audio_.boss();
    spawnRing('boss');
    spawnBudget = 5 + Math.floor(wave * 0.7);
  } else {
    banner(fresh ? stage.name : 'WAVE ' + wave,
           fresh ? stage.accent : COL.player);
    Audio_.wave();
    spawnBudget = Math.round(7 + wave * 3.1 + Math.pow(wave, 1.55) * 0.5);
  }
  spawnT = 0;
  waveTimer = 0;
}

function updateWaves(dt) {
  if (awaitingPortal) return;
  waveTimer += dt;
  if (betweenWaves > 0) {
    betweenWaves -= dt;
    if (betweenWaves <= 0) startWave();
    return;
  }
  // trickle spawns
  spawnT -= dt;
  const cap = 24 + wave * 3;
  if (spawnBudget > 0 && spawnT <= 0 && enemies.length < cap) {
    const batch = Math.min(spawnBudget, 1 + rndi(Math.min(4, 1 + wave / 3)));
    for (let i = 0; i < batch; i++) spawnRing(pickEnemyType());
    spawnBudget -= batch;
    spawnT = Math.max(0.24, 1.5 - wave * 0.05);
  }
  if (spawnBudget <= 0 && enemies.length === 0 && !bossAlive) {
    const bonus = 50 * wave;
    const cr = Math.round((12 + wave * 2.4) * P.credMul);
    score += bonus; credits += cr;
    if (P.climb) {
      P.dmg *= 1 + 0.20 * P.climb;
      floatText(P.x, P.y - 44, 'THE CLIMB  +' + Math.round(20 * P.climb) + '%', '#fbbf24', 15);
    }
    // THE FRACTURE runs hot enough to be worth a hazard bonus: every wave
    // cleared in an alt sector pays half a level on top of the usual bounty.
    // Boss waves count too, so this sits ahead of the reward hand-off.
    if (P.book && P.bookCharge < P.book.cost) {
      P.bookCharge++;
      floatText(P.x, P.y - 66, P.bookCharge + ' / ' + P.book.cost,
                P.bookCharge >= P.book.cost ? P.book.col : '#64748b', 13);
    }
    let halfLevel = false;
    if (stage.alt) {
      P.xp += P.xpNext * 0.5;
      halfLevel = true;
      floatText(P.x, P.y - 52, '+½ LEVEL', '#e2e8f0', 16);
      Audio_.tone(660, 0.18, 'sine', 0.08, 990);
    }
    if (shopPending) { openReward(); return; }
    banner('WAVE CLEAR   +' + bonus + '   ◈' + cr + (halfLevel ? '   +½ LVL' : ''),
           halfLevel ? '#e2e8f0' : COL.hp);
    betweenWaves = 2.4;
  }
}

function onBossDefeat() {
  const bd = BOSSES[stage.boss];
  banner(bd.name + '   DESTROYED', COL.crit);
  drawFlashT = 0.2;
  shopPending = true;
  maybeSpawnLibrary(stage.boss);
  const cr = Math.round((70 + wave * 6) * P.credMul);
  credits += cr;
  score += 500 * (stageAbs + 1);
  for (let i = 0; i < 5; i++)
    setTimeout(() => { if (state === 'play') shake(0.5); }, i * 90);
}

/* ---------------------------------- shop ----------------------------------
   Opens once per sector, right after its boss. Four rolled upgrades plus two
   services; credits come from kills, wave clears and boss bounties.
-------------------------------------------------------------------------- */
let shopItems = [], shopRerolls = 0, shopMsg = '', shopMsgT = 0;
const PRICE = { common: 32, rare: 58, epic: 95, legend: 150 };

function shopServices() {
  return [
    { kind: 'svc', name: 'Repair Bay',     desc: 'Restore 60% of max HP',      rar: 'common', cost: 45,
      ok: () => P.hp < P.maxHp * 0.95,
      run: () => { const a = Math.round(P.maxHp * 0.6); P.hp = Math.min(P.maxHp, P.hp + a);
                   floatText(P.x, P.y - 30, '+' + a + ' HP', COL.hp, 17); Audio_.heal(); } },
    { kind: 'svc', name: 'Hull Plating',   desc: '+30 max HP, fully repaired', rar: 'rare',   cost: 88,
      ok: () => true,
      run: () => { P.maxHp += 30; P.hp = P.maxHp; Audio_.heal(); } },
    { kind: 'svc', name: 'Phase Cell',     desc: '+1 dash charge',             rar: 'epic',   cost: 132,
      ok: () => P.dashMax < 4,
      run: () => { P.dashMax++; P.dashCh = P.dashMax; } },
    { kind: 'svc', name: 'Barrier Node',   desc: '+1 regenerating shield',     rar: 'epic',   cost: 120,
      ok: () => P.shieldMax < 4,
      run: () => { P.shieldMax++; P.shield++; } },
    { kind: 'svc', name: 'Data Injection', desc: 'Gain a level immediately',   rar: 'legend', cost: 145,
      ok: () => true,
      run: () => { P.xp += P.xpNext; } },
    { kind: 'svc', name: 'Coolant Flush',  desc: '+12% fire rate permanently', rar: 'rare',   cost: 76,
      ok: () => true,
      run: () => { P.fireRate *= 1.12; } }
  ].filter(s => s.ok());
}

function makeShopStock() {
  const items = [];
  const pool = UPGRADES.filter(u => (P.up[u.id] || 0) < u.max);
  for (let i = 0; i < 4 && pool.length; i++) {
    let tot = 0; for (const u of pool) tot += RAR_W[u.rar];
    let r = Math.random() * tot, ch = pool[0];
    for (const u of pool) { r -= RAR_W[u.rar]; if (r <= 0) { ch = u; break; } }
    pool.splice(pool.indexOf(ch), 1);
    items.push({ kind: 'up', up: ch, name: ch.n, desc: ch.d, rar: ch.rar,
      cost: Math.round(PRICE[ch.rar] * (1 + stageAbs * 0.15)) });
  }
  const svc = shopServices();
  for (let i = 0; i < 2 && svc.length; i++) {
    const s = svc.splice(rndi(svc.length), 1)[0];
    s.cost = Math.round(s.cost * (1 + stageAbs * 0.12));
    items.push(s);
  }
  for (let i = items.length - 1; i > 0; i--) {
    const j = rndi(i + 1); const t = items[i]; items[i] = items[j]; items[j] = t;
  }
  return items;
}

function openShop() {
  shopPending = false;
  shopItems = makeShopStock();
  shopRerolls = 0;
  shopMsg = ''; shopMsgT = 0;
  shopTouched = false;                   // tracks the planetarium unlock
  state = 'shop';
  uiArm = 0.4;
  Audio_.levelup();
}

function closeShop() {
  noteShopExit();
  state = 'play';
  afterReward();
  Audio_.select();
  checkLevel();                          // Data Injection may owe a level-up
}

function buyShop(i) {
  const it = shopItems[i];
  if (!it || it.sold) return;
  if (credits < it.cost) {
    shopMsg = 'NOT ENOUGH CREDITS'; shopMsgT = 1.3;
    Audio_.tone(150, 0.18, 'square', 0.1, 80);
    return;
  }
  credits -= it.cost;
  it.sold = true;
  shopTouched = true;
  if (it.kind === 'up') applyUpgrade(it.up);
  else { it.run(); Audio_.select(); }
  shopMsg = it.name.toUpperCase() + '  ACQUIRED';
  shopMsgT = 1.5;
}

function rerollShop() {
  const cost = 30 + shopRerolls * 25;
  if (credits < cost) {
    shopMsg = 'NOT ENOUGH CREDITS'; shopMsgT = 1.3;
    Audio_.tone(150, 0.18, 'square', 0.1, 80);
    return;
  }
  credits -= cost;
  shopRerolls++;
  shopTouched = true;
  shopItems = makeShopStock();
  Audio_.select();
}

/* ------------------------------ portal room -------------------------------
   Once THE FRACTURE is open, stages no longer advance on a timer. Two gates
   are placed on opposite sides of you and you walk into the one you want.
--------------------------------------------------------------------------- */
let awaitingPortal = false;

function afterReward() {
  if (Save.profile.altPath) openPortalRoom();
  else betweenWaves = 2.0;
}

function openPortalRoom() {
  awaitingPortal = true;
  portals.length = 0;
  enemies.length = 0; ebullets.length = 0;
  const nDef = STAGES[(normalIdx + 1) % STAGES.length];
  const aDef = ALT_STAGES[(altIdx + 1) % ALT_STAGES.length];
  // Gates open around the spot the boss died on. The origin is pulled inside
  // the safe box *before* placement — clamping the gates themselves would let
  // a death near the edge squash both of them into the same corner.
  const R = Math.min(230, Math.min(arena.x1 - arena.x0, arena.y1 - arena.y0) * 0.28);
  const pad = R + 90;
  const ox = clamp(lastBossDeath ? lastBossDeath.x : P.x, arena.x0 + pad, arena.x1 - pad);
  const oy = clamp(lastBossDeath ? lastBossDeath.y : P.y, arena.y0 + pad, arena.y1 - pad);
  lastBossDeath = null;
  const a = rnd(TAU);
  const place = (ang, kind, def) => portals.push({
    kind, def, t: 0, arm: 0.9, r: 44,
    x: ox + Math.cos(ang) * R,
    y: oy + Math.sin(ang) * R
  });
  place(a, 'normal', nDef);
  place(a + Math.PI, 'alt', aDef);

  /* A gate buried in an embedded shard cannot be entered at all: the shard
     holds you r+P.r away while the gate only opens within p.r+P.r, and that
     gap is on the wrong side. Anything overlapping gets moved to the dead
     centre of the room, which is always clear of the walls the shards are in. */
  const cx = (arena.x0 + arena.x1) / 2, cy = (arena.y0 + arena.y1) / 2;
  const buried = p => hazards.some(h =>
    h.kind === 'mirror' && len(p.x - h.x, p.y - h.y) < h.r + p.r + 8);
  for (const p of portals) if (buried(p)) { p.x = cx; p.y = cy; }
  // if both were relocated they would now be stacked — split along the long axis
  if (portals.length === 2) {
    const sep = len(portals[0].x - portals[1].x, portals[0].y - portals[1].y);
    if (sep < portals[0].r * 2 + 60) {
      const wide = (arena.x1 - arena.x0) >= (arena.y1 - arena.y0);
      const off = portals[0].r + 80;
      portals[0].x = cx - (wide ? off : 0); portals[0].y = cy - (wide ? 0 : off);
      portals[1].x = cx + (wide ? off : 0); portals[1].y = cy + (wide ? 0 : off);
    }
  }
  banner('CHOOSE A GATE', '#e2e8f0', 3.0);
  Audio_.tone(180, 1.1, 'sine', 0.12, 520);
}

function updatePortals(dt) {
  for (const p of portals) {
    p.t += dt;
    p.arm -= dt;                         // brief arming delay: no instant entry
    if (Math.random() < 0.7) {
      const a = rnd(TAU), rr = p.r * rnd(1.5, 0.7);
      spawnPart(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr,
        -Math.cos(a) * 90, -Math.sin(a) * 90, rnd(3.4, 1.6),
        p.kind === 'alt' ? p.def.accent : COL.player, rnd(0.6, 0.3), 0.95);
    }
    if (p.arm <= 0 && len(P.x - p.x, P.y - p.y) < p.r + P.r) { takePortal(p); return; }
  }
}

function takePortal(p) {
  const col = p.def.accent;
  ringFx(p.x, p.y, 12, 340, col, 0.85, 6);
  burst(p.x, p.y, 70, col, 400, 4.2, 1.0);
  drawFlashT = 0.2; shake(0.7);
  Audio_.levelup(); Audio_.boom();
  portals.length = 0;
  awaitingPortal = false;
  if (p.kind === 'alt') advanceAlt(); else advanceNormal();
  // step through: recentre in the new arena so you arrive somewhere safe
  P.x = WORLD.w / 2; P.y = WORLD.h / 2; P.vx = P.vy = 0;
  cam.x = P.x; cam.y = P.y;
  enemies.length = 0; ebullets.length = 0; replay.length = 0;
  banner(stage.name, stage.accent, 2.6);
  betweenWaves = 1.8;
}

/* -------------------------------- libraries -------------------------------
   With THE FRACTURE open, felling any boss may tear a library into the room.
   Inside is a single book written from that boss's own technique — an active
   item bound to Q. Books do not fire on a timer: they take on one charge per
   wave cleared, and the stronger the page the more waves it wants.
--------------------------------------------------------------------------- */
let libraryPortal = null, libraryBook = null;
const LIBRARY_CHANCE = 0.4;

const BOOKS = {

    col: '#ef4444', cost: 2,
    d: 'Erupt in a full ring of piercing fire, the way it used to zone you out.',
    f: () => {
      const n = 52;
      for (let k = 0; k < n; k++)
        fireBullet(P.x, P.y, k * TAU / n, 2.4, { pierce: 8, lm: 2.4, rm: 1.6 });
      ringFx(P.x, P.y, 12, 460, '#ef4444', 0.7, 6);
      burst(P.x, P.y, 40, '#fca5a5', 340, 4, 0.7);
      shake(0.55); Audio_.boom();
    }
  },
  forgeheart: {
    id: 'forgeheart', n: 'THE FORGE LEDGER', from: 'FORGEHEART',
    col: '#f97316', cost: 3,
    d: 'Four armour plates orbit you and eat incoming fire. The gaps still let it through.',
    f: () => {
      P.plateT = 9;
      ringFx(P.x, P.y, 10, 120, '#fbbf24', 0.5, 4);
      Audio_.tone(150, 0.5, 'square', 0.14, 80);
    }
  },
  broodmother: {
    id: 'broodmother', n: 'THE BROOD FOLIO', from: 'BROODMOTHER',
    col: '#4ade80', cost: 2,
    d: 'Go under. Untouchable and fast, and you erupt where you surface.',

/* A shard biting into the wall. Records which face it hit and pre-generates
   its fracture pattern once, so the tear is stable instead of shimmering
   with new random lines every frame. */
function embedShard(h, quiet) {
  const m = h.r * 0.55;
  h.x = clamp(h.x, arena.x0 + m, arena.x1 - m);
  h.y = clamp(h.y, arena.y0 + m, arena.y1 - m);
  h.impactAng = Math.atan2(h.vy || 0, h.vx || 1);
  // inward-facing normal of whichever wall it struck
  h.wallNx = h.x <= arena.x0 + m + 1 ? 1 : h.x >= arena.x1 - m - 1 ? -1 : 0;
  h.wallNy = h.y <= arena.y0 + m + 1 ? 1 : h.y >= arena.y1 - m - 1 ? -1 : 0;
  if (!h.wallNx && !h.wallNy) h.wallNy = -1;
  // fracture lines run along the wall face, away from the puncture
  const along = Math.atan2(-h.wallNx, h.wallNy);
  h.cracks = [];
  for (let i = 0; i < 7; i++) {
    const pts = [];
    let x = 0, y = 0;
    let a = along + (i % 2 ? Math.PI : 0) + rnd(0.7, -0.7);
    const n = 3 + rndi(3), total = rnd(105, 45);
    for (let k = 0; k < n; k++) {
      a += rnd(0.55, -0.55);
      const L = total / n * rnd(1.5, 0.5);
      x += Math.cos(a) * L; y += Math.sin(a) * L;
      pts.push([x, y]);
    }
    h.cracks.push(pts);
  }
  h.embT = 0;
  h.flying = false; h.embedded = true; h.vx = 0; h.vy = 0;
  if (!quiet) { shake(0.3); Audio_.hit(); }
  burst(h.x, h.y, 26, '#5eead4', 300, 3.4, 0.6);
  burst(h.x, h.y, 12, '#ffffff', 190, 2.4, 0.4);
  ringFx(h.x, h.y, 6, h.r * 2.4, '#99f6e4', 0.5, 4);
}

/* Gameplay stops while a reward overlay is up, so anything still in the air
   would freeze there and resume — lethal — the instant you closed it. Drive
   any remaining shards into the nearest wall first. */
function settleShards() {
  for (const h of hazards) {
    if (h.kind !== 'mirror' || !h.flying) continue;
    const m = h.r * 0.55;
    const dl = h.x - arena.x0, dr = arena.x1 - h.x;
    const dt_ = h.y - arena.y0, db = arena.y1 - h.y;
    const nearest = Math.min(dl, dr, dt_, db);
    if (nearest === dl) h.x = arena.x0 + m;
    else if (nearest === dr) h.x = arena.x1 - m;
    else if (nearest === dt_) h.y = arena.y0 + m;
    else h.y = arena.y1 - m;
    embedShard(h, true);
  }
}

/* ------------------------------ persistence -------------------------------
   Fireproof (local-first document DB, syncable) layered over localStorage.
   Every call here is best-effort and fire-and-forget: on file://, offline, or
   with the CDN blocked, the game silently keeps running on localStorage and
   nothing above this layer can tell the difference. The game loop never
   awaits any of it.

   API notes verified against @fireproof/core 0.24.19:
     put(doc)              -> { id, clock, name }, honours an explicit _id
     get(id)               -> doc, THROWS if the id is absent
     query(field, opts)    -> { rows: [{ key, id, doc }] }, supports
                              { descending, limit }
--------------------------------------------------------------------------- */
const FIREPROOF_URL = 'https://esm.sh/@fireproof/core@0.24.19';
const SAVE_KEY = 'voidrunner_save_v1';

const Save = {
  db: null,
  status: 'local',        // local | connecting | cloud | error
  profile: null,
  top: [],                // best runs, for the menu leaderboard

  blank: () => ({ name: '', best: 0, bestWave: 0, bestSector: '—', runs: 0, kills: 0,
                  time: 0, muted: false, autofire: false,
                  planetarium: false, skipStreak: 0, clears: 0, altPath: false,
                  // full stats of the best run, so it can be re-submitted later
                  bestRun: null }),

  readLocal() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) return Object.assign(Save.blank(), JSON.parse(raw));
      // migrate the pre-Fireproof single-key best score
      const legacy = parseInt(localStorage.getItem('voidrunner_best') || '0', 10);
      const p = Save.blank();
      if (legacy > 0) p.best = legacy;
      return p;
    } catch (e) { return Save.blank(); }
  },
  writeLocal() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(Save.profile)); } catch (e) {}
  },

  // Same device may have written to either store; keep the better of each.
  merge(a, b) {
    const out = Save.blank();
    for (const k of ['best', 'bestWave', 'runs', 'kills', 'time'])
      out[k] = Math.max(a[k] || 0, b[k] || 0);
    out.bestSector = (b.bestWave || 0) >= (a.bestWave || 0)
      ? (b.bestSector || a.bestSector) : (a.bestSector || b.bestSector);
    out.name = b.name || a.name || '';
    out.muted = b.muted !== undefined ? b.muted : a.muted;
    out.autofire = b.autofire !== undefined ? b.autofire : a.autofire;
    // an unlock is permanent: if either store has it, it stays earned
    out.planetarium = !!(a.planetarium || b.planetarium);
    out.altPath = !!(a.altPath || b.altPath);
    out.clears = Math.max(a.clears || 0, b.clears || 0);
    out.skipStreak = Math.max(a.skipStreak || 0, b.skipStreak || 0);
    const ar = a.bestRun, br = b.bestRun;
    out.bestRun = (br && br.score || 0) >= (ar && ar.score || 0) ? (br || ar) : (ar || br);
    return out;
  },

  /* Clears used to only ever be counted when stepping through a portal — but
     portals require the unlock that clears gate, so the counter could never
     advance and the alt path was unreachable no matter how far you got.
     Recover what a profile actually earned from how deep it has been. */
  reconcileClears() {
    const p = Save.profile;
    const perLoop = STAGES.length * 5;                 // 5 sectors, 5 waves each
    const earned = Math.floor(Math.max(0, (p.bestWave || 0) - 1) / perLoop);
    if (earned > (p.clears || 0)) {
      p.clears = earned;
      if (p.clears >= 2) p.altPath = true;
      Save.writeLocal();
      return true;
    }
    return false;
  },

  init() {
    Save.profile = Save.readLocal();
    Save.reconcileClears();
    Save.writeLocal();
    Audio_.muted = !!Save.profile.muted;
    autoFire = !!Save.profile.autofire;
    Save.connect();
    Board.load();
    // first launch: ask who they are before anything else
    if (!Save.profile.name) { nameBuf = ''; state = 'name'; }
  },

  async connect() {
    // file:// can't load an ESM module from a CDN — stay on localStorage
    if (location.protocol === 'file:') { Save.status = 'local'; return; }
    Save.status = 'connecting';
    try {
      const { fireproof } = await import(FIREPROOF_URL);
      const db = fireproof('voidrunner');
      let remote = null;
      try { remote = await db.get('profile'); } catch (e) { remote = null; }
      Save.db = db;
      Save.status = 'cloud';
      if (remote) { Save.profile = Save.merge(Save.profile, remote); Save.writeLocal(); }
      Save.reconcileClears();   // the merged profile may predate clear tracking
      await Save.flush();
      await Save.refreshTop();
      Board.backfill();
    } catch (e) {
      Save.status = 'error';
      Save.db = null;
    }
  },

  async flush() {
    if (!Save.db) return;
    try {
      let doc;
      try { doc = await Save.db.get('profile'); } catch (e) { doc = { _id: 'profile' }; }
      await Save.db.put(Object.assign(doc, Save.profile, { _id: 'profile' }));
    } catch (e) { /* never let a write failure reach the game */ }
  },

  async refreshTop() {
    if (!Save.db) return;
    try {
      const q = await Save.db.query('score', { descending: true, limit: 5 });
      Save.top = (q.rows || []).map(r => r.doc).filter(d => d && d.type === 'run');
    } catch (e) { /* leaderboard is cosmetic */ }
  },

  recordRun(s) {
    const p = Save.profile;
    p.runs++;
    p.kills += s.kills;
    p.time += s.time;
    if (s.score > ((p.bestRun && p.bestRun.score) || 0)) {
      p.bestRun = { score: s.score, wave: s.wave, sector: s.sector, loop: s.loop || 0,
                    level: s.level, kills: s.kills, time: Math.round(s.time) };
    }
    if (s.score > p.best) p.best = s.score;
    if (s.wave > p.bestWave) { p.bestWave = s.wave; p.bestSector = s.sector; }
    Save.writeLocal();
    if (!Save.db) return;
    (async () => {
      try {
        await Save.db.put({
          type: 'run', score: s.score, wave: s.wave, sector: s.sector, loop: s.loop,
          level: s.level, kills: s.kills, time: Math.round(s.time),
          build: s.build, at: Date.now()
        });
        await Save.flush();
        await Save.refreshTop();
      } catch (e) {}
    })();
  },

  savePrefs() {
    Save.profile.muted = Audio_.muted;
    Save.profile.autofire = autoFire;
    Save.writeLocal();
    Save.flush();
  }
};
Save.profile = Save.blank();

/* ---------------------------- global leaderboard --------------------------
   Backed by a Netlify Function (/api/leaderboard) over Netlify Blobs. There
   are no accounts: a name is a label, not an identity, and the server treats
   every submission as an unverified claim. Entirely optional — on file://,
   offline, or without the function deployed the game just hides the board.
--------------------------------------------------------------------------- */
const Board = {
  url: '/api/leaderboard',
  top: [], status: 'idle', rank: null, note: '',

  async load() {
    if (location.protocol === 'file:') { Board.status = 'offline'; return; }
    if (!Board.top.length) Board.status = 'loading';
    try {
      const r = await fetch(Board.url, { cache: 'no-store' });
      if (!r.ok) throw new Error('http ' + r.status);
      const d = await r.json();
      Board.top = Array.isArray(d.top) ? d.top : [];
      Board.status = 'ok';
      Board.backfill();
    } catch (e) {
      Board.status = 'offline';
    }
  },

  /* Reconcile: if your stored personal best is better than whatever the board
     has under your name, push it. Without this, a best set while the function
     was unreachable — or before you had a name — is stranded locally forever,
     because scores are only ever posted at the moment of death. */
  synced: false,
  async backfill() {
    if (Board.synced || location.protocol === 'file:' || !Save.profile.name) return;
    if (Board.status !== 'ok') return;
    let run = Save.profile.bestRun;
    // profiles from before bestRun existed: recover it from the run history
    if ((!run || !run.score) && Save.db) {
      try {
        const q = await Save.db.query('score', { descending: true, limit: 1 });
        const doc = q.rows && q.rows[0] && q.rows[0].doc;
        if (doc && doc.type === 'run' && doc.score > 0) run = doc;
      } catch (e) {}
    }
    if (!run || !run.score) return;
    const mine = Board.top.find(e => e.name === Save.profile.name);
    if (mine && mine.score >= run.score) { Board.synced = true; return; }
    Board.synced = true;
    Board.submit(run, true);
  },

  submit(s, quiet) {
    if (location.protocol === 'file:' || !Save.profile.name) return;
    if (!quiet) { Board.rank = null; Board.note = ''; }
    (async () => {
      try {
        const r = await fetch(Board.url, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            name: Save.profile.name, score: s.score, wave: s.wave, sector: s.sector,
            loop: s.loop, level: s.level, kills: s.kills, time: Math.round(s.time)
          })
        });
        const d = await r.json().catch(() => null);
        if (r.ok && d && d.ok) {
          Board.top = Array.isArray(d.top) ? d.top : Board.top;
          Board.status = 'ok';
          if (!quiet) Board.rank = d.rank;   // a backfill must not fake a run's rank
        } else if (!quiet) {
          Board.note = (d && d.error) || 'not submitted';
        }
      } catch (e) { Board.status = 'offline'; }
    })();
  }
};

/* ------------------------------- name entry -------------------------------- */
let nameBuf = '';
const NAME_MAX = 14;

function nameKey(e) {
  Audio_.init(); Audio_.resume();
  if (e.key === 'Enter')     { e.preventDefault(); commitName(); return; }
  if (e.key === 'Backspace') { e.preventDefault(); nameBuf = nameBuf.slice(0, -1); return; }
  if (e.key === 'Escape')    {
    e.preventDefault();
    if (Save.profile.name) { nameBuf = ''; state = 'menu'; }
    return;
  }
  if (e.key.length === 1 && nameBuf.length < NAME_MAX && /[A-Za-z0-9 _.\-]/.test(e.key)) {
    e.preventDefault();
    nameBuf += e.key;
    Audio_.tone(880, 0.03, 'square', 0.035, 1300);
  }
}
function commitName() {
  const n = nameBuf.replace(/\s+/g, ' ').trim().slice(0, NAME_MAX);
  if (!n) return;
  Save.profile.name = n;
  Save.writeLocal();
  Save.flush();
  nameBuf = '';
  state = 'menu';
  Audio_.select();
  Board.synced = false;
  Board.load();
}
// touch devices have no physical keyboard — fall back to the native prompt
function promptName() {
  const n = window.prompt('Name for the global leaderboard (max 14):',
                          Save.profile.name || '');
  if (n === null) { if (Save.profile.name) state = 'menu'; return; }
  nameBuf = n;
  commitName();
}

function resetGame() {
  P = newPlayer();
  enemies = []; bullets = []; ebullets = []; gems = []; drops = [];
  parts = []; floats = []; arcs = []; rings = []; corpses = [];
  hazards = []; mortars = []; sentries = []; beams = [];
  portals = []; cages = []; replay = []; finaleBeams = [];
  arenaReset(true); lastBossDeath = null;
  libraryPortal = null; libraryBook = null;
  diaryBeams = []; diaryMirrors = [];
  awaitingPortal = false; normalIdx = 0; altIdx = -1;
  wave = 0; spawnBudget = 0; betweenWaves = 0.9; bossAlive = false;
  score = 0; elapsed = 0; credits = 0; stageAbs = -1; shopPending = false;
  stage = STAGES[0]; stageIdx = 0; loopNum = 0; slowmo = 1; playerChill = 0;
  COL.bg = stage.bg; COL.grid = stage.grid; COL.wall = stage.wall;
  shopItems = []; shopMsg = ''; shopMsgT = 0; shopRerolls = 0; shopTouched = false;
  curseHpMul = 1; planetSign = null; planetRevealed = false;
  cam.x = P.x; cam.y = P.y; cam.trauma = 0;
  hitStop = 0; drawFlashT = 0; bannerT = 0;
  Audio_.intensity = 0;
}
function gameOver() {
  if (state === 'dead') return;          // never record a run twice
  state = 'dead';
  const build = Object.keys(P.up).map(id => {
    const u = UPGRADES.find(z => z.id === id);
    return u ? u.n + (P.up[id] > 1 ? ' ×' + P.up[id] : '') : id;
  });
  lastStats = { score, wave, kills: P.kills, level: P.level, time: elapsed,
                sector: stage.name, loop: loopNum,
                isRecord: score > Save.profile.best };
  Save.recordRun(Object.assign({ build }, lastStats));
  Board.submit(lastStats);
  explode(P.x, P.y, 180, 0, COL.player);
  burst(P.x, P.y, 90, COL.player, 460, 4, 1.1);
  shake(1); Audio_.over();
}

function handleKey(k) {
  if (k === 'm') {
    Audio_.muted = !Audio_.muted;
    if (Audio_.ready) Audio_.master.gain.value = Audio_.muted ? 0 : 0.9;
    Save.savePrefs();
    return;
  }
  if (state === 'menu') {
    if (k === 'n') { nameBuf = Save.profile.name || ''; state = 'name'; return; }
    if (k === ' ' || k === 'enter') { resetGame(); state = 'play'; }
    return;
  }
  if (state === 'dead')  { if (k === ' ' || k === 'enter' || k === 'r') { resetGame(); state = 'play'; } return; }
  if (state === 'levelup') {
    const i = ['1', '2', '3'].indexOf(k);
    if (i >= 0 && offers[i]) chooseOffer(i);
    return;
  }
  if (state === 'shop') {
    const i = ['1', '2', '3', '4', '5', '6'].indexOf(k);
    if (i >= 0) buyShop(i);
    else if (k === 'r') rerollShop();
    else if (k === 'enter' || k === ' ' || k === 'escape') closeShop();
    return;
  }
  if (state === 'planet') {
    if (uiArm > 0) return;
    if (!planetRevealed && (k === 'a' || k === 'y')) acceptSign();
    else if (k === 'enter' || k === ' ' || k === 'escape' || k === 'd' || k === 'n')
      leavePlanetarium();
    return;
  }
  if (state === 'library') {
    if (uiArm > 0) return;
    if (k === 'e' || k === 'enter' || k === ' ') takeBook();
    else if (k === 'escape' || k === 'q') leaveLibrary();
    return;
  }
  if (k === 'q') { useBook(); return; }
  if (k === 'p' || k === 'escape') state = state === 'pause' ? 'play' : 'pause';
  if (k === 't') { autoFire = !autoFire; Save.savePrefs(); }
}
function inRect(mx, my, r) { return mx > r.x && mx < r.x + r.w && my > r.y && my < r.y + r.h; }

function handleClick() {
  if (state === 'name') { if (isTouch) promptName(); return; }
  if (state === 'menu') { resetGame(); state = 'play'; return; }
  if (state === 'dead') { resetGame(); state = 'play'; return; }
  if (state === 'pause') { state = 'play'; return; }
  if (uiArm > 0) return;                 // overlay just opened — swallow it
  if (state === 'levelup') {
    const i = offerIndexAt(mouse.x, mouse.y);
    if (i >= 0) chooseOffer(i);
    return;
  }
  if (state === 'shop') {
    const b = shopButtons();
    if (inRect(mouse.x, mouse.y, b.reroll)) { rerollShop(); return; }
    if (inRect(mouse.x, mouse.y, b.leave))  { closeShop(); return; }
    const i = shopIndexAt(mouse.x, mouse.y);
    if (i >= 0) buyShop(i);
    return;
  }
  if (state === 'library') {
    const b = libraryButtons();
    if (inRect(mouse.x, mouse.y, b.take)) { takeBook(); return; }
    if (inRect(mouse.x, mouse.y, b.leave)) leaveLibrary();
    return;
  }
  if (state === 'planet') {
    const b = planetButtons();
    if (!planetRevealed && inRect(mouse.x, mouse.y, b.accept)) { acceptSign(); return; }
    if (inRect(mouse.x, mouse.y, b.leave)) leavePlanetarium();
  }
}
function chooseOffer(i) {
  applyUpgrade(offers[i]);
  offers = [];
  state = 'play';
  Audio_.select();
  if (P.xp >= P.xpNext) checkLevel();
}
function checkLevel() {
  // Never open over a shop, planetarium or gate. updatePickups() runs after
  // updateWaves() in the same tick, so a wave-clear XP payout could otherwise
  // replace the reward room that just opened. Every overlay calls back into
  // this after restoring 'play', so nothing is lost — only deferred.
  if (state !== 'play') return;
  if (P.xp >= P.xpNext) {
    P.xp -= P.xpNext;
    P.level++;
    P.xpNext = Math.round(8 + P.level * 5 + Math.pow(P.level, 1.65) * 1.6);
    offers = offerUpgrades();
    if (offers.length) { state = 'levelup'; uiArm = 0.4; Audio_.levelup(); }
  }
}

/* ------------------------------- game loop -------------------------------- */
let last = performance.now(), acc = 0;
const STEP = 1 / 60;

let frameErrors = 0;
function frame(now) {
  const dt = Math.min(0.2, (now - last) / 1000);
  last = now;
  acc += dt;
  let guard = 0;
  try {
    while (acc >= STEP && guard++ < 5) { update(STEP); acc -= STEP; }
    if (acc > STEP) acc = 0;
    render();
  } catch (err) {
    // A thrown frame used to kill the rAF loop outright and freeze the
    // game mid-run. Drop the frame, keep the loop alive; losing a
    // 40-minute run to one exception is never the right trade.
    frameErrors++;
    if (frameErrors <= 5) console.error('VOIDRUNNER frame error:', err);
    acc = 0;
  }
  requestAnimationFrame(frame);
}

function update(dt) {
  // camera shake decay and the cosmetic clock always run, even while dead or
  // paused, so overlay animations never freeze
  uiTime += dt;
  cam.trauma = Math.max(0, cam.trauma - dt * 1.5);
  const tr = cam.trauma * cam.trauma;
  cam.sx = rnd(1, -1) * 26 * tr;
  cam.sy = rnd(1, -1) * 26 * tr;
  drawFlashT = Math.max(0, drawFlashT - dt);

  if (state === 'menu' || state === 'name') { updateMenu(dt); return; }
  if (state === 'pause') return;

  // cosmetic layers keep running during level-up / shop / death for smoothness
  updateParticles(dt);
  if (state === 'levelup' || state === 'shop' || state === 'planet' ||
      state === 'library' || state === 'dead') {
    if (shopMsgT > 0) shopMsgT -= dt;
    if (uiArm > 0) uiArm -= dt;
    updateCamera(dt, state === 'dead');
    return;
  }
  uiArm = 0;

  if (hitStop > 0) { hitStop -= dt; updateCamera(dt); return; }

  elapsed += dt;
  Audio_.update(clamp(enemies.length / 26 + wave / 22, 0, 1));

  // Bullet Time slows the world but never the player
  slowmo = P.stopT > 0 ? 0
         : (P.bullettime && P.hp / P.maxHp < 0.3) ? 0.55 : 1;
  const wdt = dt * slowmo;

  updateWaves(dt);
  updatePlayer(dt);
  updateDrones(dt);
  updateSentries(dt);
  updateArena(dt);
  updatePortals(dt);
  updateLibrary(dt);
  replay.push({ x: P.x, y: P.y, ang: P.ang });
  if (replay.length > 260) replay.shift();
  updateEnemies(wdt);
  updateStageAmbient(dt);
  updateHazards(wdt);
  updateMortars(wdt);
  updateCages(dt);
  updateBullets(dt);
  updateEBullets(wdt);
  updateBeams(dt);
  updatePickups(dt);
  updateCamera(dt);
  bannerT = Math.max(0, bannerT - dt);
}

function updateMenu(dt) {
  // idle ambience: drifting sparks
  if (Math.random() < 0.5) {
    spawnPart(rnd(W), rnd(H), rnd(24, -24), rnd(24, -24), rnd(2.4, 0.8),
      pick([COL.player, '#f472b6', '#c084fc']), rnd(2.4, 1.2), 0.995);
  }
  updateParticles(dt);
}

function updateCamera(dt, loose = false) {
  const k = loose ? 2.2 : 6.2;
  // look slightly ahead of the aim direction
  const ax = Math.cos(P.ang) * 60, ay = Math.sin(P.ang) * 60;
  const tx = clamp(P.x + ax, W / 2 - 120, WORLD.w - W / 2 + 120);
  const ty = clamp(P.y + ay, H / 2 - 120, WORLD.h - H / 2 + 120);
  cam.x = lerp(cam.x, W > WORLD.w ? WORLD.w / 2 : tx, 1 - Math.exp(-k * dt));
  cam.y = lerp(cam.y, H > WORLD.h ? WORLD.h / 2 : ty, 1 - Math.exp(-k * dt));
}

/* ------------------------------ player logic ------------------------------ */
function updatePlayer(dt) {
  let ix = 0, iy = 0;
  if (keys['a'] || keys['arrowleft'])  ix -= 1;
  if (keys['d'] || keys['arrowright']) ix += 1;
  if (keys['w'] || keys['arrowup'])    iy -= 1;
  if (keys['s'] || keys['arrowdown'])  iy += 1;
  if (touchUI.move) {
    const dx = touchUI.move.x - touchUI.move.ox, dy = touchUI.move.y - touchUI.move.oy;
    const d = len(dx, dy);
    if (d > 6) { const m = Math.min(1, d / 62) / d; ix = dx * m; iy = dy * m; }
  }
  const il = len(ix, iy);
  if (il > 1) { ix /= il; iy /= il; }

  // aim
  mouse.wx = mouse.x + cam.x - W / 2 + cam.sx;
  mouse.wy = mouse.y + cam.y - H / 2 + cam.sy;
  let firing = mouse.down || autoFire || keys['j'];
  if (isTouch) {
    if (touchUI.aim) {
      const dx = touchUI.aim.x - touchUI.aim.ox, dy = touchUI.aim.y - touchUI.aim.oy;
      if (len(dx, dy) > 10) { P.ang = Math.atan2(dy, dx); firing = true; }
      else firing = true;
    } else {
      firing = false;
      const t = nearestEnemy(P.x, P.y, 900);
      if (t) { P.ang = angLerp(P.ang, Math.atan2(t.y - P.y, t.x - P.x), 0.2); firing = true; }
    }
  } else {
    P.ang = Math.atan2(mouse.wy - P.y, mouse.wx - P.x);
  }

  // dash
  if (P.dashCh < P.dashMax) {
    P.dashRe += dt;
    if (P.dashRe >= P.dashCd) { P.dashRe = 0; P.dashCh++; }
  }
  const wantDash = (keys[' '] || keys['shift']) && !P.rooted;
  if (wantDash && P.dashCh > 0 && P.dashT <= 0) {
    keys[' '] = false; keys['shift'] = false;
    P.dashCh--;
    P.dashT = 0.17; P.iframe = Math.max(P.iframe, 0.28);
    let dx = ix, dy = iy;
    if (!il) { dx = Math.cos(P.ang); dy = Math.sin(P.ang); }
    P.dashDX = dx; P.dashDY = dy;
    Audio_.dash();
    burst(P.x, P.y, 18, COL.player, 240, 3, 0.4, 1.4, Math.atan2(-dy, -dx));
    if (P.shockwave)
      playerBlast(P.x, P.y, 80 + 34 * P.shockwave, (10 + 10 * P.shockwave) * (1 + wave * 0.08), COL.player);
    if (P.cryonova) {
      const R = 150 + 50 * P.cryonova;
      ringFx(P.x, P.y, 10, R, '#93c5fd', 0.45, 3);
      for (const e of enemies) {
        if (e.dead || len(e.x - P.x, e.y - P.y) > R) continue;
        e.slow = Math.min(0.75, 0.34 * P.cryonova);
        e.slowT = 2.2 + P.cryonova * 0.6;
      }
      Audio_.tone(900, 0.25, 'sine', 0.09, 300);
    }
    if (P.sentryUp && sentries.length < P.sentryUp + 1) {
      sentries.push({ x: P.x, y: P.y, ang: P.ang, cd: 0.3, life: 11, dmg: P.dmg * 0.7 + 4 });
      ringFx(P.x, P.y, 6, 42, COL.player, 0.3, 2);
      Audio_.tone(360, 0.12, 'square', 0.07, 620);
    }
  }

  // movement
  if (P.dashT > 0) {
    P.dashT -= dt;
    const ds = 1080;
    P.vx = P.dashDX * ds; P.vy = P.dashDY * ds;
    if (Math.random() < 0.85)
      spawnPart(P.x, P.y, rnd(50, -50), rnd(50, -50), rnd(6, 3), COL.player, 0.3, 0.9);
  } else {
    // acid chills you, Tempo kicks in after a kill
    const spdMul = (1 - playerChill) * (P.tempoT > 0 ? 1.35 : 1)
                 * (P.burrowT > 0 ? 1.8 : 1);
    const tvx = ix * P.speed * spdMul, tvy = iy * P.speed * spdMul;
    const k = 1 - Math.exp(-16 * dt);
    P.vx = lerp(P.vx, tvx, k);
    P.vy = lerp(P.vy, tvy, k);
  }
  P.x = clamp(P.x + P.vx * dt, arena.x0 + P.r, arena.x1 - P.r);
  P.y = clamp(P.y + P.vy * dt, arena.y0 + P.r, arena.y1 - P.r);
  collideMirrors(P, P.r);
  P.x = clamp(P.x, arena.x0 + P.r, arena.x1 - P.r);
  P.y = clamp(P.y, arena.y0 + P.r, arena.y1 - P.r);

  // engine trail
  if (len(P.vx, P.vy) > 40 && Math.random() < 0.6) {
    const a = Math.atan2(-P.vy, -P.vx);
    spawnPart(P.x + Math.cos(a) * 8, P.y + Math.sin(a) * 8,
      Math.cos(a) * rnd(70, 20) + rnd(20, -20), Math.sin(a) * rnd(70, 20) + rnd(20, -20),
      rnd(3.4, 1.6), '#38bdf8', rnd(0.34, 0.16), 0.9);
  }

  // shooting
  P.fireT -= dt;
  const rateMul = 1 + (P.bloodlust ? 0.07 * P.bloodlust * P.blStacks : 0);
  if (firing && P.fireT <= 0 && P.diaryT <= 0) {
    P.fireT = 1 / (P.fireRate * rateMul);
    const muzzle = P.r + 6;
    const spread = P.spread;
    const mx = P.x + Math.cos(P.ang) * muzzle, my = P.y + Math.sin(P.ang) * muzzle;
    const nx = -Math.sin(P.ang), ny = Math.cos(P.ang);   // barrel offset axis
    P.ocCount++;
    const slug = P.overcharge > 0 && P.ocCount % 7 === 0;

    for (let lane = 0; lane <= P.parallel; lane++) {
      const off = lane === 0 ? 0 : (lane % 2 ? 1 : -1) * Math.ceil(lane / 2) * 17;
      for (let i = 0; i < P.count; i++) {
        const a0 = P.count === 1 ? 0 : (i - (P.count - 1) / 2) * (spread * 1.9);
        const a = P.ang + a0 + rnd(spread, -spread) * 0.5;
        if (slug) fireBullet(mx + nx * off, my + ny * off, a,
                             1.6 + 0.7 * P.overcharge, { rm: 2.1, sm: 0.86, pierce: 2 });
        else      fireBullet(mx + nx * off, my + ny * off, a);
      }
    }
    if (P.back) {
      for (let i = 0; i < P.back; i++) {
        const a = P.ang + Math.PI + (i - (P.back - 1) / 2) * 0.2;
        fireBullet(P.x - Math.cos(P.ang) * muzzle, P.y - Math.sin(P.ang) * muzzle, a, 0.8);
      }
    }
    if (twinActive()) twinFire();
    if (slug) { Audio_.tone(190, 0.16, 'square', 0.13, 70); shake(0.09); }
    else Audio_.shoot();
    P.vx -= Math.cos(P.ang) * 26; P.vy -= Math.sin(P.ang) * 26;
    burst(mx, my, slug ? 8 : 3, slug ? COL.crit : COL.bullet, 170, 2.4, 0.18, 0.9, P.ang);
    shake(0.012 * Math.min(3, P.count));
  }

  // static field: a constant low-damage aura, ticked on its own clock
  if (P.staticF) {
    P.staticT -= dt;
    if (P.staticT <= 0) {
      P.staticT = 0.35;
      const R = 92 + 26 * P.staticF;
      let touched = false;
      for (const e of enemies) {
        if (e.dead || e.phased || e.invuln) continue;
        if (len(e.x - P.x, e.y - P.y) < R + e.r) {
          damageEnemy(e, (4 + P.dmg * 0.28) * P.staticF, false, P.x, P.y, { silent: true, noChain: true });
          touched = true;
        }
      }
      if (touched) {
        ringFx(P.x, P.y, R * 0.55, R, '#7dd3fc', 0.22, 2);
        Audio_.tone(180, 0.06, 'sine', 0.035, 90);
      }
    }
  }

  // regen / shield / timers
  if (P.regen) P.hp = Math.min(P.maxHp, P.hp + P.regen * dt);
  if (P.shieldMax) {
    if (P.shield < P.shieldMax) {
      P.shieldT += dt;
      if (P.shieldT > 9) { P.shieldT = 0; P.shield++;
        ringFx(P.x, P.y, 10, 60, COL.shield, 0.4, 2);
        Audio_.tone(700, 0.14, 'sine', 0.09, 1200); }
    }
  }
  /* ---------------------- zodiac mechanics ---------------------- */

  // LEO: you are a small sun. Everything close enough simply burns.
  if (P.sun) {
    P.sunT -= dt;
    if (P.sunT <= 0) {
      P.sunT = 0.25;
      const R = 130 + 40 * P.sun;
      for (const e of enemies) {
        if (e.dead || e.phased || e.invuln) continue;
        const d2 = len(e.x - P.x, e.y - P.y);
        if (d2 < R + e.r) {
          const falloff = 1 - clamp(d2 / R, 0, 1) * 0.5;
          damageEnemy(e, (6 + P.dmg * 0.45) * P.sun * falloff, false, P.x, P.y,
                      { silent: true, noChain: true });
        }
      }
    }
    if (Math.random() < 0.5) {
      const a = rnd(TAU), R = 130 + 40 * P.sun;
      spawnPart(P.x + Math.cos(a) * R * 0.9, P.y + Math.sin(a) * R * 0.9,
        Math.cos(a) * 40, Math.sin(a) * 40, rnd(4, 2), '#fbbf24', rnd(0.5, 0.25), 0.94);
    }
  }

  // AQUARIUS: you leave charged water in your wake
  if (P.current) {
    P.currentT -= dt;
    if (P.currentT <= 0 && len(P.vx, P.vy) > 50) {
      P.currentT = 0.13;
      addHazard('current', P.x, P.y, 2.6 + P.current * 0.6, {
        r: 42 + P.current * 8, dmg: 3 + P.dmg * 0.22, friendly: true, col: '#67e8f9' });
    }
  }

  // ARIES: the dash is a goring charge
  if (P.ram && P.dashT > 0) {
    for (const e of enemies) {
      if (e.dead || e.phased || e.invuln || e.ramCd > 0) continue;
      if (len(e.x - P.x, e.y - P.y) < e.r + P.r + 16) {
        e.ramCd = 0.4;
        damageEnemy(e, (25 + P.dmg * 3.2) * P.ram, true, P.x, P.y);
        const a = Math.atan2(e.y - P.y, e.x - P.x);
        e.vx += Math.cos(a) * 700; e.vy += Math.sin(a) * 700;
        burst(e.x, e.y, 12, '#fb7185', 300, 3.4, 0.4);
        shake(0.25);
      }
    }
  }

  // LIBRA: the scales collect on their own schedule
  if (P.scales && P.scalesDebt > 0) {
    P.scalesT -= dt;
    if (P.scalesT <= 0) {
      P.scalesT = 0.5;
      const owed = Math.min(P.scalesDebt, P.maxHp * 0.08);
      P.scalesDebt -= owed;
      if (owed > 0.5) {
        hurtPlayer(owed, { pure: true });
        floatText(P.x, P.y - 34, '-' + Math.round(owed), '#f0abfc', 12);
      }
    }
  }

  P.iframe = Math.max(0, P.iframe - dt);
  P.hurtFlash = Math.max(0, P.hurtFlash - dt * 2.6);
  // --- library book effects ---
  if (P.diaryT > 0) {
    P.diaryT -= dt;
    P.diaryAng += dt * MIRROR_SPIN;      // counter-rotating, as the boss does
    diaryBeams.length = 0;
    if (firing) {
      castPrism(P.x, P.y, P.ang, 0, 0, diaryMirrorList(), diaryBeams, 26);
      P.diaryTick -= dt;
      if (P.diaryTick <= 0) {
        P.diaryTick = 0.09;
        // snapshot: a kill here can push splitters into the live array
        const list = enemies.slice();
        const struck = new Set();
        for (const bm of diaryBeams) {
          for (const e of list) {
            if (e.dead || e.phased || e.invuln || struck.has(e.id)) continue;
            if (segCircle(bm.x1, bm.y1, bm.x2, bm.y2, e.x, e.y, bm.w * 0.5 + e.r)) {
              struck.add(e.id);
              damageEnemy(e, P.dmg * 0.5, false, P.x, P.y,
                          { silent: true, noChain: true });
            }
          }
        }
      }
    } else diaryMirrorList();
    if (P.diaryT <= 0) { diaryBeams.length = 0; diaryMirrors.length = 0; }
  }
  if (P.plateT > 0) { P.plateT -= dt; P.plateAng += dt * 1.3; }
  if (P.twinT > 0) P.twinT -= dt;
  if (P.stopT > 0) P.stopT -= dt;
  if (P.burrowT > 0) {
    P.burrowT -= dt;
    P.iframe = Math.max(P.iframe, 0.12);
    if (Math.random() < 0.7)
      spawnPart(P.x + rnd(18, -18), P.y + rnd(18, -18), 0, 0, rnd(6, 3),
                '#4ade80', 0.5, 0.94);
    if (P.burrowT <= 0) {                 // surface, the way she does
      playerBlast(P.x, P.y, 210, 40 + P.dmg * 2.2, '#4ade80');
      ringFx(P.x, P.y, 10, 240, '#4ade80', 0.6, 5);
    }
  }
  if (P.blT > 0) { P.blT -= dt; if (P.blT <= 0) P.blStacks = 0; }
  if (P.tempoT > 0) P.tempoT -= dt;
  playerChill = Math.max(0, playerChill - dt * 2);
}

/* GEMINI: a mirrored twin stands opposite you and fires when you fire. */
function twinPos() {
  return { x: WORLD.w - P.x, y: WORLD.h - P.y };
}
function twinFire() {
  const t = twinPos();
  const target = nearestEnemy(t.x, t.y, 1200);
  const ang = target ? Math.atan2(target.y - t.y, target.x - t.x) : P.ang + Math.PI;
  P.twinAng = ang;
  for (let i = 0; i < P.count; i++) {
    const off = P.count === 1 ? 0 : (i - (P.count - 1) / 2) * (P.spread * 1.9);
    fireBullet(t.x + Math.cos(ang) * 18, t.y + Math.sin(ang) * 18,
               ang + off + rnd(P.spread, -P.spread) * 0.5, 1, { foreign: true });
  }
  burst(t.x + Math.cos(ang) * 18, t.y + Math.sin(ang) * 18, 3, '#c4b5fd', 150, 2.2, 0.16, 0.9, ang);
}

function nearestEnemy(x, y, maxD) {
  let best = null, bd = maxD * maxD;
  for (const e of enemies) {
    if (e.dead) continue;
    const d = (e.x - x) ** 2 + (e.y - y) ** 2;
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function updateDrones(dt) {
  if (!P.drones) return;
  P.droneAng += dt * 2.1;
  const R = 62 + P.drones * 7;
  for (let i = 0; i < P.drones; i++) {
    const a = P.droneAng + i * TAU / P.drones;
    const dx = P.x + Math.cos(a) * R, dy = P.y + Math.sin(a) * R;
    if (Math.random() < 0.25)
      spawnPart(dx, dy, rnd(24, -24), rnd(24, -24), 2.2, '#a78bfa', 0.28, 0.9);
    for (const e of enemies) {
      if (e.dead || e.hitCd > 0) continue;
      if (len(e.x - dx, e.y - dy) < e.r + 11) {
        e.hitCd = 0.32;
        damageEnemy(e, (P.dmg * 0.62 + 4), false, dx, dy, { silent: true, noChain: true });
        burst(dx, dy, 5, '#a78bfa', 180, 2.4, 0.3);
      }
    }
  }
}

/* ------------------------------ enemy logic ------------------------------- */
function updateEnemies(dt) {
  const cull = [];
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.dead) { cull.push(i); continue; }
    e.t += dt;
    e.flash = Math.max(0, e.flash - dt * 7);
    e.hitCd = Math.max(0, e.hitCd - dt);
    if (e.ramCd > 0) e.ramCd -= dt;
    if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) e.slow = 0; }
    // SCORPIO venom: ticks harder the more stings have landed
    if (e.psn > 0) {
      e.psnT -= dt;
      e.psnTick = (e.psnTick || 0) - dt;
      if (e.psnTick <= 0) {
        e.psnTick = 0.5;
        damageEnemy(e, (1.5 + P.dmg * 0.09) * e.psn, false, e.x, e.y - 20,
                    { silent: true, noChain: true, noStatus: true });
        if (e.dead) { cull.push(i); continue; }
        if (Math.random() < 0.6)
          spawnPart(e.x + rnd(e.r, -e.r), e.y + rnd(e.r, -e.r), 0, -30, 2.4, '#a3e635', 0.5, 0.95);
      }
      if (e.psnT <= 0) e.psn = 0;
    }
    const sp = e.spd * (1 - e.slow);
    const dx = P.x - e.x, dy = P.y - e.y;
    const d = len(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;

    switch (e.type) {
      case 'grunt':
        steer(e, ux * sp, uy * sp, 5, dt);
        e.ang = Math.atan2(e.vy, e.vx);
        break;

      case 'brute':
        steer(e, ux * sp, uy * sp, 1.6, dt);
        e.ang += e.spin * dt * 0.4;
        break;

      case 'splitter':
        e.wob += dt * 3;
        steer(e, (ux + Math.cos(e.wob) * 0.4) * sp, (uy + Math.sin(e.wob) * 0.4) * sp, 3, dt);
        e.ang += dt * 1.6;
        break;

      case 'spitter': {
        const want = 300;
        const push = d < want ? -1 : (d > want + 90 ? 1 : 0);
        const tx = ux * push, ty = uy * push;
        const px = -uy * 0.75, py = ux * 0.75;
        steer(e, (tx + px) * sp, (ty + py) * sp, 3, dt);
        e.ang = Math.atan2(dy, dx);
        e.cd -= dt;
        if (e.cd <= 0 && d < 620) {
          e.cd = Math.max(0.7, 2.0 - wave * 0.04);
          for (let k = -1; k <= 1; k++) {
            if (k !== 0 && wave < 6) continue;
            eshoot(e, e.ang + k * 0.16, 268, e.dmg);
          }
          burst(e.x + ux * e.r, e.y + uy * e.r, 5, e.col, 150, 2.4, 0.3, 1, e.ang);
        }
        break;
      }

      case 'dasher': {
        e.cd -= dt;
        if (e.state === 0) {                   // approach
          steer(e, ux * sp, uy * sp, 3, dt);
          e.ang = Math.atan2(dy, dx);
          if (d < 380 && e.cd <= 0) { e.state = 1; e.atkT = 0.62; }
        } else if (e.state === 1) {            // windup
          e.atkT -= dt;
          steer(e, -ux * sp * 0.35, -uy * sp * 0.35, 6, dt);
          e.ang = angLerp(e.ang, Math.atan2(dy, dx), 0.12);
          if (e.atkT <= 0) {
            e.state = 2; e.atkT = 0.42;
            e.vx = Math.cos(e.ang) * 780; e.vy = Math.sin(e.ang) * 780;
            Audio_.noise(0.2, 0.1, 4000, 600, 3);
          }
        } else {                               // charge
          e.atkT -= dt;
          e.vx *= Math.pow(0.35, dt); e.vy *= Math.pow(0.35, dt);
          if (Math.random() < 0.8)
            spawnPart(e.x, e.y, rnd(40, -40), rnd(40, -40), 3, e.col, 0.3, 0.9);
          if (e.atkT <= 0) { e.state = 0; e.cd = rnd(2.4, 1.3); }
        }
        break;
      }

      case 'turret': {
        e.ang += dt * 1.1;
        steer(e, ux * sp, uy * sp, 1.1, dt);
        e.cd -= dt;
        if (e.cd <= 0 && d < 780) {
          e.cd = Math.max(0.9, 2.3 - wave * 0.05);
          const n = 8 + Math.min(6, (wave / 3) | 0);
          for (let k = 0; k < n; k++) eshoot(e, e.ang + k * TAU / n, 190, e.dmg);
          ringFx(e.x, e.y, e.r, e.r + 26, e.col, 0.3, 2);
        }
        break;
      }

      case 'bomber': {
        steer(e, ux * sp, uy * sp, 4.5, dt);
        e.ang = Math.atan2(e.vy, e.vx);
        if (d < 110) {
          e.atkT += dt;
          if (Math.floor(e.atkT * 9) % 2 === 0) e.flash = Math.max(e.flash, 0.7);
          if (e.atkT > 0.62) { killEnemy(e); continue; }
        } else e.atkT = 0;
        break;
      }

      case 'swarmer':
        e.wob += dt * 9;
        steer(e, (ux + Math.cos(e.wob) * 0.5) * sp, (uy + Math.sin(e.wob) * 0.5) * sp, 7, dt);
        e.ang = Math.atan2(e.vy, e.vx);
        break;

      case 'sentinel':
