    ctx.globalCompositeOperation = 'lighter';
    drawGlow(cx, y + 63, it.kind === 'chip' ? 46 : 34, col,
             it.kind === 'chip' ? 0.55 + Math.sin(uiTime * 3.4) * 0.2 : (on ? 0.5 : 0.3));
    ctx.restore();
    if (it.kind === 'chip') {
      // a die with its contacts out, rather than the generic polygon
      ctx.save();
      ctx.translate(cx, y + 63);
      ctx.strokeStyle = col; ctx.fillStyle = rgba(col, 0.16); ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.rect(-15, -15, 30, 30); ctx.fill(); ctx.stroke();
      ctx.lineWidth = 1.8;
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath(); ctx.moveTo(k * 9, -15); ctx.lineTo(k * 9, -22); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(k * 9, 15);  ctx.lineTo(k * 9, 22);  ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-15, k * 9); ctx.lineTo(-22, k * 9); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(15, k * 9);  ctx.lineTo(22, k * 9);  ctx.stroke();
      }
      ctx.strokeStyle = '#fffbeb'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.rect(-6, -6, 12, 12); ctx.stroke();
      ctx.restore();
    } else {
      ctx.strokeStyle = col; ctx.fillStyle = rgba(col, 0.14); ctx.lineWidth = 2.2;
      poly(cx, y + 63, 19, 3 + (i + it.name.length) % 5, uiTime * (on ? 1.3 : 0.45) + i);
      ctx.fill(); ctx.stroke();
    }

    ctx.font = '800 16px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#f8fafc';
    ctx.fillText(it.name, cx, y + 101);
    ctx.font = '400 11px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#94a3b8';
    wrapText(it.desc, cx, y + 121, r.w - 26, 14);

    if (it.kind === 'up') {                       // stack pips
      const have = P.up[it.up.id] || 0, pw = 10, tw2 = it.up.max * pw;
      for (let k = 0; k < it.up.max; k++) {
        ctx.fillStyle = k < have ? col : 'rgba(148,163,184,0.22)';
        roundRect(cx - tw2 / 2 + k * pw, y + r.h - 40, 7, 3.5, 2); ctx.fill();
      }
    }
    if (it.sold) {
      ctx.font = '800 14px Segoe UI, system-ui, sans-serif';
      ctx.fillStyle = '#64748b';
      ctx.fillText('SOLD', cx, y + r.h - 20);
    } else {
      ctx.font = '800 14px Segoe UI, system-ui, sans-serif';
      ctx.fillStyle = afford ? '#fbbf24' : '#9f1239';
      ctx.fillText('◈ ' + it.cost, cx, y + r.h - 24);
      ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
      ctx.fillStyle = on ? col : '#475569';
      ctx.fillText('[ ' + (i + 1) + ' ]', cx, y + r.h - 9);
    }
    ctx.restore();
  }

  const b = shopButtons();
  const rcost = 30 + shopRerolls * 25;
  drawButton(b.reroll, 'REROLL  ◈' + rcost, credits >= rcost, '#38bdf8');
  drawButton(b.leave, 'CONTINUE  ▸', true, COL.hp);

  ctx.textAlign = 'center';
  if (shopMsgT > 0) {
    ctx.globalAlpha = clamp(shopMsgT * 1.6, 0, 1);
    ctx.font = '700 13px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText(shopMsg, W / 2, b.leave.y + 56);
    ctx.globalAlpha = 1;
  }
  ctx.font = '500 10px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#475569';
  ctx.fillText('CLICK TO BUY   ·   1-6   ·   R REROLL   ·   ENTER TO CONTINUE', W / 2, H - 24);
}

function drawDead() {

    ctx.font = '600 12px Segoe UI, system-ui, sans-serif';

                 (Save.profile.name ? '   as ' + Save.profile.name : ''), W / 2, H / 2 + 106);

  ctx.font = '700 14px Segoe UI, system-ui, sans-serif';

  ctx.fillText(isTouch ? 'TAP TO RUN AGAIN' : 'PRESS SPACE / R TO RUN AGAIN', W / 2, H / 2 + 124);
}

function renderMenu() {
  // background field
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const t = p.life / p.max;
    drawGlow(p.x, p.y, p.r * 4, p.color, t * 0.5);
  }
  ctx.restore();

  const cxp = W / 2, cyp = H / 2;
  // rotating emblem
  ctx.save();
  ctx.translate(cxp, cyp - 96);
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(0, 0, 96, COL.player, 0.32);
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = rgba(COL.player, 0.85); ctx.lineWidth = 2;
  poly(0, 0, 42, 3, uiTime * 0.6); ctx.stroke();
  poly(0, 0, 30, 3, -uiTime * 0.9 + 1); ctx.stroke();
  ctx.strokeStyle = rgba('#f472b6', 0.7);
  poly(0, 0, 56, 6, uiTime * 0.32); ctx.stroke();
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.save();
  ctx.shadowColor = COL.player; ctx.shadowBlur = 34;
  ctx.font = `800 ${Math.min(84, W * 0.13)}px Segoe UI, system-ui, sans-serif`;
  ctx.fillStyle = '#e0f2fe';
  ctx.fillText('VOIDRUNNER', cxp, cyp - 6);
  ctx.restore();

  ctx.font = '600 12px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#475569';
  ctx.fillText('S U R V I V E   T H E   A R E N A', cxp, cyp + 26);

  // --- pilot select ---
  const C = CHAR();
  const selY = cyp + 88;
  ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#334155';
  ctx.fillText('PILOT   —   PRESS C', cxp, selY - 30);
  // both hulls, the chosen one lit
  CHARS.forEach((ch, i) => {
    const on = i === selectedChar;
    const hx = cxp + (i - (CHARS.length - 1) / 2) * 116;
    ctx.save();
    ctx.translate(hx, selY);
    if (on) {
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(0, 0, 42, ch.col, 0.45);
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.rotate(-Math.PI / 2);
    ctx.globalAlpha = on ? 1 : 0.32;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    if (ch.weapon === 'laser') {
      ctx.moveTo(21, 0); ctx.lineTo(7, 4); ctx.lineTo(3, 13); ctx.lineTo(-11, 10);
      ctx.lineTo(-6, 0); ctx.lineTo(-11, -10); ctx.lineTo(3, -13); ctx.lineTo(7, -4);
    } else {
      ctx.moveTo(16, 0); ctx.lineTo(-9, 10); ctx.lineTo(-5, 0); ctx.lineTo(-9, -10);
    }
    ctx.closePath();
    ctx.fillStyle = rgba(ch.col, on ? 0.22 : 0.1);
    ctx.strokeStyle = ch.col;
    ctx.fill(); ctx.stroke();
    ctx.restore();
  });
  ctx.font = '800 15px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = C.col;
  ctx.fillText(C.n, cxp, selY + 38);
  ctx.font = '500 10px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#475569';
  ctx.fillText(C.tag, cxp, selY + 54);

  const pulse = 0.55 + Math.sin(uiTime * 3.4) * 0.45;
  ctx.font = '700 16px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = rgba(COL.player, pulse);
  ctx.fillText(isTouch ? 'TAP TO START' : 'PRESS SPACE TO START', cxp, cyp + 174);

  const pr = Save.profile;
  if (pr.best > 0) {
    ctx.font = '600 12px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = COL.crit;
    ctx.fillText('BEST  ' + pr.best.toLocaleString(), cxp, cyp + 204);
  }
  if (pr.runs > 0) {
    ctx.font = '500 11px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#475569';
    ctx.fillText(`${pr.runs} RUN${pr.runs === 1 ? '' : 'S'}   ·   ${pr.kills.toLocaleString()} KILLS   ·   ` +
                 `FURTHEST ${pr.bestSector} W${pr.bestWave}   ·   ${fmtTime(pr.time)}`, cxp, cyp + 224);
  }

  // leaderboard — the global board when it's reachable, your own runs otherwise
  const global = Board.top.length > 0;
  const all = (global ? Board.top : Save.top).slice(0, 5);
  /* Two layouts, because stacking the board under the centre column puts it on
     a collision course with the bottom-anchored footer — and on a short window
     there is simply no gap left to put it in.

     Wide screens have a large empty margin either side of the title, so the
     board moves out there and the collision cannot happen at all. Narrower
     screens keep the stacked version, fitting whole rows into the measured gap
     and dropping the lowest ranks first rather than overlapping anything. */
  const FOOT_TOP = H - 112;                    // first footer line: the unlocks row
  const rowGap = 15;

  /* Measure the title rather than guessing at it — the side panel is only
     viable if it genuinely clears both the wordmark and the screen edge, and
     that depends on the font size, which scales with width. */
  ctx.save();
  ctx.font = `800 ${Math.min(84, W * 0.13)}px Segoe UI, system-ui, sans-serif`;
  const titleHalf = ctx.measureText('VOIDRUNNER').width / 2;
  ctx.restore();
  const panelHalf = 104;
  const px = Math.min(cxp + titleHalf + 46 + panelHalf, W - panelHalf - 14);
  const wide = (px - panelHalf) > (cxp + titleHalf + 26) && (px + panelHalf) < W - 10;

  if (wide) {
    let py = cyp - 40;
    ctx.textAlign = 'center';
    ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#334155';
    ctx.fillText(global ? 'GLOBAL TOP ' + all.length : 'YOUR BEST RUNS', px, py);
    py += 20;
    ctx.font = '600 11px Segoe UI, system-ui, sans-serif';
    all.forEach((r, i) => {
      const y = py + i * 17;
      const mine = global && r.name === Save.profile.name;
      ctx.textAlign = 'right';
      ctx.fillStyle = mine ? COL.player : (i === 0 ? COL.crit : '#64748b');
      ctx.fillText(String((r.score || 0).toLocaleString()), px - 8, y);
      ctx.textAlign = 'left';
      ctx.fillStyle = mine ? COL.player : '#475569';
      const label = global
        ? `${i + 1}. ${clipText(r.name || '—', 12)}  ·  ${r.sector || '—'} W${r.wave}`
        : `${r.sector || '—'}  ·  W${r.wave}  ·  LV${r.level}`;
      ctx.fillText(label, px + 8, y);
    });
    ctx.textAlign = 'center';
  } else {
    const ly = cyp + 252;
    const room = (FOOT_TOP - 22) - (ly + 18);  // 22px of air above the footer
    const fits = room < 0 ? 0
               : Math.max(0, Math.min(all.length, Math.floor(room / rowGap) + 1));
    const rows = all.slice(0, fits);
    if (rows.length) {
      ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
      ctx.fillStyle = '#334155';
      ctx.fillText(global ? 'GLOBAL TOP ' + rows.length : 'YOUR BEST RUNS', cxp, ly);
      ctx.font = '600 11px Segoe UI, system-ui, sans-serif';
      rows.forEach((r, i) => {
        const y = ly + 18 + i * rowGap;
        const mine = global && r.name === Save.profile.name;
        ctx.textAlign = 'right';
        ctx.fillStyle = mine ? COL.player : (i === 0 ? COL.crit : '#64748b');
        ctx.fillText(String((r.score || 0).toLocaleString()), cxp - 12, y);
        ctx.textAlign = 'left';
        ctx.fillStyle = mine ? COL.player : '#475569';
        ctx.fillText(global
          ? `${i + 1}. ${clipText(r.name || '—', 12)}  ·  ${r.sector || '—'} W${r.wave}`
          : `${r.sector || '—'}  ·  W${r.wave}  ·  LV${r.level}`, cxp + 12, y);
      });
      ctx.textAlign = 'center';
    }
  }

  const unlocks = [];
  if (Save.profile.planetarium) unlocks.push(['✦ PLANETARIUMS', '#fbbf24']);
  if (Save.profile.altPath) unlocks.push(['◈ THE FRACTURE', '#e2e8f0']);
  if (Save.profile.trueEnd) unlocks.push(['✥ THE UNWRITTEN', '#f8fafc']);
  if (Save.profile.freeplay) unlocks.push(['⌨ FREEPLAY  [F]', '#38bdf8']);
  else if (Save.profile.clears > 0)
    unlocks.push([`◈ ${Save.profile.clears} / 2 CLEARS`, '#475569']);
  if (unlocks.length) {
    ctx.font = '700 10px Segoe UI, system-ui, sans-serif';
    const gap = 22;
    let tw = 0;
    unlocks.forEach(u => { tw += ctx.measureText(u[0]).width; });
    tw += gap * (unlocks.length - 1);
    let ux2 = cxp - tw / 2;
    ctx.textAlign = 'left';
    unlocks.forEach(u => {
      ctx.fillStyle = u[1];
      ctx.fillText(u[0], ux2, H - 112);
      ux2 += ctx.measureText(u[0]).width + gap;
    });
    ctx.textAlign = 'center';
  }

  // who you are on the board
  if (Save.profile.name) {
    ctx.font = '600 10px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#334155';
    ctx.fillText(`PLAYING AS ${Save.profile.name.toUpperCase()}   ·   PRESS N TO RENAME`,
      cxp, H - 96);
  }

  // status badges — save backend and global board, at a glance
  const badge = { cloud: ['◈ FIREPROOF SYNC', '#34d399'],
                  connecting: ['◈ CONNECTING…', '#64748b'],
                  error: ['◈ LOCAL SAVE (offline)', '#64748b'],
                  local: ['◈ LOCAL SAVE', '#475569'] }[Save.status];
  const bBadge = { ok: ['◈ LEADERBOARD LIVE', '#38bdf8'],
                   loading: ['◈ LEADERBOARD…', '#475569'],
                   offline: ['◈ LEADERBOARD OFFLINE', '#475569'],
                   idle: ['', '#475569'] }[Board.status];
  ctx.font = '600 10px Segoe UI, system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = badge[1];
  ctx.fillText(badge[0], W - 18, 22);
  if (bBadge && bBadge[0]) {
    ctx.fillStyle = bBadge[1];
    ctx.fillText(bBadge[0], W - 18, 38);
  }
  ctx.textAlign = 'center';

  const lines = isTouch
    ? ['LEFT SIDE — move   ·   RIGHT SIDE — aim & fire']
    : ['WASD move   ·   MOUSE aim   ·   HOLD to fire',
       'SPACE dash (i-frames)   ·   T autofire   ·   P pause   ·   X codex'];
  ctx.font = '500 11px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#334155';
  lines.forEach((l, i) => ctx.fillText(l, cxp, H - 74 + i * 18));

  // below every other footer line, so it competes with nothing
  drawVolSlider(cxp, H - 28, 150);

  drawVignette();
}

/* -------------------------------- library UI ------------------------------- */
function libraryButtons() {
  const bw = Math.min(180, W * 0.32), bh = 38, y = H / 2 + 136;
  const b = { take:  { x: W / 2 - bw - 8, y, w: bw, h: bh },
              leave: { x: W / 2 + 8,      y, w: bw, h: bh } };
  if (keeperWants()) b.hand = { x: W / 2 - bw / 2, y: y + 46, w: bw, h: bh };
  else if (keeperTalks()) b.talk = { x: W / 2 - bw / 2, y: y + 46, w: bw, h: bh };
  return b;
}

/* ------------------------------ the bookkeeper -----------------------------
   He is behind the desk of every library, and he is only ever waiting for one
   thing. Hand him the finished record and he stops being scenery.
--------------------------------------------------------------------------- */
const KEEPER_COL = '#fcd34d';

/* He takes the record as often as you bring it. This used to be once ever,
   which stranded anyone who beat him before his own book became a codex
   entry: book_keeper is only awarded by beating him, trulyFull() needs it,
   and the talk needs trulyFull() — so the record could never be finished and
   THE UNWRITTEN could never be reached. He only steps aside for the talk. */
function keeperWants() {
  return state === 'library' && !malwareOffer && Codex.complete() &&
         !(P.book && P.book.id === 'keeper') &&   // already carrying his copy this run
         !keeperTalks();
}

function keeperLine() {
  const h = Codex.have();
  if (keeperTalks()) return 'You finished it. I read it. Take what you like.';
  if (P.book && P.book.id === 'keeper')
    return 'You have my copy already. Go and use it.';
  if (Codex.complete())
    return Save.profile.keeperDone
      ? 'Again? Hand it here. I will read it again.'
      : 'That is all of it. Every entry. Hand it here.';
  if (h.e < h.needE && h.u < h.needU)
    return 'Still gaps in both halves. ' + (h.needE - h.e) + ' unseen, ' +
           (h.needU - h.u) + ' unwritten.';
  if (h.e < h.needE)
    return (h.needE - h.e) + ' still unseen. I cannot file an incomplete bestiary.';
  return (h.needU - h.u) + ' entries still unwritten. Come back when the list is closed.';
}

function drawKeeperNPC(cx, cy, s) {
  const wants = keeperWants();
  const bob = Math.sin(uiTime * 1.6) * 2;
  ctx.save();
  ctx.translate(cx, cy + bob);
  if (wants) {
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(0, 0, s * 2.4, KEEPER_COL, 0.3 + Math.sin(uiTime * 3) * 0.12);
    ctx.globalCompositeOperation = 'source-over';
  }
  // a tall stooped figure behind a desk, holding a ledger
  ctx.strokeStyle = wants ? KEEPER_COL : '#a16207';
  ctx.fillStyle = wants ? 'rgba(252,211,77,0.14)' : 'rgba(161,98,7,0.08)';
  ctx.lineWidth = 2.2;
  ctx.beginPath();                              // hood / shoulders
  ctx.moveTo(0, -s);
  ctx.lineTo(s * 0.62, -s * 0.1);
  ctx.lineTo(s * 0.5, s);
  ctx.lineTo(-s * 0.5, s);
  ctx.lineTo(-s * 0.62, -s * 0.1);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath();                              // the ledger he is holding
  ctx.rect(-s * 0.34, s * 0.05, s * 0.68, s * 0.42);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, s * 0.05); ctx.lineTo(0, s * 0.47);
  ctx.stroke();
  // two points of light where a face would be
  ctx.fillStyle = wants ? '#fef3c7' : '#a16207';
  ctx.beginPath(); ctx.arc(-s * 0.17, -s * 0.42, 2.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.17, -s * 0.42, 2.2, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ---------------------------------- freeplay -------------------------------
   What he offers instead of the fight: the keys. A run started from here is
   marked, and a marked run never touches your record — no score, no best, no
   leaderboard, no codex entries, no unlocks. It is a sandbox and it says so.
-------------------------------------------------------------------------- */
let freeRun = false, freeOpen = false, freeSel = 0, freeGod = false, freeSpd = 1;

const FREE_ROWS = [
  { n: 'GODMODE',        f: () => { freeGod = !freeGod; },  on: () => freeGod },
  { n: 'HEAL',           f: () => { P.hp = P.maxHp; } },
  { n: 'CLEAR THE ROOM', f: () => {
      for (const e of enemies.slice()) if (!e.dead) {
        e.invuln = 0; e.floor = undefined; e.dmgCap = undefined; e.kShield = 0;
        damageEnemy(e, 1e9, false, P.x, P.y);
      }
      ebullets.length = 0; } },
  { n: '+1 LEVEL',       f: () => { P.xp = P.xpNext; checkLevel(); } },
  { n: '+500 CREDITS',   f: () => { credits += 500; } },
  { n: 'NEXT WAVE',      f: () => { betweenWaves = 0.2; spawnBudget = 0;
                                    enemies.length = 0; ebullets.length = 0; } },
  { n: 'SPAWN BOSS',     f: () => {
      const keys = Object.keys(BOSSES).filter(k => !BOSSES[k].endgame);
      const k = keys[(freeBoss = (freeBoss + 1) % keys.length)];
      const a = rnd(TAU);
      spawnEnemy('boss', clamp(P.x + Math.cos(a) * 340, arena.x0 + 90, arena.x1 - 90),
                         clamp(P.y + Math.sin(a) * 340, arena.y0 + 90, arena.y1 - 90),
                 { boss: k });
      bossAlive = true; banner(BOSSES[k].name, BOSSES[k].col, 2.0); } },
  { n: 'SPAWN A CROWD',  f: () => {
      const pool = Object.keys(ETYPE).filter(k => k !== 'boss' && k !== 'egg');
      for (let i = 0; i < 8; i++) {
        const a = rnd(TAU), r = rnd(420, 240);
        spawnEnemy(pick(pool), clamp(P.x + Math.cos(a) * r, arena.x0 + 50, arena.x1 - 50),
                               clamp(P.y + Math.sin(a) * r, arena.y0 + 50, arena.y1 - 50),
                   { elite: false });
      } } },
  { n: 'NEXT SECTOR',    f: () => {
      freeStage = (freeStage + 1) % (STAGES.length + ALT_STAGES.length);
      const s = freeStage < STAGES.length ? STAGES[freeStage]
                                         : ALT_STAGES[freeStage - STAGES.length];
      enemies.length = 0; ebullets.length = 0; portals.length = 0;
      awaitingPortal = false;
      enterStage(s); betweenWaves = 0.6; } },
  { n: 'GIVE A BOOK',    f: () => {
      const keys = Object.keys(BOOKS);
      const k = keys[(freeBook = (freeBook + 1) % keys.length)];
      P.book = BOOKS[k]; P.bookCharge = BOOKS[k].cost;
      banner(BOOKS[k].n, BOOKS[k].col, 1.8); } },
  { n: 'GIVE MALWARE',   f: () => {
      const m = MALWARE[(freeMal = (freeMal + 1) % MALWARE.length)];
      P.malware = m; banner(m.n, m.col, 1.8); } },
  { n: 'GIVE A READING', f: () => {
      const s = SIGNS[(freeSign = (freeSign + 1) % SIGNS.length)];
      s.f(P); banner(s.n, s.good ? '#fbbf24' : '#a855f7', 1.8); } },
  { n: 'THE RECORD CHIP',f: () => { P.chip = true; banner('THE RECORD CHIP', CHIP_COL, 1.8); } },
  { n: 'TIME  ×',        f: () => { freeSpd = freeSpd >= 4 ? 0.25 : freeSpd * 2; },
    val: () => freeSpd + '×' },
  { n: 'END THE RUN',    f: () => { freeRun = false; state = 'menu'; freeOpen = false; } }
];
let freeBoss = -1, freeStage = -1, freeBook = -1, freeMal = -1, freeSign = -1;

function startFreeplay() {
  resetGame();
  freeRun = true;                        // set after reset: reset clears it
  freeOpen = false; freeSel = 0; freeGod = false; freeSpd = 1;
  freeBoss = -1; freeStage = -1; freeBook = -1; freeMal = -1; freeSign = -1;
  state = 'play';
  banner('FREEPLAY   ·   NOTHING IS RECORDED', '#38bdf8', 3.6);
  Audio_.select();
}

function freeRects() {
  const w = 232, h = 22, gap = 3;
  const x = 16, y0 = 96;
  return FREE_ROWS.map((_, i) => ({ x, y: y0 + i * (h + gap), w, h }));
}

function drawFreeplay() {
  if (!freeRun) return;
  ctx.save();
  ctx.textBaseline = 'middle';
  if (!freeOpen) {
    ctx.textAlign = 'left';
    ctx.font = '700 10px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#38bdf8';
    ctx.globalAlpha = 0.55 + Math.sin(uiTime * 2) * 0.2;
    ctx.fillText('FREEPLAY  ·  [ \\ ] CONSOLE  ·  UNRECORDED', 16, 74);
    ctx.restore();
    return;
  }
  const rs = freeRects();
  const panel = { x: 8, y: 62, w: 248, h: rs[rs.length - 1].y + 30 - 62 };
  ctx.fillStyle = 'rgba(4,10,18,0.94)';
  ctx.strokeStyle = '#1e3a5f'; ctx.lineWidth = 1;
  roundRect(panel.x, panel.y, panel.w, panel.h, 8); ctx.fill(); ctx.stroke();
  ctx.textAlign = 'left';
  ctx.font = '800 10px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#38bdf8';
  ctx.fillText('FREEPLAY CONSOLE', panel.x + 12, panel.y + 16);
  ctx.font = '500 8px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#475569';
  ctx.fillText('nothing here is recorded', panel.x + 12, panel.y + 28);

  FREE_ROWS.forEach((row, i) => {
    const r = rs[i];
    const sel = i === freeSel, hot = inRect(mouse.x, mouse.y, r);
    const on = row.on && row.on();
    ctx.fillStyle = on ? 'rgba(34,197,94,0.16)'
                  : sel ? 'rgba(56,189,248,0.14)'
                  : hot ? 'rgba(148,163,184,0.08)' : 'rgba(148,163,184,0.03)';
    ctx.strokeStyle = on ? '#22c55e' : sel ? '#38bdf8' : 'rgba(71,85,105,0.5)';
    ctx.lineWidth = sel || on ? 1.6 : 1;
    roundRect(r.x, r.y, r.w, r.h, 5); ctx.fill(); ctx.stroke();
    ctx.font = '600 10px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = on ? '#bbf7d0' : sel ? '#e2e8f0' : '#94a3b8';
    ctx.fillText(row.n + (row.val ? ' ' + row.val() : ''), r.x + 9, r.y + r.h / 2);
  });
  ctx.font = '500 8px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#334155';
  ctx.fillText('↑↓ pick  ·  ENTER run  ·  \\ close', panel.x + 12, panel.y + panel.h - 8);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

/* --------------------------- the last conversation -------------------------
   Only reachable with every section of the record filled and his notes already
   in it. He does not fight for this one; he asks. */
const KEEPER_TALK = [
  'You brought it back finished.',
  'Every section. The optional ones as well. I did not expect that.',
  'I have been filing this place since before it had sectors. ' +
  'I have watched a great many people stop.',
  'There is one entry I never wrote. Not for lack of trying — ' +
  'it does not hold ink.',
  'I can leave you the keys instead. The room, the roster, all of it, ' +
  'yours to arrange. Nothing recorded, nothing ranked. Restful.',
  'Or.'
];

let talkLine = 0, talkT = 0, talkAsk = false;

function keeperTalks() {
  return state === 'library' && !malwareOffer && Codex.trulyFull() &&
         Save.profile.keeperDone && !Save.profile.trueEnd;
}

function startTalk() {
  libraryBook = null; malwareOffer = null;
  talkLine = 0; talkT = 0; talkAsk = false;
  state = 'talk'; uiArm = 0.35;
  Audio_.select();
}

function talkAdvance() {
  if (uiArm > 0) return;
  if (talkAsk) return;
  talkLine++;
  uiArm = 0.18;
  Audio_.tone(520, 0.05, 'sine', 0.04, 700);
  if (talkLine >= KEEPER_TALK.length) { talkAsk = true; talkLine = KEEPER_TALK.length - 1; }
}

function talkAnswer(yes) {
  if (!talkAsk || uiArm > 0) return;
  if (yes) {
    state = 'play';
    uiArm = 0.3;
    startUnwritten();
  } else {
    Save.profile.freeplay = true;
    Save.writeLocal(); Save.flush();
    state = 'play';
    uiArm = 0.3;
    banner('FREEPLAY UNLOCKED', '#38bdf8', 4.4);
    setTimeout(() => { if (state === 'play') banner('NOTHING THERE IS RECORDED', '#64748b', 3.4); }, 3000);
    Audio_.levelup();
  }
}

function drawTalk() {
  // opaque: the live HUD and the room behind it are noise during this
  ctx.fillStyle = '#060402';
  ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  drawKeeperNPC(cx, cy - 150, 58);
  ctx.font = '700 10px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = KEEPER_COL;
  ctx.fillText('THE BOOKKEEPER', cx, cy - 78);

  ctx.font = '400 15px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#e2e8f0';
  wrapText('“' + KEEPER_TALK[Math.min(talkLine, KEEPER_TALK.length - 1)] + '”',
           cx, cy - 20, Math.min(680, W - 90), 24);

  if (!talkAsk) {
    const pulse = 0.5 + Math.sin(uiTime * 3.6) * 0.4;
    ctx.font = '600 11px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = rgba('#94a3b8', pulse);
    ctx.fillText('SPACE  ·  continue', cx, H - 60);
    ctx.font = '500 9px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#3f3f46';
    ctx.fillText((talkLine + 1) + ' / ' + KEEPER_TALK.length, cx, H - 40);
    ctx.textBaseline = 'alphabetic';
    return;
  }

  ctx.font = '800 ' + Math.min(30, W * 0.032) + 'px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = UNW_COL;
  ctx.fillText('Do you want a real challenge?', cx, cy + 70);

  const b = talkButtons();
  const btn = (r, label, sub, col) => {
    const hot = inRect(mouse.x, mouse.y, r);
    ctx.save();
    ctx.fillStyle = rgba(col, hot ? 0.2 : 0.07);
    ctx.strokeStyle = col; ctx.lineWidth = hot ? 2.4 : 1.6;
    roundRect(r.x, r.y, r.w, r.h, 9); ctx.fill(); ctx.stroke();
    ctx.fillStyle = col;
    ctx.font = '800 15px Segoe UI, system-ui, sans-serif';
    ctx.fillText(label, r.x + r.w / 2, r.y + 22);
    ctx.font = '500 9px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.fillText(sub, r.x + r.w / 2, r.y + 42);
    ctx.restore();
  };
  btn(b.no, 'NO   [N]', 'the keys · freeplay · nothing recorded', '#38bdf8');
  btn(b.yes, 'YES   [Y]', 'the entry that holds no ink', UNW_COL);
  ctx.textBaseline = 'alphabetic';
}

function talkButtons() {
  const bw = Math.min(260, (W - 80) / 2), bh = 56;
  const y = H / 2 + 110;
  return { no:  { x: W / 2 - bw - 10, y, w: bw, h: bh },
           yes: { x: W / 2 + 10,      y, w: bw, h: bh } };
}

function handOverCodex() {
  if (!keeperWants()) return;
  Save.profile.keeperMet = true;
  Save.writeLocal(); Save.flush();
  libraryBook = null; malwareOffer = null;
  state = 'play';
  uiArm = 0.3;
  startKeeperFight();
}

function startKeeperFight() {
  enemies.length = 0; ebullets.length = 0; portals.length = 0;
  awaitingPortal = false;
  betweenWaves = 1e9;                  // no wave logic during this
  spawnBudget = 0;
  bossAlive = true;
  const a = rnd(TAU);
  const kx = clamp(P.x + Math.cos(a) * 380, arena.x0 + 120, arena.x1 - 120);
  const ky = clamp(P.y + Math.sin(a) * 380, arena.y0 + 120, arena.y1 - 120);
  const e = spawnEnemy('boss', kx, ky, { boss: 'keeper' });
  if (!e) return;
  arenaShrinkTo(P.x, P.y, 1600, 1150);
  banner('THE BOOKKEEPER   ACCEPTS', KEEPER_COL, 3.8);
  drawFlashT = 0.34; shake(1.3);
  Audio_.boss(); Audio_.boom();
  ringFx(e.x, e.y, e.r, 700, KEEPER_COL, 1.3, 9);
}

/* ---------------------------------- codex UI -------------------------------
   Two tabs, a grid of cells, one detail panel. Anything not yet met is a dim
   silhouette with no name — the shape is the reward for having survived it.
--------------------------------------------------------------------------- */
let codexTab = 0, codexSel = 0, codexScroll = 0, codexFrom = 'menu';

/* Five sections. Enemies and upgrades are always present; the other three are
   optional pools and stay '????' until you have actually carried one of that
   kind, which is also what decides whether he annotates its entries. They are
   deliberately excluded from completion — see Codex.need(). */
const CODEX_TABS = [
  { id: 'e', label: 'ENEMIES',  set: 'e', cols: 6, ch: 104 },
  { id: 'u', label: 'UPGRADES', set: 'u', cols: 4, ch: 62 },
  { id: 'm', label: 'MALWARE',  set: 'm', cols: 3, ch: 74, opt: true },
  { id: 'b', label: 'BOOKS',    set: 'b', cols: 3, ch: 74, opt: true },
  { id: 'z', label: 'ZODIAC',   set: 'z', cols: 4, ch: 68, opt: true }
];

function codexTabOpen(i) {
  const t = CODEX_TABS[i];
  return !t.opt || Codex[t.set].size > 0;
}

function codexList() {
  switch (CODEX_TABS[codexTab].id) {
    case 'e': return Codex.enemies();
    case 'u': return Codex.upgrades();
    case 'm': return MALWARE.map(m => ({ key: m.id, noteKey: 'mal_' + m.id,
                                         n: m.n, d: m.d, col: m.col }));
    case 'b': return Object.keys(BOOKS).map(k => ({ key: k, noteKey: 'book_' + k,
                                         n: BOOKS[k].n, d: BOOKS[k].d, col: BOOKS[k].col,
                                         sub: 'WRITTEN FROM ' + BOOKS[k].from +
                                              '   ·   ' + BOOKS[k].cost + ' WAVE' +
                                              (BOOKS[k].cost === 1 ? '' : 'S') }));
    default:  return SIGNS.map(s => ({ key: s.id, noteKey: 'sign_' + s.id,
                                         n: s.n, d: s.flavour + '\n' + s.effect,
                                         col: s.good ? '#fbbf24' : '#f0abfc',
                                         sub: s.t + '   ·   ' +
                                              (s.good ? 'BLESSING' : 'CURSE') }));
  }
}
function codexSeen(en) { return Codex[CODEX_TABS[codexTab].set].has(en.key); }
function codexNoteKey(en) { return en.noteKey || en.key; }
function codexCols() { return CODEX_TABS[codexTab].cols; }
function codexGeom() {
  const cols = codexCols();
  // the annotated copy needs a deeper bottom band: his note sits under the entry
  const pad = 30, top = 132, bottom = codexAnnotated() ? 180 : 152;
  const gw = Math.min(W - pad * 2, 980);
  const cw = gw / cols;
  const ch = CODEX_TABS[codexTab].ch;
  const viewH = Math.max(ch, H - top - bottom);
  // the small sections do not fill the band; centre them rather than leaving a
  // page of nothing under four rows
  const rows = Math.ceil(codexList().length / cols);
  const contentH = rows * ch;
  const y0 = top + (contentH < viewH ? Math.round((viewH - contentH) / 2) : 0);
  return { cols, cw, ch, x0: (W - gw) / 2, y0, clipY: top, viewH };
}
function codexCellRect(i) {
  const g = codexGeom();
  const r = Math.floor(i / g.cols), c = i % g.cols;
  return { x: g.x0 + c * g.cw + 4, y: g.y0 + r * g.ch - codexScroll + 4,
           w: g.cw - 8, h: g.ch - 8 };
}
function codexMaxScroll() {
  const g = codexGeom();
  const rows = Math.ceil(codexList().length / g.cols);
  return Math.max(0, rows * g.ch - g.viewH);
}
function codexTabRects() {
  const n = CODEX_TABS.length, gap = 6, h = 26, y = 88;
  const w = Math.max(64, Math.min(132, (Math.min(W - 40, 900) - gap * (n - 1)) / n));
  const total = n * w + gap * (n - 1);
  const x0 = (W - total) / 2;
  return CODEX_TABS.map((_, i) => ({ x: x0 + i * (w + gap), y, w, h }));
}
// Tab / arrow navigation skips locked sections rather than landing on an empty grid
function codexStepTab(dir) {
  for (let k = 1; k <= CODEX_TABS.length; k++) {
    const i = (codexTab + dir * k + CODEX_TABS.length * k) % CODEX_TABS.length;
    if (codexTabOpen(i)) {
      if (i === codexTab) return;
      codexTab = i; codexSel = 0; codexScroll = 0; Audio_.select();
      return;
    }
  }
}

// a compact silhouette from the same shape data the live enemy uses
function drawCodexIcon(en, x, y, size, seen) {
  ctx.save();
  if (seen) {
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(x, y, size * 1.7, en.col, 0.34);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.globalAlpha = seen ? 1 : 0.16;
  ctx.strokeStyle = seen ? en.col : '#64748b';
  ctx.fillStyle = seen ? rgba(en.col, 0.16) : 'rgba(100,116,139,0.1)';
  ctx.lineWidth = en.boss ? 3 : 2.2;
  poly(x, y, size, en.sides || 6, uiTime * (en.boss ? 0.3 : 0.5));
  ctx.fill(); ctx.stroke();
  if (en.boss) {
    ctx.lineWidth = 1.4;
    poly(x, y, size * 0.55, en.sides || 6, -uiTime * 0.5);
    ctx.stroke();
  }
  ctx.restore();
}

// once he has handed it back, the book itself is a different object
const codexAnnotated = () => !!Save.profile.keeperDone;
const INK = '#b91c1c';
const INK_FONT = 'italic 700 12px "Segoe Script", "Ink Free", "Brush Script MT", cursive';

/* Wear drawn from a fixed hash rather than Math.random, so the stains sit still
   instead of crawling around the page every frame. */
function codexWear() {
  const h = (n) => { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); };
  ctx.save();
  // damp stains soaked through the board
  for (let i = 0; i < 7; i++) {
    const x = h(i + 1) * W, y = h(i + 9) * H, r = 60 + h(i + 21) * 190;
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(x, y, r, '#4a2c12', 0.05 + h(i + 33) * 0.05);
  }
  ctx.globalCompositeOperation = 'source-over';
  // a ring where something was set down and forgotten
  ctx.strokeStyle = 'rgba(120,72,32,0.16)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(W * 0.82, H * 0.28, 54, 0, TAU); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(W * 0.18, H * 0.74, 38, 0.4, 5.2); ctx.stroke();
  // creases from being folded and carried
  ctx.strokeStyle = 'rgba(226,232,240,0.05)'; ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const x = W * (0.2 + i * 0.2);
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + (h(i) - 0.5) * 40, H); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(0, H * 0.52); ctx.lineTo(W, H * 0.52 + 8); ctx.stroke();
  // worn edges
  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 14;
  ctx.strokeRect(-7, -7, W + 14, H + 14);
  ctx.strokeStyle = 'rgba(88,52,24,0.22)'; ctx.lineWidth = 2;
  for (let i = 0; i < 26; i++) {
    const t = i / 26, nick = 4 + h(i + 61) * 9;
    ctx.beginPath(); ctx.moveTo(t * W, 0); ctx.lineTo(t * W + 6, nick); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(t * W, H); ctx.lineTo(t * W - 6, H - nick); ctx.stroke();
  }
  ctx.restore();
}

function drawCodex() {
  const worn = codexAnnotated();
  // fully opaque: the live HUD underneath is noise here, not atmosphere
  ctx.fillStyle = worn ? '#0a0705' : '#03060c';
  ctx.fillRect(0, 0, W, H);
  if (worn) codexWear();
  const list = codexList();
  const g = codexGeom();
  codexSel = clamp(codexSel, 0, Math.max(0, list.length - 1));
  const seenCount = list.filter(codexSeen).length;

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '800 30px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = worn ? '#e7d9c4' : '#e2e8f0';
  ctx.fillText('CODEX', W / 2, 44);
  if (worn) {
    // struck through and re-titled in his hand
    const tw = ctx.measureText('CODEX').width;
    ctx.save();
    ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W / 2 - tw / 2 - 4, 48); ctx.lineTo(W / 2 + tw / 2 + 4, 40);
    ctx.stroke();
    ctx.font = INK_FONT;
    ctx.fillStyle = INK;
    ctx.textAlign = 'left';
    ctx.fillText('annotated', W / 2 + tw / 2 + 12, 52);
    ctx.restore();
    ctx.textAlign = 'center';
  }
  ctx.font = '600 10px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = worn ? '#6b5a44' : '#475569';
  ctx.fillText(seenCount + ' / ' + list.length + '  RECORDED', W / 2, 66);

  // tabs — locked optional sections show as '????' and cannot be opened
  const tabs = codexTabRects();
  CODEX_TABS.forEach((t, i) => {
    const r = tabs[i], on = codexTab === i, open = codexTabOpen(i);
    const hot = open && inRect(mouse.x, mouse.y, r);
    ctx.fillStyle = on ? 'rgba(103,232,249,0.14)'
                  : (hot ? 'rgba(148,163,184,0.1)' : 'rgba(148,163,184,0.04)');
    ctx.strokeStyle = on ? COL.player : (open ? '#334155' : 'rgba(51,65,85,0.5)');
    ctx.lineWidth = on ? 2 : 1;
    roundRect(r.x, r.y, r.w, r.h, 6); ctx.fill(); ctx.stroke();
    ctx.font = '700 11px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = on ? COL.player : (open ? '#64748b' : '#3f4a5c');
    ctx.fillText(open ? t.label : '? ? ? ?', r.x + r.w / 2, r.y + r.h / 2 + 1);
  });

  // grid, clipped to its own viewport so rows scroll under the header
  ctx.save();
  ctx.beginPath();
  ctx.rect(g.x0 - 6, g.clipY, g.cw * g.cols + 12, g.viewH);
  ctx.clip();
  for (let i = 0; i < list.length; i++) {
    const r = codexCellRect(i);
    if (r.y + r.h < g.clipY - 4 || r.y > g.clipY + g.viewH + 4) continue;
    const en = list[i], seen = codexSeen(en);
    const sel = i === codexSel;
    const hot = inRect(mouse.x, mouse.y, r);
    const kind = CODEX_TABS[codexTab].id;
    const col = !seen ? '#475569'
              : kind === 'u' ? RARITY[en.rar] : en.col;
    ctx.save();
    ctx.globalAlpha = seen ? 1 : 0.5;
    ctx.fillStyle = sel ? rgba(col, 0.13) : (hot ? 'rgba(148,163,184,0.07)' : 'rgba(148,163,184,0.03)');
    ctx.strokeStyle = sel ? col : 'rgba(71,85,105,0.6)';
    ctx.lineWidth = sel ? 2 : 1;
    roundRect(r.x, r.y, r.w, r.h, 7); ctx.fill(); ctx.stroke();
    ctx.restore();

    if (kind === 'e') {
      drawCodexIcon(en, r.x + r.w / 2, r.y + r.h / 2 - 12, en.boss ? 22 : 18, seen);
      ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
      ctx.fillStyle = seen ? (en.boss ? en.col : '#94a3b8') : '#475569';
      ctx.fillText(seen ? en.n : '? ? ?', r.x + r.w / 2, r.y + r.h - 14);
    } else if (kind === 'u') {
      // items get no picture, by design — name and rarity only
      ctx.font = '700 8px Segoe UI, system-ui, sans-serif';
      ctx.fillStyle = seen ? RARITY[en.rar] : '#475569';
      ctx.fillText(seen ? en.rar.toUpperCase() : '———', r.x + r.w / 2, r.y + 15);
      ctx.font = '700 12px Segoe UI, system-ui, sans-serif';
      ctx.fillStyle = seen ? '#e2e8f0' : '#475569';
      ctx.fillText(seen ? upName(en.up) : '? ? ?', r.x + r.w / 2, r.y + r.h - 18);
    } else {
      // malware / books / zodiac: also items, so also no picture
      ctx.font = '700 8px Segoe UI, system-ui, sans-serif';
      ctx.fillStyle = seen ? rgba(en.col, 0.85) : '#475569';
      ctx.fillText(seen ? (kind === 'm' ? 'PAYLOAD' : kind === 'b' ? 'VOLUME' : 'READING')
                        : '———', r.x + r.w / 2, r.y + 16);
      ctx.font = '700 11px Segoe UI, system-ui, sans-serif';
      ctx.fillStyle = seen ? '#e2e8f0' : '#475569';
      const nm = seen ? clipText(en.n, kind === 'z' ? 13 : 20) : '? ? ?';
      ctx.fillText(nm, r.x + r.w / 2, r.y + r.h / 2 + 4);
      if (seen && en.sub) {
        ctx.font = '500 8px Segoe UI, system-ui, sans-serif';
        ctx.fillStyle = '#475569';
        ctx.fillText(clipText(en.sub, 30), r.x + r.w / 2, r.y + r.h - 12);
      }
    }

    // a tick in the margin where he had something to say about this one
    if (worn && seen && KEEPER_NOTES[codexNoteKey(en)]) {
      ctx.save();
      ctx.strokeStyle = INK; ctx.lineWidth = 1.8; ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.moveTo(r.x + 6, r.y + 9);
      ctx.lineTo(r.x + 10, r.y + 15);
      ctx.lineTo(r.x + 17, r.y + 5);
      ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();

  // scrollbar, only when there is something to scroll
  const ms = codexMaxScroll();
  if (ms > 0) {
    const trackX = g.x0 + g.cw * g.cols + 10;
    const th = g.viewH * (g.viewH / (g.viewH + ms));
    const ty = g.clipY + (g.viewH - th) * (codexScroll / ms);
    ctx.fillStyle = 'rgba(148,163,184,0.12)';
    roundRect(trackX, g.clipY, 4, g.viewH, 2); ctx.fill();
    ctx.fillStyle = 'rgba(148,163,184,0.45)';
    roundRect(trackX, ty, 4, th, 2); ctx.fill();
  }

  // detail panel
  const en = list[codexSel];
  if (en) {
    const seen = codexSeen(en);
    const dy = H - (worn ? 132 : 108);
    const kind = CODEX_TABS[codexTab].id;
    ctx.textAlign = 'center';
    ctx.font = '800 20px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = !seen ? '#475569' : (kind === 'u' ? RARITY[en.rar] : en.col);
    ctx.fillText(seen ? (kind === 'u' ? upName(en.up) : en.n)
                      : 'NOT YET ENCOUNTERED', W / 2, dy);
    ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
    if (kind === 'e' && en.boss) {
      ctx.fillStyle = '#7f1d1d';
      ctx.fillText('BOSS', W / 2, dy - 20);
    } else if (seen && kind === 'u') {
      ctx.fillStyle = '#475569';
      ctx.fillText(en.rar.toUpperCase() + '   ·   UP TO ' + en.max, W / 2, dy - 20);
    } else if (seen && en.sub) {
      ctx.fillStyle = '#475569';
      ctx.fillText(en.sub, W / 2, dy - 20);
    }

    ctx.font = '400 12px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = seen ? '#94a3b8' : '#334155';
    const own = kind === 'm' ? 'Install one and it will be recorded here.'
              : kind === 'b' ? 'Carry one and it will be recorded here.'
              : kind === 'z' ? 'Accept one and it will be recorded here.'
              : 'Meet it once and it will be recorded here.';
    const text = seen ? (kind === 'u' ? upDesc(en.up) : en.d) : own;
    // zodiac entries carry flavour and effect on separate lines
    let endY = dy + 24;
    for (const para of String(text).split('\n')) {
      endY = wrapText(para, W / 2, endY, Math.min(700, W - 80), 17) + 17;
    }
    endY -= 17;

    // his hand, under the printed entry, at the angle of somebody writing fast
    const note = worn && seen && KEEPER_NOTES[codexNoteKey(en)];
    if (note) {
      ctx.save();
      ctx.translate(W / 2, endY + 26);
      ctx.rotate(-0.022);
      ctx.font = INK_FONT;
      ctx.fillStyle = INK;
      ctx.globalAlpha = 0.92;
      ctx.fillText('— ' + note, 0, 0);
      // the underline he puts through his own sentences
      const nw = ctx.measureText('— ' + note).width;
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = INK; ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(-nw / 2, 7); ctx.lineTo(nw / 2 - 4, 8.5);
      ctx.stroke();
      ctx.restore();
    }
  }

  ctx.font = '500 10px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = worn ? '#4a3d2c' : '#334155';
  ctx.fillText('TAB / Q E section  ·  ARROWS / WHEEL browse  ·  ESC close', W / 2, H - 18);
  ctx.textBaseline = 'alphabetic';
}

function openCodex(from) {
  codexFrom = from || 'menu';
  codexTab = 0; codexSel = 0; codexScroll = 0;
  state = 'codex'; uiArm = 0.3;
  Audio_.select();
}
function closeCodex() {
  state = codexFrom === 'pause' ? 'pause' : 'menu';
  uiArm = 0.3;
  Audio_.select();
}
// keep the selected cell inside the viewport when moving by keyboard
function codexReveal() {
  const g = codexGeom();
  const row = Math.floor(codexSel / g.cols);
  const top = row * g.ch, bot = top + g.ch;
  if (top < codexScroll) codexScroll = top;
  else if (bot > codexScroll + g.viewH) codexScroll = bot - g.viewH;
  codexScroll = clamp(codexScroll, 0, codexMaxScroll());
}

/* A die in its package: dark silicon, traces running out to the pins, and a
   core that pulses like something is executing on it that should not be. */
function drawMalChip(x, y, s, col) {
  const t = uiTime;
  ctx.save();
  ctx.translate(x, y);

  const pins = 7, pl = s * 0.3, pw = s * 0.11, span = s * 1.28;
  const pinY = i => -span / 2 + (i + 0.5) * (span / pins);

  // legs, then hot tips travelling down them
  ctx.fillStyle = '#78350f';
  for (let i = 0; i < pins; i++) {
    ctx.fillRect(-s - pl, pinY(i) - pw / 2, pl, pw);
    ctx.fillRect(s, pinY(i) - pw / 2, pl, pw);
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < pins; i++) {
    const on = 0.2 + 0.8 * Math.max(0, Math.sin(t * 5 + i * 1.6));
    ctx.fillStyle = rgba(col, 0.75 * on);
    ctx.fillRect(-s - pl, pinY(i) - pw / 2, pl * 0.55, pw);
    ctx.fillRect(s + pl * 0.45, pinY(i) - pw / 2, pl * 0.55, pw);
  }
  ctx.restore();

  // package
  roundRect(-s, -s * 0.76, s * 2, s * 1.52, s * 0.1);
  ctx.fillStyle = '#17060a'; ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 2.4; ctx.stroke();
  roundRect(-s * 0.94, -s * 0.7, s * 1.88, s * 1.4, s * 0.08);
  ctx.strokeStyle = rgba(col, 0.28); ctx.lineWidth = 1; ctx.stroke();

  // orientation notch, so it reads as a real part
  ctx.beginPath();
  ctx.arc(-s, 0, s * 0.14, -Math.PI / 2, Math.PI / 2);
  ctx.fillStyle = '#2a0a10'; ctx.fill();
  ctx.strokeStyle = rgba(col, 0.75); ctx.lineWidth = 1.4; ctx.stroke();

  // the die
  roundRect(-s * 0.58, -s * 0.44, s * 1.16, s * 0.88, s * 0.04);
  ctx.fillStyle = '#2b0b12'; ctx.fill();
  ctx.strokeStyle = rgba(col, 0.55); ctx.lineWidth = 1; ctx.stroke();

  // etched traces, with a charge running out along one of them
  ctx.save();
  roundRect(-s * 0.58, -s * 0.44, s * 1.16, s * 0.88, s * 0.04); ctx.clip();
  ctx.strokeStyle = rgba(col, 0.34); ctx.lineWidth = 1;
  for (let i = 0; i < 7; i++) {
    const yy = -s * 0.36 + i * s * 0.12;
    ctx.beginPath();
    ctx.moveTo(-s * 0.58, yy);
    ctx.lineTo(-s * 0.2 + (i % 3) * s * 0.1, yy);
    ctx.lineTo(-s * 0.2 + (i % 3) * s * 0.1, yy + s * 0.07);
    ctx.lineTo(s * 0.58, yy + s * 0.07);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    const lane = (Math.floor(t * 1.3) + i * 2) % 7;
    const yy = -s * 0.36 + lane * s * 0.12;
    const p = ((t * 1.3 + i * 0.33) % 1);
    const px = -s * 0.58 + p * s * 1.16;
    ctx.fillStyle = rgba('#fecaca', 0.85);
    ctx.fillRect(px, yy + s * 0.035 - 1, s * 0.1, 2);
  }
  ctx.restore();

  // the core, executing
  const pulse = 0.55 + Math.sin(t * 6) * 0.45;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(0, 0, s * (0.7 + pulse * 0.35), col, 0.55);
  ctx.restore();
  ctx.fillStyle = rgba(col, 0.25 + pulse * 0.3);
  ctx.strokeStyle = '#fecaca'; ctx.lineWidth = 1.6;
  roundRect(-s * 0.17, -s * 0.17, s * 0.34, s * 0.34, s * 0.03);
  ctx.fill(); ctx.stroke();

  ctx.restore();
}

/* ------------------------------ effects panel ------------------------------
   Shown once after an update that adds new effects, and from the pause menu
   any time. Costs are measured, not guessed, and shown so the choice is
   informed rather than trial and error.
--------------------------------------------------------------------------- */
let gfxSel = 0, gfxFirstRun = false, gfxReturn = 'play';

function openGfx(from) {
  gfxReturn = from || 'play';
  gfxSel = 0;
  state = 'gfx';
  uiArm = 0.25;
  Audio_.select();
}
function closeGfx() {
  fxSave();
  state = gfxReturn === 'pause' ? 'pause' : 'play';
  gfxFirstRun = false;
  uiArm = 0.2;
  Audio_.select();
}
function gfxToggle(i) {
  const r = FX_ROWS[i];
  if (!r) return;
  FXO[r.k] = FXO[r.k] ? 0 : 1;
  fxLevel = (FXO.bloom || FXO.aber || FXO.film) ? FX.ON : FX.OFF;
  Audio_.tone(FXO[r.k] ? 620 : 300, 0.05, 'square', 0.05, 900);
}

function gfxRects() {
  const w = Math.min(560, W - 60), x = (W - w) / 2;
  const top = Math.max(96, H / 2 - 220);
  const rows = FX_ROWS.map((r, i) => ({ x, y: top + 62 + i * 34, w, h: 30, i }));
  const by = top + 62 + FX_ROWS.length * 34 + 16;
  const bw = (w - 20) / 3;
  return { rows, w, x, top,
    presets: [
      { x, y: by, w: bw, h: 34, lvl: 2, n: 'EVERYTHING' },
      { x: x + bw + 10, y: by, w: bw, h: 34, lvl: 1, n: 'BALANCED' },
      { x: x + (bw + 10) * 2, y: by, w: bw, h: 34, lvl: 0, n: 'FASTEST' }
    ],
    done: { x: x + w / 2 - 80, y: by + 74, w: 160, h: 38 } };
}

function drawGfx() {
  ctx.fillStyle = 'rgba(4,6,12,0.93)';
  ctx.fillRect(0, 0, W, H);
  const g = gfxRects();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  ctx.font = '800 24px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = COL.player;
  ctx.fillText(gfxFirstRun ? 'NEW EFFECTS ADDED' : 'EFFECTS', W / 2, g.top + 10);
  ctx.font = '500 12px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(gfxFirstRun
    ? 'Turn off anything your machine would rather not draw.'
    : 'Costs are per frame on a busy boss screen.', W / 2, g.top + 34);

  let total = 0;
  for (const r of FX_ROWS) if (FXO[r.k]) total += r.cost;

  ctx.textAlign = 'left';
  for (const box of g.rows) {
    const r = FX_ROWS[box.i], on = !!FXO[r.k];
    const hot = inRect(mouse.x, mouse.y, box) || gfxSel === box.i;
    ctx.fillStyle = hot ? 'rgba(103,232,249,0.10)' : 'rgba(255,255,255,0.03)';
    roundRect(box.x, box.y, box.w, box.h, 6); ctx.fill();
    if (hot) {
      ctx.strokeStyle = rgba(COL.player, 0.5); ctx.lineWidth = 1.4;
      roundRect(box.x, box.y, box.w, box.h, 6); ctx.stroke();
    }
    // switch
    const sx = box.x + 12, sy = box.y + box.h / 2;
    ctx.fillStyle = on ? COL.player : '#334155';
    roundRect(sx, sy - 7, 30, 14, 7); ctx.fill();
    ctx.fillStyle = on ? '#062f36' : '#94a3b8';
    ctx.beginPath(); ctx.arc(sx + (on ? 22 : 8), sy, 5, 0, TAU); ctx.fill();

    ctx.font = '700 13px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = on ? '#e2e8f0' : '#64748b';
    ctx.fillText(r.n, box.x + 54, sy);
    ctx.font = '400 11px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.fillText(r.d, box.x + 176, sy);
    ctx.textAlign = 'right';
    ctx.font = '600 11px ui-monospace, Consolas, monospace';
    ctx.fillStyle = r.cost >= 4 ? '#f87171' : r.cost >= 2 ? '#fbbf24' : '#4ade80';
    ctx.fillText(r.cost.toFixed(1) + ' ms', box.x + box.w - 12, sy);
    ctx.textAlign = 'left';
  }

  ctx.textAlign = 'center';
  for (const b of g.presets) {
    const hot = inRect(mouse.x, mouse.y, b);
    ctx.fillStyle = hot ? 'rgba(103,232,249,0.16)' : 'rgba(255,255,255,0.05)';
    roundRect(b.x, b.y, b.w, b.h, 7); ctx.fill();
    ctx.strokeStyle = rgba(COL.player, hot ? 0.7 : 0.28); ctx.lineWidth = 1.4;
    roundRect(b.x, b.y, b.w, b.h, 7); ctx.stroke();
    ctx.font = '700 12px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = hot ? '#e2e8f0' : '#94a3b8';
    ctx.fillText(b.n, b.x + b.w / 2, b.y + b.h / 2);
  }

  // what it all adds up to, against the frame you actually have
  ctx.font = '600 11px ui-monospace, Consolas, monospace';
  ctx.fillStyle = total > 12 ? '#f87171' : total > 7 ? '#fbbf24' : '#4ade80';
  ctx.fillText('≈ ' + total.toFixed(1) + ' ms of a 16.7 ms frame',
               W / 2, g.presets[0].y + 52);

  const d = g.done, dh = inRect(mouse.x, mouse.y, d);
  ctx.fillStyle = dh ? 'rgba(103,232,249,0.22)' : 'rgba(103,232,249,0.10)';
  roundRect(d.x, d.y, d.w, d.h, 8); ctx.fill();
  ctx.strokeStyle = COL.player; ctx.lineWidth = 1.8;
  roundRect(d.x, d.y, d.w, d.h, 8); ctx.stroke();
  ctx.font = '800 14px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = COL.player;
  ctx.fillText('DONE   [G]', d.x + d.w / 2, d.y + d.h / 2);
  ctx.textBaseline = 'alphabetic';
}

function drawMalware() {
  const m = malwareOffer;
  if (!m) return;
  ctx.fillStyle = 'rgba(10,2,3,0.94)';
  ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  // scan lines and drifting hex, like something running where it shouldn't
  ctx.save();
  ctx.globalAlpha = 0.08;
  ctx.strokeStyle = MAL_COL; ctx.lineWidth = 1;
  for (let y = (uiTime * 40) % 6; y < H; y += 6) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.globalAlpha = 0.13;
  ctx.font = '600 11px ui-monospace, Consolas, monospace';
  ctx.fillStyle = MAL_COL;
  for (let r = 0; r < 14; r++) {
    const yy = ((r * 47 + uiTime * 26) % (H + 40)) - 20;
    let s = '';
    for (let c = 0; c < 46; c++) s += ((r * 7 + c * 13 + (r ^ c)) % 16).toString(16);
    ctx.fillText(s, cx, yy);
  }
  ctx.restore();

  ctx.font = '700 11px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#7f1d1d';
  ctx.fillText('M A L W A R E', cx, cy - 168);
  ctx.font = '600 11px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.fillText('OVERWRITES YOUR DASH', cx, cy - 148);

  // the payload, sitting on the board it is about to ruin
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(cx, cy - 74, 96, '#7f1d1d', 0.4);
  // board traces running away from the socket
  ctx.strokeStyle = rgba(MAL_COL, 0.20); ctx.lineWidth = 1.4;
  for (let i = 0; i < 10; i++) {
    const a = i * TAU / 10 + uiTime * 0.06, r0 = 62, r1 = 150 + (i % 3) * 26;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r0, cy - 74 + Math.sin(a) * r0 * 0.7);
    ctx.lineTo(cx + Math.cos(a) * r1, cy - 74 + Math.sin(a) * r1 * 0.7);
    ctx.stroke();
  }
  ctx.restore();
  drawMalChip(cx, cy - 74, 54, m.col);

  ctx.font = '800 26px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = m.col;
  ctx.fillText(m.n, cx, cy - 8);

  ctx.font = '400 13px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  wrapText(m.d, cx, cy + 26, Math.min(520, W - 70), 19);

  if (P.malware) {
    ctx.font = '600 11px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#7f1d1d';
    ctx.fillText('replaces ' + P.malware.n, cx, cy + 104);
  }

  const b = libraryButtons();
  const drawBtn = (r, label, col, on) => {
    ctx.save();
    ctx.globalAlpha = on ? 1 : 0.72;
    ctx.fillStyle = rgba(col, on ? 0.2 : 0.08);
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    roundRect(r.x, r.y, r.w, r.h, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = col;
    ctx.font = '700 13px Segoe UI, system-ui, sans-serif';
    ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 1);
    ctx.restore();
  };
  drawBtn(b.take, 'INSTALL   [E]', m.col, inRect(mouse.x, mouse.y, b.take));
  drawBtn(b.leave, 'LEAVE IT   [Q]', '#64748b', inRect(mouse.x, mouse.y, b.leave));
  ctx.textBaseline = 'alphabetic';
}

function drawLibrary() {
  if (malwareOffer) return drawMalware();
  const bk = libraryBook;
  if (!bk) return;
  ctx.fillStyle = 'rgba(6,4,2,0.93)';
  ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  // shelves receding into the dark
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.strokeStyle = '#a16207'; ctx.lineWidth = 2;
  for (let r = 0; r < 5; r++) {
    const yy = cy - 190 + r * 96;
    ctx.beginPath(); ctx.moveTo(40, yy); ctx.lineTo(W - 40, yy); ctx.stroke();
    for (let c = 0; c < 26; c++) {
      const bx = 46 + c * ((W - 92) / 26) + Math.sin(c * 3.1 + r) * 3;
      const bh2 = 26 + ((c * 7 + r * 13) % 22);
      ctx.strokeRect(bx, yy - bh2, 7, bh2);
    }
  }
  ctx.restore();

  ctx.font = '700 11px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#a16207';
  ctx.fillText('L I B R A R Y', cx, cy - 168);
  ctx.font = '600 11px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.fillText('WRITTEN FROM ' + bk.from, cx, cy - 148);

  // the bookkeeper, off to the side of the shelf, waiting as he always is
  const kx = Math.max(96, cx - Math.min(300, W * 0.33));
  drawKeeperNPC(kx, cy - 40, 42);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = keeperWants() ? KEEPER_COL : '#78716c';
  ctx.fillText('THE BOOKKEEPER', kx, cy + 34);
  ctx.font = '400 11px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = keeperWants() ? '#fde68a' : '#64748b';
  wrapText('“' + keeperLine() + '”', kx, cy + 56, 210, 15);
  ctx.restore();

  // the book itself
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(cx, cy - 62, 92, bk.col, 0.4 + Math.sin(uiTime * 2.4) * 0.1);
  ctx.restore();
  ctx.save();
  ctx.translate(cx, cy - 62);
  ctx.rotate(Math.sin(uiTime * 1.1) * 0.05);
  ctx.strokeStyle = bk.col; ctx.lineWidth = 3;
  ctx.fillStyle = rgba(bk.col, 0.16);
  ctx.beginPath();
  ctx.moveTo(-46, 30); ctx.quadraticCurveTo(0, 14, 0, 24);
  ctx.quadraticCurveTo(0, 14, 46, 30);
  ctx.lineTo(46, -24); ctx.quadraticCurveTo(0, -40, 0, -30);
  ctx.quadraticCurveTo(0, -40, -46, -24);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = rgba(bk.col, 0.5); ctx.lineWidth = 1.2;
  for (let k = 1; k <= 4; k++) {
    const yy = -18 + k * 9;
    ctx.beginPath(); ctx.moveTo(-36, yy); ctx.lineTo(-8, yy - 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8, yy - 3); ctx.lineTo(36, yy); ctx.stroke();
  }
  ctx.restore();

  ctx.font = '800 26px Segoe UI, system-ui, sans-serif';
  ctx.save();
  ctx.shadowColor = bk.col; ctx.shadowBlur = 22;
  ctx.fillStyle = '#f8fafc';
  ctx.fillText(bk.n, cx, cy + 22);
  ctx.restore();

  ctx.font = '400 13px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  wrapText(bk.d, cx, cy + 52, Math.min(460, W - 70), 18);

  ctx.font = '700 12px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = bk.col;
  ctx.fillText('BOUND TO  [ Q ]   ·   CHARGES OVER ' + bk.cost + ' WAVE' +
               (bk.cost === 1 ? '' : 'S'), cx, cy + 100);

  if (P.book && P.book.id !== bk.id) {
    ctx.font = '600 11px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#f87171';
    ctx.fillText('replaces ' + P.book.n, cx, cy + 118);
  }

  const b = libraryButtons();
  drawButton(b.take, 'TAKE IT  [E]', true, bk.col);
  drawButton(b.leave, 'LEAVE  [ESC]', true, '#64748b');
  if (b.hand || b.talk) {
    const pulse = 0.7 + Math.sin(uiTime * 4) * 0.3;
    ctx.save();
    ctx.globalAlpha = pulse;
    if (b.hand) drawButton(b.hand, 'HAND HIM THE CODEX  [F]', true, KEEPER_COL);
    else drawButton(b.talk, 'HE WANTS A WORD  [F]', true, UNW_COL);
    ctx.restore();
  }

  ctx.textAlign = 'center';
  ctx.font = '500 10px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#3f3f46';
  ctx.fillText(b.hand ? 'he has been waiting for a complete record'
             : b.talk ? 'every section is filled, and he has noticed'
                      : 'you may only carry one book at a time', cx, H - 26);
}

/* ------------------------------ planetarium UI ----------------------------- */
function planetButtons() {
  const bw = Math.min(180, W * 0.32), bh = 38;
  const y = H / 2 + 142;
  return planetRevealed
    ? { accept: { x: -999, y: -999, w: 0, h: 0 },
        leave:  { x: W / 2 - bw / 2, y, w: bw, h: bh } }
    : { accept: { x: W / 2 - bw - 8, y, w: bw, h: bh },
        leave:  { x: W / 2 + 8,      y, w: bw, h: bh } };
}

// deterministic star field per sign, so a constellation always looks the same
function constellation(seed, n) {
  let s = seed >>> 0;
  const rnd_ = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  const pts = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    pts.push([ (0.12 + t * 0.76) + (rnd_() - 0.5) * 0.16,
               0.5 + Math.sin(t * Math.PI * (1 + rnd_())) * 0.32 + (rnd_() - 0.5) * 0.12,
               0.5 + rnd_() * 0.9 ]);
  }
  return pts;
}

function drawPlanetarium() {
  const sign = planetSign;
  if (!sign) return;
  const gold = '#fbbf24', purple = '#a855f7';
  const accent = planetRevealed ? (sign.good ? gold : purple) : '#c4b5fd';

  ctx.fillStyle = 'rgba(2,3,8,0.93)';
  ctx.fillRect(0, 0, W, H);

  // drifting starfield backdrop
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 70; i++) {
    const a = i * 2.399 + uiTime * 0.04;
    const r = ((i * 37) % 100) / 100;
    const x = W / 2 + Math.cos(a) * r * W * 0.62;
    const y = H / 2 + Math.sin(a) * r * H * 0.58;
    const tw = 0.25 + 0.75 * Math.abs(Math.sin(uiTime * 1.1 + i));
    drawGlow(x, y, 2 + (i % 3), '#93c5fd', 0.1 + tw * 0.14);
  }
  ctx.restore();

  const cx = W / 2, cy = H / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = '700 11px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.fillText('P L A N E T A R I U M', cx, cy - 176);

  // constellation panel
  const pw = Math.min(400, W - 70), ph = 116;
  const px = cx - pw / 2, py = cy - 158;
  const pts = constellation(sign.seed, 7);
  ctx.save();
  ctx.strokeStyle = rgba(accent, 0.35);
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  pts.forEach((p, i) => {
    const x = px + p[0] * pw, y = py + p[1] * ph;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
  ctx.globalCompositeOperation = 'lighter';
  pts.forEach((p, i) => {
    const x = px + p[0] * pw, y = py + p[1] * ph;
    const tw = 0.6 + 0.4 * Math.sin(uiTime * 2 + i * 1.7);
    drawGlow(x, y, (6 + p[2] * 9) * tw, accent, 0.75);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x, y, 1.4 + p[2], 0, TAU); ctx.fill();
  });
  ctx.restore();

  ctx.font = '800 38px Segoe UI, system-ui, sans-serif';
  ctx.save();
  ctx.shadowColor = accent; ctx.shadowBlur = 26;
  ctx.fillStyle = '#f8fafc';
  ctx.fillText(sign.n, cx, cy - 6);
  ctx.restore();

  ctx.font = '600 12px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = accent;
  ctx.fillText(sign.t.toUpperCase(), cx, cy + 22);

  ctx.font = '400 13px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  wrapText(sign.flavour, cx, cy + 50, Math.min(430, W - 60), 18);

  if (!planetRevealed) {
    ctx.font = '600 11px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#475569';
    ctx.fillText('the reading is free — but it is not shown until it is taken',
      cx, cy + 92);
  } else {
    // effect strings read "NAME — what it does"; split so the long half wraps
    const half = planetMsg.split(' — ');
    ctx.font = '800 14px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = sign.good ? gold : purple;
    ctx.fillText((sign.good ? 'BLESSING   ·   ' : 'CURSE   ·   ') + half[0], cx, cy + 86);
    if (half[1]) {
      ctx.font = '400 12px Segoe UI, system-ui, sans-serif';
      ctx.fillStyle = '#94a3b8';
      wrapText(half[1], cx, cy + 107, Math.min(420, W - 70), 15);
    }
  }

  const b = planetButtons();
  if (!planetRevealed) {
    drawButton(b.accept, 'ACCEPT  [A]', true, COL.hp);
    drawButton(b.leave, 'WALK AWAY  [D]', true, '#64748b');
  } else {
    drawButton(b.leave, 'CONTINUE  ▸', true, COL.hp);
  }

  ctx.textAlign = 'center';
  ctx.font = '500 10px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#334155';
  ctx.fillText('every reading is either extraordinary or ruinous — never both, never neither',
    cx, H - 26);
}

function drawNameEntry() {
  ctx.fillStyle = 'rgba(3,5,10,0.88)';
  ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = '800 13px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = COL.player;
  ctx.fillText('GLOBAL LEADERBOARD', cx, cy - 96);
  ctx.font = '800 32px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#f1f5f9';
  ctx.fillText('CHOOSE A CALLSIGN', cx, cy - 62);

  // input field
  const fw = Math.min(360, W - 80), fh = 52;
  const fx = cx - fw / 2, fy = cy - 22;
  ctx.fillStyle = 'rgba(12,18,30,0.96)';
  roundRect(fx, fy, fw, fh, 12); ctx.fill();
  ctx.strokeStyle = rgba(COL.player, 0.6); ctx.lineWidth = 2;
  roundRect(fx, fy, fw, fh, 12); ctx.stroke();

  ctx.font = '700 22px Segoe UI, system-ui, sans-serif';
  const shown = nameBuf || '';
  const caret = Math.floor(uiTime * 2) % 2 ? '|' : ' ';
  ctx.fillStyle = shown ? '#f8fafc' : '#334155';
  ctx.fillText(shown ? shown + caret : (isTouch ? 'TAP TO ENTER NAME' : 'type a name' + caret),
    cx, fy + fh / 2 + 1);

  ctx.font = '500 11px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#475569';
  ctx.fillText(`${shown.length}/${NAME_MAX}   ·   letters, numbers, . _ -`, cx, fy + fh + 20);

  ctx.font = '600 12px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = nameBuf.trim() ? COL.hp : '#334155';
  ctx.fillText(isTouch ? 'TAP THE FIELD TO TYPE' : 'ENTER TO CONFIRM', cx, fy + fh + 52);

  if (Save.profile.name) {
    ctx.font = '500 10px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#334155';
    ctx.fillText('ESC TO KEEP ' + Save.profile.name.toUpperCase(), cx, fy + fh + 74);
  }

  ctx.font = '500 10px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#334155';
  ctx.fillText('anyone can pick any name — scores are not verified', cx, H - 34);
}

function drawTouchSticks() {
  const drawStick = (s, col) => {
    if (!s) return;
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(s.ox, s.oy, 58, 0, TAU); ctx.stroke();
    const dx = s.x - s.ox, dy = s.y - s.oy, d = len(dx, dy);
    const m = d > 58 ? 58 / d : 1;
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(s.ox + dx * m, s.oy + dy * m, 22, 0, TAU); ctx.fill();
    ctx.restore();
  };
  drawStick(touchUI.move, COL.player);
  drawStick(touchUI.aim, '#f472b6');
}

/* Build every glow sprite up front. Each new colour costs a canvas plus a
   radial gradient on first use, and doing that lazily produced a visible
   hitch the first time a sector introduced unfamiliar colours. */
function prewarmGlow() {
  const cols = new Set();
  const add = c => { if (typeof c === 'string' && c[0] === '#') cols.add(c); };
  for (const k in COL) add(COL[k]);
  for (const k in RARITY) add(RARITY[k]);
  for (const k in ETYPE) add(ETYPE[k].col);
  for (const k in BOSSES) add(BOSSES[k].col);
  for (const s of STAGES.concat(ALT_STAGES)) { add(s.accent); add(s.wall); }
  ('#fbbf24 #a855f7 #fb923c #a3e635 #38bdf8 #5eead4 #a5f3fc #c4b5fd #e2e8f0 #f87171 ' +
   '#93c5fd #7dd3fc #a78bfa #fcd34d #f0abfc #6ee7b7 #fde047 #ef4444 #cffafe #99f6e4 ' +
   '#bae6fd #f5d0fe #ddd6fe #fed7aa #fecdd3 #bfdbfe #f1f5f9 #f8fafc #fecaca #fef08a')
    .split(' ').forEach(add);
  cols.forEach(glowSprite);
  return cols.size;
}

/* --------------------------------- start ---------------------------------- */
prewarmGlow();
Save.init();
cam.x = P.x; cam.y = P.y;
requestAnimationFrame(frame);
</script>
