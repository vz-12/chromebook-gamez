  'Take the forge. Take the heart straight out of it.',
  'She had children. They are arms now. Say thank you.',
  'The archivist kept records. It can keep score instead.',
  'The curator arranged things. Let it arrange itself.',
  'And the one that held no ink — that is the spine. ' +
  'I hope it was worth nine minutes.',
  'THERE.',
  'Is that ENOUGH?'
];

/* devTalkT is the beat between the banner and him speaking; devTalkSaidNo is
   per-run, so declining quiets him now without closing the door. */
let devTalkT = 3.2, devTalkSaidNo = false;

function startDevTalk() {
  devLine = 0; devAsk = false; devType = 0; devOut = 0;
  enemies.length = 0; ebullets.length = 0;
  state = 'devtalk'; uiArm = 0.4;
  Audio_.select();
}

function devAdvance() {
  if (uiArm > 0 || devAsk || devOut > 0) return;
  if (!devTyped()) { devType = 1e9; return; }   // first press finishes the line
  devOut = 1;
  uiArm = 0.16;
  Audio_.tone(420, 0.04, 'sine', 0.03, 600);
}

function devAnswer(yes) {
  if (!devAsk || uiArm > 0) return;
  if (!yes) {
    /* He drops it for this run only. The flag stays on the profile, so he
       raises it again another time rather than the amalgam being lost for
       saying no once. */
    devTalkSaidNo = true;
    state = 'play';
    uiArm = 0.3;
    banner('HE GOES QUIET', '#64748b', 4.0);
    Audio_.select();
    return;
  }
  Save.profile.askedHarder = true;
  Save.profile.devTalkDue = false;
  Save.writeLocal(); Save.flush();
  startAmalgamCut();
}

function devButtons() {
  const bw = Math.min(280, (W - 90) / 2), bh = 58;
  const y = H / 2 + 118;
  return { no:  { x: W / 2 - bw - 10, y, w: bw, h: bh },
           yes: { x: W / 2 + 10,      y, w: bw, h: bh } };
}

function drawDevTalk() {
  /* The room stays visible underneath. He is writing on it, not replacing it. */
  const vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.12,
                                       W / 2, H / 2, Math.max(W, H) * 0.7);
  vig.addColorStop(0, 'rgba(5,5,7,0.55)');
  vig.addColorStop(1, 'rgba(5,5,7,0.9)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  ctx.save();
  ctx.globalAlpha = devOut > 0 ? devOut : 1;      // the line wipes off
  ctx.font = '400 17px ui-monospace, Consolas, monospace';
  const maxW = Math.min(720, W - 100), lh = 27;
  const lines = wrapLines(devShown(), maxW);
  const top = cy - 40;
  // a faint under-glow, so it reads as burned onto the floor
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(226,232,240,0.09)';
  lines.forEach((s, i) => ctx.fillText(s, cx, top + i * lh));
  ctx.restore();
  ctx.fillStyle = DEV_COL;
  lines.forEach((s, i) => ctx.fillText(s, cx, top + i * lh));
  // the caret sits at the end of what has been written so far
  if (!devAsk && devOut <= 0) {
    const last = lines[lines.length - 1] || '';
    ctx.globalAlpha *= devTyped() ? 0.5 + Math.sin(uiTime * 3.6) * 0.5 : 1;
    ctx.fillRect(cx + ctx.measureText(last).width / 2 + 5,
                 top + (lines.length - 1) * lh - 9, 9, 18);
  }
  ctx.restore();

  if (!devAsk) {
    ctx.font = '600 11px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = rgba('#64748b', 0.5 + Math.sin(uiTime * 3.4) * 0.4);
    ctx.fillText('SPACE', cx, H - 56);
    ctx.font = '500 9px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#27272a';
    ctx.fillText((devLine + 1) + ' / ' + DEV_TALK.length, cx, H - 36);
    ctx.textBaseline = 'alphabetic';
    return;
  }

  ctx.font = '800 ' + Math.min(30, W * 0.031) + 'px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = '#f87171';
  ctx.fillText('Do you want something harder?', cx, cy + 66);

  const b = devButtons();
  const btn = (r, label, sub, col) => {
    const hot = inRect(mouse.x, mouse.y, r);
    ctx.save();
    ctx.fillStyle = rgba(col, hot ? 0.2 : 0.06);
    ctx.strokeStyle = col; ctx.lineWidth = hot ? 2.4 : 1.6;
    roundRect(r.x, r.y, r.w, r.h, 9); ctx.fill(); ctx.stroke();
    ctx.fillStyle = col;
    ctx.font = '800 15px Segoe UI, system-ui, sans-serif';
    ctx.fillText(label, r.x + r.w / 2, r.y + 23);
    ctx.font = '500 9px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#52525b';
    ctx.fillText(sub, r.x + r.w / 2, r.y + 43);
    ctx.restore();
  };
  btn(b.no, 'NO   [N]', 'that was enough', '#64748b');
  btn(b.yes, 'YES   [Y]', 'it is never enough', '#f87171');
  ctx.textBaseline = 'alphabetic';
}

/* Spawned outside the scripted path — the dev console, or any future caller —
   a lone body has no fight object, so bossUnwritten had nothing to drive and it
   sat there as an inert shape. Build the fight around whatever turned up:
   find its twin or create one, then adopt both. */
function unwAdopt(e) {
  let other = null;
  for (const z of enemies)
    if (z !== e && z.boss === 'unwritten' && !z.dead) { other = z; break; }
  if (!other) {
    const cx = (arena.x0 + arena.x1) / 2, cy = (arena.y0 + arena.y1) / 2;
    other = spawnEnemy('boss',
      clamp(2 * cx - e.x, arena.x0 + 90, arena.x1 - 90),
      clamp(2 * cy - e.y, arena.y0 + 90, arena.y1 - 90), { boss: 'unwritten' });
    if (!other) return false;
  }
  e.unwSide = -1; other.unwSide = 1;
  e.floor = 0; other.floor = 0;
  for (const z of [e, other]) { z.armor = 0; z.absorb = 0; z.dr = 0; }
  const deaths = Save.profile.unwrittenDeaths || 0;
  const pool = UNW_POOL * Math.max(0.35, 1 - deaths * UNW_ATTRITION);
  unwritten = { a: e, b: other, hp: pool, maxHp: pool, t: 0,
                aHitT: 0, bHitT: 0, pending: 0,
                tearT: 2.2, writeT: 6, ups: {}, atkT: 2.4, phase: 0 };
  e.maxHp = other.maxHp = pool; e.hp = other.hp = pool;
  unwTears = []; unwDeadT = 0;
  if (!unwSnap) unwSnap = snapPlayer();   // so a death here still has somewhere to rewind to
  bossAlive = true;
  banner('THE UNWRITTEN', UNW_COL, 3.0);
  ringFx(e.x, e.y, 20, 700, UNW_INK, 1.1, 8);
  return true;
}

// the boss shell calls this per body; the fight itself is driven by unwUpdate
function bossUnwritten(e, dt) {
  if (!unwritten && !unwAdopt(e)) return;
  if (e === unwritten.a) unwUpdate(dt);   // drive once, from the first body
}

function bossOtherFinale(e, dt) {
  e.invuln = 1;                                  // nothing you do lands now
  e.vuln = 1;
  steer(e, (WORLD.w / 2 - e.x) * 0.9, (WORLD.h / 2 - e.y) * 0.9, 1.3, dt);
  e.ang += dt * BOSS_SPIN;

  for (const h of hazards) {
    if (h.kind !== 'mirror' || !h.orbit) continue;
    h.oAng += dt * MIRROR_SPIN;                  // counter-rotating, fixed rate
    h.x = e.x + Math.cos(h.oAng) * h.oR;
    h.y = e.y + Math.sin(h.oAng) * h.oR;
  }

  e.hp -= dt;                                    // one per second, ten to live
  if (e.hp <= 0) {
    e.hp = 0; e.invuln = 0;
    finaleBeams.length = 0;
    // it lets go: every mirror is flung outward and buries itself in a wall.
    // In flight they are lethal outright; once embedded they are just scenery.
    for (const h of hazards) {
      if (h.kind !== 'mirror' || !h.orbit) continue;
      h.orbit = false;
      h.flying = true;
      const a = Math.atan2(h.y - e.y, h.x - e.x) + rnd(0.12, -0.12);
      h.vx = Math.cos(a) * 1550;
      h.vy = Math.sin(a) * 1550;
      h.rot = 0; h.spin = rnd(7, -7);
      ringFx(h.x, h.y, 6, h.r * 2.2, '#99f6e4', 0.4, 3);
    }
    drawFlashT = 0.24; shake(1.2);
    Audio_.boom(); Audio_.crit();
    banner('LET GO', '#5eead4', 2.0);
    killEnemy(e);
    return;
  }

  finaleBeams.length = 0;
  castFinale(e.x, e.y, e.ang, 0, 0);

  e.beamTick = (e.beamTick || 0) - dt;
  if (e.beamTick <= 0) {
    for (const bm of finaleBeams) {
      if (segCircle(bm.x1, bm.y1, bm.x2, bm.y2, P.x, P.y, bm.w * 0.5 + P.r)) {
        e.beamTick = 0.34;
        hurtPlayer(e.dmg * 0.85);
        break;
      }
    }
  }
  if (Math.random() < 0.6) {
    const a = rnd(TAU);
    spawnPart(e.x + Math.cos(a) * e.r, e.y + Math.sin(a) * e.r,
      Math.cos(a) * 120, Math.sin(a) * 120, rnd(4, 2), '#5eead4', rnd(0.5, 0.25), 0.94);
  }
  if (Math.random() < 0.25) shake(0.05);
}

function bossOther(e, dt, ux, uy, d, ph) {
  if (e.virus) return bossOtherVirus(e, dt);
  if (e.finale) return bossOtherFinale(e, dt);
  if (e.hp <= 10) {
    // Something else gets to it first, more often the more times you have won.
    const odds = 0.05 * (1 + (Save.profile.otherKills || 0));
    if (Math.random() < odds) startVirus(e); else startFinale(e);
    return;
  }

  /* Phase 3: it stops imitating. It knits itself back to full, grows legs,
     and abandons the mirror act for a straight blind charge that only ends
     against a wall — where the impact stuns it and hands you the window. */
  if (!e.awakened && e.hp / e.maxHp <= 0.33) {
    e.awakened = true;
    e.lockPhase = 2;            // never fall back through the HP gates again
    e.hp = e.maxHp;
    e.legs = 0; e.rage = -1; e.atkT = 2.4; e.invuln = 1;
    banner('IT STOPS PRETENDING', '#5eead4', 3.2);
    drawFlashT = 0.28; shake(1);
    Audio_.boss(); Audio_.hurt();
    ringFx(e.x, e.y, e.r, 440, '#5eead4', 1.0, 7);
    burst(e.x, e.y, 70, '#5eead4', 380, 4.4, 1.1);
    return;
  }
  if (e.awakened) return bossOtherRage(e, dt);

  e.ang = Math.atan2(P.y - e.y, P.x - e.x);

  // mirror your position through the arena centre, then close in
  const mx = WORLD.w - P.x, my = WORLD.h - P.y;
  const toMirror = ph === 0 ? 1 : 0.55;
  const tx = lerp(P.x - ux * 260, mx, toMirror);
  const ty = lerp(P.y - uy * 260, my, toMirror);
  steer(e, (tx - e.x) * 1.6, (ty - e.y) * 1.6, 1.6 + ph * 0.5, dt);

  // it shoots your gun back at you
  e.cd -= dt;
  const rate = clamp(P.fireRate * (0.30 + ph * 0.07), 0.7, 7);
  if (e.cd <= 0 && d < 900) {
    e.cd = 1 / rate;
    const n = clamp(P.count, 1, 5);
    const dmg = clamp(P.dmg * 0.16, e.dmg * 0.28, e.dmg * 1.1);
    for (let k = 0; k < n; k++)
      eshoot(e, e.ang + (k - (n - 1) / 2) * 0.13 + rnd(0.05, -0.05), 400, dmg, 6);
    if (P.sun) addHazard('fire', e.x, e.y, 2.2, { r: 60, dmg: e.dmg * 0.5 });
  }

  if (e.atkT > 0) return;
  const a = pick(ph === 0 ? [0, 1] : ph === 1 ? [0, 1, 2] : [0, 1, 2, 3]);
  e.atk = a;
  switch (a) {
    case 0: {                            // your dash, used against you
      const ang = Math.atan2(P.y - e.y, P.x - e.x);
      e.vx = Math.cos(ang) * 1100; e.vy = Math.sin(ang) * 1100;
      burst(e.x, e.y, 20, '#5eead4', 280, 3.4, 0.45);
      Audio_.dash();
      e.atkT = 1.1; break;
    }
    case 1: {                            // reflected volley
      const n = 9 + ph * 3, off = rnd(TAU);
      for (let k = 0; k < n; k++) eshoot(e, off + k * TAU / n, 260, e.dmg * 0.42, 6);
      e.atkT = 1.3; break;
    }
    case 2: {                            // it makes copies of itself
      for (let k = 0; k < 2; k++) {
        const ang = rnd(TAU);
        const s = spawnEnemy('mimic', e.x + Math.cos(ang) * 90, e.y + Math.sin(ang) * 90,
                             { elite: false });
        s.col = '#5eead4';
        ringFx(s.x, s.y, 4, 50, '#5eead4', 0.4, 2);
      }
      Audio_.tone(520, 0.3, 'square', 0.1, 1100);
      e.atkT = 1.6; break;
    }
    case 3: {                            // mirror prison: ring with one gap
      const gap = rnd(TAU), n = 34;
      for (let k = 0; k < n; k++) {
        const ang = k * TAU / n;
        const dA = Math.abs(((ang - gap + Math.PI) % TAU + TAU) % TAU - Math.PI);
        if (dA < 0.45) continue;
        eshoot(e, ang, 210, e.dmg * 0.4, 6);
      }
      e.atkT = 1.7; break;
    }
  }
}

/* THE OTHER, awakened. Four states on a loop:
     -1 growing legs (untouchable)   0 locking on
      1 blind charge (uncorrectable) 2 stunned against the wall (vulnerable)
   The charge angle is committed at the moment it launches and never updated,
   so it can be baited — step aside and it commits to the wall instead. */
function bossOtherRage(e, dt) {
  e.legs = Math.min(1, (e.legs || 0) + dt * 0.65);
  const scuttle = () => {
    if (Math.random() < 0.7)
      spawnPart(e.x + rnd(e.r, -e.r), e.y + rnd(e.r, -e.r),
        rnd(70, -70), rnd(70, -70), rnd(3.4, 1.6), '#5eead4', rnd(0.45, 0.2), 0.93);
  };

  if (e.rage === -1) {                       // transforming
    e.invuln = 1; e.vuln = 1;
    e.vx *= Math.pow(0.02, dt); e.vy *= Math.pow(0.02, dt);
    e.ang += dt * 6;
    scuttle();
    if (Math.random() < 0.25) shake(0.08);
    e.atkT -= dt;
    if (e.atkT <= 0) { e.rage = 0; e.invuln = 0; e.atkT = 0.55; }
    return;
  }

  if (e.rage === 0) {                        // winding up, still trackable
    e.invuln = 0; e.vuln = 1;
    e.vx *= Math.pow(0.08, dt); e.vy *= Math.pow(0.08, dt);
    e.ang = angLerp(e.ang, Math.atan2(P.y - e.y, P.x - e.x), 1 - Math.exp(-9 * dt));
    e.atkT -= dt;
    if (e.atkT <= 0) {
      e.rage = 1;
      e.chargeAng = e.ang;                   // committed here and never again
      Audio_.noise(0.5, 0.24, 3800, 300, 3);
      shake(0.35);
    }
    return;
  }

  if (e.rage === 1) {                        // blind charge
    e.vuln = 1;
    e.vx = Math.cos(e.chargeAng) * 1450;
    e.vy = Math.sin(e.chargeAng) * 1450;
    scuttle(); scuttle();
    const m = e.r + 3;
    if (e.x <= arena.x0 + m || e.x >= arena.x1 - m ||
        e.y <= arena.y0 + m || e.y >= arena.y1 - m) {
      e.rage = 2; e.atkT = 1.8;
      e.vx = -Math.cos(e.chargeAng) * 240;
      e.vy = -Math.sin(e.chargeAng) * 240;
      explode(e.x, e.y, 165, e.dmg * 0.85, '#5eead4', true);
      shake(1); drawFlashT = 0.18;
      for (let k = 0; k < 16; k++) eshoot(e, rnd(TAU), rnd(270, 150), e.dmg * 0.28, 6);
    }
    return;
  }

  // rage 2 — face-first into the wall, and open
  e.vuln = 2.2;                              // the reward for baiting it
  e.vx *= Math.pow(0.02, dt); e.vy *= Math.pow(0.02, dt);
  e.ang += dt * 1.2;
  if (Math.random() < 0.3)
    spawnPart(e.x + rnd(e.r, -e.r), e.y + rnd(e.r, -e.r), 0, rnd(-40, -80),
      3, '#fde047', 0.5, 0.94);
  e.atkT -= dt;
  if (e.atkT <= 0) { e.vuln = 1; e.rage = 0; e.atkT = 0.55; }
}

/* Shared timed-salvo action (atk 6): drip-feeds a rotating spiral without
   setTimeout, so it stays in lockstep with pause and the fixed timestep. */
function bossSalvo(e, dt) {
  e.salvoT -= dt;
  if (e.salvoT > 0) return;
  e.salvoT = 0.075;
  const arms = e.arms || 2;
  for (let k = 0; k < arms; k++)
    eshoot(e, e.ang * 2 + e.salvo * 0.35 + k * TAU / arms, 215, e.dmg * 0.38, 6);
  if (--e.salvo <= 0) { e.atk = -1; e.atkT = Math.min(e.atkT, 0.25); }
}

/* ------------------------------- hazards ---------------------------------
   Stage-flavoured terrain: burning ground, acid, eruption vents, sweeping
   lasers and gravity wells. All share one array and one update.
-------------------------------------------------------------------------- */
let playerChill = 0;
// Single source of truth for laser width: the drawn bloom and the damage test
// both use it, so a beam never hits wider than it looks.
const LASER_HALF = 30;

function addHazard(kind, x, y, life = 8, opts = {}) {
  // Evict the oldest *temporary* hazard. Plain shift() would happily delete a
  // stage's permanent vents or gravity wells once a trail starts spamming.
  if (hazards.length > 46) {
    const i = hazards.findIndex(h => h.life < 1e8);
    hazards.splice(i >= 0 ? i : 0, 1);
  }
  hazards.push({
    kind, x, y, life, max: life, t: 0, tick: 0, friendly: !!opts.friendly,
    r: opts.r || (kind === 'well' ? 240 : kind === 'vent' ? 74
       : kind === 'mirror' ? 58 : kind === 'delete' ? 105 : 76),
    ang: opts.ang !== undefined ? opts.ang : rnd(TAU),
    state: 0, cd: opts.cd !== undefined ? opts.cd : rnd(3.2, 1.2),
    dmg: opts.dmg || 9,
    col: opts.col || (kind === 'acid' ? '#4ade80' : kind === 'well' ? '#f0abfc'
       : kind === 'laser' ? '#a78bfa' : kind === 'current' ? '#67e8f9'
       : kind === 'delete' ? '#f87171' : kind === 'mirror' ? '#5eead4' : '#f97316')
  });
}

/* Mirrors are solid objects, not fields. Without this you could stand inside
   one and be untouchable: incoming fire reflects off the shell while your own
   shots spawn inside it and leave unobstructed. Circle-vs-circle resolve with
   the inward velocity cancelled, so you slide along the surface. */
function collideMirrors(o, r) {
  for (const h of hazards) {
    if (h.kind !== 'mirror' || h.flying) continue;
    const dx = o.x - h.x, dy = o.y - h.y;
    const min = h.r + r;
    const d = Math.hypot(dx, dy);
    if (d >= min) continue;
    if (d < 0.001) { o.x = h.x + min; continue; }
    const nx = dx / d, ny = dy / d;
    o.x = h.x + nx * min;
    o.y = h.y + ny * min;
    const dot = o.vx * nx + o.vy * ny;
    if (dot < 0) { o.vx -= dot * nx; o.vy -= dot * ny; }
  }
}

function updateHazards(dt) {
  for (let i = hazards.length - 1; i >= 0; i--) {
    // addHazard() can evict an entry while we are iterating
    if (i >= hazards.length) { i = hazards.length; continue; }
    const h = hazards[i];
    if (!h) continue;
    h.t += dt;
    if (h.kind !== 'vent' && h.kind !== 'well') {
      h.life -= dt;
      if (h.life <= 0) { hazards.splice(i, 1); continue; }
    }
    const pd = len(P.x - h.x, P.y - h.y);

    switch (h.kind) {
      case 'fire': {
        if (Math.random() < 0.5)
          spawnPart(h.x + rnd(h.r, -h.r) * 0.8, h.y + rnd(h.r, -h.r) * 0.8,
            rnd(14, -14), rnd(-20, -46), rnd(4, 2), '#fb923c', rnd(0.5, 0.25), 0.94);
        h.tick -= dt;
        if (h.tick <= 0) {
          h.tick = 0.45;
          if (h.friendly) {                       // player-laid napalm
            for (const en of enemies) {
              if (en.dead || en.phased || en.invuln) continue;
              if (len(en.x - h.x, en.y - h.y) < h.r + en.r)
                damageEnemy(en, h.dmg, false, h.x, h.y, { silent: true, noChain: true });
            }
          } else if (pd < h.r) hurtPlayer(h.dmg);
        }
        break;
      }
      case 'acid': {
        if (Math.random() < 0.35)
          spawnPart(h.x + rnd(h.r, -h.r) * 0.8, h.y + rnd(h.r, -h.r) * 0.8,
            rnd(10, -10), rnd(-8, -24), rnd(3.4, 1.6), '#4ade80', rnd(0.6, 0.3), 0.95);
        if (pd < h.r) {
          playerChill = Math.max(playerChill, 0.42);
          h.tick -= dt;
          if (h.tick <= 0) { h.tick = 0.6; hurtPlayer(h.dmg * 0.7); }
        }
        break;
      }
      case 'vent': {
        h.cd -= dt;
        if (h.state === 0 && h.cd <= 0) { h.state = 1; h.cd = 1.0; }        // telegraph
        else if (h.state === 1 && h.cd <= 0) {                              // erupt
          h.state = 2; h.cd = 0.45;
          explode(h.x, h.y, h.r, h.dmg * 1.6, '#fb923c', false);
          if (pd < h.r + P.r) hurtPlayer(h.dmg * 1.6);
        } else if (h.state === 2 && h.cd <= 0) { h.state = 0; h.cd = rnd(5.5, 3.0); }
        if (h.state === 1 && Math.random() < 0.5)
          spawnPart(h.x + rnd(30, -30), h.y + rnd(30, -30), 0, rnd(-40, -90), 3, '#fbbf24', 0.4, 0.94);
        break;
      }
      case 'laser': {
        // 1s of telegraph, then a lethal line across the whole arena
        if (h.t > 1.0 && h.state === 0) {
          h.state = 1;
          Audio_.noise(0.35, 0.2, 6000, 1200, 3);
          shake(0.25);
        }
        if (h.state === 1 && h.t < 1.55) {
          const dxl = Math.cos(h.ang), dyl = Math.sin(h.ang);
          const rel = (P.x - h.x) * -dyl + (P.y - h.y) * dxl;   // perpendicular distance
          if (Math.abs(rel) < LASER_HALF) hurtPlayer(h.dmg);
          for (const en of enemies) {
            if (en.dead || en.type === 'boss') continue;
            const r2 = (en.x - h.x) * -dyl + (en.y - h.y) * dxl;
            if (Math.abs(r2) < LASER_HALF + en.r * 0.5 && en.hitCd <= 0) {
              en.hitCd = 0.3;
              damageEnemy(en, h.dmg * 0.6, false, h.x, h.y, { silent: true });
            }
          }
        }
        break;
      }
      case 'current': {
        // AQUARIUS: charged water you leave behind — always friendly
        h.tick -= dt;
        if (h.tick <= 0) {
          h.tick = 0.22;
          for (const en of enemies) {
            if (en.dead || en.phased || en.invuln) continue;
            if (len(en.x - h.x, en.y - h.y) < h.r + en.r) {
              damageEnemy(en, h.dmg, false, h.x, h.y, { silent: true, noChain: true });
              if (Math.random() < 0.4)
                arcs.push({ x1: h.x, y1: h.y, x2: en.x, y2: en.y,
                            life: 0.12, max: 0.12, col: '#a5f3fc' });
            }
          }
        }
        break;
      }
      case 'mirror': {
        // Inert terrain, except while it is shrapnel. A mirror in flight goes
        // straight through a full set of shields; once it buries itself in a
        // wall it is safe to stand next to again.
        if (!h.flying) {
          if (h.embedded) {
            h.embT = (h.embT || 0) + dt;
            // the puncture keeps bleeding material into the room
            if (Math.random() < 0.45) {
              const a = rnd(TAU);
              spawnPart(h.x + Math.cos(a) * h.r * 0.75, h.y + Math.sin(a) * h.r * 0.75,
                (h.wallNx || 0) * rnd(75, 20) + rnd(36, -36),
                (h.wallNy || 0) * rnd(75, 20) + rnd(36, -36),
                rnd(3.2, 1.3), Math.random() < 0.45 ? '#ffffff' : '#99f6e4',
                rnd(0.85, 0.35), 0.95);
            }
          }
          break;
        }
        h.x += h.vx * dt; h.y += h.vy * dt;
        h.rot = (h.rot || 0) + (h.spin || 0) * dt;
        if (Math.random() < 0.8)
          spawnPart(h.x + rnd(h.r, -h.r) * 0.6, h.y + rnd(h.r, -h.r) * 0.6,
            rnd(60, -60), rnd(60, -60), rnd(4, 2), '#99f6e4', rnd(0.4, 0.2), 0.92);
        if (len(P.x - h.x, P.y - h.y) < h.r + P.r) {
          floatText(P.x, P.y - 34, 'SHATTERED', '#5eead4', 17);
          burst(P.x, P.y, 40, '#5eead4', 380, 4, 0.8);
          drawFlashT = 0.2; shake(0.9);
          hurtPlayer(1e9, { pure: true });     // bypasses shields entirely
        }
        const m = h.r * 0.55;
        if (h.x <= arena.x0 + m || h.x >= arena.x1 - m ||
            h.y <= arena.y0 + m || h.y >= arena.y1 - m) embedShard(h);
        break;
      }
      case 'delete': {
        // THE ARCHIVE: a band that blinks out of existence, taking you with it
        const on = (h.t % 2.2) > 1.2;
        h.state = on ? 1 : 0;
        if (on) {
          h.tick -= dt;
          if (h.tick <= 0 && pd < h.r) { h.tick = 0.4; hurtPlayer(h.dmg); }
          if (Math.random() < 0.5)
            spawnPart(h.x + rnd(h.r, -h.r) * 0.9, h.y + rnd(h.r, -h.r) * 0.9,
              0, rnd(20, -20), rnd(3, 1.5), '#f87171', 0.4, 0.94);
        }
        break;
      }
      case 'well': {
        // constant inward pull — fights your positioning rather than your HP
        if (pd < h.r && pd > 1) {
          const f = (1 - pd / h.r) * 300;
          P.vx += (h.x - P.x) / pd * f * dt;
          P.vy += (h.y - P.y) / pd * f * dt;
        }
        if (Math.random() < 0.4) {
          const a = rnd(TAU), rr = rnd(h.r, h.r * 0.4);
          spawnPart(h.x + Math.cos(a) * rr, h.y + Math.sin(a) * rr,
            -Math.cos(a) * 60, -Math.sin(a) * 60, 2.4, h.col, 0.6, 0.96);
        }
        break;
      }
    }
  }
}

/* Permanent per-stage fixtures, laid down whenever a stage begins. Vents and
   wells are fixtures; acid and lasers are transient and come from the ambient
   ticker below instead. */
function seedStageHazards() {
  hazards.length = 0;
  ambientT = 3;
  const k = stage.hazard;
  if (!k) return;
  const n = k === 'vent' ? 7 : k === 'well' ? 4 : k === 'delete' ? 6 : k === 'mirror' ? 5 : 0;
  for (let i = 0; i < n; i++) {
    let x, y, tries = 0;
    do {
      x = rnd(WORLD.w - 200, 200); y = rnd(WORLD.h - 200, 200);
    } while ((len(x - P.x, y - P.y) < 340 ||
              len(x - WORLD.w / 2, y - WORLD.h / 2) < 260) && ++tries < 24);
    addHazard(k, x, y, 1e9, { dmg: 10 + wave * 0.6 });
  }
}

/* Transient stage terrain: the hive keeps seeping acid, the vault keeps
   sweeping lasers, so those sectors stay hostile between boss fights. */
let ambientT = 0;
function updateStageAmbient(dt) {
  const k = stage.hazard;
  if (k !== 'acid' && k !== 'laser') return;
  ambientT -= dt;
  if (ambientT > 0) return;
  if (k === 'acid') {
    ambientT = rnd(4.6, 2.6);
    let x, y, tries = 0;
    do { x = rnd(WORLD.w - 160, 160); y = rnd(WORLD.h - 160, 160); }
    while (len(x - P.x, y - P.y) < 230 && ++tries < 16);
    addHazard('acid', x, y, rnd(11, 7), { dmg: 8 + wave * 0.35 });
  } else {
    ambientT = rnd(7.5, 4.5);
    addHazard('laser', clamp(P.x + rnd(320, -320), 80, WORLD.w - 80),
                       clamp(P.y + rnd(320, -320), 80, WORLD.h - 80), 2.0,
      { ang: rnd(TAU), dmg: 10 + wave * 0.45, col: stage.accent });
  }
}

/* --------------------------- mortars (telegraphed AoE) -------------------- */
function updateMortars(dt) {
  for (let i = mortars.length - 1; i >= 0; i--) {
    const m = mortars[i];
    m.t -= dt;
    if (m.t <= 0) {
      explode(m.x, m.y, m.r, m.dmg, m.col, false);
      if (len(P.x - m.x, P.y - m.y) < m.r + P.r) hurtPlayer(m.dmg);
      if (m.big) {
        const v = onScreen(m.x, m.y, m.r);
        shake(0.7 * v);
        if (v > 0) drawFlashT = Math.max(drawFlashT, 0.1 * v);
      }
      mortars.splice(i, 1);
    }
  }
}

/* ------------------------------- sentries --------------------------------- */
function updateSentries(dt) {
  for (let i = sentries.length - 1; i >= 0; i--) {
    const s = sentries[i];
    s.life -= dt;
    if (s.life <= 0) {
      burst(s.x, s.y, 12, COL.player, 190, 3, 0.4);
      sentries.splice(i, 1); continue;
    }
    s.cd -= dt;
    const t = nearestEnemy(s.x, s.y, 600);
    if (!t) continue;
    s.ang = angLerp(s.ang, Math.atan2(t.y - s.y, t.x - s.x), 1 - Math.exp(-10 * dt));
    if (s.cd <= 0) {
      s.cd = 0.3;
      bullets.push({
        x: s.x + Math.cos(s.ang) * 15, y: s.y + Math.sin(s.ang) * 15,
        vx: Math.cos(s.ang) * 780, vy: Math.sin(s.ang) * 780,
        r: 3.6, dmg: s.dmg, crit: false, pierce: 0, ric: 0, life: 0.85,
        hits: null, frag: 0, px: s.x, py: s.y, dist: 0
      });
      Audio_.tone(540, 0.05, 'square', 0.04, 250);
    }
  }
}

/* ------------------------------- the filing --------------------------------
   A ring that closes on the player and has to be shot open. If it reaches its
   minimum radius it detonates. Bullets crossing the ring damage it, which
   means firing outward is the escape — the opposite of the usual instinct. */
function updateCages(dt) {
  for (let i = cages.length - 1; i >= 0; i--) {
    const c = cages[i];
    c.t += dt;
    c.r = Math.max(c.min, c.r - 46 * dt);

    // bullets crossing the ring chew through it
    for (let b = bullets.length - 1; b >= 0; b--) {
      const bu = bullets[b];
      if (!bu.mine) continue;
      const dNow = len(bu.x - c.x, bu.y - c.y);
      const dPrev = len(bu.px - c.x, bu.py - c.y);
      if ((dPrev < c.r) !== (dNow < c.r)) {          // crossed the boundary
        c.hp -= bu.dmg;
        burst(bu.x, bu.y, 5, '#e2e8f0', 200, 2.4, 0.3);
        floatText(bu.x, bu.y, Math.round(bu.dmg), '#e2e8f0', 11);
        bullets.splice(b, 1);
      }
    }
    if (c.hp <= 0) {
      ringFx(c.x, c.y, c.r, c.r + 120, '#e2e8f0', 0.5, 4);
      burst(c.x, c.y, 40, '#e2e8f0', 320, 3.4, 0.7);
      Audio_.kill(); shake(0.3);
      floatText(P.x, P.y - 40, 'RELEASED', COL.hp, 16);
      cages.splice(i, 1); continue;
    }
    // it holds you in: crossing outward is blocked while it stands
    const pd = len(P.x - c.x, P.y - c.y);
    if (pd > c.r - P.r) {
      const a = Math.atan2(P.y - c.y, P.x - c.x);
      P.x = c.x + Math.cos(a) * (c.r - P.r);
      P.y = c.y + Math.sin(a) * (c.r - P.r);
      P.vx *= 0.4; P.vy *= 0.4;
    }
    if (c.r <= c.min + 0.5) {
      explode(c.x, c.y, c.min + 40, c.dmg, '#e2e8f0', true);
      cages.splice(i, 1);
    }
  }
}

/* --------------------------------- beams ---------------------------------- */
function updateBeams(dt) {
  for (let i = beams.length - 1; i >= 0; i--) {
    beams[i].life -= dt;
    if (beams[i].life <= 0) beams.splice(i, 1);
  }
}

/* -------------------------------- bullets --------------------------------- */
function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.px = b.x; b.py = b.y;
    b.life -= dt;
    if (b.life <= 0) {
      // VIRGO: a shot that hits nothing is an imperfection, and it costs you
      if (P.exacting && b.mine && !b.hit) {
        hurtPlayer(P.exacting, { pure: true });
        floatText(b.x, b.y, 'MISS', '#f0abfc', 11, -30);
      }
      bullets.splice(i, 1); continue;
    }

    if (P.homing) {
      const t = nearestEnemy(b.x, b.y, 420);
      if (t) {
        const want = Math.atan2(t.y - b.y, t.x - b.x);
        const cur = Math.atan2(b.vy, b.vx);
        const na = angLerp(cur, want, clamp(P.homing * dt, 0, 0.4));
        const s = len(b.vx, b.vy);
        b.vx = Math.cos(na) * s; b.vy = Math.sin(na) * s;
      }
    }

    // PISCES: everything you fire is underwater — it drags, drifts and sinks
    if (b.deep) {
      const drag = Math.pow(0.28, dt);
      b.vx *= drag; b.vy *= drag;
      b.wob += dt * 5;
      b.vx += Math.cos(b.wob) * 70 * dt;
      b.vy += 300 * dt + Math.sin(b.wob) * 70 * dt;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.dist += len(b.x - b.px, b.y - b.py);

    // walls
    let bounced = false;
    if (b.x < arena.x0 + b.r) { b.x = arena.x0 + b.r; b.vx = Math.abs(b.vx); bounced = true; }
    else if (b.x > arena.x1 - b.r) { b.x = arena.x1 - b.r; b.vx = -Math.abs(b.vx); bounced = true; }
    if (b.y < arena.y0 + b.r) { b.y = arena.y0 + b.r; b.vy = Math.abs(b.vy); bounced = true; }
    else if (b.y > arena.y1 - b.r) { b.y = arena.y1 - b.r; b.vy = -Math.abs(b.vy); bounced = true; }
    if (bounced) {
      if (b.ric > 0) {
        b.ric--; b.hits = null;
        burst(b.x, b.y, 4, b.crit ? COL.crit : COL.bullet, 130, 2, 0.2);
      } else { bullets.splice(i, 1); continue; }
    }

    // THE MIRROR: your rounds bank off the pucks - and so do theirs, so the
    // room cuts both ways.
    for (const h of hazards) {
      if (h.kind !== 'mirror') continue;
      const dm = len(b.x - h.x, b.y - h.y);
      if (dm >= h.r || dm < 0.001) continue;
      const nx = (b.x - h.x) / dm, ny = (b.y - h.y) / dm;
      const dot = b.vx * nx + b.vy * ny;
      if (dot >= 0) continue;
      b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny;
      b.x = h.x + nx * (h.r + 2); b.y = h.y + ny * (h.r + 2);
      b.hits = null;
      burst(b.x, b.y, 4, '#5eead4', 170, 2.2, 0.22);
      break;
    }

    // REDACTOR: anything inside its cone is simply erased, before it can hit
    if (b.mine && !annotated()) {
      let erased = false;
      for (const e of enemies) {
        if (e.dead || e.type !== 'redactor' || !e.redacting) continue;
        const dxr = b.x - e.x, dyr = b.y - e.y;
        const dr = len(dxr, dyr);
        if (dr > 330) continue;
        const off = Math.abs(((Math.atan2(dyr, dxr) - e.ang + Math.PI) % TAU + TAU) % TAU - Math.PI);
        if (off < 0.55) {
          burst(b.x, b.y, 4, '#f87171', 130, 2.2, 0.25);
          if (Math.random() < 0.25) floatText(b.x, b.y, 'REDACTED', '#f87171', 10, -24);
          erased = true; break;
        }
      }
      if (erased) { bullets.splice(i, 1); continue; }
    }

    /* Fused bodies take a shove from your fire without stopping it — that is
       the point of them being a corpse and not an enemy: you can putt one
       into a crowd before it goes off. */
    for (const c of corpses) {
      if (!c.vol) continue;
      if (!segCircle(b.px, b.py, b.x, b.y, c.x, c.y, c.r + b.r)) continue;
      const s = len(b.vx, b.vy) || 1;
      c.vx += b.vx / s * 260; c.vy += b.vy / s * 260;
      c.life = Math.max(c.life, 0.16);   // a nudge buys it a moment to travel
      spawnPart(c.x, c.y, rnd(70, -70), rnd(70, -70), 3, '#fecaca', 0.25, 0.9);
    }

    // enemy collision (swept against previous position for fast bullets)
    let removed = false;
    for (const e of enemies) {
      if (e.dead || e.phased || e.invuln) continue;   // intangible / burrowed
      if (b.hits && b.hits.has(e.id)) continue;
      const rr = e.r + b.r;
      if (!segCircle(b.px, b.py, b.x, b.y, e.x, e.y, rr)) continue;

      // sentinels carry a frontal shield: shots into the face are deflected
      if (e.type === 'sentinel' && !annotated()) {
        const inc = Math.atan2(b.py - e.y, b.px - e.x);
        const dA = Math.abs(((inc - e.ang + Math.PI) % TAU + TAU) % TAU - Math.PI);
        if (dA < 1.15) {
          burst(b.x, b.y, 5, '#bae6fd', 200, 2.4, 0.28);
          Audio_.tone(1100, 0.05, 'square', 0.05, 1600);
          removed = true; break;
        }
      }

      // PRISM: the mirrored half throws your own shot back at you
      if (e.type === 'prism' && !annotated()) {
        const inc = Math.atan2(b.py - e.y, b.px - e.x);
        const off = Math.abs(((inc - e.plateAng + Math.PI) % TAU + TAU) % TAU - Math.PI);
        if (off < 1.3) {
          const back = Math.atan2(P.y - e.y, P.x - e.x) + rnd(0.25, -0.25);
          ebullets.push({ x: e.x + Math.cos(back) * e.r, y: e.y + Math.sin(back) * e.r,
            vx: Math.cos(back) * 330, vy: Math.sin(back) * 330,
            r: 6, dmg: e.dmg, life: 3.5, col: '#a5f3fc' });
          burst(b.x, b.y, 5, '#a5f3fc', 220, 2.4, 0.28);
          Audio_.tone(1250, 0.05, 'sine', 0.05, 700);
          removed = true; break;
        }
      }

      // forgeheart's plates eat anything not threaded through a gap
      if (e.boss === 'forgeheart') {
        const inc = Math.atan2(b.py - e.y, b.px - e.x);
        const rel = ((inc - e.plateAng) % TAU + TAU) % TAU;
        const seg = TAU / 4;
        if (rel % seg < seg * 0.62) {
          burst(b.x, b.y, 5, '#fde68a', 220, 2.6, 0.3);
          Audio_.tone(900, 0.06, 'square', 0.055, 1300);
          removed = true; break;
        }
      }

      // range-dependent modifiers resolve here, using distance actually flown
      let dmg = b.dmg;
      if (P.longshot)   dmg *= 1 + P.longshot * 0.14 * clamp(b.dist / 620, 0, 1);
      if (P.pointblank) dmg *= 1 + P.pointblank * 0.30 * clamp(1 - b.dist / 300, 0, 1);
      // SAGITTARIUS: an arrow gathers force the longer it has been flying
      if (b.arrow) dmg *= 1 + b.arrow * 1.1 * clamp(b.dist / 700, 0, 1);
      b.hit = true;
      damageEnemy(e, dmg, b.crit, b.px, b.py);
      // SCORPIO: inject venom that builds with every sting
      if (b.venom && !e.dead) {
        e.psn = Math.min(12, (e.psn || 0) + b.venom);
        e.psnT = 4.5;
      }
      // LEO: solar rounds set the ground alight where they land
      if (b.solar && Math.random() < 0.5)
        addHazard('fire', b.x, b.y, 2.2, { r: 46, dmg: 5 + P.dmg * 0.14,
                                           friendly: true, col: '#fbbf24' });
      if (!e.dead) {
        const s = len(b.vx, b.vy) || 1;
        e.vx += b.vx / s * P.knock * (e.type === 'boss' ? 0.06 : e.type === 'brute' ? 0.35 : 1);
        e.vy += b.vy / s * P.knock * (e.type === 'boss' ? 0.06 : e.type === 'brute' ? 0.35 : 1);
      }
      if (b.frag > 0) {
        const base = Math.atan2(b.vy, b.vx);
        const n = 2 + b.frag;
        for (let k = 0; k < n; k++) {
          const a = base + Math.PI + (k - (n - 1) / 2) * 0.55 + rnd(0.2, -0.2);
          fireBullet(b.x, b.y, a, 0.42, { sm: 0.72, rm: 0.72, lm: 0.5, noFrag: true });
        }
      }
      if (b.arrow) {
        // an arrow does not stop for anything
        (b.hits || (b.hits = new Set())).add(e.id);
      } else if (b.pierce > 0) {
        b.pierce--;
        (b.hits || (b.hits = new Set())).add(e.id);
        b.dmg *= 0.86;
      } else { removed = true; }
      break;
    }
    if (removed) {
      burst(b.x, b.y, 3, b.crit ? COL.crit : COL.bullet, 140, 2, 0.2);
      bullets.splice(i, 1);
    }
  }
}

// segment (x1,y1)->(x2,y2) intersects circle (cx,cy,r)?
function segCircle(x1, y1, x2, y2, cx, cy, r) {
  const dx = x2 - x1, dy = y2 - y1;
  const fx = x1 - cx, fy = y1 - cy;
  const a = dx * dx + dy * dy;
  if (a < 1e-6) return fx * fx + fy * fy <= r * r;
  let t = -(fx * dx + fy * dy) / a;
  t = clamp(t, 0, 1);
  const px = fx + dx * t, py = fy + dy * t;
  return px * px + py * py <= r * r;
}

function updateEBullets(dt) {
  for (let i = ebullets.length - 1; i >= 0; i--) {
    // hurtPlayer() below can empty this array outright — Second Wind
    // clears the screen — so re-anchor rather than read past the end.
    if (i >= ebullets.length) { i = ebullets.length; continue; }
    const b = ebullets[i];
    if (!b) continue;
    // DEADLOCK holds a bullet mid-air; it must not age out while suspended
    if (b.frozen > 0) {
      b.frozen -= dt;
      if (b.frozen <= 0) { b.vx = b.svx; b.vy = b.svy; }
      continue;
    }
    b.life -= dt;
    // Seeker Rounds and Ricochet, when something has written them onto itself
    if (b.homeP) {
      const s = len(b.vx, b.vy) || 1;
      const want = Math.atan2(P.y - b.y, P.x - b.x);
      const cur = Math.atan2(b.vy, b.vx);
      const a = angLerp(cur, want, 1 - Math.exp(-1.6 * b.homeP * dt));
      b.vx = Math.cos(a) * s; b.vy = Math.sin(a) * s;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.ricP > 0) {
      let hit = false;
      if (b.x < arena.x0 + b.r) { b.x = arena.x0 + b.r; b.vx = -b.vx; hit = true; }
      else if (b.x > arena.x1 - b.r) { b.x = arena.x1 - b.r; b.vx = -b.vx; hit = true; }
      if (b.y < arena.y0 + b.r) { b.y = arena.y0 + b.r; b.vy = -b.vy; hit = true; }
      else if (b.y > arena.y1 - b.r) { b.y = arena.y1 - b.r; b.vy = -b.vy; hit = true; }
      if (hit) { b.ricP--; burst(b.x, b.y, 3, b.col, 140, 2, 0.2); }
    }
    if (b.life <= 0 || b.x < -20 || b.y < -20 || b.x > WORLD.w + 20 || b.y > WORLD.h + 20) {
      ebullets.splice(i, 1); continue;
    }
    for (const h of hazards) {
      if (h.kind !== 'mirror') continue;
      const dm = len(b.x - h.x, b.y - h.y);
      if (dm >= h.r || dm < 0.001) continue;
      const nx = (b.x - h.x) / dm, ny = (b.y - h.y) / dm;
      const dot = b.vx * nx + b.vy * ny;
      if (dot >= 0) continue;
      b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny;
      b.x = h.x + nx * (h.r + 2); b.y = h.y + ny * (h.r + 2);
      burst(b.x, b.y, 4, '#5eead4', 170, 2.2, 0.22);
      break;
    }
    if (Math.random() < 0.3)
      spawnPart(b.x, b.y, 0, 0, b.r * 0.7, b.col, 0.2, 0.9);
    if (P.plateT > 0) {
      const pd = len(b.x - P.x, b.y - P.y);
      if (pd < 84 && pd > 34) {
        const rel = ((Math.atan2(b.y - P.y, b.x - P.x) - P.plateAng) % TAU + TAU) % TAU;
        const seg = TAU / 4;
        if (rel % seg < seg * 0.62) {
          burst(b.x, b.y, 4, '#fbbf24', 190, 2.2, 0.26);
          Audio_.tone(900, 0.05, 'square', 0.045, 1300);
          ebullets.splice(i, 1);
          continue;
        }
      }
    }
    if (len(b.x - P.x, b.y - P.y) < b.r + P.r) {
      hurtPlayer(b.dmg);
      burst(b.x, b.y, 8, b.col, 200, 2.4, 0.35);
      ebullets.splice(i, 1);
    }
  }
}

/* -------------------------------- pickups --------------------------------- */
function updatePickups(dt) {
  const pr = P.pickupR;
  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];
    g.life -= dt;
    const dx = P.x - g.x, dy = P.y - g.y, d = len(dx, dy) || 1;
    if (d < pr) {
      const pull = clamp((1 - d / pr) * 2400 / d, 0, 5000);
      g.vx += dx * pull * dt; g.vy += dy * pull * dt;
    }
    g.vx *= Math.pow(0.12, dt); g.vy *= Math.pow(0.12, dt);
    g.x += g.vx * dt; g.y += g.vy * dt;
    if (d < P.r + g.r + 4 || g.life <= 0) {
      if (g.life > 0) {
        P.xp += g.v * P.xpMul;
        if (P.siphon) P.hp = Math.min(P.maxHp, P.hp + 0.2 * P.siphon);
        Audio_.gem();
        spawnPart(g.x, g.y, 0, 0, 8, COL.xp, 0.22, 0.9);
      }
      gems.splice(i, 1);
    }
  }
  checkLevel();

  for (let i = drops.length - 1; i >= 0; i--) {
    const d0 = drops[i];
    d0.life -= dt; d0.t += dt * 3;
    d0.x += d0.vx * dt; d0.y += d0.vy * dt;
    d0.vx *= Math.pow(0.08, dt); d0.vy *= Math.pow(0.08, dt);
    const dx = P.x - d0.x, dy = P.y - d0.y, d = len(dx, dy) || 1;
    if (d < pr * 1.2) { d0.x += dx / d * 240 * dt; d0.y += dy / d * 240 * dt; }
    if (Math.random() < (d0.kind === 'credit' ? 0.12 : 0.3))
      spawnPart(d0.x + rnd(14, -14), d0.y + rnd(14, -14), 0, -20, 2.4, d0.col, 0.4, 0.95);
    if (d < P.r + d0.r + 6) {
      if (d0.kind === 'credit') {
        credits += d0.v;
        floatText(d0.x, d0.y - 10, '+' + d0.v, '#fde68a', 12);
        Audio_.tone(1050 + rnd(300), 0.05, 'square', 0.045, 1600);
      } else if (d0.kind === 'heal') {
        const amt = Math.round(P.maxHp * 0.28);
        P.hp = Math.min(P.maxHp, P.hp + amt);
        floatText(P.x, P.y - 30, '+' + amt + ' HP', COL.hp, 17);
        Audio_.heal();
        ringFx(P.x, P.y, 8, 90, COL.hp, 0.45, 3);
      } else {
        floatText(P.x, P.y - 30, 'OVERLOAD', '#f0abfc', 18);
        drawFlashT = 0.16; shake(0.8);
        ringFx(P.x, P.y, 20, 900, '#f0abfc', 0.7, 8);
        Audio_.boom();
        for (const e of enemies) {
          if (e.dead) continue;
          if (len(e.x - P.x, e.y - P.y) < 900)
            damageEnemy(e, 90 + wave * 22, true, P.x, P.y, { silent: true });
        }
        ebullets.length = 0;
      }
      drops.splice(i, 1); continue;
    }
    if (d0.life <= 0) drops.splice(i, 1);
  }
}

/* ------------------------------- particles -------------------------------- */
function updateParticles(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { partPool.push(parts[i]); parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    const dr = Math.pow(p.drag, dt * 60);
    p.vx *= dr; p.vy *= dr;
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.life -= dt;
    f.y += f.vy * dt; f.vy *= Math.pow(0.05, dt);
    if (f.life <= 0) floats.splice(i, 1);
  }
  for (let i = arcs.length - 1; i >= 0; i--) { arcs[i].life -= dt; if (arcs[i].life <= 0) arcs.splice(i, 1); }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.life -= dt;
    const t = 1 - r.life / r.max;
    r.r = lerp(r.r0, r.r1, 1 - Math.pow(1 - t, 3));
    if (r.life <= 0) rings.splice(i, 1);
  }
  updateCorpses(dt);
}

/* ================================ RENDER ================================== */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, W, H);
  // whichever overlay draws the slider re-publishes it; otherwise it is gone
  if (!volDrag) volRect = null;

  if (state === 'menu' || state === 'name') {
    renderMenu();
    if (state === 'name') drawNameEntry();
    return;
  }

  const z = camZoom;
  const ox = -cam.x + W / (2 * z) + cam.sx / z;
  const oy = -cam.y + H / (2 * z) + cam.sy / z;

  ctx.save();
  ctx.scale(z, z);
  ctx.translate(ox, oy);

  drawGrid(ox, oy);
  drawArena();
  drawHazards();

  // --- additive layer: glows -------------------------------------------
  ctx.globalCompositeOperation = 'lighter';
  drawRings();
  drawGems();
  drawDrops();
  ctx.globalCompositeOperation = 'source-over';

  drawMortars();
  drawUnwritten();
  drawAmalgam();
  drawCages();
  drawPortals();
  drawLibraryPortal();
  drawCorpses();
  drawEnemies();
  drawSentries();
  if (state !== 'dead') drawPlayer();

  ctx.globalCompositeOperation = 'lighter';
  drawEBullets();
  drawBullets();
  drawArcs();
  drawBeams();
  drawFinaleBeams();
  drawDiary();
  drawLance();
  drawMalFx();
  drawParticles();
  ctx.globalCompositeOperation = 'source-over';

  drawFloats();
  ctx.restore();

  postWorld();          // bloom, chromatic split and grade, world layer only

  if (P.annotT > 0) {
    // a warm margin around the frame while the record is open
    ctx.save();
    ctx.globalAlpha = 0.5 + Math.sin(uiTime * 7) * 0.18;
    ctx.strokeStyle = '#fcd34d'; ctx.lineWidth = 2;
    ctx.strokeRect(3, 3, W - 6, H - 6);
    ctx.globalAlpha = 0.75;
    ctx.textAlign = 'center';
    ctx.font = '700 10px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = '#fcd34d';
    ctx.fillText('ANNOTATED   ' + P.annotT.toFixed(1) + 's', W / 2, 16);
    ctx.restore();
  }
  if (P.stopT > 0) {
    // everything but you is held still; say so without hiding the room
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(88,28,135,0.16)';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.5 + Math.sin(uiTime * 9) * 0.2;
    ctx.strokeStyle = '#f0abfc'; ctx.lineWidth = 2;
    ctx.strokeRect(3, 3, W - 6, H - 6);
    ctx.restore();
  }
  drawVignette();
  if (drawFlashT > 0) {
    ctx.fillStyle = `rgba(255,255,255,${drawFlashT * 2.4})`;
    ctx.fillRect(0, 0, W, H);
  }
  drawHUD();
  drawFreeplay();
  drawUnwrittenOverlay();
  drawLibraryPointer();
  if (isTouch && state === 'play') drawTouchSticks();
  if (state === 'levelup') drawLevelUp();
  if (state === 'shop') drawShop();
  if (state === 'planet') drawPlanetarium();
  if (state === 'library') drawLibrary();
  if (state === 'talk') drawTalk();
  if (state === 'devtalk') drawDevTalk();
  if (outro) drawOutro();
  if (state === 'amalcut') drawAmalCutText();
  if (state === 'gfx') drawGfx();
  if (state === 'pause') drawPause();
  if (state === 'codex') drawCodex();
  if (state === 'dead') drawDead();
  if (!isTouch && (state === 'play' || state === 'shop' || state === 'planet' ||
      state === 'library')) drawCrosshair();

  postScreen();         // vignette, scanlines and grain over the finished frame
}

/* ------------------------- terrain & deployables -------------------------- */
function drawHazards() {
  for (const h of hazards) {
    const fade = (h.kind === 'vent' || h.kind === 'well')
      ? 1 : clamp(h.life / Math.min(1.4, h.max), 0, 1);
    switch (h.kind) {
      case 'fire':
      case 'acid': {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        drawGlow(h.x, h.y, h.r * 1.15, h.col, 0.22 * fade);
        ctx.restore();
        ctx.save();
        ctx.globalAlpha = 0.5 * fade;
        ctx.strokeStyle = h.col; ctx.lineWidth = 2;
        ctx.setLineDash([8, 7]);
        ctx.lineDashOffset = -uiTime * (h.kind === 'acid' ? 9 : 24);
        ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, TAU); ctx.stroke();
        ctx.restore();
        break;
      }
      case 'vent': {
        const tel = h.state === 1, erupt = h.state === 2;
        ctx.save();
        ctx.globalAlpha = erupt ? 0.95 : tel ? 0.45 + Math.sin(uiTime * 26) * 0.35 : 0.2;
        ctx.strokeStyle = erupt ? '#fed7aa' : '#f97316';
        ctx.lineWidth = erupt ? 5 : 2;
        ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, TAU); ctx.stroke();
        poly(h.x, h.y, h.r * 0.42, 6, uiTime * 0.5); ctx.stroke();
        ctx.restore();
        if (erupt) {
          ctx.save(); ctx.globalCompositeOperation = 'lighter';
          drawGlow(h.x, h.y, h.r * 1.7, '#fb923c', 0.75); ctx.restore();
        }
        break;
      }
      case 'laser': {
        const dxl = Math.cos(h.ang), dyl = Math.sin(h.ang), L = 4000;
        const beam = () => {
          ctx.beginPath();
          ctx.moveTo(h.x - dxl * L, h.y - dyl * L);
          ctx.lineTo(h.x + dxl * L, h.y + dyl * L);
          ctx.stroke();
        };
        ctx.save();
        if (h.state === 0) {                       // telegraph: thin dashed line
          ctx.globalAlpha = 0.35 + Math.sin(uiTime * 30) * 0.25;
          ctx.strokeStyle = h.col; ctx.lineWidth = 2;
          ctx.setLineDash([15, 11]);
          beam();
        } else {
          // coloured bloom sized to the actual hit band, plus a hot white core
          const a = clamp((1.55 - h.t) * 3.2, 0, 1);
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = a * 0.5;
          ctx.strokeStyle = h.col; ctx.lineWidth = LASER_HALF * 2;
          beam();
          ctx.globalAlpha = a;
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 14;
          beam();
        }
        ctx.restore();
        break;
      }
      case 'current': {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        drawGlow(h.x, h.y, h.r * 1.1, h.col, 0.22 * fade);
        ctx.globalAlpha = 0.5 * fade;
        ctx.strokeStyle = '#a5f3fc'; ctx.lineWidth = 1.4;
        for (let k = 0; k < 3; k++) {
          const a0 = uiTime * 3 + k * 2.1;
          ctx.beginPath();
          ctx.arc(h.x, h.y, h.r * (0.4 + k * 0.28), a0, a0 + 2.2);
          ctx.stroke();
        }
        ctx.restore();
        break;
      }
      case 'delete': {
        // a band that blinks out of reality on a fixed rhythm
        const on = h.state === 1;
        ctx.save();
        ctx.globalAlpha = on ? 0.85 : 0.28 + Math.sin(uiTime * 18) * 0.1;
        ctx.strokeStyle = on ? '#fca5a5' : '#7f1d1d';
        ctx.lineWidth = on ? 3 : 1.6;
        ctx.setLineDash(on ? [] : [10, 8]);
        ctx.strokeRect(h.x - h.r, h.y - h.r * 0.55, h.r * 2, h.r * 1.1);
        if (on) {
          ctx.globalAlpha = 0.16;
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(h.x - h.r, h.y - h.r * 0.55, h.r * 2, h.r * 1.1);
          for (let k = 0; k < 5; k++) {
            const yy = h.y - h.r * 0.55 + Math.random() * h.r * 1.1;
            ctx.globalAlpha = 0.5;
            ctx.fillStyle = '#fecaca';
            ctx.fillRect(h.x - h.r, yy, h.r * 2, 1.2);
          }
        }
        ctx.restore();
        break;
      }
      case 'mirror': {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        drawGlow(h.x, h.y, h.r * (h.flying ? 1.7 : 1.2), '#5eead4', h.flying ? 0.4 : 0.16);
        ctx.restore();
        if (h.embedded) {
          const fresh = clamp(1 - (h.embT || 0) / 0.7, 0, 1);
          const pulse = 0.72 + Math.sin(uiTime * 3.4 + h.x * 0.01) * 0.28;
          const nx = h.wallNx || 0, ny = h.wallNy || 0;
          // torn hole punched through the wall behind it
          ctx.save();
          ctx.globalAlpha = 0.9;
          ctx.fillStyle = '#02100f';
          ctx.beginPath();
          for (let k = 0; k < 9; k++) {
            const a = k / 9 * TAU;
            const rr = h.r * (0.95 + Math.sin(k * 2.7 + h.y * 0.02) * 0.3);
            const px = h.x + Math.cos(a) * rr, py = h.y + Math.sin(a) * rr;
            k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
          }
          ctx.closePath(); ctx.fill();
          ctx.restore();
          // fractures crawling away across the wall face
          ctx.save();
          ctx.lineCap = 'round';
          ctx.globalCompositeOperation = 'lighter';
          for (let ci = 0; ci < h.cracks.length; ci++) {
            const c = h.cracks[ci];
            const fade = 1 - ci / (h.cracks.length + 2);
            const trace = () => {
              ctx.beginPath(); ctx.moveTo(h.x, h.y);
              for (const pt of c) ctx.lineTo(h.x + pt[0], h.y + pt[1]);
              ctx.stroke();
            };
            ctx.globalAlpha = (0.30 + fresh * 0.45) * fade;
            ctx.strokeStyle = '#5eead4';
            ctx.lineWidth = 5.5 - ci * 0.4;
            trace();                                   // bloom around the split
            ctx.globalAlpha = (0.55 + fresh * 0.45) * fade;
            ctx.strokeStyle = '#ccfbf1';
            ctx.lineWidth = 1.8 - ci * 0.14;
            trace();                                   // hot filament inside it
          }
          ctx.restore();
          // heat bleeding out of the wound, hottest right after impact
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          drawGlow(h.x, h.y, h.r * (2.3 + fresh * 2.2) * pulse, '#5eead4', 0.3 + fresh * 0.4);
          drawGlow(h.x, h.y, h.r * (0.85 + fresh * 0.9), '#ffffff', 0.45 * pulse + fresh * 0.4);
          drawGlow(h.x - nx * h.r * 0.5, h.y - ny * h.r * 0.5,
                   h.r * 1.5 * pulse, '#ffffff', 0.22);
          ctx.restore();
          // the shard itself, buried at the angle it arrived on
          ctx.save();
          ctx.translate(h.x, h.y); ctx.rotate(h.impactAng || 0);
          ctx.globalAlpha = 0.3;
          ctx.fillStyle = '#0f3d3d';
          poly(0, 0, h.r, 6, 0); ctx.fill();
          ctx.globalAlpha = 0.95;
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
          poly(0, 0, h.r, 6, 0); ctx.stroke();
          ctx.globalAlpha = 0.55;
          ctx.strokeStyle = '#5eead4'; ctx.lineWidth = 1.6;
          for (let k = -2; k <= 2; k++) {
            const o = k * h.r * 0.36;
            ctx.beginPath();
            ctx.moveTo(o - h.r * 0.45, h.r * 0.45);
            ctx.lineTo(o + h.r * 0.45, -h.r * 0.45);
            ctx.stroke();
          }
          ctx.restore();
          break;
        }
        if (h.flying) {
          // lethal in flight: a hard white rim and a motion streak
          const sp = Math.hypot(h.vx, h.vy) || 1;
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = 'rgba(153,246,228,0.5)';
          ctx.lineWidth = h.r * 1.5; ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(h.x, h.y);
          ctx.lineTo(h.x - h.vx / sp * 90, h.y - h.vy / sp * 90);
          ctx.stroke();
          ctx.restore();
          ctx.save();
          ctx.translate(h.x, h.y); ctx.rotate(h.rot || 0);
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
          ctx.fillStyle = 'rgba(94,234,212,0.35)';
          poly(0, 0, h.r, 6, 0); ctx.fill(); ctx.stroke();
          ctx.strokeStyle = '#5eead4'; ctx.lineWidth = 2;
          poly(0, 0, h.r * 0.55, 6, 0.5); ctx.stroke();
          ctx.restore();
          break;
        }
        ctx.save();
        ctx.globalAlpha = 0.7;
        ctx.strokeStyle = '#5eead4'; ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, TAU); ctx.stroke();
        ctx.globalAlpha = 0.24;
        ctx.fillStyle = '#0f3d3d';
        ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, TAU); ctx.fill();
        ctx.globalAlpha = 0.9;
        ctx.strokeStyle = '#99f6e4'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, TAU); ctx.stroke();
        ctx.globalAlpha = 0.5;
        ctx.lineWidth = 1.2;
        for (let k = -2; k <= 2; k++) {
          const o = k * h.r * 0.36;
          ctx.beginPath();
          ctx.moveTo(h.x + o - h.r * 0.5, h.y + h.r * 0.5);
          ctx.lineTo(h.x + o + h.r * 0.5, h.y - h.r * 0.5);
          ctx.stroke();
        }
        ctx.restore();
        break;
      }
      case 'well': {
        ctx.save();
        ctx.globalAlpha = 0.18;
        ctx.strokeStyle = h.col; ctx.lineWidth = 1.5;
        for (let k = 1; k <= 3; k++) {
          ctx.beginPath();
          ctx.arc(h.x, h.y, h.r * k / 3 * (0.9 + Math.sin(uiTime * 1.4 + k) * 0.07), 0, TAU);
          ctx.stroke();
        }
        ctx.restore();
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        drawGlow(h.x, h.y, 48, h.col, 0.4); ctx.restore();
        break;
      }
    }
  }
}

function drawPortals() {
  for (const p of portals) {
    const col = p.def.accent;
    const alt = p.kind === 'alt';
    const armed = p.arm <= 0;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(p.x, p.y, p.r * 2.4, col, armed ? 0.5 : 0.22);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = armed ? 1 : 0.45;
    // a stack of counter-rotating rings; the alt gate is jagged and unstable
    for (let k = 0; k < 4; k++) {
      const rr = p.r * (1 - k * 0.19);
      const spin = p.t * (k % 2 ? -1.1 : 1.4) + k;
      ctx.strokeStyle = rgba(col, 0.85 - k * 0.15);
      ctx.lineWidth = 2.4 - k * 0.4;
      if (alt) { poly(p.x, p.y, rr, 3 + k * 2, spin); ctx.stroke(); }
      else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, rr, spin, spin + 4.4);
        ctx.stroke();
      }
    }
    ctx.fillStyle = rgba(col, 0.14);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.62, 0, TAU); ctx.fill();
    ctx.restore();

    // label the destination so the choice is informed
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = alt ? '#f87171' : '#64748b';
    ctx.fillText(alt ? 'THE FRACTURE' : 'ONWARD', p.x, p.y - p.r - 30);
    ctx.font = '800 15px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = col;
    ctx.fillText(p.def.name, p.x, p.y - p.r - 14);
    ctx.restore();
  }
}

/* A screen-space marker so an open library can never be walked past. It sits
   on the door when the door is visible, and pins to the screen edge pointing
   at it when it is not. */
function drawLibraryPointer() {
  const L = libraryPortal;
  if (!L || (state !== 'play' && state !== 'pause')) return;
  const sx = (L.x - cam.x) * camZoom + W / 2 + cam.sx;
  const sy = (L.y - cam.y) * camZoom + H / 2 + cam.sy;
  const m = 54;
  const mal = L.kind === 'malware';
  const pcol = mal ? MAL_COL : '#fcd34d';
  const label = mal ? 'MALWARE' : 'LIBRARY';
  const onScreenNow = sx > m && sx < W - m && sy > m && sy < H - m;
  const pulse = 0.62 + Math.sin(uiTime * 4.2) * 0.38;
  ctx.save();
  ctx.textAlign = 'center';
  if (onScreenNow) {
    ctx.globalAlpha = pulse * 0.9;
    ctx.fillStyle = pcol;
    ctx.font = '700 10px Segoe UI, system-ui, sans-serif';
    ctx.fillText(label, sx, sy - L.r - 16);
  } else {
    const px = clamp(sx, m, W - m), py = clamp(sy, m, H - m);
    // a zero delta on one axis is correct here — the marker is pinned to that
    // edge and should point straight along it, so don't ||-fallback it away
    let dx = sx - px, dy = sy - py;
    if (!dx && !dy) { dx = sx - W / 2; dy = sy - H / 2; }
    const a = Math.atan2(dy, dx);
    ctx.globalAlpha = pulse;
    ctx.translate(px, py);
    ctx.rotate(a);
    ctx.fillStyle = pcol;
    ctx.beginPath();
    ctx.moveTo(16, 0); ctx.lineTo(-10, 9); ctx.lineTo(-5, 0); ctx.lineTo(-10, -9);
    ctx.closePath(); ctx.fill();
    ctx.rotate(-a);
    ctx.globalAlpha = pulse * 0.85;
    ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
    ctx.fillText(label, 0, 26);
  }
  ctx.restore();
}

function drawLibraryPortal() {
  const L = libraryPortal;
  if (!L) return;
  const mal = L.kind === 'malware';
  const pcol = mal ? MAL_COL : '#fcd34d';
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(L.x, L.y, L.r * 2.6, pcol, L.arm <= 0 ? 0.5 : 0.25);
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = L.arm <= 0 ? 1 : 0.5;
  // a doorway of stacked frames, turning slowly — jagged when it is infected
  for (let k = 0; k < 3; k++) {
    const rr = L.r * (1 - k * 0.22);
    ctx.strokeStyle = rgba(pcol, 0.85 - k * 0.2);
    ctx.lineWidth = 2.6 - k * 0.5;
    poly(L.x, L.y, rr, mal ? 3 + k : 4, L.t * (k % 2 ? -0.6 : 0.8) * (mal ? 2.2 : 1) + k * 0.4);
    ctx.stroke();
  }
  if (mal) {
    // a broken glyph where the book would be
    ctx.strokeStyle = '#fecaca'; ctx.lineWidth = 2.6;
    ctx.beginPath();
    for (let k = 0; k < 5; k++) {
      const a = L.t * 1.4 + k * TAU / 5;
      ctx.moveTo(L.x, L.y);
      ctx.lineTo(L.x + Math.cos(a) * 17, L.y + Math.sin(a) * 17);
    }
    ctx.stroke();
    if (Math.random() < 0.4)
      spawnPart(L.x + rnd(L.r, -L.r), L.y + rnd(L.r, -L.r), rnd(90, -90), rnd(90, -90),
                rnd(4, 2), MAL_COL, rnd(0.4, 0.2), 0.92);
  } else {
    // an open book at the centre
    ctx.strokeStyle = '#fef3c7'; ctx.lineWidth = 2.4;
    ctx.fillStyle = 'rgba(252,211,77,0.18)';
    ctx.beginPath();
    ctx.moveTo(L.x - 18, L.y + 10);
    ctx.quadraticCurveTo(L.x, L.y + 2, L.x, L.y + 8);
    ctx.quadraticCurveTo(L.x, L.y + 2, L.x + 18, L.y + 10);
    ctx.lineTo(L.x + 18, L.y - 8);
    ctx.quadraticCurveTo(L.x, L.y - 16, L.x, L.y - 10);
    ctx.quadraticCurveTo(L.x, L.y - 16, L.x - 18, L.y - 8);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();

  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 9px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = mal ? '#7f1d1d' : '#a16207';
  ctx.fillText(mal ? 'MALWARE' : 'LIBRARY', L.x, L.y - L.r - 30);
  ctx.font = '800 14px Segoe UI, system-ui, sans-serif';
  if (mal) {
    ctx.fillStyle = L.mal ? L.mal.col : MAL_COL;
    ctx.fillText(L.mal ? L.mal.n : 'A PAYLOAD', L.x, L.y - L.r - 14);
  } else {
    const bk = BOOKS[L.boss];
    ctx.fillStyle = bk ? bk.col : '#fcd34d';
    ctx.fillText(bk ? bk.n : 'A BOOK', L.x, L.y - L.r - 14);
  }
  ctx.restore();
}

function drawUnwritten() {
  const u = unwritten;
  if (!u) return;

  // the torn page: warning first, then a hole with nothing in it
  for (const t of unwTears) {
    const rc = unwCellRect(t.c, t.r);
    ctx.save();
    if (t.warn > 0) {
      const p = 1 - t.warn / 1.1;
      ctx.globalAlpha = 0.25 + p * 0.35;
      ctx.strokeStyle = UNW_INK; ctx.lineWidth = 2;
      ctx.setLineDash([9, 7]); ctx.lineDashOffset = -uiTime * 30;
      ctx.strokeRect(rc.x + 2, rc.y + 2, rc.w - 4, rc.h - 4);
      ctx.setLineDash([]);
      ctx.globalAlpha = 0.1 * p;
      ctx.fillStyle = UNW_INK;
      ctx.fillRect(rc.x, rc.y, rc.w, rc.h);
    } else {
      /* A lethal hole has to be unmistakable against a dark floor, so it is not
         just black: it gets a bright torn rim, an inner falloff and a hatch. */
      const fade = clamp(t.life / 1.2, 0, 1);
      ctx.globalAlpha = fade;
      ctx.fillStyle = '#000';
      ctx.fillRect(rc.x, rc.y, rc.w, rc.h);
      // inner falloff, so the edge reads even where the floor is nearly black
      const gr = ctx.createLinearGradient(rc.x, rc.y, rc.x, rc.y + rc.h);
      gr.addColorStop(0, 'rgba(168,85,247,0.30)');
      gr.addColorStop(0.35, 'rgba(0,0,0,0)');
      gr.addColorStop(0.65, 'rgba(0,0,0,0)');
      gr.addColorStop(1, 'rgba(168,85,247,0.30)');
      ctx.fillStyle = gr;
      ctx.fillRect(rc.x, rc.y, rc.w, rc.h);
      // torn fibres across the gap
      ctx.globalAlpha = 0.28 * fade;
      ctx.strokeStyle = UNW_INK; ctx.lineWidth = 1;
      for (let k = 1; k < 5; k++) {
        const yy = rc.y + (rc.h * k) / 5;
        ctx.beginPath();
        ctx.moveTo(rc.x + 3, yy + Math.sin(k * 2.1 + t.c) * 3);
        ctx.lineTo(rc.x + rc.w - 3, yy + Math.sin(k * 3.3 + t.r) * 3);
        ctx.stroke();
      }
      // ragged rim, all four sides
      ctx.globalAlpha = fade;
      ctx.strokeStyle = '#c084fc'; ctx.lineWidth = 3;
      ctx.beginPath();
      const step = 12;
      for (let x = rc.x; x <= rc.x + rc.w; x += step)
        ctx[x === rc.x ? 'moveTo' : 'lineTo'](x, rc.y + Math.sin((x + t.c * 37) * 0.13) * 4);
      for (let y = rc.y; y <= rc.y + rc.h; y += step)
        ctx.lineTo(rc.x + rc.w + Math.sin((y + t.r * 41) * 0.13) * 4, y);
      for (let x = rc.x + rc.w; x >= rc.x; x -= step)
        ctx.lineTo(x, rc.y + rc.h + Math.sin((x + t.r * 53) * 0.13) * 4);
      for (let y = rc.y + rc.h; y >= rc.y; y -= step)
        ctx.lineTo(rc.x + Math.sin((y + t.c * 29) * 0.13) * 4, y);
      ctx.closePath(); ctx.stroke();
    }
    ctx.restore();
  }

  if (!u.a || !u.b || u.a.dead || u.b.dead) return;

  // the link. It shows which half is open, and in the last phase it cuts.
  const lethal = u.phase >= 1;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = lethal ? UNW_INK : 'rgba(148,163,184,0.5)';
  ctx.lineWidth = lethal ? 5 : 2;
  ctx.globalAlpha = lethal ? 0.8 + Math.sin(uiTime * 9) * 0.2 : 0.5;
  ctx.beginPath(); ctx.moveTo(u.a.x, u.a.y); ctx.lineTo(u.b.x, u.b.y); ctx.stroke();
  ctx.restore();

  // an open wound is drawn on the body that has one
  for (const [e, open] of [[u.a, u.aHitT], [u.b, u.bHitT]]) {
    if (open <= 0) continue;
    const p = open / LINK_HEAL;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(e.x, e.y, e.r * 2.6, UNW_INK, 0.45 * p);
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = UNW_INK; ctx.lineWidth = 3;
    ctx.globalAlpha = p;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 12, 0, TAU * p); ctx.stroke();
    ctx.restore();
  }

  // it is closing up because nothing has touched it
  if (u.touchT > UNW_UNTOUCHED) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '700 11px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = UNW_COL;
    ctx.globalAlpha = 0.55 + Math.sin(uiTime * 6) * 0.35;
    ctx.fillText('CLOSING', (u.a.x + u.b.x) / 2, (u.a.y + u.b.y) / 2 + 34);
    ctx.restore();
  }
  // banked damage, waiting for the other half to be opened
  if (u.pending > 0) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '700 12px Segoe UI, system-ui, sans-serif';
    ctx.fillStyle = UNW_INK;
    ctx.globalAlpha = 0.6 + Math.sin(uiTime * 8) * 0.3;
    ctx.fillText('HELD  ' + Math.round(u.pending),
                 (u.a.x + u.b.x) / 2, (u.a.y + u.b.y) / 2 - 18);
    ctx.restore();
  }
}

function drawUnwrittenOverlay() {
  if (unwDeadT <= 0) return;
  const p = clamp(1 - unwDeadT / 2.0, 0, 1);
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,' + (0.55 + p * 0.4) + ')';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = clamp(p * 2.2, 0, 1);
  ctx.font = '800 ' + Math.min(40, W * 0.045) + 'px Segoe UI, system-ui, sans-serif';
  ctx.fillStyle = UNW_COL;
  ctx.fillText('you don’t get to give up yet.', W / 2, H / 2);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

/* The pieces draw themselves as the bosses they were. This is the scaffolding
   that makes them read as one body: spine, ribs and the struts holding the
   limbs on. During the cutscene it also draws the pieces still in flight. */
const AMAL_BONES = [['head','spine',20], ['spine','torso',34], ['spine','shldL',18],
                    ['spine','shldR',18], ['shldL','armL',26], ['shldR','armR',26],
                    ['torso','legL',30], ['torso','legR',30]];
const STEEL_D = '#1c1917', STEEL = '#44403c', STEEL_L = '#8b8378', WELD = '#fb923c';

/* A tapered armoured segment with a rim light, plating seams and a joint cap.
   This is the thing that stops it reading as a stick between two circles. */
function amalLimb(x1, y1, x2, y2, w1, w2) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  const nx = -Math.sin(a), ny = Math.cos(a);
  const L = len(x2 - x1, y2 - y1) || 1;
  const quad = (o1, o2, fill) => {
    ctx.beginPath();
    ctx.moveTo(x1 + nx * o1, y1 + ny * o1);
    ctx.lineTo(x2 + nx * o2, y2 + ny * o2);
    ctx.lineTo(x2 - nx * o2, y2 - ny * o2);
    ctx.lineTo(x1 - nx * o1, y1 - ny * o1);
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
  };
  quad(w1, w2, STEEL_D);
  quad(w1 * 0.72, w2 * 0.72, STEEL);
  // rim light down one edge
  ctx.beginPath();
  ctx.moveTo(x1 + nx * w1 * 0.86, y1 + ny * w1 * 0.86);
  ctx.lineTo(x2 + nx * w2 * 0.86, y2 + ny * w2 * 0.86);
  ctx.strokeStyle = 'rgba(214,211,209,0.55)'; ctx.lineWidth = 2.2; ctx.stroke();
  // plating seams
  ctx.strokeStyle = 'rgba(12,10,9,0.85)'; ctx.lineWidth = 1.6;
  const segs = Math.max(2, Math.round(L / 34));
  for (let k = 1; k < segs; k++) {
    const u = k / segs, w = lerp(w1, w2, u);
    const px = lerp(x1, x2, u), py = lerp(y1, y2, u);
    ctx.beginPath();
    ctx.moveTo(px + nx * w, py + ny * w);
    ctx.lineTo(px - nx * w, py - ny * w);
    ctx.stroke();
  }
}

// the ring of scrap a boss got welded into, plus the seam still cooling
/* Armour outlines, in units of the piece radius. +x always points outward from
   the body centreline, so the left side is drawn by mirroring x. Nothing here
   is round on purpose: the silhouette has to read as forged plate, and the only
   circle on a mounted piece is the small core lens at its middle. */
const AMAL_SHELL = {
  pauldron: [[-1.14,-0.50],[-0.30,-0.98],[0.66,-0.92],[1.30,-0.18],
             [1.16, 0.62],[0.42, 1.06],[-0.52, 0.96],[-1.06, 0.30]],
  gauntlet: [[-0.94,-0.96],[0.62,-1.10],[1.18,-0.52],[1.24, 0.34],
             [0.86, 1.02],[-0.62, 1.10],[-1.10, 0.42],[-1.06,-0.30]],
  greave:   [[-0.88,-1.10],[0.88,-1.10],[1.06,-0.20],[1.34, 0.66],
             [1.30, 1.14],[-1.30, 1.14],[-1.34, 0.66],[-1.06,-0.20]],
  helm:     [[-0.92,-0.30],[-0.60,-1.06],[0.60,-1.06],[0.92,-0.30],
             [0.86, 0.50],[0.40, 1.10],[-0.40, 1.10],[-0.86, 0.50]],
  spool:    [[-0.86,-1.06],[0.86,-1.06],[1.10,-0.34],[1.10, 0.34],
             [0.86, 1.06],[-0.86, 1.06],[-1.10, 0.34],[-1.10,-0.34]]
};

function shellPath(x, y, r, role, sx) {
  const pts = AMAL_SHELL[role];
  ctx.beginPath();
  for (let k = 0; k < pts.length; k++) {
    const px = x + pts[k][0] * r * sx, py = y + pts[k][1] * r;
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

// the armour a piece is bolted into: beveled plate, bolts, seams, battle damage
function amalCasing(x, y, r, role, sx, frac, flash) {
  const hurt = 1 - clamp(frac, 0, 1);
  ctx.save();

  // dropped shadow plate underneath, for thickness
  ctx.fillStyle = '#0a0908';
  shellPath(x + 5 * sx, y + 7, r, role, sx); ctx.fill();

  // the plate
  shellPath(x, y, r, role, sx);
  const g = ctx.createLinearGradient(x, y - r, x, y + r);
  g.addColorStop(0, STEEL);
  g.addColorStop(0.45, '#302c28');
  g.addColorStop(1, STEEL_D);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = STEEL_L; ctx.lineWidth = 2.6; ctx.stroke();

  // clip everything that follows to the plate so seams never spill
  ctx.save();
  shellPath(x, y, r, role, sx); ctx.clip();

  // lit top bevel
  ctx.strokeStyle = 'rgba(168,162,150,0.55)'; ctx.lineWidth = 5;
  shellPath(x, y + 5, r * 0.99, role, sx); ctx.stroke();

  // panel seams, laid out per role
  ctx.strokeStyle = 'rgba(12,10,9,0.75)'; ctx.lineWidth = 2.4;
  if (role === 'pauldron' || role === 'greave') {
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(x - r * 1.4 * sx, y + k * r * 0.42 + r * 0.1);
      ctx.lineTo(x + r * 1.4 * sx, y + k * r * 0.42 - r * 0.14);
      ctx.stroke();
    }
  } else if (role === 'gauntlet') {
    for (let k = -1; k <= 1; k++) {      // knuckle ridges on the outer edge
      ctx.beginPath();
      ctx.moveTo(x + r * 0.34 * sx, y + k * r * 0.5);
      ctx.lineTo(x + r * 1.4 * sx, y + k * r * 0.5);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(x + r * 0.34 * sx, y - r * 1.2);
    ctx.lineTo(x + r * 0.34 * sx, y + r * 1.2);
    ctx.stroke();
  } else if (role === 'helm') {
    ctx.beginPath();                     // visor band
    ctx.moveTo(x - r * 1.2, y - r * 0.16);
    ctx.lineTo(x + r * 1.2, y - r * 0.16);
    ctx.lineTo(x + r * 1.2, y + r * 0.30);
    ctx.lineTo(x - r * 1.2, y + r * 0.30);
    ctx.closePath();
    ctx.fillStyle = '#0a0908'; ctx.fill();
  } else {
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(x - r * 1.2, y + k * r * 0.5);
      ctx.lineTo(x + r * 1.2, y + k * r * 0.5);
      ctx.stroke();
    }
  }

  // gouges torn into the plate as the piece is worn down
  if (hurt > 0.15) {
    const n = Math.floor(hurt * 6);
    for (let k = 0; k < n; k++) {
      const a = (k * 2.39 + r) % TAU, len = r * (0.5 + (k % 3) * 0.28);
      ctx.strokeStyle = '#0a0908'; ctx.lineWidth = 3.6 + (k % 2) * 2;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * r * 0.2, y + Math.sin(a) * r * 0.2);
      ctx.lineTo(x + Math.cos(a + 0.5) * len, y + Math.sin(a + 0.5) * len);
      ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = rgba(WELD, 0.45 * hurt); ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  ctx.restore();                          // end clip

  // bolts at every vertex
  const pts = AMAL_SHELL[role];
  for (let k = 0; k < pts.length; k++) {
    const bx = x + pts[k][0] * r * 0.84 * sx, by = y + pts[k][1] * r * 0.84;
    ctx.fillStyle = '#0a0908';
    ctx.beginPath(); ctx.arc(bx, by + 1.4, 3.4, 0, TAU); ctx.fill();
    ctx.fillStyle = STEEL_L;
    ctx.beginPath(); ctx.arc(bx, by, 3, 0, TAU); ctx.fill();
  }

  // the weld holding the piece in, still cooling
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = rgba(WELD, 0.30 + Math.sin(uiTime * 3 + x * 0.01) * 0.12 + flash * 0.3);
  ctx.lineWidth = 3;
  shellPath(x, y, r * 0.9, role, sx); ctx.stroke();
  ctx.restore();
}

// the boss itself, cut down to a core and sunk into the socket
function amalCore(x, y, r, key, frac, flash, spin) {
  const bd = BOSSES[key], cr = r * 0.5;
  ctx.save();
  // recessed socket
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(x, y, cr * 1.42, 0, TAU); ctx.fill();
  ctx.strokeStyle = STEEL_L; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.arc(x, y, cr * 1.42, 0, TAU); ctx.stroke();
  // retaining claws over the lip
  ctx.strokeStyle = STEEL; ctx.lineWidth = 5;
  for (let k = 0; k < 4; k++) {
    const a = k * TAU / 4 + 0.78;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * cr * 1.6, y + Math.sin(a) * cr * 1.6);
    ctx.lineTo(x + Math.cos(a) * cr * 0.95, y + Math.sin(a) * cr * 0.95);
    ctx.stroke();
  }
  // the captured boss, dimmed by how hurt it is
  const lit = 0.35 + clamp(frac, 0, 1) * 0.65;
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(x, y, cr * 3.4, bd.col, (0.22 + flash * 0.45) * lit);
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = bd.col;
  ctx.fillStyle = flash > 0.02 ? rgba('#ffffff', 0.4 * flash) : rgba(bd.col, 0.26 * lit);
  ctx.lineWidth = 3;
  poly(x, y, cr, bd.sides, spin);
  ctx.fill(); ctx.stroke();
  ctx.globalAlpha = 0.5; ctx.lineWidth = 1.6;
  poly(x, y, cr * 0.54, bd.sides, -spin * 1.4);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
}

// a boss, cut down and bolted in: its own shape, cracked as it takes damage
function amalChunk(x, y, r, key, frac, flash, spin) {
  const bd = BOSSES[key];
  const hurt = 1 - clamp(frac, 0, 1);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(x, y, r * 2.2, bd.col, 0.28 + flash * 0.4);
  ctx.restore();
  ctx.save();
  ctx.strokeStyle = bd.col;
  ctx.fillStyle = flash > 0.02 ? rgba('#ffffff', 0.35 * flash) : rgba(bd.col, 0.2);
  ctx.lineWidth = 3.4;
  poly(x, y, r, bd.sides, spin);
  ctx.fill(); ctx.stroke();
  // inner facet
  ctx.globalAlpha = 0.55; ctx.lineWidth = 1.8;
  poly(x, y, r * 0.58, bd.sides, -spin * 1.4);
  ctx.stroke();
  ctx.globalAlpha = 1;
  // damage: fractures that open as it is worn down
  if (hurt > 0.2) {
    ctx.strokeStyle = rgba('#0c0a09', 0.9); ctx.lineWidth = 2.4;
    const n = Math.floor(hurt * 5);
    for (let k = 0; k < n; k++) {
      const a = (k * 2.7 + key.length) % TAU;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * r * 0.15, y + Math.sin(a) * r * 0.15);
      ctx.lineTo(x + Math.cos(a + 0.4) * r * 0.95, y + Math.sin(a + 0.4) * r * 0.95);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = rgba(WELD, 0.5 * hurt); ctx.lineWidth = 1.2;
    for (let k = 0; k < n; k++) {
      const a = (k * 2.7 + key.length) % TAU;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * r * 0.15, y + Math.sin(a) * r * 0.15);
      ctx.lineTo(x + Math.cos(a + 0.4) * r * 0.95, y + Math.sin(a + 0.4) * r * 0.95);
      ctx.stroke();
    }
  }
  ctx.restore();
}

// cabling that sags between the pieces and sways with the walk
function amalCable(x1, y1, x2, y2, sag, phase) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 + sag + Math.sin(uiTime * 1.8 + phase) * 5;
  ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.quadraticCurveTo(mx, my, x2, y2);
  ctx.strokeStyle = '#0c0a09'; ctx.lineWidth = 5; ctx.stroke();
  ctx.strokeStyle = '#57534e'; ctx.lineWidth = 2.4; ctx.stroke();
}

function drawAmalBody(b, placed, a) {
  const slot = id => {
    const p = AMAL_PARTS.find(z => z.id === id);
    if (a) { const pp = a.parts.find(z => z.id === id); if (pp) return amalPartPos(a, pp); }
    return { x: b.x + p.ox, y: b.y + p.oy };
  };
  const live = id => {
    if (a) { const pp = a.parts.find(z => z.id === id); return pp && pp.e && !pp.e.dead; }
    return placed && placed[id] >= 1;
  };
  const health = id => {
    if (!a) return 1;
    const pp = a.parts.find(z => z.id === id);
    return pp && pp.e ? clamp(pp.e.hp / pp.e.maxHp, 0, 1) : 0;
  };
  const flashOf = id => {
    if (!a) return 0;
    const pp = a.parts.find(z => z.id === id);
    return pp && pp.e ? pp.e.flash : 0;
  };
  const foot = slot('legL').y > slot('legR').y ? slot('legL').y : slot('legR').y;

  /* ---- where a fist is about to land ---- */
  if (a && a.slam && !a.slam.hit) {
    const s = a.slam, u = clamp(s.t / (SLAM_UP + SLAM_DOWN), 0, 1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // the marked ground, filling up as the arm comes over
    ctx.fillStyle = rgba('#fbbf24', 0.10 + u * 0.16);
    ctx.beginPath(); ctx.ellipse(s.tx, s.ty, 190, 190 * 0.8, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba('#fbbf24', 0.5 + u * 0.4); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(s.tx, s.ty, 190, 190 * 0.8, 0, 0, TAU); ctx.stroke();
    // a closing ring that reaches the edge exactly on impact
    ctx.strokeStyle = rgba('#ffffff', 0.55); ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(s.tx, s.ty, 190 * (1.9 - u * 0.9), 190 * 0.8 * (1.9 - u * 0.9), 0, 0, TAU);
    ctx.stroke();
    // cross-hairs, so it is unmistakable
    ctx.strokeStyle = rgba('#fbbf24', 0.35); ctx.lineWidth = 2;
    for (let k = 0; k < 4; k++) {
      const ang = k * TAU / 4 + Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(s.tx + Math.cos(ang) * 130, s.ty + Math.sin(ang) * 104);
      ctx.lineTo(s.tx + Math.cos(ang) * 240, s.ty + Math.sin(ang) * 192);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ---- ground shadow, so it has weight ---- */
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(b.x, foot + 42, 250, 46, 0, 0, TAU);
  ctx.fill();
  ctx.restore();

  /* ---- backlight, so it reads as enormous ---- */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(b.x, b.y - 40, 460, '#7f1d1d', 0.20 + Math.sin(uiTime * 1.4) * 0.05);
  ctx.restore();

  /* ---- limbs behind the chest ---- */
  const bone = (a1, b1, w) => {
    if (!live(a1) || !live(b1)) return;
    const s = slot(a1), t = slot(b1);
