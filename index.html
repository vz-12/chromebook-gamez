    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = ROOT_COL;
    ctx.fillRect(d.x - 4, d.y - R * 0.42, 8, R * 0.84);
    ctx.restore();
  }

  /* And a removal marker on the floor where it stood: the diff the finale is
     about to read out, already begun. */
  if (t > 3.7) {
    ctx.save();
    ctx.globalAlpha = clamp((t - 3.7) * 2.6, 0, 1);
    ctx.textAlign = 'center';
    ctx.font = '700 ' + Math.round(R * 0.7) + "px 'JetBrains Mono', ui-monospace, monospace";
    ctx.fillStyle = rgba('#f87171', 0.85);
    ctx.fillText('-', d.x, d.y + R * 0.24);
    ctx.restore();
  }
  if (FXO.parts && t < 3.2 && Math.random() < 0.5)
    spawnPart(d.x + rnd(M, -M), d.y + rnd(M, -M), rnd(120, -120), rnd(120, -120),
              rnd(2.8, 1.2), ROOT_COL, rnd(0.5, 0.2), 0.92);
}

/* ============================ AFTER ROOT ===================================
   The amalgam ends by taking the page down. This one is the other way round:
   the room is handed back. Everything ROOT helped itself to is revoked in
   front of it, one line at a time, and it argues the whole way down until it
   runs out of things to say and asks the only real question in the route.

   Drawn in the same editor language as the intrusion, because it is the same
   hands — a gutter, a status line, and somebody else's cursor leaving.
--------------------------------------------------------------------------- */
const ROOT_REVOKE = [
  'hp.set(max)',
  'self.noclip',
  'spawn("brute", 12)',
  'arena.shrink(0.7)',
  'player.upgrades.clear()',
  'player.speed = 0.35'
];

/* Six things come off it and one goes on, in the same file. The key is not an
   object it hands you — nothing down here is an object — it is the one line in
   the patch that is not a removal, and it is the only privilege it never gets
   to keep or destroy. It is insufferable about that too. */
const ROOT_GRANT = 'player.key';
const ROOT_GRANT_T = 7.6;              // after it has run out of complaints

/* Loud, then quieter, then honest. The last one is the whole route. */
const ROOT_LAST = [
  { t: 2.2,  s: 'take it. i barely touched it.' },
  { t: 4.4,  s: 'i had it exactly how i wanted it.' },
  { t: 6.6,  s: 'you understand that i let you do this.' },
  { t: 8.2,  s: 'the key as well. i do not know what it is for.' },
  { t: 10.4, s: 'something in here has a lock on it. it was not mine.' },
  { t: 12.8, s: 'i could have stopped you whenever i felt like it.' },
  { t: 15.4, s: 'you did all of it the ordinary way.' },
  { t: 18.0, s: 'so could anyone. it is not hard.' },
  { t: 20.8, s: '. . . is it.' }
];

let rootOut = null;

function startRootOutro() {
  rootOut = { t: 0, said: -1, revoked: 0, restored: 0 };
  Audio_.tone(220, 0.3, 'square', 0.1, 90);
}

function rootOutroTick(dt) {
  const o = rootOut;
  o.t += dt;

  // the privileges go one at a time, half a second apart
  const want = Math.min(ROOT_REVOKE.length, Math.floor(o.t / 0.55));
  if (want > o.revoked) {
    o.revoked = want;
    Audio_.tone(1400, 0.03, 'square', 0.05, 1900);
    o.hit = 0.34;                            // the stamp landing
  }
  o.hit = Math.max(0, (o.hit || 0) - dt);
  for (let i = 0; i < ROOT_LAST.length; i++) {
    if (o.t >= ROOT_LAST[i].t && o.said < i) {
      o.said = i;
      o.saidT = 0;                           // so a new line can type itself in
      Audio_.tone(520 - i * 40, 0.05, 'sine', 0.04, 700);
    }
  }
  o.saidT = (o.saidT || 0) + dt;
  if (o.t >= ROOT_GRANT_T && !o.granted) {
    o.granted = true;
    P.key = (P.key || 0) + 1;
    if (!Save.profile.keyEver) {          // the record notes it turned up
      Save.profile.keyEver = true;
      Save.writeLocal(); Save.flush();
    }
    Audio_.tone(1180, 0.08, 'sine', 0.06, 1500);
    Audio_.levelup();
  }
  // and then the room fills back in
  if (o.t > 22.6) o.restored = Math.min(1, o.restored + dt * 0.55);
  if (o.restored >= 1 && o.t > 26.7) {
    rootOut = null;
    banner('THE ROOM IS YOURS', ROOT_COL, 4.0);
    Audio_.levelup();
    // and the thing it minted is in the room with you
    if (P.key) spawnKeyItem(P.x - Math.cos(P.ang) * 30, P.y - Math.sin(P.ang) * 30);
    /* And a way out of it. ROOT's defeat returns before the ordinary stage
       hand-off — it is not a stage boss — so nothing was opening the gates,
       and the last sector of the fracture has no boss wave to fall back on
       either. Without this the room really is yours: permanently, with no
       door. Opened here rather than on the kill so the finale is not played
       over a pair of portals. */
    if (!awaitingPortal) afterReward();
    checkLevel();                      // whatever it owed you, now
  }
}
/* It is a patch being applied to the room, so it is drawn as one: a diff
   header, six removals struck out in turn, and its own body sitting above the
   file losing a piece of itself with every line that goes. The last thing it
   says is the only question in the route, so nothing else is on screen for it
   and the caret after it never gets an answer. */
function drawRootOutro() {
  if (!rootOut) return;
  const o = rootOut;
  const live = 1 - o.restored;                    // everything ROOT owns fades
  const dark = clamp(o.t * 0.9, 0, 0.9) * live;
  const mono = "px 'JetBrains Mono', ui-monospace, monospace";
  const last = o.said === ROOT_LAST.length - 1;

  ctx.save();
  ctx.fillStyle = 'rgba(3,2,5,' + dark + ')';
  ctx.fillRect(0, 0, W, H);

  /* The room coming back, before anything else so the text sits over it: a
     wash pushing out from the middle, which is the opposite of the black
     square the intrusion left behind. */
  if (o.restored > 0) {
    const p = o.restored;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(W / 2, H / 2, Math.max(W, H) * 0.9 * p, ROOT_COL, 0.16 * (1 - p * 0.5));
    ctx.strokeStyle = rgba(ROOT_COL, 0.3 * (1 - p));
    ctx.lineWidth = 26 * (1 - p) + 4;
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, Math.max(W, H) * 0.62 * p, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  /* ROOT itself, above the file. Same furniture as its body in the fight —
     marquee, handles, checker, caret, brackets — losing one handle per
     privilege revoked, until the box is empty and then not there either. */
  const M = clamp(Math.min(W, H) * 0.1, 38, 92);
  const ex = W / 2, ey = clamp(H * 0.28, M + 44, H * 0.34);
  const gone = o.revoked / ROOT_REVOKE.length;      // how much of it is left
  const spent = clamp((o.t - ROOT_REVOKE.length * 0.55 - 0.5) / 1.7, 0, 1);
  const bodyA = last ? 0 : live * (1 - gone * 0.35) * (1 - spent);
  if (bodyA > 0.02) {
    ctx.save();
    ctx.globalAlpha = bodyA;
    // stripped of everything, it folds up and is not there either
    ctx.translate(ex, ey);
    ctx.scale(1 - spent * 0.55, 1 - spent * 0.8);
    ctx.translate(-ex, -ey);
    // the interior, draining as it is taken apart
    ctx.save();
    ctx.beginPath(); ctx.rect(ex - M, ey - M + M * 2 * gone, M * 2, M * 2 * (1 - gone));
    ctx.clip();
    ctx.save();
    ctx.translate((uiTime * 9) % 24, (uiTime * 6) % 24);
    ctx.fillStyle = ctx.createPattern(rootChecker(), 'repeat');
    ctx.fillRect(ex - M - 24, ey - M - 24, M * 2 + 48, M * 2 + 48);
    ctx.restore();
    ctx.fillStyle = rgba(ROOT_COL, 0.1);
    ctx.fillRect(ex - M, ey - M, M * 2, M * 2);
    ctx.restore();
    // the caret, going out for good rather than blinking
    if (gone < 0.7) {
      ctx.fillStyle = rgba(ROOT_COL, 0.7 * (1 - gone / 0.7));
      ctx.fillRect(ex - 3, ey - M * 0.4, 6, M * 0.8);
      ctx.fillRect(ex - 9, ey - M * 0.44, 18, 3.5);
      ctx.fillRect(ex - 9, ey + M * 0.4, 18, 3.5);
    }
    // the brackets, falling open and then off
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.round(M * 1.15) + mono;
    ctx.globalAlpha = bodyA * (1 - gone);
    ctx.fillStyle = rgba(ROOT_COL, 0.7);
    ctx.translate(0, gone * M * 1.4);
    ctx.rotate(0);
    ctx.fillText('{', ex - M * (1.3 + gone * 0.8), ey);
    ctx.fillText('}', ex + M * (1.3 + gone * 0.8), ey);
    ctx.restore();
    ctx.textBaseline = 'alphabetic';
    // the marquee, and the handles it is losing
    ctx.strokeStyle = rgba(ROOT_COL, 0.5);
    ctx.lineWidth = 1.4;
    ctx.setLineDash([7, 6]); ctx.lineDashOffset = -uiTime * 30;
    ctx.strokeRect(ex - M, ey - M, M * 2, M * 2);
    ctx.setLineDash([]);
    const HS = [[-M, -M], [0, -M], [M, -M], [M, 0], [M, M], [0, M], [-M, M], [-M, 0]];
    HS.forEach((h, i) => {
      if (i < Math.round(gone * HS.length)) return;   // this one has been taken
      ctx.fillStyle = 'rgba(8,3,12,0.9)';
      ctx.fillRect(ex + h[0] - 4, ey + h[1] - 4, 8, 8);
      ctx.strokeStyle = rgba(ROOT_COL, 0.85); ctx.lineWidth = 1.4;
      ctx.strokeRect(ex + h[0] - 4, ey + h[1] - 4, 8, 8);
    });
    ctx.restore();
  }

  /* The file. A diff header, then one removal per privilege — a '-' in the
     gutter and the line struck out as the strike travels across it, so each
     revocation is a beat you can hear the sound land on. */
  const rowH = clamp(H * 0.042, 26, 38);
  const topMax = Math.max(H * 0.3, Math.min(H * 0.52, H - 74 - rowH * 8.2));
  const top = clamp(ey + M + rowH * 1.7, Math.min(H * 0.44, topMax), topMax);
  ctx.font = '600 ' + Math.round(rowH * 0.52) + mono;
  let wid = 0;
  for (const t of ROOT_REVOKE) wid = Math.max(wid, ctx.measureText(t).width);
  const gx = W / 2 - wid / 2 - clamp(W * 0.03, 20, 54);

  if (last) drawRootLast(o, live);
  if (!last) {
  ctx.textAlign = 'left';
  ctx.font = '600 ' + Math.round(rowH * 0.46) + mono;
  ctx.fillStyle = rgba('#64748b', 0.6 * live);
  ctx.fillText('--- room.privileges', gx - 26, top - rowH * 0.85);

  for (let i = 0; i < ROOT_REVOKE.length; i++) {
    const y = top + i * rowH;
    const age = o.t - i * 0.55;
    const on = age >= 0;
    const cut = clamp(age / 0.3, 0, 1);           // the strike, travelling
    ctx.font = '600 ' + Math.round(rowH * 0.52) + mono;
    ctx.textAlign = 'right';
    ctx.fillStyle = on ? rgba('#f87171', 0.85 * live) : rgba('#64748b', 0.4 * live);
    ctx.fillText(on ? '-' : ' ', gx - 14, y);
    ctx.textAlign = 'left';
    ctx.fillStyle = rgba(ROOT_COL, (on ? 0.34 : 0.82) * live);
    ctx.fillText(ROOT_REVOKE[i], gx, y);
    if (!on) continue;
    const w = ctx.measureText(ROOT_REVOKE[i]).width;
    ctx.strokeStyle = rgba('#f87171', 0.85 * live);
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(gx, y - rowH * 0.16);
    ctx.lineTo(gx + w * cut, y - rowH * 0.16);
    ctx.stroke();
    if (cut < 1) continue;
    const fresh = clamp(1 - (age - 0.3) / 0.34, 0, 1);
    ctx.save();
    ctx.font = '700 ' + Math.round(rowH * 0.38) + "px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.letterSpacing = '0.16em';
    if (fresh > 0) {
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(gx + w + 30, y - rowH * 0.2, 26 * fresh, '#f87171', 0.5 * fresh * live);
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.fillStyle = rgba('#f87171', (0.7 + fresh * 0.3) * live);
    ctx.fillText('DENIED', gx + w + 16, y);
    ctx.restore();
  }

  /* The addition. Same gutter, same beat, nothing drawn through it — the one
     line in the patch that survives being read out. */
  const ga = o.t - ROOT_GRANT_T;
  if (ga >= 0) {
    const GRANT_COL = '#a3e635';
    const y = top + ROOT_REVOKE.length * rowH + rowH * 0.5;
    const rise = clamp(ga / 0.34, 0, 1);
    const a = live * rise;
    ctx.save();
    ctx.font = '600 ' + Math.round(rowH * 0.52) + mono;
    ctx.textAlign = 'right';
    ctx.fillStyle = rgba(GRANT_COL, 0.9 * a);
    ctx.fillText('+', gx - 14, y);
    ctx.textAlign = 'left';
    ctx.fillStyle = rgba(GRANT_COL, 0.95 * a);
    ctx.fillText(ROOT_GRANT, gx, y);
    const w2 = ctx.measureText(ROOT_GRANT).width;
    const fresh2 = clamp(1 - (ga - 0.34) / 0.5, 0, 1);
    ctx.font = '700 ' + Math.round(rowH * 0.38) + "px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.letterSpacing = '0.16em';
    if (fresh2 > 0) {
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(gx + w2 + 32, y - rowH * 0.2, 30 * fresh2, GRANT_COL, 0.55 * fresh2 * a);
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.fillStyle = rgba(GRANT_COL, (0.72 + fresh2 * 0.28) * a);
    ctx.fillText('GRANTED', gx + w2 + 16, y);
    ctx.restore();
    o.keyFrom = { x: gx + w2 + 96, y: y - rowH * 0.2 };
  }
  }

  /* What it has left to say. Everything else dims out from under the last
     line, and the caret after it keeps blinking, because nobody answers it. */
  if (o.said >= 0 && !last) {
    ctx.textAlign = 'center';
    ctx.font = '400 ' + Math.round(clamp(W * 0.019, 15, 23)) + mono;
    ctx.fillStyle = rgba(ROOT_COL, 0.72 * clamp(live, 0, 1));
    ctx.fillText(ROOT_LAST[o.said].s, W / 2,
                 clamp(top + ROOT_REVOKE.length * rowH + rowH * 2.2, 0, H - 74));
  }

  /* The key, coming out of the line that granted it and then staying put while
   everything else on screen is taken away — it is drawn at full strength no
   matter how far the rest has faded, because it is the one thing you leave
   with. When the room comes back it is handed to the run and starts following
   you; this is the same glyph, so it is visibly the same object. */
function drawGrantedKey(o) {
  const ga = o.t - ROOT_GRANT_T;
  if (ga < 0.5) return;
  const p = clamp((ga - 0.5) / 1.7, 0, 1);
  const ease = 1 - Math.pow(1 - p, 3);
  const from = o.keyFrom || { x: W / 2, y: H * 0.5 };
  const rest = { x: W - clamp(W * 0.13, 86, 155),
                 y: H - clamp(H * 0.23, 104, 178) };
  const x = lerp(from.x, rest.x, ease);
  const y = lerp(from.y, rest.y, ease) - Math.sin(ease * Math.PI) * H * 0.06;
  const r = 13 + ease * 15;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(x, y, r * (2.2 - ease) + 14, KEY_COL, 0.3 + (1 - p) * 0.3);
  ctx.restore();
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate((1 - ease) * 4.2 + Math.sin(uiTime * 1.5) * 0.07);
  keyGlyph(r, KEY_COL, 1);
  ctx.restore();
  if (FXO.parts && p < 1 && Math.random() < 0.5)
    spawnPart(x + rnd(12, -12), y + rnd(12, -12), rnd(50, -50), rnd(50, -50),
              rnd(2.2, 1), KEY_COL, rnd(0.4, 0.2), 0.9);
}

/* Nothing is left to revoke and nothing is left to argue with, so the file and
   the cursor are both gone and the question is alone on an empty page. It types
   itself in, and the caret after it goes on blinking, because nobody answers. */
function drawRootLast(o, live) {
  const line = ROOT_LAST[ROOT_LAST.length - 1].s;
  const fs = clamp(W * 0.03, 22, 46), y = H * 0.5;
  ctx.save();
  ctx.fillStyle = 'rgba(3,2,5,' + (0.9 * live) + ')';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = '400 ' + Math.round(fs) + "px 'JetBrains Mono', ui-monospace, monospace";
  const shown = line.slice(0, Math.min(line.length, Math.floor((o.saidT || 0) * 7)));
  ctx.fillStyle = rgba(ROOT_COL, 0.95 * live);
  ctx.fillText(shown, W / 2, y);
  const w = ctx.measureText(shown).width;
  if (Math.sin(uiTime * 5) > -0.2) {
    ctx.fillStyle = rgba(ROOT_COL, 0.8 * live);
    ctx.fillRect(W / 2 + w / 2 + 6, y - fs * 0.74, fs * 0.42, fs * 0.92);
  }
  ctx.restore();
}

  drawGrantedKey(o);

/* The status line, in the same bar the intrusion used to tell you it had
     taken the room off you — answering it, including who did it. */
  if (o.t > 22.2) {
    const a = clamp((o.t - 22.2) * 1.2, 0, 1);
    const bh = clamp(H * 0.055, 30, 44);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(163,230,53,0.16)';
    ctx.fillRect(0, H - bh, W, bh);
    ctx.fillStyle = 'rgba(163,230,53,0.5)';
    ctx.fillRect(0, H - bh, W, 1);
    const fs = clamp(bh * 0.34, 11, 15);
    ctx.font = '600 ' + Math.round(fs) + mono;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#a3e635';
    ctx.fillText('1 room restored  ·  ' + ROOT_REVOKE.length + ' revoked  ·  written',
                 clamp(W * 0.03, 14, 40), H - bh / 2 + fs * 0.36);
    ctx.textAlign = 'right';
    ctx.letterSpacing = '0.2em';
    ctx.font = '700 ' + Math.round(fs) + "px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillText('YOU', W - clamp(W * 0.03, 14, 40), H - bh / 2 + fs * 0.36);
    ctx.restore();
  }
  ctx.restore();
}
/* ---------------------------- what it leaves -------------------------------
   One command, taken off it. The line the intrusion used on you at the top of
   the route, now yours to enter once a run — and the room does not care who
   is typing it.
--------------------------------------------------------------------------- */
function rootCmdReady() {
  return state === 'play' && P.rootCmd > 0 && !intrusion && !rootOut;
}

function useRootCmd() {
  if (!rootCmdReady()) return;
  P.rootCmd--;
  P.rootCmdT = 1.5;
  let n = 0;
  for (const e of enemies) {
    if (e.dead || e.type === 'boss' || e.amalPart) continue;   // it is not a boss key
    e.dead = true; n++;
    burst(e.x, e.y, 14, ROOT_COL, 220, 2.8, 0.4);
  }
  ebullets.length = 0;
  drawFlashT = 0.4; shake(1.0);
  Audio_.boom(); Audio_.noise(0.5, 0.3, 2000, 200, 3);
  ringFx(P.x, P.y, 24, 900, ROOT_COL, 1.1, 8);
  floatText(P.x, P.y - 48, 'room.clear()', ROOT_COL, 17);
  banner(n + ' REMOVED', ROOT_COL, 2.0);
}

/* ------------------------------- the key -----------------------------------
   It is the only run item that does nothing until it is somewhere specific, so
   it cannot be a line of HUD text you stop reading after ten seconds — it is a
   thing in the room, following you, in the way just enough to be remembered.

   One shape, drawn in one place: the finale mints it and the run carries it,
   and if those were two drawings the hand-off would read as two props. Built
   from the deep sectors' hardware vocabulary — a hex plate for the bow —
   because that is where the door it opens is going to be.
--------------------------------------------------------------------------- */
const KEY_COL = '#a3e635';

// origin at the middle of the shaft, pointing +x. r is half its length.
function keyGlyph(r, col, a) {
  ctx.lineWidth = Math.max(1.1, r * 0.09);
  ctx.strokeStyle = rgba(col, a);
  ctx.fillStyle = rgba(col, a * 0.2);
  poly(-r * 0.55, 0, r * 0.44, 6, Math.PI / 6);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(4,9,4,0.92)';
  ctx.beginPath(); ctx.arc(-r * 0.55, 0, r * 0.18, 0, TAU); ctx.fill();
  ctx.strokeStyle = rgba(col, a * 0.85);
  ctx.beginPath(); ctx.arc(-r * 0.55, 0, r * 0.18, 0, TAU); ctx.stroke();
  ctx.fillStyle = rgba(col, a * 0.9);
  ctx.fillRect(-r * 0.16, -r * 0.08, r * 1.04, r * 0.16);
  // the bit: teeth on the underside, nearest the tip
  ctx.fillRect(r * 0.42, 0, r * 0.14, r * 0.36);
  ctx.fillRect(r * 0.66, 0, r * 0.14, r * 0.26);
  ctx.fillStyle = rgba('#f7fee7', a);
  ctx.fillRect(r * 0.86, -r * 0.08, r * 0.06, r * 0.16);
}

let keyItem = null;
function spawnKeyItem(x, y) { keyItem = { x, y, vx: 0, vy: 0, ang: 0 }; }

/* It trails your shoulder on a spring rather than orbiting at a fixed radius:
   an orbit is jewellery, a lag is an escort. */
function keyTick(dt) {
  if (!P.key || rootOut || rootDeath) return;   // the finale is holding it
  // carried but not on the floor — a reset cleared it, so put it back
  if (!keyItem) spawnKeyItem(P.x - Math.cos(P.ang) * 30, P.y - Math.sin(P.ang) * 30);
  const k = keyItem;
  const ca = Math.cos(P.ang), sa = Math.sin(P.ang);
  const tx = P.x - ca * 46 - sa * 26, ty = P.y - sa * 46 + ca * 26;
  k.vx += (tx - k.x) * 18 * dt;      // heavier: it lags further and swings wide
  k.vy += (ty - k.y) * 18 * dt;
  const damp = Math.pow(0.004, dt);
  k.vx *= damp; k.vy *= damp;
  k.x += k.vx * dt; k.y += k.vy * dt;
  const sp = Math.hypot(k.vx, k.vy);
  const want = sp > 30 ? Math.atan2(k.vy, k.vx) : k.ang + 0.6 * dt;
  let d = want - k.ang;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  k.ang += d * Math.min(1, 5 * dt);
  if (FXO.parts && sp > 200 && Math.random() < 0.3)
    spawnPart(k.x, k.y, rnd(30, -30), rnd(30, -30), rnd(1.8, 0.9),
              KEY_COL, rnd(0.32, 0.14), 0.9);
}

const KEY_R = 30;                  // giant: it does not fit anything you own

function drawKeyItem() {
  if (!keyItem || !P.key || rootOut || rootDeath) return;   // the finale holds it
  const k = keyItem, bob = Math.sin(uiTime * 1.7) * 2.6;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(k.x, k.y + bob, KEY_R * 1.7, KEY_COL, 0.24 + Math.sin(uiTime * 2) * 0.05);
  ctx.restore();
  // heavy enough to have a shadow on the floor and to scrape along it
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(k.x, k.y + KEY_R * 0.42, KEY_R * 0.8, KEY_R * 0.2, k.ang, 0, TAU);
  ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(k.x, k.y + bob);
  ctx.rotate(k.ang);
  keyGlyph(KEY_R, KEY_COL, 0.95);
  ctx.restore();
  if (P.key > 1) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = "700 10px 'JetBrains Mono', ui-monospace, monospace";
    ctx.fillStyle = rgba(KEY_COL, 0.9);
    ctx.fillText('×' + P.key, k.x, k.y + bob - 17);
    ctx.restore();
  }
}

function drawRootCmdHud() {
  if (!P.rootCmd && !(P.rootCmdT > 0)) return;
  ctx.save();
  ctx.textAlign = 'left';
  ctx.font = "600 10px 'JetBrains Mono', ui-monospace, monospace";
  const x = 18, y = H - 96;
  ctx.fillStyle = P.rootCmd > 0 ? rgba(ROOT_COL, 0.9) : 'rgba(100,116,139,0.5)';
  ctx.fillText(P.rootCmd > 0 ? 'root.clear()  [V]' : 'root.clear()  spent', x, y);
  ctx.restore();
}

/* ============================== THE FOUNDER ================================
   Turn up to the amalgam holding ROOT's key and the fight does not happen.
   The thing the dev bolted together comes apart along its own seams, and
   there is a cockpit in it, and there is somebody in the cockpit.

   He has never seen outside this room. The dev knows what it is, ROOT knows
   what it is, the bookkeeper half-knows — he does not, and he is not lying
   about it. The arena is where he lives and the people behind him are his,
   and both of those things are true right up until you open a door he told
   you not to.

   Nothing here scales off damage. The tribunal is won by refusing help while
   you are dying in front of people who have been told nobody survives without
   him, which is a question of nerve and not of build.
--------------------------------------------------------------------------- */
const FOUND_COL = '#fcd34d';
const CROWD_COL = '#fde68a';

/* --------------------------- the shared figures ----------------------------
   One man, drawn in one place. He is the pilot in the chassis, the host at the
   tear, the pleasant voice at the door and the shape on the throne, and if any
   of those were a separate drawing the route would read as four characters.

   He is a person the machine was built around, so the harness never comes off:
   the shoulder yoke, the spine cabling and the hip plate are the amalgam's own
   hardware still bolted to him, and that is what he goes back to the seat
   wearing. The only thing that changes between scenes is how much he is
   sitting up.
--------------------------------------------------------------------------- */
const CAMP_DARK = '#2a1c06';
const CAMP_EMBER = '#f59e0b';
const COLD_COL = '#94a3b8';

/* s is shoulder-to-hip in px. sit: 0 standing, 1 folded into a seat.
   open: how wide his arms are (the invitation). */
function founderFigure(x, y, s, o) {
  o = o || {};
  const col = o.col || FOUND_COL;
  const a = o.a === undefined ? 1 : o.a;
  const sit = o.sit || 0, open = o.open || 0;
  const lw = Math.max(1.2, s * 0.085);
  ctx.save();
  ctx.translate(x, y);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const hipY = s * (0.5 - sit * 0.16);
  const headY = -s * (0.72 - sit * 0.1);

  // the cabling first, so the hardware sits over it
  ctx.strokeStyle = rgba(col, a * 0.3);
  ctx.lineWidth = lw * 0.7;
  for (let k = -1; k <= 1; k += 2) {
    ctx.beginPath();
    ctx.moveTo(k * s * 0.3, -s * 0.3);
    ctx.quadraticCurveTo(k * s * 0.62, s * 0.06, k * s * 0.42, hipY + s * 0.16);
    ctx.stroke();
  }

  // legs — folded when seated, planted when not
  ctx.strokeStyle = rgba(col, a * 0.85);
  ctx.lineWidth = lw;
  if (sit > 0.5) {
    ctx.beginPath();
    ctx.moveTo(-s * 0.16, hipY); ctx.lineTo(-s * 0.5, hipY + s * 0.1);
    ctx.lineTo(-s * 0.5, hipY + s * 0.46);
    ctx.moveTo(s * 0.16, hipY); ctx.lineTo(s * 0.5, hipY + s * 0.1);
    ctx.lineTo(s * 0.5, hipY + s * 0.46);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(-s * 0.14, hipY); ctx.lineTo(-s * 0.2, hipY + s * 0.52);
    ctx.moveTo(s * 0.14, hipY); ctx.lineTo(s * 0.22, hipY + s * 0.52);
    ctx.stroke();
  }

  // torso
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.42); ctx.lineTo(0, hipY);
  ctx.stroke();

  // arms. open is the invitation: palms out, low, never above the shoulder
  const ax = s * (0.34 + open * 0.3), ay = -s * 0.34 + s * (0.34 - open * 0.24);
  ctx.beginPath();
  ctx.moveTo(-s * 0.26, -s * 0.34); ctx.lineTo(-ax, ay);
  ctx.moveTo(s * 0.26, -s * 0.34); ctx.lineTo(ax, ay);
  ctx.stroke();

  // the yoke: the amalgam's shoulder plate, still on him
  ctx.fillStyle = rgba(col, a * 0.22);
  ctx.strokeStyle = rgba(col, a);
  ctx.lineWidth = lw * 0.9;
  ctx.beginPath();
  ctx.moveTo(-s * 0.34, -s * 0.36); ctx.lineTo(-s * 0.24, -s * 0.46);
  ctx.lineTo(s * 0.24, -s * 0.46);  ctx.lineTo(s * 0.34, -s * 0.36);
  ctx.lineTo(s * 0.2, -s * 0.26);   ctx.lineTo(-s * 0.2, -s * 0.26);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // hip plate, hex, same hardware as the deep sectors
  poly(0, hipY, s * 0.2, 6, Math.PI / 6);
  ctx.fillStyle = rgba(col, a * 0.16); ctx.fill(); ctx.stroke();

  // head, and the lamp on it — he is the light source in every room he is in
  ctx.beginPath(); ctx.arc(0, headY, s * 0.2, 0, TAU);
  ctx.fillStyle = rgba(CAMP_DARK, a * 0.9); ctx.fill();
  ctx.stroke();
  if (o.lamp !== false) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(0, headY, s * 0.9, col, a * 0.3);
    ctx.restore();
    ctx.fillStyle = rgba('#fffbeb', a);
    ctx.fillRect(-s * 0.07, headY - s * 0.26, s * 0.14, s * 0.08);
  }
  ctx.restore();
}

/* His people: the same silhouette with the hardware taken off, because they
   were never in the machine. Facing you while they are still his; drawn from
   behind, and grey, once they are not. */
function crowdFigure(x, y, s, held, hard, a) {
  const col = held ? CROWD_COL : '#64748b';
  const lw = Math.max(1.1, s * 0.09);
  ctx.save();
  ctx.translate(x, y);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = rgba(col, a * (hard > 0 ? 1 : 0.8));
  ctx.lineWidth = hard > 0 ? lw * 1.5 : lw;
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.34); ctx.lineTo(0, s * 0.34);
  ctx.moveTo(-s * 0.16, s * 0.34); ctx.lineTo(-s * 0.2, s * 0.8);
  ctx.moveTo(s * 0.16, s * 0.34);  ctx.lineTo(s * 0.2, s * 0.8);
  ctx.stroke();
  if (held) {
    // shoulders squared to you, arms down: attention
    ctx.beginPath();
    ctx.moveTo(-s * 0.34, -s * 0.2); ctx.lineTo(s * 0.34, -s * 0.2);
    ctx.moveTo(-s * 0.32, -s * 0.2); ctx.lineTo(-s * 0.36, s * 0.26);
    ctx.moveTo(s * 0.32, -s * 0.2);  ctx.lineTo(s * 0.36, s * 0.26);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -s * 0.56, s * 0.21, 0, TAU);
    ctx.fillStyle = rgba(col, a * 0.28); ctx.fill(); ctx.stroke();
    // two lit eyes, so a full tier of them reads as looking at you
    ctx.fillStyle = rgba('#fffbeb', a * 0.9);
    ctx.fillRect(-s * 0.11, -s * 0.6, s * 0.07, s * 0.05);
    ctx.fillRect(s * 0.04, -s * 0.6, s * 0.07, s * 0.05);
  } else {
    // turned away: narrower, head bowed, no face
    ctx.beginPath();
    ctx.moveTo(-s * 0.24, -s * 0.18); ctx.lineTo(s * 0.24, -s * 0.18);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -s * 0.52, s * 0.19, Math.PI * 0.12, Math.PI * 0.88);
    ctx.stroke();
  }
  ctx.restore();
}

/* ------------------------------ the camp -----------------------------------
   The place behind the tear, drawn once and reused: through the slit, behind
   the choice, and under the tribunal — because the tribunal IS this room with
   the chairs turned round, and it only lands if you recognise it.

   Built from the deep sectors' plate-and-hex hardware, but warm: every edge is
   lit from a fire on the floor rather than from a screen. Nothing here is a
   menu. There are no straight horizons — shelters lean on each other.
--------------------------------------------------------------------------- */
function campScene(w, h, a, seed) {
  const t = uiTime;
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, rgba('#120b02', a));
  g.addColorStop(0.55, rgba(CAMP_DARK, a * 0.95));
  g.addColorStop(1, rgba('#3b2708', a));
  ctx.fillStyle = g;
  ctx.fillRect(-w / 2, -h / 2, w, h);

  const floor = h * 0.24;
  // the far wall: plate, bolted, the same hardware the fight is made of
  ctx.strokeStyle = rgba(CAMP_EMBER, a * 0.18);
  ctx.lineWidth = 1;
  for (let x = -w / 2; x < w / 2; x += 46) {
    ctx.beginPath(); ctx.moveTo(x, -h / 2); ctx.lineTo(x, floor); ctx.stroke();
  }
  ctx.strokeStyle = rgba(CAMP_EMBER, a * 0.13);
  for (let y = -h / 2; y < floor; y += 34) {
    ctx.beginPath(); ctx.moveTo(-w / 2, y); ctx.lineTo(w / 2, y); ctx.stroke();
  }

  // shelters, leaning: hex plate roofs on scavenged legs
  const shel = [[-0.34, 1.0, -0.06], [0.06, 0.82, 0.05], [0.4, 1.14, -0.03],
                [-0.12, 0.6, 0.08], [0.28, 0.58, -0.07]];
  for (let i = 0; i < shel.length; i++) {
    const [fx, sc, tilt] = shel[i];
    const bx = fx * w, by = floor - h * 0.02;
    const sw = w * 0.15 * sc, sh = h * 0.2 * sc;
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(tilt);
    ctx.fillStyle = rgba('#1a1002', a * 0.95);
    ctx.strokeStyle = rgba(CAMP_EMBER, a * 0.5);
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-sw / 2, 0); ctx.lineTo(-sw * 0.36, -sh);
    ctx.lineTo(sw * 0.36, -sh); ctx.lineTo(sw / 2, 0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // a lit doorway in some of them, so the place is inhabited
    if (i % 2 === 0) {
      ctx.fillStyle = rgba(CAMP_EMBER, a * (0.3 + Math.sin(t * 1.4 + i) * 0.08));
      ctx.fillRect(-sw * 0.1, -sh * 0.52, sw * 0.2, sh * 0.52);
    }
    ctx.restore();
  }

  // the fire, and what it does to the floor
  const fx2 = -w * 0.06, fy = floor + h * 0.14;
  const flick = 0.8 + Math.sin(t * 7.1) * 0.12 + Math.sin(t * 3.3) * 0.08;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(fx2, fy, h * 0.4 * flick, CAMP_EMBER, a * 0.3);
  drawGlow(fx2, fy, h * 0.13 * flick, '#fde68a', a * 0.5);
  ctx.restore();
  ctx.fillStyle = rgba('#0d0801', a);
  ctx.fillRect(-w / 2, floor, w, h / 2 - floor);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const fl = ctx.createRadialGradient(fx2, fy, 0, fx2, fy, w * 0.5);
  fl.addColorStop(0, rgba(CAMP_EMBER, a * 0.34));
  fl.addColorStop(1, rgba(CAMP_EMBER, 0));
  ctx.fillStyle = fl;
  ctx.fillRect(-w / 2, floor, w, h / 2 - floor);
  ctx.restore();
  // the fire itself: a few plates stood on end around a hot centre
  ctx.strokeStyle = rgba(CAMP_EMBER, a * 0.8);
  ctx.lineWidth = 2;
  for (let k = -2; k <= 2; k++) {
    ctx.beginPath();
    ctx.moveTo(fx2 + k * h * 0.035, fy + h * 0.02);
    ctx.lineTo(fx2 + k * h * 0.02, fy - h * 0.05 * flick);
    ctx.stroke();
  }

  // people, sitting round it with their backs to you — nobody is on duty here
  const sit = [[-0.26, 0.02], [-0.15, -0.01], [0.02, 0.03], [0.14, -0.01], [0.24, 0.02]];
  for (let i = 0; i < sit.length; i++) {
    const ps = h * 0.055;
    const px = fx2 + sit[i][0] * w * 0.7, py = fy + sit[i][1] * h;
    ctx.save();
    ctx.globalAlpha = a * 0.85;
    crowdFigure(px, py - ps * 0.6, ps, false, 0, 1);
    ctx.restore();
  }
  // the corners go down, so the fire is the only bright thing in here
  const vg = ctx.createRadialGradient(fx2, fy - h * 0.1, h * 0.12,
                                      fx2, fy - h * 0.1, Math.max(w, h) * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(0.62, rgba('#090500', a * 0.5));
  vg.addColorStop(1, rgba('#050300', a * 0.94));
  ctx.fillStyle = vg;
  ctx.fillRect(-w / 2, -h / 2, w, h);

  // and a couple of embers going up, because the room has air in it
  ctx.fillStyle = rgba('#fde68a', a * 0.6);
  for (let i = 0; i < 7; i++) {
    const ph = (t * 0.34 + i * 0.31) % 1;
    ctx.globalAlpha = a * (1 - ph) * 0.7;
    ctx.fillRect(fx2 + Math.sin(t * 1.6 + i * 2.1) * w * 0.08,
                 fy - ph * h * 0.5, 2, 2);
  }
  ctx.globalAlpha = 1;
}

/* ------------------------------ the opening ------------------------------- */
const OPEN_T = { unbolt: 2.6, drift: 5.4, cockpit: 7.2, out: 9.4, done: 17.6 };

const FOUND_HELLO = [
  { t: 9.8,  s: 'Oh — hello. Give me a moment, it sticks.' },
  { t: 12.2, s: 'Nobody has opened that in a very long time.' },
  { t: 14.4, s: 'You are hurt. Come inside, we have somewhere for that.' }
];

let amalOpen = null;

function startAmalOpen(parts) {
  amalOpen = { t: 0, said: -1, parts, out: 0 };
  banner('THE KEY TURNS', FOUND_COL, 3.4);
  drawFlashT = 0.4; shake(1.6);
  Audio_.boom();
}

function amalOpenTick(dt) {
  const o = amalOpen;
  o.t += dt;
  // the limbs let go of the frame and drift off it
  if (o.t > OPEN_T.unbolt) {
    const k = clamp((o.t - OPEN_T.unbolt) / (OPEN_T.drift - OPEN_T.unbolt), 0, 1);
    for (const p of o.parts) {
      if (!p.e) continue;
      p.e.x += p.dx * dt * 60 * k;
      p.e.y += p.dy * dt * 60 * k;
      p.e.ang = (p.e.ang || 0) + p.spin * dt;
      if (Math.random() < 0.25)
        spawnPart(p.e.x + rnd(p.r, -p.r), p.e.y + rnd(p.r, -p.r),
                  rnd(60, -60), rnd(60, -60), rnd(3, 1.4), AMAL_COL, rnd(0.5, 0.2), 0.94);
    }
  }
  if (o.t > OPEN_T.out) o.out = Math.min(1, o.out + dt * 0.7);
  for (let i = 0; i < FOUND_HELLO.length; i++)
    if (o.t >= FOUND_HELLO[i].t && o.said < i) {
      o.said = i; o.saidT = 0;
      Audio_.tone(300 + i * 40, 0.06, 'sine', 0.04, 600);
    }
  o.saidT = (o.saidT || 0) + dt;
  if (o.t >= OPEN_T.done) {
    for (const p of o.parts) if (p.e) p.e.dead = true;
    amalOpen = null;
    amalgam = null;
    bossAlive = false;
    enemies.length = 0; ebullets.length = 0;
    arenaReset();
    betweenWaves = 3.0;
    /* invited: the first one is not on the health gate. He has just said
       come inside and startAmalgam healed you on the way in, so the door
       would have stayed shut on his own invitation. */
    tear = { visits: 0, open: false, cd: 2.5, at: null, shown: 0, door: null,
             invited: true };
    Save.profile.metFounder = true;
    Save.writeLocal(); Save.flush();
    banner('THE FOUNDER', FOUND_COL, 4.0);
    checkLevel();
  }
}

/* The assembly ran forwards; this runs backwards. Same chassis, same seams,
   same bolts — every one of them releasing instead of clamping, which is the
   only way the moment reads as the machine being opened rather than broken.

   The key is the instrument and it is far too big for any lock, so it is not
   turned: it is driven into the sternum seam like a bar and levered. Then the
   plates let go, the frame hangs empty, the cockpit irises, and there is a
   person in there who was never meant to be seen. */
function drawAmalOpen() {
  if (!amalOpen) return;
  const o = amalOpen, t = o.t;
  const cx = W / 2;
  const S = Math.min(W * 0.3, H * 0.38);         // half-height of the chassis

  // beats
  const drive = clamp(t / 1.5, 0, 1);                       // the key comes down
  const bite  = clamp((t - 1.5) / 1.1, 0, 1);                // and is levered
  const let_  = clamp((t - OPEN_T.unbolt) / 2.0, 0, 1);      // plates let go
  const hollow= clamp((t - OPEN_T.drift) / 1.4, 0, 1);       // frame stands empty
  const iris  = clamp((t - OPEN_T.cockpit) / 1.6, 0, 1);     // cockpit opens
  const out   = clamp((t - OPEN_T.out) / 2.2, 0, 1);         // he comes out
  const warm  = clamp((t - OPEN_T.cockpit) / 4.0, 0, 1);     // the light changes
  // the shot rises as he climbs down, so he ends up standing on floor
  const cy = H * 0.47 - clamp((t - OPEN_T.out) / 2.2, 0, 1) * S * 0.34;

  ctx.save();
  // the room goes out; what replaces it is firelight, not darkness
  ctx.fillStyle = 'rgba(4,3,2,' + clamp(t * 0.5, 0, 0.94) + ')';
  ctx.fillRect(0, 0, W, H);
  if (warm > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(cx, cy + S * 0.1, S * 2.4, CAMP_EMBER, 0.1 * warm);
    ctx.restore();
  }
  ctx.textAlign = 'center';

  /* The chassis: eight plates around a cavity, each one hinged on its own
     bolt. They are drawn from the cavity outward so the thing reads as a shell
     with a hole in it rather than a pile of panels. */
  // the frame the plates are bolted to: it stays, and it is what hangs empty
  ctx.save();
  ctx.globalAlpha = 0.9 - hollow * 0.15;
  ctx.strokeStyle = rgba(AMAL_COL, 0.5 + hollow * 0.3);
  ctx.lineWidth = 3.4;
  ctx.fillStyle = 'rgba(10,7,4,0.9)';
  poly(cx, cy, S * 1.06, 6, Math.PI / 6);
  ctx.fill(); ctx.stroke();
  ctx.lineWidth = 1.6;
  ctx.strokeStyle = rgba(AMAL_COL, 0.28);
  for (let k = -3; k <= 3; k++) {          // ribs
    const ry = cy + k * S * 0.28;
    const half = S * 0.92 * Math.sqrt(Math.max(0, 1 - Math.pow(k / 3.6, 2)));
    ctx.beginPath(); ctx.moveTo(cx - half, ry); ctx.lineTo(cx + half, ry); ctx.stroke();
  }
  // the sternum seam the key goes into, and it splits as it is levered
  ctx.strokeStyle = rgba(bite > 0 ? KEY_COL : AMAL_COL, 0.7);
  ctx.lineWidth = 2 + bite * 4;
  ctx.beginPath();
  ctx.moveTo(cx, cy - S * 1.02); ctx.lineTo(cx, cy - S * 0.42);
  ctx.stroke();
  ctx.restore();

  const PLATE = [
    [-0.62, -0.72, 0.52, 0.42], [0.10, -0.72, 0.52, 0.42],
    [-0.80, -0.24, 0.44, 0.56], [0.36, -0.24, 0.44, 0.56],
    [-0.62,  0.36, 0.52, 0.40], [0.10,  0.36, 0.52, 0.40],
    [-0.26, -0.96, 0.52, 0.26], [-0.26,  0.74, 0.52, 0.26]
  ];
  const ease = 1 - Math.pow(1 - let_, 2.2);
  for (let i = 0; i < PLATE.length; i++) {
    const [px, py, pw, ph] = PLATE[i];
    const ang = Math.atan2(py + ph / 2, px + pw / 2);
    const fly = ease * (0.12 + (i % 3) * 0.07);
    const x = cx + (px + pw / 2) * S + Math.cos(ang) * S * fly * 0.9;
    const y = cy + (py + ph / 2) * S + Math.sin(ang) * S * fly * 0.9 + ease * S * 0.14;
    const rot = ease * (i % 2 ? 0.5 : -0.42) * (1 + (i % 3) * 0.3);
    ctx.save();
    ctx.globalAlpha = 1 - hollow * 0.55;
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = rgba('#181009', 0.98);
    ctx.strokeStyle = rgba(AMAL_COL, 0.85 - ease * 0.25);
    ctx.lineWidth = 2.4;
    roundRect(-pw * S / 2, -ph * S / 2, pw * S, ph * S, S * 0.012);
    ctx.fill(); ctx.stroke();
    // armour, not a card: a bevel line inside every plate
    ctx.strokeStyle = rgba(AMAL_COL, 0.3);
    ctx.lineWidth = 1;
    roundRect(-pw * S / 2 + S * 0.03, -ph * S / 2 + S * 0.03,
              pw * S - S * 0.06, ph * S - S * 0.06, S * 0.01);
    ctx.stroke();
    // the bolts, and the moment they stop holding
    const bn = 3;
    for (let b = 0; b < bn; b++) {
      const bx = -pw * S / 2 + pw * S * (b + 0.5) / bn;
      const by = py < 0 ? ph * S / 2 - S * 0.05 : -ph * S / 2 + S * 0.05;
      const gone = clamp(ease * 3 - i * 0.22 - b * 0.1, 0, 1);
      ctx.globalAlpha = (1 - hollow * 0.55) * (1 - gone * 0.7);
      poly(bx, by, S * 0.028, 6, Math.PI / 6);
      ctx.fillStyle = rgba(gone > 0.4 ? '#5b4a2a' : AMAL_COL, 0.5);
      ctx.strokeStyle = rgba(gone > 0.4 ? '#5b4a2a' : AMAL_COL, 0.9);
      ctx.lineWidth = 1.4;
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  /* The cavity. Dark while it is shut, then an iris of six leaves, then a lit
     cockpit with a person folded into it. */
  const cr = S * 0.34;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(cx, cy, cr * (1.4 + iris * 1.6), iris > 0 ? FOUND_COL : AMAL_COL,
           0.12 + iris * 0.34);
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, cr, 0, TAU);
  ctx.fillStyle = rgba('#08060b', 0.95); ctx.fill();
  ctx.strokeStyle = rgba(iris > 0 ? FOUND_COL : AMAL_COL, 0.9);
  ctx.lineWidth = 3; ctx.stroke();

  if (iris > 0) {
    // the inside, seen once the leaves are back
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, cr - 2, 0, TAU); ctx.clip();
    ctx.fillStyle = rgba('#241703', 0.95);
    ctx.fillRect(cx - cr, cy - cr, cr * 2, cr * 2);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(cx, cy + cr * 0.2, cr * 1.3, CAMP_EMBER, 0.3 * iris);
    ctx.restore();
    // the seat harness he is strapped into, and him in it
    ctx.strokeStyle = rgba(FOUND_COL, 0.4);
    ctx.lineWidth = 2;
    for (let k = -1; k <= 1; k += 2) {
      ctx.beginPath();
      ctx.moveTo(cx + k * cr * 0.55, cy - cr * 0.7);
      ctx.quadraticCurveTo(cx + k * cr * 0.3, cy, cx + k * cr * 0.5, cy + cr * 0.75);
      ctx.stroke();
    }
    ctx.globalAlpha = 1 - out;
    founderFigure(cx, cy - cr * 0.05, cr * 0.86, { sit: 1, a: 1 });
    ctx.restore();
  }
  // the leaves, closing off the view until they retract
  if (iris < 1) {
    ctx.save();
    ctx.translate(cx, cy);
    for (let k = 0; k < 6; k++) {
      ctx.save();
      ctx.rotate(k * TAU / 6 + iris * 0.5);
      ctx.translate(0, -iris * cr * 1.1);
      ctx.fillStyle = rgba('#171208', 0.98);
      ctx.strokeStyle = rgba(AMAL_COL, 0.7);
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(cr * 0.62, -cr * 0.36);
      ctx.lineTo(cr * 0.62, -cr * 1.02);
      ctx.lineTo(-cr * 0.62, -cr * 1.02);
      ctx.lineTo(-cr * 0.62, -cr * 0.36);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  /* The key. Driven into the sternum seam and levered — it never turns, it is
     far too big to turn, and that is the joke the whole route is built on. */
  if (out < 1) {
    const kr = Math.min(S * 0.34, H * 0.15);
    const lever = bite * 0.5;
    // tip on the seam just clear of the cavity, body above it
    const seam = cy - cr - S * 0.06;
    const kx = cx, ky = seam - kr * 0.92 - (1 - drive) * H * 0.8;
    ctx.save();
    ctx.globalAlpha = 1 - out;
    ctx.translate(kx, ky + bite * S * 0.1);
    ctx.rotate(Math.PI / 2 + lever);            // tip down, into the seam
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(0, 0, kr * 1.4, KEY_COL, 0.22 + bite * 0.2);
    ctx.restore();
    keyGlyph(kr, KEY_COL, 1);
    ctx.restore();
    if (drive >= 1 && bite < 1 && FXO.parts && Math.random() < 0.6)
      spawnPart(cx + rnd(S * 0.2, -S * 0.2), cy - S * 0.5,
                rnd(160, -160), rnd(40, -220), rnd(2.6, 1.2),
                KEY_COL, rnd(0.4, 0.2), 0.92);
  }

  /* Him, out of it. He does not leap down — he climbs out stiffly, because he
     has been in there long enough that the machine was built around him. */
  if (out > 0) {
    const oe = 1 - Math.pow(1 - out, 2);
    const fsz = S * (0.42 + oe * 0.16);
    // he climbs down to the floor, and the floor is above what he is saying
    const floor = H - 150 - fsz * 1.05;
    const fx = cx, fy = Math.min(cy + oe * S * 0.62, floor);
    ctx.save();
    ctx.globalAlpha = Math.min(1, out * 2);
    founderFigure(fx, fy, fsz, {
      sit: 1 - oe,
      open: clamp((t - FOUND_HELLO[2].t + 0.6) / 1.4, 0, 1)   // the invitation
    });
    ctx.restore();
  }

  /* The words sit on their own ground. Without this the cockpit light and
     whoever is standing in front of it read straight through the line. */
  if (o.said >= 0 || t > OPEN_T.unbolt) {
    const bed = ctx.createLinearGradient(0, H - 168, 0, H);
    bed.addColorStop(0, 'rgba(4,3,2,0)');
    bed.addColorStop(0.42, 'rgba(4,3,2,0.86)');
    bed.addColorStop(1, 'rgba(4,3,2,0.96)');
    ctx.fillStyle = bed;
    ctx.fillRect(0, H - 168, W, 168);
  }

  ctx.save();
  ctx.letterSpacing = '0.24em';
  ctx.font = "700 10px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.fillStyle = rgba(t < OPEN_T.cockpit ? KEY_COL : FOUND_COL, 0.55);
  ctx.fillText(t < OPEN_T.unbolt ? 'THE KEY DOES NOT TURN'
             : t < OPEN_T.cockpit ? 'IT LEVERS'
             : t < OPEN_T.out ? 'THERE IS SOMEBODY IN IT' : 'THE FOUNDER',
               cx, H - 58);
  ctx.restore();

  if (o.said >= 0) {
    const ln = FOUND_HELLO[o.said].s;
    const shown = ln.slice(0, Math.min(ln.length, Math.floor(o.saidT * 34)));
    ctx.font = '400 ' + Math.min(20, Math.max(14, W * 0.017)) +
               "px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = rgba(FOUND_COL, 0.92);
    ctx.fillText(shown, W / 2, H - 118);
  }
  ctx.restore();
}

/* -------------------------------- the tear --------------------------------
   It opens when you are hurt, because that is when it is worth something. It
   heals, nothing follows you in, and he gives you a little of what he has
   every time. Four visits of that, and then you are shown who it is closed
   to, which is the only thing this whole sequence is for.
--------------------------------------------------------------------------- */
const TEAR_HP = 0.42;              // it notices you below this
const TEAR_R = 62;
const TEAR_CD = 14;

const TEAR_SAY = [
  'Sit down, you are bleeding. There — better.',
  'We do not get many. Most of them do not last the first room.',
  'You will like it here. Everyone does, eventually.',
  'Do not mind the noise outside. It is not for us.'
];
const TEAR_GIFT = [
  { s: 'have some of mine', f: () => { P.maxHp += 20; P.hp = P.maxHp; } },
  { s: 'and a little speed', f: () => { P.speed *= 1.08; } },
  { s: 'keep this one',      f: () => { P.dmg *= 1.12; } },
  { s: 'you have earned it', f: () => { credits += 400; } }
];

let tear = null, choice = null;

function tearTick(dt) {
  if (!tear || choice || tribunal || amalOpen) return;
  tear.cd = Math.max(0, tear.cd - dt);
  if (!tear.open) {
    // it only turns up when it is worth turning up
    if (tear.cd <= 0 && (tear.invited || P.hp / P.maxHp < TEAR_HP) && state === 'play') {
      const a = Math.atan2(P.y - (arena.y0 + arena.y1) / 2,
                           P.x - (arena.x0 + arena.x1) / 2) + rnd(0.7, -0.7);
      tear.at = { x: clamp(P.x + Math.cos(a) * 330, arena.x0 + 90, arena.x1 - 90),
                  y: clamp(P.y + Math.sin(a) * 330, arena.y0 + 90, arena.y1 - 90) };
      tear.open = true;
      Audio_.tone(520, 0.16, 'sine', 0.06, 760);
      ringFx(tear.at.x, tear.at.y, 8, 260, FOUND_COL, 0.7, 5);
      banner(tear.visits >= TEAR_SAY.length ? 'THE DOOR IS OPEN'
                                            : 'SOMEWHERE FOR THAT', FOUND_COL, 2.6);
    }
    return;
  }
  if (len(P.x - tear.at.x, P.y - tear.at.y) > TEAR_R) return;

  // inside
  if (tear.visits < TEAR_SAY.length) {
    tear.invited = false;              // after the first, you have to need it
    startCampVisit(tear.visits++);
  } else {
    startChoice();
  }
}

/* Not a door. The room's own wall pulled apart, with a whole other place
   behind the gap — you can see the fire and the people from out here, which is
   the entire reason you walk toward it while something is shooting at you.

   The edge is torn rather than cut: an irregular rim that breathes, with the
   room's grid ending raggedly against it. Warm inside, cold out. */
function tearPath(rx, ry, wob, seed) {
  ctx.beginPath();
  const N = 26;
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * TAU;
    const w = 1 + Math.sin(a * 3 + seed) * wob + Math.sin(a * 7 - seed * 1.7) * wob * 0.6;
    const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

function drawTear() {
  if (!tear || !tear.open || !tear.at) return;
  const x = tear.at.x, y = tear.at.y;
  const t = uiTime;
  const breathe = 1 + Math.sin(t * 1.6) * 0.03;
  const rx = TEAR_R * 0.58 * breathe, ry = TEAR_R * breathe;
  const last = tear.visits >= TEAR_SAY.length;      // the fifth one is different

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(x, y, TEAR_R * 2.1, last ? COLD_COL : FOUND_COL,
           0.2 + Math.sin(t * 2.4) * 0.05);
  ctx.restore();

  ctx.save();
  ctx.translate(x, y);

  // the camp, seen through the gap — the place is visible before you commit
  ctx.save();
  tearPath(rx, ry, 0.05, t * 0.6);
  ctx.clip();
  ctx.save();
  ctx.scale(0.5, 0.5);                    // it is a long way off through there
  campScene(TEAR_R * 5, TEAR_R * 5.4, last ? 0.45 : 1, 0);
  ctx.restore();
  if (last) {                             // somebody is standing in the gap
    ctx.fillStyle = 'rgba(6,8,14,0.55)';
    ctx.fillRect(-rx * 2, -ry * 2, rx * 4, ry * 4);
    founderFigure(0, ry * 0.34, TEAR_R * 0.46, { open: 0.5, a: 0.95 });
  }
  ctx.restore();

  // the rim: torn metal, lit from inside, thicker where it is pulling apart
  ctx.strokeStyle = rgba(last ? COLD_COL : FOUND_COL, 0.95);
  ctx.lineWidth = 3;
  tearPath(rx, ry, 0.05, t * 0.6);
  ctx.stroke();
  ctx.strokeStyle = rgba('#0a0700', 0.9);
  ctx.lineWidth = 1.2;
  tearPath(rx * 1.1, ry * 1.06, 0.09, t * 0.6 + 1.4);
  ctx.stroke();

  // the room's grid ending raggedly against the gap
  ctx.strokeStyle = rgba(last ? COLD_COL : FOUND_COL, 0.3);
  ctx.lineWidth = 1.4;
  for (let k = 0; k < 12; k++) {
    const a = (k / 12) * TAU + 0.2;
    const w = 1 + Math.sin(a * 3 + t * 0.6) * 0.05;
    const x0 = Math.cos(a) * rx * w * 1.08, y0 = Math.sin(a) * ry * w * 1.08;
    const l = TEAR_R * (0.1 + (k % 3) * 0.07);
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x0 + Math.cos(a) * l, y0 + Math.sin(a) * l);
    ctx.stroke();
  }
  ctx.restore();

  // heat coming out of it, so it is legible as warmth and not as a hazard
  if (FXO.parts && !last && Math.random() < 0.4)
    spawnPart(x + rnd(rx, -rx), y + rnd(ry * 0.5, -ry * 0.5),
              rnd(16, -16), rnd(-24, -60), rnd(2, 1), CAMP_EMBER, rnd(0.5, 0.3), 0.9);

  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = "700 9px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.letterSpacing = '0.2em';
  ctx.fillStyle = rgba(last ? COLD_COL : FOUND_COL, 0.75);
  ctx.fillText(last ? 'SOMEBODY IS AT THE DOOR' : 'INSIDE', x, y - TEAR_R - 16);
  ctx.restore();
}

/* You go in. The whole point of the place is being in it — healed at the mouth
   of the door you would never see the fire, the shelters leaning on each other,
   or the people sitting round it with their backs to you, and the tribunal
   later lands only if you recognise the room with its chairs turned round.
--------------------------------------------------------------------------- */
let campVisit = null;

function startCampVisit(i) {
  campVisit = { i, t: 0, gave: false, out: 0 };
  tear.open = false; tear.cd = TEAR_CD;
  Audio_.levelup();
}

function campVisitTick(dt) {
  const v = campVisit;
  v.t += dt;
  if (!v.gave && v.t > 1.2) {          // he sees to you before he says anything
    v.gave = true;
    P.hp = P.maxHp;
    TEAR_GIFT[v.i].f();
  }
  if (v.t > 6.6) v.out = Math.min(1, v.out + dt * 1.6);
  if (v.out >= 1) {
    campVisit = null;
    banner(TEAR_SAY[v.i], FOUND_COL, 3.4);
    checkLevel();
  }
}

function drawCampVisit() {
  if (!campVisit) return;
  const v = campVisit;
  const fade = clamp(v.t * 1.6, 0, 1) * (1 - v.out);
  ctx.save();
  ctx.fillStyle = 'rgba(6,4,1,' + (0.94 * fade) + ')';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.translate(W / 2, H * 0.46);
  campScene(W, H * 0.92, 0.95, 0);
  ctx.restore();

  const dy = H * 0.66, fs = Math.min(H * 0.095, 66);
  // a bed under the words, the same as the doorway scene uses
  const bed = ctx.createLinearGradient(0, H * 0.72, 0, H);
  bed.addColorStop(0, 'rgba(4,3,1,0)');
  bed.addColorStop(1, 'rgba(4,3,1,' + (0.96 * fade) + ')');
  ctx.fillStyle = bed;
  ctx.fillRect(0, H * 0.72, W, H * 0.28);

  /* Off the centre line, the way the doorway scene stands him: dead centre he
     is planted in his own fire, and the fire is the only bright thing in the
     room. */
  const gap = Math.min(W * 0.19, 190);
  ctx.save();
  ctx.globalAlpha = fade;
  founderFigure(W / 2 + gap, dy - fs * 0.52, fs, { open: 0.42 });
  ctx.restore();

  ctx.textAlign = 'center';
  if (v.gave) {                        // under his line, not through the people
    ctx.font = "600 12px 'JetBrains Mono', ui-monospace, monospace";
    ctx.fillStyle = rgba(CAMP_EMBER, 0.8 * fade);
    ctx.fillText(TEAR_GIFT[v.i].s, W / 2, H * 0.925);
  }
  if (v.t > 1.8) {
    const ln = TEAR_SAY[v.i];
    const shown = ln.slice(0, Math.min(ln.length, Math.floor((v.t - 1.8) * 30)));
    ctx.font = '400 ' + Math.min(19, Math.max(13, W * 0.016)) +
               "px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = rgba(FOUND_COL, 0.94 * fade);
    ctx.fillText(shown, W / 2, H * 0.855);
  }
  ctx.restore();
}

/* -------------------------------- the door --------------------------------
   The fifth time it opens there is already somebody at it, and he is perfectly
   pleasant about why they are staying out there. You may agree with him or you
   may open it yourself. Opening it is the whole refusal — there is no button
   that says fight.
--------------------------------------------------------------------------- */
const CHOICE_LINES = [
  'Ah — not that one.',
  'That one argues. You have seen what that does to a room.',
  'Come in and sit down. I will close it.'
];

function startChoice() {
  choice = { t: 0, said: -1, armed: 0.9 };
  tear.open = false;
  Audio_.tone(200, 0.3, 'sine', 0.08, 240);
  shake(0.5);
}

function choiceTick(dt) {
  const c = choice;
  c.t += dt;
  c.armed = Math.max(0, c.armed - dt);
  for (let i = 0; i < CHOICE_LINES.length; i++)
    if (c.t >= 1.0 + i * 2.4 && c.said < i) {
      c.said = i; c.saidT = 0;
      Audio_.tone(300, 0.05, 'sine', 0.04, 560);
    }
  c.saidT = (c.saidT || 0) + dt;
}

function choiceButtons() {
  const bw = Math.min(250, (W - 90) / 2), bh = 54, y = H - 96;
  return { stay: { x: W / 2 - bw - 10, y, w: bw, h: bh },
           open: { x: W / 2 + 10,      y, w: bw, h: bh } };
}

function choiceAnswer(openIt) {
  if (!choice || choice.armed > 0 || choice.said < CHOICE_LINES.length - 1) return;
  if (!openIt) {                       // you sit down
    choice = null; tear = null;
    Save.profile.conformed = true;
    Save.writeLocal(); Save.flush();
    banner('YOU SIT DOWN', FOUND_COL, 5.0);
    setTimeout(() => { if (state === 'play') gameOver(true); }, 3600);
    return;
  }
  choice = null;
  startTribunal();
}

/* You are standing in the camp with him, looking at the doorway. The whole
   composition is one image: the warm room you have been healed in four times,
   and a person outside it in the cold who is not being let in, and him with a
   hand on the door being lovely about it.

   Nothing here is a diagram. The two of them are the same figure at the same
   scale, one lit and one not, because that is the only argument the scene
   needs to make. */
function drawChoice() {
  if (!choice) return;
  const c = choice;
  const fade = clamp(c.t * 1.1, 0, 1);
  ctx.save();
  ctx.fillStyle = 'rgba(6,4,1,' + (0.9 * fade) + ')';
  ctx.fillRect(0, 0, W, H);

  // the camp, as the room you are standing in
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.translate(W / 2, H * 0.46);
  campScene(W, H * 0.92, 0.95, 0);
  ctx.restore();

  const dy = H * 0.66;                 // campScene's floor line
  const gap = Math.min(W * 0.19, 190);
  const dw = Math.min(W * 0.12, 120), dh = Math.min(H * 0.34, 250);
  const fs = Math.min(H * 0.095, 66);

  // a bed under the bottom third, so the words and the buttons have ground
  const bed = ctx.createLinearGradient(0, H * 0.72, 0, H);
  bed.addColorStop(0, 'rgba(4,3,1,0)');
  bed.addColorStop(0.5, 'rgba(4,3,1,' + (0.82 * fade) + ')');
  bed.addColorStop(1, 'rgba(4,3,1,' + (0.96 * fade) + ')');
  ctx.fillStyle = bed;
  ctx.fillRect(0, H * 0.72, W, H * 0.28);

  /* The doorway itself: the same torn rim as the tear, so it is recognisably
     the thing you have been walking into. Outside it is the game's cold grey.*/
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.translate(W / 2, dy - dh * 0.5);
  ctx.save();
  tearPath(dw * 0.5, dh * 0.5, 0.045, uiTime * 0.5);
  ctx.clip();
  ctx.fillStyle = '#080a10';
  ctx.fillRect(-dw, -dh, dw * 2, dh * 2);
  ctx.strokeStyle = 'rgba(100,116,139,0.35)';
  ctx.lineWidth = 1;
  for (let gx = -dw; gx < dw; gx += 22) {
    ctx.beginPath(); ctx.moveTo(gx, -dh); ctx.lineTo(gx, dh); ctx.stroke();
  }
  for (let gy = -dh; gy < dh; gy += 22) {
    ctx.beginPath(); ctx.moveTo(-dw, gy); ctx.lineTo(dw, gy); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = rgba(COLD_COL, 0.6);
  ctx.lineWidth = 2.6;
  tearPath(dw * 0.5, dh * 0.5, 0.045, uiTime * 0.5);
  ctx.stroke();
  ctx.restore();

  /* Him, inside, with a hand on the edge of it. Her — them — outside, at the
     same size, unlit. */
  ctx.save();
  ctx.globalAlpha = fade;
  founderFigure(W / 2 + gap, dy - fs * 0.52, fs, { open: 0.55 });
  ctx.globalAlpha = fade * 0.8;
  crowdFigure(W / 2 - gap, dy - fs * 0.84, fs * 1.02, false, 0, 0.85);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(W / 2 - gap, dy - fs * 0.9, fs * 0.8, COLD_COL, 0.1 * fade);
  ctx.restore();
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.font = "700 9px Barlow, 'Segoe UI', system-ui, sans-serif";
  ctx.letterSpacing = '0.2em';
  ctx.fillStyle = rgba(COLD_COL, 0.7);
  ctx.fillText('OUTSIDE', W / 2 - gap, dy - fs * 1.86);
  ctx.fillStyle = rgba(FOUND_COL, 0.8);
  ctx.fillText('INSIDE', W / 2 + gap, dy - fs * 1.5);
  ctx.restore();
  if (c.said >= 0) {
    const ln = CHOICE_LINES[c.said];
    const shown = ln.slice(0, Math.min(ln.length, Math.floor(c.saidT * 34)));
    ctx.letterSpacing = '0em';
    ctx.font = '400 ' + Math.min(19, Math.max(13, W * 0.016)) +
               "px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = rgba(FOUND_COL, 0.92);
    ctx.fillText(shown, W / 2, H - 132);
  }
  if (c.said >= CHOICE_LINES.length - 1 && c.armed <= 0) {
    const b = choiceButtons();
    const hot = r => inRect(mouse.x, mouse.y, r);
    const btn = (r, label, col) => {
      ctx.fillStyle = rgba(col, hot(r) ? 0.2 : 0.08);
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      roundRect(r.x, r.y, r.w, r.h, 8); ctx.fill(); ctx.stroke();
      ctx.fillStyle = col;
      ctx.font = "700 13px Barlow, 'Segoe UI', system-ui, sans-serif";
      ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 5);
    };
    btn(b.stay, 'SIT DOWN   [Y]', FOUND_COL);
    btn(b.open, 'OPEN IT   [N]', '#94a3b8');
  }
  ctx.restore();
}

/* ------------------------------ the tribunal ------------------------------
   He does not fight. He gestures, and they do it. They are his health: turn
   the last of them and he is not killed, he is left, in a room he built.

   You turn them by refusing the tear while you are dying in front of them.
   Shooting them does the opposite — it proves him right and hands him the one
   you hit. The whole fight is the reflex the last four visits taught you,
   asked for back.
--------------------------------------------------------------------------- */
const TRI_SEATS = 24;
const TRI_TURN = 0.62;             // seats per second at zero health
const TRI_RANKS = 0.55;            // fraction turned that closes ranks
const TRI_STAND = 0.85;            // fraction at which he gets up

let tribunal = null;

function startTribunal() {
  enemies.length = 0; ebullets.length = 0;
  awaitingPortal = false; portals.length = 0;
  betweenWaves = 1e9; spawnBudget = 0;
  const cx = (arena.x0 + arena.x1) / 2, cy = (arena.y0 + arena.y1) / 2;
  arenaShrinkTo(cx, cy, 1500, 1080);
  /* Sized to the viewport, not the arena. Laid out in world units the tiers
     sat a clear screen-height above the throne, so the camera — which follows
     you, and you are down in front of it — never had them in frame at all.
     The whole point of the room is being able to see who is still his. */
  const colW = clamp(W * 0.088, 56, 96);
  const rowH2 = clamp(H * 0.072, 44, 62);
  const ty = cy - clamp(H * 0.12, 70, 120);
  const seats = [];
  for (let i = 0; i < TRI_SEATS; i++) {
    const row = Math.floor(i / 8), col = i % 8;
    seats.push({ i, row,
      x: cx + (col - 3.5) * colW + (row % 2 ? colW / 2 : 0),
      y: ty - rowH2 - row * rowH2,
      turned: false, hard: 0, look: 0, hush: 0 });
  }
  tribunal = { seats, throne: { x: cx, y: ty }, t: 0, turned: 0,
               ranks: 0, ranksT: 0, stood: false, standT: 0, over: 0,
               say: '', sayT: 0, atkT: 2.2 };
  bossAlive = true;
  banner('THE TRIBUNAL', FOUND_COL, 4.4);
  drawFlashT = 0.5; shake(1.8);
  Audio_.boss(); Audio_.boom();
}

/* --------------------------- what the room does ----------------------------
   He never throws anything. He gestures and they do it, so every move here is
   something a crowd does rather than something a boss does — a row going along
   a bench, everyone turning to look at the same spot, the whole stand coming
   to its feet at once. The benches are the unit, because the benches are what
   you can see.

   What is still his decides what it can do. Early it is a few of them shouting
   at once; by the time you have taken half the room off him he is using all of
   what is left, in order, on you.

   And the ones you have turned do not just sit there: they heckle the row they
   came out of, and a bench being shouted at cannot take part. Turning the room
   has to be worth something beyond arithmetic.
--------------------------------------------------------------------------- */
const TRI_SHOT = 230, TRI_DMG = 8;

function triFire(s, ang, spd, dmg, r) {
  ebullets.push({ x: s.x, y: s.y, vx: Math.cos(ang) * (spd || TRI_SHOT),
                  vy: Math.sin(ang) * (spd || TRI_SHOT),
                  r: r || 6, dmg: dmg || TRI_DMG, col: CROWD_COL, life: 5, t: 0 });
}
const triHeld = T => T.seats.filter(s => !s.turned && s.hush <= 0);
const triRow = (T, row) => T.seats.filter(s => s.row === row && !s.turned && s.hush <= 0);

/* Picks the next thing the room does. The pool opens up as he loses it. */
function triPick(T) {
  const gone = T.turned / TRI_SEATS;
  const pool = ['volley', 'wave'];
  if (gone > 0.25) pool.push('pile');
  if (gone > 0.40) pool.push('point', 'wave');
  if (gone > 0.60) pool.push('ovation', 'pile');
  return pool[(Math.random() * pool.length) | 0];
}

function triStartMove(T) {
  T.move = triPick(T);
  T.moveT = 0;
  T.step = 0;
  const held = triHeld(T);
  switch (T.move) {
    case 'wave': {                       // along a bench, one after another
      const rows = [0, 1, 2].filter(r => triRow(T, r).length > 1);
      T.row = rows.length ? rows[(Math.random() * rows.length) | 0] : 0;
      T.dir = Math.random() < 0.5 ? 1 : -1;
      T.queue = triRow(T, T.row).sort((a, b) => (a.x - b.x) * T.dir);
      T.atkT = 6;                        // it owns the beat while it runs
      Audio_.tone(300, 0.1, 'sine', 0.05, 420);
      break;
    }
    case 'pile': {                       // everyone looks at the same floor
      T.mark = { x: P.x, y: P.y, t: 0 };
      T.atkT = 3.2;
      Audio_.tone(200, 0.14, 'square', 0.07, 160);
      break;
    }
    case 'point': {                      // he singles you out, then they agree
      T.line = { a: Math.atan2(P.y - T.throne.y, P.x - T.throne.x), t: 0 };
      T.atkT = 3.0;
      Audio_.tone(420, 0.2, 'sine', 0.08, 300);
      break;
    }
    case 'ovation':                      // the whole stand, on its feet
      T.atkT = 3.4;
      Audio_.tone(150, 0.25, 'square', 0.1, 90);
      shake(0.5);
      break;
    default: {                           // a few of them, shouting
      for (let k = 0; k < Math.min(5, held.length); k++) {
        const s = held[(Math.random() * held.length) | 0];
        triFire(s, Math.atan2(P.y - s.y, P.x - s.x) + rnd(0.1, -0.1));
      }
      T.atkT = 1.5 + Math.random() * 0.8;
      T.move = null;
    }
  }
}

/* Runs whichever one is going. Returns nothing; it drives itself off moveT. */
function triMoveTick(T, dt) {
  if (!T.move) return;
  T.moveT += dt;
  switch (T.move) {
    case 'wave': {
      // one bench-seat every fifth of a second, so the wall has a moving gap
      const want = Math.floor(T.moveT / 0.2);
      while (T.step < want && T.step < T.queue.length) {
        const s = T.queue[T.step++];
        if (!s.turned && s.hush <= 0) {
          const a = Math.atan2(P.y - s.y, P.x - s.x);
          for (let k = -1; k <= 1; k++) triFire(s, a + k * 0.1, 210);
          ringFx(s.x, s.y, 4, 34, CROWD_COL, 0.22, 2);
        }
      }
      if (T.step >= T.queue.length) { T.move = null; T.atkT = 1.1; }
      break;
    }
    case 'pile': {
      T.mark.t += dt;
      if (T.mark.t >= 1.15) {            // the beat you have to not be there for
        for (const s of triHeld(T))
          triFire(s, Math.atan2(T.mark.y - s.y, T.mark.x - s.x), 300, 7, 5);
        ringFx(T.mark.x, T.mark.y, 10, 150, '#f87171', 0.4, 4);
        Audio_.boom();
        T.mark = null; T.move = null; T.atkT = 1.4;
      }
      break;
    }
    case 'point': {
      T.line.t += dt;
      if (T.line.t >= 1.4) {
        for (const s of triHeld(T)) triFire(s, T.line.a, 340, 9, 6);
        shake(0.4); Audio_.noise(0.3, 0.2, 1800, 240, 3);
        T.line = null; T.move = null; T.atkT = 1.6;
      }
      break;
    }
    case 'ovation': {
      if (T.step === 0 && T.moveT > 0.9) {   // they stand, then they all go
        T.step = 1;
        const held = triHeld(T);
        for (const s of held) {
          const base = Math.atan2(P.y - s.y, P.x - s.x);
          for (let k = -1; k <= 1; k += 2) triFire(s, base + k * 0.34, 150, 7, 7);
          triFire(s, base, 150, 7, 7);
        }
        drawFlashT = Math.max(drawFlashT, 0.14);
        Audio_.boom();
      }
      if (T.moveT > 1.6) { T.move = null; T.atkT = 1.8; }
      break;
    }
  }
}

/* The ones you took off him do not sit quietly. They shout at the bench they
   came out of, and a bench being shouted at sits the next one out. */
function triHeckle(T, dt) {
  T.heckT = (T.heckT || 1.6) - dt;
  if (T.heckT > 0) return;
  T.heckT = 1.8;
  const turned = T.seats.filter(s => s.turned);
  const held = T.seats.filter(s => !s.turned);
  if (!turned.length || !held.length) return;
  const from = turned[(Math.random() * turned.length) | 0];
  const at = held[(Math.random() * held.length) | 0];
  at.hush = Math.max(at.hush || 0, 1.5);
  ringFx(at.x, at.y, 5, 40, '#94a3b8', 0.3, 3);
  spawnPart(from.x, from.y, (at.x - from.x) * 0.5, (at.y - from.y) * 0.5,
            3, '#94a3b8', 0.45, 0.9);
  Audio_.tone(880, 0.03, 'sine', 0.025, 1200);
}

/* Telegraphs. Both of the slow moves have to be legible before they land. */
function drawTriTells(T) {
  if (T.mark) {
    const p = clamp(T.mark.t / 1.15, 0, 1);
    ctx.save();
    ctx.strokeStyle = rgba('#f87171', 0.35 + p * 0.5);
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 7]); ctx.lineDashOffset = -uiTime * 60;
    ctx.beginPath(); ctx.arc(T.mark.x, T.mark.y, 76 * (1 - p * 0.55), 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = rgba('#f87171', 0.25 + p * 0.5);
    ctx.beginPath(); ctx.arc(T.mark.x, T.mark.y, 76, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  if (T.line) {
    const p = clamp(T.line.t / 1.4, 0, 1);
    const L = 2200;
    ctx.save();
    ctx.globalAlpha = 0.25 + p * 0.6;
    ctx.strokeStyle = '#f87171';
    ctx.lineWidth = 1 + p * 3;
    ctx.beginPath();
    ctx.moveTo(T.throne.x, T.throne.y);
    ctx.lineTo(T.throne.x + Math.cos(T.line.a) * L, T.throne.y + Math.sin(T.line.a) * L);
    ctx.stroke();
    ctx.restore();
  }
}

/* ------------------------------- alone -------------------------------------
   The room is empty and he is still in it, so he reaches behind the throne and
   comes out with the thing he has never once needed. He has had other people
   swinging for him since before you got here; this is the first honest work he
   has done all fight, and he is frighteningly good at it.

   No bullets in this phase. Nothing to weave, nothing to out-DPS — the whole
   thing is reach and spacing against a weapon longer than you are, from a man
   who now has nothing else left to lose. Health is throttled like the other
   endgame bodies so a stacked build cannot skip it.
--------------------------------------------------------------------------- */
const HAL_REACH = 208;             // the head of it, not the haft
const HAL_ARC = 1.15;              // how wide a sweep covers
const HAL_TARGET_SEC = 62;
const HAL_COL = '#fcd34d';
const HAL_EDGE = '#fff7ed';

const HAL_SAY = [
  'You did not have to do that.',
  'They were happy. You saw them.',
  'I built all of it. Every bench.',
  'Come here.'
];

function startHalberd(T) {
  T.hal = {
    hp: 1, maxHp: 1, tok: 0,
    ang: Math.atan2(P.y - T.throne.y, P.x - T.throne.x),
    x: T.throne.x, y: T.throne.y + 40,
    atk: null, atkT: 1.6, t: 0, rage: 0, said: 0, sayT: 0,
    swing: 0, spinT: 0, hitOn: false, hurt: 0
  };
  const e = spawnEnemy('boss', T.throne.x, T.throne.y + 40, { boss: 'founder' });
  if (e) {
    e.founder = true;
    e.armor = 0; e.absorb = 0; e.dr = 0; e.floor = undefined;
    e.spd = 0;
    T.hal.e = e;
    T.hal.maxHp = e.maxHp;
    T.hal.hp = e.maxHp;
  }
  bossAlive = true;
  triSay('. . . fine.', 3.0);
  banner('HE STANDS UP', HAL_COL, 4.0);
  drawFlashT = 0.5; shake(2.0);
  Audio_.boss(); Audio_.boom();
  ringFx(T.throne.x, T.throne.y, 24, 900, HAL_COL, 1.3, 9);
}

/* Everything he does is the same three beats: he tells you, he commits, he is
   briefly out of position. The windows are tight rather than unfair. */
const HAL_MOVES = {
  sweep:  { tell: 0.52, live: 0.20, rest: 0.62 },
  thrust: { tell: 0.46, live: 0.26, rest: 0.70 },
  slam:   { tell: 0.66, live: 0.16, rest: 0.86 },
  spin:   { tell: 0.58, live: 1.50, rest: 0.90 }
};

function halPick(h) {
  const d = len(P.x - h.x, P.y - h.y);
  const pool = d > 340 ? ['thrust', 'slam', 'thrust']
             : d < 150 ? ['sweep', 'spin', 'sweep']
                       : ['sweep', 'thrust', 'slam', 'spin'];
  if (h.rage) pool.push('spin', 'sweep');
  return pool[(Math.random() * pool.length) | 0];
}

function halHit(h, dmg) {
  if (P.iframe > 0) return;
  hurtPlayer(dmg);
  shake(0.6);
}

/* The head of it, wherever it is this frame. */
function halHead(h) {
  return { x: h.x + Math.cos(h.ang + h.swing) * HAL_REACH,
           y: h.y + Math.sin(h.ang + h.swing) * HAL_REACH };
}

function halTick(T, dt) {
  const h = T.hal;
  h.t += dt;
  h.sayT = Math.max(0, h.sayT - dt);
  h.hurt = Math.max(0, h.hurt - dt);
  if (h.e && h.e.dead) { h.hp = 0; }

  // he keeps his own health, throttled, so the phase lasts what it should
  h.tok = Math.min(h.maxHp / HAL_TARGET_SEC * 2.5,
                   h.tok + h.maxHp / HAL_TARGET_SEC * dt);
  if (h.e) { h.e.x = h.x; h.e.y = h.y; h.e.ang = h.ang; }

  const frac = h.hp / h.maxHp;
  if (frac < 0.45 && !h.rage) {
    h.rage = 1;
    triSay(HAL_SAY[2], 3.4);
    drawFlashT = 0.3; shake(1.2); Audio_.boom();
  }
  const spd = (h.rage ? 1.28 : 1) * (h.atk ? 0.45 : 1);

  // he closes. there is nowhere in the room he will not follow you to
  const ax = P.x - h.x, ay = P.y - h.y, d = len(ax, ay) || 1;
  if (!h.atk || h.phase === 'rest') {
    h.x += ax / d * 178 * spd * dt;
    h.y += ay / d * 178 * spd * dt;
  }
  const want = Math.atan2(ay, ax);
  if (!h.atk || h.phase === 'tell') {
    let da = ((want - h.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    h.ang += da * Math.min(1, dt * (h.atk ? 3.4 : 7));
  }

  if (!h.atk) {
    h.atkT -= dt * (h.rage ? 1.35 : 1);
    if (h.atkT <= 0) {
      h.atk = halPick(h);
      h.phase = 'tell'; h.pt = 0; h.swing = 0; h.hitOn = false;
      if (h.atk === 'sweep') h.swing = -HAL_ARC / 2;
      if (h.atk === 'slam') h.mark = { x: P.x, y: P.y };
      Audio_.tone(210, 0.08, 'square', 0.06, 150);
    }
    return;
  }

  const M = HAL_MOVES[h.atk];
  h.pt += dt * (h.rage ? 1.2 : 1);
  if (h.phase === 'tell' && h.pt >= M.tell) { h.phase = 'live'; h.pt = 0; h.hitOn = true;
                                              Audio_.noise(0.3, 0.16, 2600, 300, 3); }
  else if (h.phase === 'live' && h.pt >= M.live) { h.phase = 'rest'; h.pt = 0; h.hitOn = false; }
  else if (h.phase === 'rest' && h.pt >= M.rest) {
    h.atk = null; h.swing = 0; h.spinT = 0;
    h.atkT = (h.rage ? 0.5 : 0.85) + Math.random() * 0.5;
    return;
  }

  if (h.phase !== 'live') return;
  const pd = len(P.x - h.x, P.y - h.y);
  switch (h.atk) {
    case 'sweep': {                       // it comes round in a wide arc
      h.swing = -HAL_ARC / 2 + HAL_ARC * clamp(h.pt / M.live, 0, 1);
      const pa = Math.atan2(P.y - h.y, P.x - h.x);
      let da = Math.abs(((pa - (h.ang + h.swing) + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
      if (pd < HAL_REACH + 26 && pd > 30 && da < 0.34) halHit(h, 26);
      break;
    }
    case 'thrust': {                      // he goes where he was pointing
      h.x += Math.cos(h.ang) * 640 * dt;
      h.y += Math.sin(h.ang) * 640 * dt;
      const pa = Math.atan2(P.y - h.y, P.x - h.x);
      let da = Math.abs(((pa - h.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
      if (pd < HAL_REACH + 40 && da < 0.3) halHit(h, 30);
      break;
    }
    case 'slam': {                        // straight down, and the floor answers
      if (!h.done2) {
        h.done2 = true;
        const m = h.mark || { x: P.x, y: P.y };
        h.x = m.x - Math.cos(h.ang) * 60; h.y = m.y - Math.sin(h.ang) * 60;
        if (len(P.x - m.x, P.y - m.y) < 132) halHit(h, 34);
        ringFx(m.x, m.y, 12, 300, HAL_COL, 0.7, 6);
        burst(m.x, m.y, 30, HAL_COL, 340, 3.6, 0.7);
        drawFlashT = 0.22; shake(1.3); Audio_.boom();
        addHazard('vent', m.x, m.y, 1.6, { r: 96, dmg: 12 });
      }
      break;
    }
    case 'spin': {                        // and he simply keeps going
      h.spinT += dt;
      h.swing += dt * 7.6;
      h.x += (P.x - h.x) / (len(P.x - h.x, P.y - h.y) || 1) * 96 * dt;
      h.y += (P.y - h.y) / (len(P.y - h.y, P.x - h.x) || 1) * 96 * dt;
      const pa = Math.atan2(P.y - h.y, P.x - h.x);
      let da = Math.abs(((pa - (h.ang + h.swing) + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
      if (pd < HAL_REACH + 20 && da < 0.42) halHit(h, 20);
      break;
    }
  }
  if (h.phase !== 'live') h.done2 = false;
  if (h.atk === 'slam' && h.phase === 'rest') h.done2 = false;
}

function halDraw(T) {
  const h = T.hal;
  if (!h) return;
  const M = h.atk ? HAL_MOVES[h.atk] : null;
  ctx.save();

  // the tells: where it is about to be, before it is there
  if (h.atk && h.phase === 'tell') {
    const p = clamp(h.pt / M.tell, 0, 1);
    ctx.globalAlpha = 0.28 + p * 0.5;
    ctx.strokeStyle = '#f87171';
    if (h.atk === 'sweep' || h.atk === 'spin') {
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(h.x, h.y, HAL_REACH, h.ang - HAL_ARC / 2, h.ang + HAL_ARC / 2);
      ctx.stroke();
    } else if (h.atk === 'thrust') {
      ctx.lineWidth = 2 + p * 4;
      ctx.beginPath();
      ctx.moveTo(h.x, h.y);
      ctx.lineTo(h.x + Math.cos(h.ang) * 520, h.y + Math.sin(h.ang) * 520);
      ctx.stroke();
    } else if (h.atk === 'slam' && h.mark) {
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(h.mark.x, h.mark.y, 132 * (1 - p * 0.4), 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // the weapon. a haft from him to the head, and the head is what cuts
  const hd = halHead(h);
  ctx.strokeStyle = rgba('#78716c', 0.95); ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(hd.x, hd.y); ctx.stroke();
  ctx.strokeStyle = rgba(HAL_COL, 0.9); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(hd.x, hd.y); ctx.stroke();
  const live = h.phase === 'live';
  ctx.save();
  ctx.translate(hd.x, hd.y);
  ctx.rotate(h.ang + h.swing);
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(0, 0, live ? 54 : 30, live ? HAL_EDGE : HAL_COL, live ? 0.6 : 0.3);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = live ? HAL_EDGE : HAL_COL;
  ctx.beginPath();
  ctx.moveTo(-26, -6); ctx.lineTo(16, -30); ctx.lineTo(30, -4);
  ctx.lineTo(12, 12); ctx.lineTo(-26, 8);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // him
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(h.x, h.y, h.rage ? 92 : 70, HAL_COL, h.hurt > 0 ? 0.55 : 0.32);
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = rgba(HAL_COL, 0.95); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(h.x, h.y, 22, 0, TAU); ctx.stroke();
  ctx.fillStyle = rgba(HAL_COL, h.rage ? 0.5 : 0.28);
  ctx.fill();
  ctx.restore();
  ctx.restore();
}

const triSay = (m, t) => { if (tribunal) { tribunal.say = m; tribunal.sayT = t || 3.4; } };

/* Shooting the crowd is the wrong instrument. It hardens the one you hit and
   gives him back one that had turned. */
function triShot(x, y) {
  if (!tribunal || tribunal.over) return false;
  for (const s of tribunal.seats) {
    if (len(x - s.x, y - s.y) > 40) continue;
    s.hard = 4.5;
    if (s.turned) { s.turned = false; tribunal.turned--; }
    else {
      const back = tribunal.seats.find(z => z.turned);
      if (back) { back.turned = false; tribunal.turned--; }
    }
    burst(s.x, s.y, 10, '#f87171', 180, 2.4, 0.35);
    Audio_.tone(160, 0.1, 'square', 0.07, 90);
    triSay('You see? That is what they do.', 3.0);
    return true;
  }
  return false;
}

function tribunalTick(dt) {
  const T = tribunal;
  T.t += dt;
  T.sayT = Math.max(0, T.sayT - dt);
  for (const s of T.seats) s.hard = Math.max(0, s.hard - dt);

  if (T.over) {                        // he is alone; let it sit
    T.over += dt;
    if (T.over > 7.2) {
      tribunal = null; bossAlive = false;
      if (!Save.profile.tribunalDone) {
        Save.profile.tribunalDone = true;
        Save.writeLocal(); Save.flush();
      }
      arenaReset();
      betweenWaves = 3.0;
      if (!awaitingPortal) afterReward();
      banner('HE IS THE ONLY ONE LEFT', FOUND_COL, 5.0);
      checkLevel();
    }
    return;
  }

  if (T.hal) {                         // nobody left to gesture at
    halTick(T, dt);
    if (T.hal.hp <= 0 && !T.over) {
      T.over = 0.001;
      if (T.hal.e) T.hal.e.dead = true;
      triSay('. . . oh.', 6.0);
      drawFlashT = 0.5; shake(2.2);
      Audio_.boom(); Audio_.levelup();
      ringFx(T.hal.x, T.hal.y, 24, 1100, HAL_COL, 1.4, 9);
    }
    return;
  }

  const frac = T.turned / TRI_SEATS;

  // closing ranks: the ones still his step in together and nothing turns
  if (T.ranksT > 0) {
    T.ranksT -= dt;
    T.atkT -= dt;
    if (T.atkT <= 0) {
      T.atkT = 0.5;
      for (const s of T.seats) {
        if (s.turned || Math.random() > 0.4) continue;
        const a = Math.atan2(P.y - s.y, P.x - s.x);
        ebullets.push({ x: s.x, y: s.y, vx: Math.cos(a) * 250, vy: Math.sin(a) * 250,
                        r: 6, dmg: 9, col: CROWD_COL, life: 5, t: 0 });
      }
    }
    return;
  }
  if (frac >= TRI_RANKS && T.ranks === 0) {
    T.ranks = 1; T.ranksT = 5.0; T.atkT = 0.4;
    triSay('Everyone — up. It is only frightened.', 4.0);
    shake(1.0); Audio_.boom();
    return;
  }

  // he gets up exactly once, and does the only unkind thing he does
  if (frac >= TRI_STAND && !T.stood) {
    T.stood = true; T.standT = 3.0;
    tear = null;
    triSay('No. Nobody else is leaving. The door is shut.', 5.0);
    drawFlashT = 0.4; shake(1.4); Audio_.boom();
    return;
  }
  if (T.standT > 0) {                  // and it turns the rest for you
    T.standT -= dt;
    const left = T.seats.filter(s => !s.turned);
    if (left.length && T.standT % 0.35 < dt) {
      const s = left[0];
      s.turned = true; T.turned++;
