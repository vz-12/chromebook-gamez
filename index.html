    // intangible enemies fade out; they can't be hit while faint
    const ea = e.phased || e.invuln ? 0.3 : 1;

    // the amalgam's limbs are drawn as one welded body, not as loose bosses
    if (e.amalPart) continue;
    // and THE UNWRITTEN's halves are pages, drawn with the seam that joins them
    if (unwritten && (e === unwritten.a || e === unwritten.b)) continue;
    // ROOT is a selection box, not a polygon — it draws itself
    if (e.boss === 'root') { drawRootBody(e); continue; }

    // glow
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(e.x, e.y, e.r * (e.type === 'boss' ? 3.4 : 2.3), e.col, (0.34 + e.flash * 0.3) * ea);
    if (e.hacked) drawGlow(e.x, e.y, e.r * 3.2, HACK_COL, 0.26);
    if (e.elite) drawGlow(e.x, e.y, e.r * 3, COL.elite, 0.22 * ea);
    if (e.virus) drawGlow(e.x, e.y, e.r * 5.2, VIRUS_COL, 0.3 + Math.sin(uiTime * 9) * 0.12);
    if (e.shadow > 0) drawGlow(e.x, e.y, e.r * 3.6, VIRUS_COL, 0.24);
    ctx.globalCompositeOperation = 'source-over';

    /* Turned. The body already wears your colour, so what marks it is the
       hardware holding it: a collar clamped around the shell, four struts
       driven into it, and the hold left on the collar drawn as an arc — the
       hold decays, and you should be able to watch it run out. */
    if (e.hacked) {
      const R = e.r + 9;
      const hold = clamp(e.hp / (e.maxHp * (e.type === 'boss' ? 0.35 : 0.6)), 0, 1);
      const seed = e.hackId || 0;
      ctx.save();
      ctx.lineCap = 'butt';
      ctx.strokeStyle = 'rgba(12,20,6,0.8)'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(e.x, e.y, R, 0, TAU); ctx.stroke();
      ctx.strokeStyle = rgba(HACK_COL, 0.22); ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.arc(e.x, e.y, R + 2.8, 0, TAU); ctx.stroke();
      ctx.strokeStyle = rgba(HACK_COL, 0.9); ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.arc(e.x, e.y, R, -Math.PI / 2, -Math.PI / 2 + TAU * hold);
      ctx.stroke();
      const spin = -uiTime * 0.75 + seed;
      for (let k = 0; k < 4; k++) {
        const aa = spin + k * TAU / 4, cw = Math.cos(aa), sw = Math.sin(aa);
        ctx.strokeStyle = rgba(HACK_COL, 0.8); ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(e.x + cw * (e.r - 1), e.y + sw * (e.r - 1));
        ctx.lineTo(e.x + cw * (R + 4), e.y + sw * (R + 4));
        ctx.stroke();
        ctx.fillStyle = '#f7fee7';
        ctx.beginPath(); ctx.arc(e.x + cw * (R + 4), e.y + sw * (R + 4), 1.7, 0, TAU); ctx.fill();
      }
      // the trace working away inside the shell
      ctx.globalAlpha = 0.45 + Math.sin(uiTime * 9 + seed) * 0.3;
      ctx.strokeStyle = HACK_COL; ctx.lineWidth = 1;
      ctx.setLineDash([2, 4]); ctx.lineDashOffset = -uiTime * 34;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.66, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
      // and a chevron over it, so a turned body is countable across a full room
      ctx.save();
      ctx.globalAlpha = 0.55 + Math.sin(uiTime * 4 + seed) * 0.25;
      ctx.fillStyle = HACK_COL;
      const my = e.y - e.r - 15;
      ctx.beginPath();
      ctx.moveTo(e.x, my + 5); ctx.lineTo(e.x - 4.2, my - 1.6);
      ctx.lineTo(e.x + 4.2, my - 1.6);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    /* THE BOOKKEEPER: the ledger orbits him, and every card he has written
       onto himself is listed above his head, so his growth is legible. */
    if (e.boss === 'keeper') {
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = KEEPER_COL; ctx.lineWidth = 2;
      for (let k = 0; k < 3; k++) {
        const a = (e.kDroneAng || 0) * (k % 2 ? -1 : 1) + k * TAU / 3;
        const rr = e.r + 40 + k * 12;
        const bx = e.x + Math.cos(a) * rr, by = e.y + Math.sin(a) * rr;
        ctx.save();
        ctx.translate(bx, by); ctx.rotate(a + Math.PI / 2);
        ctx.strokeRect(-9, -12, 18, 24);
        ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, 12); ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
      if (e.kShield > 0) {
        ctx.save();
        ctx.globalAlpha = 0.5 + Math.sin(uiTime * 5) * 0.2;
        ctx.strokeStyle = '#fef3c7'; ctx.lineWidth = 2.4;
        for (let k = 0; k < e.kShield; k++) {
          ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 14 + k * 7, 0, TAU); ctx.stroke();
        }
        ctx.restore();
      }
      const list = Object.keys(e.ku || {});
      if (list.length) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = "700 9px Barlow, 'Segoe UI', system-ui, sans-serif";
        let ly = e.y - e.r - 26;
        for (let k = 0; k < list.length; k += 4) {
          const row = list.slice(k, k + 4)
            .map(id => { const u = UPGRADES.find(z => z.id === id);
                         return (u ? upName(u) : id) + (e.ku[id] > 1 ? '×' + e.ku[id] : ''); })
            .join('  ·  ');
          ctx.fillStyle = 'rgba(252,211,77,0.75)';
          ctx.fillText(row, e.x, ly);
          ly -= 12;
        }
        ctx.restore();
      }
    }

    // a shadow is a silhouette on loan — draw it as an outline and skip the body
    if (e.shadow > 0) {
      const fade = clamp(e.shadow / 0.6, 0, 1) * clamp((SHADOW_LIFE - e.shadow) / 0.35, 0, 1);
      ctx.save();
      ctx.globalAlpha = 0.55 * fade;
      ctx.strokeStyle = VIRUS_COL; ctx.lineWidth = 3;
      ctx.setLineDash([7, 5]); ctx.lineDashOffset = -uiTime * 26;
      poly(e.x, e.y, e.r, e.sides || 6, e.ang || 0);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 0.14 * fade;
      ctx.fillStyle = VIRUS_COL;
      poly(e.x, e.y, e.r * 0.82, e.sides || 6, -(e.ang || 0));
      ctx.fill();
      ctx.restore();
      continue;
    }

    ctx.save();
    ctx.globalAlpha = ea;
    ctx.lineWidth = e.type === 'boss' ? 4 : 2.2;
    // flash brightens the fill but never erases the silhouette — a boss under
    // continuous fire has to stay legible
    ctx.fillStyle = rgba(e.col, 0.16 + e.flash * 0.46);
    ctx.strokeStyle = e.flash > 0.5 ? '#ffffff' : e.col;
    poly(e.x, e.y, e.r, e.sides, e.ang);
    ctx.fill();
    // plates for anything big enough to read them; the rest keep one stroke
    if (FXO.mat && e.r >= 14) platedBody(e, e.flash > 0.5);
    else ctx.stroke();

    /* THE SHOPKEEPER. His health bar IS the till, so the till is drawn: the
       hoard he took off you stacked in coin columns beside him, dropping
       column by column as he is worn down, over a counter he will not come out
       from behind. He is the only boss whose life is a number you handed over,
       and it ought to look spendable. */
    if (e.boss === 'shopkeeper') {
      const gold = e.col, frac = clamp(e.hp / e.maxHp, 0, 1);
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(Math.atan2(P.y - e.y, P.x - e.x));
      // the counter: a slab he keeps between the two of you
      const cw = e.r * 1.02;                 // clear of the hull, not inside it
      ctx.fillStyle = 'rgba(18,12,4,0.92)';
      roundRect(cw, -e.r * 1.25, 16, e.r * 2.5, 4); ctx.fill();
      ctx.strokeStyle = rgba(gold, 0.75); ctx.lineWidth = 2;
      roundRect(cw, -e.r * 1.25, 16, e.r * 2.5, 4); ctx.stroke();
      ctx.strokeStyle = rgba(gold, 0.35); ctx.lineWidth = 1;
      for (let k = -2; k <= 2; k++) {
        ctx.beginPath();
        ctx.moveTo(cw, k * e.r * 0.5); ctx.lineTo(cw + 16, k * e.r * 0.5);
        ctx.stroke();
      }
      // the drawer, out while he is paying you in ordnance
      const outT = clamp(e.atkT || 0, 0, 1);
      if (outT > 0) {
        ctx.fillStyle = 'rgba(28,18,4,0.95)';
        roundRect(cw + 14, -e.r * 0.7, 10 + outT * 20, e.r * 1.4, 3); ctx.fill();
        ctx.strokeStyle = rgba(gold, 0.9); ctx.lineWidth = 1.6;
        roundRect(cw + 14, -e.r * 0.7, 10 + outT * 20, e.r * 1.4, 3); ctx.stroke();
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        drawGlow(cw + 22 + outT * 12, 0, 26 * outT, gold, 0.4 * outT);
        ctx.restore();
      }
      ctx.restore();
      /* Coin columns: five stacks, and the hoard falls out of them as he does.
         Eight coins a stack, so a column emptying is a real notch of progress
         rather than a bar sliding a few pixels. */
      ctx.save();
      for (let k = 0; k < 5; k++) {
        const a = (e.ang || 0) * 0.4 + k * TAU / 5;
        const bx = e.x + Math.cos(a) * (e.r + 62), by = e.y + Math.sin(a) * (e.r + 62);
        const n = Math.round(clamp(frac * 5 - k, 0, 1) * 8);
        for (let c = 0; c < 8; c++) {
          const on = c < n;
          ctx.beginPath();
          ctx.ellipse(bx, by + 8 - c * 4.4, 11, 4.2, 0, 0, TAU);
          ctx.fillStyle = on ? rgba(gold, 0.85 - c * 0.04) : 'rgba(255,255,255,0.05)';
          ctx.fill();
          ctx.strokeStyle = on ? 'rgba(120,80,10,0.9)' : 'rgba(255,255,255,0.07)';
          ctx.lineWidth = 1; ctx.stroke();
        }
        if (n > 0) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          drawGlow(bx, by - n * 2, 20, gold, 0.14);
          ctx.restore();
        }
      }
      ctx.restore();
      // what is left of what he took, over his head, in the till's own figures
      if (e.took) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.letterSpacing = '0.2em';
        ctx.font = "700 8px Barlow, 'Segoe UI', system-ui, sans-serif";
        ctx.fillStyle = rgba(gold, 0.6);
        ctx.fillText('TILL', e.x, e.y - e.r - 104);
        ctx.letterSpacing = '0em';
        ctx.font = "700 14px 'JetBrains Mono', ui-monospace, monospace";
        ctx.fillStyle = rgba(gold, 0.95);
        ctx.fillText(Math.round(e.took * frac) + ' CR', e.x, e.y - e.r - 86);
        ctx.restore();
      }
      // a shutter half down over his face. he is not open for this.
      ctx.save();
      ctx.fillStyle = 'rgba(18,12,4,0.9)';
      ctx.fillRect(e.x - e.r * 0.66, e.y - e.r * 0.5, e.r * 1.32, e.r * 0.42);
      ctx.strokeStyle = rgba(gold, 0.8); ctx.lineWidth = 1.6;
      ctx.strokeRect(e.x - e.r * 0.66, e.y - e.r * 0.5, e.r * 1.32, e.r * 0.42);
      ctx.strokeStyle = rgba(gold, 0.3); ctx.lineWidth = 1;
      for (let k = 1; k < 4; k++) {
        const yy = e.y - e.r * 0.5 + k * e.r * 0.105;
        ctx.beginPath();
        ctx.moveTo(e.x - e.r * 0.66, yy); ctx.lineTo(e.x + e.r * 0.66, yy);
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'lighter';
      const gaze = Math.sin(uiTime * 0.9) * e.r * 0.34;
      drawGlow(e.x + gaze, e.y - e.r * 0.29, 13, gold, 0.5);
      ctx.fillStyle = '#fde68a';
      ctx.fillRect(e.x + gaze - 5, e.y - e.r * 0.33, 10, 3);
      ctx.restore();
    }

    // THE OTHER, awakened: eight jointed legs that grow in during the
    // transition and scuttle faster the angrier it gets
    if (e.boss === 'theother' && e.legs > 0) {
      const grow = e.legs;
      const charging = e.rage === 1;
      const stunned = e.rage === 2;
      const beat = uiTime * (charging ? 22 : stunned ? 2 : 7);
      ctx.save();
      ctx.strokeStyle = stunned ? '#fde047' : '#5eead4';
      ctx.lineCap = 'round';
      for (let k = 0; k < 8; k++) {
        const side = k < 4 ? 1 : -1;
        const spread = ((k % 4) - 1.5) * 0.42;
        const base = e.ang + Math.PI / 2 * side + spread * side;
        const sw = Math.sin(beat + k * 1.1);
        const L1 = (30 + sw * 5) * grow, L2 = (34 + sw * 7) * grow;
        const hipX = e.x + Math.cos(base) * e.r * 0.8;
        const hipY = e.y + Math.sin(base) * e.r * 0.8;
        // knee kicks outward and up; the foot then reaches back down
        const kneeA = base + (stunned ? 0.5 : 0.75) + sw * 0.22;
        const kx = hipX + Math.cos(kneeA) * L1;
        const ky = hipY + Math.sin(kneeA) * L1 - (charging ? 10 : 16) * grow;
        const footA = kneeA + (stunned ? 0.4 : 1.05) + Math.cos(beat + k) * 0.28;
        const fx = kx + Math.cos(footA) * L2;
        const fy = ky + Math.sin(footA) * L2;
        ctx.globalAlpha = ea * 0.9;
        ctx.lineWidth = 4.5 * grow;
        ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(kx, ky); ctx.stroke();
        ctx.lineWidth = 3 * grow;
        ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
        ctx.globalAlpha = ea;
      }
      ctx.restore();
      if (charging) {           // a hard line showing exactly where it committed
        ctx.save();
        ctx.globalAlpha = 0.3;
        ctx.strokeStyle = '#5eead4'; ctx.lineWidth = 2;
        ctx.setLineDash([14, 10]);
        ctx.beginPath(); ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.x + Math.cos(e.chargeAng) * 900, e.y + Math.sin(e.chargeAng) * 900);
        ctx.stroke();
        ctx.restore();
      }
    }

    // sentinel: the frontal shield that deflects shots, drawn where it blocks
    if (e.type === 'sentinel') {
      ctx.strokeStyle = '#bae6fd'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 9, e.ang - 1.15, e.ang + 1.15);
      ctx.stroke();
      ctx.globalAlpha = ea * 0.35; ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 9, e.ang - 1.15, e.ang + 1.15);
      ctx.stroke();
      ctx.globalAlpha = ea;
    }
    // forgeheart: rotating armour plates — the gaps are the only way in
    if (e.boss === 'forgeheart') {
      /* The plates are the fight, so they are built rather than outlined:
         armour with a cold face, a bevel catching the forge light, ribs, end
         bolts, and heat bleeding out of the gaps you have to shoot through. */
      const seg = TAU / 4, R = e.r + 24;
      ctx.save();
      ctx.globalAlpha = ea;
      for (let k = 0; k < 4; k++) {
        const a0 = e.plateAng + k * seg, a1 = a0 + seg * 0.62;
        ctx.strokeStyle = '#1c1005'; ctx.lineWidth = 17;
        ctx.beginPath(); ctx.arc(e.x, e.y, R, a0, a1); ctx.stroke();
        ctx.strokeStyle = '#7c2d12'; ctx.lineWidth = 12;
        ctx.beginPath(); ctx.arc(e.x, e.y, R, a0, a1); ctx.stroke();
        ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(e.x, e.y, R + 6, a0, a1); ctx.stroke();
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = rgba('#f97316', 0.3 + Math.sin(uiTime * 3 + k) * 0.16);
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(e.x, e.y, R - 4, a0, a1); ctx.stroke();
        ctx.restore();
        ctx.strokeStyle = 'rgba(15,8,2,0.85)'; ctx.lineWidth = 2;
        for (let i = 1; i < 5; i++) {
          const a = lerp(a0, a1, i / 5);
          ctx.beginPath();
          ctx.moveTo(e.x + Math.cos(a) * (R - 7), e.y + Math.sin(a) * (R - 7));
          ctx.lineTo(e.x + Math.cos(a) * (R + 7), e.y + Math.sin(a) * (R + 7));
          ctx.stroke();
        }
        ctx.fillStyle = '#fde68a';
        for (const a of [a0, a1]) {
          ctx.beginPath();
          ctx.arc(e.x + Math.cos(a) * R, e.y + Math.sin(a) * R, 3, 0, TAU);
          ctx.fill();
        }
        // the gap after this plate: lit from inside, so the way in is obvious
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = rgba('#fb923c', 0.22 + Math.sin(uiTime * 6 + k) * 0.1);
        ctx.lineWidth = 10;
        ctx.beginPath(); ctx.arc(e.x, e.y, R, a1, a0 + seg); ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
      ctx.globalAlpha = ea;
    }

    if (e.elite) {
      ctx.strokeStyle = COL.elite; ctx.lineWidth = 1.6;
      poly(e.x, e.y, e.r + 6, e.sides, -e.ang * 0.6);
      ctx.stroke();
    }
    if (e.psn > 0) {
      /* Venom should look like it is working, and worse the more of it is in
         there: the stacks ring the body and the thing sweats. */
      const sev = clamp(e.psn / 12, 0, 1);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(e.x, e.y, e.r * (1.6 + sev * 1.2), '#a3e635', 0.18 + sev * 0.3);
      ctx.restore();
      // one pip per stack, orbiting
      ctx.fillStyle = '#d9f99d';
      const pips = Math.min(12, e.psn);
      for (let k = 0; k < pips; k++) {
        const a = e.t * 1.8 + k * TAU / pips;
        const rr = e.r * 1.18 + Math.sin(e.t * 5 + k) * 2;
        ctx.beginPath();
        ctx.arc(e.x + Math.cos(a) * rr, e.y + Math.sin(a) * rr, 1.7 + sev, 0, TAU);
        ctx.fill();
      }
      // it drips
      if (Math.random() < 0.25 + sev * 0.4)
        spawnPart(e.x + rnd(e.r * 0.8, -e.r * 0.8), e.y + e.r * 0.4,
                  rnd(14, -14), rnd(70, 30), rnd(2.6, 1.3), '#a3e635', rnd(0.6, 0.3), 0.96);
      ctx.strokeStyle = 'rgba(163,230,53,0.95)'; ctx.lineWidth = 2;
      poly(e.x, e.y, e.r * 0.78, 3, -e.t * 3); ctx.stroke();
      ctx.fillStyle = '#a3e635';
      ctx.font = "700 9px Barlow, 'Segoe UI', system-ui, sans-serif";
      ctx.textAlign = 'center';
      ctx.fillText(String(e.psn), e.x, e.y - e.r - 18);
    }
    if (e.slow > 0) {
      ctx.strokeStyle = 'rgba(147,197,253,0.9)'; ctx.lineWidth = 2;
      poly(e.x, e.y, e.r * 0.6, 6, e.t * 2);
      ctx.stroke();
    }
    // inner detail
    if (e.type === 'boss') {
      ctx.strokeStyle = rgba('#fca5a5', 0.8); ctx.lineWidth = 2;
      poly(e.x, e.y, e.r * 0.62, 3, -e.ang * 1.7); ctx.stroke();
      poly(e.x, e.y, e.r * 0.36, 3, e.ang * 2.4 + 1); ctx.stroke();
    } else if (e.type === 'turret') {
      ctx.strokeStyle = rgba('#bfdbfe', 0.9); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.45, 0, TAU); ctx.stroke();
    } else if (e.type === 'brute') {
      ctx.strokeStyle = rgba('#fecdd3', 0.7); ctx.lineWidth = 1.6;
      poly(e.x, e.y, e.r * 0.5, 6, -e.ang); ctx.stroke();
    } else if (e.type === 'healer') {
      ctx.strokeStyle = rgba('#a7f3d0', 0.95); ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(e.x - e.r * 0.5, e.y); ctx.lineTo(e.x + e.r * 0.5, e.y);
      ctx.moveTo(e.x, e.y - e.r * 0.5); ctx.lineTo(e.x, e.y + e.r * 0.5);
      ctx.stroke();
      ctx.globalAlpha = ea * (0.12 + Math.sin(uiTime * 3) * 0.05);
      ctx.beginPath(); ctx.arc(e.x, e.y, 270, 0, TAU); ctx.stroke();
      ctx.globalAlpha = ea;
    } else if (e.type === 'artillery') {
      ctx.strokeStyle = rgba('#fed7aa', 0.85); ctx.lineWidth = 2;
      poly(e.x, e.y, e.r * 0.5, 3, e.ang * 1.6); ctx.stroke();
    } else if (e.type === 'phaser') {
      ctx.strokeStyle = rgba('#f5d0fe', 0.85); ctx.lineWidth = 1.8;
      poly(e.x, e.y, e.r * 0.55, 6, -e.ang * 2); ctx.stroke();
    } else if (e.type === 'wraith') {
      ctx.strokeStyle = rgba('#ddd6fe', 0.8); ctx.lineWidth = 1.6;
      poly(e.x, e.y, e.r * 0.55, 4, e.ang + 0.8); ctx.stroke();
    } else if (e.type === 'revenant') {
      // a ghost wears its second life openly
      ctx.strokeStyle = rgba('#f8fafc', e.gen > 0 ? 0.95 : 0.6);
      ctx.lineWidth = e.gen > 0 ? 2.4 : 1.6;
      poly(e.x, e.y, e.r * 0.55, 5, -e.ang * 1.4); ctx.stroke();
      if (e.gen > 0) {
        ctx.globalAlpha = ea * (0.3 + Math.sin(uiTime * 6) * 0.15);
        poly(e.x, e.y, e.r * 1.35, 5, e.ang); ctx.stroke();
        ctx.globalAlpha = ea;
      }
    } else if (e.type === 'redactor') {
      // the erasure cone, drawn exactly where it eats your shots
      ctx.save();
      ctx.globalAlpha = ea * (e.redacting ? 0.2 : 0.05);
      ctx.fillStyle = e.redacting ? '#ef4444' : '#64748b';
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.arc(e.x, e.y, 330, e.ang - 0.55, e.ang + 0.55);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = ea * (e.redacting ? 0.6 : 0.25);
      ctx.strokeStyle = e.redacting ? '#f87171' : '#475569';
      ctx.lineWidth = e.redacting ? 2.2 : 1.2;
      ctx.setLineDash(e.redacting ? [] : [12, 9]); ctx.lineDashOffset = -uiTime * 20;
      ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = rgba('#fecaca', 0.9); ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(e.x - e.r * 0.5, e.y); ctx.lineTo(e.x + e.r * 0.5, e.y);
      ctx.stroke();
    } else if (e.type === 'mimic') {
      // it wears your silhouette
      ctx.save();
      ctx.translate(e.x, e.y); ctx.rotate(e.ang);
      ctx.strokeStyle = '#99f6e4'; ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(13, 0); ctx.lineTo(-7, 8); ctx.lineTo(-4, 0); ctx.lineTo(-7, -8);
      ctx.closePath(); ctx.stroke();
      ctx.restore();
    } else if (e.type === 'prism') {
      // the mirrored half is drawn solid; the open half is the way in
      ctx.strokeStyle = '#cffafe'; ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 7, e.plateAng - 1.3, e.plateAng + 1.3);
      ctx.stroke();
      ctx.globalAlpha = ea * 0.35; ctx.lineWidth = 11;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 7, e.plateAng - 1.3, e.plateAng + 1.3);
      ctx.stroke();
      ctx.globalAlpha = ea;
    } else if (e.type === 'egg') {
      const pulse = 0.5 + Math.sin(e.atkT * 7) * 0.5;
      ctx.strokeStyle = rgba('#bbf7d0', 0.5 + pulse * 0.5); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (0.3 + pulse * 0.3), 0, TAU); ctx.stroke();
    }
    ctx.restore();

    // dasher telegraph
    if (e.type === 'dasher' && e.state === 1) {
      ctx.save();
      ctx.globalAlpha = 0.35 + Math.sin(e.t * 30) * 0.2;
      ctx.strokeStyle = e.col; ctx.lineWidth = 2;
      ctx.setLineDash([10, 8]);
      ctx.beginPath(); ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + Math.cos(e.ang) * 520, e.y + Math.sin(e.ang) * 520);
      ctx.stroke();
      ctx.restore();
    }
    // bomber fuse
    if (e.type === 'bomber' && e.atkT > 0) {
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#fed7aa'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 8 + Math.sin(e.atkT * 26) * 4, 0, TAU); ctx.stroke();
      ctx.restore();
    }

    // health pip for tanky enemies
    if (e.hp < e.maxHp && e.type !== 'boss' && e.maxHp > 40) {
      const w = e.r * 2, h = 3;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(e.x - w / 2, e.y - e.r - 11, w, h);
      ctx.fillStyle = e.elite ? COL.elite : e.col;
      ctx.fillRect(e.x - w / 2, e.y - e.r - 11, w * clamp(e.hp / e.maxHp, 0, 1), h);
    }
  }
}

function updateCorpses(dt) {
  for (let i = corpses.length - 1; i >= 0; i--) {
    const c = corpses[i];
    c.life -= dt;
    if (c.vol) {
      // it slides, and anything that hits it shoves it further
      c.x += c.vx * dt; c.y += c.vy * dt;
      const dr = Math.pow(0.06, dt);
      c.vx *= dr; c.vy *= dr;
      c.x = clamp(c.x, arena.x0 + c.r, arena.x1 - c.r);
      c.y = clamp(c.y, arena.y0 + c.r, arena.y1 - c.r);
      c.ang += (Math.abs(c.vx) + Math.abs(c.vy)) * dt * 0.012;
      // sparks off the fuse, faster as it runs out
      if (Math.random() < 0.3 + (1 - c.life / c.max) * 0.6)
        spawnPart(c.x + rnd(c.r, -c.r), c.y + rnd(c.r, -c.r), rnd(60, -60), rnd(-30, -110),
                  rnd(3.4, 1.6), Math.random() < 0.5 ? '#fb923c' : '#fecaca', rnd(0.5, 0.2), 0.9);
      if (c.life <= 0) {
        playerBlast(c.x, c.y, 62 + 24 * c.vol, (10 + 9 * c.vol) * (1 + wave * 0.06), '#fb923c');
        ringFx(c.x, c.y, 8, 62 + 24 * c.vol, '#fb923c', 0.5, 4);
        burst(c.x, c.y, 20, '#fb923c', 300, 3.4, 0.55);
        shakeAt(c.x, c.y, 0.25); Audio_.boom();
      }
    }
    if (c.life <= 0) corpses.splice(i, 1);
  }
}

// shove any fused body caught in a blast, so detonations chain across a crowd
function knockCorpses(x, y, r, force) {
  for (const c of corpses) {
    if (!c.vol) continue;
    const dx = c.x - x, dy = c.y - y, d = len(dx, dy) || 1;
    if (d > r + c.r) continue;
    const f = force * (1 - d / (r + c.r));
    c.vx += dx / d * f; c.vy += dy / d * f;
  }
}

function drawCorpses() {
  for (const c of corpses) {
    if (!inView(c.x, c.y, c.r * 3)) continue;
    const t = c.life / c.max;
    ctx.save();
    if (c.vol) {
      /* Red, and flashing faster the closer it is to going off — the tell has
         to be readable at a glance in a crowded room. */
      const urgency = 1 - t;
      const blink = Math.sin(uiTime * (14 + urgency * 46)) > 0 ? 1 : 0.28;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(c.x, c.y, c.r * (2.6 + urgency * 2.2), '#ef4444', 0.34 * blink);
      ctx.restore();
      ctx.globalAlpha = 0.55 + 0.45 * blink;
      ctx.fillStyle = rgba('#ef4444', 0.3 * blink);
      ctx.strokeStyle = blink > 0.5 ? '#fecaca' : '#ef4444';
      ctx.lineWidth = 2.6;
      poly(c.x, c.y, c.r * (1 + urgency * 0.3), c.sides, c.ang);
      ctx.fill(); ctx.stroke();
      // the fuse burning down around it
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#fb923c'; ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r * 1.5, -Math.PI / 2, -Math.PI / 2 + TAU * t);
      ctx.stroke();
    } else {
      ctx.globalAlpha = t * 0.7;
      ctx.strokeStyle = c.col; ctx.lineWidth = 2;
      poly(c.x, c.y, c.r * (1 + (1 - t) * 1.5), c.sides, c.ang + (1 - t) * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawLance() {
  if (P.weapon !== 'laser') return;
  /* The wind-up. Two collector arcs closing on the muzzle, a containment ring
     tightening behind them, filaments running up the rail, and a thread on the
     line it will take — so the charge reads as energy being gathered and aimed
     rather than a meter sweeping around the ship. */
  if (P.charge > 0.01 && P.laserT <= 0) {
    const c = clamp(P.charge, 0, 1);
    const cc = c > 0.85 ? '#fecaca' : COL.player;
    const ca = Math.cos(P.ang), sa = Math.sin(P.ang);
    const mx = P.x + ca * 20, my = P.y + sa * 20;
    drawGlow(mx, my, 8 + c * 24, cc, 0.26 + c * 0.5);
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.lineCap = 'round';
    const R = 34 - c * 11;
    ctx.strokeStyle = rgba(cc, 0.22 + c * 0.5);
    ctx.lineWidth = 1.6 + c * 2.4;
    for (const sd of [1, -1]) {
      const a0 = P.ang + sd * (0.42 + (1 - c) * 1.5);
      ctx.beginPath();
      ctx.arc(P.x, P.y, R, a0, a0 + sd * (0.45 + c * 0.95), sd < 0);
      ctx.stroke();
    }
    ctx.globalAlpha = 0.14 + c * 0.28;
    ctx.strokeStyle = cc; ctx.lineWidth = 1;
    ctx.setLineDash([3, 7]); ctx.lineDashOffset = -uiTime * 44;
    ctx.beginPath(); ctx.arc(P.x, P.y, R + 5, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.3 + c * 0.5;
    ctx.strokeStyle = c > 0.85 ? '#fff1f2' : cc; ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      const ph = (uiTime * 3 + i / 3) % 1;
      const rr = lerp(R + 6, 21, ph), off = Math.sin(ph * 9 + i * 2) * (1 - ph) * 7;
      ctx.beginPath();
      ctx.moveTo(P.x + ca * rr - sa * off, P.y + sa * rr + ca * off);
      ctx.lineTo(mx, my);
      ctx.stroke();
    }
    ctx.globalAlpha = 0.08 + c * 0.2;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(mx, my);
    ctx.lineTo(P.x + ca * (60 + c * 320), P.y + sa * (60 + c * 320));
    ctx.stroke();
    ctx.restore();
    if (FXO.parts && c > 0.45 && Math.random() < 0.3)
      spawnPart(mx + rnd(10, -10), my + rnd(10, -10), rnd(24, -24), rnd(24, -24),
                rnd(2.2, 1), cc, rnd(0.3, 0.15), 0.9);
  }
  if (P.laserT <= 0 || !P.laserSegs.length) return;
  // width tracks the hitbox envelope exactly, so what you see is what damages
  const env = P.laserEnv;
  const w = (P.laserHeavy ? 34 : 19) * (P.br / 4.2) * env;
  const a = 0.35 + 0.65 * env;
  const col = P.laserHeavy ? COL.crit : COL.player;

  // GEMINI's twin holds the same beam, in its own colour
  if (P.twinSegs.length) {
    ctx.save();
    ctx.lineCap = 'round';
    for (const s of P.twinSegs) {
      ctx.globalAlpha = 0.18 * a;
      ctx.strokeStyle = '#c4b5fd'; ctx.lineWidth = w * 2.0;
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
      ctx.globalAlpha = 0.55 * a;
      ctx.lineWidth = w * 0.92;
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
      ctx.globalAlpha = a * 0.9;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2, w * 0.26);
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    }
    const tl = P.twinSegs[P.twinSegs.length - 1];
    drawGlow(tl.x2, tl.y2, w * 1.4, '#c4b5fd', 0.6 * a);
    drawGlow(P.twinSegs[0].x1, P.twinSegs[0].y1, w * 1.1, '#c4b5fd', 0.55 * a);
    ctx.restore();
  }

  ctx.save();
  ctx.lineCap = 'round';
  for (const s of P.laserSegs) {
    ctx.globalAlpha = 0.2 * a;
    ctx.strokeStyle = col; ctx.lineWidth = w * 2.1;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }
  for (const s of P.laserSegs) {
    ctx.globalAlpha = 0.62 * a;
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    ctx.globalAlpha = a;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2, w * 0.3);
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  }
  /* Charge running down the lane. The beam is continuous, so nothing about it
     moves; a dashed hot band travelling along the core at a fixed speed makes
     it a thing being fed rather than a painted line. The dash offset carries
     across segments so a reflected lance stays one continuous run. */
  ctx.globalAlpha = a * 0.7;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = Math.max(1.4, w * 0.46);
  ctx.setLineDash([w * 0.5, w * 2.4]);
  let run = -uiTime * 640;
  for (const s of P.laserSegs) {
    ctx.lineDashOffset = run;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    run += Math.hypot(s.x2 - s.x1, s.y2 - s.y1);
  }
  ctx.setLineDash([]);
  for (const s of P.laserSegs) {
    if (!s.cut) continue;                  // a redactor ate the rest of this lane
    drawGlow(s.x2, s.y2, w * 1.8, '#f87171', 0.75 * a);
    if (Math.random() < 0.5)
      spawnPart(s.x2 + rnd(7, -7), s.y2 + rnd(7, -7), rnd(50, -50), rnd(50, -50),
                rnd(3.2, 1.4), '#f87171', rnd(0.4, 0.2), 0.9);
  }
  const first = P.laserSegs[0];
  const last = P.laserSegs[P.laserSegs.length - 1];
  // muzzle: a flare across the emitter, jittering frame to frame
  ctx.save();
  ctx.translate(first.x1, first.y1);
  ctx.rotate(Math.atan2(first.y2 - first.y1, first.x2 - first.x1));
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = a * (0.45 + Math.random() * 0.35);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(w * 1.6, 0); ctx.lineTo(0, w * 1.1);
  ctx.lineTo(-w * 0.85, 0); ctx.lineTo(0, -w * 1.1);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  drawGlow(first.x1, first.y1, w * 1.3, col, 0.6 * a);
  // impact: bloom, a white pip, and a four-point star that flickers on it
  drawGlow(last.x2, last.y2, w * 1.7, col, 0.7 * a);
  drawGlow(last.x2, last.y2, w * 0.75, '#ffffff', 0.5 * a);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.translate(last.x2, last.y2);
  ctx.rotate(uiTime * 2.4);
  ctx.globalAlpha = a * 0.45;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(1, w * 0.14);
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const aa = i * Math.PI / 2;
    const L = w * (1.5 + Math.sin(uiTime * 26 + i * 1.7) * 0.4);
    ctx.moveTo(Math.cos(aa) * w * 0.35, Math.sin(aa) * w * 0.35);
    ctx.lineTo(Math.cos(aa) * L, Math.sin(aa) * L);
  }
  ctx.stroke();
  ctx.restore();
  // heat shed off the length of it
  if (FXO.parts && Math.random() < 0.55) {
    const s = P.laserSegs[Math.floor(Math.random() * P.laserSegs.length)];
    const t = Math.random();
    spawnPart(lerp(s.x1, s.x2, t), lerp(s.y1, s.y2, t),
              rnd(40, -40), rnd(6, -66), rnd(2.4, 1.1),
              P.laserHeavy ? '#fde047' : '#fca5a5', rnd(0.45, 0.2), 0.92);
  }
  ctx.restore();
}

/* One silhouette per pilot, in one place: the ship in the arena, the pilot
   picker on the menu and the co-op hull all read from this, so a hull can
   never be redrawn in one of them and left stale in the others. */
function hullPath(id) {
  ctx.beginPath();
  if (id === 'hacker') {
    // a splayed fork: two prongs and an open bay where a barrel would be
    ctx.moveTo(18, 0);
    ctx.lineTo(4, 6);
    ctx.lineTo(10, 13);
    ctx.lineTo(-4, 11);
    ctx.lineTo(-9, 0);
    ctx.lineTo(-4, -11);
    ctx.lineTo(10, -13);
    ctx.lineTo(4, -6);
  } else if (id === 'ember') {
    /* A gun with a cockpit bolted behind it: a long lance prong out front,
       hammer shoulders wide enough to carry the vanes that cool it, and one
       deep exhaust notch. Weight at the front, where the runner has none. */
    ctx.moveTo(22, 0);
    ctx.lineTo(13, 2.6);
    ctx.lineTo(9, 7);
    ctx.lineTo(2, 13.5);
    ctx.lineTo(-7, 12);
    ctx.lineTo(-5, 4.6);
    ctx.lineTo(-12, 3.2);
    ctx.lineTo(-9, 0);
    ctx.lineTo(-12, -3.2);
    ctx.lineTo(-5, -4.6);
    ctx.lineTo(-7, -12);
    ctx.lineTo(2, -13.5);
    ctx.lineTo(9, -7);
    ctx.lineTo(13, -2.6);
  } else {
    /* A swept interceptor rather than a paper dart: needle nose, cranked
       wings raked back past the body, notched twin-nozzle tail. Same length
       and the same read at a glance, with a shape to it up close. */
    ctx.moveTo(18, 0);
    ctx.lineTo(9, 3.4);
    ctx.lineTo(5.5, 8.5);
    ctx.lineTo(-5, 13);
    ctx.lineTo(-8.5, 9.5);
    ctx.lineTo(-6, 4.2);
    ctx.lineTo(-10.5, 3.2);
    ctx.lineTo(-6.5, 0);
    ctx.lineTo(-10.5, -3.2);
    ctx.lineTo(-6, -4.2);
    ctx.lineTo(-8.5, -9.5);
    ctx.lineTo(-5, -13);
    ctx.lineTo(5.5, -8.5);
    ctx.lineTo(9, -3.4);
  }
  ctx.closePath();
}

function drawShipHull(colStroke, colFill) {
  hullPath(P.charId);
  ctx.fillStyle = colFill; ctx.strokeStyle = colStroke;
  ctx.fill(); ctx.stroke();
}

/* Furniture, drawn in hull space over the silhouette. Each pilot carries its
   own: VOIDRUNNER intakes and twin nozzles, EMBER a lance rail whose emitter
   is lit by whatever charge is actually in it. Nothing crosses the outline,
   so the ship reads exactly the same at a glance. */
function hullDetail(hullCol) {
  const dark = 'rgba(9,15,28,0.8)';
  if (P.charId === 'ember') {
    // the rail: a channel down the nose, ending at the emitter
    ctx.strokeStyle = dark; ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(18, 0); ctx.stroke();
    ctx.strokeStyle = rgba(hullCol, 0.85); ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(4, -2); ctx.lineTo(17.5, -2);
    ctx.moveTo(4, 2); ctx.lineTo(17.5, 2);
    ctx.moveTo(6, -5.4); ctx.lineTo(12, -3.2);
    ctx.moveTo(6, 5.4); ctx.lineTo(12, 3.2);
    ctx.stroke();
    // heat vanes across the hammer shoulders
    ctx.strokeStyle = dark; ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const x = 4.4 - i * 3.6;
      ctx.moveTo(x, 6.6 + i * 1.1); ctx.lineTo(x - 2.6, 11.8);
      ctx.moveTo(x, -6.6 - i * 1.1); ctx.lineTo(x - 2.6, -11.8);
    }
    ctx.stroke();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // vanes glow when there is heat in the gun
    const heat = P.laserT > 0 ? 1 : clamp(P.charge, 0, 1);
    if (heat > 0.05) {
      ctx.globalAlpha = 0.2 + heat * 0.45;
      ctx.strokeStyle = '#fb923c'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(1, 8.4); ctx.lineTo(-4, 11.4);
      ctx.moveTo(1, -8.4); ctx.lineTo(-4, -11.4);
      ctx.stroke();
    }
    drawGlow(19, 0, 4 + heat * 10, heat > 0.85 ? '#fecaca' : '#f87171', 0.3 + heat * 0.55);
    ctx.fillStyle = rgba(heat > 0.85 ? '#fff1f2' : '#fca5a5', 0.5 + heat * 0.5);
    ctx.beginPath(); ctx.arc(19, 0, 1.5 + heat * 1.7, 0, TAU); ctx.fill();
    // one heavy engine, running hot
    const fl = 0.7 + Math.sin(uiTime * 18) * 0.3;
    drawGlow(-11, 0, 12 * fl, '#fb923c', 0.38);
    ctx.fillStyle = rgba('#fed7aa', 0.6);
    ctx.beginPath();
    ctx.moveTo(-7, 3.4); ctx.lineTo(-21 - 7 * fl, 0); ctx.lineTo(-7, -3.4);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    return;
  }
  if (P.charId === 'runner') {
    // spine, frame bulkhead, and the wing spars running out to the tips
    ctx.strokeStyle = dark; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-5, 0); ctx.lineTo(15, 0);
    ctx.moveTo(-1.5, -5.6); ctx.lineTo(-1.5, 5.6);
    ctx.stroke();
    ctx.strokeStyle = rgba(hullCol, 0.8); ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(5.4, 8.2); ctx.lineTo(-4.6, 11.8);
    ctx.moveTo(5.4, -8.2); ctx.lineTo(-4.6, -11.8);
    ctx.moveTo(2.6, 4.2); ctx.lineTo(-3.6, 9.2);
    ctx.moveTo(2.6, -4.2); ctx.lineTo(-3.6, -9.2);
    ctx.stroke();
    // intake slots either side of the canopy
    ctx.fillStyle = dark;
    ctx.fillRect(6.4, 2.2, 4.6, 1.5);
    ctx.fillRect(6.4, -3.7, 4.6, 1.5);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const fl = 0.7 + Math.sin(uiTime * 22) * 0.3;
    for (const sd of [1, -1]) {
      drawGlow(-9, sd * 3.2, 8 * fl, '#a5f3fc', 0.34);
      ctx.fillStyle = rgba('#e0f2fe', 0.6);
      ctx.beginPath();
      ctx.moveTo(-6.5, sd * 4.6); ctx.lineTo(-17 - 5 * fl, sd * 3);
      ctx.lineTo(-6.5, sd * 1.7);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    return;
  }
  ctx.strokeStyle = 'rgba(11,18,32,0.75)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(14, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-2, -6.4); ctx.lineTo(-2, 6.4); ctx.stroke();
  ctx.strokeStyle = rgba(hullCol, 0.85); ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(4, 4.5); ctx.lineTo(-4, 7.2);
  ctx.moveTo(4, -4.5); ctx.lineTo(-4, -7.2);
  ctx.stroke();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const fl = 0.7 + Math.sin(uiTime * 22) * 0.3;
  drawGlow(-13, 0, 11 * fl, '#a5f3fc', 0.4);
  ctx.fillStyle = rgba('#e0f2fe', 0.6);
  ctx.beginPath();
  ctx.moveTo(-8, 3.4); ctx.lineTo(-20 - 6 * fl, 0); ctx.lineTo(-8, -3.4);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawPlayer() {
  /* Downed in co-op: a wreck, drawn the same way your partner's is, so both
     players read the same silhouette for the same state. */
  if (P.down) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(P.x, P.y, 26, COL.player, 0.2);
    ctx.restore();
    ctx.save();
    ctx.translate(P.x, P.y);
    ctx.rotate(uiTime * 0.7);
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = COL.player; ctx.lineWidth = 2;
    ctx.setLineDash([5, 6]);
    ctx.beginPath(); ctx.arc(0, 0, 17, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    return;
  }
  const blink = P.iframe > 0 && Math.floor(P.iframe * 22) % 2 === 0;

  // faint pickup-radius ring — shows magnet range and, more importantly, keeps
  // the ship findable when the screen is full of enemies
  ctx.save();
  ctx.globalAlpha = 0.11;
  ctx.strokeStyle = COL.xp; ctx.lineWidth = 1;
  ctx.setLineDash([6, 10]);
  ctx.lineDashOffset = -uiTime * 16;
  ctx.beginPath(); ctx.arc(P.x, P.y, P.pickupR, 0, TAU); ctx.stroke();
  ctx.restore();

  // FORGE LEDGER: the borrowed plates, drawn where they actually block
  if (P.plateT > 0) {
    /* Borrowed plate, and it should look borrowed: forged segments still
       carrying heat, bolted at the ends, riding a hot seam. */
    const fade = clamp(P.plateT / 1.2, 0, 1);
    const seg = TAU / 4, R = 62;
    ctx.save();
    ctx.globalAlpha = fade;
    for (let k = 0; k < 4; k++) {
      const a0 = P.plateAng + k * seg, a1 = a0 + seg * 0.62;
      // the plate: dark steel body with a lit outer bevel
      ctx.strokeStyle = '#2a1c0a'; ctx.lineWidth = 13;
      ctx.beginPath(); ctx.arc(P.x, P.y, R, a0, a1); ctx.stroke();
      ctx.strokeStyle = '#78350f'; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.arc(P.x, P.y, R, a0, a1); ctx.stroke();
      ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(P.x, P.y, R + 4.6, a0, a1); ctx.stroke();
      // heat still in it, breathing
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = rgba('#f97316', 0.35 + Math.sin(uiTime * 4 + k) * 0.18);
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(P.x, P.y, R - 2.5, a0, a1); ctx.stroke();
      ctx.restore();
      // bolts at each end
      ctx.fillStyle = '#fde68a';
      for (const a of [a0, a1]) {
        ctx.beginPath();
        ctx.arc(P.x + Math.cos(a) * R, P.y + Math.sin(a) * R, 2.4, 0, TAU);
        ctx.fill();
      }
      // ribs across the plate
      ctx.strokeStyle = 'rgba(20,12,4,0.8)'; ctx.lineWidth = 1.6;
      for (let i = 1; i < 4; i++) {
        const a = lerp(a0, a1, i / 4);
        ctx.beginPath();
        ctx.moveTo(P.x + Math.cos(a) * (R - 5), P.y + Math.sin(a) * (R - 5));
        ctx.lineTo(P.x + Math.cos(a) * (R + 5), P.y + Math.sin(a) * (R + 5));
        ctx.stroke();
      }
    }
    // an ember shaken loose now and then
    if (Math.random() < 0.4) {
      const a = P.plateAng + rnd(TAU);
      spawnPart(P.x + Math.cos(a) * R, P.y + Math.sin(a) * R,
                rnd(30, -30), rnd(-20, -70), rnd(3, 1.4), '#fbbf24', rnd(0.6, 0.25), 0.92);
    }
    ctx.restore();
  }
  // BROOD FOLIO: under the floor, barely there
  if (P.burrowT > 0) {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 2;
    ctx.setLineDash([9, 7]); ctx.lineDashOffset = -uiTime * 24;
    ctx.beginPath(); ctx.arc(P.x, P.y, 30 + Math.sin(uiTime * 8) * 4, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
  // LEO: the corona, drawn at exactly the radius that burns
  if (P.sun) {
    const R = 130 + 40 * P.sun;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(P.x, P.y, R * 0.95, '#fbbf24', 0.2);
    ctx.globalAlpha = 0.45 + Math.sin(uiTime * 3) * 0.12;
    ctx.strokeStyle = '#fde047'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(P.x, P.y, R, 0, TAU); ctx.stroke();
    /* Prominences: tongues of flame licking off the edge at their own rates,
       so the corona churns instead of being a ring with ticks on it. */
    for (let i = 0; i < 18; i++) {
      const a = uiTime * 0.35 + i * TAU / 18;
      const wob = Math.sin(uiTime * (2.4 + (i % 5) * 0.5) + i * 1.7);
      const r0 = R * 0.82, r1 = R * (1.0 + 0.16 * (0.5 + wob * 0.5));
      const spread = 0.07 + 0.05 * (0.5 + wob * 0.5);
      ctx.globalAlpha = 0.22 + 0.2 * (0.5 + wob * 0.5);
      ctx.fillStyle = i % 3 ? '#fb923c' : '#fde047';
      ctx.beginPath();
      ctx.moveTo(P.x + Math.cos(a - spread) * r0, P.y + Math.sin(a - spread) * r0);
      ctx.quadraticCurveTo(P.x + Math.cos(a) * r1 * 1.06, P.y + Math.sin(a) * r1 * 1.06,
                           P.x + Math.cos(a + spread) * r0, P.y + Math.sin(a + spread) * r0);
      ctx.closePath(); ctx.fill();
    }
    // the boundary that actually burns, and heat shimmer inside it
    ctx.globalAlpha = 0.5 + Math.sin(uiTime * 5) * 0.14;
    ctx.strokeStyle = '#fef3c7'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(P.x, P.y, R, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      const rr = R * (0.5 + i * 0.16) + Math.sin(uiTime * 3 + i * 2) * 5;
      ctx.beginPath(); ctx.arc(P.x, P.y, rr, 0, TAU); ctx.stroke();
    }
    ctx.restore();
    // embers rising off the corona
    if (Math.random() < 0.5) {
      const a = rnd(TAU);
      spawnPart(P.x + Math.cos(a) * R, P.y + Math.sin(a) * R,
                Math.cos(a) * 40, Math.sin(a) * 40 - 60, rnd(3.4, 1.6),
                Math.random() < 0.5 ? '#fde047' : '#fb923c', rnd(0.7, 0.3), 0.93);
    }
  }

  // GEMINI: the twin, mirrored through the centre of the arena
  if (twinActive()) {
    const t = twinPos();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(t.x, t.y, 44, '#c4b5fd', 0.4);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.72;
    ctx.translate(t.x, t.y); ctx.rotate(P.twinAng);
    ctx.lineWidth = 2.2;
    // it is your double, so it wears whichever hull you are flying
    drawShipHull('#c4b5fd', 'rgba(196,181,253,0.18)');
    ctx.restore();
  }

  // shields
  for (let i = 0; i < P.shield; i++) {
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = COL.shield; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(P.x, P.y, P.r + 9 + i * 5, uiTime * 1.4 + i, uiTime * 1.4 + i + 4.6);
    ctx.stroke();
    ctx.restore();
  }
  // drones
  if (P.drones) {
    const R = 62 + P.drones * 7;
    for (let i = 0; i < P.drones; i++) {
      const a = P.droneAng + i * TAU / P.drones;
      const dx = P.x + Math.cos(a) * R, dy = P.y + Math.sin(a) * R;
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(dx, dy, 22, '#a78bfa', 0.6);
      ctx.globalCompositeOperation = 'source-over';
      ctx.save();
      ctx.strokeStyle = '#c4b5fd'; ctx.fillStyle = 'rgba(167,139,250,0.3)'; ctx.lineWidth = 2;
      poly(dx, dy, 8, 3, a * 3);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  /* Afterimages. GHOST STEP is the one upgrade whose whole point is that you
     pass through things, and it had nothing to show for it — phased trails go
     violet and hollow, so you can see the ship is not solid right now. */
  if (FXO.ghosts) for (let i = 0; i < P.ghosts.length; i++) {
    const g = P.ghosts[i];
    const f = (i + 1) / P.ghosts.length;          // oldest is faintest
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(g.x, g.y);
    ctx.rotate(g.ang);
    if (g.phase) {
      ctx.globalAlpha = 0.32 * f;
      ctx.lineWidth = 1.6;
      drawShipHull('#c4b5fd', 'rgba(0,0,0,0)');   // hollow: nothing solid here
      ctx.globalAlpha = 0.16 * f;
      ctx.scale(1 + (1 - f) * 0.5, 1 + (1 - f) * 0.5);
      drawShipHull('#a78bfa', 'rgba(0,0,0,0)');
    } else {
      ctx.globalAlpha = 0.26 * f;
      ctx.lineWidth = 2;
      drawShipHull(COL.player, rgba(COL.player, 0.10));
    }
    ctx.restore();
  }

  if (blink) return;
  ctx.save();
  ctx.translate(P.x, P.y);
  ctx.rotate(P.ang);
  const phasing = P.ghost > 0 && P.dashT > 0;
  const hullCol = phasing ? '#c4b5fd' : P.hurtFlash > 0 ? '#fecaca' : COL.player;

  /* The hull glows off its own edge and outward only. A radial sprite centred
     on the ship washes across the plating and softens it; stroking the
     silhouette at growing widths throws the light outward instead, and the
     solid hull drawn over the top keeps the shape hard. */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineJoin = 'round';
  for (let i = 5; i >= 1; i--) {
    ctx.lineWidth = 2.4 + i * 3.4;
    ctx.strokeStyle = rgba(hullCol, 0.055 * (1 - i / 6.5) + 0.012);
    drawShipHull(rgba(hullCol, 0.055 * (1 - i / 6.5) + 0.012), 'rgba(0,0,0,0)');
  }
  ctx.restore();

  ctx.lineWidth = 2.4;
  ctx.strokeStyle = hullCol;
  // while phasing the hull is barely filled — you are not really there
  const hullFill = phasing ? 'rgba(167,139,250,0.10)'
                 : P.hurtFlash > 0 ? 'rgba(239,68,68,0.5)' : rgba(COL.player, 0.18);
  ctx.fillStyle = hullFill;
  drawShipHull(hullCol, hullFill);
  if (FXO.mat) hullDetail(hullCol);
  // canopy: a blister on the runner, a slit set back behind EMBER's rail
  ctx.fillStyle = '#e0f2fe';
  ctx.beginPath();
  if (P.charId === 'ember') ctx.ellipse(-1.4, 0, 2.5, 1.8, 0, 0, TAU);
  else if (P.charId === 'runner') ctx.ellipse(3, 0, 3.1, 1.9, 0, 0, TAU);
  else ctx.arc(2, 0, 2.6, 0, TAU);
  ctx.fill();
  ctx.restore();
}

/* Motion blur. The smear is laid along where the thing has just been and its
   length comes from how fast it is actually travelling, so a slow shot barely
   smudges and a railgun round draws a line. Three tapered segments rather than
   a gradient: with several hundred bullets on screen this allocates nothing. */
/* One stroke, not three. The tapered version cost 11.8ms a frame on its own
   with a few hundred bullets up — three beginPath/stroke pairs each — which is
   most of a frame budget spent on smear. A single line with a round cap reads
   near-identically in motion. */
function motionStreak(x, y, vx, vy, w, col, strength) {
  if (!FXO.mblur) return;
  const k = strength === undefined ? 1 : strength;
  const s = Math.hypot(vx, vy);
  if (s < 40) return;                    // slow things do not smear
  const L = Math.min(s * 0.05, 64) * k;
  ctx.strokeStyle = rgba(col, 0.3 * k);
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - vx / s * L, y - vy / s * L);
  ctx.stroke();
}

function drawBullets() {
  for (const b of bullets) {
    if (!inView(b.x, b.y, 40)) continue;
    // zodiac rounds read differently at a glance
    const c = b.hacked ? HACK_COL
            : b.arrow ? '#fcd34d' : b.venom ? '#a3e635' : b.solar ? '#fb923c'
            : b.deep ? '#38bdf8' : b.crit ? COL.crit : COL.bullet;
    if (FXO.bglow) drawGlow(b.x, b.y, b.r * (b.arrow ? 5.4 : 4.6), c, 0.72);
    motionStreak(b.x, b.y, b.vx, b.vy, b.r * (b.arrow ? 1.3 : 1.7), c,
                 b.arrow ? 1.5 : 1);
    if (b.arrow) {
      /* A whole arrow rather than a dot with two ticks on it: nocked shaft,
         fletching that catches the light, and a barbed head with an edge. */
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      // shaft
      ctx.strokeStyle = '#fde68a'; ctx.lineWidth = 1.9;
      ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(10, 0); ctx.stroke();
      // fletching, two vanes plus the nock
      ctx.fillStyle = 'rgba(252,211,77,0.9)';
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(-26, 0); ctx.lineTo(-20, s * 5.4);
        ctx.lineTo(-11, s * 4.2); ctx.lineTo(-15, 0);
        ctx.closePath(); ctx.fill();
      }
      ctx.strokeStyle = '#fffbeb'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-27, -3.2); ctx.lineTo(-27, 3.2); ctx.stroke();
      // head: a solid barbed point with a lit leading edge
      ctx.fillStyle = '#fffbeb';
      ctx.beginPath();
      ctx.moveTo(19, 0); ctx.lineTo(7, 6.2); ctx.lineTo(10, 0);
      ctx.lineTo(7, -6.2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#fff7ed'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(19, 0); ctx.lineTo(7, -6.2); ctx.stroke();
      ctx.restore();
    } else if (FXO.mat) {
      /* Two strands of beads orbiting the line of travel: the round reads as a
         helix winding through the air, with the near half of each turn drawn
         brighter and larger so the twist has depth rather than just wobble.
         The phase comes from the round's own position, so it spins as it flies
         and no two rounds in a volley are in step. Bead count drops when the
         screen is full, which is the only thing that makes this affordable at
         four hundred bullets up. */
      ctx.save();
      ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx));
      const hPh = uiTime * 26 + (b.x + b.y) * 0.09;
      const hN = bullets.length > 140 ? 4 : 7, hA = b.r * 2.1, hSP = b.r * 1.5;
      for (let k = 0; k < 2; k++) {
        // the strand itself, so the beads read as one coil rather than sparks
        ctx.strokeStyle = rgba(c, 0.5); ctx.lineWidth = b.r * 0.42; ctx.lineCap = 'round';
        ctx.beginPath();
        for (let i = 0; i < hN; i++) {
          const a = hPh - i * 0.8 + k * Math.PI;
          const X = -i * hSP, Y = Math.sin(a) * hA;
          i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
        }
        ctx.stroke();
        for (let i = 0; i < hN; i++) {
          const u = i / (hN - 1), a = hPh - i * 0.8 + k * Math.PI;
          const dep = Math.cos(a), taper = 1 - u * 0.5;
          ctx.fillStyle = rgba(c, (0.9 - u * 0.55) * (0.6 + dep * 0.4));
          ctx.beginPath();
          ctx.arc(-i * hSP, Math.sin(a) * hA,
                  b.r * 0.62 * taper * (0.7 + dep * 0.3), 0, TAU);
          ctx.fill();
        }
      }
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, b.r * 0.62, 0, TAU); ctx.fill();
      if (b.crit) {
        ctx.strokeStyle = rgba(COL.crit, 0.7); ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(-b.r * 1.4, -b.r * 1.4); ctx.lineTo(b.r * 1.4, b.r * 1.4);
        ctx.moveTo(-b.r * 1.4, b.r * 1.4); ctx.lineTo(b.r * 1.4, -b.r * 1.4);
        ctx.stroke();
      }
      ctx.restore();
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.62, 0, TAU); ctx.fill();
    }
  }
}

/* Every boss throws its own thing. A screen full of identical dots tells you
   nothing about what is coming at you; these are shaped so you can read the
   threat by silhouette alone, before you have registered the colour. */
function drawEBullets() {
  for (const b of ebullets) {
    if (!inView(b.x, b.y, b.r * 4)) continue;
    if (FXO.bglow) drawGlow(b.x, b.y, b.r * 3, b.col, 0.55);
    motionStreak(b.x, b.y, b.vx, b.vy, b.r * 1.5, b.col, 0.85);
    const r = b.r;
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.translate(b.x, b.y);
    ctx.lineJoin = 'round';

    switch (b.kind) {
      case 'warden': {                    // a thrown ring, spinning edge-on
        ctx.rotate(b.spin + uiTime * 5);
        ctx.strokeStyle = b.col; ctx.lineWidth = r * 0.62;
        ctx.beginPath(); ctx.ellipse(0, 0, r * 1.15, r * 0.8, 0, 0, TAU); ctx.stroke();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.1;
        ctx.beginPath(); ctx.ellipse(0, 0, r * 1.15, r * 0.8, 0, 0, TAU); ctx.stroke();
        break;
      }
      case 'forgeheart': {                // a slug of molten metal, still running
        ctx.rotate(Math.atan2(b.vy, b.vx));
        ctx.fillStyle = b.col;
        ctx.beginPath();
        ctx.moveTo(r * 1.5, 0);
        ctx.quadraticCurveTo(0, r, -r * 1.7, 0);
        ctx.quadraticCurveTo(0, -r, r * 1.5, 0);
        ctx.fill();
        ctx.fillStyle = '#fef3c7';
        ctx.beginPath(); ctx.arc(r * 0.35, 0, r * 0.45, 0, TAU); ctx.fill();
        break;
      }
      case 'broodmother': {               // a spore, and it has spines
        ctx.rotate(b.spin + uiTime * 1.6);
        ctx.fillStyle = b.col;
        ctx.beginPath(); ctx.arc(0, 0, r * 0.82, 0, TAU); ctx.fill();
        ctx.strokeStyle = b.col; ctx.lineWidth = 1.6;
        for (let i = 0; i < 6; i++) {
          const a = i * TAU / 6, o = r * (1.25 + Math.sin(uiTime * 7 + i) * 0.2);
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7);
          ctx.lineTo(Math.cos(a) * o, Math.sin(a) * o);
          ctx.stroke();
        }
        ctx.fillStyle = '#dcfce7';
        ctx.beginPath(); ctx.arc(0, 0, r * 0.32, 0, TAU); ctx.fill();
        break;
      }
      case 'archivist': {                 // a filed card, corner-stamped
        ctx.rotate(b.spin + uiTime * 2.2);
        ctx.fillStyle = rgba(b.col, 0.85);
        ctx.fillRect(-r * 1.1, -r * 0.8, r * 2.2, r * 1.6);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
        ctx.strokeRect(-r * 1.1, -r * 0.8, r * 2.2, r * 1.6);
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.fillRect(-r * 0.7, -r * 0.3, r * 1.4, 1.4);
        ctx.fillRect(-r * 0.7, r * 0.15, r * 0.9, 1.4);
        break;
      }
      case 'nullcore': {                  // a shard with nothing inside it
        ctx.rotate(b.spin + uiTime * 3.4);
        ctx.fillStyle = b.col;
        poly(0, 0, r * 1.35, 3, 0); ctx.fill();
        ctx.fillStyle = '#0a0a0f';       // the hole, not a highlight
        poly(0, 0, r * 0.6, 3, Math.PI); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
        poly(0, 0, r * 1.35, 3, 0); ctx.stroke();
        break;
      }
      case 'curator': {                   // a redaction, travelling
        ctx.rotate(Math.atan2(b.vy, b.vx));
        ctx.fillStyle = '#0b0b0e';
        ctx.fillRect(-r * 1.9, -r * 0.62, r * 3.8, r * 1.24);
        ctx.strokeStyle = b.col; ctx.lineWidth = 1.4;
        ctx.strokeRect(-r * 1.9, -r * 0.62, r * 3.8, r * 1.24);
        break;
      }
      case 'theother': {                  // a sliver of mirror
        ctx.rotate(Math.atan2(b.vy, b.vx));
        ctx.fillStyle = rgba(b.col, 0.55);
        ctx.beginPath();
        ctx.moveTo(r * 1.9, 0); ctx.lineTo(0, r * 0.62);
        ctx.lineTo(-r * 1.9, 0); ctx.lineTo(0, -r * 0.62);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-r * 0.8, -r * 0.14); ctx.lineTo(r * 0.9, -r * 0.14);
        ctx.stroke();
        break;
      }
      case 'keeper': {                    // a wax seal, pressed and thrown
        ctx.rotate(b.spin + uiTime * 1.2);
        ctx.fillStyle = b.col;
        poly(0, 0, r * 1.15, 7, 0); ctx.fill();
        ctx.strokeStyle = '#fffbeb'; ctx.lineWidth = 1.2;
        poly(0, 0, r * 0.66, 7, Math.PI / 7); ctx.stroke();
        break;
      }
      case 'unwritten': {                 // a torn corner of a blank page
        ctx.rotate(b.spin + uiTime * 0.9);
        ctx.fillStyle = 'rgba(245,245,247,0.9)';
        ctx.beginPath();
        ctx.moveTo(-r, -r * 1.1); ctx.lineTo(r * 1.15, -r * 0.8);
        ctx.lineTo(r * 0.75, r * 1.15); ctx.lineTo(-r * 1.1, r * 0.7);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = rgba(b.col, 0.9); ctx.lineWidth = 1;
        ctx.stroke();
        break;
      }
      default: {                          // grunts and anything untagged
        ctx.fillStyle = b.col;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.3; ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(0, 0, r * 0.44, 0, TAU); ctx.fill();
      }
    }
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of parts) {
    if (!inView(p.x, p.y, p.r * 4)) continue;
    const t = p.life / p.max;
    /* A particle in its last breath is a sub-pixel smear at 4% alpha: the blit
       costs the same as a bright one and lands on nothing. Dropping the tail
       is invisible and there are hundreds of them at any moment. */
    if (t < 0.09) continue;
    const rad = p.r * 3.4 * (0.4 + t * 0.9);
    if (rad < 1.6) continue;
    drawGlow(p.x, p.y, rad, p.color, t * 0.75);
  }
}

/* A glow on its own has no edge anywhere, so it reads as a smudge. Each of
   these is light around a hard little body, not light instead of one. */
function drawGems() {
  const pu = Math.sin(uiTime * 6) * 0.2 + 0.9;
  for (const g of gems) {
    if (!inView(g.x, g.y, g.r * 4)) continue;
    const fade = g.life < 3 ? (Math.floor(g.life * 7) % 2 ? 0.3 : 1) : 1;
    drawGlow(g.x, g.y, g.r * 2.9 * pu, COL.xp, 0.5 * fade);
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = fade;
    const a = uiTime * 1.5 + g.x * 0.01;
    ctx.fillStyle = COL.xp;
    poly(g.x, g.y, g.r * 1.25, 4, a); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2;
    poly(g.x, g.y, g.r * 1.25, 4, a); ctx.stroke();
    ctx.fillStyle = '#fff';
    poly(g.x, g.y, g.r * 0.46, 4, a); ctx.fill();
    ctx.restore();
  }
}

function drawDrops() {
  for (const d of drops) {
    const s = 1 + Math.sin(d.t) * 0.16;
    drawGlow(d.x, d.y, d.r * 3.4 * s, d.col, 0.8);
  }
}
/* Chain lightning as a fractal rather than a zigzag. The span is subdivided by
   midpoint displacement, each pass halving the offset, so the bolt carries
   detail at every scale the way a real one does; a couple of joints throw
   short forks that go nowhere. Generated once and cached on the arc —
   rebuilding it every frame turned a 0.16s bolt into a strobing smear. */
function arcPath(a) {
  if (a.path) return a.path;
  let pts = [{ x: a.x1, y: a.y1 }, { x: a.x2, y: a.y2 }];
  const L = Math.hypot(a.x2 - a.x1, a.y2 - a.y1) || 1;
  let amp = Math.min(L * 0.15, 24);
  for (let d = 0; d < 3; d++) {
    const out = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i - 1], q = pts[i];
      const ex = q.x - p.x, ey = q.y - p.y, el = Math.hypot(ex, ey) || 1;
      const off = rnd(amp, -amp);
      out.push({ x: (p.x + q.x) / 2 - ey / el * off, y: (p.y + q.y) / 2 + ex / el * off });
      out.push(q);
    }
    pts = out; amp *= 0.5;
  }
  const base = Math.atan2(a.y2 - a.y1, a.x2 - a.x1);
  a.forks = [];
  for (let k = 0; k < 2; k++) {
    const p = pts[2 + Math.floor(Math.random() * (pts.length - 3))];
    const fa = base + rnd(1.5, -1.5), fl = L * rnd(0.3, 0.12);
    a.forks.push([p, { x: p.x + Math.cos(fa) * fl, y: p.y + Math.sin(fa) * fl }]);
  }
  a.path = pts;
  return pts;
}

function tracePts(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
}

function drawArcs() {
  if (!arcs.length) return;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalCompositeOperation = 'lighter';
  for (const a of arcs) {
    const t = a.life / a.max;
    const pts = arcPath(a);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = rgba(a.col, 0.16 * t); ctx.lineWidth = 9 * t + 2;
    tracePts(pts);
    ctx.strokeStyle = rgba(a.col, 0.85 * t); ctx.lineWidth = 3 * t + 1;
    tracePts(pts);
    ctx.strokeStyle = rgba('#ffffff', 0.9 * t * t); ctx.lineWidth = 1.2 * t + 0.6;
    tracePts(pts);
    ctx.strokeStyle = rgba(a.col, 0.45 * t * t); ctx.lineWidth = 1.4 * t + 0.5;
    for (const f of a.forks) tracePts(f);
    drawGlow(a.x2, a.y2, 15 * t + 5, a.col, 0.5 * t);
  }
  ctx.restore();
}

function drawRings() {
  for (const r of rings) {
    const t = r.life / r.max;
    ctx.strokeStyle = rgba(r.color, t * 0.9);
    ctx.lineWidth = r.lw * t + 0.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
}

function drawFloats() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const f of floats) {
    const t = f.life / f.max;
    ctx.globalAlpha = clamp(t * 1.6, 0, 1);
    ctx.font = `700 ${f.size}px Barlow, system-ui, sans-serif`;
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.75)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  /* Low-health pulse. It belongs to a ship that can still be saved: while you
     are down it would simply hold the screen at full red for as long as your
     partner takes to clear the wave, which is exactly when you most need to
     see what they are doing. */
  const hf = P.down ? 1 : P.hp / P.maxHp;
  if (state === 'play' && hf < 0.34) {
    const a = (0.34 - hf) * (0.6 + Math.sin(uiTime * 7) * 0.4);
    const g2 = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.7);
    g2.addColorStop(0, 'rgba(239,68,68,0)');
    g2.addColorStop(1, `rgba(239,68,68,${a})`);
    ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
  }
}

/* ===========================================================================
   THE UI POINTER
   Every menu in the game runs on a canvas with the system cursor turned off,
   which is right in the arena — the crosshair is the cursor there — and wrong
   everywhere else: on the menu, the ladder, the market and the LAN panel there
   was simply nothing on screen telling you where you were pointing.

   So the menus get their own pointer. Not the gunsight: that reads as a weapon
   and these pages are not aimed at. It is an arrowhead in the same faceted
   language as the ships, carrying the accent colour of the page it is on, and
   it answers when it is over something you can press — the ring closes and the
   head brightens, so hit targets announce themselves before you click.
   ========================================================================= */
const UI_CURSOR_STATES = ['menu', 'chal', 'lan', 'shop', 'levelup', 'codex', 'gfx',
                          'malware', 'library', 'planet', 'dead', 'pause', 'talk',
                          'name', 'freeplay', 'devtalk', 'amalcut'];

/* The accent belongs to the page, so the pointer is never a foreign object on
   whichever screen it happens to be crossing. */
function uiCursorCol() {
  if (state === 'chal') return CHAL_GOLD;
  if (state === 'lan') return WING_COL;
  if (state === 'shop') return '#fbbf24';
  if (state === 'talk') return KEEPER_COL;
  if (state === 'dead') return '#f87171';
  return COL.player;
}

/* Is the pointer over something that will do anything? Asked of the same rect
   publishers the click handlers use, so the answer cannot drift from what a
   click would actually hit. */
function uiCursorHot() {
  try {
    if (state === 'menu')
      return inRect(mouse.x, mouse.y, menuLanRect()) ||
             inRect(mouse.x, mouse.y, menuChalRect());
    if (state === 'lan') {
      const mx = lanMx(), my = lanMy();
      return lanBtns.some(b => inRect(mx, my, b));
    }
    if (state === 'chal')
      return chalRows.some(r => inRect(mouse.x, mouse.y, r)) ||
             (chalStartRect && inRect(mouse.x, mouse.y, chalStartRect));
    if (state === 'shop') {
      const mx = shopMx(), my = shopMy(), b = shopButtons();
      return shopIndexAt() >= 0 || inRect(mx, my, b.reroll) || inRect(mx, my, b.leave);
    }
    if (state === 'levelup') return offerIndexAt(mouse.x, mouse.y) >= 0;
    if (state === 'codex') {
      const list = codexList();
      for (let i = 0; i < list.length; i++)
        if (inRect(mouse.x, mouse.y, codexCellRect(i))) return true;
      return false;
    }
    if (state === 'gfx') {
      const g = gfxRects();
      return g.rows.concat(g.presets, [g.measure, g.done])
              .some(b => inRect(mouse.x, mouse.y, b));
    }
    if (state === 'talk') {
      const b = talkButtons();
      return talkAsk && (inRect(mouse.x, mouse.y, b.no) || inRect(mouse.x, mouse.y, b.yes));
    }
    if (volRect && inRect(mouse.x, mouse.y, volRect)) return true;
    if (sensRect && inRect(mouse.x, mouse.y, sensRect)) return true;
  } catch (e) { /* a screen mid-transition has no rects yet */ }
  return false;
}

let uiHotT = 0;                     // eased, so the ring does not snap on and off

function drawUICursor(dt) {
  const x = mouse.x, y = mouse.y;
  const col = uiCursorCol();
  const hot = uiCursorHot();
  uiHotT += ((hot ? 1 : 0) - uiHotT) * Math.min(1, (dt || 0.016) * 14);
  const press = mouse.down ? 0.86 : 1;
  const s = (1.16 + uiHotT * 0.12) * press;

  ctx.save();
  ctx.translate(x, y);

  // the ring: open and faint at rest, closed and lit over a target
  const rr = 15 - uiHotT * 4;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = rgba(col, 0.34 + uiHotT * 0.5);
  ctx.lineWidth = 1.2;
  const gap = (1 - uiHotT) * 0.55 + 0.12;
  for (let i = 0; i < 4; i++) {
    const a0 = i * (TAU / 4) + gap + uiTime * 0.35;
    ctx.beginPath();
    ctx.arc(0, 0, rr, a0, a0 + TAU / 4 - gap * 2);
    ctx.stroke();
  }
  ctx.restore();

  ctx.scale(s, s);
  /* The head, drawn twice: a dark body first so it survives a pale panel, then
     the accent edge over it. The hotspot is the tip, at the origin. */
  const head = () => {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(11.5, 9.5);
    ctx.lineTo(6.2, 10.4);
    ctx.lineTo(4.6, 15.6);
    ctx.closePath();
  };
  ctx.fillStyle = 'rgba(2,6,14,0.92)';
  head(); ctx.fill();
  ctx.strokeStyle = rgba(col, 0.8 + uiHotT * 0.2);
  ctx.lineWidth = 1.6;
  ctx.lineJoin = 'round';
  head(); ctx.stroke();
  ctx.fillStyle = rgba(col, 0.3 + uiHotT * 0.28);
  head(); ctx.fill();

  // the lit tip: the pixel the click is actually measured from
  ctx.fillStyle = rgba(col, 0.95);
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(4.6, 3.8); ctx.lineTo(2.2, 5.4);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawCrosshair() {
  const x = aimX(), y = aimY();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = rgba(COL.player, 0.85);
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(x, y, 11, 0, TAU); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x - 17, y); ctx.lineTo(x - 6, y);
  ctx.moveTo(x + 6, y); ctx.lineTo(x + 17, y);
  ctx.moveTo(x, y - 17); ctx.lineTo(x, y - 6);
  ctx.moveTo(x, y + 6); ctx.lineTo(x, y + 17);
  ctx.stroke();
  ctx.fillStyle = rgba(COL.player, 0.9);
  ctx.fillRect(x - 1, y - 1, 2, 2);
  ctx.restore();
}

/* ---------------------------------- HUD ----------------------------------- */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

let hudBotY = 0;                   // next free baseline in the bottom-left column

function drawHUD() {
  const pad = 18;
  ctx.textBaseline = 'middle';
  hudBotY = H - pad - 30;

  /* --- health bar --- */
  const bw = Math.min(340, W * 0.4), bh = 16;
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(8,12,20,0.72)';
  roundRect(pad, pad, bw, bh, 8); ctx.fill();
  const hf = clamp(P.hp / P.maxHp, 0, 1);
  const hc = hf > 0.5 ? COL.hp : hf > 0.25 ? '#facc15' : '#ef4444';
  ctx.fillStyle = hc;
  roundRect(pad + 2, pad + 2, Math.max(0, (bw - 4) * hf), bh - 4, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(148,163,184,0.35)'; ctx.lineWidth = 1;
  roundRect(pad, pad, bw, bh, 8); ctx.stroke();
  const hpStr = `${fmtHp(P.hp)} / ${Math.round(P.maxHp)}`;
  fitFont(hpStr, bw - 18, '600', 10.5, "'JetBrains Mono', ui-monospace, monospace", 7);
  ctx.fillStyle = hf > 0.34 ? '#06111f' : '#e2e8f0';
  ctx.fillText(hpStr, pad + 9, pad + bh / 2 + 0.5);

  /* --- xp bar --- */
  const yb = pad + bh + 7;
  ctx.fillStyle = 'rgba(8,12,20,0.72)';
  roundRect(pad, yb, bw, 9, 5); ctx.fill();
  ctx.fillStyle = COL.xp;
  roundRect(pad + 1.5, yb + 1.5, Math.max(0, (bw - 3) * clamp(P.xp / P.xpNext, 0, 1)), 6, 3); ctx.fill();

  /* --- level + dash pips --- */
  ctx.save();
  ctx.letterSpacing = '0.08em';
  ctx.font = "700 12px 'Chakra Petch', Barlow, system-ui, sans-serif";
  ctx.fillStyle = '#7dd3fc';
  ctx.fillText('LV ' + P.level, pad, yb + 26);
  ctx.restore();

  let dx = pad + 58;
  for (let i = 0; i < P.dashMax; i++) {
    const filled = i < P.dashCh;
    const partial = i === P.dashCh ? clamp(P.dashRe / P.dashCd, 0, 1) : 0;
    ctx.fillStyle = 'rgba(148,163,184,0.22)';
    roundRect(dx, yb + 20, 22, 6, 3); ctx.fill();
    if (filled || partial > 0) {
      ctx.fillStyle = filled ? COL.player : rgba(COL.player, 0.5);
      roundRect(dx, yb + 20, 22 * (filled ? 1 : partial), 6, 3); ctx.fill();
    }
    dx += 26;
  }
  if (P.shieldMax) {
    for (let i = 0; i < P.shieldMax; i++) {
      ctx.fillStyle = i < P.shield ? COL.shield : 'rgba(129,140,248,0.2)';
      ctx.beginPath(); ctx.arc(dx + 6, yb + 23, 4.5, 0, TAU); ctx.fill();
      dx += 14;
    }
  }

  /* --- what you are carrying ---
     The chip, the book and the malware are each optional and any combination
     of them can be in at once, so they stack down a cursor instead of sitting
     at fixed offsets: the chip used to be pinned to yb+20, which is the dash
     pip row, and printed straight through the pips and the level. */
  let ly = yb + 44;
  ctx.textAlign = 'left';

  if (P.chip) {
    ctx.font = "700 10px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = CHIP_COL;
    ctx.globalAlpha = 0.6 + Math.sin(uiTime * 2) * 0.2;
    ctx.fillText('◧ RECORD CHIP', pad, ly);
    ctx.globalAlpha = 1;
    ly += 20;
  }

  if (P.book) {
    const ready = P.bookCharge >= P.book.cost;
    ctx.font = "700 10px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = ready ? P.book.col : '#475569';
    const bLabel = '[Q] ' + P.book.n;
    fitFont(bLabel, bw - 6, '700', 10, "Barlow, 'Segoe UI', system-ui, sans-serif", 7.5);
    ctx.fillText(bLabel, pad, ly);
    let qx = pad;
    for (let i = 0; i < P.book.cost; i++) {
      ctx.fillStyle = i < P.bookCharge ? P.book.col : 'rgba(148,163,184,0.22)';
      roundRect(qx, ly + 8, 16, 5, 3); ctx.fill();
      qx += 20;
    }
    if (ready) {
      ctx.font = "700 9px Barlow, 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = P.book.col;
      ctx.globalAlpha = 0.6 + Math.sin(uiTime * 5) * 0.4;
      ctx.fillText('READY', qx + 6, ly + 11);
      ctx.globalAlpha = 1;
    }
    ly += 28;
  }

  // the malware owns the dash, so it says so under the dash pips
  if (P.malware) {
    drawMalChip(pad + 11, ly - 3, 9, P.malware.col);   // the part, in miniature
    ctx.font = "700 10px Barlow, 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = P.malware.col;
    ctx.globalAlpha = 0.55 + Math.sin(uiTime * 2.4) * 0.2;
    const mLabel = '[SPACE] ' + P.malware.n;
    fitFont(mLabel, bw - 32, '700', 10, "Barlow, 'Segoe UI', system-ui, sans-serif", 7.5);
    ctx.fillText(mLabel, pad + 26, ly);
    ctx.globalAlpha = 1;
    ly += 22;
  }

  /* --- score / wave --- */
  ctx.textAlign = 'right';
  /* This column has to hold a nine-digit score, a looped sector name and a
     five-figure credit count without ever reaching across into the health bar,
     so every line is fitted to the gutter that is actually left. */
  const rMax = Math.max(96, W - pad * 2 - bw - 20);
  ctx.save();
  const scoreStr = score.toLocaleString();
  fitFont(scoreStr, rMax, '800', 27, "'JetBrains Mono', ui-monospace, monospace", 13);
  ctx.fillStyle = '#e2e8f0';
  ctx.fillText(scoreStr, W - pad, pad + 12);

  ctx.letterSpacing = '0.12em';
  const bestStr = 'BEST ' + Math.max(Save.profile.best, score).toLocaleString();
  fitFont(bestStr, rMax, '600', 10, "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
  ctx.fillStyle = '#5b6b82';
  ctx.fillText(bestStr, W - pad, pad + 31);
  ctx.restore();

  ctx.save();
  ctx.letterSpacing = '0.08em';
  const runStr = `WAVE ${wave}   ·   ${P.kills} KILLS   ·   ${fmtTime(elapsed)}`;
  fitFont(runStr, rMax, '600', 11, "Barlow, 'Segoe UI', system-ui, sans-serif", 8);
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(runStr, W - pad, pad + 50);

  ctx.letterSpacing = '0.09em';
  const secStr = stage.name + (loopNum > 0 ? '  ×' + (loopNum + 1) : '') +
                 '   ' + (((wave - 1) % 5) + 1) + '/5';
  fitFont(secStr, rMax, '600', 12, "'Chakra Petch', Barlow, system-ui, sans-serif", 8);
  ctx.fillStyle = stage.accent;
  ctx.fillText(secStr, W - pad, pad + 70);
  ctx.restore();

  const credStr = '◈ ' + credits;
  fitFont(credStr, rMax, '800', 15, "'JetBrains Mono', ui-monospace, monospace", 10);
  ctx.fillStyle = '#fbbf24';
  ctx.fillText(credStr, W - pad, pad + 92);
  if (hardOn()) {
    ctx.save();
    ctx.letterSpacing = '0.14em';
    fitFont('⚠ ESCALATED', rMax, '700', 9, "Barlow, 'Segoe UI', system-ui, sans-serif", 7);
    ctx.fillStyle = rgba('#f87171', 0.5 + Math.sin(uiTime * 1.6) * 0.14);
    ctx.fillText('⚠ ESCALATED', W - pad, pad + 110);
    ctx.restore();
  }

  /* --- boss bar --- */
  // a shadow is on loan and must never take the real boss's bar
  /* THE AMALGAM owns the bar outright. Its limbs are nine separate boss
     enemies, so the finder below would label the whole fight after whichever
     piece happens to sit first in the array — and show that piece's health
     instead of the pool. */
  const boss = amalgam ? null
    : enemies.find(e => e.type === 'boss' && !e.dead && !e.shadow && !e.hacked);
  if (amalgam) drawAmalgamBar();
  else if (boss) {
    const w2 = Math.min(560, W * 0.62), x2 = (W - w2) / 2, y2 = 22;
    ctx.textAlign = 'center';
    const bd = BOSSES[boss.boss] || BOSSES.warden;
    const bcol = boss.virus ? VIRUS_COL : bd.col;
    const bname = boss.virus ? '!! ' + bd.name + ' — CORRUPTED !!' : bd.name;
    ctx.fillStyle = 'rgba(8,12,20,0.75)';
    roundRect(x2, y2, w2, 14, 7); ctx.fill();
    ctx.fillStyle = bcol;
    roundRect(x2 + 2, y2 + 2, Math.max(0, (w2 - 4) * clamp(boss.hp / boss.maxHp, 0, 1)), 10, 5); ctx.fill();
    ctx.strokeStyle = rgba(bcol, 0.5); ctx.lineWidth = 1;
    roundRect(x2, y2, w2, 14, 7); ctx.stroke();
    // armour is invisible otherwise: the player just sees smaller numbers
    const unwCut = boss.boss === 'unwritten'
      ? (UNW_DR[P.weapon] !== undefined ? UNW_DR[P.weapon] : 0.95) : 0;
    if (boss.armor > 0 || boss.dr > 0 || unwCut > 0) {
      ctx.font = "700 9px 'JetBrains Mono', ui-monospace, monospace";
      ctx.fillStyle = unwCut ? '#c084fc' : '#94a3b8';
      const armStr = unwCut
        ? '⛨ −' + Math.round(unwCut * 100) + '%' +
          (unwritten && unwritten.rage > 1.02
            ? '   ⚠ ×' + unwritten.rage.toFixed(2) : '')
        : '⛨ ' + Math.round(boss.armor) +
          (boss.dr > 0 ? '  −' + Math.round(boss.dr * 100) + '%' : '');
      if (x2 + w2 + 8 + ctx.measureText(armStr).width < W - 8) {
        ctx.textAlign = 'left';
        ctx.fillText(armStr, x2 + w2 + 8, y2 + 11);
      } else {
        ctx.textAlign = 'right';
        ctx.fillText(armStr, x2 + w2, y2 + 28);
      }
      ctx.textAlign = 'center';
    }
    ctx.save();
    ctx.letterSpacing = '0.1em';
    const bLabel = bname + (boss.invuln
      ? (boss.finale ? '   — OVERLOAD'
         : boss.boss === 'broodmother' ? '   — SUBMERGED' : '   — CHANGING') : '');
    fitFont(bLabel, w2 - 12, '600', 13, "'Chakra Petch', Barlow, system-ui, sans-serif", 9);
    ctx.fillStyle = bcol;
    ctx.fillText(bLabel, W / 2, y2 + 29);
    ctx.restore();
    // offscreen indicator
    const sx = (boss.x - cam.x) * camZoom + W / 2,
          sy = (boss.y - cam.y) * camZoom + H / 2;
    if (sx < 0 || sy < 0 || sx > W || sy > H) {
      const a = Math.atan2(boss.y - cam.y, boss.x - cam.x);
      const rx = W / 2 + Math.cos(a) * (Math.min(W, H) * 0.42);
      const ry = H / 2 + Math.sin(a) * (Math.min(W, H) * 0.42);
      ctx.save();
      ctx.translate(rx, ry); ctx.rotate(a);
      ctx.fillStyle = rgba(bd.col, 0.85);
      ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-8, 8); ctx.lineTo(-8, -8); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  /* --- banner --- */
  if (bannerT > 0) {
    const t = bannerT / 2.2;
    const a = clamp(Math.min(t * 3.4, (1 - t) * 6), 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.letterSpacing = '0.05em';
    fitFont(bannerText, W - 60, '700', 42,
