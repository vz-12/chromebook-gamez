<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#05060a}a{color:#a3e635}a:hover{color:#fde047}</style>
</helmet>
<div style="position:fixed;inset:0;background:#05060a"></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    if (window.__suLoaded) return;
    window.__suLoaded = true;
    const files = ['./su-base.js', './su-kit-sim.js', './su-art.js'];
    const next = i => {
      if (i >= files.length) { window.suStart(); return; }
      const s = document.createElement('script');
      s.src = files[i]; s.onload = () => next(i + 1);
      document.body.appendChild(s);
    };
    next(0);
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
