# VOIDRUNNER — static single-file deploy.
# There is no build step: index.html is the entire game.

[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Always revalidate the game itself so players pick up new builds immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cross-origin isolation is deliberately NOT enabled here, and no
# Content-Security-Policy is set. Fireproof is loaded as an ES module from
# https://esm.sh at runtime; a restrictive script-src or COEP policy would
# block it and silently drop the game back to localStorage saves.
# If you add a CSP later, it must allow:
#   script-src  'self' 'unsafe-inline' https://esm.sh
#   connect-src 'self' https://esm.sh
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Not for players. publish = "." puts every file in the repo on the site, so
# these are shut explicitly: ALL HALLOWS' script and art guide (the story must
# not be readable before the event opens), and the functions' source, which
# carries the dev accounts' password hashes. The functions themselves answer
# on /api/*, not on these paths, and hl-art.js is left alone: the game fetches
# it.
[[redirects]]
  from = "/EVENT-DRAFTS.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/HALLOWS-GUIDE.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/HALLOWEEN-PLAN.txt"
  to = "/404.html"
  status = 404
  force = true

# THE VAGRANT's rite: its script, lines and art contract
[[redirects]]
  from = "/VAGRANT-GUIDE.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
