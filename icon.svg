<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The menu's emblem, held still: the pink hexagon and the pilot's two
       triangles, in the game's own colours (COL.player, #f472b6). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#0d2a33"/>
      <stop offset="0.55" stop-color="#070b14"/>
      <stop offset="1" stop-color="#05060a"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <g filter="url(#glow)" fill="none" stroke-linejoin="round">
    <polygon points="256,62 424,159 424,353 256,450 88,353 88,159" stroke="#f472b6" stroke-width="20" stroke-opacity="0.85"/>
    <polygon points="256,118 382,336 130,336" stroke="#67e8f9" stroke-width="26"/>
    <polygon points="256,206 316,310 196,310" stroke="#67e8f9" stroke-width="16" fill="#67e8f9" fill-opacity="0.22"/>
  </g>
</svg>
