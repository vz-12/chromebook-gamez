<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05060a">
<meta name="robots" content="noindex">
<title>VOIDRUNNER · survey results</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/surveys/surveys.css">
</head>
<body>
<!-- THE SURVEYS' RESULTS: what players answered in the menu's QUICK SURVEY,
     counted. For admins (an account with the 'dev' perk, signed in on this
     same address); everyone else is told so. The data is /api/survey's
     (src/survey.js); the questions are src/survey-bank.js. -->
<header class="top">
  <a class="back" href="/">← PLAY VOIDRUNNER</a>
  <h1>SURVEY RESULTS</h1>
  <p class="sub" id="sub">&nbsp;</p>
</header>

<main>
  <form class="controls" id="controls" autocomplete="off" hidden>
    <label class="ctl">
      <span>PERIOD</span>
      <select id="days">
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="365">Last year</option>
        <option value="0">All time</option>
      </select>
    </label>
    <label class="ctl">
      <span>SPLIT BY</span>
      <select id="by"></select>
    </label>
    <div class="filters" id="filters"></div>
    <label class="check"><input type="checkbox" id="beta"> <span>Include beta builds</span></label>
    <a class="csv" id="csv" href="/api/survey?export=1" download>DOWNLOAD CSV</a>
  </form>

  <section class="kpis" id="kpis" hidden></section>
  <p class="note" id="note" hidden></p>
  <section class="questions" id="questions" aria-live="polite"></section>
</main>

<div class="tip" id="tip" role="tooltip" hidden></div>
<script src="/surveys/surveys.js"></script>
</body>
</html>
