<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>THE RITE · SEQUENCES 1–4 (BEAMS, TELLS, HAND-OFFS)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;600;800&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#05060a;
    font-family:Barlow,'Segoe UI',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
  canvas{display:block;width:100%;height:100%;cursor:crosshair}
</style>

<body>
<canvas id="c"></canvas>
<script>
/* ===========================================================================
   THE RITE — sequences 1 to 4, on their own.
   ---------------------------------------------------------------------------
   The clash (SEQ 5) has its own file. This is the other eighty per cent of
   the fight: his four cutting sequences, drawn in the same vocabulary the
   clash render uses, and — the point of this file — the seams between them.

   Nothing in here switches on.

     the seam      RITE_HAND   what he was holding is let go and falls out of
                               the room; he gathers, visibly, holding nothing
     the spool     RITE_ARM    one aperture winds up, throws a sighting line
                               down the heading it is about to take, and two
                               brackets close on that line
     the strike                a flare, a thump, and only then is it a beam
                               you can be burned by or cut
     the hand-off  SEQ 4       the live one of the seven is handed over: the
                               next spools while the hot one goes cold

   The beam itself is the clash column in plan: floor light under it, the
   donors' colours as sheets stacked THROUGH it, chevrons riding outward,
   a turbulent boundary, one hard white core, the aperture as its heaviest
   point, and the crossing drawn last because the crossing is the fight.

   1–4 sequences · SPACE replay the seam · hold MOUSE to hold the cut · F data
   Mirrors index.html: riteBeamLife / drawRiteCharge / drawRiteBeam.
=========================================================================== */

const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a = 1, b = 0) => b + Math.random() * (a - b);
const rndi = (a, b = 0) => Math.floor(rnd(a, b));
const pick = arr => arr[(Math.random() * arr.length) | 0];
const len = (x, y) => Math.hypot(x, y);
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function mix(h1, h2, t) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  return 'rgb(' + Math.round(lerp((a >> 16) & 255, (b >> 16) & 255, t)) + ',' +
         Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, t)) + ',' +
         Math.round(lerp(a & 255, b & 255, t)) + ')';
}
const _glow = new Map();
function glowSprite(hex) {
  let s = _glow.get(hex);
  if (s) return s;
  s = document.createElement('canvas'); s.width = s.height = 128;
  const g = s.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, rgba(hex, 1)); gr.addColorStop(0.3, rgba(hex, 0.4));
  gr.addColorStop(1, rgba(hex, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  _glow.set(hex, s); return s;
}
function drawGlow(x, y, r, color, a = 1) {
  if (r <= 0 || a <= 0) return;
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.drawImage(glowSprite(color), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1;
}
/* segment × segment, the game's own: t is how far along the FIRST segment */
function segSeg(x1, y1, x2, y2, x3, y3, x4, y4) {
  const d = (x2 - x1) * (y4 - y3) - (y2 - y1) * (x4 - x3);
  if (!d) return null;
  const t = ((x3 - x1) * (y4 - y3) - (y3 - y1) * (x4 - x3)) / d;
  const u = ((x3 - x1) * (y2 - y1) - (y3 - y1) * (x2 - x1)) / d;
  if (t < 0 || t > 1 || u < 0 || u > 1) return null;
  return { x: x1 + (x2 - x1) * t, y: y1 + (y2 - y1) * t, t };
}

/* --------------------------------- canvas -------------------------------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

/* ------------------------------- the room --------------------------------
   The rite is fought in a 1900×1300 box with him upfield. The view is fixed
   and fitted to it, so nothing here needs the game's camera.
-------------------------------------------------------------------------- */
const ARENA = { w: 1900, h: 1300 };
const BOSS = { x: 0, y: -300 };
const cam = { x: 0, y: 0 };
let camZoom = 1;
function fit() {
  camZoom = Math.min(W / (ARENA.w * 1.06), H / (ARENA.h * 1.06));
  cam.x = 0; cam.y = 0;
}
function onScreen(x, y, pad = 90) {
  return Math.abs(x - cam.x) < W / (2 * camZoom) + pad &&
         Math.abs(y - cam.y) < H / (2 * camZoom) + pad;
}

/* ------------------------------- particles ------------------------------- */
let parts = [], rings = [], floats = [];
function spawnPart(x, y, vx, vy, r, col, life, drag = 0.92) {
  if (parts.length > 700) return;
  parts.push({ x, y, vx, vy, r, col, life, max: life, drag });
}
function burst(x, y, n, col, spd, r, life) {
  for (let i = 0; i < n; i++) {
    const a = rnd(TAU), s = rnd(spd, spd * 0.3);
    spawnPart(x, y, Math.cos(a) * s, Math.sin(a) * s, rnd(r, r * 0.4), col, rnd(life, life * 0.4));
  }
}
function ringFx(x, y, r0, r1, col, life, w) { rings.push({ x, y, r0, r1, col, life, max: life, w }); }
function floatText(x, y, s, col, size) { floats.push({ x, y, s, col, size, t: 0 }); }
function updateFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    const k = Math.pow(p.drag, dt * 60);
    p.vx *= k; p.vy *= k;
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    rings[i].life -= dt;
    if (rings[i].life <= 0) rings.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    floats[i].t += dt;
    if (floats[i].t > 0.9) floats.splice(i, 1);
  }
}
function drawFx() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const k = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = k;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + k * 0.8), 0, TAU); ctx.fill();
  }
  for (const r of rings) {
    const k = 1 - r.life / r.max;
    ctx.globalAlpha = (1 - k) * 0.7;
    ctx.strokeStyle = r.col; ctx.lineWidth = r.w * (1 - k * 0.6);
    ctx.beginPath(); ctx.arc(r.x, r.y, lerp(r.r0, r.r1, k), 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

let shakeAmt = 0;
function shake(t) { shakeAmt = Math.min(1, shakeAmt + t); }
function shakeAt(x, y, t) { shake(t * 0.7); }
const Audio_ = { tone() {}, boss() {}, boom() {} };
let bannerTxt = '', bannerT = 0, bannerCol = '#d8b4fe';
function banner(s, col, life) { bannerTxt = s; bannerCol = col; bannerT = life; }

/* ============================== HIS BODY =================================
   The rite chassis, lifted from index.html: nine donors on a rig, each plate
   a beveled box with a gradient and seams, and FORGEHEART as the aperture —
   the vanes crank with whatever he is about to do, which is the first thing
   in the room that says a beam is coming.
========================================================================= */
const AMAL_COL = '#d8b4fe';
const RAINBOW = ['#f87171','#fb923c','#fde047','#4ade80','#38bdf8','#a78bfa','#f472b6'];
const PLATE_DK = '#0b0912', PLATE_MD = '#191428', PLATE_LT = '#2b2242';
const RIG = '#d8b4fe', APERTURE = '#f472b6', VANE = '#f9a8d4';

const PARTS = [
  { id:'head',  n:'NULLCORE',    ox:   0, oy:-360, r:50, layer:2, w:112, h:112, plates:3, kind:'skull',    tint:'#a78bfa' },
  { id:'spine', n:'THE OTHER',   ox:   0, oy:-246, r:34, layer:0, w: 92, h:140, plates:4, kind:'stack',    tint:'#5eead4' },
  { id:'torso', n:'FORGEHEART',  ox:   0, oy: -20, r:98, layer:1, w:246, h:230, plates:5, kind:'chest',    tint:'#f59e0b' },
  { id:'shldL', n:'CURATOR',     ox:-150, oy:-190, r:52, layer:2, w:126, h:112, plates:3, kind:'pauldron', tint:'#e2e8f0' },
  { id:'shldR', n:'ARCHIVIST',   ox: 150, oy:-190, r:52, layer:2, w:126, h:112, plates:3, kind:'pauldron', tint:'#38bdf8' },
  { id:'armL',  n:'WARDEN',      ox:-238, oy:  30, r:48, layer:2, w: 94, h:196, plates:4, kind:'arm',      tint:'#ef4444' },
  { id:'armR',  n:'WARDEN',      ox: 238, oy:  30, r:48, layer:2, w: 94, h:196, plates:4, kind:'arm',      tint:'#ef4444' },
  { id:'legL',  n:'BROODMOTHER', ox:-100, oy: 188, r:54, layer:0, w:126, h:200, plates:4, kind:'leg',      tint:'#4ade80' },
  { id:'legR',  n:'BROODMOTHER', ox: 100, oy: 188, r:54, layer:0, w:126, h:200, plates:4, kind:'leg',      tint:'#4ade80' }
];
const BONES = [['head','spine'],['spine','torso'],['spine','shldL'],['spine','shldR'],
               ['shldL','armL'],['shldR','armR'],['torso','legL'],['torso','legR']];

const slot = id => {
  const p = PARTS.find(z => z.id === id);
  return { x: BOSS.x + p.ox, y: BOSS.y + p.oy };
};

function amalPlate(w, h, p, hurt) {
  const bev = Math.min(w, h) * 0.22;
  const path = () => {
    ctx.beginPath();
    ctx.moveTo(-w / 2 + bev, -h / 2); ctx.lineTo(w / 2 - bev, -h / 2);
    ctx.lineTo(w / 2, -h / 2 + bev);  ctx.lineTo(w / 2, h / 2 - bev);
    ctx.lineTo(w / 2 - bev, h / 2);   ctx.lineTo(-w / 2 + bev, h / 2);
    ctx.lineTo(-w / 2, h / 2 - bev);  ctx.lineTo(-w / 2, -h / 2 + bev);
    ctx.closePath();
  };
  path();
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, PLATE_MD); g.addColorStop(0.45, PLATE_DK); g.addColorStop(1, '#05040a');
  ctx.fillStyle = g; ctx.fill();

  ctx.save(); path(); ctx.clip();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.1 + hurt * 0.3;
  ctx.fillStyle = p.tint; ctx.fillRect(-w, -h, w * 2, h * 2);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = PLATE_LT; ctx.lineWidth = 1.2;
  for (let i = 1; i < p.plates; i++) {
    const y = -h / 2 + h * (i / p.plates);
    ctx.beginPath(); ctx.moveTo(-w / 2, y); ctx.lineTo(w / 2, y); ctx.stroke();
  }
  ctx.globalAlpha = 0.3;
  ctx.beginPath(); ctx.moveTo(-w * 0.18, -h / 2); ctx.lineTo(-w * 0.18, h / 2); ctx.stroke();
  ctx.restore();

  path();
  ctx.strokeStyle = hurt > 0.3 ? mix(p.tint, '#fff7ed', hurt * 0.7) : rgba(p.tint, 0.75);
  ctx.lineWidth = 2.2; ctx.stroke();
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = rgba(p.tint, 0.9); ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(-w / 2 + bev, -h / 2 + 2); ctx.lineTo(w / 2 - bev, -h / 2 + 2); ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawBody(t) {
  // ground contact first: in plan view this is what gives the plates mass
  ctx.save();
  for (const p of PARTS) {
    const s = slot(p.id);
    ctx.globalAlpha = 0.34; ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(s.x, s.y + p.h * 0.22, p.w * 0.56, p.h * 0.26, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  // the rig: dark core, mid plate, lit conduit, and a pulse toward the chest
  ctx.save();
  ctx.lineCap = 'round';
  for (const [x, y] of BONES) {
    const A = slot(x), B = slot(y);
    ctx.strokeStyle = '#07050c'; ctx.lineWidth = 26;
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
    ctx.strokeStyle = PLATE_MD; ctx.lineWidth = 18;
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
    ctx.strokeStyle = rgba(RIG, 0.35); ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5 + Math.sin(t * 4 - A.x * 0.006) * 0.3;
    ctx.strokeStyle = '#fff7ed'; ctx.lineWidth = 1.3;
    ctx.setLineDash([4, 16]); ctx.lineDashOffset = t * 180;
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
  ctx.restore();

  const order = PARTS.slice().sort((u, v) => (u.layer - v.layer) || (u.oy - v.oy));
  for (const p of order) {
    const s = slot(p.id), hurt = 0.15;
    ctx.save();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(s.x, s.y, p.r * 1.8, p.tint, 0.12);
    ctx.restore();
    ctx.translate(s.x, s.y);
    const cant = (p.kind === 'arm' ? Math.sign(p.ox) * 0.12
               : p.kind === 'leg' ? Math.sign(p.ox) * 0.07 : 0)
               + Math.sin(t * 0.7 + p.ox * 0.01) * 0.02;
    ctx.rotate(cant);
    amalPlate(p.w, p.h, p, hurt);

    // the salvaged core: a housing, three spinning arcs, an iris
    const cr = p.r * 0.3;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(0, 0, cr * 3.2, p.tint, 0.3 + Math.sin(t * 3 + p.oy * 0.02) * 0.1);
    ctx.restore();
    ctx.fillStyle = '#05040a';
    ctx.beginPath(); ctx.arc(0, 0, cr * 1.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba(p.tint, 0.8); ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 0, cr * 1.5, 0, TAU); ctx.stroke();
    ctx.save();
    ctx.rotate(t * (p.kind === 'chest' ? 0.5 : 0.9) * (p.ox > 0 ? 1 : -1));
    ctx.strokeStyle = rgba(p.tint, 0.5); ctx.lineWidth = 1.2;
    for (let i = 0; i < 3; i++) {
      const a0 = i * TAU / 3;
      ctx.beginPath(); ctx.arc(0, 0, cr * 1.1, a0, a0 + 1.2); ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 0.75 + Math.sin(t * 5 + p.oy * 0.03) * 0.2;
    ctx.fillStyle = p.tint;
    ctx.beginPath(); ctx.arc(0, 0, cr * 0.55, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;

    /* FORGEHEART is the muzzle, so it has to look like the part that makes
       the beam: collector vanes that crank open with the load. */
    if (p.kind === 'chest') {
      const warm = R.warm > 0 ? clamp(1 - R.warm / RITE_HAND, 0, 1) : 0;
      let armp = 0;
      for (const bm of R.beams) if (bm.arm > 0) armp = Math.max(armp, 1 - bm.arm / bm.armMax);
      const load = 0.25 + Math.max(warm, armp) * 0.6;
      const ap = p.r * 0.62;
      ctx.strokeStyle = rgba(APERTURE, 0.6); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, ap, 0, TAU); ctx.stroke();
      for (let i = 0; i < 10; i++) {
        const a0 = i / 10 * TAU + t * 0.25;
        const open = ap * (0.42 + load * 0.5);
        ctx.strokeStyle = rgba(VANE, 0.45); ctx.lineWidth = 3.4;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a0) * ap * 0.96, Math.sin(a0) * ap * 0.96);
        ctx.lineTo(Math.cos(a0 + 0.3) * open, Math.sin(a0 + 0.3) * open);
        ctx.stroke();
      }
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(0, 0, ap * 1.6 * (0.7 + load * 0.6), APERTURE, 0.45 * (0.5 + load));
      ctx.restore();
    }
    ctx.restore();
  }
}

/* ============================== THE RITE =================================
   Constants and lifecycle are index.html's. Changing one here and not there
   is how the two drift apart, so they are named the same on both sides.
========================================================================= */
const RITE_LEN        = 6000;
const RITE_HALF       = 44;
const RITE_BAND       = 190;
const RITE_HAND       = 1.35;
const RITE_ARM        = 0.85;
const RITE_SEVEN_TELL = 0.55;
const RITE_SPIN_SWEEP   = 1.75;
const RITE_SPIN_SCISSOR = 1.10;
const RITE_SPIN_FAN     = 0.80;
const RITE_SPIN_SEVEN   = 0.14;
const RITE_SPLIT        = 300;
const RITE_SEQ = [
  { id:'sweep',   n:'IT SWEEPS' },
  { id:'scissor', n:'IT OPENS' },
  { id:'fan',     n:'IT SPLITS' },
  { id:'seven',   n:'ALL OF IT AT ONCE' }
];

const R = { i: -1, seq: null, t: 0, beams: [], out: [], warm: 0,
            gT: 2.0, liveT: 0, live: 0, next: -1, swapT: 0 };

function riteOrigin(id) { return slot(id); }

function riteEnter(i) {
  R.i = i;
  R.seq = RITE_SEQ[i].id;
  R.t = 0;
  R.out = R.out.concat(R.beams.map(b => { b.going = true; b.cut = null; return b; }));
  R.beams = [];
  R.warm = RITE_HAND;
  R.gT = 1.6 + R.warm; R.liveT = 0; R.live = 0; R.next = -1; R.swapT = 0;
  banner(RITE_SEQ[i].n, AMAL_COL, 3.2);
  shake(1.4);
  hazards.length = 0;
}

function riteBeam(o, ang, spin, col, extra) {
  const b = Object.assign({ ox: o.x, oy: o.y, ang, spin, col,
                            cut: null, from: null, dead: false,
                            on: 0, arm: RITE_ARM, flash: 0, going: false }, extra || {});
  b.armMax = Math.max(0.0001, b.arm);
  R.beams.push(b);
  return b;
}

/* An aperture spools, throws a sighting line down the heading it is going to
   take, and strikes. Letting go is the same thing in reverse. Until it has
   struck it cannot burn you and there is nothing there to cut. */
function riteBeamLife(b, dt) {
  if (b.going) { b.on = Math.max(0, b.on - dt * 2.4); b.arm = 0; return; }
  if (b.arm > 0) {
    b.arm = Math.max(0, b.arm - dt);
    if (b.arm === 0) riteStrike(b);
    return;
  }
  const want = b.dead ? 0 : 1;
  b.on += (want - b.on) * Math.min(1, dt * (want ? 9 : 5));
  b.flash = Math.max(0, (b.flash || 0) - dt * 2.6);
}
function riteStrike(b) {
  b.on = 0.05; b.flash = 1;
  ringFx(b.ox, b.oy, 8, 170, b.col, 0.5, 3);
  burst(b.ox, b.oy, 10, b.col, 240, 2.6, 0.35);
  shakeAt(b.ox, b.oy, 0.35);
}
function riteWarmFx(dt) {
  const o = riteOrigin('torso');
  if (Math.random() < dt * 30)
    spawnPart(o.x + rnd(80, -80), o.y + rnd(80, -80), rnd(110, -110), rnd(110, -110),
              rnd(2.8, 1.2), pick(RAINBOW), rnd(0.55, 0.25), 0.9);
}

/* the crossing, and whether it is hot enough to hold */
const CUT_RANGE = 560;
function riteCut(b) {
  if (!ship.firing) return null;
  const ex = b.ox + Math.cos(b.ang) * RITE_LEN;
  const ey = b.oy + Math.sin(b.ang) * RITE_LEN;
  const hit = segSeg(b.ox, b.oy, ex, ey, ship.x, ship.y, ship.lx, ship.ly);
  if (!hit) return null;
  /* the cut only holds where your own beam is still hot — a crossing made at
     arm's length is free, which is why you have to stand next to his light */
  if (len(hit.x - ship.x, hit.y - ship.y) > CUT_RANGE) return null;
  return hit;
}
function riteReach(b) { return b.cut ? len(b.cut.x - b.ox, b.cut.y - b.oy) : RITE_LEN; }

function riteBeamTick(b, dt, opts) {
  opts = opts || {};
  riteBeamLife(b, dt);
  // charging, cooling, or being let go: light, but nothing to stand in or cut
  if (b.dead || b.going || b.arm > 0 || b.on < 0.55) { b.cut = null; return; }
  b.cut = riteCut(b);
  const reach = riteReach(b);

  // burn along the surviving length only
  if (!opts.noBurn) {
    const c = Math.cos(-b.ang), s = Math.sin(-b.ang);
    const dx = ship.x - b.ox, dy = ship.y - b.oy;
    const along = dx * c - dy * s, across = dx * s + dy * c;
    if (along > -18 && along < reach && Math.abs(across) < RITE_HALF) {
      ship.burn = 0.2;
      if (Math.random() < 0.4)
        spawnPart(ship.x + rnd(18, -18), ship.y + rnd(18, -18), rnd(150, -150),
                  rnd(150, -150), rnd(3.6, 1.8), b.col, 0.4, 0.9);
    }
  }
  if (b.cut && !opts.noDamage) {
    cutHeld = 0.15;
    if (Math.random() < 0.7)
      spawnPart(b.cut.x + rnd(9, -9), b.cut.y + rnd(9, -9), rnd(190, -190),
                rnd(190, -190), rnd(3.2, 1.4),
                Math.random() < 0.5 ? '#fff7ed' : b.col, rnd(0.4, 0.18), 0.9);
  }
}

/* ---- SEQ 1. one beam turning fast, and grenades that cut the floor into
   eighths so the shadow you are standing in cannot be stood in for long. --- */
function riteSweep(dt) {
  if (!R.beams.length) {
    const b = riteBeam(riteOrigin('torso'), rnd(TAU), RITE_SPIN_SWEEP, RAINBOW[0]);
    b.from = 'torso';
  }
  const b = R.beams[0], o = riteOrigin('torso');
  b.ox = o.x; b.oy = o.y;
  b.ang += b.spin * dt;
  riteBeamTick(b, dt);
  R.gT -= dt;
  if (R.gT <= 0) { R.gT = 3.4; riteGrenade(); }
}

/* ---- SEQ 2. both arms, turning against each other. ---- */
function riteScissor(dt) {
  if (!R.beams.length) {
    // one arm spools, then the other: two beams arriving at once reads as a cut
    const l  = riteBeam(riteOrigin('armL'), rnd(TAU),  RITE_SPIN_SCISSOR, RAINBOW[1], { arm: RITE_ARM });
    const rr = riteBeam(riteOrigin('armR'), rnd(TAU), -RITE_SPIN_SCISSOR, RAINBOW[4], { arm: RITE_ARM + 0.4 });
    l.from = 'armL'; rr.from = 'armR';
  }
  for (const b of R.beams) {
    const o = riteOrigin(b.from);
    b.ox = o.x; b.oy = o.y;
    b.ang += b.spin * dt;
    riteBeamTick(b, dt);
  }
}

/* ---- SEQ 3. a trunk and four branches hung off it. ---- */
function riteFan(dt) {
  if (!R.beams.length) {
    const t = riteBeam(riteOrigin('torso'), rnd(TAU), RITE_SPIN_FAN, RAINBOW[2]);
    t.from = 'torso'; t.trunk = true;
    for (let i = 0; i < 4; i++) {
      // the branches are hung off a trunk that is already up
      const br = riteBeam({ x: 0, y: 0 }, 0, 0, RAINBOW[(i + 3) % RAINBOW.length],
                          { arm: RITE_ARM + 0.55 + i * 0.1 });
      br.from = 'torso'; br.branch = (i - 1.5) * 0.42;
    }
  }
  const t = R.beams[0], o = riteOrigin('torso');
  t.ox = o.x; t.oy = o.y;
  t.ang += t.spin * dt;
  riteBeamTick(t, dt);
  const cutShort = t.cut && riteReach(t) < RITE_SPLIT;
  const sx = t.ox + Math.cos(t.ang) * RITE_SPLIT;
  const sy = t.oy + Math.sin(t.ang) * RITE_SPLIT;
  for (let i = 1; i < R.beams.length; i++) {
    const b = R.beams[i];
    b.dead = !!cutShort;
    b.ox = sx; b.oy = sy;
    b.ang = t.ang + b.branch;
    riteBeamTick(b, dt, { noDamage: true });
  }
}

/* ---- SEQ 4. Seven, still, one of them live, and the live one moves. ---- */
function riteSeven(dt) {
  if (!R.beams.length) {
    for (let i = 0; i < 7; i++) {
      // they come up around the circle in order, so seven is a thing he did
      const b = riteBeam(riteOrigin('torso'), i * TAU / 7, RITE_SPIN_SEVEN, RAINBOW[i],
                         { arm: RITE_ARM + i * 0.14 });
      b.from = 'torso';
    }
    R.liveT = 1.2 + RITE_ARM + 7 * 0.14;
    R.next = -1; R.swapT = 0;
  }
  /* The live one is handed over rather than teleported: the next aperture
     spools for RITE_SEVEN_TELL while the hot one goes out. */
  R.liveT -= dt;
  if (R.liveT <= 0 && R.next < 0) {
    R.liveT = 1.1 + RITE_SEVEN_TELL;
    let n = R.live;
    while (n === R.live) n = rndi(7);
    R.next = n; R.swapT = RITE_SEVEN_TELL;
    const nb = R.beams[n];
    if (nb) { nb.dead = false; nb.arm = RITE_SEVEN_TELL; nb.armMax = RITE_SEVEN_TELL; }
  }
  if (R.next >= 0) {
    R.swapT -= dt;
    if (R.swapT <= 0) { R.live = R.next; R.next = -1; }
  }
  const o = riteOrigin('torso');
  for (let i = 0; i < R.beams.length; i++) {
    const b = R.beams[i];
    b.ox = o.x; b.oy = o.y;
    b.ang += b.spin * dt;
    b.dead = (i !== R.live) && i !== R.next;   // six are only light
    riteBeamTick(b, dt);
  }
}

/* the grenade: it lands, and a moment later the floor opens along all eight
   compass lines out of wherever it stopped. Telegraphed, like everything. */
const hazards = [];
function riteGrenade() {
  const gx = clamp(ship.x + rnd(150, -150), -ARENA.w / 2 + 80, ARENA.w / 2 - 80);
  const gy = clamp(ship.y + rnd(150, -150), -ARENA.h / 2 + 80, ARENA.h / 2 - 80);
  for (let i = 0; i < 8; i++)
    hazards.push({ x: gx, y: gy, ang: i * Math.PI / 4, t: 0, life: 2.1,
                   col: RAINBOW[i % RAINBOW.length] });
  ringFx(gx, gy, 10, 190, '#fde68a', 0.6, 4);
  burst(gx, gy, 18, '#fde68a', 200, 3, 0.5);
}
function updateHazards(dt) {
  for (let i = hazards.length - 1; i >= 0; i--) {
    hazards[i].t += dt;
    if (hazards[i].t > hazards[i].life) hazards.splice(i, 1);
  }
}
function drawHazards() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const h of hazards) {
    const warn = clamp(h.t / 1.0, 0, 1);
    const live = h.t > 1.0;
    const L = 4000;
    const ca = Math.cos(h.ang), sa = Math.sin(h.ang);
    const x1 = h.x - ca * L, y1 = h.y - sa * L, x2 = h.x + ca * L, y2 = h.y + sa * L;
    if (!live) {
      ctx.globalAlpha = 0.1 + warn * 0.3;
      ctx.strokeStyle = h.col; ctx.lineWidth = 1 + warn * 3;
      ctx.setLineDash([14, 26]); ctx.lineDashOffset = -h.t * 200;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.setLineDash([]);
    } else {
      const k = clamp(1 - (h.t - 1.0) / (h.life - 1.0), 0, 1);
      ctx.globalAlpha = 0.2 * k; ctx.strokeStyle = h.col; ctx.lineWidth = 34;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.globalAlpha = 0.85 * k; ctx.strokeStyle = '#fff7ed'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
  }
  ctx.restore();
}

function riteTick(dt) {
  R.t += dt;
  // whatever he let go of, on its way out of the room
  for (let i = R.out.length - 1; i >= 0; i--) {
    riteBeamLife(R.out[i], dt);
    if (R.out[i].on <= 0.01) R.out.splice(i, 1);
  }
  /* the seam. He is holding nothing and winding up, and the sequence below
     does not get to spawn anything until he has finished doing it. */
  if (R.warm > 0) {
    R.warm -= dt;
    riteWarmFx(dt);
    if (R.warm > 0) return;
  }
  if (R.seq === 'sweep')        riteSweep(dt);
  else if (R.seq === 'scissor') riteScissor(dt);
  else if (R.seq === 'fan')     riteFan(dt);
  else if (R.seq === 'seven')   riteSeven(dt);
}

/* ============================== THE BEAM =================================
   Identical to index.html's drawRiteCold / drawRiteCharge / drawRiteBeam.
========================================================================= */
const _riteSheets = new Map();
function riteSheets(col) {
  let s = _riteSheets.get(col);
  if (s) return s;
  const i = Math.max(0, RAINBOW.indexOf(col)), n = RAINBOW.length;
  s = [RAINBOW[(i + n - 1) % n], col, '#fff7ed', col, RAINBOW[(i + 1) % n]];
  _riteSheets.set(col, s);
  return s;
}
function riteWidthAt(d, press) {
  return RITE_HALF * (1.06 - 0.2 * clamp(d / 2400, 0, 1)) * press;
}
function riteDrawLen(b, reach) {
  return Math.min(reach, len(b.ox - cam.x, b.oy - cam.y) + Math.hypot(W, H) / camZoom);
}

function drawRiteCold(b, t, ca, sa, px, py, ex, ey, fade) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const w = RITE_HALF * 0.5;
  ctx.globalAlpha = 0.07 * fade; ctx.fillStyle = b.col;
  ctx.beginPath();
  ctx.moveTo(b.ox + px * w, b.oy + py * w);
  ctx.lineTo(ex + px * w * 0.7, ey + py * w * 0.7);
  ctx.lineTo(ex - px * w * 0.7, ey - py * w * 0.7);
  ctx.lineTo(b.ox - px * w, b.oy - py * w);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.22 * fade; ctx.strokeStyle = b.col; ctx.lineWidth = 1.6;
  for (const sd of [1, -1]) {
    ctx.beginPath();
    ctx.moveTo(b.ox + px * w * sd, b.oy + py * w * sd);
    ctx.lineTo(ex + px * w * 0.7 * sd, ey + py * w * 0.7 * sd);
    ctx.stroke();
  }
  ctx.globalAlpha = 0.18 * fade; ctx.lineWidth = 2.2;
  ctx.setLineDash([10, 46]); ctx.lineDashOffset = t * 40;
  ctx.beginPath(); ctx.moveTo(b.ox, b.oy); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.setLineDash([]);
  drawGlow(b.ox, b.oy, 46, b.col, 0.18 * fade);
  ctx.restore();
}

/* ---- the spool. The aperture winds up, a sighting line is thrown down the
   heading it is about to take, and two brackets close on that line. By the
   time it strikes you have known where it was going for the better part of a
   second — which is the difference between a beam and an ambush. ---- */
function drawRiteCharge(b, t, ca, sa, px, py, ex, ey) {
  const p = clamp(1 - b.arm / b.armMax, 0, 1);
  const jit = p > 0.8 ? (Math.random() - 0.5) * (p - 0.8) * 60 : 0;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.1 + p * 0.3;
  ctx.strokeStyle = b.col; ctx.lineWidth = 1.4 + p * 1.6;
  ctx.setLineDash([16, 30]); ctx.lineDashOffset = -t * 260;
  ctx.beginPath(); ctx.moveTo(b.ox, b.oy); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.setLineDash([]);

  const stub = 120 + p * 460;
  const sg = ctx.createLinearGradient(b.ox, b.oy, b.ox + ca * stub, b.oy + sa * stub);
  sg.addColorStop(0, rgba(b.col, 0.15 + 0.55 * p));
  sg.addColorStop(1, rgba(b.col, 0));
  const sw = RITE_HALF * (0.18 + p * 0.55);
  ctx.globalAlpha = 1;
  ctx.beginPath();
  ctx.moveTo(b.ox + px * sw, b.oy + py * sw);
  ctx.lineTo(b.ox + ca * stub, b.oy + sa * stub);
  ctx.lineTo(b.ox - px * sw, b.oy - py * sw);
  ctx.closePath(); ctx.fillStyle = sg; ctx.fill();

  const at = 230;
  for (const sd of [1, -1]) {
    const off = lerp(RITE_HALF * 3.6, RITE_HALF * 1.15, p) + jit;
    ctx.globalAlpha = 0.25 + p * 0.55;
    ctx.strokeStyle = '#fff7ed'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.ox + ca * (at - 44) + px * off * sd, b.oy + sa * (at - 44) + py * off * sd);
    ctx.lineTo(b.ox + ca * at + px * off * sd, b.oy + sa * at + py * off * sd);
    ctx.lineTo(b.ox + ca * (at + 44) + px * off * sd, b.oy + sa * (at + 44) + py * off * sd);
    ctx.stroke();
  }

  drawGlow(b.ox, b.oy, 40 + p * 90 + jit, b.col, 0.25 + p * 0.45);
  ctx.globalAlpha = 0.3 + p * 0.5;
  ctx.strokeStyle = '#fff7ed'; ctx.lineWidth = 1.6;
  for (let i = 0; i < 3; i++) {
    const rr = lerp(RITE_HALF * 3.4, RITE_HALF * 0.7, clamp(p * 1.25 - i * 0.2, 0, 1));
    ctx.beginPath(); ctx.arc(b.ox, b.oy, rr, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function drawRiteBeam(b, t) {
  const L = riteDrawLen(b, Math.min(riteReach(b), RITE_LEN));
  if (L < 4) return;
  const ca = Math.cos(b.ang), sa = Math.sin(b.ang);
  const px = -sa, py = ca;
  const ex = b.ox + ca * L, ey = b.oy + sa * L;
  const k = clamp(b.on || 0, 0, 1);

  if (b.arm > 0 && !b.going) { drawRiteCharge(b, t, ca, sa, px, py, ex, ey); return; }
  if (b.dead || b.going) drawRiteCold(b, t, ca, sa, px, py, ex, ey, b.going ? k : 1);
  if (k <= 0.02) return;

  const press = (1 + Math.sin(t * 2.4 + b.ox * 0.01) * 0.05) * (b.cut ? 0.9 : 1)
              * (0.4 + 0.6 * k);
  const w0 = riteWidthAt(0, press), w1 = riteWidthAt(L, press);
  const quad = (wa, wb) => {
    ctx.beginPath();
    ctx.moveTo(b.ox + px * wa, b.oy + py * wa);
    ctx.lineTo(ex + px * wb, ey + py * wb);
    ctx.lineTo(ex - px * wb, ey - py * wb);
    ctx.lineTo(b.ox - px * wa, b.oy - py * wa);
    ctx.closePath();
  };

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  const steps = Math.min(14, Math.max(2, Math.round(L / 240)));
  for (let i = 0; i <= steps; i++) {
    const gx = b.ox + ca * (L * i / steps), gy = b.oy + sa * (L * i / steps);
    if (!onScreen(gx, gy, 200)) continue;
    drawGlow(gx, gy, 150 * press, b.col, 0.07 * k);
    drawGlow(gx, gy, 66 * press, '#fff7ed', 0.05 * k);
  }

  ctx.globalAlpha = k;
  const hz = ctx.createLinearGradient(b.ox, b.oy, ex, ey);
  hz.addColorStop(0, rgba(b.col, 0.30));
  hz.addColorStop(0.7, rgba(b.col, 0.16));
  hz.addColorStop(1, rgba(b.col, 0.22));
  quad(w0 * 1.6, w1 * 1.6); ctx.fillStyle = hz; ctx.fill();

  const SH = riteSheets(b.col);
  for (let j = 0; j < SH.length; j++) {
    const d = (j - (SH.length - 1) / 2) / ((SH.length - 1) / 2);
    const churn = Math.sin(t * (2.6 + j * 0.7) + j * 1.9 + b.ang) * 0.16;
    const wa = w0 * (0.92 - Math.abs(d) * 0.5 + churn);
    const wb = w1 * (0.92 - Math.abs(d) * 0.5 + churn);
    const sh = d * 0.22 + churn * 0.3;
    ctx.globalAlpha = (0.3 - Math.abs(d) * 0.12) * k;
    ctx.fillStyle = SH[j];
    ctx.beginPath();
    ctx.moveTo(b.ox + px * (wa + w0 * sh), b.oy + py * (wa + w0 * sh));
    ctx.lineTo(ex + px * (wb + w1 * sh), ey + py * (wb + w1 * sh));
    ctx.lineTo(ex - px * (wb - w1 * sh), ey - py * (wb - w1 * sh));
    ctx.lineTo(b.ox - px * (wa - w0 * sh), b.oy - py * (wa - w0 * sh));
    ctx.closePath(); ctx.fill();
  }

  const bands = Math.min(30, Math.floor(L / RITE_BAND) + 1);
  const roll = (t * 0.55) % 1;
  for (let i = 0; i < bands; i++) {
    const dd = (i + roll) * RITE_BAND;
    if (dd > L) continue;
    const bw = riteWidthAt(dd, press) * 1.02;
    const cxp = b.ox + ca * dd, cyp = b.oy + sa * dd;
    ctx.globalAlpha = (0.14 + (1 - dd / Math.max(1, L)) * 0.2) * k;
    ctx.strokeStyle = i % 4 === 0 ? '#fff7ed' : b.col;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(cxp + px * bw, cyp + py * bw);
    ctx.lineTo(cxp + ca * 26, cyp + sa * 26);
    ctx.lineTo(cxp - px * bw, cyp - py * bw);
    ctx.stroke();
  }

  const eSteps = Math.min(30, Math.max(6, Math.round(L / 110)));
  for (const sd of [1, -1]) {
    ctx.globalAlpha = 0.42 * k; ctx.strokeStyle = '#fff7ed'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let i = 0; i <= eSteps; i++) {
      const dd = L * i / eSteps;
      const wv = riteWidthAt(dd, press)
        + Math.sin(dd * 0.013 - t * 9) * 4.5
        + Math.sin(dd * 0.029 - t * 17 + sd) * 2.4;
      const x = b.ox + ca * dd + px * wv * sd, y = b.oy + sa * dd + py * wv * sd;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }

  ctx.globalAlpha = 0.95 * k;
  const cg = ctx.createLinearGradient(b.ox, b.oy, ex, ey);
  cg.addColorStop(0, 'rgba(255,255,255,0.95)');
  cg.addColorStop(1, 'rgba(255,247,237,0.78)');
  quad(w0 * 0.2, w1 * 0.17); ctx.fillStyle = cg; ctx.fill();

  drawGlow(b.ox, b.oy, 132 * press, b.col, 0.45 * k);
  drawGlow(b.ox, b.oy, 62 * press, '#fff7ed', 0.45 * k);
  if (b.flash > 0.01) {
    drawGlow(b.ox, b.oy, 90 + 200 * b.flash, '#fff7ed', 0.5 * b.flash);
    drawGlow(b.ox, b.oy, 60 + 320 * b.flash, b.col, 0.4 * b.flash);
  }
  ctx.globalAlpha = 0.85 * k; ctx.fillStyle = '#fff7ed';
  ctx.beginPath(); ctx.arc(b.ox, b.oy, w0 * 0.34, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawRiteCut(b, t) {
  const x = b.cut.x, y = b.cut.y;
  const Rr = 24 + Math.sin(t * 9 + x * 0.01) * 3;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(x, y, Rr * 3.6, b.col, 0.45);
  drawGlow(x, y, Rr * 1.6, '#fff7ed', 0.6);
  ctx.globalAlpha = 0.95; ctx.fillStyle = '#fff7ed';
  ctx.beginPath(); ctx.arc(x, y, Rr * 0.42, 0, TAU); ctx.fill();
  ctx.translate(x, y);
  ctx.rotate(t * 1.7);
  ctx.globalAlpha = 0.8; ctx.strokeStyle = '#fdba74'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= 14; i++) {
    const a0 = i / 14 * TAU, rr = Rr * (i % 2 ? 0.72 : 1.08);
    i ? ctx.lineTo(Math.cos(a0) * rr, Math.sin(a0) * rr)
      : ctx.moveTo(Math.cos(a0) * rr, Math.sin(a0) * rr);
  }
  ctx.closePath(); ctx.stroke();
  ctx.rotate(-t * 3.1);
  ctx.globalAlpha = 0.35; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, 0, Rr * 1.6, 0, TAU); ctx.stroke();
  ctx.restore();
}

function drawRiteBeams(t) {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (const b of R.out) drawRiteBeam(b, t);

  /* ---- the seam. He is holding nothing, and the room can see him gather:
     rings closing on the chest, and the next set of apertures about to be
     somebody's problem. This is where a sequence change stops being a cut. */
  if (R.warm > 0) {
    const o = riteOrigin('torso');
    const p = clamp(1 - R.warm / RITE_HAND, 0, 1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(o.x, o.y, 70 + 120 * p, RAINBOW[(R.i + 2) % RAINBOW.length], 0.16 + 0.34 * p);
    drawGlow(o.x, o.y, 40 + 40 * p, '#fff7ed', 0.1 + 0.3 * p);
    ctx.strokeStyle = '#fff7ed'; ctx.lineWidth = 1.6;
    for (let i = 0; i < 4; i++) {
      const q = clamp(p * 1.3 - i * 0.16, 0, 1);
      if (q <= 0) continue;
      ctx.globalAlpha = 0.1 + q * 0.4;
      ctx.beginPath(); ctx.arc(o.x, o.y, lerp(430, 52, q), 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }

  for (const b of R.beams) if (b.dead) drawRiteBeam(b, t);
  for (const b of R.beams) if (!b.dead) drawRiteBeam(b, t);

  if (R.seq === 'fan' && R.beams.length > 1) {
    const s = R.beams[1];
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(s.ox, s.oy, s.dead ? 46 : 104, RAINBOW[2], s.dead ? 0.12 : 0.36);
    ctx.globalAlpha = s.dead ? 0.2 : 0.7;
    ctx.strokeStyle = '#fff7ed'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(s.ox, s.oy, 22 + Math.sin(t * 5) * 2, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  for (const b of R.beams) if (!b.dead && b.cut) drawRiteCut(b, t);
  ctx.restore();
}

/* ================================ the hull ===============================
   Enough of the pilot to make the cut real: it goes where the mouse is, the
   lance points at his chest, and holding the button is holding the crossing.
========================================================================= */
const ship = { x: 0, y: 380, ax: 0, ay: 380, ang: -Math.PI / 2,
               lx: 0, ly: 0, firing: true, burn: 0 };
let cutHeld = 0;
const mouse = { x: 0, y: 380, down: false };

function shipTick(dt) {
  ship.x += (mouse.x - ship.x) * Math.min(1, dt * 7);
  ship.y += (mouse.y - ship.y) * Math.min(1, dt * 7);
  ship.x = clamp(ship.x, -ARENA.w / 2 + 40, ARENA.w / 2 - 40);
  ship.y = clamp(ship.y, -ARENA.h / 2 + 40, ARENA.h / 2 - 40);
  const o = riteOrigin('torso');
  ship.ang = Math.atan2(o.y - ship.y, o.x - ship.x);
  const reach = 1500;
  ship.lx = ship.x + Math.cos(ship.ang) * reach;
  ship.ly = ship.y + Math.sin(ship.ang) * reach;
  ship.burn = Math.max(0, ship.burn - dt);
  cutHeld = Math.max(0, cutHeld - dt);
}

function drawShip(t) {
  // the lance: the old one, bloom-heavy and soft-edged
  if (ship.firing) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const [wl, al, col] of [[40, 0.1, '#7f1d1d'], [22, 0.22, '#f87171'], [9, 0.5, '#fca5a5']]) {
      ctx.globalAlpha = al; ctx.strokeStyle = col; ctx.lineWidth = wl;
      ctx.beginPath(); ctx.moveTo(ship.x, ship.y); ctx.lineTo(ship.lx, ship.ly); ctx.stroke();
    }
    ctx.globalAlpha = 0.8; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(ship.x, ship.y); ctx.lineTo(ship.lx, ship.ly); ctx.stroke();
    // the window the crossing has to be made inside
    ctx.globalAlpha = 0.16; ctx.strokeStyle = '#fb923c'; ctx.lineWidth = 1.4;
    ctx.setLineDash([8, 12]);
    ctx.beginPath(); ctx.arc(ship.x, ship.y, CUT_RANGE, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    drawGlow(ship.x, ship.y, 60, '#f87171', 0.35);
    ctx.restore();
  }
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.ang);
  const S = 2.0;
  const p = [[22,0],[13,2.6],[9,7],[2,13.5],[-7,12],[-5,4.6],[-12,3.2],[-9,0],
             [-12,-3.2],[-5,-4.6],[-7,-12],[2,-13.5],[9,-7],[13,-2.6]];
  ctx.beginPath();
  p.forEach((q, i) => i ? ctx.lineTo(q[0] * S, q[1] * S) : ctx.moveTo(q[0] * S, q[1] * S));
  ctx.closePath();
  ctx.fillStyle = ship.burn > 0 ? '#7f1d1d' : '#1c1917';
  ctx.fill();
  ctx.strokeStyle = ship.burn > 0 ? '#fca5a5' : '#fb923c'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

/* ================================== HUD ================================== */

               W / 2, H - 28);
  ctx.letterSpacing = '0px';
  ctx.textAlign = 'left';

  if (showData) {
    ctx.font = "400 10px 'JetBrains Mono', ui-monospace, monospace";

      'warm             ' + Math.max(0, R.warm).toFixed(2),
      'beams            ' + R.beams.length + '   letting go: ' + R.out.length,
      'live / next      ' + R.live + ' / ' + R.next,
      'cut              ' + (R.beams.some(b => b.cut) ? 'held' : '—')
    ];
