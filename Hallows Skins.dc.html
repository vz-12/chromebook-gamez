<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#05060a}button:hover{filter:brightness(1.25)}</style>
</helmet>
<div style="position:fixed;inset:0;background:#05060a"></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
/* ALL HALLOWS · THE WARDROBE — the prize skins' bench.
   Loads hl-skin-base.js, which shims the game and loads hl-kit.js,
   hl-wardrobe.js and the art (hl-art.js, or ?art=<file>) in that order, then
   builds the bench: the big stage, the four prizes at menu size, every event,
   pause and scrub, lit room, debug, and which hooks the art has drawn.
   Same code as the build: see HALLOWS-SKINS-GUIDE.txt. */
class Component extends DCLogic {
  componentDidMount() {
    if (window.__hlBenchLoaded) return;
    window.__hlBenchLoaded = true;
    const s = document.createElement('script');
    s.src = './hl-skin-base.js?t=' + Date.now();
    s.onload = () => window.hlBenchStart();
    document.body.appendChild(s);
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
